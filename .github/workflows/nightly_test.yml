name: NightlyTest

on: # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      cache_only:
        description: 'Only refresh the S3 build cache (skip image build/push and all tests)'
        required: false
        default: false
        type: boolean
  # Disabled nightly test schedule
  # schedule:
    # *     *     *     *     *
    # ┬     ┬     ┬     ┬     ┬
    # │     │     │     │     │
    # │     │     │     │     │
    # │     │     │     │     └───── day of the week (0 - 6) (0 is Sunday, or use names)
    # │     │     │     └────────── month (1 - 12)
    # │     │     └─────────────── day of the month (1 - 31)
    # │     └──────────────────── hour (0 - 23)
    # └───────────────────────── minute (0 - 59)
    # build at 00:30(UTC) on every day
#    - cron:  '00 23 * * 0,1,2,3,4,6'
#    - cron:  '00 23 * * 5'

jobs:
  prepare_sanitizer_build:
    runs-on: ubuntu-latest
    if: github.event.schedule == '00 23 * * 5' 
    outputs:
      command: |
            cd $GITHUB_WORKSPACE

            git config user.name "proton-robot"
            git config user.email "proton_robot@timeplus.io"

            mkdir $GITHUB_WORKSPACE/ccache
            echo "max_size = 100.0G" > $GITHUB_WORKSPACE/ccache/ccache.conf

            # python udf arm nonsupport: https://github.com/timeplus-io/proton-enterprise/issues/6944
            enable_python=""
            # Free-threaded (cp314t) embedded CPython is amd64-only here; arm
            # disables python-udf entirely, so it gets no FT runtime either.
            free_threaded="--enable-python-free-threaded"
            ft_build_arg="--build-arg ENABLE_PYTHON_FREE_THREADED=1"
            if [ "$ARCH" == "arm" ]; then
              enable_python="--disable-python-udf"
              free_threaded=""
              ft_build_arg=""
            fi

            ./docker/packager/packager --package-type binary --docker-image-version clang-21 ${SANITIZER:+--sanitizer} $SANITIZER --proton-build $enable_python $free_threaded --enable-proton-local --cache ccache --ccache_dir $GITHUB_WORKSPACE/ccache --output-dir $GITHUB_WORKSPACE/output

            if [ ! -f "$GITHUB_WORKSPACE/output/proton" ]; then
              echo "Compiling proton Failed"
              exit 127
            fi

            # Don't need to upload ccache to S3 at the moment
            tar -zcf ./cache${SANITIZER:+_}$SANITIZER${ARCH:+_}$ARCH.tar.gz -C $GITHUB_WORKSPACE/ccache .
            aws s3 cp --no-progress ./cache${SANITIZER:+_}$SANITIZER${ARCH:+_}$ARCH.tar.gz s3://tp-internal2/proton-oss/

            # clean ccache and build footprint
            rm -rf $GITHUB_WORKSPACE/ccache
            rm ./cache${SANITIZER:+_}$SANITIZER${ARCH:+_}$ARCH.tar.gz
            rm -rf build_docker

            # build unit test docker image
            cp $GITHUB_WORKSPACE/output/unit_tests_dbms $GITHUB_WORKSPACE/docker/test/proton_unit_test/
            cd $GITHUB_WORKSPACE/docker/test/proton_unit_test/
            docker build . -t timeplus/proton-unit-test:testing-$SANITIZER-$ARCH-$GITHUB_SHA
            docker push timeplus/proton-unit-test:testing-$SANITIZER-$ARCH-$GITHUB_SHA

            docker run --name static-server -p 8080:80 -v $GITHUB_WORKSPACE/output:/usr/share/nginx/html:ro -d nginx
            cd $GITHUB_WORKSPACE/docker/server

            # prepare files to be copied to the image
            mkdir -p resources/protos/google/protobuf
            cp -r $GITHUB_WORKSPACE/contrib/google-protobuf/src/google/protobuf/*.proto ./resources/protos/google/protobuf/
            rm -rf resources/protos/google/protobuf/unittest_*

            docker build . --network host $ft_build_arg --build-arg single_binary_location_url=http://localhost:8080/proton -t timeplus/proton_testing:testing-$SANITIZER-$ARCH-$GITHUB_SHA
            docker push timeplus/proton_testing:testing-$SANITIZER-$ARCH-$GITHUB_SHA
    steps:
      - name: display command
        run: |
          echo 'command: ${{ steps.set_command.outputs.command }}'
  prepare_sanitizer_unit_test:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.cache_only }}
    outputs:
      command: |
            cd $GITHUB_WORKSPACE/tests/proton_ci
            export PROTON_VERSION=testing-$SANITIZER-$ARCH-$GITHUB_SHA

            # make virtualenv
            ln -s /usr/bin/python3 /usr/bin/python
            apt-get update
            systemctl stop unattended-upgrades
            apt install python3-venv jq -y
            python -m venv env
            source env/bin/activate

            pip install -r requirements.txt
            python unit_tests_check.py
    steps:
      - name: display command
        run: |
          echo 'command: ${{ steps.set_command.outputs.command }}'
  prepare_sanitizer_smoke_test:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.cache_only }}
    outputs:
      command: |
        # run smoke test
        export PROTON_VERSION=testing-$SANITIZER-$ARCH-$GITHUB_SHA
        export PROTON_REPO=timeplus/proton_testing

        cd $GITHUB_WORKSPACE/docker/test/smoke/
        docker build . -f Dockerfile --build-arg FROM_TAG=$PROTON_VERSION --build-arg FROM_REPO=$PROTON_REPO -t timeplus/proton-smoke-test:$PROTON_VERSION

        cd $GITHUB_WORKSPACE/tests/cluster/
        sudo curl -L "https://github.com/docker/compose/releases/download/v2.5.0/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
        sudo chmod +x /usr/local/bin/docker-compose

        # set aggregation mode based on weekday 
        DAY_OF_WEEK=$(date +%u)
        if [[ "$DAY_OF_WEEK" == "2" || "$DAY_OF_WEEK" == "4" || "$DAY_OF_WEEK" == "6" ]]; then
          bash run.sh hybrid
        else
          bash run.sh
        fi
    steps:
      - name: display command
        run: |
          echo 'command: ${{ steps.set_command.outputs.command }}'
  prepare_sanitizer_stateless_test:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.cache_only }}
    outputs:
      command: |
            cd $GITHUB_WORKSPACE/tests/proton_ci
            mkdir $GITHUB_WORKSPACE/output

            # make virtualenv
            ln -s /usr/bin/python3 /usr/bin/python
            apt-get update
            systemctl stop unattended-upgrades
            apt install python3-venv jq -y
            python -m venv env
            source env/bin/activate

            pip install -r requirements.txt
            export PROTON_VERSION=testing-$SANITIZER-$ARCH-$GITHUB_SHA
            export PROTON_REPO=timeplus/proton_testing
            chown -R 101 $GITHUB_WORKSPACE
            python functional_tests_check.py stateless
    steps:
      - name: display command
        run: |
          echo 'command: ${{ steps.set_command.outputs.command }}'
  prepare_sanitizer_stateful_test:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.cache_only }}
    outputs:
      command: |
            cd $GITHUB_WORKSPACE/tests/proton_ci
            mkdir $GITHUB_WORKSPACE/output

            # make virtualenv
            ln -s /usr/bin/python3 /usr/bin/python
            apt-get update
            systemctl stop unattended-upgrades
            apt install python3-venv jq -y
            python -m venv env
            source env/bin/activate

            pip install -r requirements.txt
            export PROTON_VERSION=testing-$SANITIZER-$ARCH-$GITHUB_SHA
            export PROTON_REPO=timeplus/proton_testing
            chown -R 101 $GITHUB_WORKSPACE
            python functional_tests_check.py stateful
    steps:
      - name: display command
        run: |
          echo 'command: ${{ steps.set_command.outputs.command }}'
  prepare_compatibility_test:
    runs-on: ubuntu-latest
    if: false # Disabled compatibility tests
    outputs:
      versions: ${{ steps.get-versions.outputs.versions }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5.0.1
        with:
          token: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
          submodules: false
      - name: Get Last version
        id: get-versions
        run: |
          export PROTON_VERSION=testing-$SANITIZER-$ARCH-$GITHUB_SHA
          export PROTON_REPO=timeplus/proton_testing

          cd $GITHUB_WORKSPACE/tests/proton_ci
          pip install -r requirements.txt

          # get versions
          python run_compatibility_test.py
          TEST_VERSIONS=$(cat baseline_versions.txt)
          echo "versions=$TEST_VERSIONS" | tee -a "$GITHUB_OUTPUT"
        env:
          GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
  prepare_sanitizer_performance_test:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.cache_only }}
    outputs:
      command: |
        export PROTON_VERSION=testing-$SANITIZER-$ARCH-$GITHUB_SHA
        export PROTON_REPO=timeplus/proton_testing

        # pull docker image
        cd $GITHUB_WORKSPACE/docker/test/smoke/
        docker build . -f Dockerfile --build-arg FROM_TAG=$PROTON_VERSION --build-arg FROM_REPO=$PROTON_REPO -t timeplus/proton-smoke-test:$PROTON_VERSION

        # download docker-compose
        sudo curl -L "https://github.com/docker/compose/releases/download/v2.5.0/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
        sudo chmod +x /usr/local/bin/docker-compose

        # run performance test
        echo "run performance test"
        cd $GITHUB_WORKSPACE/tests/cluster/
        bash perf.sh
    steps:
      - name: display command
        run: |
          echo 'command: ${{ steps.set_command.outputs.command }}'
  prepare_release_build:
    runs-on: ubuntu-latest
    if: github.event.schedule == '00 23 * * 5'
    outputs:
      command: |
            cd $GITHUB_WORKSPACE

            git config user.name "proton-robot"
            git config user.email "proton_robot@timeplus.io"

            mkdir $GITHUB_WORKSPACE/ccache
            echo "max_size = 100.0G" > $GITHUB_WORKSPACE/ccache/ccache.conf

            # python udf arm nonsupport: https://github.com/timeplus-io/proton-enterprise/issues/6944
            enable_python=""
            # Free-threaded (cp314t) embedded CPython is amd64-only here; arm
            # disables python-udf entirely, so it gets no FT runtime either.
            free_threaded="--enable-python-free-threaded"
            ft_build_arg="--build-arg ENABLE_PYTHON_FREE_THREADED=1"
            if [ "$ARCH" == "arm" ]; then
              enable_python="--disable-python-udf"
              free_threaded=""
              ft_build_arg=""
            fi

            ./docker/packager/packager --package-type binary --docker-image-version clang-21 --build-type release --proton-build $enable_python $free_threaded --enable-proton-local --cache ccache --ccache_dir $GITHUB_WORKSPACE/ccache --output-dir $GITHUB_WORKSPACE/output

            if [ ! -f "$GITHUB_WORKSPACE/output/proton" ]; then
              echo "Compiling proton Failed"
              exit 127
            fi

            # Don't need to upload ccache to S3 at the moment
            tar -zcf ./cache${ARCH:+_}$ARCH.tar.gz -C $GITHUB_WORKSPACE/ccache .
            aws s3 cp --no-progress ./cache${ARCH:+_}$ARCH.tar.gz s3://tp-internal2/proton-oss/

            # clean ccache and build footprint
            rm -rf $GITHUB_WORKSPACE/ccache
            rm ./cache${ARCH:+_}$ARCH.tar.gz
            rm -rf build_docker

            docker run --name static-server -p 8080:80 -v $GITHUB_WORKSPACE/output:/usr/share/nginx/html:ro -d nginx
            cd $GITHUB_WORKSPACE/docker/server

            # prepare files to be copied to the image
            mkdir -p resources/protos/google/protobuf
            cp -r $GITHUB_WORKSPACE/contrib/google-protobuf/src/google/protobuf/*.proto ./resources/protos/google/protobuf/
            rm -rf resources/protos/google/protobuf/unittest_*

            docker build . --network host $ft_build_arg --build-arg single_binary_location_url=http://localhost:8080/proton -t timeplus/proton_testing:testing-$ARCH-$GITHUB_SHA
            docker push timeplus/proton_testing:testing-$ARCH-$GITHUB_SHA

            # push release image weekly for testing
            date=$(date +'%Y%m%d')
            docker tag timeplus/proton_testing:testing-$ARCH-$GITHUB_SHA timeplus/proton:develop-$ARCH-$date
            docker push timeplus/proton:develop-$ARCH-$date
    steps:
      - name: display command
        run: |
          echo 'command: ${{ steps.set_command.outputs.command }}'
  prepare_release_smoke_test:
    runs-on: ubuntu-latest
    if: github.event.schedule == '00 23 * * 5'
    outputs:
      command: |
        # run smoke test
        export PROTON_VERSION=testing-$ARCH-$GITHUB_SHA
        export PROTON_REPO=timeplus/proton_testing

        cd $GITHUB_WORKSPACE/docker/test/smoke/
        docker build . -f Dockerfile --build-arg FROM_TAG=$PROTON_VERSION --build-arg FROM_REPO=$PROTON_REPO -t timeplus/proton-smoke-test:$PROTON_VERSION

        cd $GITHUB_WORKSPACE/tests/cluster/
        sudo curl -L "https://github.com/docker/compose/releases/download/v2.5.0/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
        sudo chmod +x /usr/local/bin/docker-compose
        bash run.sh
    steps:
      - name: display command
        run: |
          echo 'command: ${{ steps.set_command.outputs.command }}'
  prepare_release_stateless_test:
    runs-on: ubuntu-latest
    if: github.event.schedule == '00 23 * * 5'
    outputs:
      command: |
            cd $GITHUB_WORKSPACE/tests/proton_ci
            mkdir $GITHUB_WORKSPACE/output

            # make virtualenv
            ln -s /usr/bin/python3 /usr/bin/python
            apt-get update
            systemctl stop unattended-upgrades
            apt install python3-venv jq -y
            python -m venv env
            source env/bin/activate

            pip install -r requirements.txt
            export PROTON_VERSION=testing-$ARCH-$GITHUB_SHA
            export PROTON_REPO=timeplus/proton_testing
            chown -R 101 $GITHUB_WORKSPACE
            python functional_tests_check.py stateless
    steps:
      - name: display command
        run: |
          echo 'command: ${{ steps.set_command.outputs.command }}'
  prepare_release_stateful_test:
    runs-on: ubuntu-latest
    if: github.event.schedule == '00 23 * * 5'
    outputs:
      command: |
            cd $GITHUB_WORKSPACE/tests/proton_ci
            mkdir $GITHUB_WORKSPACE/output

            # make virtualenv
            ln -s /usr/bin/python3 /usr/bin/python
            apt-get update
            systemctl stop unattended-upgrades
            apt install python3-venv jq -y
            python -m venv env
            source env/bin/activate

            pip install -r requirements.txt
            export PROTON_VERSION=testing-$ARCH-$GITHUB_SHA
            export PROTON_REPO=timeplus/proton_testing
            chown -R 101 $GITHUB_WORKSPACE
            python functional_tests_check.py stateful
    steps:
      - name: display command
        run: |
          echo 'command: ${{ steps.set_command.outputs.command }}'
  prepare_release_compatibility_test:
    runs-on: ubuntu-latest
    if: false # Disabled compatibility tests
    outputs:
      command: |
        export PROTON_VERSION=testing-$ARCH-$GITHUB_SHA
        export PROTON_REPO=timeplus/proton_testing

        cd $GITHUB_WORKSPACE/tests/proton_ci
        pip install -r requirements.txt

        # get versions
        python run_compatibility_test.py
        TEST_VERSIONS=$(cat baseline_versions.txt)
        echo "versions=$TEST_VERSIONS" | tee -a "$GITHUB_OUTPUT"
    steps:
      - name: display command
        run: |
          echo 'command: ${{ steps.set_command.outputs.command }}'
  prepare_release_performance_test:
    runs-on: ubuntu-latest
    if: github.event.schedule == '00 23 * * 5'
    outputs:
      command: |
        export PROTON_VERSION=testing-$ARCH-$GITHUB_SHA
        export PROTON_REPO=timeplus/proton_testing

        # pull docker image
        cd $GITHUB_WORKSPACE/docker/test/smoke/
        docker build . -f Dockerfile --build-arg FROM_TAG=$PROTON_VERSION --build-arg FROM_REPO=$PROTON_REPO -t timeplus/proton-smoke-test:$PROTON_VERSION

        # download docker-compose
        sudo curl -L "https://github.com/docker/compose/releases/download/v2.5.0/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
        sudo chmod +x /usr/local/bin/docker-compose

        # run performance test
        echo "run performance test"
        cd $GITHUB_WORKSPACE/tests/cluster/
        bash perf.sh
    steps:
      - name: display command
        run: |
          echo 'command: ${{ steps.set_command.outputs.command }}'
  prepare_address_build:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.cache_only }}
    outputs:
      command: |
            cd $GITHUB_WORKSPACE

            git config user.name "proton-robot"
            git config user.email "proton_robot@timeplus.io"

            mkdir $GITHUB_WORKSPACE/ccache
            echo "max_size = 100.0G" > $GITHUB_WORKSPACE/ccache/ccache.conf

            # python udf arm nonsupport: https://github.com/timeplus-io/proton-enterprise/issues/6944
            enable_python=""
            # Free-threaded (cp314t) embedded CPython is amd64-only here; arm
            # disables python-udf entirely, so it gets no FT runtime either.
            free_threaded="--enable-python-free-threaded"
            ft_build_arg="--build-arg ENABLE_PYTHON_FREE_THREADED=1"
            if [ "$ARCH" == "arm" ]; then
              enable_python="--disable-python-udf"
              free_threaded=""
              ft_build_arg=""
            fi

            ./docker/packager/packager --package-type binary --docker-image-version clang-21 ${SANITIZER:+--sanitizer} $SANITIZER --proton-build $enable_python $free_threaded --enable-proton-local --cache ccache --ccache_dir $GITHUB_WORKSPACE/ccache --output-dir $GITHUB_WORKSPACE/output

            if [ ! -f "$GITHUB_WORKSPACE/output/proton" ]; then
              echo "Compiling proton Failed"
              exit 127
            fi

            tar -zcf ./cache${SANITIZER:+_}$SANITIZER${ARCH:+_}$ARCH.tar.gz -C $GITHUB_WORKSPACE/ccache .
            aws s3 cp --no-progress ./cache${SANITIZER:+_}$SANITIZER${ARCH:+_}$ARCH.tar.gz s3://tp-internal2/proton-oss/

            # clean ccache and build footprint
            rm -rf $GITHUB_WORKSPACE/ccache
            rm ./cache${SANITIZER:+_}$SANITIZER${ARCH:+_}$ARCH.tar.gz
            rm -rf build_docker

            # build unit test docker image
            cp $GITHUB_WORKSPACE/output/unit_tests_dbms $GITHUB_WORKSPACE/docker/test/proton_unit_test/
            cd $GITHUB_WORKSPACE/docker/test/proton_unit_test/
            docker build . -t timeplus/proton-unit-test:testing-$SANITIZER-$ARCH-$GITHUB_SHA
            docker push timeplus/proton-unit-test:testing-$SANITIZER-$ARCH-$GITHUB_SHA

            docker run --name static-server -p 8080:80 -v $GITHUB_WORKSPACE/output:/usr/share/nginx/html:ro -d nginx
            cd $GITHUB_WORKSPACE/docker/server

            # prepare files to be copied to the image
            mkdir -p resources/protos/google/protobuf
            cp -r $GITHUB_WORKSPACE/contrib/google-protobuf/src/google/protobuf/*.proto ./resources/protos/google/protobuf/
            rm -rf resources/protos/google/protobuf/unittest_*

            docker build . --network host $ft_build_arg --build-arg single_binary_location_url=http://localhost:8080/proton -t timeplus/proton_testing:testing-$SANITIZER-$ARCH-$GITHUB_SHA
            docker push timeplus/proton_testing:testing-$SANITIZER-$ARCH-$GITHUB_SHA
  
            # push address sanitizer image daily for testing
            date=$(date +'%Y%m%d')
            docker tag timeplus/proton_testing:testing-$SANITIZER-$ARCH-$GITHUB_SHA timeplus/proton:develop-$SANITIZER-$ARCH-$date
            docker push timeplus/proton:develop-$SANITIZER-$ARCH-$date
    steps:
      - name: display command
        run: |
          echo 'command: ${{ steps.set_command.outputs.command }}'
  build_address_x64:
    needs: prepare_address_build
    uses: timeplus-io/proton/.github/workflows/run_command.yml@develop
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.cache_only }}
    with:
      ec2-instance-type: ${{ vars.X64_INSTANCE_TYPE }}
      ec2-image-id: ${{ vars.X64_AMI }}
      ec2-volume-size: ${{ vars.VOLUME_SIZE }}
      submodules: 'true'
      sanitizer: "address"
      arch: ${{ vars.X64_ARCH }}
      tag: 'sanitizer'
      upjob: build_address_x64
      command: |
        ${{ needs.prepare_address_build.outputs.command }}
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET_WEST_2 }}
      GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      TIMEPLUS_ADDRESS: ${{ secrets.TIMEPLUS_ADDRESS }}
      TIMEPLUS_API_KEY: ${{ secrets.TIMEPLUS_API_KEY }}
      TIMEPLUS_WORKSPACE: ${{ secrets.TIMEPLUS_WORKSPACE }}
  update_cache_address_x64:
    uses: ./.github/workflows/run_command.yml
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.cache_only }}
    with:
      ec2-instance-type: ${{ vars.X64_INSTANCE_TYPE }}
      ec2-image-id: ${{ vars.X64_AMI }}
      ec2-volume-size: ${{ vars.VOLUME_SIZE }}
      submodules: 'true'
      sanitizer: "address"
      arch: ${{ vars.X64_ARCH }}
      tag: 'sanitizer'
      upjob: update_cache_address_x64
      command: |
        set -euo pipefail
        cd "$GITHUB_WORKSPACE"

        git config user.name "proton-robot"
        git config user.email "proton_robot@timeplus.io"

        CACHE_TARBALL="cache${SANITIZER:+_}$SANITIZER${ARCH:+_}$ARCH.tar.gz"
        CACHE_S3_URI="s3://tp-internal2/proton-oss/$CACHE_TARBALL"

        mkdir -p "$GITHUB_WORKSPACE/ccache"
        echo "max_size = 100.0G" > "$GITHUB_WORKSPACE/ccache/ccache.conf"

        if aws s3 ls "$CACHE_S3_URI" >/dev/null 2>&1; then
          aws s3 cp --no-progress "$CACHE_S3_URI" "$CACHE_TARBALL"
          tar -zxf "$CACHE_TARBALL" -C "$GITHUB_WORKSPACE/ccache"
          rm -f "$CACHE_TARBALL"
        else
          echo "No existing cache found at $CACHE_S3_URI; starting from empty ccache."
        fi

        ./docker/packager/packager \
          --package-type binary \
          --docker-image-version clang-21 \
          --sanitizer "$SANITIZER" \
          --proton-build \
          --enable-python-free-threaded \
          --enable-proton-local \
          --cache ccache \
          --ccache_dir "$GITHUB_WORKSPACE/ccache" \
          --output-dir "$GITHUB_WORKSPACE/output"

        if [ ! -f "$GITHUB_WORKSPACE/output/proton" ]; then
          echo "Compiling proton failed (missing output/proton)"
          exit 127
        fi

        tar -zcf "$CACHE_TARBALL" -C "$GITHUB_WORKSPACE/ccache" .
        aws s3 cp --no-progress "$CACHE_TARBALL" "s3://tp-internal2/proton-oss/"

        rm -rf "$GITHUB_WORKSPACE/ccache"
        rm -rf "$GITHUB_WORKSPACE/output"
        rm -rf "$GITHUB_WORKSPACE/build_docker"
        rm -f "$CACHE_TARBALL"
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET_WEST_2 }}
      GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
