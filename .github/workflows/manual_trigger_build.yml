name: manual_trigger_build
run-name: |
  manual-build
  [timeplus/proton:${{ github.event.inputs.tag }}]
  [${{ github.event.inputs.OS }}-${{ github.event.inputs.arch }}]
  [${{ github.event.inputs.build_type }}]
  [${{ format('python-udf:{0}', inputs.python_udf) }}]

on: # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: false
        default: 'release'
        type: choice
        options:
        - release
        - debug
        - relwithdebinfo
        - address
        - thread
        - memory
        - undefined
      arch:
        description: 'Hardware architecture'
        required: true
        default: x64
        type: choice
        options:
        - x64
        - arm

      tag:
        description: 'Docker image tag (required for Linux builds)'     
        required: false
        type: string
        default: 'manual'

      OS:
        description: 'Operation System(linux or macos)'
        required: false
        default: 'linux'
        type: choice
        options:
        - linux
        - macos

      strip_binary:
        description: 'Strip the binary to reduce size'
        required: false
        default: 'false'
        type: choice
        options:
          - true
          - false

      python_udf:
        description: 'Enable Python UDF'
        required: false
        default: 'false'
        type: choice
        options:
          - true
          - false

jobs:
  validate_inputs:
    runs-on: ubuntu-latest
    if: github.event.inputs.OS == 'linux'
    timeout-minutes: 10
    steps:
      - name: Validate tag requirement
        if: ${{ github.event.inputs.tag == '' }}
        run: |
          echo "::error::Tag is required for Linux builds"
          exit 1
      - name: Check tag format
        run: |
          if echo "${{ github.event.inputs.tag }}" | grep -q '[[:space:]]'; then
            echo "::error::Tag cannot contain spaces"
            exit 1
          fi
      - uses: actions/checkout@v5.0.1
      - name: Verify tag not exist
        run: python tests/proton_ci/docker_tag_check.py
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          PROTON_VERSION: ${{ github.event.inputs.tag }}
          PROTON_REPO: timeplus/proton

  prepare_sanitizer:
    needs: validate_inputs
    runs-on: ubuntu-latest
    if: github.event.inputs.OS == 'linux' && (github.event.inputs.build_type != 'release' && github.event.inputs.build_type != 'debug' && github.event.inputs.build_type != 'relwithdebinfo')
    outputs:
      command: |
        cd $GITHUB_WORKSPACE

        # git config
        git config user.name "proton-robot"
        git config user.email "proton_robot@timeplus.io"

        # update build info
        ./release --test --version dev

        # prepare build cache
        aws s3 cp --no-progress s3://timeplus-ci-internal/proton-oss/cache${SANITIZER:+_}$SANITIZER${ARCH:+_}$ARCH.tar.gz .
        mkdir $GITHUB_WORKSPACE/ccache
        tar -zxf ./cache${SANITIZER:+_}$SANITIZER${ARCH:+_}$ARCH.tar.gz -C $GITHUB_WORKSPACE/ccache
        rm cache${SANITIZER:+_}$SANITIZER${ARCH:+_}$ARCH.tar.gz

        enable_python=""
        # Free-threaded (cp314t) embedded CPython tracks python-udf: enabled when
        # python-udf is on, dropped (flag + docker build-arg) when it is off.
        free_threaded="--enable-python-free-threaded"
        ft_build_arg="--build-arg ENABLE_PYTHON_FREE_THREADED=1"
        if [ "${{ github.event.inputs.python_udf }}" == "false" ]; then
          enable_python="--disable-python-udf"
          free_threaded=""
          ft_build_arg=""
        fi

        # compiling
        ./docker/packager/packager --package-type binary --docker-image-version clang-21 --sanitizer $SANITIZER --proton-build $enable_python $free_threaded --enable-proton-local --cache ccache --ccache_dir $GITHUB_WORKSPACE/ccache --output-dir $GITHUB_WORKSPACE/output

        if [ ! -f "$GITHUB_WORKSPACE/output/proton" ]; then
          echo "Compiling proton Failed"
          exit 127
        fi

        if [ "${{ github.event.inputs.strip_binary }}" == "true" ]; then
          echo "Stripping the binary..."
          ls -lh $GITHUB_WORKSPACE/output/proton
          docker run --rm -v $GITHUB_WORKSPACE/output:/work -w /work timeplus/proton-binary-builder:clang-21 /usr/bin/llvm-strip-21 proton
          ls -lh $GITHUB_WORKSPACE/output/proton
        fi

        # clear compiling footprint
        rm -rf $GITHUB_WORKSPACE/ccache
        rm -rf build_docker

        # build unit test docker image
        cp $GITHUB_WORKSPACE/output/unit_tests_dbms $GITHUB_WORKSPACE/docker/test/proton_unit_test/
        cd $GITHUB_WORKSPACE/docker/test/proton_unit_test/
        docker build . -t timeplus/proton-unit-test:$TAG
        docker push timeplus/proton-unit-test:$TAG

        docker run --name static-server -p 8080:80 -v $GITHUB_WORKSPACE/output:/usr/share/nginx/html:ro -d nginx
        cd $GITHUB_WORKSPACE/docker/server

        # prepare files to be copied to the image
        mkdir -p resources/protos/google/protobuf
        cp -r $GITHUB_WORKSPACE/contrib/google-protobuf/src/google/protobuf/*.proto ./resources/protos/google/protobuf/
        rm -rf resources/protos/google/protobuf/unittest_*

        # build docker image
        docker build . --network host $ft_build_arg --build-arg single_binary_location_url=http://localhost:8080/proton -t timeplus/proton:$TAG

        # push docker image
        docker push timeplus/proton:$TAG
        echo "docker pull timeplus/proton:$TAG"
    steps:
      - name: check tag
        run: |
          if echo "${{ github.event.inputs.tag }}" | grep -q '[[:space:]]'; then
            echo "error: tag '${{ github.event.inputs.tag }}' contains space"
            exit 1
          fi
      - name: display command
        run: |
          echo 'command: ${{ steps.set_command.outputs.command }}'
  prepare_release_or_debug:
    runs-on: ubuntu-latest
    needs: validate_inputs
    if: github.event.inputs.OS == 'linux' && (github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'relwithdebinfo')
    outputs:
      command: |
        cd $GITHUB_WORKSPACE

        # git config
        git config user.name "proton-robot"
        git config user.email "proton_robot@timeplus.io"

        # update build info
        ./release --test --version dev

        # prepare build cache
        aws s3 cp --no-progress s3://timeplus-ci-internal/proton-oss/cache${ARCH:+_}$ARCH.tar.gz .
        mkdir $GITHUB_WORKSPACE/ccache
        tar -zxf ./cache${ARCH:+_}$ARCH.tar.gz -C $GITHUB_WORKSPACE/ccache
        rm cache${ARCH:+_}$ARCH.tar.gz

        enable_python=""
        # Free-threaded (cp314t) embedded CPython tracks python-udf: enabled when
        # python-udf is on, dropped (flag + docker build-arg) when it is off.
        free_threaded="--enable-python-free-threaded"
        ft_build_arg="--build-arg ENABLE_PYTHON_FREE_THREADED=1"
        if [ "${{ github.event.inputs.python_udf }}" == "false" ]; then
          enable_python="--disable-python-udf"
          free_threaded=""
          ft_build_arg=""
        fi

        # compiling
        ./docker/packager/packager --package-type binary --docker-image-version clang-21 --build-type ${{ github.event.inputs.build_type }} --proton-build $enable_python $free_threaded --enable-proton-local --cache ccache --ccache_dir $GITHUB_WORKSPACE/ccache --output-dir $GITHUB_WORKSPACE/output

        if [ ! -f "$GITHUB_WORKSPACE/output/proton" ]; then
          echo "Compiling proton Failed"
          exit 127
        fi

        if [ "${{ github.event.inputs.strip_binary }}" == "true" ]; then
          echo "Stripping the binary..."
          ls -lh $GITHUB_WORKSPACE/output/proton
          docker run --rm -v $GITHUB_WORKSPACE/output:/work -w /work timeplus/proton-binary-builder:clang-21 /usr/bin/llvm-strip-21 proton
          ls -lh $GITHUB_WORKSPACE/output/proton
        fi
        
        # release doesn't build unit_tests_dbms
        # clear compiling footprint
        rm -rf $GITHUB_WORKSPACE/ccache
        rm -rf build_docker

        docker run --name static-server -p 8080:80 -v $GITHUB_WORKSPACE/output:/usr/share/nginx/html:ro -d nginx
        cd $GITHUB_WORKSPACE/docker/server

        # prepare files to be copied to the image
        mkdir -p resources/protos/google/protobuf
        cp -r $GITHUB_WORKSPACE/contrib/google-protobuf/src/google/protobuf/*.proto ./resources/protos/google/protobuf/
        rm -rf resources/protos/google/protobuf/unittest_*

        # build docker image
        docker build . --network host $ft_build_arg --build-arg single_binary_location_url=http://localhost:8080/proton -t timeplus/proton:$TAG

        # push docker image
        docker push timeplus/proton:$TAG
        echo "docker pull timeplus/proton:$TAG"
    steps:
      - name: check tag
        run: |
          if echo "${{ github.event.inputs.tag }}" | grep -q '[[:space:]]'; then
            echo "error: tag '${{ github.event.inputs.tag }}' contains space"
            exit 1
          fi
      - name: display command
        run: |
          echo 'command: ${{ steps.set_command.outputs.command }}'
  build_x64:
    needs: prepare_sanitizer
    uses: timeplus-io/proton/.github/workflows/run_command.yml@develop
    if: github.event.inputs.OS == 'linux' && (github.event.inputs.arch == 'x64' && github.event.inputs.build_type != 'release')
    with:
      ec2-instance-type: ${{ vars.X64_INSTANCE_TYPE }}
      ec2-image-id: ${{ vars.X64_AMI }}
      ec2-volume-size: ${{ vars.VOLUME_SIZE }}
      submodules: 'true'
      sanitizer: ${{ github.event.inputs.build_type }}
      arch: ${{ vars.X64_ARCH }}
      tag: ${{ github.event.inputs.tag }}
      upjob: build_x64
      command: |
        ${{ needs.prepare_sanitizer.outputs.command }}
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET_WEST_2 }}
      GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  build_x64_release_or_debug:
    needs: prepare_release_or_debug
    uses: timeplus-io/proton/.github/workflows/run_command.yml@develop
    if: github.event.inputs.OS == 'linux' && (github.event.inputs.arch == 'x64' && (github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'relwithdebinfo'))
    with:
      ec2-instance-type: ${{ vars.X64_INSTANCE_TYPE }}
      ec2-image-id: ${{ vars.X64_AMI }}
      ec2-volume-size: ${{ vars.VOLUME_SIZE }}
      submodules: 'true'
      sanitizer: ""
      arch: ${{ vars.X64_ARCH }}
      tag: ${{ github.event.inputs.tag }}
      upjob: build_x64_release_or_debug
      command: |
        ${{ needs.prepare_release_or_debug.outputs.command }}
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET_WEST_2 }}
      GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  build_arm:
    needs: prepare_sanitizer
    uses: timeplus-io/proton/.github/workflows/run_command.yml@develop
    if: github.event.inputs.OS == 'linux' && (github.event.inputs.arch == 'arm' && github.event.inputs.build_type != 'release')
    with:
      ec2-instance-type: ${{ vars.ARM_INSTANCE_TYPE }}
      ec2-image-id: ${{ vars.ARM_AMI }}
      ec2-volume-size: ${{ vars.VOLUME_SIZE }}
      submodules: 'true'
      sanitizer: ${{ github.event.inputs.build_type }}
      arch: ${{ vars.ARM_ARCH }}
      tag: ${{ github.event.inputs.tag }}
      upjob: build_arm
      command: |
        ${{ needs.prepare_sanitizer.outputs.command }}
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET_WEST_2 }}
      GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  build_arm_release_or_debug:
    needs: prepare_release_or_debug
    uses: timeplus-io/proton/.github/workflows/run_command.yml@develop
    if: github.event.inputs.OS == 'linux' && (github.event.inputs.arch == 'arm' && (github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'relwithdebinfo'))
    with:
      ec2-instance-type: ${{ vars.ARM_INSTANCE_TYPE }}
      ec2-image-id: ${{ vars.ARM_AMI }}
      ec2-volume-size: ${{ vars.VOLUME_SIZE }}
      submodules: 'true'
      sanitizer: ""
      arch: ${{ vars.ARM_ARCH }}
      tag: ${{ github.event.inputs.tag }}
      upjob: build_arm_release_or_debug
      command: |
        ${{ needs.prepare_release_or_debug.outputs.command }}
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET_WEST_2 }}
      GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}


  Build_macOS_X86_64:
    if: github.event.inputs.OS == 'macos' && github.event.inputs.arch == 'x64'
    uses: timeplus-io/proton/.github/workflows/run_command.yml@develop
    with:
      ec2-instance-type: c6i.8xlarge
      # Use the same x86_64 runner AMI as the native Linux build to avoid older Docker/seccomp profiles
      # that can break container builds (e.g. `ninja: fatal: posix_spawn: Operation not permitted`).
      ec2-image-id: ${{ vars.X64_AMI }}
      submodules: 'true'
      run_mode: 'start'
      s3_upload: true
      s3_output_path: 'proton/cross-compile/macOS-x86'
      command: |
        cd $GITHUB_WORKSPACE
      
        # git config
        git config user.name "proton-robot"
        git config user.email "proton_robot@timeplus.io"

        # update build info
        ./release --test --version dev

        mkdir -p $GITHUB_WORKSPACE/ccache    
        # Download pre-built v8 binary for cross-compilation
        aws s3 cp --no-progress s3://timeplus-ci-internal/proton-oss/cross-compile-prebuilt-binary/138/v8-cmake-x64.tar.gz $GITHUB_WORKSPACE/contrib/v8-cmake/
        tar -zxf $GITHUB_WORKSPACE/contrib/v8-cmake/v8-cmake-x64.tar.gz -C $GITHUB_WORKSPACE/contrib/v8-cmake/
        rm $GITHUB_WORKSPACE/contrib/v8-cmake/v8-cmake-x64.tar.gz
        chmod a+x $GITHUB_WORKSPACE/contrib/v8-cmake/bytecode_builtins_list_generator
        chmod a+x $GITHUB_WORKSPACE/contrib/v8-cmake/mksnapshot
        chmod a+x $GITHUB_WORKSPACE/contrib/v8-cmake/torque

        # compiling
        # NOTE: some older Docker/seccomp profiles block `clone3`, which breaks glibc `posix_spawn`
        # inside Ubuntu 22.04-based builder images (observed as: `ninja: fatal: posix_spawn: Operation not permitted`).
        # Keep this scoped to the darwin cross-compile builder container.
        export PACKAGER_DOCKER_RUN_ARGS="--security-opt seccomp=unconfined"
        ./docker/packager/packager --package-type binary --docker-image-version clang-21 --build-type release --proton-build --disable-python-udf --cache ccache --ccache_dir $GITHUB_WORKSPACE/ccache --output-dir $GITHUB_WORKSPACE/output --compiler clang-21-darwin

        if [ ! -f "$GITHUB_WORKSPACE/output/proton" ]; then
          echo "Compiling proton Failed"
          exit 127
        fi

        # get proton tag and rename binary
        COMMIT_HASH=$(git rev-parse --short HEAD)
        PROTON_BINARY=proton-${COMMIT_HASH}-Darwin-x86_64

        # Only strip if strip_binary is true
        if [ "${{ github.event.inputs.strip_binary }}" == "true" ]; then
          echo "Stripping the binary..."
          ls -lh $GITHUB_WORKSPACE/output/proton
          docker run --rm -v $GITHUB_WORKSPACE/output:/work -w /work timeplus/proton-binary-builder:clang-21 /usr/bin/llvm-strip-21 proton
          ls -lh $GITHUB_WORKSPACE/output/proton
        fi

        mv $GITHUB_WORKSPACE/output/proton $GITHUB_WORKSPACE/$PROTON_BINARY
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET_WEST_2 }}
      GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  Build_macOS_arm:
    if: github.event.inputs.OS == 'macos' && github.event.inputs.arch == 'arm'
    # GitHub-hosted Apple Silicon larger runner (M2 Pro, 5 vCPU, 14 GB RAM).
    # Largest arm64 tier GitHub offers; the 12-core "large" tier is Intel-only,
    # so it cannot native-compile arm64.
    runs-on: macos-26-xlarge
    # GitHub-hosted jobs hard-stop at 360 min; 350 leaves margin for the
    # always()-guarded ccache upload below the 300-min build guard.
    timeout-minutes: 350
    # The cache object below is a single shared key, so concurrent runs would
    # race on save and the loser's work would be discarded. Queue instead of
    # cancelling: a run that reaches the save step is what warms the next one.
    concurrency:
      group: build-macos-arm-ccache
      cancel-in-progress: false
    env:
      build_directory: ${{ github.workspace }}/build
      build_type: RelWithDebInfo
      # Hosted runners are ephemeral and this job previously had no ccache at
      # all, which only worked because a persistent machine kept its build tree
      # between runs. The cache now round-trips through S3. Uncompressed .tar on
      # purpose: ccache 4.x already compresses its entries, so gzip would only
      # cost single-threaded CPU on both ends.
      CCACHE_DIR: ${{ github.workspace }}/ccache
      CCACHE_MAXSIZE: 10G
      CCACHE_COMPILERCHECK: content
      CCACHE_BASEDIR: ${{ github.workspace }}
      MACOS_CCACHE_S3: s3://timeplus-ci-internal/proton-oss/cache-macos-arm-native.tar
    steps:
      - name: Checkout
        uses: actions/checkout@v5.0.1
        with:
          token: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
          fetch-depth: 1
          submodules: true

      - name: Get MacOS version
        run: sw_vers

      # GitHub documents this runner as having 14 GB of free SSD; in practice
      # the image is a 320 GB volume with ~87 GB free, and this cleanup takes it
      # to ~116 GB. Keep both the cleanup and the assertion: the documented
      # figure is what GitHub is entitled to shrink to, and failing here costs
      # two minutes instead of hitting ENOSPC hours into the build.
      - name: Free disk space
        run: |
          echo "Disk before cleanup:"
          df -h /
          DEFAULT_XCODE="$(dirname "$(dirname "$(xcode-select -p)")")"
          echo "Keeping default Xcode: $DEFAULT_XCODE"
          for x in /Applications/Xcode*.app; do
            if [ "$(readlink -f "$x")" = "$(readlink -f "$DEFAULT_XCODE")" ]; then
              continue
            fi
            echo "Removing $x"
            sudo rm -rf "$x" &
          done
          wait
          sudo xcrun simctl runtime delete all 2>/dev/null || true
          echo "Disk after cleanup:"
          df -h /

          REQUIRED_GB=40
          AVAIL_GB=$(df -k "$GITHUB_WORKSPACE" | awk 'NR==2 {print int($4/1024/1024)}')
          echo "Available after cleanup: ${AVAIL_GB} GB (need ${REQUIRED_GB} GB)"
          if [ "$AVAIL_GB" -lt "$REQUIRED_GB" ]; then
            echo "::error::Only ${AVAIL_GB} GB free after cleanup, need ${REQUIRED_GB} GB. The runner image likely changed what it preinstalls; extend this step or move the job to a runner with more disk."
            exit 1
          fi

      # The image already ships CMake, Ninja, gh and AWS CLI. llvm@21 is pinned
      # as a versioned formula so `brew --prefix llvm@21` stays valid when the
      # image's unversioned llvm moves past 21. coreutils provides gtimeout for
      # the build guard; findutils and grep provide the gfind/ggrep that
      # cmake/tools.cmake hard-requires on Darwin and that the macOS userland
      # does not include.
      - name: Install toolchain
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew install llvm@21 ccache coreutils findutils grep
          "$(brew --prefix llvm@21)/bin/clang" --version
          ccache --version | head -1
          gtimeout --version | head -1
          gfind --version | head -1
          ggrep --version | head -1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.0.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Streamed rather than downloaded-then-extracted, which keeps the archive
      # off the disk budget entirely.
      - name: Restore ccache from S3
        run: |
          mkdir -p "$CCACHE_DIR"
          if aws s3 cp --no-progress "$MACOS_CCACHE_S3" - | tar -xf - -C "$CCACHE_DIR"; then
            echo "Restored ccache from S3"
            du -sh "$CCACHE_DIR"
          else
            echo "No ccache archive in S3 yet - cold build"
          fi

      - name: Create and Configure Build
        run: |
          mkdir -p ${{ env.build_directory }}
          export CC=$(brew --prefix llvm@21)/bin/clang
          export CXX=$(brew --prefix llvm@21)/bin/clang++
          export PATH=$(brew --prefix llvm@21)/bin:$PATH
          # CMAKE_OSX_DEPLOYMENT_TARGET pins the binary's minimum macOS at
          # 11.0, which is what the previous builder produced: `vtool
          # -show-build` on the released Darwin-arm64 binary reports minos 11.0.
          # Left unset it would follow the runner image's much newer SDK and
          # silently drop users on macOS 11-14.
          #
          # CMAKE_*_FLAGS_ADD is appended after DEBUG_INFO_FLAGS in the root
          # CMakeLists.txt, so -g0 wins and turns debug info off. Debug info is
          # ~89% of object bytes in this configuration, so this is the
          # difference between a ~45 GB and an ~8 GB build tree, and it shrinks
          # the cache by the same factor. Nothing is lost: this job publishes
          # only the stripped binary, so the DWARF was already discarded.
          cmake -B ${{ env.build_directory }} -G "Ninja" -DCMAKE_BUILD_TYPE=${{ env.build_type }} -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DCMAKE_CXX_FLAGS_ADD=-g0 -DCMAKE_C_FLAGS_ADD=-g0 -DCMAKE_ASM_FLAGS_ADD=-g0 -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DENABLE_TESTS=OFF -DENABLE_UTILS=OFF -DENABLE_EXAMPLES=OFF -DENABLE_PULSAR=ON

      # A fully cold build can outlive the 6h job limit, and a killed job
      # uploads nothing, so it would never converge. The guard turns "would
      # have been killed" into a controlled failure that still reaches the
      # always()-guarded cache save, so one or two re-runs bootstrap a warm
      # cache from nothing.
      - name: Build with Ninja
        run: |
          rc=0
          gtimeout 300m cmake --build ${{ env.build_directory }} || rc=$?
          if [ "$rc" = "124" ]; then
            echo "::warning::Build exceeded the 300-minute guard. The ccache accumulated so far is uploaded by the 'Save ccache to S3' step - re-run to continue from it."
          fi
          exit $rc

      # Surface hit rate so cold-vs-warm builds are visible at a glance.
      - name: ccache stats
        if: always()
        run: ccache -sv || true

      - name: Process Binary
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          ARCH=$(uname -m)
          ORIGINAL_BINARY=${{ env.build_directory }}/programs/proton
          STRIPPED_BINARY=${{ env.build_directory }}/programs/proton_${COMMIT_HASH}_${ARCH}

          echo "Original binary size:"
          ls -lh $ORIGINAL_BINARY

          if [ "${{ github.event.inputs.strip_binary }}" == "true" ]; then
            echo "Stripping the binary..."
            "$(brew --prefix llvm@21)/bin/llvm-strip" $ORIGINAL_BINARY -o $STRIPPED_BINARY
            echo "Stripped binary size:"
            ls -lh $STRIPPED_BINARY
          else
            echo "Skipping strip, copying original binary..."
            cp $ORIGINAL_BINARY $STRIPPED_BINARY
          fi

          # Store binary name and path for later steps
          echo "BINARY_NAME=proton_${COMMIT_HASH}_${ARCH}" >> $GITHUB_ENV
          echo "BINARY_PATH=${{ env.build_directory }}/programs/proton_${COMMIT_HASH}_${ARCH}" >> $GITHUB_ENV

          # Package the binary into a tar.gz for faster downloads
          TARBALL_NAME="proton_${COMMIT_HASH}_${ARCH}.tar.gz"
          TARBALL_PATH="${{ env.build_directory }}/programs/${TARBALL_NAME}"
          echo "Packaging binary tarball: $TARBALL_NAME"
          tar -czf "$TARBALL_PATH" -C "$(dirname "$STRIPPED_BINARY")" "$(basename "$STRIPPED_BINARY")"
          ls -lh "$TARBALL_PATH"

          # Export tarball info for subsequent steps
          echo "TARBALL_NAME=$TARBALL_NAME" >> $GITHUB_ENV
          echo "TARBALL_PATH=$TARBALL_PATH" >> $GITHUB_ENV

      # The minimum supported macOS lives in a Mach-O load command and shows up
      # in no build output anyone reads, so raising it is silent. Assert it.
      - name: Verify deployment target
        run: |
          EXPECTED=11.0
          ACTUAL=$(vtool -show-build "$BINARY_PATH" | awk '/^ *minos/ {print $2; exit}')
          echo "minos=$ACTUAL (expected $EXPECTED)"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Binary's minimum macOS is $ACTUAL, expected $EXPECTED. Changing the floor is a product decision -- update CMAKE_OSX_DEPLOYMENT_TARGET and this check together."
            exit 1
          fi

      - name: Upload Artifact To S3 (tar.gz)
        run: |
          # Improve S3 upload reliability with specific options
          max_attempts=5
          attempt=1
          wait_time=15

          while [ $attempt -le $max_attempts ]; do
            echo "S3 upload attempt $attempt of $max_attempts"

            # Using specific AWS CLI options to handle large file uploads more reliably
            if aws s3 cp \
               --no-progress \
               --only-show-errors \
               --cli-connect-timeout 30 \
               --cli-read-timeout 600 \
               "${{ env.TARBALL_PATH }}" \
               "s3://timeplus-ci-internal/proton-oss/native_build_macOS/${{ env.TARBALL_NAME }}"; then
              echo "Upload successful"
              break
            else
              upload_status=$?
              echo "Upload failed on attempt $attempt with exit code $upload_status"

              if [ $attempt -eq $max_attempts ]; then
                echo "All upload attempts failed"
                exit 1
              fi

              echo "Retrying in $wait_time seconds..."
              sleep $wait_time
              wait_time=$((wait_time * 2))  # Exponential backoff
              attempt=$((attempt + 1))
            fi
          done

      - name: Print SHA256 Checksum (tar.gz)
        run: |
          TARBALL=${{ env.TARBALL_PATH }}
          shasum -a 256 "$TARBALL"

      # Runs on success, build failure and the build guard alike, so even a
      # partial compile warms the next run. Placed last so a failed upload
      # cannot block the artifact steps above.
      - name: Save ccache to S3
        if: always()
        run: |
          if [ -d "$CCACHE_DIR" ] && [ -n "$(ls -A "$CCACHE_DIR" 2>/dev/null)" ]; then
            ccache -sv || true
            du -sh "$CCACHE_DIR"
            tar -cf - -C "$CCACHE_DIR" . | aws s3 cp --no-progress - "$MACOS_CCACHE_S3"
          else
            echo "ccache dir empty - nothing to save"
          fi
