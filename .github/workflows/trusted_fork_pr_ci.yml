name: trusted_fork_pr_ci
run-name: trusted_fork_pr_ci [PR #${{ inputs.pr_number }}]

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'External pull request number to test with ProtonCI'
        required: true
        type: string

jobs:
  dispatch_proton_ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
      PR_NUMBER: ${{ inputs.pr_number }}
    steps:
      - name: Validate pull request number
        run: |
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::pr_number must be numeric"
            exit 1
          fi

      - name: Dispatch ProtonCI for fork PR
        id: dispatch
        run: |
          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"

          pr_state="$(jq -r '.state' <<<"$pr_json")"
          is_cross_repo="$(jq -r '.head.repo.full_name != .base.repo.full_name' <<<"$pr_json")"
          is_draft="$(jq -r '.draft' <<<"$pr_json")"
          base_ref="$(jq -r '.base.ref' <<<"$pr_json")"
          head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
          labels_csv="$(jq -r '[.labels[].name] | join(",")' <<<"$pr_json")"
          pr_ref="refs/pull/${PR_NUMBER}/head"

          case "$base_ref" in
            develop|2.9|3.0)
              ;;
            *)
              echo "::error::PR #${PR_NUMBER} targets ${base_ref}, which is not handled by ProtonCI."
              exit 1
              ;;
          esac

          if [[ "$pr_state" != "open" ]]; then
            echo "::error::PR #${PR_NUMBER} is not open."
            exit 1
          fi

          if [[ "$is_cross_repo" != "true" ]]; then
            echo "::error::PR #${PR_NUMBER} already comes from ${GITHUB_REPOSITORY}; use the normal pull_request workflow."
            exit 1
          fi

          if [[ "$is_draft" == "true" ]]; then
            echo "::error::PR #${PR_NUMBER} is still a draft. Mark it ready for review before running trusted CI."
            exit 1
          fi

          tmp_dir="${GITHUB_WORKSPACE:-$PWD}/tmp"
          mkdir -p "$tmp_dir"
          dispatch_file="$(mktemp -p "$tmp_dir")"
          trap 'rm -f "$dispatch_file"' EXIT

          jq -n \
            --arg ref "$base_ref" \
            --arg pr_ref "$pr_ref" \
            --arg head_sha "$head_sha" \
            --arg pr_labels_csv "$labels_csv" \
            '{ref: $ref, inputs: {ref: $pr_ref, head_sha: $head_sha, pr_labels_csv: $pr_labels_csv}}' > "$dispatch_file"

          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/proton_ci.yml/dispatches" --input "$dispatch_file" >/dev/null

          {
            echo "base_ref=${base_ref}"
            echo "pr_ref=${pr_ref}"
            echo "head_sha=${head_sha}"
          } >> "$GITHUB_OUTPUT"

      - name: Summarize dispatch
        run: |
          {
            echo "## Trusted fork PR CI dispatch"
            echo
            echo "- Original PR: #$PR_NUMBER"
            echo "- Workflow ref: \`${{ steps.dispatch.outputs.base_ref }}\`"
            echo "- Checked-out ref: \`${{ steps.dispatch.outputs.pr_ref }}\`"
            echo "- Head SHA: \`${{ steps.dispatch.outputs.head_sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
