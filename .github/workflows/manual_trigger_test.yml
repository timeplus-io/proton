name: manual_trigger_test
run-name: manual_trigger_test [${{ github.event.inputs.arch }}] [${{ github.event.inputs.tag }}]

on: # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      arch:
        description: 'Hardware architecture'
        required: true
        default: x64
        type: choice
        options:
        - x64
        - arm
        - arm_macos
      tag:
        description: 'Tag of proton image'     
        required: true
        type: string
        default: 'sanitizer'
      repo:
        description: 'Repo of proton image'
        required: false
        type: choice
        default: timeplus/proton
        options:
        - timeplus/proton
        - timeplus/proton_testing
      volume:
        description: 'EC2 volume size'     
        required: false
        type: string
        default: '50'
      test_category:
        description: 'Run specified type tests'
        required: false
        type: choice
        default: smoke
        options:
        - smoke
        - unit
        - stateless
        - stateful
        - query_compatibility
        - compatibility
        - performance
        - migration
        - scope.release # smoke,stateless,stateful,compatibility,performance (release_build use) (skip query_compatibility until ready)
      has_feature_enabled:
        description: 'Executed features separated by semicolons (support: hybrid;python-udf-library)'
        required: false
        type: string
        default: ''
      nodes:
        description: 'smoke deploy nodes'
        required: false
        type: choice
        default: "3"
        options:
        - "1"
        - "3"

jobs:
  prepare_smoke_test:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.test_category == 'smoke' || github.event.inputs.test_category == 'scope.release' }}
    outputs:
      command: |
        export PROTON_VERSION=$TAG
        export PROTON_REPO=${{ github.event.inputs.repo }}
        export NODES=${{ inputs.nodes }}

        # pull docker image
        cd $GITHUB_WORKSPACE/docker/test/smoke/
        docker build . -f Dockerfile --build-arg FROM_TAG=$PROTON_VERSION --build-arg FROM_REPO=$PROTON_REPO -t timeplus/proton-smoke-test:$TAG

        echo "run smoke test"
        cd $GITHUB_WORKSPACE/tests/cluster/
        sudo curl -L "https://github.com/docker/compose/releases/download/v2.5.0/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
        sudo chmod +x /usr/local/bin/docker-compose

        bash run.sh '${{ github.event.inputs.has_feature_enabled }}'

    steps:
      - name: display command
        run: |
          echo 'command: ${{ steps.set_command.outputs.command }}'
  smoke_test_on_x64:
    needs: prepare_smoke_test
    uses: timeplus-io/proton/.github/workflows/run_command.yml@develop
    if: github.event.inputs.arch == 'x64'
    with:
      ec2-instance-type: c5.9xlarge
      ec2-image-id: ${{ vars.X64_TEST_AMI }}
      ec2-volume-size: ${{ github.event.inputs.volume }} # reference: '30'
      submodules: false
      sanitizer: ''
      arch: ${{ vars.X64_ARCH }}
      tag: ${{ github.event.inputs.tag }}
      upjob: smoke_test_on_x64
      command: |
        ${{ needs.prepare_smoke_test.outputs.command }}
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET_WEST_2 }}
      GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      TIMEPLUS_ADDRESS: ${{ secrets.TIMEPLUS_ADDRESS }}
      TIMEPLUS_API_KEY: ${{ secrets.TIMEPLUS_API_KEY }}
      TIMEPLUS_WORKSPACE: ${{ secrets.TIMEPLUS_WORKSPACE }}
  smoke_test_on_arm:
    needs: prepare_smoke_test
    uses: timeplus-io/proton/.github/workflows/run_command.yml@develop
    if: github.event.inputs.arch == 'arm'
    with:
      ec2-instance-type: ${{ vars.ARM_INSTANCE_TYPE }}
      ec2-image-id: ${{ vars.ARM_TEST_AMI }}
      ec2-volume-size: ${{ github.event.inputs.volume }} # reference: '30'
      submodules: false
      arch: ${{ vars.ARM_ARCH }}
      sanitizer: ''
      tag: ${{ github.event.inputs.tag }}
      upjob: smoke_test_on_arm
      command: |
        ${{ needs.prepare_smoke_test.outputs.command }}
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET_WEST_2 }}
      GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      TIMEPLUS_ADDRESS: ${{ secrets.TIMEPLUS_ADDRESS }}
      TIMEPLUS_API_KEY: ${{ secrets.TIMEPLUS_API_KEY }}
      TIMEPLUS_WORKSPACE: ${{ secrets.TIMEPLUS_WORKSPACE }}
  prepare_query_compability_test:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.test_category == 'query_compatibility' }}
    outputs:
      command: |
      
        # pull docker image
        docker pull ${{ github.event.inputs.repo }}:$TAG

        echo "run quary compatibility test"
        # cd $GITHUB_WORKSPACE/tests/stream
        mkdir -p output
        cd quark/api
        export PROTON_VERSION=$TAG
        env

        # make virtualenv
        ln -s /usr/bin/python3 /usr/bin/python
        apt-get update
        systemctl stop unattended-upgrades
        apt install python3-venv jq -y
        python -m venv env
        source env/bin/activate

        pip install --upgrade pip
        
        # FIXME: remove this line after pyyaml community fixed install bug
        pip install pyyaml==5.3.1

        pip install -r helpers/requirements.txt

        aws s3 cp s3://tp-internal2/proton-oss/proton-python-driver/clickhouse-driver-0.2.4.tar.gz ./
        pip install ./clickhouse-driver-0.2.4.tar.gz

        #python ci_runner.py --debug --settings=default --test_folders=test_production_compatibility
        
        docker-compose -f test_production_compatibility/configs/docker/docker-compose.yaml up -d
        sleep 10
        bash ./api_test_run_proton.sh

        #echo "check test result"
        #cat $GITHUB_WORKSPACE/tests/stream/.status
        #cat $GITHUB_WORKSPACE/tests/stream/.status | grep default:ExitCode.OK
    steps:
      - name: display command
        run: |
          echo 'command: ${{ steps.set_command.outputs.command }}'  
  query_compability_test_on_x64:
    needs: prepare_query_compability_test
    uses: timeplus-io/proton/.github/workflows/run_command.yml@develop
    if: github.event.inputs.arch == 'x64'
    with:
      ec2-instance-type: ${{ vars.X64_TEST_ONLY_INSTANCE_TYPE_SMALL }}
      ec2-image-id: ${{ vars.X64_TEST_AMI }}
      ec2-volume-size: ${{ github.event.inputs.volume }} # reference: '30'
      submodules: false
      sanitizer: ''
      arch: ${{ vars.X64_ARCH }}
      tag: ${{ github.event.inputs.tag }}
      upjob: query_compability_test_on_x64
      command: |
        ${{ needs.prepare_query_compability_test.outputs.command }}
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET_WEST_2 }}
      GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      TIMEPLUS_ADDRESS: ${{ secrets.TIMEPLUS_ADDRESS }}
      TIMEPLUS_API_KEY: ${{ secrets.TIMEPLUS_API_KEY }}
      TIMEPLUS_WORKSPACE: ${{ secrets.TIMEPLUS_WORKSPACE }}
      TP_DEMO_API_KEY: ${{ secrets.TP_DEMO_API_KEY }}
      TP_DEMO_SITE_API_KEY: ${{ secrets.TP_DEMO_SITE_API_KEY }}  
  query_compability_on_arm:
    needs: prepare_query_compability_test
    uses: timeplus-io/proton/.github/workflows/run_command.yml@develop
    if: github.event.inputs.arch == 'arm'
    with:
      ec2-instance-type: ${{ vars.ARM_TEST_ONLY_INSTANCE_TYPE_SMALL }}
      ec2-image-id: ${{ vars.ARM_TEST_AMI }}
      ec2-volume-size: ${{ github.event.inputs.volume }} # reference: '30'
      submodules: false
      arch: ${{ vars.ARM_ARCH }}
      sanitizer: ''
      tag: ${{ github.event.inputs.tag }}
      upjob: query_compability_on_arm
      command: |
        ${{ needs.prepare_query_compability_test.outputs.command }}
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET_WEST_2 }}
      GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      TIMEPLUS_ADDRESS: ${{ secrets.TIMEPLUS_ADDRESS }}
      TIMEPLUS_API_KEY: ${{ secrets.TIMEPLUS_API_KEY }}
      TIMEPLUS_WORKSPACE: ${{ secrets.TIMEPLUS_WORKSPACE }}
      TP_DEMO_API_KEY: ${{ secrets.TP_DEMO_API_KEY }}
      TP_DEMO_SITE_API_KEY: ${{ secrets.TP_DEMO_SITE_API_KEY }}         
  prepare_unit_test:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.test_category == 'unit' }}
    outputs:
      command: |
        cd $GITHUB_WORKSPACE/tests/proton_ci

        # make virtualenv
        ln -s /usr/bin/python3 /usr/bin/python
        apt-get update
        systemctl stop unattended-upgrades
        apt install python3-venv jq -y
        python -m venv env
        source env/bin/activate
        pip install -r requirements.txt
        export PROTON_VERSION=$TAG
        python unit_tests_check.py
    steps:
      - name: display command
        run: |
          echo 'command: ${{ steps.set_command.outputs.command }}'
  unit_test_on_x64:
    needs: prepare_unit_test
    uses: timeplus-io/proton/.github/workflows/run_command.yml@develop
    if: github.event.inputs.arch == 'x64'
    with:
      ec2-instance-type: c5.2xlarge
      ec2-image-id: ${{ vars.X64_TEST_AMI }}
      ec2-volume-size: ${{ github.event.inputs.volume }} # reference: '40'
      submodules: false
      sanitizer: ''
      arch: ${{ vars.X64_ARCH }}
      tag: ${{ github.event.inputs.tag }}
      upjob: unit_test_on_x64
      command: |
        ${{ needs.prepare_unit_test.outputs.command }}
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET_WEST_2 }}
      GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      TIMEPLUS_ADDRESS: ${{ secrets.TIMEPLUS_ADDRESS }}
      TIMEPLUS_API_KEY: ${{ secrets.TIMEPLUS_API_KEY }}
      TIMEPLUS_WORKSPACE: ${{ secrets.TIMEPLUS_WORKSPACE }}
  unit_test_on_arm:
    needs: prepare_unit_test
    uses: timeplus-io/proton/.github/workflows/run_command.yml@develop
    if: github.event.inputs.arch == 'arm'
    with:
      ec2-instance-type: c6g.2xlarge
      ec2-image-id: ${{ vars.ARM_TEST_AMI }}
      ec2-volume-size: ${{ github.event.inputs.volume }} # reference: '40'
      submodules: false
      arch: ${{ vars.ARM_ARCH }}
      sanitizer: ''
      tag: ${{ github.event.inputs.tag }}
      upjob: unit_test_on_arm
      command: |
        ${{ needs.prepare_unit_test.outputs.command }}
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET_WEST_2 }}
      GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      TIMEPLUS_ADDRESS: ${{ secrets.TIMEPLUS_ADDRESS }}
      TIMEPLUS_API_KEY: ${{ secrets.TIMEPLUS_API_KEY }}
      TIMEPLUS_WORKSPACE: ${{ secrets.TIMEPLUS_WORKSPACE }}
  prepare_stateless_test:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.test_category == 'stateless' || github.event.inputs.test_category == 'scope.release' }}
    outputs:
      command: |
        cd $GITHUB_WORKSPACE/tests/proton_ci
        mkdir $GITHUB_WORKSPACE/output

        # make virtualenv
        ln -s /usr/bin/python3 /usr/bin/python
        apt-get update
        systemctl stop unattended-upgrades
        apt install python3-venv jq -y
        python -m venv env
        source env/bin/activate

        pip install -r requirements.txt
        export PROTON_VERSION=$TAG
        export PROTON_REPO=${{ github.event.inputs.repo }}
        chown -R 101 $GITHUB_WORKSPACE
        python functional_tests_check.py stateless
    steps:
      - name: display command
        run: |
          echo 'command: ${{ steps.set_command.outputs.command }}'
  stateless_test_on_x64:
    needs: prepare_stateless_test
    uses: timeplus-io/proton/.github/workflows/run_command.yml@develop
    if: github.event.inputs.arch == 'x64'
    with:
      ec2-instance-type: c5.4xlarge
      ec2-image-id: ${{ vars.X64_TEST_AMI }}
      ec2-volume-size: ${{ github.event.inputs.volume }} # reference: '50'
      submodules: false
      sanitizer: ''
      arch: ${{ vars.X64_ARCH }}
      tag: ${{ github.event.inputs.tag }}
      upjob: stateless_test_on_x64
      command: |
        ${{ needs.prepare_stateless_test.outputs.command }}
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET_WEST_2 }}
      GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      TIMEPLUS_ADDRESS: ${{ secrets.TIMEPLUS_ADDRESS }}
      TIMEPLUS_API_KEY: ${{ secrets.TIMEPLUS_API_KEY }}
      TIMEPLUS_WORKSPACE: ${{ secrets.TIMEPLUS_WORKSPACE }}
  stateless_test_on_arm:
    needs: prepare_stateless_test
    uses: timeplus-io/proton/.github/workflows/run_command.yml@develop
    if: github.event.inputs.arch == 'arm'
    with:
      ec2-instance-type: ${{ vars.ARM_INSTANCE_TYPE }}
      ec2-image-id: ${{ vars.ARM_TEST_AMI }}
      ec2-volume-size: ${{ github.event.inputs.volume }} # reference: '50'
      submodules: false
      arch: ${{ vars.ARM_ARCH }}
      sanitizer: ''
      tag: ${{ github.event.inputs.tag }}
      upjob: stateless_test_on_arm
      command: |
        ${{ needs.prepare_stateless_test.outputs.command }}
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET_WEST_2 }}
      GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      TIMEPLUS_ADDRESS: ${{ secrets.TIMEPLUS_ADDRESS }}
      TIMEPLUS_API_KEY: ${{ secrets.TIMEPLUS_API_KEY }}
      TIMEPLUS_WORKSPACE: ${{ secrets.TIMEPLUS_WORKSPACE }}
  prepare_stateful_test:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.test_category == 'stateful' || github.event.inputs.test_category == 'scope.release' }}
    outputs:
      command: |
        cd $GITHUB_WORKSPACE/tests/proton_ci
        mkdir $GITHUB_WORKSPACE/output

        # make virtualenv
        ln -s /usr/bin/python3 /usr/bin/python
        apt-get update
        systemctl stop unattended-upgrades
        apt install python3-venv jq -y
        python -m venv env
        source env/bin/activate

        pip install -r requirements.txt
        export PROTON_VERSION=$TAG
        export PROTON_REPO=${{ github.event.inputs.repo }}
        chown -R 101 $GITHUB_WORKSPACE
        python functional_tests_check.py stateful
    steps:
      - name: display command
        run: |
          echo 'command: ${{ steps.set_command.outputs.command }}'
  stateful_test_on_x64:
    needs: prepare_stateful_test
    uses: timeplus-io/proton/.github/workflows/run_command.yml@develop
    if: github.event.inputs.arch == 'x64'
    with:
      ec2-instance-type: c5.2xlarge
      ec2-image-id: ${{ vars.X64_TEST_AMI }}
      ec2-volume-size: ${{ github.event.inputs.volume }} # reference: '40'
      submodules: false
      sanitizer: ''
      arch: ${{ vars.X64_ARCH }}
      tag: ${{ github.event.inputs.tag }}
      upjob: stateful_test_on_x64
      command: |
        ${{ needs.prepare_stateful_test.outputs.command }}
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET_WEST_2 }}
      GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      TIMEPLUS_ADDRESS: ${{ secrets.TIMEPLUS_ADDRESS }}
      TIMEPLUS_API_KEY: ${{ secrets.TIMEPLUS_API_KEY }}
      TIMEPLUS_WORKSPACE: ${{ secrets.TIMEPLUS_WORKSPACE }}
  stateful_test_on_arm:
    needs: prepare_stateful_test
    uses: timeplus-io/proton/.github/workflows/run_command.yml@develop
    if: github.event.inputs.arch == 'arm'
    with:
      ec2-instance-type: c6g.2xlarge
      ec2-image-id: ${{ vars.ARM_TEST_AMI }}
      ec2-volume-size: ${{ github.event.inputs.volume }} # reference: '40'
      submodules: false
      arch: ${{ vars.ARM_ARCH }}
      sanitizer: ''
      tag: ${{ github.event.inputs.tag }}
      upjob: stateful_test_on_arm
      command: |
        ${{ needs.prepare_stateful_test.outputs.command }}
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET_WEST_2 }}
      GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      TIMEPLUS_ADDRESS: ${{ secrets.TIMEPLUS_ADDRESS }}
      TIMEPLUS_API_KEY: ${{ secrets.TIMEPLUS_API_KEY }}
      TIMEPLUS_WORKSPACE: ${{ secrets.TIMEPLUS_WORKSPACE }}
  prepare_compatibility_test:
    runs-on: ubuntu-latest
    if: false # Disabled compatibility tests
    outputs:
      versions: ${{ steps.get-versions.outputs.versions }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4.1.6
        with:
          token: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
          submodules: false
      - name: Get Latest 5 versions
        id: get-versions
        run: |
          export PROTON_VERSION=${{ inputs.tag }}
          export PROTON_REPO=${{ github.event.inputs.repo }}

          cd $GITHUB_WORKSPACE/tests/proton_ci
          pip install -r requirements.txt

          # get versions
          python run_compatibility_test.py --num 5 --versions 2.3.32
          TEST_VERSIONS=$(cat baseline_versions.txt)
          echo "versions=$TEST_VERSIONS" | tee -a "$GITHUB_OUTPUT"
        env:
          GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
  compatibility_test:
    needs: prepare_compatibility_test
    if: false # Disabled compatibility tests
    uses: timeplus-io/proton/.github/workflows/compatibility_test.yml@develop
    strategy:
      fail-fast: false # Turn off due to no dependencies between individual instances of matrix
      matrix: 
        versions: ${{ fromJson(needs.prepare_compatibility_test.outputs.versions) }}
    with:
      arch: ${{ github.event.inputs.arch }}
      target: ${{ github.event.inputs.tag }}
      source: ${{ matrix.versions }}
      repo: ${{ github.event.inputs.repo }}
      # nodes: ${{ github.event.inputs.nodes }}
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET_WEST_2 }}
      GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      TIMEPLUS_ADDRESS: ${{ secrets.TIMEPLUS_ADDRESS }}
      TIMEPLUS_API_KEY: ${{ secrets.TIMEPLUS_API_KEY }}
      TIMEPLUS_WORKSPACE: ${{ secrets.TIMEPLUS_WORKSPACE }}
  prepare_performance_test:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.test_category == 'performance' || github.event.inputs.test_category == 'scope.release' }}
    outputs:
      command: |
        export PROTON_VERSION=$TAG
        export PROTON_REPO=${{ github.event.inputs.repo }}
        export NODES=${{ inputs.nodes }}

        # pull docker image
        cd $GITHUB_WORKSPACE/docker/test/smoke/
        docker build . -f Dockerfile --build-arg FROM_TAG=$PROTON_VERSION --build-arg FROM_REPO=$PROTON_REPO -t timeplus/proton-smoke-test:$TAG

        # download docker-compose
        sudo curl -L "https://github.com/docker/compose/releases/download/v2.5.0/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
        sudo chmod +x /usr/local/bin/docker-compose

        # run performance test
        echo "run performance test"
        cd $GITHUB_WORKSPACE/tests/cluster/
        bash perf.sh
    steps:
      - name: display command
        run: |
          echo 'command: ${{ steps.set_command.outputs.command }}'
  performance_test_on_x64:
    needs: prepare_performance_test
    uses: timeplus-io/proton/.github/workflows/run_command.yml@develop
    if: github.event.inputs.arch == 'x64'
    with:
      ec2-instance-type: c7i.8xlarge
      ec2-image-id: ${{ vars.X64_TEST_AMI }}
      ec2-volume-size: ${{ github.event.inputs.volume }} # reference: '30'
      submodules: false
      sanitizer: ''
      arch: ${{ vars.X64_ARCH }}
      tag: ${{ github.event.inputs.tag }}
      upjob: performance_test_on_x64
      run_mode: 'start_spot'
      command: |
        ${{ needs.prepare_performance_test.outputs.command }}
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET_WEST_2 }}
      GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      TIMEPLUS_ADDRESS: ${{ secrets.TIMEPLUS_ADDRESS }}
      TIMEPLUS_API_KEY: ${{ secrets.TIMEPLUS_API_KEY }}
      TIMEPLUS_WORKSPACE: ${{ secrets.TIMEPLUS_WORKSPACE }}
  performance_test_on_arm:
    needs: prepare_performance_test
    uses: timeplus-io/proton/.github/workflows/run_command.yml@develop
    if: false # ${{ github.event.inputs.arch == 'arm' }}
    with:
      ec2-instance-type: ${{ vars.ARM_INSTANCE_TYPE }}
      ec2-image-id: ${{ vars.ARM_TEST_AMI }}
      ec2-volume-size: ${{ github.event.inputs.volume }} # reference: '30'
      submodules: false
      arch: ${{ vars.ARM_ARCH }}
      sanitizer: ''
