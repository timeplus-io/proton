      TIMEPLUS_API_KEY: ${{ secrets.TIMEPLUS_API_KEY }}
      TIMEPLUS_WORKSPACE: ${{ secrets.TIMEPLUS_WORKSPACE }}
  prepare_migration_test:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.test_category == 'migration' || github.event.inputs.test_category == 'scope.release' }}
    outputs:
      command: |
        export PROTON_VERSION=$TAG
        export PROTON_REPO=${{ github.event.inputs.repo }}
        export NODES=${{ inputs.nodes }}

        # pull docker image
        cd $GITHUB_WORKSPACE/docker/test/smoke/
        docker build . -f Dockerfile --build-arg FROM_TAG=$PROTON_VERSION --build-arg FROM_REPO=$PROTON_REPO -t timeplus/proton-smoke-test:$TAG
        bash build_sling.sh

        echo "run migration test"
        cd $GITHUB_WORKSPACE/tests/cluster/
        sudo curl -L "https://github.com/docker/compose/releases/download/v2.5.0/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
        sudo chmod +x /usr/local/bin/docker-compose

        bash migration.sh
    steps:
      - name: display command
        run: |
          echo 'command: ${{ steps.set_command.outputs.command }}'
  migration_test_on_x64:
