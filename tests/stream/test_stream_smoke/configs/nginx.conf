worker_processes 1;
error_log  /var/log/nginx/error.log error;

events {
    worker_connections 1024;
}

http {
    upstream backend_http_3218 {
        server proton-server1:3218;
        server proton-server2:3218;
        server proton-server3:3218;
    }
    upstream backend_http_8123 {
        server proton-server1:8123;
        server proton-server2:8123;
        server proton-server3:8123;
    }

    server {
        listen 3218;
        server_name 127.0.0.1;

        location / {
            proxy_pass http://backend_http_3218;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
    server {
        listen 8123;
        server_name 127.0.0.1;

        location / {
            proxy_pass http://backend_http_8123;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

stream {
    upstream backend_tcp_8463 {
        server proton-server1:8463;
        server proton-server2:8463;
        server proton-server3:8463;
    }
    upstream backend_tcp_5432 {
        server proton-server1:5432;
        server proton-server2:5432;
        server proton-server3:5432;
    }
    upstream backend_tcp_7587 {
        server proton-server1:7587;
        server proton-server2:7587;
        server proton-server3:7587;
    }

    server {
        listen 8463;
        proxy_pass backend_tcp_8463;
    }
    server {
        listen 5432;
        proxy_pass backend_tcp_5432;
    }
    server {
        listen 7587;
        proxy_pass backend_tcp_7587;
    }
}
