      - multishards
      - backfill
    name: streaming join key-domain pushdown supports a filtered CTE right source
    description: A filtered right-side CTE still provides a bounded key-domain when parallel hash join is requested.
    steps:
      - statements:
          - client: python
            query_type: table
            query: drop stream if exists test35_cte_left;

          - client: python
            query_type: table
            query: drop stream if exists test35_cte_right;

          - client: python
            query_type: table
            exist: test35_cte_left
            exist_wait: 2
            wait: 1
            query: |
              create stream if not exists test35_cte_left
              (
                  scope_id uint16,
                  entity_id uint64,
                  value int
              )
              engine = Stream(4, city_hash64(scope_id, entity_id))
              primary key (scope_id, entity_id);

          - client: python
            query_type: table
            exist: test35_cte_right
            exist_wait: 2
            wait: 1
            query: |
              create stream if not exists test35_cte_right
              (
                  scope_id uint16,
                  entity_id uint64,
                  category string,
                  label string
              )
              engine = Stream(4, city_hash64(scope_id, entity_id))
              primary key (scope_id, entity_id);

          - client: python
            query_type: table
            wait: 1
            query: |
              insert into test35_cte_right(scope_id, entity_id, category, label)
              values (9, 1, 'selected', 'first'), (9, 2, 'selected', 'second'), (9, 3, 'ignored', 'ignored');

          - client: python
            query_type: table
            wait: 1
            query: |
              insert into test35_cte_left(scope_id, entity_id, value)
              values (9, 1, 10), (9, 2, 20), (9, 3, 30);

          - client: python
            query_id: "3507"
            query_type: stream
            depends_on_stream: test35_cte_left
            terminate: manual
            wait: 1
            query: |
              with right_src as
              (
                  select scope_id, entity_id, label
                  from test35_cte_right
                  where category = 'selected'
              )
              select l.scope_id, l.entity_id, l.value
              from test35_cte_left as l
              inner latest join right_src as r
              on l.scope_id = r.scope_id and l.entity_id = r.entity_id
              where l.scope_id = 9
              settings
                  seek_to = 'earliest',
                  enable_streaming_join_key_domain_pushdown = 1,
                  join_algorithm = 'parallel_hash',
                  backfill_max_threads = 1,
                  max_threads = 1;

          - client: python
            query_type: table
            wait: 2
            query: kill query where query_id = '3507' sync;

          - client: python
            query_type: table
            query: drop stream if exists test35_cte_left;

          - client: python
            query_type: table
            query: drop stream if exists test35_cte_right;

    expected_results:
      - query_id: "3507"
        expected_results:
          - [9, 1, 10]
          - [9, 2, 20]

