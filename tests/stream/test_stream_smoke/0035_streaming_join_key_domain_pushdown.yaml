test_suite_name: streaming_join_key_domain_pushdown
tag: smoke
test_suite_config:
  tests_2_run:
    ids_2_run:
      - all
    tags_2_run: []
    tags_2_skip:
      default:
        - todo
        - to_support
        - change
        - bug
        - sample
      cluster:
        - view
        - cluster_table_bug
comments: Tests covering streaming join key-domain pushdown for historical backfill filtering.
tests:
  - id: 0
    tags:
      - streaming_join
      - multishards
      - backfill
    name: streaming join key-domain pushdown keeps live reads active
    description: Backfill uses a bounded right-key snapshot with a composite sharding expression, and live reads continue after the historical filter is applied.
    steps:
      - statements:
          - client: python
            query_type: table
            query: drop stream if exists test35_left;

          - client: python
            query_type: table
            query: drop stream if exists test35_right;

          - client: python
            query_type: table
            exist: test35_left
            exist_wait: 2
            wait: 1
            query: |
              create stream if not exists test35_left
              (
                  scope_id uint16,
                  entity_id uint64,
                  value int
              )
              engine = Stream(4, city_hash64(scope_id, entity_id))
              primary key (scope_id, entity_id);

          - client: python
            query_type: table
            exist: test35_right
            exist_wait: 2
            wait: 1
            query: |
              create stream if not exists test35_right
              (
                  scope_id uint16,
                  entity_id uint64,
                  category string
              )
              engine = Stream(4, city_hash64(scope_id, entity_id))
              primary key (scope_id, entity_id);

          - client: python
            query_type: table
            wait: 1
            query: |
              insert into test35_right(scope_id, entity_id, category)
              values (1, 1, 'selected');

          - client: python
            query_type: table
            wait: 1
            query: |
              insert into test35_left(scope_id, entity_id, value)
              values (1, 1, 10), (1, 2, 99), (2, 1, 999);

          - client: python
            query_id: "3500"
            query_type: stream
            depends_on_stream: test35_left
            terminate: manual
            wait: 1
            query: |
              select l.scope_id, l.entity_id, l.value, r.category
              from test35_left as l
              inner latest join
              (
                  select scope_id, entity_id, category
                  from test35_right
                  where category = 'selected'
              ) as r
              on l.scope_id = r.scope_id and l.entity_id = r.entity_id
              where l.scope_id = 1
              settings
                  seek_to = 'earliest',
                  enable_streaming_join_key_domain_pushdown = 1,
                  streaming_join_key_domain_pushdown_disjunctive_filter_max_rows = 0,
                  backfill_max_threads = 1,
                  max_threads = 1;

          - client: python
            query_type: table
            depends_on: "3500"
            query_id: "3500_filter_path"
            wait: 2
            query: |
              select to_uint8(value > 0)
              from system.events
              where event = 'StreamingJoinKeyDomainStorageFilterPushed';

          - client: python
            query_type: table
            depends_on: "3500"
            query_id: "3500_pk_path"
            wait: 1
            query: |
              select to_uint8(value > 0)
              from system.events
              where event = 'StreamingJoinKeyDomainPrimaryKeyPruned';

          - client: python
            query_type: table
            depends_on: "3500"
            wait: 1
            query: |
              insert into test35_right(scope_id, entity_id, category)
              values (1, 2, 'selected');

          - client: python
            query_type: table
            wait: 1
            query: |
              insert into test35_left(scope_id, entity_id, value)
              values (1, 2, 20);

          - client: python
            query_type: table
            wait: 2
            query: kill query where query_id = '3500' sync;

          - client: python
            query_type: table
            query: drop stream if exists test35_left;

          - client: python
            query_type: table
            query: drop stream if exists test35_right;

    expected_results:
      - query_id: "3500"
        expected_results:
          - [1, 1, 10, "selected"]
          - [1, 2, 20, "selected"]
      - query_id: "3500_filter_path"
        expected_results:
          - [1]
      - query_id: "3500_pk_path"
        expected_results:
          - [1]

  - id: 1
    tags:
      - streaming_join
      - multishards
      - backfill
    name: streaming join key-domain pushdown supports aliased right keys
    description: The right-side snapshot can expose join keys under names that differ from the left stream, while the left stream still uses a composite sharding expression.
    steps:
      - statements:
          - client: python
            query_type: table
            query: drop stream if exists test35_alias_left;

          - client: python
            query_type: table
            query: drop stream if exists test35_alias_right;

          - client: python
            query_type: table
            exist: test35_alias_left
            exist_wait: 2
            wait: 1
            query: |
              create stream if not exists test35_alias_left
              (
                  group_id uint16,
                  item_id uint64,
                  value int
              )
              engine = Stream(4, city_hash64(group_id, item_id))
              primary key (group_id, item_id);

          - client: python
            query_type: table
            exist: test35_alias_right
            exist_wait: 2
            wait: 1
            query: |
              create stream if not exists test35_alias_right
              (
                  source_group uint16,
                  source_item uint64,
                  label string
              )
              engine = Stream(4, city_hash64(source_group, source_item))
              primary key (source_group, source_item);

          - client: python
            query_type: table
            wait: 1
            query: |
              insert into test35_alias_right(source_group, source_item, label)
              values (3, 7, 'active');

          - client: python
            query_type: table
            wait: 1
            query: |
              insert into test35_alias_left(group_id, item_id, value)
              values (3, 7, 70), (3, 8, 800);

          - client: python
            query_id: "3501"
            query_type: stream
            depends_on_stream: test35_alias_left
            terminate: manual
            wait: 1
            query: |
              select l.group_id, l.item_id, l.value, r.label
              from test35_alias_left as l
              inner latest join
              (
                  select source_group, source_item, label
                  from test35_alias_right
                  where label = 'active'
              ) as r
              on l.group_id = r.source_group and l.item_id = r.source_item
              where l.group_id = 3
              settings
                  seek_to = 'earliest',
                  enable_streaming_join_key_domain_pushdown = 1,
                  backfill_max_threads = 1,
                  max_threads = 1;

          - client: python
            query_type: table
            depends_on: "3501"
            wait: 1
            query: |
              insert into test35_alias_right(source_group, source_item, label)
              values (3, 9, 'active');

          - client: python
            query_type: table
            wait: 1
            query: |
              insert into test35_alias_left(group_id, item_id, value)
              values (3, 9, 90);

          - client: python
            query_type: table
            wait: 2
            query: kill query where query_id = '3501' sync;

          - client: python
            query_type: table
            query: drop stream if exists test35_alias_left;

          - client: python
            query_type: table
            query: drop stream if exists test35_alias_right;

    expected_results:
      - query_id: "3501"
        expected_results:
          - [3, 7, 70, "active"]
          - [3, 9, 90, "active"]

