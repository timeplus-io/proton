tags:
  - validate
  - kafka
  - protobuf
  - format_schema
  
description: extra tests on kafka external stream with protobuf format

cluster:
  - p1k1
  - p3k1

steps:
  - type: query
    sql: |
      insert into ex_kafka_proto (int32_c, int64_c, uint32_c, uint64_c, bool_c, string_c, map_c, enum_c, array_c) values 
      (-2147483646, -9223372036854775806, 4294967294, 18446744073709551614,  false, 'bbbb', {'key2': 222}, 'b', [4, 5, 6])


  - name: ext-5-1
    type: stream
    query: select * from ex_kafka_proto settings seek_to='earliest';
    schema:
      - name: int32_c
        type: int32
      - name: int64_c
        type: int64
      - name: uint32_c
        type: uint32
      - name: uint64_c
        type: uint64
      - name: bool_c
        type: bool    
      - name: string_c
        type: string
      - name: map_c
        type: map(string, int32)
      - name: enum_c
        type: enum8('a'=0, 'b'=1, 'z'=26)
      - name: array_c
        type: array(int32)

  - type: check
    target_name: ext-5-1
    mode: random # multi-partition not use message key sent to partitions randomly
    expected_result:
      - [-2147483647, -9223372036854775807, 4294967295, 18446744073709551615,  true, 'aaaa', {'key1': 111}, 'a', [1, 2, 3]]
      - [-2147483646, -9223372036854775806, 4294967294, 18446744073709551614,  false, 'bbbb', {'key2': 222}, 'b', [4, 5, 6]]
