tags:
  - prepare
  - validate
  - kafka
  - avro
  - format_schema

description: basic tests on kafka external stream with avro format

cluster:
  - p1k1
  - p3k1

steps:
  - name: ext-7-1
    type: stream
    query: select * from ex_kafka_avro settings seek_to='earliest';
    schema:
      - name: int8_c
        type: int8
      - name: int16_c
        type: int16
      - name: int32_c
        type: int32
      - name: int64_c
        type: int64
      - name: uint8_c
        type: uint8
      - name: uint16_c
        type: uint16
      - name: uint32_c
        type: uint32
      - name: uint64_c
        type: uint64
      - name: float32_c
        type: float32
      - name: float64_c
        type: float64
      - name: string_c
        type: string
      - name: fixed_c
        type: fixed_string(32)
      - name: enum_c
        type: enum8('a'=1, 'b'=2, 'z'=26)
      - name: array_c
        type: array(int32)
      - name: map_c
        type: map(string, int32)
      - name: tuple_c
        type: tuple(s string, i int32)
      - name: array_tuple_c.s
        type: array(string)
      - name: array_tuple_c.i
        type: array(int32)
      - name: null_c
        type: nullable(int32)
      - name: date_c
        type: date
      - name: datetime3_c
        type: datetime64(3)
      - name: datetime6_c
        type: datetime64(6)
      - name: uuid_c
        type: uuid

  - type: check
    target_name: ext-7-1
    mode: random # multi-partition not use message key sent to partitions randomly
    expected_result:
      - [-128, -32768, -2147483648, -9223372036854775808, 0, 0, 0, 0, -3.14, -2.718281828459, 'aaaa', '{@string}', 'a', [1, 2, 3], {'key1': 111}, {s: a, i: 0}, [aa], [0], null, '2024-01-01', '2024-01-01 00:00:01.000', '2024-01-01 00:00:01.000', '928c88b9-f37a-41d5-bef5-9cb3663c2445']
