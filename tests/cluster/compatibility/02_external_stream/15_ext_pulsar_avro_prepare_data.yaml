tags:
  - prepare
  - pulsar
  - avro
  - format_schema

description: prepare data for pulsar external stream

cluster:
  - p1k1
  - p3k1

steps:
  - type: pulsar
    name: delete
    topic: pulsar_avro_topic

  - type: pulsar
    name: create
    topic: pulsar_avro_topic

  - type: query
    sql: drop stream if exists ex_pulsar_avro
  - type: wait
    time: 1

  - type: query
    sql: drop format schema if exists pavro_schema;
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE FORMAT SCHEMA pavro_schema AS '
      {
        "type": "record",
        "name": "Person",
        "fields": [
            {"name": "int8_c", "type": "int"},
            {"name": "int16_c", "type": "int"},
            {"name": "int32_c", "type": "int"},
            {"name": "int64_c", "type": "long"},
            {"name": "uint8_c", "type": "int"},
            {"name": "uint16_c", "type": "int"},
            {"name": "uint32_c", "type": "int"},
            {"name": "uint64_c", "type": "long"},
            {"name": "uuid_c", "type": {"type": "string", "logicalType": "uuid"}},
            {"name": "string_c", "type": "string"},
            {"name": "fixed_c", "type": {"type": "fixed", "size": 32, "name": "FixedString"}},
            {"name": "float32_c", "type": "float"}, 
            {"name": "float64_c", "type": "double"},
            {"name": "date_c", "type": {"type": "int", "logicalType": "date"}},
            {"name": "datetime3_c", "type": {"type": "long", "logicalType": "timestamp-millis"}},
            {"name": "datetime6_c", "type": {"type": "long", "logicalType": "timestamp-micros"}},
            {"name": "enum_c", "type": {"type": "enum", "name": "EnumType", "symbols": ["a", "b", "z"]}},
            {"name": "map_c", "type": {"type": "map", "values": "int"}},
            {"name": "array_c", "type": {"type": "array", "items": "int"}},
            {"name": "tuple_c", "type": {"name": "Record", "type": "record",
                                "fields": [{"name": "s", "type": "string"}, {"name": "i", "type": "int"}]}},
            {"name": "array_tuple_c", "type": {"type": "array", 
                    "items": {"name": "ArrayRecord", "type": "record",
                    "fields": [{"name": "s", "type": "string"}, {"name": "i", "type": "int"}]}}},
            {"name": "null_c", "type": ["null", "int"]}
        ]
      }
      ' TYPE Avro;
  - type: wait
    time: 1

  - type: query
    sql: |
      create external stream ex_pulsar_avro
      (
        int8_c int8,
        int16_c int16,
        int32_c int32,
        int64_c int64,
        uint8_c uint8,
        uint16_c uint16,
        uint32_c uint32,
        uint64_c uint64,
        uuid_c uuid,
        string_c string,
        fixed_c fixed_string(32),
        float32_c float,
        float64_c float64,
        date_c date,
        datetime3_c datetime64(3),
        datetime6_c datetime64(6),
        enum_c enum('a'=0, 'b'=1, 'z'=26),
        map_c map(string, int),
        array_c array(int),
        tuple_c tuple(s string, i int),
        array_tuple_c array(tuple(s string, i int)),
        null_c nullable(int32)
      )
      settings type='pulsar', service_url='pulsar://pulsar:6650', topic='pulsar_avro_topic',
      data_format = 'Avro', format_schema = 'pavro_schema';

  - type: wait
    time: 3

  - type: query
    sql: |
      insert into ex_pulsar_avro values 
      (-128, -32768, -2147483648, -9223372036854775808, 0, 0, 0, 0, '928c88b9-f37a-41d5-bef5-9cb3663c2445', '{@string}', '{@fixed_string32}', -12345.123, -123456.1234,
       '2022-03-24', '2022-03-24 17:17:17.111', '2022-03-24 17:17:17.111111', 'a', {'key1': 111}, [1, 2, 3], ('a', 0), ['aa'], [0], null);
