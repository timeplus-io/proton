tags:
  - prepare
  - validate
  - pulsar
  - json

description: basic tests on append-only stream

cluster:
  - p1k1
  - p3k1

steps:
  - name: ext-10-1
    type: stream
    query: select _tp_shard, * from ex_pulsar_json settings seek_to='earliest';
    schema:
      - name: _tp_shard
        type: int32
      - name: int8_c
        type: int8
      - name: int16_c
        type: int16
      - name: int32_c
        type: int32
      - name: int64_c
        type: int64
      - name: uint8_c
        type: uint8
      - name: uint16_c
        type: uint16
      - name: uint32_c
        type: uint32
      - name: uint64_c
        type: uint64
      - name: uuid_c
        type: uuid
      - name: string_c
        type: string
      - name: float_c
        type: float32
      - name: decimal_c
        type: decimal(9,3)
      - name: date_c 
        type: date
      - name: datetime_c
        type: datetime
      - name: enum_c
        type: enum8('a'=1, 'b'=2, 'z'=26)
      - name: tuple_c
        type: tuple(s string, i int32)
      - name: ipv4_c
        type: ipv4
      - name: ipv6_c
        type: ipv6
      - name: map_c
        type: map(string, int32)
      - name: array_c
        type: array(int32)

  - type: check
    target_name: ext-10-1
    expected_result:
      - - -1
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
        - 7
        - 8
        - 928c88b9-f37a-41d5-bef5-9cb3663c2445
        - "{@string}"
        - "12345.123"
        - "123456.123"
        - "2022-03-24"
        - "2022-03-24 17:17:17"
        - a
        - {s: a, i: 0}
        - 192.168.168.168
        - 2a02:aa08:e000:3100::20
        - {'key1': 111}
        - [1, 2, 3]
