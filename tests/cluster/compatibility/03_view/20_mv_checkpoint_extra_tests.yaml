tags:
  - validate
  - checkpoint

description: extra tests on mv checkpoint

cluster:
  - p1k1
  - p3k1

steps:
  - type: generator
    name: cpkt-2
    batch_size: 2000
    buffer_size: 5000
    concurrency: 10
    interval_ms: 175
    dataset: compa_03_ckpt.bin
    format: native
    primary_key: id
    schema:
      - name: id
        type: string
        rule:
          type: random_string
          params:
            min_len: 1
            max_len: 5
      - name: location
        type: string
        rule:
          type: random_string
          params:
            min_len: 5
            max_len: 10
      - name: value
        type: float32
        rule:
          type: random_float
          params:
            min: 1.0
            max: 100.0
      - name: json
        type: string
        rule:
          type: random_string
          params:
            min_len: 5
            max_len: 10
      - name: timestamp
        type: datetime64(3)
        rule:
          type: current_time

  - type: proton_dataloader
    source: cpkt-2
    sink: ckpt_source_stream
    concurrency: 10

  - type: wait
    time: 4

  - name: view-20-1
    type: stream
    query: select count() from ckpt_mv settings seek_to='earliest';
    schema:
      - name: count()
        type: uint64

  - type: check
    target_name: view-20-1
    expected_result:
      - [1160000]

  - name: view-20-2
    type: stream
    query: select count() from ckpt_target_stream settings seek_to='earliest';
    schema:
      - name: count()
        type: uint64

  - type: check
    target_name: view-20-2
    expected_result:
      - [1160000]
