tags:
  - prepare
  - join

description: prepare data for mv

cluster:
  - p1k1
  - p3k1

steps:
  - type: query
    sql: drop view if exists mv;

  - type: wait
    time: 1

  - type: query
    sql: drop stream if exists mv_source_stream;

  - type: query
    sql: drop stream if exists mv_target_stream;

  - type: query
    sql: drop stream if exists mv_join_stream;

  - type: wait
    time: 1

  - type: query
    sql: create stream mv_join_stream(id string, type string);

  - type: wait
    time: 2

  - type: query
    sql: |
      insert into mv_join_stream(id, type) values
      ('dev1', 'roof')('dev2', 'field')('dev3', 'window')('dev4', 'wall')
      ('dev5', 'roof')('dev6', 'window')('dev7', 'wall')('dev8', 'floor');

  - type: query
    sql: |
      create stream mv_source_stream(id string, location string, value float32, json string, 
      timestamp datetime64(3) DEFAULT now64(3));

  - type: query
    sql: |
      create stream mv_target_stream(id string, type string, value float32, json string, 
      timestamp datetime64(3) DEFAULT now64(3), transformed_timestamp datetime);
    
  - type: wait
    time: 2

  - type: query
    sql: |
      create materialized view mv into mv_target_stream as select a.id, b.type, a.value, a.json, a.timestamp,
      to_datetime(json_extract_string(json, 'create_time')) as transformed_timestamp 
      from mv_source_stream as a join table(mv_join_stream) as b on a.id = b.id;

  - type: wait
    time: 2

  - type: query
    sql: |
      insert into mv_source_stream(id, location, value, json, timestamp) values
      ('dev1', 'ca', 60, '{"create_time":"2024-01-01 00:00:01"}', '2024-01-01 00:00:11.001')
      ('dev2', 'ca', 31, '{"create_time":"2024-01-01 00:00:02"}', '2024-01-01 00:00:12.002')
      ('dev3', 'ca', 58, '{"create_time":"2024-01-01 00:00:03"}', '2024-01-01 00:00:13.003')
      ('dev8', 'ca', 77, '{"create_time":"2024-01-01 00:00:08"}', '2024-01-01 00:00:18.008');

  - type: wait
    time: 1
