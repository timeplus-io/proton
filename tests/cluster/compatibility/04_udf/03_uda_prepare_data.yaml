tags:
  - prepare
  - UDA

description: prepare data

cluster:
  - p1k1
  - p3k1

steps:
  - type: query
    sql: drop stream if exists uda_stream;

  - type: query
    sql: drop function if exists test_sec_large;
  - type: wait
    time: 1

  - type: query
    sql: |
      create stream uda_stream(i int, i8 int8, f32 float32, s string, 
      dt datetime64(6) default now64());
  - type: wait
    time: 2

  - name: udf-3-1
    type: query
    sql: |
        CREATE AGGREGATE FUNCTION test_sec_large(value float32) RETURNS float32 LANGUAGE JAVASCRIPT AS $$
          {
            initialize: function() {
                this.max = -1.0;
                this.sec = -1.0
            },
            process: function(values) {
              for (let i = 0; i < values.length; i++) {
                if (values[i] > this.max) {
                  this.sec = this.max;
                  this.max = values[i]
                }
                if (values[i] < this.max && values[i] > this.sec)
                  this.sec = values[i];
              }
            },
            finalize: function() {
              return this.sec
            },
            serialize: function() {
              let s = {
                'max': this.max,
                'sec': this.sec
              };
              return JSON.stringify(s)
            },
            deserialize: function(state_str) {
              let s = JSON.parse(state_str);
              this.max = s['max'];
              this.sec = s['sec']
            },
            merge: function(state_str) {
              let s = JSON.parse(state_str);
              if (s['sec'] >= this.max) {
                this.max = s['max'];
                this.sec = s['sec']
              } else if (s['max'] >= this.max) {
                this.sec = this.max;
                this.max = s['max']
              } else if (s['max'] > this.sec) {
                this.sec = s['max']
              }
            }
          }
        $$;
  - type: wait
    time: 3

  - type: query
    sql: insert into uda_stream (f32) SELECT number FROM numbers(10);

  - type: wait
    time: 1
