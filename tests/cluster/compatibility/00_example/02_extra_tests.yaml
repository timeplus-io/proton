tags:
  - validate
  
description: extra tests

cluster:
  - p1k1
  - p3k1

steps:
  - type: query
    sql: insert into example (x) values (4)(5)(6);

  - type: query
    sql: insert into example_external (x) values (8)(10)(12);

  - name: example-2-1
    type: stream
    query: select x from example where _tp_time > earliest_ts() limit 6;
    schema:
      - name: x
        type: int32

  - name: example-2-2
    type: stream
    query: select x from example_external limit 6 settings seek_to='earliest';
    schema:
      - name: x
        type: int32

  - type: check
    target_name: example-2-1
    expected_result:
      - [1]
      - [2]
      - [3]
      - [4]
      - [5]
      - [6]

  - type: check
    target_name: example-2-2
    expected_result:
      - [2]
      - [4]
      - [6]
      - [8]
      - [10]
      - [12]
