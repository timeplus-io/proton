tags:
  - external_stream
  - materialized view
description: Test External Stream with  builtin data types -> MV with nested SELECT query -> Target Stream
cluster:
  - p1k1
  - p3k1
steps:
  - type: kafka
    name: delete
    topic: test

  - type: kafka
    name: create
    topic: test
    settings:
      partitions: 1
      replication: 1
  - type: wait
    time: 2

  - type: query
    sql: DROP VIEW IF EXISTS test_mv
  - type: wait
    time: 1

  - type: query
    sql: DROP VIEW IF EXISTS test_mv2
  - type: wait
    time: 1

  - type: query
    sql: DROP STREAM IF EXISTS test_target_stream
  - type: wait
    time: 1

  - type: query
    sql: DROP STREAM IF EXISTS test_external_stream
  - type: wait
    time: 1

  - type: query
    sql: CREATE STREAM test_target_stream
        (
          id string,
          cnt int,
          min float,
          max float
        )
  - type: wait
    time: 1

  - type: query
    sql: CREATE EXTERNAL STREAM test_external_stream
        (
          id int, 
          value string,
          float_c float
        )
        SETTINGS type = 'kafka', brokers = 'k1:9092', topic = 'test', data_format='JSONEachRow'
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE MATERIALIZED VIEW test_mv INTO test_target_stream AS
      WITH transformed AS
        (
          SELECT
            to_string(id) AS id, value, float_c
          FROM
            test_external_stream)
      SELECT
        id, count(*) AS cnt, min(float_c) AS min, max(float_c) AS max
      FROM
        transformed
      GROUP BY
        id
  - type: wait
    time: 2

  - name: external-stream-1-0
    type: stream
    query: SELECT id, cnt, min, max FROM test_target_stream
    schema:
    - name: id
      type: string
    - name: cnt
      type: int32
    - name: min
      type: float32
    - name: max
      type: float32
  - type: wait
    time: 1

  - type: kafka
    name: produce
    topic: test
    format: JSONEachRow
    messages:
    - id: 1
      value: sometext1
      float_c: 11.1
    - id: 2
      value: sometext1
      float_c: 22.1
    - id: 2
      value: sometext2
      float_c: 22.2
    - id: 3
      value: sometext1
      float_c: 33.1
    - id: 3
      value: sometext2
      float_c: 33.2
    - id: 3
      value: sometext3
      float_c: 33.3
  - type: wait
    time: 4

  - type: check
    target_name: external-stream-1-0
    mode: random
    expected_result:
    - ['1', 1, 11.1, 11.1]
    - ['2', 2, 22.1, 22.2]
    - ['3', 3, 33.1, 33.3]
