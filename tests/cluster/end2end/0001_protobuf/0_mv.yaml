tags:
  - external_stream
  - materialized view
 # - skip
description: |
  Test External Stream -> MV -> Target Stream
  Steps:
    1. create kafka topic
    2. create external stream with data format Protobuf and created format schema
    3. create a materialized view with target stream
    4. query mv and target stream
    5. produce kafka message with protobuf format
    6. check query result
  
  Block by issue: https://github.com/timeplus-io/proton-enterprise/issues/4350
  Fix version > 2.1.5, skip now
cluster:
  - p1k1
  - p3k1
steps:
  # kafka topic: drop and create
  - type: kafka
    name: delete
    topic: test

  - type: wait
    time: 1

  - type: kafka
    name: create
    topic: test
    settings:
      partitions: 1
      replication: 1

  - type: wait
    time: 1

  # format schema & stream & mv: drop and create
  - type: query
    sql: DROP VIEW IF EXISTS test_mv
  - type: wait
    time: 1

  - type: query
    sql: DROP STREAM IF EXISTS test_target_stream
  - type: wait
    time: 1

  - type: query
    sql: DROP STREAM IF EXISTS test_external_stream
  - type: wait
    time: 1
  
  - type: query
    sql: DROP FORMAT SCHEMA IF EXISTS schema_name0
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE FORMAT SCHEMA schema_name0 AS
      $$
        syntax = "proto3";
        message Sch0 {
          int64  id = 1;
          string value = 2;
        }
      $$
      TYPE Protobuf
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE EXTERNAL STREAM test_external_stream
      (
        id int64,
        value string
      )
      SETTINGS type = 'kafka',
          brokers = 'k1:9092',
          topic = 'test',
          data_format = 'Protobuf',
          format_schema = 'schema_name0:Sch0'
  - type: wait
    time: 1
  
  - type: query
    sql: |
      CREATE STREAM test_target_stream
      (
        id string,
        value string
      )
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE MATERIALIZED VIEW test_mv INTO test_target_stream AS
      SELECT
        to_string(id) AS id, value
      FROM
        test_external_stream

  - type: wait
    time: 2

  # query: external stream
  - type: stream
    name: protobuf-0-0
    query: SELECT * FROM test_external_stream
    schema:
      - name: id
        type: int64
      - name: value
        type: string
  - type: wait
    time: 1
  
  # query: target stream of mv
  - type: stream
    name: protobuf-0-1
    query: SELECT id, value FROM test_target_stream
    schema:
      - name: id
        type: string
      - name: value
        type: string
  - type: wait
    time: 1

  # kafka message: format protobuf and produce kafka message
  - type: protobuf_format
    name: format
    proto: |
      syntax = "proto3";
      message Sch0 {
        int64  id = 1;
        string value = 2;
      }
    class: Sch0
    schema:
      - name: id
        type: int64
      - name: value
        type: string
    inputs:
      - [1, "a"]
      - [2, "b"]
      - [3, "c"]
    buffer_size: 2 # >=2
  - type: wait
    time: 1

  - type: kafka_dataloader
    source: format
    sink: test
    concurrency: 1

  - type: wait
    time: 3
  
  - type: check
    target_name: protobuf-0-0
    expected_result:
      - [1, "a"]
      - [2, "b"]
      - [3, "c"]
  
  - type: check
    target_name: protobuf-0-1
    expected_result:
      - [1, "a"]
      - [2, "b"]
      - [3, "c"]
