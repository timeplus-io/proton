tags:
- limit_by
description: tumble window aggregation limit by
cluster:
- p1k1
- p3k1
steps:
- name: '2001'
  type: stream
  query: select s, count(), sum(i) as total, avg(i), min(i), max(i) from tumble(test20_limit_by_stream, 2s) group by window_start, s order by total desc limit 2 by window_start
  schema:
  - name: s
    type: string
  - name: count()
    type: uint64
  - name: total
    type: int64
  - name: avg(i)
    type: float64
  - name: min(i)
    type: int32
  - name: max(i)
    type: int32
- type: wait
  time: 1

- type: query
  sql: insert into test20_limit_by_stream(i, s, _tp_time) values
  schema:
  - name: i
    type: int32
  - name: s
    type: string
  - name: _tp_time
    type: datetime64(3)
  inputs:
  - [1, 's1', '2022-01-01 00:00:00']
  - [2, 's2', '2022-01-01 00:00:00']
  - [3, 's3', '2022-01-01 00:00:01']
- type: wait
  time: 2

- type: query
  sql: insert into test20_limit_by_stream(i, s, _tp_time) values
  schema:
  - name: i
    type: int32
  - name: s
    type: string
  - name: _tp_time
    type: datetime64(3)
  inputs:
  - [11, 's1', '2022-01-01 00:00:02']
  - [22, 's2', '2022-01-01 00:00:03']
  - [33, 's3', '2022-01-01 00:00:03']
- type: wait
  time: 2

- type: query
  sql: insert into test20_limit_by_stream(i, s, _tp_time) values
  schema:
  - name: i
    type: int32
  - name: s
    type: string
  - name: _tp_time
    type: datetime64(3)
  inputs:
  - [44, 's4', '2022-01-01 00:00:04']

- type: check
  target_name: '2001'
  expected_result:
  - ['s3', 1, 3, 3, 3, 3]
  - ['s2', 1, 2, 2, 2, 2]
  - ['s3', 1, 33, 33, 33, 33]
  - ['s2', 1, 22, 22, 22, 22]
