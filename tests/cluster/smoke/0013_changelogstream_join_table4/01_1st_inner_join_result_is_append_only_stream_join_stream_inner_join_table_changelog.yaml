tags:
  - append_only
  - changelog
  - inner join
  - not supported
  - skip
description: 1st inner join result is append_only(stream join stream) inner join table(changelog)
cluster:
  - p1k1
  - p3k1
steps:
  - type: query
    sql: create stream test14_stream1_4(i int, j int, k string);

  - type: query
    sql: create stream test14_table2_4(i2 int, j2 int, k2 string);

  - type: query
    sql:
      create stream test14_stream3_4(i3 int, j3 int, k3 string) settings
      mode='changelog';

  - type: wait
    time: 2

  - type: query
    sql: insert into test14_stream3_4(i3, j3, k3) values(4, 2, 'c');

  - type: wait
    time: 1

  - type: query
    sql: insert into test14_stream3_4(i3, j3, k3) values(6, 3, '7');

  - type: wait
    time: 1

  - type: query
    sql: insert into test14_stream3_4(i3, j3, k3) values(3, 2, 'e');

  - type: wait
    time: 1

  - type: query
    sql: insert into test14_stream3_4(i3, j3, k3, _tp_delta) values(4, 2, 'c',-1);

  - type: wait
    time: 1

  - type: query
    sql: insert into test14_table2_4(i2, j2, k2) values(1, 2, 'a');

  - type: wait
    time: 1

  - type: query
    sql: insert into test14_table2_4(i2, j2, k2) values(1, 3, 'b');

  - type: wait
    time: 1

  - type: query
    sql: insert into test14_table2_4(i2, j2, k2) values(1, 5, 'b');

  - type: wait
    time: 5

  - name: "14164"
    type: stream
    query:
      with t as (select * from test14_stream1_4 as a join table(test14_table2_4)
      as b on a.j = b.j2) select i, j, k, i2, j2, k2, i3, j3, k3 from t join table(test14_stream3_4)
      as k on t.j = k.j3;
    schema:
      - name: i
        type: int32
      - name: j
        type: int32
      - name: k
        type: string
      - name: i2
        type: int32
      - name: j2
        type: int32
      - name: k2
        type: string
      - name: i3
        type: int32
      - name: j3
        type: int32
      - name: k3
        type: string

  - type: wait
    time: 1

  - type: query
    sql: insert into test14_stream1_4(i, j, k) values(1, 2, 'a');

  - type: wait
    time: 1

  - type: query
    sql: insert into test14_stream1_4(i, j, k) values(1, 3, 'a');

  - type: check
    target_name: "14164"
    expected_result:
      - ["1", "2", a, "1", "2", a, "4", "2", c]
      - ["1", "2", a, "1", "2", a, "3", "2", e]
      - ["1", "2", a, "1", "2", a, "4", "2", c]
      - ["1", "3", a, "1", "3", b, "6", "3", "7"]
