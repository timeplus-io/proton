name: python_udf_pytorch
description: Tests covering the python_udf pytorch library 
tags:
  - smoke
  - python_udf
  - python_udf_library
  - pytorch
arch:
  - x86_64


setup:
  scope: suite
  steps:
    # torch
    - type: command
      node: [p1, p2, p3]
      shell: |
        curl -X POST http://localhost:8123/proton/v1/python_packages -H "Content-Type: text/plain; charset=utf-8" -d $'{"packages": [{"name": "torch"}]}'

    - type: command
      name: python-udf8-1
      node: [p1]
      shell: |
        curl -X GET http://localhost:8123/proton/v1/python_packages  2>/dev/null | jq -c '.data[] | select(.name == "torch") | length > 0'
    
    - type: check
      target_name: python-udf8-1
      expected_result: ['true']
