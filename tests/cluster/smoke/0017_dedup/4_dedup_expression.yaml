tags:
  - dedup
description: dedup with explicit function expression limits
cluster:
  - p1k1
  - p3k1
steps:
  - name: "1800"
    node:
      - p1
    type: stream
    query: select i from dedup(dedup_stream, s:time)
    schema:
      - name: i
        type: int64
  - type: wait
    time: 1

  - name: "1801"
    <<if eq .nodes "1">>
    node: [p1]
    <<else>>
    node: [p2]
    <<end>>
    type: stream
    query: select count() from dedup(dedup_stream, s:time) emit periodic 10s
    schema:
      - name: count()
        type: uint64
  - type: wait
    time: 1
    
  - type: query
    <<if eq .nodes "1">>
    node: [p1]
    <<else>>
    node: [p3]
    <<end>>
    sql: 'insert into dedup_stream(i, s) values (1, ''{"time": "2023-1-1"}'')(2, ''{"time": "2023-1-1"}'')(3, ''{"time": "2023-1-2"}'')'
    schema:
      - name: i
        type: int64
      - name: s
        type: string
  
  - type: check
    target_name: "1800"
    expected_result:
      - - 1
      - - 3

  - type: check
    target_name: "1801"
    expected_result:
      - - 2
