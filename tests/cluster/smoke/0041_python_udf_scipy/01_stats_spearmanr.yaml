tags:
  - uda

description: Test covering simple python uda test

steps:
  - type: query
    sql: drop stream if exists uda_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream uda_stream (x float64, y float64);
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE AGGREGATE FUNCTION getStatsSpearmanr(x float64, y float64) RETURNS float64 LANGUAGE PYTHON AS $$
      import pickle
      import numpy as np
      from scipy import stats

      class getStatsSpearmanr:
          def __init__(self):
              self.spearmanr = 0

          def serialize(self):
              data = {}
              data['spearmanr'] = self.spearmanr
              return pickle.dumps(data)

          def deserialize(self, data):
              data = pickle.loads(data)
              self.spearmanr = data['spearmanr']

          def merge(self, other):
              self.spearmanr = self.spearmanr

          def process(self, xs, ys):
              tmp_spearmanr = stats.spearmanr(xs, ys)[0]
              self.spearmanr = tmp_spearmanr

          def finalize(self):
              return float(self.spearmanr)
      $$;

  - type: wait
    time: 1

  - name: python-udf4-1-1
    type: stream
    query: select getStatsSpearmanr(x, y) as res from uda_stream;
    schema:
      - name: res
        type: float64

  - type: wait
    time: 1

  - type: query
    sql: insert into uda_stream(x, y) values 
        (7.1, 2.8)(7.1, 2.9)(7.2, 2.8)(8.3, 2.6)(9.4, 3.5)(10.5, 4.6)(11.4, 5.0);

  - type: check
    target_name: python-udf4-1-1
    expected_result:
      - [0.7000000000000001]
