tags:
  - udf

description: Test covering simple python udf test

steps:
  - type: query
    sql: drop stream if exists udf_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream udf_stream (value float64);
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_stats_gamma_cdf(value float64) RETURNS float64 LANGUAGE PYTHON AS
      $$
      import numpy as np
      import scipy.stats as stats

      def test_stats_gamma_cdf(value):
          shape = 2
          scale = 1
          res = stats.gamma.cdf(value, shape, scale=scale)
          return res.tolist()
      $$;

  - type: wait
    time: 1

  - name: python-udf4-8-1
    type: stream
    query: select test_stats_gamma_cdf(value) as res, value from udf_stream;
    schema:
      - name: res
        type: float64
      - name: value
        type: float64
  - type: wait
    time: 1

  - type: query
    sql: insert into udf_stream(value) values 
          (0.0)(1.11111111)(2.22222222)(3.33333333)(4.44444444)(5.55555556)
          (6.66666667)(7.77777778)(8.88888889)(10.0);

  - type: check
    target_name: python-udf4-8-1
    expected_result:
      - [0.0, 0.0]
      - [0.30503702533245486, 1.11111111]
      - [0.6508141468609627, 2.22222222]
      - [0.8454126950988619, 3.33333333]
      - [0.9360624670575775, 4.44444444]
      - [0.9746567458477997, 5.55555556]
      - [0.9902431408846756, 6.66666667]
      - [0.9963226191458607, 7.77777778]
      - [0.9986361955534784, 8.88888889]
      - [0.9995006007726127, 10.0]
