tags:
  - udf

description: Test covering simple python udf test

steps:
  - type: query
    sql: drop stream if exists udf_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream udf_stream (value float);
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_stats_beta_cdf(value float) RETURNS float LANGUAGE PYTHON AS
      $$
      import numpy as np
      from scipy.stats import beta

      def test_stats_beta_cdf(value):
          a, b = 2.31, 0.627
          X = np.array(value)
          res = beta.cdf(X, a, b)
          return res.tolist()
      $$;

  - type: wait
    time: 1

  - name: python-udf4-3-1
    type: stream
    query: select test_stats_beta_cdf(value) as res, value from udf_stream;
    schema:
      - name: res
        type: float32
      - name: value
        type: float32
  - type: wait
    time: 1

  - type: query
    sql: insert into udf_stream(value) values (0.001)(0.5)(0.999);

  - type: check
    target_name: python-udf4-3-1
    expected_result:
      - ['5.7226572e-08', 0.001]
      - [0.116056226, 0.5]
      - [0.9764166, 0.999]
