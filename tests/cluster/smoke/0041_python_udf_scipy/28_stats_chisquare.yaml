tags:
  - uda

description: Test covering simple python uda test

steps:
  - type: query
    sql: drop stream if exists uda_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream uda_stream (obs int, exp int);
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE AGGREGATE FUNCTION getChisquare(obs int, exp int) RETURNS float64 LANGUAGE PYTHON AS $$
      import pickle
      from scipy.stats import chisquare

      class getChisquare:
          def __init__(self):
              self.chisquare = 0

          def serialize(self):
              data = {}
              data['chisquare'] = self.chisquare
              return pickle.dumps(data)

          def deserialize(self, data):
              data = pickle.loads(data)
              self.chisquare = data['chisquare']

          def merge(self, other):
              pass

          def process(self, obss, exps):
              res = chisquare(f_obs=obss, f_exp=exps)
              self.chisquare = res.pvalue

          def finalize(self):
              return float(self.chisquare)
      $$;

  - type: wait
    time: 1

  - name: python-udf4-28-1
    type: stream
    query: select getChisquare(obs, exp) as res from uda_stream;
    schema:
      - name: res
        type: float64

  - type: wait
    time: 1

  - type: query
    sql: insert into uda_stream(obs, exp) values (16, 16)(18, 16)(16, 16)(14, 16)(12, 16)(12, 8);

  - type: check
    target_name: python-udf4-28-1
    expected_result:
      - [0.6233876277495822]
