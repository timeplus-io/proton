tags:
  - uda

description: Test covering simple python uda test

steps:
  - type: query
    sql: drop stream if exists uda_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream uda_stream (sample1 float64, sample2 float64);
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE AGGREGATE FUNCTION getKs2samp(sample1 float64, sample2 float64) RETURNS float64 LANGUAGE PYTHON AS $$
      import pickle
      from scipy import stats

      class getKs2samp:
          def __init__(self):
              self.ks_2samp = 0

          def serialize(self):
              data = {}
              data['ks_2samp'] = self.ks_2samp
              return pickle.dumps(data)

          def deserialize(self, data):
              data = pickle.loads(data)
              self.ks_2samp = data['ks_2samp']

          def merge(self, other):
              pass

          def process(self, sample1s, sample2s):
              res = stats.ks_2samp(sample1s, sample2s)
              self.ks_2samp = res.pvalue

          def finalize(self):
              return float(self.ks_2samp)
      $$;

  - type: wait
    time: 1

  - name: python-udf4-31-1
    type: stream
    query: select getKs2samp(sample1, sample2) as res from uda_stream;
    schema:
      - name: res
        type: float64

  - type: wait
    time: 1

  - type: query
    sql: insert into uda_stream(sample1, sample2) values 
          (1.61424402e+01, -8.45720219e+00)
          (6.79626088e+00, 9.29865813e+00)
          (-1.16510342e+01, 7.38705428e+00)
          (7.92685372e+00, 9.28176278e+00);

  - type: check
    target_name: python-udf4-31-1
    expected_result:
      - [1.0]
