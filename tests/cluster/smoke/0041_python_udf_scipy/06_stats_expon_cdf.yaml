tags:
  - udf

description: Test covering simple python udf test

steps:
  - type: query
    sql: drop stream if exists udf_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream udf_stream (value float64);
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_stats_expon_cdf(value float64) RETURNS float64 LANGUAGE PYTHON AS
      $$
      import numpy as np
      import scipy.stats as stats

      def test_stats_expon_cdf(value):
          mean = 55
          res = cdf_values = stats.expon.cdf(value, scale=mean)
          return res.tolist()
      $$;

  - type: wait
    time: 1

  - name: python-udf4-6-1
    type: stream
    query: select test_stats_expon_cdf(value) as res, value from udf_stream;
    schema:
      - name: res
        type: float64
      - name: value
        type: float64
  - type: wait
    time: 1

  - type: query
    sql: insert into udf_stream(value) values (0.0)(1.11111111)(2.22222222)(3.33333333)(4.44444444)(5.55555556)(6.66666667)(7.77777778)(8.88888889)(10.0);

  - type: check
    target_name: python-udf4-6-1
    expected_result:
      - [0.0, 0.0]
      - [0.01999933, 1.11111111]
      - [0.03959868, 2.22222222]
      - [0.05880606, 3.33333333]
      - [0.0776293, 4.44444444]
      - [0.0960761, 5.55555556]
      - [0.11415397, 6.66666667]
      - [0.13187029, 7.77777778]
      - [0.1492323, 8.88888889]
      - [0.16624708, 10.0]
