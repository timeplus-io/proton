tags:
- join
- hybrid hash mode
- materialized view

description: global aggr over global over join, covering memory/hybird hash mode

steps:
- type: query
  sql: drop view if exists test_31_mv1;

- type: query
  sql: drop view if exists test_31_mv2;

- type: wait
  time: 1

- type: query
  sql: drop stream if exists test_31_left_stream;

- type: query
  sql: drop stream if exists test_31_right_stream;

- type: wait
  time: 1

- type: query
  sql: |
    create stream test_31_left_stream (
      i int32,
      s string,
      f float32,
      dt datetime64(3) DEFAULT now64(3)
    );

- type: query
  sql: |
    create stream test_31_right_stream (
      i int32,
      s string,
      f float32,
      dt datetime64(3) DEFAULT now64(3)
    );

- type: wait
  time: 2

- type: query
  sql: |
    create materialized view test_31_mv1 as
    select i, count(), min(sum) from (
      select i, s, max(dt), sum(f) as sum from test_31_left_stream as a
      join test_31_right_stream as b on a.i = b.i group by s, i
    ) group by i emit periodic 1ms
    settings default_hash_table='memory';

- type: query
  sql: |
    create materialized view test_31_mv2 as
    select i, count(), min(sum) from (
      select i, s, max(dt), sum(f) as sum from test_31_left_stream as a
      join test_31_right_stream as b on a.i = b.i group by s, i
    ) group by i emit periodic 1ms
    settings default_hash_table='hybrid';

- type: wait
  time: 2

- name: 3100
  type: stream
  query: select * except (_tp_time) from test_31_mv1;
  schema:
    - name: i
      type: int32
    - name: count()
      type: uint64
    - name: min(sum)
      type: float64

- name: 3101
  type: stream
  query: select * except (_tp_time) from test_31_mv2;
  schema:
    - name: i
      type: int32
    - name: count()
      type: uint64
    - name: min(sum)
      type: float64

- type: wait
  time: 2

- type: query
  sql: |
    insert into test_31_left_stream (i, s, f, dt) values
    (1, 's1', 11.1, '2025-01-01 20:00:00')
    (2, 's2', 22.1, '2025-01-01 20:00:01');

- type: query
  sql: |
    insert into test_31_right_stream (i, s, f, dt) values
    (1, 's1', 11.2, '2025-01-01 20:00:02')
    (1, 's2', 11.3, '2025-01-01 20:00:03')
    (2, 's2', 22.2, '2025-01-01 20:00:04')
    (2, 's2', 22.3, '2025-01-01 20:00:05');

- type: wait
  time: 2

- type: query
  sql: |
    insert into test_31_left_stream (i, s, f, dt) values
    (1, 's1', 11.4, '2025-01-01 20:00:06')
    (1, 's2', 11.5, '2025-01-01 20:00:07')
    (2, 's2', 22.4, '2025-01-01 20:00:08')
    (2, 's2', 22.5, '2025-01-01 20:00:09')
    (3, 's3', 33.1, '2025-01-01 20:00:10')
    (3, 's4', 33.2, '2025-01-01 20:00:11')
    (3, 's5', 33.3, '2025-01-01 20:00:12');

- type: check
  target_name: 3100
  expected_result:
  - [2, 1, 44.2]
  - [1, 1, 22.2]
  - [2, 1, 134]
  - [1, 2, 23]

- type: check
  target_name: 3101
  mode: random
  expected_result:
  - [2, 1, 44.2]
  - [1, 1, 22.2]
  - [2, 1, 134]
  - [1, 2, 23]
