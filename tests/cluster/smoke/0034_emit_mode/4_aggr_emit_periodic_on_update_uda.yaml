tags:
- udf
- emit periodic
- global aggr
- window aggr
description: SQL - UDA emit global/window aggr results periodic on update
cluster:
- p1k1
- p3k1
steps:
- type: wait
  time: 1

- type: query
  sql: DROP STREAM IF EXISTS test_35_stream;
- type: wait
  time: 1

- type: query
  sql: CREATE STREAM test_35_stream (`f32` float);
- type: wait
  time: 1

- type: query
  sql: DROP FUNCTION IF EXISTS test_max_plus;
- type: wait
  time: 1

- type: query
  sql: |
    CREATE AGGREGATE FUNCTION test_max_plus(value float32) RETURNS float32 LANGUAGE JAVASCRIPT AS $$
        {
          initialize: function() {
              this.max = -1.0
          },
          process: function(values) {
            for (let i = 0; i < values.length; i++) {
              if (values[i] > this.max) {
                this.max = values[i]
              }
            }
          },
          finalize: function() {
            return this.max+1
          }, 
          serialize: function() {
            let s = {
              'max': this.max
            };
            return JSON.stringify(s)
          },
          deserialize: function(state_str) {
                                              let s = JSON.parse(state_str);
                                              this.max = s['max']
          },
          merge: function(state_str) {
                                        let s = JSON.parse(state_str);
                                        if (s['max'] >= this.max) {
                                          this.max = s['max']
                                        }
                                      }
          }
    $$;
- type: wait
  time: 5

- type: query
  sql: DROP FUNCTION IF EXISTS test_count;
- type: wait
  time: 1

- type: query
  sql: |
    CREATE AGGREGATE FUNCTION test_count(value float32) RETURNS float32 LANGUAGE JAVASCRIPT AS $$
      {
        initialize: function() {
          this.count = 0;
        },
        
        process: function(values, deltas) {
          let is_changelog = deltas !== undefined;
          for (let i = 0; i < values.length; i++) {
            if (is_changelog) {
              if (deltas[i] === 1) {
                this.count += 1;
              } else if (deltas[i] === -1) 
                this.count -= 1;
            } else 
                this.count += 1;
          }
        },
        
        finalize: function() {
          return this.count;
        },
        
        serialize: function() {
          let s = {
          'count': this.count
          };
          return JSON.stringify(s);
        },
        
        deserialize: function(state_str) {
          let s = JSON.parse(state_str);
          this.count = s['count'];
        },
        
        merge: function(state_str) {
          let s = JSON.parse(state_str);
          this.count += s['count'];
        }
      }
    $$;
- type: wait
  time: 5

- type: stream
  name: emit-mode-5-1
  query: select min(f32), test_max_plus(f32), test_count(f32) from test_35_stream emit periodic 1s
  schema:
  - name: min(f32)
    type: float32
  - name: test_max_plus(f32)
    type: float32
  - name: test_count(f32)
    type: float32
- type: wait
  time: 1

- type: stream
  name: emit-mode-5-2
  query: select f32, test_count(f32) from test_35_stream group by f32 emit periodic 1s
  schema:
  - name: f32
    type: float32
  - name: test_count(f32)
    type: float32
- type: wait
  time: 1

- type: stream
  name: emit-mode-5-3
  query: select window_start, window_end, min(f32), test_max_plus(f32), test_count(f32) from tumble(test_35_stream, 10s) group by window_start, window_end emit periodic 1s
  schema:
  - name: window_start
    type: datetime64(3)
  - name: window_end
    type: datetime64(3)
  - name: min(f32)
    type: float32
  - name: test_max_plus(f32)
    type: float32
  - name: test_count(f32)
    type: float32
- type: wait
  time: 1

- type: stream
  name: emit-mode-5-4
  query: select window_start, window_end, f32, test_count(f32) from tumble(test_35_stream, 10s) group by window_start, window_end, f32 emit periodic 1s
  schema:
  - name: window_start
    type: datetime64(3)
  - name: window_end
    type: datetime64(3)
  - name: f32
    type: float32
  - name: test_count(f32)
    type: float32
- type: wait
  time: 1

- type: stream
  name: emit-mode-5-5
  query: select window_start, window_end, min(f32), test_max_plus(f32), test_count(f32) from hop(test_35_stream, 10s, 30s) group by window_start, window_end emit periodic 1s
  schema:
    - name: window_start
      type: datetime64(3)
    - name: window_end
      type: datetime64(3)
    - name: min(f32)
      type: float32
    - name: test_max_plus(f32)
      type: float32
    - name: test_count(f32)
      type: float32
- type: wait
  time: 1

- type: stream
  name: emit-mode-5-6
  query: select window_start, window_end, min(f32), test_max_plus(f32), test_count(f32) from session(test_35_stream, 5m) group by window_start, window_end emit periodic 1s
  schema:
    - name: window_start
      type: datetime64(3)
    - name: window_end
      type: datetime64(3)
    - name: min(f32)
      type: float32
    - name: test_max_plus(f32)
      type: float32
    - name: test_count(f32)
      type: float32
- type: wait
  time: 1

- type: wait
  time: 2

- type: query
  sql: insert into test_35_stream(f32, _tp_time) values
  schema:
  - name: f32
    type: float32
  - name: _tp_time
    type: datetime64(3)
  inputs:
  - [1, '2024-01-24 10:00:00']
- type: wait
  time: 2

- type: query
  sql: insert into test_35_stream(f32, _tp_time) values
  schema:
  - name: f32
    type: float32
  - name: _tp_time
    type: datetime64(3)
  inputs:
  - [2, '2024-01-24 10:00:05']
- type: wait
  time: 2

- type: query
  sql: insert into test_35_stream(f32, _tp_time) values
  schema:
  - name: f32
    type: float32
  - name: _tp_time
    type: datetime64(3)
  inputs:
  - [3, '2024-01-24 10:00:10']

- type: check
  target_name: emit-mode-5-1
  mode: <<or .aggregation_check_mode "sequence">>
  expected_result:
  - [1, 2, 1]
  - [1, 3, 2]
  - [1, 4, 3]

- type: check
  target_name: emit-mode-5-2
  mode: <<or .aggregation_check_mode "sequence">>
  expected_result:
  - [1, 1]
  - [2, 1]
  - [1, 1]
  - [3, 1]
  - [2, 1]
  - [1, 1]

- type: check
  target_name: emit-mode-5-3
  mode: <<or .aggregation_check_mode "sequence">>
  expected_result:
  - ['2024-01-24 10:00:00+00:00', '2024-01-24 10:00:10+00:00', 1, 2, 1]
  - ['2024-01-24 10:00:00+00:00', '2024-01-24 10:00:10+00:00', 1, 3, 2]
  - ['2024-01-24 10:00:00+00:00', '2024-01-24 10:00:10+00:00', 1, 3, 2]
  - ['2024-01-24 10:00:10+00:00', '2024-01-24 10:00:20+00:00', 3, 4, 1]

- type: check
  target_name: emit-mode-5-4
  mode: <<or .aggregation_check_mode "sequence">>
  expected_result:
  - ['2024-01-24 10:00:00+00:00', '2024-01-24 10:00:10+00:00', 1, 1]
  - ['2024-01-24 10:00:00+00:00', '2024-01-24 10:00:10+00:00', 1, 1]
  - ['2024-01-24 10:00:00+00:00', '2024-01-24 10:00:10+00:00', 2, 1]
  - ['2024-01-24 10:00:00+00:00', '2024-01-24 10:00:10+00:00', 1, 1]
  - ['2024-01-24 10:00:00+00:00', '2024-01-24 10:00:10+00:00', 2, 1]
  - ['2024-01-24 10:00:10+00:00', '2024-01-24 10:00:20+00:00', 3, 1]

- type: check
  target_name: emit-mode-5-5
  mode: <<or .aggregation_check_mode "sequence">>
  expected_result:
  - ['2024-01-24 09:59:40+00:00', '2024-01-24 10:00:10+00:00', 1, 2, 1]
  - ['2024-01-24 09:59:50+00:00', '2024-01-24 10:00:20+00:00', 1, 2, 1]
  - ['2024-01-24 10:00:00+00:00', '2024-01-24 10:00:30+00:00', 1, 2, 1]
  - ['2024-01-24 09:59:40+00:00', '2024-01-24 10:00:10+00:00', 1, 3, 2]
  - ['2024-01-24 09:59:50+00:00', '2024-01-24 10:00:20+00:00', 1, 3, 2]
  - ['2024-01-24 10:00:00+00:00', '2024-01-24 10:00:30+00:00', 1, 3, 2]
  - ['2024-01-24 09:59:40+00:00', '2024-01-24 10:00:10+00:00', 1, 3, 2]
  - ['2024-01-24 09:59:50+00:00', '2024-01-24 10:00:20+00:00', 1, 4, 3]
  - ['2024-01-24 10:00:00+00:00', '2024-01-24 10:00:30+00:00', 1, 4, 3]
  - ['2024-01-24 10:00:10+00:00', '2024-01-24 10:00:40+00:00', 3, 4, 1]

- type: check
  target_name: emit-mode-5-6
  mode: <<or .aggregation_check_mode "sequence">>
  expected_result:
  - ['2024-01-24 10:00:00+00:00', '2024-01-24 10:00:00.001000+00:00', 1, 2, 1]
  - ['2024-01-24 10:00:00+00:00', '2024-01-24 10:00:05.001000+00:00', 1, 3, 2]
  - ['2024-01-24 10:00:00+00:00', '2024-01-24 10:00:10.001000+00:00', 1, 4, 3]
