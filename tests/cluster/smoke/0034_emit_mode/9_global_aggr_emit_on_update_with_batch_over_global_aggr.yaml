tags:
- emit on update with btach
- global aggr
- two level

description: Emit global aggr global results on update with batch

steps:
- type: query
  sql: drop stream if exists test_35_stream;

- type: wait
  time: 1

- type: query
  sql: create stream test_35_stream(i int, s low_cardinality(string));

- type: wait
  time: 2

- type: stream
  name: emit-mode-9-1
  query: |
    select count() from (
      select i, s, min(i), max(i), count() from test_35_stream group by i, s emit on update with batch 1s
    ) emit on update with batch 1s;
  schema:
    - name: count()
      type: uint64

- type: stream
  name: emit-mode-9-2
  query: |
    select s, count() from (
      select i, s, min(i), max(i), count() from test_35_stream group by i, s emit periodic 1ms
    ) group by s emit on update with batch 1s;
  schema:
    - name: s
      type: low_cardinality(string)
    - name: count()
      type: uint64

- type: stream
  name: emit-mode-9-3
  query: |
    select s, count() from (
      select i, s, min(i), max(i), count() from test_35_stream group by i, s emit on update with batch 1s
    ) group by s emit periodic 1ms;
  schema:
    - name: s
      type: low_cardinality(string)
    - name: count()
      type: uint64

- type: stream
  name: emit-mode-9-4
  query: |
    select s, count() from (
      select i, s, min(i), max(i), count() from test_35_stream group by i, s emit on update with batch 1s
    ) group by s emit on update with batch 1s;
  schema:
    - name: s
      type: low_cardinality(string)
    - name: count()
      type: uint64

- type: wait
  time: 1

- type: query
  sql: |
    insert into test_35_stream(i, s, _tp_time) values
    (1, 's1', '2024-01-24 10:00:00');

- type: wait
  time: 1

- type: query
  sql: |
    insert into test_35_stream(i, s, _tp_time) values
    (2, 's1', '2024-01-24 10:00:05')
    (2, 's2', '2024-01-24 10:00:05');

- type: wait
  time: 1

- type: query
  sql: |
    insert into test_35_stream(i, s, _tp_time) values
    (1, 's1', '2024-01-24 10:00:10')
    (2, 's2', '2024-01-24 10:00:10')
    (2, 's3', '2024-01-24 10:00:10')
    (3, 's3', '2024-01-24 10:00:10');

- type: check
  target_name: emit-mode-9-1
  expected_result:
    - [1]
    - [3]
    - [5]

- type: check
  target_name: emit-mode-9-2
  mode: <<or .aggregation_check_mode "sequence">>
  expected_result:
    - ['s1', 1]
    - ['s1', 2]
    - ['s2', 1]
    - ['s1', 2]
    - ['s2', 1]
    - ['s3', 2]

- type: check
  target_name: emit-mode-9-3
  mode: <<or .aggregation_check_mode "sequence">>
  expected_result:
    - ['s1', 1]
    - ['s1', 2]
    - ['s2', 1]
    - ['s1', 2]
    - ['s2', 1]
    - ['s3', 2]

- type: check
  target_name: emit-mode-9-4
  mode: <<or .aggregation_check_mode "sequence">>
  expected_result:
    - ['s1', 1]
    - ['s1', 2]
    - ['s2', 1]
    - ['s1', 2]
    - ['s2', 1]
    - ['s3', 2]
