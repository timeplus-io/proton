tags:
- emit periodic
- window aggr
description: Emit window aggr results periodic
cluster:
- p1k1
- p3k1
steps:
- type: query
  sql: drop stream if exists test_35_stream;
- type: wait
  time: 1

- type: query
  sql: create stream test_35_stream(i int);
- type: wait
  time: 2

- type: stream
  name: emit-mode-2-1
  query: select window_start, window_end, min(i), max(i), count() from tumble(test_35_stream, 10s) group by window_start, window_end emit periodic 1s;
  schema:
    - name: window_start
      type: datetime64(3)
    - name: window_end
      type: datetime64(3)
    - name: min(i)
      type: int32
    - name: max(i)
      type: int32
    - name: count()
      type: uint64
- type: wait
  time: 1

- type: stream
  name: emit-mode-2-2
  query: select window_start, window_end, i, count() from tumble(test_35_stream, 10s) group by window_start, window_end, i emit periodic 1s;
  schema:
    - name: window_start
      type: datetime64(3)
    - name: window_end
      type: datetime64(3)
    - name: i
      type: int32
    - name: count()
      type: uint64
- type: wait
  time: 1

- type: stream
  name: emit-mode-2-3
  query: select window_start, window_end, min(i), max(i), count() from hop(test_35_stream, 10s, 30s) group by window_start, window_end emit periodic 1s;
  schema:
    - name: window_start
      type: datetime64(3)
    - name: window_end
      type: datetime64(3)
    - name: min(i)
      type: int32
    - name: max(i)
      type: int32
    - name: count()
      type: uint64
- type: wait
  time: 1

- type: stream
  name: emit-mode-2-4
  query: select window_start, window_end, min(i), max(i), count() from session(test_35_stream, 5m) group by window_start, window_end emit periodic 1s;
  schema:
    - name: window_start
      type: datetime64(3)
    - name: window_end
      type: datetime64(3)
    - name: min(i)
      type: int32
    - name: max(i)
      type: int32
    - name: count()
      type: uint64
- type: wait
  time: 1

- type: stream
  name: emit-mode-2-5
  query: select min(i), max(i), count() from test_35_stream emit periodic 1s;
  schema:
    - name: min(i)
      type: int32
    - name: max(i)
      type: int32
    - name: count()
      type: uint64
- type: wait
  time: 1

- type: stream
  name: emit-mode-2-6
  query: select i, count() from test_35_stream group by i emit periodic 1s;
  schema:
    - name: i
      type: int32
    - name: count()
      type: uint64
- type: wait
  time: 1

- type: query
  sql: insert into test_35_stream(i, _tp_time) values (1, '2024-01-24 10:00:00');
- type: wait
  time: 2

- type: query
  sql: insert into test_35_stream(i, _tp_time) values (2, '2024-01-24 10:00:05');
- type: wait
  time: 2

- type: query
  sql: insert into test_35_stream(i, _tp_time) values (3, '2024-01-24 10:00:10');

- type: check
  target_name: emit-mode-2-1
  mode: <<or .aggregation_check_mode "sequence">>
  expected_result:
    - ['2024-01-24 10:00:00+00:00', '2024-01-24 10:00:10+00:00', 1, 1, 1]
    - ['2024-01-24 10:00:00+00:00', '2024-01-24 10:00:10+00:00', 1, 2, 2]
    - ['2024-01-24 10:00:00+00:00', '2024-01-24 10:00:10+00:00', 1, 2, 2]
    - ['2024-01-24 10:00:10+00:00', '2024-01-24 10:00:20+00:00', 3, 3, 1]

- type: check
  target_name: emit-mode-2-2
  mode: random
  expected_result:
    - ['2024-01-24 10:00:00+00:00', '2024-01-24 10:00:10+00:00', 1, 1]
    - ['2024-01-24 10:00:00+00:00', '2024-01-24 10:00:10+00:00', 1, 1]
    - ['2024-01-24 10:00:00+00:00', '2024-01-24 10:00:10+00:00', 2, 1]
    - ['2024-01-24 10:00:00+00:00', '2024-01-24 10:00:10+00:00', 1, 1]
    - ['2024-01-24 10:00:00+00:00', '2024-01-24 10:00:10+00:00', 2, 1]
    - ['2024-01-24 10:00:10+00:00', '2024-01-24 10:00:20+00:00', 3, 1]

- type: check
  target_name: emit-mode-2-3
  mode: <<or .aggregation_check_mode "sequence">>
  expected_result:
    - ['2024-01-24 09:59:40+00:00', '2024-01-24 10:00:10+00:00', 1, 1, 1]
    - ['2024-01-24 09:59:50+00:00', '2024-01-24 10:00:20+00:00', 1, 1, 1]
    - ['2024-01-24 10:00:00+00:00', '2024-01-24 10:00:30+00:00', 1, 1, 1]
    - ['2024-01-24 09:59:40+00:00', '2024-01-24 10:00:10+00:00', 1, 2, 2]
    - ['2024-01-24 09:59:50+00:00', '2024-01-24 10:00:20+00:00', 1, 2, 2]
    - ['2024-01-24 10:00:00+00:00', '2024-01-24 10:00:30+00:00', 1, 2, 2]
    - ['2024-01-24 09:59:40+00:00', '2024-01-24 10:00:10+00:00', 1, 2, 2]
    - ['2024-01-24 09:59:50+00:00', '2024-01-24 10:00:20+00:00', 1, 3, 3]
    - ['2024-01-24 10:00:00+00:00', '2024-01-24 10:00:30+00:00', 1, 3, 3]
    - ['2024-01-24 10:00:10+00:00', '2024-01-24 10:00:40+00:00', 3, 3, 1]

- type: check
  target_name: emit-mode-2-4
  mode: <<or .aggregation_check_mode "sequence">>
  expected_result:
  - ['2024-01-24 10:00:00+00:00', '2024-01-24 10:00:00.001000+00:00', 1, 1, 1]
  - ['2024-01-24 10:00:00+00:00', '2024-01-24 10:00:05.001000+00:00', 1, 2, 2]
  - ['2024-01-24 10:00:00+00:00', '2024-01-24 10:00:10.001000+00:00', 1, 3, 3]

- type: check
  target_name: emit-mode-2-5
  mode: <<or .aggregation_check_mode "sequence">>
  expected_result:
    - [1, 1, 1]
    - [1, 2, 2]
    - [1, 3, 3]

- type: check
  target_name: emit-mode-2-6
  mode: <<or .aggregation_check_mode "sequence">>
  expected_result:
    - [1, 1]
    - [2, 1]
    - [1, 1]
    - [3, 1]
    - [2, 1]
    - [1, 1]
