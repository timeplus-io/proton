    - name: window_start
      type: datetime64(3)
    - name: window_end
      type: datetime64(3)
    - name: min(i)
      type: int32
    - name: max(i)
      type: int32
    - name: count()
      type: uint64
- type: wait
  time: 1

- type: stream
  name: emit-mode-7-4
  query: select window_start, window_end, min(i), max(i), count() from hop(test_35_stream, 5s, 10s) group by window_start, window_end emit on update with delay 10s;
  schema:
    - name: window_start
      type: datetime64(3)
    - name: window_end
      type: datetime64(3)
    - name: min(i)
      type: int32
    - name: max(i)
      type: int32
    - name: count()
