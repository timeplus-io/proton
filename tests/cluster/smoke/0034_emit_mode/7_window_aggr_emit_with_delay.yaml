tags:
- local-run
- window aggr
- emit on update
- emit periodic
- with delay
description: Emit window aggr results on update with delay
cluster:
- p1k1
- p3k1
steps:
- type: query
  sql: drop stream if exists test_35_stream;
- type: wait
  time: 1

- type: query
  sql: create stream test_35_stream(i int);
- type: wait
  time: 2

- type: stream
  name: emit-mode-7-1
  query: select window_start, window_end, min(i), max(i), count() from tumble(test_35_stream, 5s) group by window_start, window_end emit on update with delay 10s;
  schema:
    - name: window_start
      type: datetime64(3)
    - name: window_end
      type: datetime64(3)
    - name: min(i)
      type: int32
    - name: max(i)
      type: int32
    - name: count()
      type: uint64
- type: wait
  time: 1

- type: stream
  name: emit-mode-7-2
  query: select window_start, window_end, i, count() from tumble(test_35_stream, 5s) group by window_start, window_end, i emit on update with batch 1ms with delay 10s;
  schema:
    - name: window_start
      type: datetime64(3)
    - name: window_end
      type: datetime64(3)
    - name: i
      type: int32
    - name: count()
      type: uint64
- type: wait
  time: 1

- type: stream
  name: emit-mode-7-3
  query: select window_start, window_end, min(i), max(i), count() from tumble(test_35_stream, 5s) group by window_start, window_end emit periodic 1ms with delay 10s;
