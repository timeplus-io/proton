tags:
  - changelog_stream

description: Test query from materlized view from view smoke cases.
cluster:
  - p1k1
  - p3k1
steps:
  - type: query
    sql: DROP STREAM IF EXISTS test14_subquery;
  - type: wait
    time: 1

  - type: query
    sql: CREATE STREAM test14_subquery (i float, k1 int, k2 string);
  - type: wait
    time: 2

  - type: query
    sql: |
      CREATE VIEW test14_view AS SELECT  i, k1, k2, _tp_delta
      FROM changelog(test14_subquery, k2);
  - type: wait
    time: 1

  - type: query
    sql: CREATE MATERIALIZED VIEW test14_view2 AS SELECT i, k1, k2, _tp_delta FROM test14_view;
  - type: wait
    time: 1

  - name: "1413"
    type: stream
    query: SELECT lag(i, 2), k2 FROM test14_view2;
    schema:
      - name: lag(i, 2)
        type: float32
      - name: k2
        type: string
  - type: wait
    time: 1

  - type: query
    sql: INSERT INTO test14_subquery(i, k1, k2) values (4, 3, 'a');

  - type: query
    sql: INSERT INTO test14_subquery(i, k1, k2) values (2, 3, 'a');

  - type: query
    sql: INSERT INTO test14_subquery(i, k1, k2) values (5, 5, 'b');

  - type: query
    sql: INSERT INTO test14_subquery(i, k1, k2) values (2, 2, 'a');

  - type: query
    sql: INSERT INTO test14_subquery(i, k1, k2) values (8, 5, 'b');

  - type: check
    target_name: "1413"
    expected_result:
      - [0, a]
      - [0, a]
      - [4, a]
      - [4, b]
      - [2, a]
      - [5, a]
      - [2, b]
      - [2, b]
