tags:
- type
- cluster_table_bug
description: low_cardinality(bool)
cluster:
- p1k1
- p3k1
steps:
- type: wait
  time: 2

- type: query
  sql: drop stream if exists lineorder_flat1
- type: wait
  time: 1

- type: query
  sql: |
    CREATE STREAM lineorder_flat1(
      `LO_ORDERKEY` uint32,
      `LO_LINENUMBER` uint8,
      `LO_CUSTKEY` uint32,
      `LO_PARTKEY` uint32,
      `LO_SUPPKEY` uint32,
      `LO_ORDERDATE` date,
      `LO_ORDERPRIORITY` low_cardinality(string),
      `LO_SHIPPRIORITY` uint8,
      `LO_QUANTITY` uint8,
      `LO_EXTENDEDPRICE` uint32,
      `LO_ORDTOTALPRICE` uint32,
      `LO_DISCOUNT` uint8,
      `LO_REVENUE` uint32,
      `LO_SUPPLYCOST` uint32,
      `LO_TAX` uint8,
      `LO_COMMITDATE` date,
      `LO_SHIPMODE` low_cardinality(string),
      `C_NAME` string,
      `C_ADDRESS` string,
      `C_CITY` low_cardinality(string),
      `C_NATION` low_cardinality(string),
      `C_REGION` low_cardinality(string),
      `C_PHONE` string,
      `C_MKTSEGMENT` low_cardinality(string),
      `S_NAME` string,
      `S_ADDRESS` string,
      `S_CITY` low_cardinality(string),
      `S_NATION` low_cardinality(string),
      `S_REGION` low_cardinality(string),
      `S_PHONE` string,
      `P_NAME` string,
      `P_MFGR` low_cardinality(string),
      `P_CATEGORY` low_cardinality(string),
      `P_BRAND` low_cardinality(string),
      `P_COLOR` low_cardinality(string),
      `P_TYPE` low_cardinality(string),
      `P_SIZE` uint8,
      `P_CONTAINER` low_cardinality(string)
    )
    
- type: wait
  time: 3
  
- name: '801'
  type: stream
  query: SELECT  sum(LO_REVENUE), to_year(LO_ORDERDATE) AS year, P_BRAND FROM table(lineorder_flat1)
    WHERE (P_CATEGORY = 'MFGR#12') AND (S_REGION = 'AMERICA') GROUP BY  year, P_BRAND
    ORDER BY  year ASC, P_BRAND ASC
  schema: 
    - name: 'sum(LO_REVENUE)'
      type: 'uint64'
    - name: 'year'
      type: 'uint16'
    - name: 'P_BRAND'
      type: 'low_cardinality(string)'

- type: check
  target_name: '801'
  expected_result: [[]]
