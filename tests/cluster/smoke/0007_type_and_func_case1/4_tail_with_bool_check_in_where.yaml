tags:
  - bool
description: create a stream, tail with bool check in where
cluster:
  - p1k1
  - p3k1
steps:
  - type: query
    sql: drop stream if exists t_bool1

  - type: wait
    time: 1

  - type: query
    sql: create stream t_bool1(id int, value int, bool_f bool, time datetime64(3))

  - type: wait
    time: 2

  - type: query
    sql: insert into t_bool1(id, value, bool_f,time)values(1, -1000, true, '2020-01-02
      00:00:01')(1, -1000,true, '2020-01-03 09:01:02')(1, -1000, false, '2020-01-05
      09:01:03')(1, 3100, false, '2020-01-18 09:01:04')(1, 100,true, '2020-03-09 09:01:05')

  - name: '801'
    type: stream
    query: select id, value, bool_f from t_bool1 where bool_f=true limit 1 settings
      seek_to = 'earliest'
    schema:
      - name: id
        type: int32
      - name: value
        type: int32
      - name: bool_f
        type: bool

  - type: check
    target_name: '801'
    expected_result:
      - [ '1', '-1000', 'True' ]
