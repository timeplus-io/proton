tags:
  - query_state
description: global aggregation state checkpoint with group by
cluster:
  - p1k1
steps:
  - type: query
    sql: drop stream if exists test19_state_stream2

  - type: wait
    time: 1

  - type: query
    sql: create stream test19_state_stream2 (id string, location string, value float,
      timestamp datetime64(3) default now64(3))

  - type: wait
    time: 1

  - name: '1961'
    query_id: '1961'
    type: stream
    query: subscribe to select id, count(*), sum(value), avg(value), min(value), max(value)
      from test19_state_stream2 group by id emit periodic 1s settings checkpoint_interval=1
    schema:
      - name: id
        type: string
      - name: count()
        type: uint64
      - name: sum(value)
        type: float64
      - name: avg(value)
        type: float64
      - name: min(value)
        type: float32
      - name: max(value)
        type: float32

  - type: wait
    time: 1

  - type: query
    sql: insert into test19_state_stream2(id, location, value, timestamp) values ('dev1',
      'ca', 57.3, '2020-02-02 20:00:00'), ('dev1', 'ca', 66, '2020-02-02 20:00:01'),
      ('dev2', 'ca', 58.3, '2020-02-02 20:00:05')

  - type: wait
    time: 3

  - type: query
    sql: kill query where query_id = '1961'

  - type: wait
    time: 1

  - type: query
    sql: unsubscribe to '1961'

  - type: check
    target_name: '1961'
    mode: random
    expected_result:
      - [ dev1, '2', '123.3', '61.65', '57.3', '66' ]
      - [ dev2, '1', '58.3', '58.3', '58.3', '58.3' ]
