tags:
  - query_state
description: recover global aggregation without group by from a state checkpoint
cluster:
  - p1k1
steps:
  - type: query
    sql: drop stream if exists test19_state_stream2

  - type: wait
    time: 1

  - type: query
    sql: create stream test19_state_stream2 (id string, location string, value float,
      timestamp datetime64(3) default now64(3))

  - type: wait
    time: 1

  - name: '1959'
    query_id: '1959'
    type: stream
    query: subscribe to select count(), sum(value), avg(value), min(value), max(value)
      from test19_state_stream2 emit periodic 1s settings checkpoint_interval=1
    schema:
      - name: count()
        type: uint64
      - name: sum(value)
        type: float64
      - name: avg(value)
        type: float64
      - name: min(value)
        type: float32
      - name: max(value)
        type: float32

  - type: wait
    time: 2

  - type: query
    sql: insert into test19_state_stream2(id, location, value, timestamp) values ('dev1',
      'ca', 57.3, '2020-02-02 20:00:00'), ('dev1', 'ca', 66, '2020-02-02 20:00:01'),
      ('dev2', 'ca', 58.3, '2020-02-02 20:00:05')

  - type: wait
    time: 3

  - type: query
    sql: kill query where query_id = '1959'

  - type: wait
    time: 1

  - type: query
    sql: insert into test19_state_stream2(id, location, value, timestamp) values ('dev2',
      'ca', 80, '2020-02-02 20:00:02'), ('dev8', 'ca', 67, '2020-02-02 20:00:02'), ('dev8',
      'ca', 77, '2020-02-02 20:00:08')

  - type: wait
    time: 2

  - name: 1959-1
    query_id: 1959-1
    type: stream
    query: recover from '1959'
    schema:
      - name: count()
        type: uint64
      - name: sum(value)
        type: float64
      - name: avg(value)
        type: float64
      - name: min(value)
        type: float32
      - name: max(value)
        type: float32
        
  - type: wait
    time: 3

  - type: query
    sql: kill query where query_id='1959' sync

  - type: wait
    time: 1

  - type: query
    sql: unsubscribe to '1959'

  - type: check
    target_name: '1959'
    expected_result:
      - [ '3', '181.6', '60.533333', '57.3', '66' ]

  - type: check
    target_name: 1959-1
    expected_result:
      - [ '6', '405.6', '67.6', '57.3', '80' ]
