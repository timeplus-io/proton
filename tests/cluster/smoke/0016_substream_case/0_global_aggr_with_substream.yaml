tags:
  - local-run
  - global aggr
  - substream
  - not_supported_hybrid # Substream aggregating does not support hybrid aggregator
description: global aggregation with substream
cluster:
  - p1k1
  - p3k1
steps:
  - name: "1700"
    node:
      - p1
    type: stream
    query: select id, sum(val_i) from test17_substream partition by id order by id emit periodic 8s
    schema:
      - name: id
        type: uint64
      - name: sum(val_i)
        type: int64
  - type: wait
    time: 1

  - name: "1701"
    <<if eq .nodes "1">>
    node: [p1]
    <<else>>
    node: [p2]
    <<end>>
    type: stream
    query: select id, count(val_s), sum(val_i), max(val_i64), min(val_f) from test17_substream partition by id order by id emit periodic 8s
    schema:
      - name: id
        type: uint64
      - name: count(val_s)
        type: uint64
      - name: sum(val_i)
        type: int64
      - name: max(val_i64)
        type: int64
      - name: min(val_f)
        type: float64  
  - type: wait
    time: 1

  - name: "1702"
    <<if eq .nodes "1">>
    node: [p1]
    <<else>>
    node: [p3]
    <<end>>
    type: stream
    query: select id, count(val_s), sum(val_i), max(val_i64), min(val_f) from test17_substream partition by id order by id emit periodic 8s
    schema:
      - name: id
        type: uint64
      - name: count(val_s)
        type: uint64
      - name: sum(val_i)
        type: int64
      - name: max(val_i64)
        type: int64
      - name: min(val_f)
        type: float64  
  - type: wait
    time: 1

  - name: "1703"
    node:
      - p1
    type: stream
    query: select to_timezone(val_date, 'UTC'), id, sum(val_i) from test17_substream partition by val_date group by id order by val_date, id emit periodic 8s
    schema:
      - name: to_timezone(val_date, 'UTC')
        type: datetime64(3)
      - name: id
        type: uint64
      - name: sum(val_i)
        type: int64
  - type: wait
    time: 1

  - type: query
    sql: |
      insert into test17_substream(id, val_i, val_i64, val_f, val_s, val_date, timestamp) values
        (1, 1, 10000, 5.6, '11', '2020-02-02 20:00:00+00:00', '2020-02-02 20:00:00+00:00')
        (1, 2, 10010, 7.6, '12', '2020-02-02 20:00:06+00:00', '2020-02-02 20:00:01+00:00')
        (1, 3, 10012, 12.6, '13', '2020-02-02 20:00:00+00:00', '2020-02-02 20:00:03+00:00')
        (2, 21, 20000, 25.6, '21', '2020-02-02 20:00:00+00:00', '2020-02-02 20:00:00+00:00')
        (3, 31, 30000, 35.6, '31', '2020-02-02 20:00:00+00:00', '2020-02-02 20:00:00+00:00')
        (3, 32, 30010, 37.6, '32', '2020-02-02 20:00:00+00:00', '2020-02-02 20:00:01+00:00')
        (2, 22, 20010, 27.6, '22', '2020-02-02 20:00:01+00:00', '2020-02-02 20:00:01+00:00')
        (2, 23, 20012, 212.6, '23', '2020-02-02 20:00:02+00:00', '2020-02-02 20:00:03+00:00')
        (1, 6, 10050, 27.34, '16', '2020-02-02 20:00:06+00:00', '2020-02-02 20:00:08+00:00');

  - type: query
