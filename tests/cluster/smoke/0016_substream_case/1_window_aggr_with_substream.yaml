tags:
  - window aggr
  - substream
  - not_supported_hybrid # Substream aggregating does not support hybrid aggregator
description: tumble/hop aggregation with substream
cluster:
  - p1k1
  - p3k1
steps:
  - name: "1700"
    node:
      - p1
    type: stream
    query: select id, window_start, window_end, sum(val_i) from tumble(test17_substream, 2s) partition by id group by window_start, window_end order by id, window_start
    schema:
      - name: id
        type: uint64
      - name: window_start
        type: datetime64(3)
      - name: window_end
        type: datetime64(3)
      - name: sum(val_i)
        type: int64
  - type: wait
    time: 2

  - name: "1701"
    <<if eq .nodes "1">>
    node: [p1]
    <<else>>
    node: [p2]
    <<end>>
    type: stream
    query: select id, window_start, count(val_s), sum(val_i), max(val_i64), min(val_f) from tumble(test17_substream, 5s) partition by id group by window_start order by id, window_start
    schema:
      - name: id 
        type: uint64
      - name: window_start
        type: datetime64(3)
      - name: count(val_s)
        type: uint64        
      - name: sum(val_i)
        type: int64
      - name: max(val_i64)
        type: int64        
      - name: min(val_f)
        type: float64   

  - name: "1702"
    <<if eq .nodes "1">>
    node: [p1]
    <<else>>
    node: [p3]
    <<end>>
    type: stream
    query: select id, window_start, count(val_s), sum(val_i), max(val_i64), min(val_f) from tumble(test17_substream, 5s) partition by id group by window_start order by id, window_start
    schema:
      - name: id 
        type: uint64
      - name: window_start
        type: datetime64(3)
      - name: count(val_s)
        type: uint64        
      - name: sum(val_i)
        type: int64
      - name: max(val_i64)
        type: int64        
      - name: min(val_f)
        type: float64 

  - name: "1703"
    node:
      - p1
    type: stream
    query: select to_timezone(val_date, 'UTC'), window_end, id, sum(val_i) from tumble(test17_substream, 2s) partition by val_date group by window_end, id order by val_date, window_end, id
    schema:
      - name: to_timezone(val_date, 'UTC')
        type: datetime64(3)
      - name: window_end
        type: datetime64(3)
      - name: id 
        type: uint64     
      - name: sum(val_i)
        type: int64
  - type: wait
    time: 2

  - type: query
    sql: |
      insert into test17_substream(id, val_i, val_i64, val_f, val_s, val_date, timestamp) values
        (1, 1, 10000, 5.6, '11', '2020-02-02 20:00:00+00:00', '2020-02-02 20:00:00+00:00')
        (1, 2, 10010, 7.6, '12', '2020-02-02 20:00:06+00:00', '2020-02-02 20:00:01+00:00')
        (1, 3, 10012, 12.6, '13', '2020-02-02 20:00:00+00:00', '2020-02-02 20:00:03+00:00')
