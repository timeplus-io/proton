tags:
  - local-run
  - versioned_kv_subquery/view/materialized_view
  - global_aggregation
  - gtoup_by_primary_key
description: subquery from view from view
cluster:
  - p1k1
  - p3k1
steps:
  - type: query
    sql:
      create stream test14_subquery_8(i float, k1 int, k2 string) primary key k2 settings mode='versioned_kv';
  - type: wait
    time: 2

  - type: query
    sql:
      create view test14_view1_8 as (select i, k1, k2, _tp_delta from
      test14_subquery_8);
  - type: wait
    time: 2

  - type: query
    sql: create view test14_view2_8 as (select * from test14_view1_8);
  - type: wait
    time: 2

  - name: "1448"
    type: stream
    query: select max(i), min(i), avg(i) from test14_view2_8 emit periodic 1s;
    schema:
      - name: max(i)
        type: float32
      - name: min(i)
        type: float32
      - name: avg(i)
        type: float64
  - type: wait
    time: 2

  - type: query
    sql: insert into test14_subquery_8(i, k1, k2) values (1, 2, 'a');

  - type: wait
    time: 2

  - type: query
    sql: insert into test14_subquery_8(i, k1, k2) values (3, 3, 'b');

  - type: wait
    time: 2

  - type: query
    sql: insert into test14_subquery_8(i, k1, k2) values (5, 1, 'c');

  - type: wait
    time: 2

  - type: query
    sql: insert into test14_subquery_8(i, k1, k2) values (8, 2, 'a');

  - type: wait
    time: 2

  - type: query
    sql: insert into test14_subquery_8(i, k1, k2) values (9, 3, 'b');

  - type: wait
    time: 2

  - type: query
    sql: insert into test14_subquery_8(i, k1, k2) values (11, 2, 'b');

  - type: wait
    time: 2

  - type: query
    sql: insert into test14_subquery_8(i, k1, k2) values (10, 1, 'c');

  - type: wait
    time: 2

  - type: query
    sql: insert into test14_subquery_8(i, k1, k2) values (14, 2, 'b');

  - type: check
    target_name: "1448"
    expected_result:
      - [1, 1, 1]
      - [3, 1, 2]
      - [5, 1, 3]
      - [8, 3, 5.33333333333]
      - [9, 5, 7.33333333333]
      - [11, 5, 8]
      - [11, 8, 9.6666666666]
      - [14, 8, 10.666666666]
