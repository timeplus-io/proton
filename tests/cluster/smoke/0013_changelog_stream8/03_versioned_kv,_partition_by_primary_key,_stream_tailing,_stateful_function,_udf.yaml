tags:
  - versioned_kv_subquery/view/materialized_view
  - global_aggregation
  - gtoup_by_primary_key
description:
  versioned_kv, partition by primary key, stream tailing, stateful function,
  udf
cluster:
  - p1k1
  - p3k1
steps:
  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_14_8_add_five(value float32) RETURNS float32 LANGUAGE JAVASCRIPT AS $$
        function test_14_8_add_five(value) {
            for (let i = 0; i < value.length; i++) {
                value[i] = value[i] + 5;
            }
            return value;
        }
      $$;
  - type: wait
    time: 2

  - type: query
    sql:
      create stream test14_substream_8(val int, id int, name string)
      primary key id settings mode='versioned_kv';
  - type: wait
    time: 2

  - name: "1451"
    type: stream
    query:
      select val, id, lag(val, 2), test_14_8_add_five(val), name from test14_substream_8
      partition by id;
    schema:
      - name: val
        type: int32
      - name: id
        type: int32
      - name: lag(val, 2)
        type: int32
      - name: test_14_8_add_five(val)
        type: float32
      - name: name
        type: string
  - type: wait
    time: 2

  - type: query
    sql: insert into test14_substream_8(val, id, name) values (1, 2, 'a');

  - type: wait
    time: 2

  - type: query
    sql: insert into test14_substream_8(val, id, name) values (3, 3, 'b');

  - type: wait
    time: 2

  - type: query
    sql: insert into test14_substream_8(val, id, name) values (5, 1, 'c');

  - type: wait
    time: 2

  - type: query
    sql: insert into test14_substream_8(val, id, name) values (8, 2, 'a');

  - type: wait
    time: 2

  - type: query
    sql: insert into test14_substream_8(val, id, name) values (9, 3, 'b');

  - type: wait
    time: 2

  - type: query
    sql: insert into test14_substream_8(val, id, name) values (11, 2, 'b');

  - type: wait
    time: 2

  - type: query
    sql: insert into test14_substream_8(val, id, name) values (10, 1, 'c');

  - type: wait
    time: 2

  - type: query
    sql: insert into test14_substream_8(val, id, name) values (14, 2, 'b');

  - type: check
    mode: random
    target_name: "1451"
    expected_result:
      - [1, 2, 0, 6, a]
      - [3, 3, 0, 8, b]
      - [5, 1, 0, 10, c]
      - [8, 2, 0, 13, a]
      - [9, 3, 0, 14, b]
      - [11, 2, 1, 16, b]
      - [10, 1, 0, 15, c]
      - [14, 2, 8, 19, b]
