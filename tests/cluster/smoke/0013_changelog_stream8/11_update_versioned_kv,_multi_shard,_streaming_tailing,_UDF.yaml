tags:
  - versioned_kv
  - multi_shard
  - streaming_tailing
  - UDF
description: update versioned_kv, multi_shard, streaming_tailing, UDF
cluster:
  - p1k1
  - p3k1
steps:
  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_14_8_add_five(value float32) RETURNS float32 LANGUAGE JAVASCRIPT AS $$
        function test_14_8_add_five(value) {
            for (let i = 0; i < value.length; i++) {
                value[i] = value[i] + 5;
            }
            return value;
        }
      $$;
  - type: wait
    time: 1

  - type: query
    sql: |
      create stream if not exists test14_multishard_8(i float, k1 int, k2 string) primary key k2
      settings mode='versioned_kv', shards=3;
  - type: wait
    time: 2

  - name: "1459"
    type: stream
    query: |
      select test_14_8_add_five(i),
             k1,
             k2
      from test14_multishard_8;
    schema: 
      - name: test_14_8_add_five(i)
        type: float32
      - name: k1
        type: int32
      - name: k2
        type: string
  - type: wait
    time: 2

  - type: query
    sql: |
      insert into test14_multishard_8(i, k1, k2)
      values (2, 1, 'a');
  - type: wait
    time: 2

  - type: query
    sql: |
      insert into test14_multishard_8(i, k1, k2)
      values (1, 2, 'a');
  - type: wait
    time: 2

  - type: query
    sql: |
      insert into test14_multishard_8(i, k1, k2)
      values (3, 3, 'b');
  - type: wait
    time: 2

  - type: query
    sql: |
      insert into test14_multishard_8(i, k1, k2)
      values (2, 4, 'b');
  - type: wait
    time: 2

  - type: query
    sql: |
      insert into test14_multishard_8(i, k1, k2)
      values (5, 5, 'c');
  - type: wait
    time: 2

  - type: query
    sql: |
      insert into test14_multishard_8(i, k1, k2)
      values (5, 1, 'b');

  - type: check
    target_name: "1459"
    expected_result:
      - [7, 1, a]
      - [6, 2, a]
      - [8, 3, b]
      - [7, 4, b]
      - [10, 5, c]
      - [10, 1, b]
