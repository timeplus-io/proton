tags:
  - local-run
  - query state
  - query state compatibility
  - in subquery
description: recover the query with in subquery
cluster:
  - p1k1
#  - p3k1
steps:
  - type: query
    sql: drop stream if exists fixed_issues2_stream;

  - type: wait
    time: 1

  - type: query
    sql: create stream fixed_issues2_stream(i int);

  - type: wait
    time: 2

  - type: query
    sql: insert into fixed_issues2_stream(i) values(1);

  - type: wait
    time: 2

  - name: fixed-issues2-1
    query_id: fixed-issues2-1
    type: stream
    query: subscribe to select i in (select i from table(fixed_issues2_stream)) as i1, multi_if(i
      in (select i from table(fixed_issues2_stream)), 1, 0) as t from fixed_issues2_stream
      settings seek_to='earliest', checkpoint_interval=1;
    schema:
      - name: i1
        type: bool
      - name: t
        type: uint8

  - type: wait
    time: 2

  - name: fixed-issues2-2
    query_id: fixed-issues2-2
    type: stream
    query: subscribe to with cte as (select 1), cte2 as (select multi_if(i in (cte),
      '1', '2') as t from fixed_issues2_stream where t = '1') select t from cte2 settings
      seek_to='earliest', checkpoint_interval=1
    schema:
      - name: t
        type: string

  - type: wait
    time: 3

  - type: query
    sql: kill query where query_id='fixed-issues2-1' or query_id='fixed-issues2-2';

  - type: wait
    time: 1

  - name: fixed-issues2-1-1
    query_id: fixed-issues2-1-1
    type: stream
    query: recover from 'fixed-issues2-1';
    schema:
      - name: i1
        type: bool
      - name: t
        type: uint8

  - type: wait
    time: 1

  - name: fixed-issues2-2-1
    query_id: fixed-issues2-2-1
    type: stream
    query: recover from 'fixed-issues2-2';
    schema:
      - name: t
        type: string

  - type: wait
    time: 1

  - type: query
    sql: insert into fixed_issues2_stream(i) values(1);

  - type: wait
    time: 3

  - type: query
    sql: unsubscribe to 'fixed-issues2-1';

  - type: query
    sql: unsubscribe to 'fixed-issues2-2';

  - type: check
    target_name: fixed-issues2-1
    expected_result:
      - [ 'True', 1 ]

  - type: check
    target_name: fixed-issues2-1-1
    expected_result:
      - [ 'True', 1 ]

  - type: check
    target_name: fixed-issues2-2
    expected_result:
      - [ '1' ]

  - type: check
    target_name: fixed-issues2-2-1
    expected_result:
      - [ '1' ]
