tags:
- query_state
- window
description: hop window query from view state checkpoint
cluster:
- p1k1

steps:
- type: wait
  time: 1

- type: query
  sql: drop view if exists test19_state_view6
- type: wait
  time: 1

- type: query
  sql: drop stream if exists test19_state_stream6
- type: wait
  time: 1

- type: query
  sql: create stream test19_state_stream6 (id string, location string, value float,
    timestamp datetime64(3) default now64(3))
- type: wait
  time: 1

- type: query
  sql: create view if not exists test19_state_view6 as select id, max(value), window_start,
    window_end from hop(test19_state_stream6, timestamp, 3s, 5s) group by id, window_start,
    window_end emit stream
- type: wait
  name: 1

- name: '19158'
  type: stream
  query_id: '19158'
  query: subscribe to select * from test19_state_view6 settings checkpoint_interval=1
  schema:
  - name: id
    type: string
  - name: max(value)
    type: float32
  - name: window_start
    type: datetime64(3)
  - name: window_end
    type: datetime64(3)
- type: wait
  time: 1

- type: query
