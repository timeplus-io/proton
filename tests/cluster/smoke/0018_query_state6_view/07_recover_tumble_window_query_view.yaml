tags:
- query_state
- aggr
description: recover tumble window query from view from state checkpoint
cluster:
- p1k1

steps:
- type: wait
  time: 1

- type: query
  sql: drop view if exists test19_state_view6
- type: wait
  time: 1

- type: query
  sql: drop stream if exists test19_state_stream6
- type: wait
  time: 1

- type: query
  sql: create stream test19_state_stream6 (id string, location string, value float,
    timestamp datetime64(3) default now64(3))
- type: wait
  time: 1

- type: query
  sql: 'create view if not exists test19_state_view6 as select id, sum(value), window_start,
    window_end from tumble(test19_state_stream6, timestamp, 5s) group by id, window_start,
    window_end emit stream '

- type: wait
  name: 1

- name: '19157'
  type: stream
  query_id: '19157'
  query: subscribe to select * from test19_state_view6 settings checkpoint_interval=1
  schema:
  - name: id
    type: string
  - name: sum(value)
    type: float64
  - name: window_start
    type: datetime64(3)
  - name: window_end
    type: datetime64(3)
- type: wait
  time: 1

- type: query
  sql: insert into test19_state_stream6(id, location, value, timestamp) values ('dev1',
    'ca', 57.3, '2020-02-02 20:00:00')
  schema:
  - name: id
    type: string
  - name: location
    type: string
  - name: value
    type: float32
  - name: timestamp
    type: datetime64(3)
  inputs:
  - [dev1, 'ca', 57.3, '2020-02-02 20:00:00']
- type: wait
  time: 1

- type: query
  sql: insert into test19_state_stream6(id, location, value, timestamp) values ('dev1',
    'ca', 66, '2020-02-02 20:00:02')
  schema:
  - name: id
    type: string
  - name: location
    type: string
  - name: value
    type: float32
  - name: timestamp
    type: datetime64(3)
  inputs:
  - [dev1, 'ca', 66, '2020-02-02 20:00:02']
- type: wait
  time: 1

- type: query
  sql: insert into test19_state_stream6(id, location, value, timestamp) values ('dev2',
    'ca', 58.3, '2020-02-02 20:00:04')
  schema:
  - name: id
    type: string
  - name: location
    type: string
  - name: value
    type: float32
  - name: timestamp
    type: datetime64(3)
  inputs:
  - [dev2, 'ca', 58.3, '2020-02-02 20:00:04']
- type: wait
  time: 1

- type: query
  sql: insert into test19_state_stream6(id, location, value, timestamp) values ('dev2',
    'ca', 80, '2020-02-02 20:00:08')
  schema:
  - name: id
    type: string
  - name: location
    type: string
  - name: value
    type: float32
  - name: timestamp
    type: datetime64(3)
  inputs:
  - [dev2, 'ca', 80, '2020-02-02 20:00:08']
- type: wait
  time: 1

- type: query
  sql: kill query where query_id = '19157'
- type: wait
  time: 3

- type: query
  sql: insert into test19_state_stream6(id, location, value, timestamp) values ('dev8',
    'ca', 67, '2020-02-02 20:00:06')
  schema:
  - name: id
    type: string
  - name: location
    type: string
  - name: value
    type: float32
  - name: timestamp
    type: datetime64(3)
  inputs:
  - [dev8, 'ca', 67, '2020-02-02 20:00:06']
- type: wait
  time: 1

- type: query
  sql: insert into test19_state_stream6(id, location, value, timestamp) values ('dev8',
    'ca', 77, '2020-02-02 20:00:07')
  schema:
  - name: id
    type: string
  - name: location
    type: string
  - name: value
    type: float32
  - name: timestamp
    type: datetime64(3)
  inputs:
  - [dev8, 'ca', 77, '2020-02-02 20:00:07']
- type: wait
  time: 1

- type: query
  sql: insert into test19_state_stream6(id, location, value, timestamp) values ('dev6',
    'ca', 66, '2020-02-02 20:00:11')
  schema:
  - name: id
    type: string
  - name: location
    type: string
  - name: value
    type: float32
  - name: timestamp
    type: datetime64(3)
  inputs:
  - [dev6, 'ca', 66, '2020-02-02 20:00:11']
- type: wait
  name: 3

- name: 19157-1
  type: stream
  query: recover from '19157'
  schema:
  - name: id
    type: string
  - name: sum(value)
    type: float64
  - name: window_start
    type: datetime64(3)
  - name: window_end
    type: datetime64(3)
- type: wait
  time: 1

- type: wait
  time: 1
- type: query
  sql: unsubscribe to '19157'

- type: check
  target_name: '19157'
  mode: random
  expected_result:
  - [dev1, 123.3, '2020-02-02 20:00:00', '2020-02-02 20:00:05']
  - [dev2, 58.3, '2020-02-02 20:00:00', '2020-02-02 20:00:05']

- type: check
  target_name: 19157-1
  mode: random
  expected_result:
  - [dev2, 80, '2020-02-02 20:00:05', '2020-02-02 20:00:10']
  - [dev8, 144, '2020-02-02 20:00:05', '2020-02-02 20:00:10']
