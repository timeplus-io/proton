tags:
- query_state
- window
description: recover session window query from view from state checkpoint
cluster:
- p1k1

steps:
- type: wait
  time: 1

- type: query
  sql: drop view if exists test19_state_view6
- type: wait
  time: 1

- type: query
  sql: drop stream if exists test19_state_stream6
- type: wait
  time: 1

- type: query
  sql: create stream test19_state_stream6 (id string, location string, value float,
    timestamp datetime64(3) default now64(3))
- type: wait
  time: 1

- type: query
  sql: create view if not exists test19_state_view6 as select id, max(value), window_start,
    window_end from session(test19_state_stream6, timestamp, 2s) group by id, window_start,
    window_end
- type: wait
  name: 1

- name: '19161'
  type: stream
  query_id: '19161'
  query: subscribe to select * from test19_state_view6 settings checkpoint_interval=1
  schema:
  - name: id
    type: string
  - name: max(value)
    type: float32
  - name: window_start
    type: datetime64(3)
  - name: window_end
    type: datetime64(3)
- type: wait
  time: 1

- type: query
  sql: insert into test19_state_stream6(id, location, value, timestamp) values ('dev1', 'ca', 57.3, '2020-02-02 20:00:00')
  schema:
  - name: id
    type: string
  - name: location
    type: string
  - name: value
    type: float32
  - name: timestamp
    type: datetime64(3)
  inputs:
  - ['dev1', 'ca', 57.3, '2020-02-02 20:00:00']
- type: wait
  time: 1

- type: query
  sql: insert into test19_state_stream6(id, location, value, timestamp) values ('dev2', 'ca', 58.3, '2020-02-02 20:00:00')
  schema:
  - name: id
    type: string
  - name: location
    type: string
  - name: value
    type: float32
  - name: timestamp
    type: datetime64(3)
  inputs:
  - ['dev2', 'ca', 58.3, '2020-02-02 20:00:00']
- type: wait
  time: 1

- type: query
  sql: insert into test19_state_stream6(id, location, value, timestamp) values ('dev1',
    'ca', 60, '2020-02-02 20:00:01')
  schema:
  - name: id
    type: string
  - name: location
    type: string
  - name: value
    type: float32
  - name: timestamp
    type: datetime64(3)
  inputs:
  - ['dev1', 'ca', 60, '2020-02-02 20:00:01']
- type: wait
  time: 1

- type: query
  sql: insert into test19_state_stream6(id, location, value, timestamp) values ('dev2',
    'ca', 66, '2020-02-02 20:00:03')
  schema:
  - name: id
    type: string
  - name: location
    type: string
  - name: value
    type: float32
  - name: timestamp
    type: datetime64(3)
  inputs:
  - ['dev2', 'ca', 66, '2020-02-02 20:00:03']
- type: wait
  time: 1

- type: query
  sql: kill query where query_id = '19161'
- type: wait
  time: 3

- type: query
  sql: insert into test19_state_stream6(id, location, value, timestamp) values ('dev3',
    'ca', 58.3, '2020-02-02 20:00:05')
  schema:
  - name: id
    type: string
  - name: location
    type: string
  - name: value
    type: float32
  - name: timestamp
    type: datetime64(3)
  inputs:
  - ['dev3', 'ca', 58.3, '2020-02-02 20:00:05']
- type: wait
  name: 2

- name: 19161-1
  type: stream
  query: recover from '19161'
  schema:
  - name: id
    type: string
  - name: max(value)
    type: float32
  - name: window_start
    type: datetime64(3)
  - name: window_end
    type: datetime64(3)
- type: wait
  time: 2

- type: query
  sql: unsubscribe to '19161'

- type: check
  target_name: '19161'
  mode: random
  expected_result:
  - [dev1, 60, '2020-02-02 20:00:00', '2020-02-02 20:00:03']
  - [dev2, 58.3, '2020-02-02 20:00:00', '2020-02-02 20:00:03']

- type: check
  target_name: 19161-1
  expected_result:
  - [dev2, 66, '2020-02-02 20:00:03', '2020-02-02 20:00:05']
