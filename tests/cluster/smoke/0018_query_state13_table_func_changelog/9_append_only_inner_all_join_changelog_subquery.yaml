tags:
- table_func_changelog
- inner-join
description: append-only inner all join changelog(subquery) state checkpoint
cluster:
- p1k1

steps:
- type: query
  sql: drop stream if exists test19_left_stream4;
- type: query
  sql: drop stream if exists test19_right_stream4;
- type: wait
  time: 1

- type: query
  sql: create stream if not exists test19_left_stream4 (i int, k string);
- type: wait
  time: 1

- type: query
  sql: create stream if not exists test19_right_stream4 (j int, kk string);
- type: wait
  time: 1

- name: '19409'
  type: stream
  query_id: '19409'
  query: subscribe to with cte as (select j, kk from test19_right_stream4) select
    i, k, j, kk from test19_left_stream4 as a left join changelog(cte,
    kk) as b on a.i == b.j settings checkpoint_interval=1;
  schema:
  - name: i
    type: int32
  - name: k
    type: string
  - name: j
    type: int32
  - name: kk
    type: string
- type: wait
  time: 2

- type: query
  sql: insert into test19_right_stream4 (j, kk) values
  schema:
  - name: j
    type: int32
  - name: kk
    type: string
  inputs:
  - [1, 'kk1']
- type: wait
  time: 1

- type: query
  sql: insert into test19_left_stream4 (i, k) values
  schema:
  - name: i
    type: int32
  - name: k
    type: string
  inputs:
  - [1, 'k1']
- type: wait
  time: 1

- type: query
  sql: kill query where query_id = '19409'
- type: wait
  time: 3

- type: query
  sql: insert into test19_right_stream4 (j, kk) values
  schema:
  - name: j
    type: int32
  - name: kk
    type: string
  inputs:
  - [2, 'kk1']

- name: 19409-1
  type: stream
  query: recover from '19409'
  schema:
  - name: i
    type: int32
  - name: k
    type: string
  - name: j
    type: int32
  - name: kk
    type: string
- type: wait
  time: 1

- type: query
  sql: insert into test19_left_stream4 (i, k) values (3, 'k2');
  schema:
  - name: j
    type: int32
  - name: kk
    type: string
  inputs:
  - [3, 'k2']
- type: wait
  time: 1

- type: query
  sql: insert into test19_left_stream4 (i, k) values
  schema:
  - name: i
    type: int32
  - name: k
    type: string
  inputs:
  - [2, 'k1']
- type: wait
  time: 2

- type: query
  sql: kill query where query_id = '19409' sync

- type: query
  sql: unsubscribe to '19409'

- type: check
  target_name: '19409'
  expected_result:
  - [1, k1, 1, kk1]

- type: check
  target_name: 19409-1
  mode: random
  expected_result:
  - [2, k1, 2, kk1]
  - [3, k2, 0, '']
