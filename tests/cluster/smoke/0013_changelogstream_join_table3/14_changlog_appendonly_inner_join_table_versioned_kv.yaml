tags:
  - changlog(appendonly)
  - table(versioned_kv)
  - left join
description: changlog(appendonly) inner join table(versioned_kv)
cluster:
  - p1k1
  - p3k1
steps:
  - type: query
    sql: drop stream if exists test14_stream_3;
  - type: wait
    time: 1

  - type: query
    sql: drop stream if exists test14_table_3;
  - type: wait
    time: 1

  - type: query
    sql:
      create stream test14_stream_3(i int64, j int64, k string) primary
      key j settings mode='versioned_kv';
  - type: wait
    time: 1

  - type: query
    sql:
      create stream test14_table_3(ii int64, jj int64, kk string) primary
      key jj settings mode='versioned_kv';
  - type: wait
    time: 2
  
  - type: query
    sql: insert into test14_table_3(ii, jj, kk) values(1, 2, 'a');
    schema:
      - name: ii
        type: int64
      - name: jj
        type: int64
      - name: kk
        type: string
  - type: wait
    time: 1
  
  - type: query
    sql: insert into test14_table_3(ii, jj, kk) values(1, 3, 'b');
    schema:
      - name: ii
        type: int64
      - name: jj
        type: int64
      - name: kk
        type: string
  - type: wait
    time: 1
  
  - type: query
    sql: insert into test14_table_3(ii, jj, kk) values(1, 5, 'b');
    schema:
      - name: ii
        type: int64
      - name: jj
        type: int64
      - name: kk
        type: string
  - type: wait
    time: 1
  
  - type: query
    sql: insert into test14_table_3(ii, jj, kk) values(4, 2, 'f');
    schema:
      - name: ii
        type: int64
      - name: jj
        type: int64
      - name: kk
        type: string
  - type: wait
    time: 5
  
  - name: "14157"
    type: stream
    query:
      select i, j, k, ii, jj, kk, _tp_delta from changelog(test14_stream_3, true)
      as a left join table(test14_table_3) as b on a.j = b.jj;
    schema:
      - name: i
        type: int64
      - name: j
        type: int64
      - name: k
        type: string
      - name: ii
        type: int64
      - name: jj
        type: int64
      - name: kk
        type: string
      - name: _tp_delta
        type: int8
  - type: wait
    time: 1
  
  - type: query
    sql: insert into test14_stream_3(i, j, k) values(1, 2, 'a');
    schema:
      - name: i
        type: int64
      - name: j
        type: int64
      - name: k
        type: string
  
  - type: check
    target_name: "14157"
    expected_result:
      - ["1", "2", a, "4", "2", f, "1"]

  - type: query
    sql: insert into test14_stream_3(i, j, k) values(1, 3, 'a');
    schema:
      - name: i
        type: int64
      - name: j
        type: int64
      - name: k
        type: string
  
  - type: check
    target_name: "14157"
    expected_result:
      - ["1", "3", a, "1", "3", b, "1"]

  - type: query
    sql: insert into test14_stream_3(i, j, k) values(1, 7, 'a');
    schema:
      - name: i
        type: int64
      - name: j
        type: int64
      - name: k
        type: string
  
  - type: check
    target_name: "14157"
    expected_result:
      - ["1", "7", a, "0", "0", "", "1"]

  - type: query
    sql: insert into test14_stream_3(i, j, k) values(4, 2, 'g');
    schema:
      - name: i
        type: int64
      - name: j
        type: int64
      - name: k
        type: string

  - type: check
    target_name: "14157"
    expected_result:
      - ["1", "2", a, "4", "2", f, "-1"]
      - ["4", "2", g, "4", "2", f, "1"]
