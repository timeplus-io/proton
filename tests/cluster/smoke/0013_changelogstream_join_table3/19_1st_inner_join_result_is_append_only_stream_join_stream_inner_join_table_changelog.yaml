tags:
  - append_only
  - changelog
  - inner join
  - not supported
  - skip
description: 1st inner join result is append_only(stream join stream) inner join table(changelog)
cluster:
  - p1k1
  - p3k1
steps:
  - type: query
    sql: drop stream if exists test14_stream1;

  - type: query
    sql: drop stream if exists test14_table2;

  - type: query
    sql: drop stream if exists test14_stream3;

  - type: wait
    time: 1

  - type: query
    sql: create stream test14_stream1(i int64, j int64, k string);

  - type: query
    sql: create stream test14_table2(i2 int64, j2 int64, k2 string);

  - type: query
    sql:
      create stream test14_stream3(i3 int64, j3 int64, k3 string) settings
      mode='changelog';

  - type: wait
    time: 2
  
  - type: query
    sql: insert into test14_stream3(i3, j3, k3) values(4, 2, 'c');

  - type: wait
    time: 1
  
  - type: query
    sql: insert into test14_stream3(i3, j3, k3) values(6, 3, '7');

  - type: wait
    time: 1
  
  - type: query
    sql: insert into test14_stream3(i3, j3, k3) values(3, 2, 'e');

  - type: wait
    time: 1
  
  - type: query
    sql: insert into test14_stream3(i3, j3, k3, _tp_delta) values(4, 2, 'c',-1);

  - type: wait
    time: 5

  - name: "14162"
    type: stream
    query:
      with t as (select * from test14_stream1 join test14_table2 on test14_stream1.j
      = test14_table2.j2) select i, j, k, i2, j2, k2, i3, j3, k3 from t join table(test14_stream3)
      as k on t.j = k.j3;
    schema:
      - name: i
        type: int64
      - name: j
        type: int64
      - name: k
        type: string
      - name: ii
        type: int64
      - name: jj
        type: int64
      - name: kk
        type: string
      - name: _tp_delta
        type: int8
  - type: wait
    time: 1
  
  - type: query
    sql: insert into test14_table2(i2, j2, k2) values(1, 2, 'a');
    schema:
      - name: i2
        type: int64
      - name: j2
        type: int64
      - name: k2
        type: string  
  - type: wait
    time: 1
  
  - type: query
    sql: insert into test14_stream1(i, j, k) values(1, 2, 'a');
  
  - type: check
    target_name: "14162"
    mode: random
    expected_result:
      - ["1", "2", a, "1", "2", a, "4", "2", c]
      - ["1", "2", a, "1", "2", a, "3", "2", e]
      - ["1", "2", a, "1", "2", a, "4", "2", c]

  - type: query
    sql: insert into test14_stream1(i, j, k) values(1, 3, 'a');

  - type: wait
    time: 1
  
  - type: query
    sql: insert into test14_table2(i2, j2, k2) values(1, 3, 'b');

  - type: check
    target_name: "14162"
    expected_result:
      - ["1", "3", a, "1", "3", b, "6", "3", "7"]

  - type: query
    sql: insert into test14_stream1(i, j, k) values(5, 2, 'a');

  - type: wait
    time: 1
 
  - type: query
    sql: insert into test14_table2(i2, j2, k2) values(1, 5, 'b');

  - type: check
    target_name: "14162"
    mode: random
    expected_result:
      - ["5", "2", a, "1", "2", a, "4", "2", c]
      - ["5", "2", a, "1", "2", a, "3", "2", e]
      - ["5", "2", a, "1", "2", a, "4", "2", c]
