tags:
- query_state
- view
- dedup
description: dedup on stream by calculated field as key as view state checkpoint
cluster:
- p1k1

steps:
- type: wait
  time: 1

- type: query
  sql: drop view if exists test19_state_view7
- type: wait
  time: 1

- type: query
  sql: drop stream if exists test19_state_stream7
- type: wait
  time: 1

- type: query
  sql: create stream test19_state_stream7(id int, value int, time datetime64(3,'UTC'))
- type: wait
  time: 1

- type: query
  sql: create view if not exists test19_state_view7 as select id, value, time, to_string(time)
    as time_string from dedup(test19_state_stream7, id, value, to_string(time))
- type: wait
  name: 1

- name: '19166'
  type: stream
  query_id: '19166'
  query: subscribe to select emit_version(), id, count(), window_start, window_end
    from tumble(test19_state_view7, time, 5s) group by id, window_start, window_end
    settings checkpoint_interval=1
  schema:
  - name: emit_version()
    type: int64
  - name: id
    type: int32
  - name: count()
    type: uint64
  - name: window_start
    type: datetime64(3)
  - name: window_end
    type: datetime64(3)
- type: wait
  time: 1

- type: query
  sql: insert into test19_state_stream7(id, value, time) values
  schema:
  - name: id
    type: int32
  - name: value
    type: int32
  - name: time
    type: datetime64(3)
  inputs:
  - [1, 10, '2020-01-01 00:00:00']
  - [2, 10, '2020-01-01 00:00:00']
  - [3, 10, '2020-01-01 00:00:00']
  - [1, 10, '2020-01-01 00:00:00']
  - [2, 10, '2020-01-01 00:00:00']
  - [3, 10, '2020-01-01 00:00:00']
  - [1, 10, '2020-01-01 00:00:05']
  - [1, 10, '2020-01-01 00:00:06']
- type: wait
  time: 1

- type: query
  sql: insert into test19_state_stream7(id, value, time) values
  schema:
  - name: id
    type: int32
  - name: value
    type: int32
  - name: time
    type: datetime64(3)
  inputs:
  - [1, 10, '2020-01-01 00:00:07']
  - [2, 10, '2020-01-01 00:00:07']
  - [3, 10, '2020-01-01 00:00:07']
  - [1, 10, '2020-01-01 00:00:07']
  - [2, 10, '2020-01-01 00:00:07']
  - [3, 10, '2020-01-01 00:00:07']
  - [1, 10, '2020-01-01 00:00:11']
  - [1, 10, '2020-01-01 00:00:12']
- type: wait
  time: 1

- type: query
  sql: unsubscribe to '19166'

- type: check
  target_name: '19166'
  mode: random
  expected_result:
  - [0, 3, 1, '2020-01-01 00:00:00+00:00', '2020-01-01 00:00:05+00:00']
  - [0, 2, 1, '2020-01-01 00:00:00+00:00', '2020-01-01 00:00:05+00:00']
  - [0, 1, 1, '2020-01-01 00:00:00+00:00', '2020-01-01 00:00:05+00:00']
  - [1, 3, 1, '2020-01-01 00:00:05+00:00', '2020-01-01 00:00:10+00:00']
  - [1, 2, 1, '2020-01-01 00:00:05+00:00', '2020-01-01 00:00:10+00:00']
  - [1, 1, 3, '2020-01-01 00:00:05+00:00', '2020-01-01 00:00:10+00:00']
