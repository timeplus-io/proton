tags:
- query_state
- materialized view
description: materialized view with union selects state checkpoint
cluster:
- p1k1

steps:
- type: query
  sql: drop view if exists test19_state_mv7
- type: wait
  time: 1

- type: query
  sql: drop stream if exists test19_state_stream7
- type: wait
  time: 1

- type: query
  sql: create stream test19_state_stream7 (id string, location string, value float,
    timestamp datetime64(3) default now64(3))
- type: wait
  time: 1

- type: query
  sql: create materialized view test19_state_mv7 as (select id, sum(value) as sum_value
    from test19_state_stream7 group by id limit 4 union select id, sum(value) as sum_value
    from test19_state_stream7 group by id limit 4)
- type: wait
  name: 1

- name: '19176'
  type: stream
  query_id: '19176'
  query: subscribe to select id, sum_value from test19_state_mv7 settings checkpoint_interval=1
  schema:
  - name: id
    type: string
  - name: sum_value
    type: float64
- type: wait
  time: 1

- type: query
  sql: insert into test19_state_stream7(id, location, value, timestamp) values ('dev1',
    'ca', 57.3, '2020-02-02 20:00:00')('dev2', 'ca', 58.3, '2020-02-02 20:00:03')
- type: wait
  time: 2

- type: query
  sql: insert into test19_state_stream7(id, location, value, timestamp) values ('dev1',
    'ca', 69, '2020-02-02 20:00:06')('dev4', 'ca', 67, '2020-02-02 20:00:10')
- type: wait
  time: 2

- type: query
  sql: unsubscribe to '19176'

- type: query
  sql: drop view if exists test19_state_mv7

- type: check
  target_name: '19176'
  mode: random
  expected_result:
  - [dev1, 57.29999923706055]
  - [dev2, 58.29999923706055]
  - [dev1, 57.29999923706055]
  - [dev2, 58.29999923706055]
  - [dev1, 126.29999923706055]
  - [dev2, 58.29999923706055]
  - [dev1, 126.29999923706055]
  - [dev2, 58.29999923706055]
