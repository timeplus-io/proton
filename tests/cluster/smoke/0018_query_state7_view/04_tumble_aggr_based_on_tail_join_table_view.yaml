tags:
- query_state
- view
- dedup
description: tumble aggr based on tail join table view state checkpoint
cluster:
- p1k1

steps:
- type: wait
  time: 1

- type: query
  sql: drop view if exists test19_state_view7
- type: wait
  time: 1

- type: query
  sql: drop stream if exists test19_state_stream7
- type: wait
  time: 1

- type: query
  sql: create stream test19_state_stream7 (id string, location string, value float,
    timestamp datetime64(3) default now64(3))
- type: wait
  time: 1

- type: query
  sql: create view if not exists test19_state_view7 as select a.id, b.type, a.value,
    a.timestamp from test19_state_stream7 as a join table(view_join) as b on a.id
    = b.id
- type: wait
  name: 1

- name: '19168'
  type: stream
  query_id: '19168'
  query: subscribe to select emit_version(), id, type, count(), sum(value), min(value),
    max(value), window_start, window_end from tumble(test19_state_view7, timestamp,
    5s) group by id, type, window_start, window_end settings checkpoint_interval=1
  schema:
  - name: emit_version()
    type: int64
  - name: id
    type: string
  - name: type
    type: string
  - name: count()
    type: uint64
  - name: sum(value)
    type: float64
  - name: min(value)
    type: float32
  - name: max(value)
    type: float32
  - name: window_start
    type: datetime64(3)
  - name: window_end
    type: datetime64(3)
- type: wait
  time: 1

- type: query
  sql: insert into test19_state_stream7(id, location, value, timestamp) values
  schema:
  - name: id
    type: string
  - name: location
    type: string
  - name: value
    type: float32
  - name: timestamp
    type: datetime64(3)
  inputs:
  - [dev1, 'ca', 58.3, '2020-02-02 20:00:01']
- type: wait
  time: 1

- type: query
  sql: insert into test19_state_stream7(id, location, value, timestamp) values
  schema:
  - name: id
    type: string
  - name: location
    type: string
  - name: value
    type: float32
  - name: timestamp
    type: datetime64(3)
  inputs:
  - [dev1, 'ca', 59, '2020-02-02 20:00:02']
- type: wait
  time: 1

- type: query
  sql: insert into test19_state_stream7(id, location, value, timestamp) values
  schema:
  - name: id
    type: string
  - name: location
    type: string
  - name: value
    type: float32
  - name: timestamp
    type: datetime64(3)
  inputs:
  - [dev2, 'ca', 66, '2020-02-02 20:00:03']
- type: wait
  time: 1

- type: query
  sql: insert into test19_state_stream7(id, location, value, timestamp) values
  schema:
  - name: id
    type: string
  - name: location
    type: string
  - name: value
    type: float32
  - name: timestamp
    type: datetime64(3)
  inputs:
  - [dev1, 'ca', 77, '2020-02-02 20:00:04']
- type: wait
  time: 1

- type: query
  sql: insert into test19_state_stream7(id, location, value, timestamp) values
  schema:
  - name: id
    type: string
  - name: location
    type: string
  - name: value
    type: float32
  - name: timestamp
    type: datetime64(3)
