tags:
- query_state
- materialized view
description: recover streaming tail from materialized view as hop window aggregation
  state checkpoint
cluster:
- p1k1

steps:
- type: wait
  time: 1

- type: query
  sql: drop view if exists test19_state_mv7
- type: wait
  time: 1

- type: query
  sql: drop view if exists test19_state_view7
- type: wait
  time: 1

- type: query
  sql: drop stream if exists test19_state_stream7
- type: wait
  time: 1

- type: query
  sql: create stream test19_state_stream7 (id string, location string, value float,
    timestamp datetime64(3) default now64(3))
- type: wait
  time: 1

- type: query
  sql: create materialized view test19_state_mv7 as select id, count(value) as sum_value,
    window_start as win_start, window_end as win_end from hop(test19_state_stream7,
    timestamp, 3s, 5s) group by id, window_start, window_end
- type: wait
  name: 1

- name: '19175'
  query_id: '19175'
  type: stream
  query: subscribe to select id, sum_value, win_start, win_end from test19_state_mv7
    settings checkpoint_interval=1
  schema:
  - name: id
    type: string
  - name: sum_value
    type: uint64
  - name: win_start
    type: datetime64(3)
  - name: win_end
    type: datetime64(3)
- type: wait
  time: 1

- type: query
  sql: insert into test19_state_stream7(id, location, value, timestamp) values ('dev1',
    'ca', 57.3, '2020-02-02 20:00:00')
  schema:
  - name: id
    type: string
  - name: location
    type: string
  - name: value
    type: float32
  - name: timestamp
    type: datetime64(3)
  inputs:
  - [dev1, 'ca', 57.3, '2020-02-02 20:00:00']
- type: wait
  time: 1

- type: query
  sql: insert into test19_state_stream7(id, location, value, timestamp) values ('dev2',
    'ca', 58.3, '2020-02-02 20:00:03')
  schema:
  - name: id
    type: string
  - name: location
    type: string
  - name: value
    type: float32
  - name: timestamp
    type: datetime64(3)
  inputs:
  - [dev2, 'ca', 58.3, '2020-02-02 20:00:03']
- type: wait
  time: 1

- type: query
  sql: insert into test19_state_stream7(id, location, value, timestamp) values ('dev6',
    'ca', 66, '2020-02-02 20:00:04')
  schema:
  - name: id
    type: string
  - name: location
    type: string
  - name: value
    type: float32
  - name: timestamp
    type: datetime64(3)
  inputs:
  - [dev6, 'ca', 66, '2020-02-02 20:00:04']
- type: wait
  time: 1

- type: query
  sql: insert into test19_state_stream7(id, location, value, timestamp) values ('dev6',
    'ca', 69, '2020-02-02 20:00:06')
  schema:
  - name: id
    type: string
  - name: location
    type: string
  - name: value
    type: float32
  - name: timestamp
    type: datetime64(3)
  inputs:
  - [dev6, 'ca', 69, '2020-02-02 20:00:06']
- type: wait
  time: 1

- type: query
  sql: kill query where query_id = '19175'
- type: wait
  time: 3

- type: query
  sql: insert into test19_state_stream7(id, location, value, timestamp) values ('dev8',
    'ca', 68, '2020-02-02 20:00:07')
  schema:
  - name: id
    type: string
  - name: location
    type: string
  - name: value
    type: float32
  - name: timestamp
    type: datetime64(3)
  inputs:
  - [dev8, 'ca', 68, '2020-02-02 20:00:07']
- type: wait
  time: 1

- type: query
  sql: insert into test19_state_stream7(id, location, value, timestamp) values ('dev8',
    'ca', 67, '2020-02-02 20:00:10')
  schema:
  - name: id
    type: string
  - name: location
    type: string
  - name: value
    type: float32
  - name: timestamp
    type: datetime64(3)
  inputs:
  - [dev8, 'ca', 67, '2020-02-02 20:00:10']
- type: wait
  time: 4

- name: 19175-1
  type: stream
  query: recover from '19175'
  schema:
  - name: id
    type: string
  - name: sum_value
    type: uint64
  - name: win_start
    type: datetime64(3)
  - name: win_end
    type: datetime64(3)
- type: wait
  time: 1

- type: wait
  time: 1
- type: query
  sql: unsubscribe to '19175'

- type: query
  sql: drop view if exists test19_state_mv7
- type: check
  target_name: '19175'
  expected_result:
  - [dev1, 1, '2020-02-02 19:59:57', '2020-02-02 20:00:02']
  - [dev2, 1, '2020-02-02 20:00:00', '2020-02-02 20:00:05']
  - [dev1, 1, '2020-02-02 20:00:00', '2020-02-02 20:00:05']
  - [dev6, 1, '2020-02-02 20:00:00', '2020-02-02 20:00:05']

- type: check
  target_name: 19175-1
  expected_result:
  - [dev2, 1, '2020-02-02 20:00:03', '2020-02-02 20:00:08']
  - [dev8, 1, '2020-02-02 20:00:03', '2020-02-02 20:00:08']
  - [dev6, 2, '2020-02-02 20:00:03', '2020-02-02 20:00:08']
