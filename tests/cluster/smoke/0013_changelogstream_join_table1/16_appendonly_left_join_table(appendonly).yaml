    expected_result:
      - - "5"
        - "2"
        - a
        - "1"
        - "2"
        - a
      - - "5"
        - "2"
        - a
        - "3"
        - "2"
        - f

  - type: query
    node:
      - p1
    sql: insert into test14_stream_1(i, j, k) values(1, 7, 'a');
    schema:
      - name: i
        type: int64
      - name: j
        type: int64     
