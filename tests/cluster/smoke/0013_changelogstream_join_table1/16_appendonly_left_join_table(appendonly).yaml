  - p3k1
steps:
  - type: query
    node:
      - p1
    sql: drop stream if exists test14_stream_1;
  - type: wait
    time: 1

  - type: query
    <<if eq .nodes "1">>
    node: [p1]
    <<else>>
    node: [p2]
    <<end>>
    sql: drop stream if exists test14_table_1;
  - type: wait
    time: 1

  - type: query
    <<if eq .nodes "1">>
    node: [p1]
    <<else>>
    node: [p3]
    <<end>>
    sql: create stream test14_stream_1(i int64, j int64, k string);
  - type: wait
    time: 1

  - type: query
    node:
      - p1
    sql: create stream test14_table_1(ii int64, jj int64, kk string);
  - type: wait
    time: 3

  - type: query
    <<if eq .nodes "1">>
    node: [p1]
    <<else>>
    node: [p2]
    <<end>>
    sql: insert into test14_table_1(ii, jj, kk) values(1, 2, 'a');

  - type: wait
    time: 1

  - type: query
    <<if eq .nodes "1">>
    node: [p1]
    <<else>>
    node: [p3]
    <<end>>
