    node: [p1]
    <<else>>
    node: [p3]
    <<end>>
    type: stream
    query: select i, j, k, ii, jj, kk from test14_stream_1 as a left join table(test14_table_1) as b on a.j = b.jj;
    schema:
      - name: i
        type: int64
      - name: j
        type: int64     
      - name: k
        type: string
      - name: ii
        type: int64
      - name: jj
        type: int64     
      - name: kk
        type: string
  - type: wait
    time: 2

  - type: query
    node:
      - p1
    sql: insert into test14_stream_1(i, j, k) values(1, 2, 'a');

  - type: check
    target_name: "14119"
    mode: random
    expected_result:
      - - "1"
        - "2"
        - a
        - "1"
        - "2"
        - a
      - - "1"
        - "2"
        - a
        - "3"
        - "2"
        - f

  - type: query
    <<if eq .nodes "1">>
    node: [p1]
    <<else>>
    node: [p2]
    <<end>>
    sql: insert into test14_stream_1(i, j, k) values(1, 3, 'a');
    schema:
      - name: i
        type: int64
      - name: j
        type: int64     
      - name: k
        type: string

  - type: check
    target_name: "14119"
    expected_result:
      - - "1"
        - "3"
        - a
        - "1"
        - "3"
        - b

  - type: query
