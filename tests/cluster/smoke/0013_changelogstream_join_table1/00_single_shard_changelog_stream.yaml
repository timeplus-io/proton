tags:
  - local-run
  - changelog_stream
description: single shard changelog stream creation and query
cluster:
  - p1k1
  - p3k1
steps:
  - name: "14103"
    node:
      - p1
    type: stream
    query: select i, _tp_delta from changelog_stream;
    schema: 
      - name: i
        type: int64
      - name: _tp_delta
        type: int8
  - type: wait
    time: 2

  - type: query
    <<if eq .nodes "1">>
    node: [p1]
    <<else>>
    node: [p2]
    <<end>>
    sql: insert into changelog_stream(i) values (1)
    schema: 
      - name: i
        type: int64

  - type: check
    target_name: "14103"
    expected_result:
      - - 1
        - 1

  - type: query
    <<if eq .nodes "1">>
    node: [p1]
    <<else>>
    node: [p3]
    <<end>>
    sql: insert into changelog_stream(i, _tp_delta) values (1, -1)
    schema: 
      - name: i
        type: int64
      - name: _tp_delta
        type: int8

  - type: check
    target_name: "14103"
    expected_result:
      - - 1
        - -1
