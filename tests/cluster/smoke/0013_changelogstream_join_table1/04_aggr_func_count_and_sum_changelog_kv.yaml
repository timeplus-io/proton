tags:
  - changelog_kv_aggr
description: aggregation function count and sum changelog_kv
cluster:
  - p1k1
  - p3k1
steps:
  - type: query
    node:
      - p1
    sql: drop stream if exists test14_changelog_kv_stream
  - type: wait
    time: 1

  - type: query
    <<if eq .nodes "1">>
    node: [p1]
    <<else>>
    node: [p2]
    <<end>>
    sql: create stream test14_changelog_kv_stream(id int64, val float64) primary key id settings mode='changelog_kv'
  - type: wait
    time: 2

  - type: query
    <<if eq .nodes "1">>
    node: [p1]
    <<else>>
    node: [p3]
    <<end>>
    sql: insert into test14_changelog_kv_stream(id, val) values (1, 1.1), (2, 2.2), (3, 3.3)
    schema:
      - name: id
        type: int64
      - name: val
        type: float64      
  - type: wait
    time: 1
  
  - name: "14107"
    node:
      - p1
    type: stream
    query: select count(val), min(val), max(val), sum(val), avg(val) from test14_changelog_kv_stream emit periodic 1s
    schema:
      - name: count(val)
        type: uint64
      - name: min(val)
        type: float64 
      - name: max(val)
        type: float64     
      - name: sum(val)
        type: float64
      - name: avg(val)
        type: float64

  - type: check
    target_name: "14107"
    expected_result:
      - - "3"
        - "1.1"
        - "3.3"
        - "6.6"
        - "2.1999999999999997"

  - name: 14107-2
    <<if eq .nodes "1">>
    node: [p1]
    <<else>>
    node: [p2]
    <<end>>
    type: stream
    query: select count_if(val, val > 2), min_if(val, val > 2), max_if(val, val > 2), sum_if(val, val > 2), avg_if(val, val > 2) from test14_changelog_kv_stream emit periodic 1s
    schema:
      - name: count_if(val, val > 2)
        type: uint64
      - name: min_if(val, val > 2)
        type: float64 
      - name: max_if(val, val > 2)
        type: float64     
      - name: sum_if(val, val > 2)
        type: float64
      - name: avg_if(val, val > 2)
        type: float64

  - type: check
    target_name: 14107-2
    expected_result:
      - - "2"
        - "2.2"
        - "3.3"
        - "5.5"
        - "2.75"

  - type: query
    <<if eq .nodes "1">>
    node: [p1]
    <<else>>
    node: [p3]
    <<end>>
    sql: insert into test14_changelog_kv_stream(id, val) values (4, 4.4), (5, 5.5)
    schema:
      - name: id
        type: int64
      - name: val
        type: float64

  - type: check
    target_name: "14107"
    expected_result:
      - - "5"
        - "1.1"
        - "5.5"
        - "16.5"
        - "3.3"

  - type: check
    target_name: 14107-2
    expected_result:
      - - "4"
        - "2.2"
        - "5.5"
        - "15.4"
        - "3.85"

  - type: query
    node:
      - p1
    sql: insert into test14_changelog_kv_stream(id, val, _tp_delta) values (3, 3.3, -1)
    schema:
      - name: id
        type: int64
      - name: val
        type: float64     
      - name: _tp_delta
        type: int8

  - type: check
    target_name: "14107"
    expected_result:
      - - "4"
        - "1.1"
        - "5.5"
        - "13.2"
        - "3.3"

  - type: check
    target_name: 14107-2
    expected_result:
      - - "3"
        - "2.2"
        - "5.5"
        - "12.100000000000001"
        - "4.033333333333333"

  - type: query
    <<if eq .nodes "1">>
    node: [p1]
    <<else>>
    node: [p2]
    <<end>>
    sql: insert into test14_changelog_kv_stream(id, val, _tp_delta) values (1, 1.1, -1)
    schema:
      - name: id
        type: int64
      - name: val
        type: float64     
      - name: _tp_delta
        type: int8

  - type: check
    target_name: "14107"
    expected_result:
      - - "3"
        - "2.2"
        - "5.5"
        - "12.1"
        - "4.033333333333333"

  - type: check
    target_name: 14107-2
    expected_result:
      - - "3"
        - "2.2"
        - "5.5"
        - "12.1"
        - "4.033333333333333"

  - type: query
    <<if eq .nodes "1">>
    node: [p1]
    <<else>>
    node: [p3]
    <<end>>
    sql: insert into test14_changelog_kv_stream(id, val, _tp_delta) values (5, 5.5, -1)
    schema:
      - name: id
        type: int64
      - name: val
        type: float64     
      - name: _tp_delta
        type: int8

  - type: check
    target_name: "14107"
    expected_result:
      - - "2"
        - "2.2"
        - "4.4"
        - "6.6"
        - "3.3"

  - type: check
    target_name: 14107-2
    expected_result:
      - - "2"
        - "2.2"
        - "4.4"
        - "6.600000000000001"
        - "3.3000000000000007"
