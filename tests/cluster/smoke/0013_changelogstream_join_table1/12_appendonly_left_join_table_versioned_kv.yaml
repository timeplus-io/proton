tags:
  - appendonly
  - table(versioned_kv)
  - left join
description: appendonly left join table(versioned_kv)
cluster:
  - p1k1
  - p3k1
steps:
  - type: query
    sql: drop stream if exists test14_stream_1;
  - type: wait
    time: 1

  - type: query
    sql: drop stream if exists test14_table_1;
  - type: wait
    time: 1

  - type: query
    sql: create stream test14_stream_1(i int, j int, k string);

  - type: query
    sql:
      create stream test14_table_1(ii int, jj int, kk string) primary
      key jj settings mode='versioned_kv';
  - type: wait
    time: 2

  - type: query
    sql: insert into test14_table_1(ii, jj, kk) values(1, 2, 'a');
  - type: wait
    time: 1

  - type: query
    sql: insert into test14_table_1(ii, jj, kk) values(1, 3, 'b');
  - type: wait
    time: 1

  - type: query
    sql: insert into test14_table_1(ii, jj, kk) values(1, 5, 'b');
  - type: wait
    time: 1

  - type: query
    sql: insert into test14_table_1(ii, jj, kk) values(3, 2, 'f');
  - type: wait
    time: 3

  - name: "14115"
    type: stream
    query:
      select i, j, k, ii, jj, kk from test14_stream_1 as a left join table(test14_table_1)
      as b on a.j = b.jj;
    schema:
      - name: i
        type: int32
      - name: j
        type: int32
      - name: k
        type: string
      - name: ii
        type: int32
      - name: jj
        type: int32
      - name: kk
        type: string
  - type: wait
    time: 1

  - type: query
    sql: insert into test14_stream_1(i, j, k) values(1, 2, 'a');
  - type: wait
    time: 1

  - type: query
    sql: insert into test14_stream_1(i, j, k) values(1, 3, 'a');
  - type: wait
    time: 1

  - type: query
    sql: insert into test14_stream_1(i, j, k) values(5, 2, 'a');
  - type: wait
    time: 1

  - type: query
    sql: insert into test14_stream_1(i, j, k) values(1, 7, 'a');

  - type: check
    target_name: "14115"
    expected_result:
      - - "1"
        - "2"
        - a
        - "3"
        - "2"
        - f
      - - "1"
        - "3"
        - a
        - "1"
        - "3"
        - b
      - - "5"
        - "2"
        - a
        - "3"
        - "2"
        - f
      - - "1"
        - "7"
        - a
        - "0"
        - "0"
        - ""
