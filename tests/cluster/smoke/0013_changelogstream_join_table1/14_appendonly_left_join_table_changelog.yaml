tags:
  - appendonly
  - table(changelog)
  - left join
  - not supported
  - skip
description: appendonly left join table(changelog)
cluster:
  - p1k1
  - p3k1
steps:
  - type: query
    sql: drop stream if exists test14_stream;

  - type: query
    sql: drop stream if exists test14_table;

  - type: wait
    time: 1

  - type: query
    sql: create stream test14_stream(i int, j int, k string);

  - type: query
    sql:
      create stream test14_table(ii int, jj int, kk string) primary
      key jj settings mode='changelog';

  - type: wait
    time: 2

  - type: query
    sql: insert into test14_table(ii, jj, kk) values(1, 2, 'a');

  - type: wait
    time: 1

  - type: query
    sql: insert into test14_table(ii, jj, kk) values(1, 3, 'b');

  - type: wait
    time: 1

  - type: query
    sql: insert into test14_table(ii, jj, kk) values(1, 5, 'b');

  - type: wait
    time: 1

  - type: query
    sql: insert into test14_table(ii, jj, kk, _tp_delta) values(3, 2, 'f', -1);

  - type: wait
    time: 3

  - name: "14117"
    type: stream
    query:
      select i, j, k, ii, jj, kk, b._tp_delta from test14_stream as a left join
      table(test14_table) as b on a.j = b.jj;
    schema:
      - name: i
        type: int32
      - name: j
        type: int32
      - name: k
        type: string
      - name: ii
        type: int32
      - name: jj
        type: int32
      - name: kk
        type: string
      - name: _tp_delta
        type: int8

  - type: wait
    time: 1

  - type: query
    sql: insert into test14_stream(i, j, k) values(1, 2, 'a');

  - type: wait
    time: 1

  - type: query
    sql: insert into test14_stream(i, j, k) values(1, 3, 'a');

  - type: wait
    time: 1

  - type: query
    sql: insert into test14_stream(i, j, k) values(5, 2, 'a');

  - type: wait
    time: 1

  - type: query
    sql: insert into test14_stream(i, j, k) values(1, 7, 'a');
