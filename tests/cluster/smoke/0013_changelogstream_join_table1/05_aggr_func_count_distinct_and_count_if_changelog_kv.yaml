tags:
  - changelog_kv_aggr
description: aggregation function count_distinct and count_if changelog_kv
cluster:
  - p1k1
  - p3k1
steps:
  - type: query
    node:
      - p1
    sql: drop stream if exists test14_changelog_kv_stream
  - type: wait
    time: 1

  - type: query
    <<if eq .nodes "1">>
    node: [p1]
    <<else>>
    node: [p2]
    <<end>>
    sql: create stream test14_changelog_kv_stream(id int, val float) primary key id settings mode='changelog_kv'
  - type: wait
    time: 2

  - type: query
    <<if eq .nodes "1">>
    node: [p1]
    <<else>>
    node: [p3]
    <<end>>
    sql: insert into test14_changelog_kv_stream(id, val) values (1, 1.1), (2, 2.2), (3, 3.3)
    schema:
      - name: id
        type: int64
      - name: val
        type: float64     
  - type: wait
    time: 1

  - name: "14108"
    node:
      - p1
    type: stream
    query: select count(1), count_distinct(val), count_if(val > 2) from test14_changelog_kv_stream emit periodic 1s
    schema:
      - name: count(1)
        type: uint64
      - name: count_distinct(val)
        type: uint64
      - name: count_if(val > 2)
        type: uint64 

  - type: check
    target_name: "14108"
    expected_result:
      - - "3"
        - "3"
        - "2"

  - type: query
    <<if eq .nodes "1">>
    node: [p1]
    <<else>>
    node: [p2]
    <<end>>
    sql: insert into test14_changelog_kv_stream(id, val) values (4, 4.4), (5, 5.5)
    schema:
      - name: id
        type: int64
      - name: val
        type: float64

  - type: check
    target_name: "14108"
    expected_result:
      - - "5"
        - "5"
        - "4"

  - type: query
    <<if eq .nodes "1">>
    node: [p1]
    <<else>>
    node: [p3]
    <<end>>
    sql: insert into test14_changelog_kv_stream(id, val, _tp_delta) values (3, 3.3, -1)
    schema:
      - name: id
        type: int64
      - name: val
        type: float64     
      - name: _tp_delta
        type: int8

  - type: check
    target_name: "14108"
    expected_result:
      - - "4"
        - "4"
        - "3"

  - type: query
    node:
      - p1
    sql: insert into test14_changelog_kv_stream(id, val, _tp_delta) values (1, 1.1, -1)
    schema:
      - name: id
        type: int64
      - name: val
        type: float64     
      - name: _tp_delta
        type: int8

  - type: check
    target_name: "14108"
    expected_result:
      - - "3"
        - "3"
        - "3"

  - type: query
    <<if eq .nodes "1">>
    node: [p1]
    <<else>>
    node: [p2]
    <<end>>
    sql: insert into test14_changelog_kv_stream(id, val, _tp_delta) values (5, 5.5, -1)
    schema:
      - name: id
        type: int64
      - name: val
        type: float64     
      - name: _tp_delta
        type: int8

  - type: check
    target_name: "14108"
    expected_result:
      - - "2"
        - "2"
        - "2"
