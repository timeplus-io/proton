tags:
  - local-run
  - emit on update
  - global aggr
  - window aggr

description: |
  Emit global/window aggr results on update
  Skip window aggr cases due to issue: https://github.com/timeplus-io/proton-enterprise/issues/8620

cluster:
  - p1k1
  - p3k1

steps:
  - type: query
    sql: drop stream if exists test13_multishard_8;

  - type: wait
    time: 1

  - type: query
    sql: create stream test13_multishard_8(i int, s low_cardinality(string)) settings shards=3;

  - type: wait
    time: 2

  - type: stream
    name: multishards-0-1
    query: select min(i), max(i), count() from test13_multishard_8 emit on update;
    schema:
      - name: min(i)
        type: int32
      - name: max(i)
        type: int32
      - name: count()
        type: uint64

  - type: stream
    name: multishards-0-2
    query: select i, s, count() from test13_multishard_8 group by i, s emit on update
    schema:
      - name: i
        type: int32
      - name: s
        type: low_cardinality(string)
      - name: count()
        type: uint64

