  - type: wait
    time: 2

  - type: query
    sql: insert into test13_multishard_8(i, s, _tp_time) values (1, '1', '2024-01-24 10:00:00');

  - type: wait
    time: 1

  - type: query
    sql: insert into test13_multishard_8(i, s, _tp_time) values (2, '2', '2024-01-24 10:00:05');

  - type: wait
    time: 1

  - type: query
    sql: insert into test13_multishard_8(i, s, _tp_time) values (3, '3', '2024-01-24 10:00:10');

  - type: check
    target_name: multishards-0-1
    expected_result:
      - [1, 1, 1]
      - [1, 2, 2]
      - [1, 3, 3]

  - type: check
    target_name: multishards-0-2
    expected_result:
      - [1, '1', 1]
      - [2, '2', 1]
      - [3, '3', 1]

