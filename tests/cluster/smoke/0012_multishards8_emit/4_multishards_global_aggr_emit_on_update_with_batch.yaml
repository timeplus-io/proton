tags:
  - emit on update with batch
  - global aggr
  - window aggr
  - not_supported_hybrid # https://github.com/timeplus-io/proton-enterprise/issues/10137

description: Emit global/window aggr results periodic on update

cluster:
  - p1k1
  - p3k1

steps:
  - type: query
    sql: drop stream if exists test13_multishard_8;

  - type: wait
    time: 1

  - type: query
    sql: create stream test13_multishard_8(i int) settings shards=3;

  - type: wait
    time: 2

  - type: stream
    name: multishards-2-1
    query: select min(i), max(i), count() from test13_multishard_8 emit on update with batch 1s;
    schema:
      - name: min(i)
        type: int32
      - name: max(i)
        type: int32
      - name: count()
        type: uint64

  - type: stream
    name: multishards-2-2
    query: select i, count() from test13_multishard_8 group by i emit on update with batch 1s;
    schema:
      - name: i
        type: int32
      - name: count()
        type: uint64

  - type: stream
    name: multishards-2-3
    query: select window_start, window_end, min(i), max(i), count() from tumble(test13_multishard_8, 10s) group by window_start, window_end emit on update with batch 1s;
    schema:
      - name: window_start
        type: datetime64(3)
      - name: window_end
        type: datetime64(3)
      - name: min(i)
        type: int32
      - name: max(i)
        type: int32
      - name: count()
        type: uint64

  - type: stream
    name: multishards-2-4
    query: select window_start, window_end, i, count() from tumble(test13_multishard_8, 10s) group by window_start, window_end, i emit on update with batch 1s;
    schema:
      - name: window_start
        type: datetime64(3)
      - name: window_end
        type: datetime64(3)
      - name: i
        type: int32
      - name: count()
        type: uint64
  - type: wait
    time: 1

  - type: stream
    name: multishards-2-5
    query: select window_start, window_end, min(i), max(i), count() from hop(test13_multishard_8, 10s, 30s) group by window_start, window_end emit on update with batch 1s;
    schema:
      - name: window_start
        type: datetime64(3)
      - name: window_end
        type: datetime64(3)
      - name: min(i)
        type: int32
      - name: max(i)
        type: int32
      - name: count()
        type: uint64

  - type: wait
    time: 2

  - type: query
    sql: insert into test13_multishard_8(i, _tp_time) values (1, '2024-01-24 10:00:00');

  - type: wait
    time: 2

  - type: query
    sql: insert into test13_multishard_8(i, _tp_time) values (2, '2024-01-24 10:00:05');

  - type: wait
    time: 2

  - type: query
    sql: insert into test13_multishard_8(i, _tp_time) values (3, '2024-01-24 10:00:10');

  - type: check
    target_name: multishards-2-1
    expected_result:
      - [1, 1, 1]
      - [1, 2, 2]
      - [1, 3, 3]

  - type: check
    target_name: multishards-2-2
    expected_result:
      - [1, 1]
      - [2, 1]
      - [3, 1]

  - type: check
    target_name: multishards-2-3
    expected_result:
      - ['2024-01-24 10:00:00+00:00', '2024-01-24 10:00:10+00:00', 1, 1, 1]
      - ['2024-01-24 10:00:00+00:00', '2024-01-24 10:00:10+00:00', 1, 2, 2]
      - ['2024-01-24 10:00:10+00:00', '2024-01-24 10:00:20+00:00', 3, 3, 1]

  - type: check
    target_name: multishards-2-4
    expected_result:
      - ['2024-01-24 10:00:00+00:00', '2024-01-24 10:00:10+00:00', 1, 1]
      - ['2024-01-24 10:00:00+00:00', '2024-01-24 10:00:10+00:00', 2, 1]
      - ['2024-01-24 10:00:10+00:00', '2024-01-24 10:00:20+00:00', 3, 1]

  - type: check
    target_name: multishards-2-5
    expected_result:
      - ['2024-01-24 09:59:40+00:00', '2024-01-24 10:00:10+00:00', 1, 1, 1]
      - ['2024-01-24 09:59:50+00:00', '2024-01-24 10:00:20+00:00', 1, 1, 1]
      - ['2024-01-24 10:00:00+00:00', '2024-01-24 10:00:30+00:00', 1, 1, 1]
      - ['2024-01-24 09:59:40+00:00', '2024-01-24 10:00:10+00:00', 1, 2, 2]
      - ['2024-01-24 09:59:50+00:00', '2024-01-24 10:00:20+00:00', 1, 2, 2]
      - ['2024-01-24 10:00:00+00:00', '2024-01-24 10:00:30+00:00', 1, 2, 2]
      - ['2024-01-24 09:59:50+00:00', '2024-01-24 10:00:20+00:00', 1, 3, 3]
      - ['2024-01-24 10:00:00+00:00', '2024-01-24 10:00:30+00:00', 1, 3, 3]
      - ['2024-01-24 10:00:10+00:00', '2024-01-24 10:00:40+00:00', 3, 3, 1]
