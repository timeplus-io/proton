tags:
- local-run
- view_dependencies

description: create a view or materialized view with source stream, then try drop/rename source stream
cluster:
- p1k1
- p3k1
steps:
- type: wait
  time: 2

- type: query
  sql: drop stream if exists target_stream0024
- type: wait
  time: 2

- type: query
  sql: create stream target_stream0024(i int)
- type: wait
  time: 2

- type: query
  sql: create view view_with_source_stream as select * from stream0024
- type: wait
  time: 2

- name: '2500'
  type: stream
  query: drop stream stream0024

- name: '2501'
  type: stream
  query: rename stream stream0024 to tmp
- type: wait
  time: 2

- type: query
  sql: drop view view_with_source_stream
- type: wait
  time: 2

- type: query
  sql: create materialized view mv_with_source_stream1 as select * from stream0024
- type: wait
  time: 2

- name: '2502'
  type: stream
  query: drop stream stream0024
- type: wait
  time: 2

- name: '2503'
  type: stream
  query: rename stream stream0024 to tmp
- type: wait
  time: 2

- type: query
  sql: drop view mv_with_source_stream1
- type: wait
  time: 2

- type: query
  sql: create materialized view mv_with_source_stream2 into target_stream0024 as select * from stream0024
- type: wait
  time: 2

- name: '2504'
  type: stream
  query: drop stream stream0024
- type: wait
  time: 2

- name: '2505'
  type: stream
  query: rename stream stream0024 to tmp
- type: wait
  time: 2

- name: '2506'
  type: stream
  query: drop stream target_stream0024
- type: wait
  time: 2

- name: '2507'
  type: stream
  query: rename stream target_stream0024 to tmp
- type: wait
  time: 2

- type: query
  sql: drop view mv_with_source_stream2
- type: wait
  time: 2

- type: check
  target_name: '2500'
  expected_result:
  - ["error_code:630"]

- type: check
  target_name: '2501'
  expected_result:
  - ["error_code:630"]

- type: check
  target_name: '2502'
  expected_result:
  - ["error_code:630"]

- type: check
  target_name: '2503'
  expected_result:
  - ["error_code:630"]

- type: check
  target_name: '2504'
  expected_result:
  - ["error_code:630"]

- type: check
  target_name: '2505'
  expected_result:
  - ["error_code:630"]

- type: check
  target_name: '2506'
  expected_result:
  - ["error_code:630"]

- type: check
  target_name: '2507'
  expected_result:
  - ["error_code:630"]
