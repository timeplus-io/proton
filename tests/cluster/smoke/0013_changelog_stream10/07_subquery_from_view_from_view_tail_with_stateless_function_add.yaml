tags:
  - versioned_kv
  - multi_shard
  - subquery
  - subquery/view/materialized_view
  - tail/aggr
  - stateless_function
description: subquery from view from view tail with stateless function, add
cluster:
  - p1k1
  - p3k1
steps:
  - type: query
    sql: |
      create stream if not exists test14_multishard_10(i float, k1 int, k2 string) primary key k2
      settings mode='versioned_kv', shards=3;
  - type: wait
    time: 2

  - type: query
    sql: |
      create view if not exists test14_view1_10 as
        (select i,
                k2
         from test14_multishard_10
         where k1 = 1 );  
  - type: wait
    time: 1

  - type: query
    sql: |
      create view if not exists test14_view2_10 as
        (select i,
                k2
         from test14_view1_10
         where k2 != 'd' );
  - type: wait
    time: 1

  - name: "1479"
    type: stream
    query: |
      select power(10, log2(i)),
             k2
      from test14_view2_10;

    schema: 
      - name: pow(10, log2(i))
        type: float64
      - name: k2
        type: string  
  - type: wait
    time: 1

  - type: query
    sql: |
      insert into test14_multishard_10(i, k1, k2)
      values (1, 1, 'a');
  - type: wait
    time: 1

  - type: query
    sql: |
      insert into test14_multishard_10(i, k1, k2)
      values (2, 1, 'b');
  - type: wait
    time: 1

  - type: query
    sql: |
      insert into test14_multishard_10(i, k1, k2)
      values (3, 0, 'c');
  - type: wait
    time: 1

  - type: query
    sql: |
      insert into test14_multishard_10(i, k1, k2)
      values (4, 1, 'd');
  - type: wait
    time: 1

  - type: query
    sql: |
      insert into test14_multishard_10(i, k1, k2)
      values (5, 0, 'e');
  - type: wait
    time: 1

  - type: query
    sql: |
      insert into test14_multishard_10(i, k1, k2)
      values (6, 0, 'f');
  - type: wait
    time: 1

  - type: query
    sql: |
      insert into test14_multishard_10(i, k1, k2)
      values (7, 0, 'g');
  - type: wait
    time: 1

  - type: query
    sql: |
      insert into test14_multishard_10(i, k1, k2)
      values (8, 1, 'h');

  - type: check
    target_name: "1479"
    expected_result:
      - [1, a]
      - [10, b]
      - [1000, h]
