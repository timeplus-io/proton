tags:
  - udf

description: Test covering asyncio thread 

cluster:
  - p1k1

steps:
  - type: query
    sql: drop stream if exists test41_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream test41_stream (id int, value string);
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_async_thread(id int, value string) RETURNS string LANGUAGE PYTHON AS $$
      import time
      import asyncio

      def blocking_io():
          time.sleep(1)

      async def say_after_gather(delay):
          start = time.time()
          await asyncio.gather(
              asyncio.to_thread(blocking_io),
              asyncio.sleep(delay))
          end = time.time()
          duration = end - start
          return f"duration: {int(duration)}"

      def test_async_thread(id, value):
          results = []
          for i, v in zip(id, value):
              try:
                  result = asyncio.run(say_after_gather(i))
                  results.append(result)
              except Exception as e:
                  results.append(e)
          return results
      $$;

  - type: wait
    time: 2

  - name: python-udf-1-1
    type: stream
    query: select test_async_thread(id, value) as res, id, value from test41_stream;
    schema:
      - name: res
        type: string
      - name: id
        type: int32
      - name: value
        type: string

  - type: wait
    time: 1

  - type: query
    sql: insert into test41_stream(id, value) values (0, 'hello0') (1, 'hello1') (2, 'hello2');

  - type: wait
    time: 2

  - type: query
    sql: insert into test41_stream(id, value) values (-1, '');

  - type: check
    target_name: python-udf-1-1
    expected_result:
      - ['duration: 1', 0, 'hello0']
      - ['duration: 1', 1, 'hello1']
      - ['duration: 2', 2, 'hello2']
      - ['duration: 1', -1, '']
