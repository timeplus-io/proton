description: Test covering asyncio goroutines and tasks 

cluster:
  - p1k1
  - p3k1

steps:
  - type: query
    sql: drop stream if exists test41_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream test41_stream (id int, value string);
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_async_run(id int, value string) RETURNS string LANGUAGE PYTHON AS $$
      import asyncio

      async def say_after(delay, what):
          await asyncio.sleep(delay)
          return what

      def test_async_run(id, value):
          results = []
          for i, v in zip(id, value):
              try:
                  result = asyncio.run(say_after(i,v))
                  results.append(result)
              except Exception as e:
                  results.append(e)
          return results
      $$;

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_async_await(id int, value string) RETURNS string LANGUAGE PYTHON AS $$
      import time
      import asyncio

      async def say_after(delay, what):
          await asyncio.sleep(delay)
          return what

      async def multi_say_after(delay, what):
          start = time.time()
          await1 = await say_after(delay, what+'-one')
          await2 = await say_after(delay+1, what+'-two')
          end = time.time()

          duration = end - start
          return f"{await1} {await2} - duration {int(duration)}"

      def test_async_await(id, value):
          results = []
          for i, v in zip(id, value):
              try:
                  result = asyncio.run(multi_say_after(i,v))
                  results.append(result)
              except Exception as e:
                  results.append(e)
          return results
      $$;

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_async_task(id int, value string) RETURNS string LANGUAGE PYTHON AS $$
      import time
      import asyncio

      async def say_after(delay, what):
          await asyncio.sleep(delay)
          return what

      async def multi_say_after(delay, what):
          task1 = asyncio.create_task(say_after(delay, what+'-one'))
          task2 = asyncio.create_task(say_after(delay+1, what+'-two'))

          start = time.time()
          await1 = await task1
          await2 = await task2
          end = time.time()

          duration = end - start
          return f"{await1} {await2} - duration {int(duration)}"

      def test_async_task(id, value):
          results = []
          for i, v in zip(id, value):
              try:
                  result = asyncio.run(multi_say_after(i,v))
                  results.append(result)
              except Exception as e:
                  results.append(e)
          return results
      $$;

  - type: wait
    time: 2

  - name: python-udf-0-1
    type: stream
    query: select test_async_run(id, value) as res, id, value from test41_stream;
    schema:
      - name: res
        type: string
      - name: id
        type: int32
      - name: value
        type: string

  - name: python-udf-0-2
    type: stream
    query: select test_async_await(id, value) as res, id, value from test41_stream;
    schema:
      - name: res
        type: string
      - name: id
        type: int32
      - name: value
        type: string

  - name: python-udf-0-3
    type: stream
    query: select test_async_task(id, value) as res, id, value from test41_stream;
    schema:
      - name: res
        type: string
      - name: id
        type: int32
      - name: value
        type: string

  - type: wait
    time: 1

  - type: query
    sql: insert into test41_stream(id, value) values (0, 'hello0') (1, 'hello1') (2, 'hello2');

  - type: wait
    time: 2

  - type: query
    sql: insert into test41_stream(id, value) values (-1, 'hello3') (0, ''); # Python < 3.11：asyncio.sleep(-1) no exception

  - type: check
    target_name: python-udf-0-1
    expected_result:
      - ['hello0', 0, 'hello0']
      - ['hello1', 1, 'hello1']
      - ['hello2', 2, 'hello2']
      - ['hello3', -1, 'hello3']
      - ['', 0, '']

  - type: check
    target_name: python-udf-0-2
    expected_result:
      - ['hello0-one hello0-two - duration 1', 0, 'hello0']
      - ['hello1-one hello1-two - duration 3', 1, 'hello1']
      - ['hello2-one hello2-two - duration 5', 2, 'hello2']
      - ['hello3-one hello3-two - duration 0', -1, 'hello3']
      - ['-one -two - duration 1', 0, '']

  - type: check
    target_name: python-udf-0-3
    expected_result:
      - ['hello0-one hello0-two - duration 1', 0, 'hello0']
      - ['hello1-one hello1-two - duration 2', 1, 'hello1']
      - ['hello2-one hello2-two - duration 3', 2, 'hello2']
      - ['hello3-one hello3-two - duration 0', -1, 'hello3']
      - ['-one -two - duration 1', 0, '']
