tags:
  - uda

description: Test covering simple python uda test

steps:
  - type: query
    sql: drop stream if exists uda_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream uda_stream (valuea array(string), valueb array(string), valuec array(float64));
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_series_min(valuea array(string), valueb array(string), valuec array(float64)) RETURNS float64 LANGUAGE PYTHON AS
      $$
      import pandas as pd

      def test_series_min(valuea, valueb, valuec):
          res = []
          for a, b, c in zip(valuea, valueb, valuec):
              idx = pd.MultiIndex.from_arrays([a,b],
                    names=['blooded', 'animal'])
              s = pd.Series(c, name='legs', index=idx)
              series_min = s.min()
              res.append(series_min)
          return res
      $$;

  - type: wait
    time: 1

  - name: python-udf3-24-2
    type: stream
    query: select test_series_min(valuea, valueb, valuec) as res from uda_stream;
    schema:
      - name: res
        type: float64

  - type: wait
    time: 1

  - type: query
    sql: insert into uda_stream(valuea, valueb, valuec) values 
          (['warm', 'warm', 'cold', 'cold'], ['dog', 'falcon', 'fish', 'spider'], [4, 2, 0, 8])
          (['freeze', 'warm', 'freeze', 'warm'], ['rabbit', 'tiger', 'bird', 'spider'], [3, 7, 9, 2]);

  - type: check
    target_name: python-udf3-24-2
    expected_result:
      - [0]
      - [2]
