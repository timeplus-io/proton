tags:
  - uda

description: Test covering simple python uda test

steps:
  - type: query
    sql: drop stream if exists uda_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream uda_stream (valuea array(int), valueb array(int));
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_df_resamples(valuea array(int), valueb array(int)) RETURNS array(array(float64)) LANGUAGE PYTHON AS
      $$
      import pandas as pd

      def test_df_resamples(valuea, valueb):
          res = []
          for a, b in zip(valuea, valueb):
              df = pd.DataFrame(zip(a,b), columns=['a', 'b'])
              df['week_starting'] = pd.date_range('01/01/2018',
                                    periods=8,
                                    freq='W')
              df_resamples = df.resample('ME', on='week_starting').mean().values.tolist()
              res.append(df_resamples)
          return res
      $$;

  - type: wait
    time: 1

  - name: python-udf3-46-1
    type: stream
    query: select test_df_resamples(valuea, valueb) as res from uda_stream;
    schema:
      - name: res
        type: array(array(float64))

  - type: wait
    time: 2

  - type: query
    sql: insert into uda_stream(valuea, valueb) values 
          ([1,2,3,4,5,6,7,8], [2,3,4,5,6,7,8,9])
          ([11,12,13,14,15,16,17,18], [12,13,14,15,16,17,18,19]);

  - type: check
    target_name: python-udf3-46-1
    expected_result:
      - [[[2.5, 3.5], [6.5, 7.5]]]
      - [[[12.5, 13.5], [16.5, 17.5]]]
