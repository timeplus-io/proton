tags:
  - uda

description: Test covering simple python uda test

steps:
  - type: query
    sql: drop stream if exists uda_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream uda_stream (valuea array(string), valueb array(string), valuec array(string));
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_df_melt(valuea array(string), valueb array(string), valuec array(string)) RETURNS array(array(string)) LANGUAGE PYTHON AS
      $$
      import pandas as pd

      def test_df_melt(valuea, valueb, valuec):
          res = []
          for a, b, c in zip(valuea, valueb, valuec):
              df = pd.DataFrame(zip(a,b,c), columns=['a','b','c'])
              df_melt = df.melt(id_vars=['a'], value_vars=['b', 'c']).values.tolist()
              res.append(df_melt)
          return res
      $$;

  - type: wait
    time: 1

  - name: python-udf3-12-1
    type: stream
    query: select test_df_melt(valuea, valueb, valuec) as res from uda_stream;
    schema:
      - name: res
        type: array(array(string))

  - type: wait
    time: 1

  - type: query
    sql: insert into uda_stream(valuea, valueb, valuec) values 
          (['A', 'B', 'C'], ['one','two','thred'], ['four','five','six'])
          (['D', 'E', 'F'], ['x1','x2','x3'], ['y1','y2','y3']);
  
  - type: check
    target_name: python-udf3-12-1
    expected_result:
      - [[['A', 'b', 'one'], ['B', 'b', 'two'], ['C', 'b', 'thred'], ['A', 'c', 'four'], ['B', 'c', 'five'], ['C', 'c', 'six']]]
      - [[['D', 'b', 'x1'], ['E', 'b', 'x2'], ['F', 'b', 'x3'], ['D', 'c', 'y1'], ['E', 'c', 'y2'], ['F', 'c', 'y3']]]
