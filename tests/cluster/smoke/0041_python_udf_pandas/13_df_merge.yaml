tags:
  - uda

description: Test covering simple python uda test

steps:
  - type: query
    sql: drop stream if exists uda_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream uda_stream (valuea array(string), valueb array(string), valuec array(string), valued array(string));
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_df_merges(valuea array(string), valueb array(string), valuec array(string), valued array(string)) RETURNS array(array(string)) LANGUAGE PYTHON AS
      $$
      import pandas as pd

      def test_df_merges(valuea, valueb, valuec, valued):
          res = []
          for a, b, c, d in zip(valuea, valueb, valuec, valued):
              df1 = pd.DataFrame(zip(a,b), columns=['lkey','value'])
              df2 = pd.DataFrame(zip(c,d), columns=['rkey','value'])
              df_merge = df1.merge(df2, left_on='lkey', right_on='rkey').values.tolist()
              res.append(df_merge)
          return res
      $$;

  - type: wait
    time: 1

  - name: python-udf3-13-1
    type: stream
    query: select test_df_merges(valuea, valueb, valuec, valued) as res from uda_stream;
    schema:
      - name: res
        type: array(array(string))

  - type: wait
    time: 1

  - type: query
    sql: insert into uda_stream(valuea, valueb, valuec, valued) values 
          (['foo', 'bar', 'baz'], ['x', 'y', 'z'], ['foo', 'bar', 'baz'], ['l', 'm', 'n'])
          (['one', 'two', 'three'], ['e', 'f', 'g'], ['one', 'two', 'three'], ['h', 'i', 'j']);
  
  - type: check
    target_name: python-udf3-13-1
    expected_result:
      - [[['foo', 'x', 'foo', 'l'], ['bar', 'y', 'bar', 'm'], ['baz', 'z', 'baz', 'n']]]
      - [[['one', 'e', 'one', 'h'], ['two', 'f', 'two', 'i'], ['three', 'g', 'three', 'j']]]
