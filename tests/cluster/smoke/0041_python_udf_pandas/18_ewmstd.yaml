tags:
  - uda

description: Test covering simple python uda test

steps:
  - type: query
    sql: drop stream if exists uda_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream uda_stream (value array(float64));
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_ewn_std(value array(float64)) RETURNS array(float64) LANGUAGE PYTHON AS
      $$
      import pandas as pd

      def test_ewn_std(value):
          res = []
          for v in value:
              df = pd.DataFrame(v, columns=['B'])
              ewn_std = df.ewm(com=0.5).std()['B'].to_list()
              res.append(ewn_std)
          return res
      $$;

  - type: wait
    time: 1

  - name: python-udf3-18-1
    type: stream
    query: select test_ewn_std(value) as res from uda_stream;
    schema:
      - name: res
        type: array(float64)

  - type: wait
    time: 1

  - type: query
    sql: insert into uda_stream(value) values 
          ([0, 1, 2, 3, 4])([5, 6, 7, 8]);

  - type: check
    target_name: python-udf3-18-1
    expected_result:
      - [[NaN, 0.7071067811865475, 0.9198662110078, 1.0597532368796632, 1.1416241873418624]]
      - [[NaN, 0.7071067811865475, 0.9198662110077998, 1.0597532368796627]]
