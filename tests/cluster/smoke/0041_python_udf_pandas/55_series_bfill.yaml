tags:
  - uda

description: Test covering simple python uda test

steps:
  - type: query
    sql: drop stream if exists uda_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream uda_stream (value array(nullable(int)));
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_series_bfill(value array(nullable(int))) RETURNS array(float64) LANGUAGE PYTHON AS
      $$
      import pandas as pd

      def test_series_bfill(value):
          res = []
          for v in value:
              s = pd.Series(v)
              series_bfill = s.bfill().values.tolist()
              res.append(series_bfill)
          return res
      $$;

  - type: wait
    time: 1

  - name: python-udf3-55-2
    type: stream
    query: select test_series_bfill(value) as res from uda_stream;
    schema:
      - name: res
        type: array(float64)

  - type: wait
    time: 1

  - type: query
    sql: insert into uda_stream(value) values 
          ([1, null, 4]) ([null, 6, 3]);

  - type: check
    target_name: python-udf3-55-2
    expected_result:
      - [[1.0, 4.0, 4.0]]
      - [[6.0, 6.0, 3.0]]
