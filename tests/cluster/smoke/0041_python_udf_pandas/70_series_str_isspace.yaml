tags:
  - uda

description: Test covering simple python uda test

steps:
  - type: query
    sql: drop stream if exists uda_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream uda_stream (value array(string));
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_str_isspace(value array(string)) RETURNS array(bool) LANGUAGE PYTHON AS
      $$
      import pandas as pd

      def test_str_isspace(value):
          res = []
          for v in value:
              s = pd.Series(v)
              str_isspace = s.str.isspace().tolist()
              res.append(str_isspace)
          return res
      $$;

  - type: wait
    time: 1

  - name: python-udf3-70-1
    type: stream
    query: select test_str_isspace(value) as res from uda_stream;
    schema:
      - name: res
        type: array(bool)

  - type: wait
    time: 1

  - type: query
    sql: insert into uda_stream(value) values 
          (['one', 'one1', '\n']) (['1', '', 'one ']);

  - type: check
    target_name: python-udf3-70-1
    expected_result:
      - [[False, False, True]]
      - [[False, False, False]]
