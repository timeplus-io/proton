tags:
  - uda

description: Test covering simple python uda test

steps:
  - type: query
    sql: drop stream if exists udf_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream udf_stream (valuea array(int), valueb array(int));
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_series_sub(valuea array(int), valueb array(int)) RETURNS array(int) LANGUAGE PYTHON AS
      $$
      import pandas as pd

      def test_series_sub(valuea, valueb):
          res = []
          for a, b in zip(valuea, valueb):
              df_a = pd.Series(a)
              df_b = pd.Series(b)
              series_sub = df_a.sub(df_b).values.tolist()
              res.append(series_sub)
          return res
      $$;

  - type: wait
    time: 1

  - name: python-udf3-8-2
    type: stream
    query: select test_series_sub(valuea, valueb) as res from udf_stream;
    schema:
      - name: res
        type: array(int32)

  - type: wait
    time: 1

  - type: query
    sql: insert into udf_stream(valuea, valueb) values 
          ([1, 2, 3, 4], [16, 15, 14, 13])
          ([9, 10, 11, 12], [8, 7, 6, 5]);

  - type: check
    target_name: python-udf3-8-2
    expected_result:
      - [[-15, -13, -11, -9]]
      - [[1, 3, 5, 7]]
