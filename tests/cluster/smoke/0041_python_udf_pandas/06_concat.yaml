tags:
  - uda

description: Test covering simple python uda test

steps:
  - type: query
    sql: drop stream if exists uda_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream uda_stream (valuea array(string), valueb array(string));
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_concat(valuea array(string), valueb array(string)) RETURNS array(string) LANGUAGE PYTHON AS
      $$
      import pandas as pd

      def test_concat(valuea, valueb):
          res = []
          for a, b in zip(valuea, valueb):
              df_a = pd.Series(a)
              df_b = pd.Series(b)
              concatenated = pd.concat([df_a, df_b]).to_list()
              res.append(concatenated)
          return res
      $$;

  - type: wait
    time: 1

  - name: python-udf3-6-1
    type: stream
    query: select test_concat(valuea, valueb) as res from uda_stream;
    schema:
      - name: res
        type: array(string)

  - type: wait
    time: 1

  - type: query
    sql: insert into uda_stream(valuea, valueb) values (['a', 'b'], ['c', 'd'])(['s1'], ['s2']);

  - type: check
    target_name: python-udf3-6-1
    expected_result:
      - [['a', 'b', 'c', 'd']]
      - [['s1', 's2']]
