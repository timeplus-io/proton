tags:
  - uda
  - bug # https://github.com/timeplus-io/proton-enterprise/issues/6689

description: Test covering simple python uda test

steps:
  - type: query
    sql: drop stream if exists uda_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream uda_stream (valuea array(nullable(int)), valueb array(nullable(int)));
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_df_interpolate(valuea array(nullable(int)), valueb array(nullable(int))) RETURNS array(array(float64)) LANGUAGE PYTHON AS
      $$
      import pandas as pd

      def test_df_interpolate(valuea, valueb):
          res = []
          for a, b in zip(valuea, valueb):
              df = pd.DataFrame(zip(a,b), columns=['a', 'b'])
              df_interpolate = df.interpolate().values.tolist()
              res.append(df_interpolate)
          return res
      $$;

  - type: wait
    time: 1

  - name: python-udf3-57-1
    type: stream
    query: select test_df_interpolate(valuea, valueb) as res from uda_stream;
    schema:
      - name: res
        type: array(array(float64))

  - type: wait
    time: 1

  - type: query
    sql: insert into uda_stream(valuea, valueb) values 
          ([1, null, 4], [null, 6, 3]) ([1, 3, null], [6, 4, 2]);

  - type: check
    target_name: python-udf3-57-1
    expected_result:
      - [[[1.0, 2.0], [2.0, 6.0], [3.0, 6.0]]]
      - [[[NaN, 6.0], [3.0, 4.0], [5.0, 2.0]]]
