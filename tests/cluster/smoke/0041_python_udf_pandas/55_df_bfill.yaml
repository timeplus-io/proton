tags:
  - uda

description: Test covering simple python uda test

steps:
  - type: query
    sql: drop stream if exists uda_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream uda_stream (valuea array(nullable(int)), valueb array(nullable(int)));
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_df_bfill(valuea array(nullable(int)), valueb array(nullable(int))) RETURNS array(array(float64)) LANGUAGE PYTHON AS
      $$
      import pandas as pd

      def test_df_bfill(valuea, valueb):
          res = []
          for a, b in zip(valuea, valueb):
              df = pd.DataFrame(zip(a,b), columns=['a', 'b'])
              df_bfill = df.bfill().values.tolist()
              res.append(df_bfill)
          return res
      $$;

  - type: wait
    time: 1

  - name: python-udf3-55-1
    type: stream
    query: select test_df_bfill(valuea, valueb) as res from uda_stream;
    schema:
      - name: res
        type: array(array(float64))

  - type: wait
    time: 1

  - type: query
    sql: insert into uda_stream(valuea, valueb) values 
          ([1, null, 4], [null, 6, 3]) ([1, 3, null], [6, 4, 2]);

  - type: check
    target_name: python-udf3-55-1
    expected_result:
      - [[[1.0, 2.0], [nan, nan], [nan, nan]]]
      - [[[nan, nan], [3.0, nan], [nan, 2.0]]]
