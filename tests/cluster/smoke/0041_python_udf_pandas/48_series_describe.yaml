tags:
  - uda

description: Test covering simple python uda test

steps:
  - type: query
    sql: drop stream if exists uda_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream uda_stream (value array(int));
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_series_describe(value array(int)) RETURNS array(float64) LANGUAGE PYTHON AS
      $$
      import pandas as pd

      def test_series_describe(value):
          res = []
          for v in value:
              s = pd.Series(v)
              series_describe = s.describe().values.tolist()
              res.append(series_describe)
          return res
      $$;

  - type: wait
    time: 1

  - name: python-udf3-48-2
    type: stream
    query: select test_series_describe(value) as res from uda_stream;
    schema:
      - name: res
        type: array(float64)

  - type: wait
    time: 1

  - type: query
    sql: insert into uda_stream(value) values ([1, 2, 4]) ([2, 6, 3]);

  - type: check
    target_name: python-udf3-48-2
    mode: random
    expected_result:
      - [[3.0, 2.3333333333333335, 1.5275252316519465, 1.0, 1.5, 2.0, 3.0, 4.0]]
      - [[3.0, 3.6666666666666665, 2.081665999466133, 2.0, 2.5, 3.0, 4.5, 6.0]]
