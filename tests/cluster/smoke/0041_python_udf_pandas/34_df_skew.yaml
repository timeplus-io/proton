tags:
  - uda

description: Test covering simple python uda test

steps:
  - type: query
    sql: drop stream if exists uda_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream uda_stream (valuea array(float64), valueb array(float64));
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_df_skew(valuea array(float64), valueb array(float64)) RETURNS array(float64) LANGUAGE PYTHON AS
      $$
      import pandas as pd

      def test_df_skew(valuea, valueb):
          res = []
          for a, b in zip(valuea, valueb):
              df = pd.DataFrame(zip(a,b), columns=['a', 'b'])
              df_skew = df.skew().tolist()
              res.append(df_skew)
          return res
      $$;

  - type: wait
    time: 1

  - name: python-udf3-34-1
    type: stream
    query: select test_df_skew(valuea, valueb) as res from uda_stream;
    schema:
      - name: res
        type: array(float64)

  - type: wait
    time: 1

  - type: query
    sql: insert into uda_stream(valuea, valueb) values 
          ([1, 2, 4], [2, 3, 6]) ([1, 3, 5], [2, 4, 6]);

  - type: check
    target_name: python-udf3-34-1
    expected_result:
      - [[0.9352195295828237, 1.293342780733397]]
      - [[0.0, 0.0]]
