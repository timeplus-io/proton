tags:
  - uda

description: Test covering simple python uda test

steps:
  - type: query
    sql: drop stream if exists uda_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream uda_stream (valuea array(nullable(int)), valueb array(nullable(int)));
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_df_isnull(valuea array(nullable(int)), valueb array(nullable(int))) RETURNS array(array(bool)) LANGUAGE PYTHON AS
      $$
      import pandas as pd

      def test_df_isnull(valuea, valueb):
          res = []
          for a, b in zip(valuea, valueb):
              df = pd.DataFrame(zip(a,b), columns=['a', 'b'])
              df_isnull = df.isnull().values.tolist()
              res.append(df_isnull)
          return res
      $$;

  - type: wait
    time: 1

  - name: python-udf3-49-2
    type: stream
    query: select test_df_isnull(valuea, valueb) as res from uda_stream;
    schema:
      - name: res
        type: array(array(bool))

  - type: wait
    time: 1

  - type: query
    sql: insert into uda_stream(valuea, valueb) values 
          ([1, 2, null], [2, null, 3]) ([null, 3, 5], [6, null, 2]);

  - type: check
    target_name: python-udf3-49-2
    expected_result:
      - [[[False, False], [False, True], [True, False]]]
      - [[[True, False], [False, True], [False, False]]]
