tags:
  - uda
  - bug # https://github.com/timeplus-io/proton-enterprise/issues/6689

description: Test covering simple python uda test

steps:
  - type: query
    sql: drop stream if exists uda_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream uda_stream (valuea array(nullable(int)), valueb array(nullable(int)));
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_df_notnull(valuea array(nullable(int)), valueb array(nullable(int))) RETURNS array(array(bool)) LANGUAGE PYTHON AS
      $$
      import pandas as pd

      def test_df_notnull(valuea, valueb):
          res = []
          for a, b in zip(valuea, valueb):
              df = pd.DataFrame(zip(a,b), columns=['a', 'b'])
              df_notnull = df.notnull().values.tolist()
              res.append(df_notnull)
          return res
      $$;

  - type: wait
    time: 1

  - name: python-udf3-50-2
    type: stream
    query: select test_df_notnull(valuea, valueb) as res from uda_stream;
    schema:
      - name: res
        type: array(array(bool))

  - type: wait
    time: 1

  - type: query
    sql: insert into uda_stream(valuea, valueb) values 
          ([1, 2, null], [2, null, 3]) ([null, 3, 5], [6, null, 2]);

  - type: check
    target_name: python-udf3-50-2
    expected_result:
      - [[[True, True], [True, False], [False, True]]]
      - [[[False, True], [True, False], [True, True]]]
