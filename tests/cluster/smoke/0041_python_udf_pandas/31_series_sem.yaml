tags:
  - uda

description: Test covering simple python uda test

steps:
  - type: query
    sql: drop stream if exists uda_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream uda_stream (value array(float64));
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_series_sem(value array(float64)) RETURNS float64 LANGUAGE PYTHON AS
      $$
      import pandas as pd

      def test_series_sem(value):
          res = []
          for v in value:
              s = pd.Series(v)
              series_sem = s.sem().round(6)
              res.append(series_sem)
          return res
      $$;

  - type: wait
    time: 1

  - name: python-udf3-31-2
    type: stream
    query: select test_series_sem(value) as res from uda_stream;
    schema:
      - name: res
        type: float64

  - type: wait
    time: 1

  - type: query
    sql: insert into uda_stream(value) values 
          ([1, 2, 3]) ([4, 4, 6]);

  - type: check
    target_name: python-udf3-31-2
    expected_result:
      - [0.57735]
      - [0.666667]
