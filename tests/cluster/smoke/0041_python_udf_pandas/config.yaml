name: python_udf_pandas
description: Tests covering the python udf pandas library
tags:
  - smoke
  - python_udf
  - python_udf_library
  - pandas
arch:
  - x86_64

setup:
  scope: suite
  steps:
    # pandas
    - type: query
      sql: SYSTEM INSTALL PYTHON PACKAGE 'pandas';

    - type: wait
      time: 15

    - type: command
      name: python-udf3-1
      node: [p1]
      shell: |
        curl -X GET http://localhost:8123/proton/v1/python_packages  2>/dev/null | jq -c '.data[] | select(.name == "pandas") | length > 0'
    
    - type: check
      target_name: python-udf3-1
      expected_result: ['true']
