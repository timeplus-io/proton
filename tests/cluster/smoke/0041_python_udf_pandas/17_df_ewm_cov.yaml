tags:
  - uda

description: Test covering simple python uda test

steps:
  - type: query
    sql: drop stream if exists uda_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream uda_stream (value array(float64));
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_ewn_cov(value array(float64)) RETURNS array(float64) LANGUAGE PYTHON AS
      $$
      import pandas as pd

      def test_ewn_cov(value):
          res = []
          for v in value:
              df = pd.DataFrame(v, columns=['B'])
              ewn_cov = df.ewm(com=0.5).cov()['B'].tolist()
              res.append(ewn_cov)
          return res
      $$;

  - type: wait
    time: 1

  - name: python-udf3-17-1
    type: stream
    query: select test_ewn_cov(value) as res from uda_stream;
    schema:
      - name: res
        type: array(float64)

  - type: wait
    time: 1

  - type: query
    sql: insert into uda_stream(value) values 
          ([0, 1, 2, 3, 4])([5, 6, 7, 8]);

  - type: check
    target_name: python-udf3-17-1
    expected_result:
      - [[NaN, 0.49999999999999983, 0.8461538461538464, 1.1230769230769233, 1.3033057851239678]]
      - [[NaN, 0.49999999999999983, 0.846153846153846, 1.1230769230769224]]
