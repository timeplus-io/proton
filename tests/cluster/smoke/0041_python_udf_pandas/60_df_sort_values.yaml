tags:
  - uda

description: Test covering simple python uda test

steps:
  - type: query
    sql: drop stream if exists uda_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream uda_stream (valuea array(int), valueb array(int));
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_df_sort_values(valuea array(int), valueb array(int)) RETURNS array(array(int64)) LANGUAGE PYTHON AS
      $$
      import pandas as pd

      def test_df_sort_values(valuea, valueb):
          res = []
          for a, b in zip(valuea, valueb):
              df = pd.DataFrame(zip(a,b), columns=['a', 'b'])
              df_sort_values = df.sort_values(by=['a', 'b'], ascending=False).values.tolist()
              res.append(df_sort_values)
          return res
      $$;

  - type: wait
    time: 1

  - name: python-udf3-60-1
    type: stream
    query: select test_df_sort_values(valuea, valueb) as res from uda_stream;
    schema:
      - name: res
        type: array(array(int64))

  - type: wait
    time: 1

  - type: query
    sql: insert into uda_stream(valuea, valueb) values 
          ([1, 2, 3], [3, 2, 1]) ([6, 5, 4], [4, 5, 6]);

  - type: check
    target_name: python-udf3-60-1
    expected_result:
      - [[[3, 1], [2, 2], [1, 3]]]
      - [[[6, 4], [5, 5], [4, 6]]]
