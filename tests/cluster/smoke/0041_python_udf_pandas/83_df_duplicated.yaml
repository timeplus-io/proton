tags:
  - uda

description: Test covering simple python uda test

steps:
  - type: query
    sql: drop stream if exists uda_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream uda_stream (valuea array(string), valueb array(int));
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_df_duplicated(valuea array(string), valueb array(int)) RETURNS array(bool) LANGUAGE PYTHON AS
      $$
      import pandas as pd

      def test_df_duplicated(valuea, valueb):
          res = []
          for a, b in zip(valuea, valueb):
              df = pd.DataFrame(zip(a,b))
              df_duplicated = df.duplicated().values.tolist()
              res.append(df_duplicated)
          return res
      $$;

  - type: wait
    time: 1

  - name: python-udf3-83-1
    type: stream
    query: select test_df_duplicated(valuea, valueb) as res from uda_stream;
    schema:
      - name: res
        type: array(bool)

  - type: wait
    time: 1

  - type: query
    sql: insert into uda_stream(valuea, valueb) values 
          (['llama', 'cow', 'llama'], [4, 4, 3]) (['llama', 'llama', 'llama'], [4, 4, 5]);

  - type: check
    target_name: python-udf3-83-1
    expected_result:
      - [[False, False, False]]
      - [[False, True, False]]
