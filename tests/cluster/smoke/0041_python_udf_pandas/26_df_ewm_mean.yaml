tags:
  - uda

description: Test covering simple python uda test

steps:
  - type: query
    sql: drop stream if exists uda_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream uda_stream (value array(float64));
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_ewn_mean(value array(float64)) RETURNS array(float64) LANGUAGE PYTHON AS
      $$
      import pandas as pd

      def test_ewn_mean(value):
          res = []
          for v in value:
              df = pd.DataFrame(v, columns=['B'])
              ewn_mean = df.ewm(com=0.5).mean()['B'].tolist()
              res.append(ewn_mean)
          return res
      $$;

  - type: wait
    time: 1

  - name: python-udf3-26-1
    type: stream
    query: select test_ewn_mean(value) as res from uda_stream;
    schema:
      - name: res
        type: array(float64)

  - type: wait
    time: 1

  - type: query
    sql: insert into uda_stream(value) values 
          ([0, 1, 2, 3, 4])([5, 6, 7, 8]);

  - type: check
    target_name: python-udf3-26-1
    expected_result:
      - [[0.0, 0.7499999999999999, 1.6153846153846152, 2.55, 3.5206611570247937]]
      - [[5.0, 5.75, 6.615384615384616, 7.550000000000001]]
