tags:
  - uda

description: Test covering simple python uda test

steps:
  - type: query
    sql: drop stream if exists uda_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream uda_stream (valuea array(int), valueb array(int));
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_df_rename(valuea array(int), valueb array(int)) RETURNS array(string) LANGUAGE PYTHON AS
      $$
      import pandas as pd

      def test_df_rename(valuea, valueb):
          res = []
          for a, b in zip(valuea, valueb):
              df = pd.DataFrame(zip(a,b), columns=['a', 'b'])
              df_rename = df.rename(columns={"a": "c", "b": "d"})
              df_columns = df.columns.tolist()
              res.append(df_columns)
          return res
      $$;

  - type: wait
    time: 1

  - name: python-udf3-65-1
    type: stream
    query: select test_df_rename(valuea, valueb) as res from uda_stream;
    schema:
      - name: res
        type: array(string)

  - type: wait
    time: 1

  - type: query
    sql: insert into uda_stream(valuea, valueb) values 
          ([1, 2, 4], [2, 6, 3]) ([1, 3, 5], [6, 4, 2]);

  - type: check
    target_name: python-udf3-65-1
    expected_result:
      - [['a', 'b']]
      - [['a', 'b']]
