tags:
  - uda

description: Test covering simple python uda test

steps:
  - type: query
    sql: drop stream if exists uda_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream uda_stream (valuea array(float64), valueb array(float64));
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_df_corr(valuea array(float64), valueb array(float64)) RETURNS array(array(float64)) LANGUAGE PYTHON AS
      $$
      import pandas as pd

      def test_df_corr(valuea, valueb):
          res = []
          for a, b in zip(valuea, valueb):
              df = pd.DataFrame(zip(a,b), columns=['dogs', 'cats'])
              df_corr = df.corr(min_periods=3).values.tolist()
              res.append(df_corr)
          return res
      $$;

  - type: wait
    time: 1

  - name: python-udf3-19-1
    type: stream
    query: select test_df_corr(valuea, valueb) as res from uda_stream;
    schema:
      - name: res
        type: array(array(float64))

  - type: wait
    time: 1

  - type: query
    sql: insert into uda_stream(valuea, valueb) values 
          ([1, 2, 3, 4], [1, 5, 3, 4])
          ([5, 6, 7, 8], [9, 6, 7, 8]);

  - type: check
    target_name: python-udf3-19-1
    expected_result:
      - [[[1.0, 0.5291502622129182], [0.5291502622129182, 1.0]]]
      - [[[1.0, -0.1999999999999999], [-0.1999999999999999, 1.0]]]
