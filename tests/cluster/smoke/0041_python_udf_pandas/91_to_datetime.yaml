tags:
  - uda

description: Test covering simple python uda test

steps:
  - type: query
    sql: drop stream if exists uda_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream uda_stream (value array(int));
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_to_datetime(value array(int)) RETURNS array(datetime) LANGUAGE PYTHON AS
      $$
      import pandas as pd

      def test_to_datetime(value):
          res = [pd.to_datetime(v, unit='D', origin=pd.Timestamp('2000-01-01')).to_pydatetime().tolist() for v in value]
          return res
      $$;

  - type: wait
    time: 1

  - name: python-udf3-91-1
    type: stream
    query: select test_to_datetime(value) as res from uda_stream;
    schema:
      - name: res
        type: array(datetime)

  - type: wait
    time: 1

  - type: query
    sql: insert into uda_stream(value) values ([1, 2, 3]) ([4, 5, 6]);

  - type: check
    target_name: python-udf3-91-1
    expected_result:
      - [['2000-01-02 00:00:00', '2000-01-03 00:00:00', '2000-01-04 00:00:00']]
      - [['2000-01-05 00:00:00', '2000-01-06 00:00:00', '2000-01-07 00:00:00']]
