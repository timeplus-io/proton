tags:
  - uda

description: Test covering simple python uda test

steps:
  - type: query
    sql: drop stream if exists uda_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream uda_stream (value array(string));
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_series_duplicated(value array(string)) RETURNS array(bool) LANGUAGE PYTHON AS
      $$
      import pandas as pd

      def test_series_duplicated(value):
          res = []
          for v in value:
              s = pd.Series(v)
              series_duplicated = s.duplicated().tolist()
              res.append(series_duplicated)
          return res
      $$;

  - type: wait
    time: 1

  - name: python-udf3-83-2
    type: stream
    query: select test_series_duplicated(value) as res from uda_stream;
    schema:
      - name: res
        type: array(bool)

  - type: wait
    time: 1

  - type: query
    sql: insert into uda_stream(value) values 
          (['llama', 'cow', 'llama']) (['llama', 'llama', 'llama']);

  - type: check
    target_name: python-udf3-83-2
    expected_result:
      - [[False, False, True]]
      - [[False, True, True]]
