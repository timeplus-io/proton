tags:
  - uda

description: Test covering simple python uda test

steps:
  - type: query
    sql: drop stream if exists uda_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream uda_stream (value int64);
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE AGGREGATE FUNCTION getSeriesIat(value int64) RETURNS int64 LANGUAGE PYTHON AS $$
      import pickle
      import pandas as pd

      class getSeriesIat:
          def __init__(self):
              self.series_iat = 0
              self.has_customized_emit = False

          def serialize(self):
              data = {}
              data['series_iat'] = self.series_iat
              return pickle.dumps(data)

          def deserialize(self, data):
              data = pickle.loads(data)
              self.series_iat = data['series_iat']

          def merge(self, other):
              pass

          def process(self, values):
              s = pd.Series(values)
              self.series_iat = s.iat[len(values)-1]

          def finalize(self):
              return self.series_iat.item()
      $$;

  - type: wait
    time: 1

  - name: python-udf3-2-2
    type: stream
    query: select getSeriesIat(value) as res from uda_stream;
    schema:
      - name: res
        type: int64

  - type: wait
    time: 1

  - type: query
    sql: insert into uda_stream(value) values (2)(4);

  - type: wait
    time: 2

  - type: query
    sql: insert into uda_stream(value) values (7)(20);

  - type: check
    target_name: python-udf3-2-2
    expected_result:
      - [4]
      - [20]
