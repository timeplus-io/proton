tags:
  - uda

description: Test covering simple python uda test

steps:
  - type: query
    sql: drop stream if exists uda_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream uda_stream (value array(int));
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_series_is_monotonic_decreasing(value array(int)) RETURNS bool LANGUAGE PYTHON AS
      $$
      import pandas as pd

      def test_series_is_monotonic_decreasing(value):
          res = []
          for v in value:
              s = pd.Series(v)
              series_is_monotonic_decreasing = s.is_monotonic_decreasing
              res.append(series_is_monotonic_decreasing)
          return res
      $$;

  - type: wait
    time: 1

  - name: python-udf3-52-1
    type: stream
    query: select test_series_is_monotonic_decreasing(value) as res from uda_stream;
    schema:
      - name: res
        type: bool

  - type: wait
    time: 1

  - type: query
    sql: insert into uda_stream(value) values 
          ([1, 2, 4]) ([6, 3, 2]);

  - type: check
    target_name: python-udf3-52-1
    expected_result:
      - [False]
      - [True]
