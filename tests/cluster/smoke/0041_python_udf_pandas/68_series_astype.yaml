tags:
  - uda

description: Test covering simple python uda test

steps:
  - type: query
    sql: drop stream if exists uda_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream uda_stream (value array(int));
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_series_astype(value array(int)) RETURNS string LANGUAGE PYTHON AS
      $$
      import pandas as pd

      def test_series_astype(value):
          res = []
          for v in value:
              s = pd.Series(v, dtype='int32')
              series_astype = str(s.astype('int64').dtypes)
              res.append(series_astype)
          return res
      $$;

  - type: wait
    time: 1

  - name: python-udf3-68-2
    type: stream
    query: select test_series_astype(value) as res from uda_stream;
    schema:
      - name: res
        type: string

  - type: wait
    time: 1

  - type: query
    sql: insert into uda_stream(value) values 
          ([1, 2, 4]) ([2, 6, 3]);

  - type: check
    target_name: python-udf3-68-2
    expected_result:
      - ['int64']
      - ['int64']
