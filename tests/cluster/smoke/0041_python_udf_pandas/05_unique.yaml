tags:
  - udf

description: Test covering simple python udf test

steps:
  - type: query
    sql: drop stream if exists udf_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream udf_stream (value array(int64));
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_unique(value array(int64)) RETURNS array(int64) LANGUAGE PYTHON AS
      $$
      import pandas as pd

      def test_unique(value):
          res = [pd.unique(pd.Series(sublist)).tolist() for sublist in value]
          return res
      $$;

  - type: wait
    time: 1

  - name: python-udf3-5-3
    type: stream
    query: select test_unique(value) as res, value from udf_stream;
    schema:
      - name: res
        type: array(int64)
      - name: value
        type: array(int64)
  - type: wait
    time: 1

  - type: query
    sql: insert into udf_stream(value) values ([2, 1, 3, 3])([2, 1, 1, 1, 1, 1]);

  - type: check
    target_name: python-udf3-5-3
    expected_result:
      - [[2, 1, 3], [2, 1, 3, 3]]
      - [[2, 1], [2, 1, 1, 1, 1, 1]]
