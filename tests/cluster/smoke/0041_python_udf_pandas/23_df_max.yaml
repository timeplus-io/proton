tags:
  - uda

description: Test covering simple python uda test

steps:
  - type: query
    sql: drop stream if exists uda_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream uda_stream (valuea array(float64), valueb array(float64));
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_df_max(valuea array(float64), valueb array(float64)) RETURNS array(float64) LANGUAGE PYTHON AS
      $$
      import pandas as pd

      def test_df_max(valuea, valueb):
          res = []
          for a, b in zip(valuea, valueb):
              df = pd.DataFrame(zip(a,b), columns=['a', 'b'])
              df_max = df.max().tolist()
              res.append(df_max)
          return res
      $$;

  - type: wait
    time: 1

  - name: python-udf3-23-1
    type: stream
    query: select test_df_max(valuea, valueb) as res from uda_stream;
    schema:
      - name: res
        type: array(float64)

  - type: wait
    time: 1

  - type: wait
    time: 1

  - type: query
    sql: insert into uda_stream(valuea, valueb) values 
          ([1, 2, 3], [2, 3, 4]) ([4, 5, 6], [6, 7, 8]);

  - type: check
    target_name: python-udf3-23-1
    expected_result:
      - [[3, 4]]
      - [[6, 8]]