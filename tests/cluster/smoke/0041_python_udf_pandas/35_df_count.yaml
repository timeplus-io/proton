tags:
  - uda

description: Test covering simple python uda test

steps:
  - type: query
    sql: drop stream if exists uda_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream uda_stream (valuea array(int), valueb array(int));
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_df_count(valuea array(int), valueb array(int)) RETURNS array(int) LANGUAGE PYTHON AS
      $$
      import pandas as pd

      def test_df_count(valuea, valueb):
          res = []
          for a, b in zip(valuea, valueb):
              df = pd.DataFrame(zip(a,b), columns=['a', 'b'])
              df_count = df.count().tolist()
              res.append(df_count)
          return res
      $$;

  - type: wait
    time: 1

  - name: python-udf3-35-1
    type: stream
    query: select test_df_count(valuea, valueb) as res from uda_stream;
    schema:
      - name: res
        type: array(int32)

  - type: wait
    time: 1

  - type: query
    sql: insert into uda_stream(valuea, valueb) values 
          ([1, 2, 4], [2, 3, 6]) ([1, 3], [2, 4]);

  - type: check
    target_name: python-udf3-35-1
    expected_result:
      - [[3, 3]]
      - [[2, 2]]
