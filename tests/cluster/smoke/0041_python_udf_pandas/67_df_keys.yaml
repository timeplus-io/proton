tags:
  - uda

description: Test covering simple python uda test

steps:
  - type: query
    sql: drop stream if exists uda_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream uda_stream (valuea array(int), valueb array(int));
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_df_keys(valuea array(int), valueb array(int)) RETURNS string LANGUAGE PYTHON AS
      $$
      import pandas as pd

      def test_df_keys(valuea, valueb):
          res = []
          for a, b in zip(valuea, valueb):
              if len(a) > 0:
                  df = pd.DataFrame(zip(a,b), columns=['a', 'b'])
                  df_keys = str(df.keys())
                  res.append(df_keys)
          return res
      $$;

  - type: wait
    time: 1

  - name: python-udf3-67-1
    type: stream
    query: select test_df_keys(valuea, valueb) as res from uda_stream;
    schema:
      - name: res
        type: string

  - type: wait
    time: 1

  - type: query
    sql: insert into uda_stream(valuea, valueb) values 
          ([1, 2, 4], [2, 6, 3]) ([1, 3, 5], [6, 4, 2]);

  - type: check
    target_name: python-udf3-67-1
    expected_result:
      - ["Index(['a', 'b'], dtype='object')"]
      - ["Index(['a', 'b'], dtype='object')"]
