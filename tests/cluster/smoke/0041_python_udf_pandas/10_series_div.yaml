tags:
  - uda

description: Test covering simple python uda test

steps:
  - type: query
    sql: drop stream if exists udf_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream udf_stream (valuea array(int), valueb array(int));
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_series_div(valuea array(int), valueb array(int)) RETURNS array(float64) LANGUAGE PYTHON AS
      $$
      import pandas as pd

      def test_series_div(valuea, valueb):
          res = []
          for a, b in zip(valuea, valueb):
              df_a = pd.Series(a)
              df_b = pd.Series(b)
              series_div = df_a.div(df_b).values.tolist()
              res.append(series_div)
          return res
      $$;

  - type: wait
    time: 1

  - name: python-udf3-10-2
    type: stream
    query: select test_series_div(valuea, valueb) as res from udf_stream;
    schema:
      - name: res
        type: array(float64)

  - type: wait
    time: 1

  - type: query
    sql: insert into udf_stream(valuea, valueb) values 
          ([1, 2, 3], [7, 8, 9])
          ([4, 5, 6], [10, 11, 12]);

  - type: check
    target_name: python-udf3-10-2
    expected_result:
      - [[0.14285714285714285, 0.25, 0.3333333333333333]]
      - [[0.4, 0.45454545454545453, 0.5]]
