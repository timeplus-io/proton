tags:
  - uda

description: Test covering simple python uda test

steps:
  - type: query
    sql: drop stream if exists uda_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream uda_stream (valuea array(string), valueb array(string), valuec array(int));
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_df_pivot(valuea array(string), valueb array(string), valuec array(int)) RETURNS array(array(int)) LANGUAGE PYTHON AS
      $$
      import pandas as pd

      def test_df_pivot(valuea, valueb, valuec):
          res = []
          for a, b, c in zip(valuea, valueb, valuec):
              df = pd.DataFrame(zip(a,b,c), columns=['a','b','c'])
              df_pivot = df.pivot(index='a', columns='b', values='c').values.tolist()
              res.append(df_pivot)
          return res
      $$;

  - type: wait
    time: 1

  - name: python-udf3-11-1
    type: stream
    query: select test_df_pivot(valuea, valueb, valuec) as res from uda_stream;
    schema:
      - name: res
        type: array(array(int32))

  - type: wait
    time: 1

  - type: query
    sql: insert into uda_stream(valuea, valueb, valuec) values 
          (['one', 'one', 'two', 'two'], ['A', 'B', 'A', 'B'], [1, 2, 3, 4])(['one', 'two', 'one', 'two'], ['A', 'A', 'B', 'B'], [5, 6, 7, 8]);
  
  - type: check
    target_name: python-udf3-11-1
    expected_result:
      - [[[1, 2], [3, 4]]]
      - [[[5, 7], [6, 8]]]
