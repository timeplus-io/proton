tags:
  - uda

description: Test covering simple python uda test

steps:
  - type: query
    sql: drop stream if exists uda_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream uda_stream (valuea array(string), valueb array(string));
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_to_json(valuea array(string), valueb array(string)) RETURNS string LANGUAGE PYTHON AS
      $$
      import pandas as pd

      def test_to_json(valuea, valueb):
          res = []
          for a, b in zip(valuea, valueb):
              df = pd.DataFrame(zip(a,b), columns=['col1', 'col2'],
                                index=['row1', 'row2'])
              json_res = df.to_json(orient='index')
              res.append(json_res)
          return res
      $$;

  - type: wait
    time: 1

  - name: python-udf3-89-1
    type: stream
    query: select test_to_json(valuea, valueb) as res from uda_stream;
    schema:
      - name: res
        type: string

  - type: wait
    time: 1

  - type: query
    sql: insert into uda_stream(valuea, valueb) values 
          (['a', 'b'], ['c', 'd'])
          (['e', 'f'], ['g', 'h']);

  - type: check
    target_name: python-udf3-89-1
    expected_result:
      - ['{"row1":{"col1":"a","col2":"c"},"row2":{"col1":"b","col2":"d"}}']
      - ['{"row1":{"col1":"e","col2":"g"},"row2":{"col1":"f","col2":"h"}}']
