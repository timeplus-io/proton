tags:
  - uda

description: Test covering simple python uda test

steps:
  - type: query
    sql: drop stream if exists uda_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream uda_stream (valuea array(int), valueb array(int));
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_df_isin(valuea array(int), valueb array(int)) RETURNS array(array(bool)) LANGUAGE PYTHON AS
      $$
      import pandas as pd

      def test_df_isin(valuea, valueb):
          res = []
          for a, b in zip(valuea, valueb):
              df = pd.DataFrame(zip(a,b))
              df_isin = df.isin([1, 2]).values.tolist()
              res.append(df_isin)
          return res
      $$;

  - type: wait
    time: 1

  - name: python-udf3-69-1
    type: stream
    query: select test_df_isin(valuea, valueb) as res from uda_stream;
    schema:
      - name: res
        type: array(array(bool))

  - type: wait
    time: 1

  - type: query
    sql: insert into uda_stream(valuea, valueb) values 
          ([1, 2, 4], [2, 6, 3]) ([1, 3, 5], [6, 4, 2]);

  - type: check
    target_name: python-udf3-69-1
    expected_result:
      - [[[True, True], [True, False], [False, False]]]
      - [[[True, False], [False, False], [False, True]]]
