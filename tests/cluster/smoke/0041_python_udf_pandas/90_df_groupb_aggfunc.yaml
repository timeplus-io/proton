tags:
  - uda

description: Test covering simple python uda test

steps:
  - type: query
    sql: drop stream if exists uda_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream uda_stream (valuea array(string), valueb array(int));
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_df_groupby_aggfunc(valuea array(string), valueb array(int)) RETURNS array(array(int64)) LANGUAGE PYTHON AS
      $$
      import pandas as pd

      def test_df_groupby_aggfunc(valuea, valueb):
          res = []
          for a, b in zip(valuea, valueb):
              df = pd.DataFrame(zip(a,b), columns=['a','b'])
              df_groupby_aggfunc = df.groupby(['a']).agg('min').values.tolist()
              res.append(df_groupby_aggfunc)
          return res
      $$;

  - type: wait
    time: 1

  - name: python-udf3-90-1
    type: stream
    query: select test_df_groupby_aggfunc(valuea, valueb) as res from uda_stream;
    schema:
      - name: res
        type: array(array(int64))

  - type: wait
    time: 1

  - type: query
    sql: insert into uda_stream(valuea, valueb) values 
          (['one', 'one', 'two'], [3, 2, 1]) (['one', 'two', 'one'], [4, 4, 5]);

  - type: check
    target_name: python-udf3-90-1
    expected_result:
      - [[[2], [1]]]
      - [[[4], [4]]]
