tags:
  - uda

description: Test covering simple python uda test

steps:
  - type: query
    sql: drop stream if exists uda_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream uda_stream (value array(int));
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_series_nlargest(value array(int)) RETURNS array(int) LANGUAGE PYTHON AS
      $$
      import pandas as pd

      def test_series_nlargest(value):
          res = []
          for v in value:
              if len(v) > 0:
                  s = pd.Series(v)
                  series_nlargest = s.nlargest(2).values.tolist()
                  res.append(series_nlargest)
          return res
      $$;

  - type: wait
    time: 1

  - name: python-udf3-42-2
    type: stream
    query: select test_series_nlargest(value) as res from uda_stream;
    schema:
      - name: res
        type: array(int32)

  - type: wait
    time: 1

  - type: query
    sql: insert into uda_stream(value) values 
          ([1, 2, 4]) ([2, 6, 3]);

  - type: check
    target_name: python-udf3-42-2
    expected_result:
      - [[4, 2]]
      - [[6, 3]]
