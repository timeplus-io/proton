tags:
  - uda

description: Test covering simple python uda test

steps:
  - type: query
    sql: drop stream if exists uda_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream uda_stream (valuea int64, valueb int64);
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE AGGREGATE FUNCTION getIat(valuea int64, valueb int64) RETURNS int64 LANGUAGE PYTHON AS $$
      import pickle
      import pandas as pd

      class getIat:
          def __init__(self):
              self.df_iat = 0
              self.has_customized_emit = False

          def serialize(self):
              data = {}
              data['df_iat'] = self.df_iat
              return pickle.dumps(data)

          def deserialize(self, data):
              data = pickle.loads(data)
              self.df_iat = data['df_iat']

          def merge(self, other):
              pass

          def process(self, valueas, valuebs):
              df = pd.DataFrame(zip(valueas, valuebs))
              self.df_iat = df.iat[len(valueas)-1, 1]

          def finalize(self):
              return self.df_iat.item()
      $$;

  - type: wait
    time: 1

  - name: python-udf3-2-1
    type: stream
    query: select getIat(valuea, valueb) as res from uda_stream;
    schema:
      - name: res
        type: int64

  - type: wait
    time: 1

  - type: query
    sql: insert into uda_stream(valuea, valueb) values (0, 2)(0, 4);

  - type: wait
    time: 2

  - type: query
    sql: insert into uda_stream(valuea, valueb) values (1, 7)(10, 20);

  - type: check
    target_name: python-udf3-2-1
    expected_result:
      - [4]
      - [20]
