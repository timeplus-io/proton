tags:
  - uda

description: Test covering simple python uda test

steps:
  - type: query
    sql: drop stream if exists uda_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream uda_stream (value array(int));
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_rolling_std(value array(int)) RETURNS array(float64) LANGUAGE PYTHON AS
      $$
      import pandas as pd

      def test_rolling_std(value):
          res = []
          for v in value:
              s = pd.Series(v)
              rolling_std = s.rolling(2).std().tolist()
              res.append(rolling_std)
          return res
      $$;

  - type: wait
    time: 1

  - name: python-udf3-94-1
    type: stream
    query: select test_rolling_std(value) as res from uda_stream;
    schema:
      - name: res
        type: array(float64)

  - type: wait
    time: 1

  - type: query
    sql: insert into uda_stream(value) values 
          ([1, 2, 3]) ([4, 5, 4]);

  - type: check
    target_name: python-udf3-94-1
    expected_result:
      - [[NaN, 0.7071067811865476, 0.7071067811865476]]
      - [[NaN, 0.7071067811865476, 0.7071067811865476]]
