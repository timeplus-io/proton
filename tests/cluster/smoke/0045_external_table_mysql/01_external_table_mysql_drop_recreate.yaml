tags:
  - udf

description: |
  Test drop and recreate MySQL external table
  Main Steps:
    1.Create table in MySQL
    2.Create external table with type mysql
    3.Create JS UDF
    4.Ingest data into external table
    5.Check external table
    6.Check JS UDF from external table
    7.Drop function, external table, mysql table
    8.Repeat Step 1-7

steps:
  - type: command
    node: [s1]
    shell: docker exec <<.CONTAINER_NAME_PREFIX>>_mysql mysql -u root --password=rootpassword -e "DROP DATABASE IF EXISTS testdb;" mysql

  - type: command
    node: [s1]
    shell: docker exec <<.CONTAINER_NAME_PREFIX>>_mysql mysql -u root --password=rootpassword -e "CREATE DATABASE testdb;" mysql

  - type: command
    node: [s1]
    shell: docker exec <<.CONTAINER_NAME_PREFIX>>_mysql mysql -u root --password=rootpassword -e "CREATE TABLE products (id INT PRIMARY KEY, name VARCHAR(255));" testdb

  - type: command
    node: [s1]
    shell: docker exec <<.CONTAINER_NAME_PREFIX>>_mysql mysql -u root --password=rootpassword -e "INSERT INTO products (id, name) VALUES (1, 'p111');" testdb

  - type: query
    sql: DROP FUNCTION IF EXISTS add_suffix;

  - type: query
    sql: DROP STREAM IF EXISTS mysql_test1;

  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE EXTERNAL TABLE mysql_test1
      SETTINGS type='mysql', address='mysql:3306', user='root', password='rootpassword', database='testdb', table='products', replace_query=true;

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION add_suffix(name string) RETURNS string LANGUAGE JAVASCRIPT AS $$
        function add_suffix(name) {
          for(let i=0;i<name.length;i++) {
            name[i]=name[i]+'x';
          }
          return name;
        }
      $$;

  - type: wait
    time: 1

  - type: query
    sql: INSERT INTO mysql_test1(id, name) VALUES(1, 'p111_replaced') (2, 'p222_new');

  - type: wait
    time: 1

  - name: mysql-1-1
    type: stream
    query: SELECT * FROM mysql_test1;
    schema:
      - name: id
        type: int32
      - name: name
        type: nullable(string)

  - name: mysql-1-2
    type: stream
    query: SELECT add_suffix(name) as res FROM mysql_test1;
    schema:
      - name: res
        type: nullable(string)

  - type: wait
    time: 1

  - type: check
    target_name: mysql-1-1
    expected_result:
      - [1, 'p111_replaced']
      - [2, 'p222_new']

  - type: check
    target_name: mysql-1-2
    expected_result:
      - ['p111_replacedx']
      - ['p222_newx']

  # drop and recreate
  - type: query
    sql: DROP FUNCTION IF EXISTS add_suffix;

  - type: query
    sql: DROP STREAM IF EXISTS mysql_test1;

  - type: command
    node: [s1]
    shell: docker exec <<.CONTAINER_NAME_PREFIX>>_mysql mysql -u root --password=rootpassword -e "DROP DATABASE IF EXISTS testdb;" mysql

  - type: command
    node: [s1]
    shell: docker exec <<.CONTAINER_NAME_PREFIX>>_mysql mysql -u root --password=rootpassword -e "CREATE DATABASE testdb;" mysql

  - type: command
    node: [s1]
    shell: docker exec <<.CONTAINER_NAME_PREFIX>>_mysql mysql -u root --password=rootpassword -e "CREATE TABLE products (id INT PRIMARY KEY, name VARCHAR(255));" testdb

  - type: command
    node: [s1]
    shell: docker exec <<.CONTAINER_NAME_PREFIX>>_mysql mysql -u root --password=rootpassword -e "INSERT INTO products (id, name) VALUES (3, 'p333');" testdb

  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE EXTERNAL TABLE mysql_test1
      SETTINGS type='mysql', address='mysql:3306', user='root', password='rootpassword', database='testdb', table='products', replace_query=true;

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION add_suffix(name string) RETURNS string LANGUAGE JAVASCRIPT AS $$
        function add_suffix(name) {
          for(let i=0;i<name.length;i++) {
            name[i]=name[i]+'x';
          }
          return name;
        }
      $$;

  - type: wait
    time: 1

  - type: query
    sql: INSERT INTO mysql_test1(id, name) VALUES(3, 'p333_replaced') (4, 'p444_new');

  - type: wait
    time: 1

  - name: mysql-1-3
    type: stream
    query: SELECT * FROM mysql_test1;
    schema:
      - name: id
        type: int32
      - name: name
        type: nullable(string)

  - name: mysql-1-4
    type: stream
    query: SELECT add_suffix(name) as res FROM mysql_test1;
    schema:
      - name: res
        type: nullable(string)

  - type: wait
    time: 1

  - type: check
    target_name: mysql-1-3
    expected_result:
      - [3, 'p333_replaced']
      - [4, 'p444_new']

  - type: check
    target_name: mysql-1-4
    expected_result:
      - ['p333_replacedx']
      - ['p444_newx']
