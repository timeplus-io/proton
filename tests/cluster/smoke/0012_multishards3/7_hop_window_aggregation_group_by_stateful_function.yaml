description: hop window aggregation group by, stateful function
cluster:
- p1k1
- p3k1
steps:
  - type: wait
    time: 1

  - type: query
    sql: |
      drop view if exists test13_view2_3;

  - type: wait
    time: 1

  - type: query
    sql: |
      drop view if exists test13_view1_3;

  - type: wait
    time: 1

  - type: query
    sql: |
      drop stream if exists test13_multishard_3;

  - type: wait
    time: 1

  - type: query
    sql: create stream test13_multishard_3(i float, k1 int, k2 string, timestamp datetime64(3) default now64(3)) settings shards=3;
  
  - type: wait
    time: 5
  
  - name: '1327'
    type: stream
    query: |
      select k2,
             max(i),
             min(i),
             avg(i),
             count(i),
             window_start as s,
             window_end as e
      from hop(test13_multishard_3, timestamp, 2s, 5s)
      group by k2,
               window_start,
               window_end;
    schema:
      - name: k2
        type: string
      - name: max(i)
        type: float32
      - name: min(i)
        type: float32
      - name: avg(i)
        type: float64
      - name: count(i)
        type: uint64
      - name: s
        type: datetime64(3)
      - name: e
        type: datetime64(3)
        
  - type: wait
    time: 1

  - type: query
