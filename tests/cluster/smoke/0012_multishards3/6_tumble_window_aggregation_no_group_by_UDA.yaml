tags:
- multishards
- append_only
- streaming_aggregation
- window_aggregation
- tumble_window_aggregation
- no_group_by
- UDA
description: tumble window aggregation no group by, UDA
cluster:
- p1k1
- p3k1
steps:
  - type: wait
    time: 1

  - type: query
    sql: |
      drop stream if exists test13_multishard_3;

  - type: wait
    time: 1

  - type: query
    sql: create stream test13_multishard_3(i float, k int, timestamp datetime64(3) default now64(3)) settings shards=3;
  
  - type: wait
    time: 5
  
  - name: '1326'
    type: stream
    query: |
      select test_13_3_sec_large(i),
             window_start as s,
             window_end as e
      from tumble(test13_multishard_3 ,timestamp, 5s)
      group by window_start,
               window_end;
    schema:
      - name: test_13_3_sec_large(i)
        type: float32
      - name: s
        type: datetime64(3)
      - name: e
        type: datetime64(3)
        
  - type: wait
    time: 1

  - type: query
    node: [p1]
    sql: |
      insert into test13_multishard_3(i, k, timestamp)
      values(0, 0, '2021-11-02 20:00:01Z');

