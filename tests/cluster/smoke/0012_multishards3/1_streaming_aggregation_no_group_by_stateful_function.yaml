tags:
- multishards
- append_only
- streaming_aggregation
- global_aggregation
- no_group_by
- stateful_function
description: streaming aggregation no group by, stateful function
cluster:
- p1k1
- p3k1
steps:
  - type: wait
    time: 1

  - type: query
    sql: |
      drop stream if exists test13_multishard_3;

  - type: wait
    time: 1

  - type: query
    sql: create stream test13_multishard_3(i float, k1 int, k2 string) settings shards=3;
  
  - type: wait
    time: 5
  
  - name: '1321'
    type: stream
    query: |
      select max(i),
             min(i),
             avg(i),
             count(i)
      from test13_multishard_3
      emit periodic 100ms;
    schema:
        - name: max(i)
          type: float32
        - name: min(i)
          type: float32
        - name: avg(i)
          type: float64
        - name: count(i)
          type: uint64

  - type: wait
    time: 1

  - type: query
    node: [p1]
    sql: |
      insert into test13_multishard_3 (i, k1, k2)
      values (1, 0, 'a');

  - type: wait
    time: 1

  - type: query
    <<if eq .nodes "1">>
    node: [p1]
    <<else>>
    node: [p2]
    <<end>>
    sql: |
      insert into test13_multishard_3 (i, k1, k2)
      values (2, 0, 'b');

  - type: wait
    time: 1

  - type: query
    <<if eq .nodes "1">>
    node: [p1]
    <<else>>
    node: [p3]
    <<end>>
    sql: |
      insert into test13_multishard_3 (i, k1, k2)
      values (3, 0, 'c');

  - type: wait
    time: 1

  - type: query
    node: [p1]
    sql: |
      insert into test13_multishard_3 (i, k1, k2)
      values (4, 0, 'c');

  - type: wait
    time: 1

  - type: query
    <<if eq .nodes "1">>
    node: [p1]
    <<else>>
    node: [p2]
    <<end>>
    sql: |
      insert into test13_multishard_3 (i, k1, k2)
      values (5, 0, 'a');

  - type: wait
    time: 1

  - type: query
    <<if eq .nodes "1">>
    node: [p1]
    <<else>>
    node: [p3]
    <<end>>
    sql: |
      insert into test13_multishard_3 (i, k1, k2)
      values (6, 0, 'b');

  - type: check
    target_name: '1321'
    expected_result:
    - [1, 1, 1, 1]
    - [2, 1, 1.5, 2]
    - [3, 1, 2, 3]
    - [4, 1, 2.5, 4]
    - [5, 1, 3, 5]
    - [6, 1, 3.5, 6]
