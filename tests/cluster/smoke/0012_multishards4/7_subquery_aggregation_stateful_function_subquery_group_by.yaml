tags:
- multishards
- append_only
- subquery
- subquery_view_materialized-view
- tail_aggr_last-X
- streaming_aggregation
- global_aggregation
- no_group_by
- stateful_function
description: subquery aggregation stateful function, subquery group by
cluster:
- p1k1
- p3k1
steps:
  - type: wait
    time: 1

  - type: query
    sql: |
      drop view if exists test13_view2_4;

  - type: wait
    time: 1

  - type: query
    sql: |
      drop view if exists test13_view1_4;

  - type: wait
    time: 1

  - type: query
    sql: |
      drop stream if exists test13_subq_4;

  - type: wait
    time: 1

  - type: query
    sql: create stream test13_subq_4(val float, f int, k int) settings shards=3;

  - type: wait
    time: 1

  - type: query
    sql: |
      create materialized view test13_view1_4 as
      select max(val) as mx,
             min(val) as mn,
             count() as cnt
      from test13_subq_4 emit periodic 100ms;
  
  - type: wait
    time: 1
  
  - name: '1337'
    type: stream
    query: |
      select mx,
             mn,
             cnt
      from test13_view1_4
      where cnt > 3;
    schema:
        - name: mx
          type: float32
        - name: mn
          type: float32
        - name: cnt
          type: uint64
          
  - type: wait
    time: 1

  - type: query
    sql: |
      insert into test13_subq_4 (val, f, k)
      values (2, 0, 1);

  - type: wait
    time: 1

  - type: query
    sql: |
      insert into test13_subq_4 (val, f, k)
      values (2, 0, 2);

  - type: wait
    time: 1

  - type: query
    sql: |
      insert into test13_subq_4 (val, f, k)
      values (2, 0, 3);

  - type: wait
    time: 1

  - type: query
    sql: |
      insert into test13_subq_4 (val, f, k)
      values (3, 0, 2);

  - type: wait
    time: 1

  - type: query
    sql: |
      insert into test13_subq_4 (val, f, k)
      values (2, 0, 3);

  - type: wait
    time: 1

  - type: query
    sql: |
      insert into test13_subq_4 (val, f, k)
      values (1, 0, 1);

  - type: check
    target_name: '1337'
    expected_result:
    - [3, 2, 4]
    - [3, 2, 5]
    - [3, 1, 6]
