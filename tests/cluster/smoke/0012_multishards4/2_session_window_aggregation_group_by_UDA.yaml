description: session window aggregation group by, UDA
cluster:
- p1k1
- p3k1
steps:
  - type: wait
    time: 1

  - type: query
    sql: |
      drop stream if exists test13_multishard_4;

  - type: wait
    time: 1

  - type: query
    sql: create stream test13_multishard_4(speed int, id int, timestamp datetime64(3) default now64(3)) settings shards=3;
  
  - type: wait
    time: 1
  
  - name: '1332'
    type: stream
    query: |
      select id,
             test_13_4_sec_large(to_float(speed)),
             window_start as s,
             window_end as e
      from session(test13_multishard_4, timestamp, 5m, [speed >= 60, speed < 60))
      group by id,
               window_start,
               window_end
      order by id;
    schema: 
      - name: id
        type: int32
      - name: test_13_4_sec_large(to_float(speed))
        type: float32
      - name: s
        type: datetime64(3)
      - name: e
        type: datetime64(3)
        
  - type: wait
    time: 1

  - type: query
    sql: |
      insert into test13_multishard_4(speed, id, timestamp)
      values (40, 1, '2021-11-02 20:00:01');

  - type: wait
    time: 1

  - type: query
    sql: |
      insert into test13_multishard_4(speed, id, timestamp)
