description: subquery aggregation UDA, subquery group by
cluster:
- p1k1
- p3k1
steps:
  - type: wait
    time: 1

  - type: query
    sql: |
      drop view if exists test13_view2_4;

  - type: wait
    time: 1

  - type: query
    sql: |
      drop view if exists test13_view1_4;

  - type: wait
    time: 1

  - type: query
    sql: |
      drop stream if exists test13_subq_4;

  - type: wait
    time: 1

  - type: query
    sql: create stream test13_subq_4(val float, f int, k int) settings shards=3;

  - type: wait
    time: 1

  - type: query
    sql: |
      create materialized view test13_view1_4 as
      select test_13_4_sec_large(val) as sec_l
      from test13_subq_4 emit periodic 100ms;
  
  - type: wait
    time: 1
  
  - name: '1338'
    type: stream
    query: |
      select sec_l
      from test13_view1_4;
    schema:
        - name: sec_l
          type: float32
          
  - type: wait
    time: 1

  - type: query
    sql: |
      insert into test13_subq_4 (val, f, k)
      values (0, 0, 1);

  - type: wait
    time: 1

  - type: query
    sql: |
      insert into test13_subq_4 (val, f, k)
      values (1, 0, 2);

  - type: wait
    time: 1

  - type: query
    sql: |
      insert into test13_subq_4 (val, f, k)
      values (2, 0, 3);

  - type: wait
    time: 1

  - type: query
    sql: |
      insert into test13_subq_4 (val, f, k)
      values (3, 0, 2);

  - type: wait
    time: 1

  - type: query
    sql: |
      insert into test13_subq_4 (val, f, k)
      values (2, 0, 3);

  - type: wait
    time: 1

  - type: query
    sql: |
      insert into test13_subq_4 (val, f, k)
      values (1, 0, 1);

  - type: check
    target_name: '1338'
    expected_result:
    - [-1]
    - [0]
    - [1]
    - [2]
    - [2]
    - [2]
