description: hop window aggregation no group by, UDA
cluster:
- p1k1
- p3k1
steps:
  - type: wait
    time: 1

  - type: query
    sql: |
      drop stream if exists test13_multishard_4;

  - type: wait
    time: 1

  - type: query
    sql: create stream test13_multishard_4(i float, k1 int, k2 string, timestamp datetime64(3) default now64(3)) settings shards=3;
  
  - type: wait
    time: 2
  
  - name: '1330'
    type: stream
    query: |
      select test_13_4_sec_large(i),
             window_start as s,
             window_end as e
      from hop(test13_multishard_4, timestamp, 2s, 5s)
      group by window_start,
               window_end;
    schema:
      - name: test_13_4_sec_large(i)
        type: float32
      - name: s
        type: datetime64(3)
      - name: e
        type: datetime64(3)
        
  - type: wait
    time: 1

