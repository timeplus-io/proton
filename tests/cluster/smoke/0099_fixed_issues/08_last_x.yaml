tags:
  - last x
description: (#2556) stremaing hop query with last x
cluster:
  - p1k1
  - p3k1
steps:
  - type: query
    sql: drop stream if exists test_stream_2556
  - type: wait
    time: 2

  - type: query
    sql: create stream test_stream_2556
        (
          i int
        )
  - type: wait
    time: 2

  - type: stream
    name: 9900
    query: select count() from test_stream_2556 emit last 6m
    schema:
      - name: count()
        type: uint64
  - type: wait
    time: 2

  - type: stream
    name: 9901
    query: select count() from test_stream_2556 emit last 2000s
    schema:
      - name: count()
        type: uint64
  - type: wait
    time: 2

  - type: stream
    name: 9902
    query: select count() from test_stream_2556 emit last 1h
    schema:
      - name: count()
        type: uint64
  
  - type: check
    target_name: 9900
    expected_result: []

  - type: check
    target_name: 9901
    expected_result: []

  - type: check
    target_name: 9902
    expected_result:
      - ["error_code:62"]
