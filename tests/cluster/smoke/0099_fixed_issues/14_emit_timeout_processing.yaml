tags:
  - Emit timeout processing
description: (#2905) Covering timeout processing for window aggregations
cluster:
  - p1k1
  - p3k1
steps:
  - type: query
    sql: drop stream if exists test_stream_2905

  - type: query
    sql: create stream test_stream_2905
        (
          id int,
          name string,
          val float,
          ts datetime
        )
  - type: wait
    time: 1

  - type: stream
    name: 9900
    query: select id, count(*), min(val), max(val), sum(val), avg(val), window_start, window_end from hop(test_stream_2905, ts, 2s, 5s) group by id, window_start, window_end emit after window close and timeout 2s
    schema:
      - name: id
        type: int32
      - name: count()
        type: uint64
      - name: min(val)
        type: float32
      - name: max(val)
        type: float32
      - name: sum(val)
        type: float64
      - name: avg(val)
        type: float64
      - name: window_start
        type: datetime
      - name: window_end
        type: datetime

  - type: stream
    name: 9901
    query: select id, count(*), min(val), max(val), sum(val), avg(val), window_start, window_end from hop(test_stream_2905, ts, 2s, 5s) group by id, window_start, window_end emit timeout 2s
    schema:
      - name: id
        type: int32
      - name: count()
        type: uint64
      - name: min(val)
        type: float32
      - name: max(val)
        type: float32
      - name: sum(val)
        type: float64
      - name: avg(val)
        type: float64
      - name: window_start
        type: datetime
      - name: window_end
        type: datetime

  - type: wait
    time: 1

  - type: query
    sql: insert into test_stream_2905(id, name, val, ts) values
    schema:
      - name: id
        type: int32
      - name: name
        type: string
      - name: val
        type: float32
      - name: ts
        type: datetime
    inputs:
      - [1, 's1', 11.1, '2020-02-02 20:00:01']
      - [2, 's2', 22.2, '2020-02-02 20:00:02']
      - [1, 's3', 33.3, '2020-02-02 20:00:03']
      - [2, 's4', 44.4, '2020-02-02 20:00:04']

  - type: check
    target_name: 9900
    mode: <<or .aggregation_check_mode "sequence">>
    expected_result:
      - [1, 1, 11.1, 11.1, 11.1, 11.1, "2020-02-02 19:59:58", "2020-02-02 20:00:03"]
      - [2, 1, 22.2, 22.2, 22.2, 22.2, "2020-02-02 19:59:58", "2020-02-02 20:00:03"]
      - [1, 2, 11.1, 33.3, 44.4, 22.2, "2020-02-02 20:00:00", "2020-02-02 20:00:05"]
      - [2, 2, 22.2, 44.4, 66.6, 33.3, "2020-02-02 20:00:00", "2020-02-02 20:00:05"]
      - [1, 1, 33.3, 33.3, 33.3, 33.3, "2020-02-02 20:00:02", "2020-02-02 20:00:07"]
      - [2, 2, 22.2, 44.4, 66.6, 33.3, "2020-02-02 20:00:02", "2020-02-02 20:00:07"]
      - [2, 1, 44.4, 44.4, 44.4, 44.4, "2020-02-02 20:00:04", "2020-02-02 20:00:09"]

  - type: check
    target_name: 9901
    mode: <<or .aggregation_check_mode "sequence">>
    expected_result:
      - [1, 1, 11.1, 11.1, 11.1, 11.1, "2020-02-02 19:59:58", "2020-02-02 20:00:03"]
      - [2, 1, 22.2, 22.2, 22.2, 22.2, "2020-02-02 19:59:58", "2020-02-02 20:00:03"]
      - [1, 2, 11.1, 33.3, 44.4, 22.2, "2020-02-02 20:00:00", "2020-02-02 20:00:05"]
      - [2, 2, 22.2, 44.4, 66.6, 33.3, "2020-02-02 20:00:00", "2020-02-02 20:00:05"]
      - [1, 1, 33.3, 33.3, 33.3, 33.3, "2020-02-02 20:00:02", "2020-02-02 20:00:07"]
      - [2, 2, 22.2, 44.4, 66.6, 33.3, "2020-02-02 20:00:02", "2020-02-02 20:00:07"]
      - [2, 1, 44.4, 44.4, 44.4, 44.4, "2020-02-02 20:00:04", "2020-02-02 20:00:09"]
