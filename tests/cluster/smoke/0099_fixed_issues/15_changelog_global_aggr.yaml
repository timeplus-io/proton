tags:
  - Changelog Global Aggr
description: (#13) Covering changelog global aggr processing
cluster:
  - p1k1
  - p3k1
steps:
  - type: query
    sql: drop stream if exists test_stream_13_vk

  - type: query
    sql: create stream test_stream_13_vk
        (
          id int,
          val float
        )
        primary key id settings mode='versioned_kv'
  - type: wait
    time: 2

  - type: stream
    name: '9900'
    query: select count(*), sum(val) from test_stream_13_vk emit periodic 1ms
    schema:
      - name: count(*)
        type: uint64
      - name: sum(val)
        type: float64
  - type: wait
    time: 1

  - type: query
    sql: insert into test_stream_13_vk(id, val) values
    schema:
      - name: id
        type: int32
      - name: val
        type: float32
    inputs:
      - [1, 1.1]
      - [2, 2.2]
  - type: wait
    time: 1

  - type: query
    sql: insert into test_stream_13_vk(id, val) values
    schema:
      - name: id
        type: int32
      - name: val
        type: float32
    inputs:
      - [1, 11.1]

  - type: check
    target_name: '9900'
    expected_result:
      - [2, 3.3]
      - [2, 13.3]
