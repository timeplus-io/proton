tags:
  - materialized view
description: (#9436) emit timeout for multiple shards using hybrid aggregation
cluster:
  - p1k1
  - p3k1
steps:
  - type: query
    sql: drop stream if exists 9436_multi_shards
  - type: wait
    time: 2

  - type: query
    sql: create stream 9436_multi_shards 
        (
          `s` string, 
          `i` int
        ) settings shards = 2;
  - type: wait
    time: 2

  - type: query
    sql: insert into 9436_multi_shards(s, i, _tp_time) values ('s1', 1, '2025-06-22 00:00:00');
  - type: wait
    time: 2

  - type: stream
    name: 19902
    query: select window_start, s, max(i) AS max_i from tumble(9436_multi_shards, 2s) GROUP BY window_start, s EMIT STREAM AFTER WINDOW CLOSE AND TIMEOUT 1s SETTINGS default_hash_table = 'hybrid', seek_to='earliest';
    schema:
      - name: window_start
        type: datetime64(3)
      - name: s
        type: string
      - name: max_i
        type: int32

  - type: check
    target_name: 19902
    expected_result:
      - ['2025-06-22 00:00:00.000', 's1', 1]
