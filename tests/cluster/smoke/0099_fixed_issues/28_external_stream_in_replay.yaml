tags:
  - replay_stream
description: (#7307) support external input stream in replay function
cluster:
  - p1k1
  - p3k1
steps:
  - type: kafka
    name: delete
    topic: test

  - type: kafka
    name: create
    topic: test
    settings:
      partitions: 3
      replication: 1
  - type: wait
    time: 2

  - type: query
    sql: drop stream if exists test_external_stream;

  - type: wait
    time: 2

  - type: query
    sql: create external stream test_external_stream
          (
            id int,
            time datetime,
            time_datetime64 datetime64(3)
          )
          settings type='kafka', brokers='k1:9092', topic='test'

  - type: wait
    time: 2

  - type: query
    sql: insert into test_external_stream (id, time, time_datetime64) values 
        (1, '2024-01-20 16:01:14', '2024-01-20 16:01:14.000')
        (2, '2024-01-20 16:01:15', '2024-01-20 16:01:14.100')
        (3, '2024-01-20 16:01:16', '2024-01-20 16:01:14.200')
        (4, '2024-01-20 16:01:17', '2024-01-20 16:01:14.500')
        (5, '2024-01-20 16:01:18', '2024-01-20 16:01:15.100')
        (6, '2024-01-20 16:01:20', '2024-01-20 16:01:16.100')

  - type: wait
    time: 5

  - type: stream
    name: 009928_1
    query: select id from test_external_stream where _tp_time > earliest_timestamp()
        settings replay_speed = 5, replay_time_column = 'time', replay_start_time = '2024-01-20 16:01:13'
    schema:
      - name: id
        type: int32

  - type: wait
    time: 4

  - type: stream
    name: 009928_2
    query: select id from test_external_stream where _tp_time > earliest_timestamp()
        settings replay_speed = 5, replay_time_column = 'time_datetime64', replay_start_time = '2024-01-20 16:01:13.000'
    schema:
      - name: id
        type: int32

  - type: wait
    time: 3

  - type: check
    target_name: 009928_1
    expected_result:
    - [1]
    - [2]
    - [3]
    - [4]
    - [5]
    - [6]

  - type: check
    target_name: 009928_2
    expected_result:
    - [1]
    - [2]
    - [3]
    - [4]
    - [5]
    - [6]
