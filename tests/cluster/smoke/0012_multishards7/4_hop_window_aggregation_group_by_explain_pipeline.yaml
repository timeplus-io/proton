tags:
  - hopping window

description: Test in-shard query processing and explain pipeline
cluster:
  - p1k1
  - p3k1
steps:
  - type: query
    sql: drop stream if exists test_smoke1;
  - type: wait
    time: 1

  - type: query
    sql: create stream test_smoke1 (val float, k int) settings shards=8;
  - type: wait
    time: 2

  - name: multishards7-4-1
    type: stream
    query: |
      explain pipeline 
        select
          window_start
        from
          hop(test_smoke1, 1s, 30s) 
        group by
          window_start
        settings
          max_threads = 8, enable_backfill_from_historical_store = false, allow_independent_shard_processing = true, default_hash_table='memory';
    schema:
      - name: explain
        type: string

  - name: multishards7-4-2
    type: stream
    query: |
      explain pipeline 
        select
          window_start
        from
          hop(test_smoke1, 1s, 30s) 
        group by
          window_start
        settings
          max_threads = 8, enable_backfill_from_historical_store = false, allow_independent_shard_processing = true, default_hash_table='hybrid';
    schema:
      - name: explain
        type: string

  - type: check
    target_name: multishards7-4-1
    expected_result:
      - ['(Expression)']
      - ['ExpressionTransform × 8']
      - ['  (HopStreamingAggregating)']
      - ['  HopAggregatingTransform × 8']
      - ['    (Expression)']
      - ['    ExpressionTransform × 8']
      - ['      (WatermarkStep)']
      - ['      WatermarkTransform × 8']
      - ['        (WindowAssignmentStep)']
      - ['        HopWindowAssignmentTransform × 8']
      - ['          (Union)']
      - ['            (ReadFromStorageShard)']
      - ['            StreamingStoreSource 0 → 1']
      - ['            Description: stream=default.test_smoke1,shard=0']
      - ['            (ReadFromStorageShard)']
      - ['            StreamingStoreSource 0 → 1']
      - ['            Description: stream=default.test_smoke1,shard=1']
      - ['            (ReadFromStorageShard)']
      - ['            StreamingStoreSource 0 → 1']
      - ['            Description: stream=default.test_smoke1,shard=2']
      - ['            (ReadFromStorageShard)']
      - ['            StreamingStoreSource 0 → 1']
      - ['            Description: stream=default.test_smoke1,shard=3']
      - ['            (ReadFromStorageShard)']
      - ['            StreamingStoreSource 0 → 1']
      - ['            Description: stream=default.test_smoke1,shard=4']
      - ['            (ReadFromStorageShard)']
      - ['            StreamingStoreSource 0 → 1']
      - ['            Description: stream=default.test_smoke1,shard=5']
      - ['            (ReadFromStorageShard)']
      - ['            StreamingStoreSource 0 → 1']
      - ['            Description: stream=default.test_smoke1,shard=6']
      - ['            (ReadFromStorageShard)']
      - ['            StreamingStoreSource 0 → 1']
      - ['            Description: stream=default.test_smoke1,shard=7']

  - type: check
    target_name: multishards7-4-2
    expected_result:
      - ['(Expression)']
      - ['ExpressionTransform × 8']
      - ['  (HybridHopStreamingAggregating)']
      - ['  HybridHopAggregatingTransform × 8']
      - ['    (Expression)']
      - ['    ExpressionTransform × 8']
      - ['      (WatermarkStep)']
      - ['      WatermarkTransform × 8']
      - ['        (WindowAssignmentStep)']
      - ['        HopWindowAssignmentTransform × 8']
      - ['          (Union)']
      - ['            (ReadFromStorageShard)']
