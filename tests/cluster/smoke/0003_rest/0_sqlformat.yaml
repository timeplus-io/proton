tags:
  - local-run
  - sqlformat
description: send a sqlformat request
cluster:
  - p1k1
  - p3k1
steps:
  - name: '401'
    type: rest
    url: /proton/v1/sqlformat
    method: POST
    data:
      query: select a.id, b.type, max(a.value), window_start as joined_w_start, window_end
        as joined_w_end from hop(test_rest, timestamp, interval 3 second, interval 5
        second ) as a join table(test_rest_d) as b on a.id = b.id where b.type = 'roof'
        or b.type = 'field' or b.type = 'wall' group by a.id, b.type, window_start,
        window_end

  - type: check
    target_name: '401'
    expected_result:
      - query: "SELECT\n  a.id, b.type, max(a.value), window_start AS joined_w_start,\
      \ window_end AS joined_w_end\nFROM\n  hop(test_rest, timestamp, INTERVAL 3 SECOND,\
      \ INTERVAL 5 SECOND) AS a\nINNER JOIN table(test_rest_d) AS b ON a.id = b.id\n\
      WHERE\n  (b.type = 'roof') OR (b.type = 'field') OR (b.type = 'wall')\nGROUP\
      \ BY\n  a.id, b.type, window_start, window_end"
        request_id: any_value
