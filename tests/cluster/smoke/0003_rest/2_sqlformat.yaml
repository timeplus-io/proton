tags:
  - sqlformat
description: send a sqlformat request of complex query
cluster:
  - p1k1
  - p3k1
steps:
  - name: '401'
    type: rest
    url: /proton/v1/sqlformat
    method: POST
    data:
      query: WITH cte1 as (select 1 from t), cte2 as (select 2 from t2) SELECT tags['tenant']
        AS tenant, extract(array_element(tags, 'stream'), '[source|sink]-(.*)') AS id,
        extract(array_element(tags, 'stream'), '(source|sink)-*') AS metrics_type, 'orbit_stream_output_throughput'
        AS metrics_name, window_start AS time, (max(value) - min(value)) / 60 AS value
        FROM tumble(default.k8s_metrics, 60s),k8s_metrics INNER JOIN default.k8s_metrics
        USING (_tp_time) ARRAY JOIN _tp_time AS time WHERE name = 'output_sent_bytes'
        GROUP BY tenant, name, window_start, tags['stream'] UNION ALL SELECT tags['tenant']
        AS tenant, extract(array_element(tags, 'stream'), '[source|sink]-(.*)') AS id,
        extract(array_element(tags, 'stream'), '(source|sink)-*') AS metrics_type, if((tags['label'])
        = 'sink', 'orbit_stream_output_sent', 'orbit_stream_output_error') AS metrics_name,
        window_start AS time, latest(value) AS value FROM  tumble(default.k8s_metrics,
        60s) WHERE (name = 'output_sent') AND (((tags['label']) = 'sink') OR ((tags['label'])
        = 'sink_fails')) GROUP BY tenant, name, tags['label'], window_start, tags['stream']

  - type: check
    target_name: '401'
    expected_result:
      - query: "WITH cte1 AS\n  (\n    SELECT\n      1\n    FROM\n      t\n  ), cte2 AS\n\
      \  (\n    SELECT\n      2\n    FROM\n      t2\n  )\nSELECT\n  tags['tenant']\
      \ AS tenant, extract(tags['stream'], '[source|sink]-(.*)') AS id, extract(tags['stream'],\
      \ '(source|sink)-*') AS metrics_type, 'orbit_stream_output_throughput' AS metrics_name,\
      \ window_start AS time, (max(value) - min(value)) / 60 AS value\nFROM\n  tumble(default.k8s_metrics,\
      \ 60s), k8s_metrics\nINNER JOIN default.k8s_metrics USING (_tp_time)\nARRAY\
      \ JOIN _tp_time AS time\nWHERE\n  name = 'output_sent_bytes'\nGROUP BY\n  tenant,\
      \ name, window_start, tags['stream']\nUNION ALL\nSELECT\n  tags['tenant'] AS\
      \ tenant, extract(tags['stream'], '[source|sink]-(.*)') AS id, extract(tags['stream'],\
      \ '(source|sink)-*') AS metrics_type, if((tags['label']) = 'sink', 'orbit_stream_output_sent',\
      \ 'orbit_stream_output_error') AS metrics_name, window_start AS time, latest(value)\
      \ AS value\nFROM\n  tumble(default.k8s_metrics, 60s)\nWHERE\n  (name = 'output_sent')\
      \ AND (((tags['label']) = 'sink') OR ((tags['label']) = 'sink_fails'))\nGROUP\
      \ BY\n  tenant, name, tags['label'], window_start, tags['stream']"
        request_id: any_value
