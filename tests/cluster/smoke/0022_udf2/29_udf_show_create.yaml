tags:
- udf2
description: SQL - UDA
cluster:
- p1k1
- p3k1
steps:
- type: wait
  time: 1

#tear down
- type: query
  sql: DROP FUNCTION IF EXISTS test_sec_large;
- type: wait
  time: 1

- type: query
  sql: DROP FUNCTION IF EXISTS is_work_email;
- type: wait
  time: 1
  
- name: udf-29-0
  type: query
  sql: |
        CREATE FUNCTION is_work_email(values string) RETURNS string LANGUAGE JAVASCRIPT AS $$
            function is_work_email(values)
            {
              return values.map(email=>email.endsWith("@gmail.com"));
            }
        $$;
- type: wait
  time: 2


- name: udf-29-1
  type: query
  sql: "CREATE OR REPLACE AGGREGATE FUNCTION test_sec_large(value float32, _tp_delta int8) RETURNS float32 LANGUAGE JAVASCRIPT AS $$ { initialize: function() { this.max = -1.0; this.sec = -1.0 }, process: function(values) { for (let i = 0; i < values.length; i++) { if (values[i] > this.max) { this.sec = this.max; this.max = values[i] } if (values[i] < this.max && values[i] > this.sec) this.sec = values[i]; } }, finalize: function() { return this.sec }, serialize: function() { let s = { 'max': this.max, 'sec': this.sec }; return JSON.stringify(s) }, deserialize: function(state_str) { let s = JSON.parse(state_str); this.max = s['max']; this.sec = s['sec'] }, merge: function(state_str) { let s = JSON.parse(state_str); if (s['sec'] >= this.max) { this.max = s['max']; this.sec = s['sec'] } else if (s['max'] >= this.max) { this.sec = this.max; this.max = s['max'] } else if (s['max'] > this.sec) { this.sec = s['max'] } } } $$;"
- type: wait
  time: 2

- name: udf-29-2
  type: stream
  query: show functions where name in ('is_work_email','test_sec_large');
  schema:
  - name: name
    type: string
  - name: type
    type: string
  - name: language
    type: string

- type: check
  mode: random
  target_name: udf-29-2
  expected_result:
  - ["is_work_email", "Function", "Javascript"]  
  - ["test_sec_large","Aggregate Function", "Javascript"]

- name: udf-29-3
  type: stream
  query: show create function test_sec_large;
  schema:
  - name: statement
    type: string

- type: check
  target_name: udf-29-3
  expected_result:
  - ["CREATE OR REPLACE AGGREGATE FUNCTION test_sec_large(value float32, _tp_delta int8) RETURNS float32 LANGUAGE JAVASCRIPT AS $$ { initialize: function() { this.max = -1.0; this.sec = -1.0 }, process: function(values) { for (let i = 0; i < values.length; i++) { if (values[i] > this.max) { this.sec = this.max; this.max = values[i] } if (values[i] < this.max && values[i] > this.sec) this.sec = values[i]; } }, finalize: function() { return this.sec }, serialize: function() { let s = { 'max': this.max, 'sec': this.sec }; return JSON.stringify(s) }, deserialize: function(state_str) { let s = JSON.parse(state_str); this.max = s['max']; this.sec = s['sec'] }, merge: function(state_str) { let s = JSON.parse(state_str); if (s['sec'] >= this.max) { this.max = s['max']; this.sec = s['sec'] } else if (s['max'] >= this.max) { this.sec = this.max; this.max = s['max'] } else if (s['max'] > this.sec) { this.sec = s['max'] } } } $$"]

- name: udf-29-4
  type: stream
  query: show create function is_work_email;
  schema:
  - name: statement
    type: string

- type: check
  target_name: udf-29-4
  expected_result:
  - ["CREATE OR REPLACE FUNCTION is_work_email(values string) RETURNS string LANGUAGE JAVASCRIPT AS $$\n    function is_work_email(values)\n    {\n      return values.map(email=>email.endsWith(\"@gmail.com\"));\n    }\n$$"]

