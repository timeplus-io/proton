tags:
- udf2
description: SQL - CREATE Remote UDF
cluster:
- p1k1
- p3k1
steps:
- type: wait
  time: 1

#tear down
- type: query
  sql: DROP FUNCTION IF EXISTS ip_lookup;
- type: wait
  time: 1

  
- name: udf-30-0
  type: query
  sql: |
        CREATE OR REPLACE REMOTE FUNCTION ip_lookup(ip string) RETURNS string
        URL 'https://hn6wip76uexaeusz5s7bh3e4u40lrrrz.lambda-url.us-west-2.on.aws/';
- type: wait
  time: 5

- name: udf-30-1
  type: stream
  query: select ip_lookup('127.0.0.1') as result;
  schema:
  - name: result
    type: string

- type: check
  mode: random
  target_name: udf-30-1
  expected_result:
  - [ '{"ip":"127.0.0.1","bogon":true}' ]

- name: udf-30-2
  type: stream
  query: select ip_lookup('1') as result;
  schema:
  - name: result
    type: string

- type: check
  target_name: udf-30-2
  expected_result:
  - [ '{"status":404,"error":{"title":"Wrong ip","message":"Please provide a valid IP address"}}']

- name: udf-30-3
  type: query
  sql: |
        CREATE OR REPLACE REMOTE FUNCTION ip_lookup(ip string) RETURNS string
        URL 'https://hn6wip76uexaeusz5s7bh3e4u40lrrrz.lambda-url.us-west-2.on.aws/'
        AUTH_METHOD 'auth_header'
        AUTH_HEADER 'auth'
        AUTH_KEY 'proton'
        EXECUTION_TIMEOUT 30000;
- type: wait
  time: 5

- name: udf-30-4
  type: stream
  query: select ip_lookup('127.0.0.1') as result;
  schema:
  - name: result
    type: string

- type: check
  mode: random
  target_name: udf-30-4
  expected_result:
  - [ '{"ip":"127.0.0.1","bogon":true}' ]

- name: udf-30-5
  type: stream
  query: select ip_lookup('1') as result;
  schema:
  - name: result
    type: string

- type: check
  target_name: udf-30-5
  expected_result:
  - [ '{"status":404,"error":{"title":"Wrong ip","message":"Please provide a valid IP address"}}']

#tear down
- type: query
  sql: DROP FUNCTION IF EXISTS ip_lookup;
- type: wait
  time: 1
