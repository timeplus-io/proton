tags:
- versioned_kv
- multi_shard
- subquery
- subquery/view/materialized_view
- tail/aggr
- group_by
- no_primary_key
- stateful_function
description: subquery from view from subquery aggr with stateful function, update
cluster:
- p1k1
- p3k1
steps:
- type: query
  sql: create stream test14_multishard_11(i float, k1 int, k2 string) primary key k2 settings mode='versioned_kv', shards=3;

- type: query
  sql: create stream test14_target_multishard_changelog_kv_11(i float, k1 int, k2 string) primary key k2 settings mode='changelog_kv', shards=3;

- type: wait
  time: 2

- type: query
  sql: create materialized view test14_view1_11 into test14_target_multishard_changelog_kv_11 as
        (select i,
                k1,
                k2,
                _tp_delta
          from
            (select i,
                    k1,
                    k2
            from test14_multishard_11
            where k1 <> 0)
          where k2 <> 'd' emit changelog);
- type: wait
  time: 1

- type: query
  sql: create view test14_view2_11 as
        (select max(i) as max_i,
                min(i) as min_i,
                avg(i) as avg_i,
                count(i) as cnt,
                k1
          from test14_view1_11
          group by k1
          order by k1 emit periodic 3s);
- type: wait
  time: 1

- name: '1486'
  type: stream
  query: select max_i,
                min_i,
                avg_i,
                cnt,
                k1
        from test14_view2_11;
  schema:
  - name: max_i
    type: float32
  - name: min_i
    type: float32
  - name: avg_i
    type: float64
  - name: cnt
    type: uint64
  - name: k1
    type: int32
- type: wait
  time: 1

- type: query
  sql: insert into test14_multishard_11(i, k1, k2) values (1, 1, 'a');

- type: wait
  time: 3

- type: query
  sql: insert into test14_multishard_11(i, k1, k2) values (2, 1, 'a');

- type: wait
  time: 3

- type: query
  sql: insert into test14_multishard_11(i, k1, k2) values (3, 0, 'a');

- type: wait
  time: 3

- type: query
  sql: insert into test14_multishard_11(i, k1, k2) values (4, 1, 'a');

- type: wait
  time: 3

- type: query
  sql: insert into test14_multishard_11(i, k1, k2) values (5, 2, 'e');

- type: wait
  time: 3

- type: query
  sql: insert into test14_multishard_11(i, k1, k2) values (6, 2, 'b');

- type: wait
  time: 3

- type: query
  sql: insert into test14_multishard_11(i, k1, k2) values (7, 2, 'b');

- type: wait
  time: 4

- type: query
  sql: insert into test14_multishard_11(i, k1, k2) values (8, 1, 'a');

- type: check
  target_name: '1486'
  expected_result:
  - [1, 1, 1, 1, 1]
  - [2, 2, 2, 1, 1]
  - [0, 0, nan, 0, 1]
  - [4, 4, 4, 1, 1]
  - [4, 4, 4, 1, 1]
  - [5, 5, 5, 1, 2]
  - [4, 4, 4, 1, 1]
  - [6, 5, 5.5, 2, 2]
  - [4, 4, 4, 1, 1]
  - [7, 5, 6, 2, 2]
  - [8, 8, 8, 1, 1]
  - [7, 5, 6, 2, 2]
