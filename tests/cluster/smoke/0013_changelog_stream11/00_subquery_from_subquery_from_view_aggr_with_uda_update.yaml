description: subquery from subquery from view aggr with UDA, update
cluster:
- p1k1
- p3k1
steps:
- type: query
  sql: |
    CREATE OR REPLACE AGGREGATE FUNCTION test_14_11_sec_large(value float32) RETURNS float32 LANGUAGE JAVASCRIPT AS $$
      {
        initialize: function() { 
          this.max = -1.0;
          this.sec = -1.0;
        },

        process: function(values) {
          for(let i=0; i<values.length; i++) {
            if(values[i] > this.max) {
              this.sec = this.max;
              this.max = values[i];
            }
            if(values[i] < this.max && values[i] > this.sec)
              this.sec = values[i];
          }
        },

        finalize: function() {
          return this.sec;
        },

        serialize: function() {
          let s = {"max": this.max, "sec":this.sec };
          return JSON.stringify(s);
        },

        deserialize: function(state_str) {
          let s = JSON.parse(state_str);
          this.max = s["max"];
          this.sec = s["sec"];
        },

        merge: function(state_str) {
          let s = JSON.parse(state_str);
          if (s["sec"] >= this.max) {
            this.max = s["max"];
            this.sec = s["sec"];
          } else if (s["max"] >= this.max) {
            this.sec = this.max;
            this.max = s["max"];
          } else if (s["max"] > this.sec) {
            this.sec = s["max"];
          }
        }
      }
    $$;
- type: wait
  time: 1

- type: query
  sql: create stream test14_multishard_11(i float, k1 int, k2 string) primary key k2 settings mode='versioned_kv', shards=3;

- type: wait
  time: 2

- type: query
  sql: create view test14_view1_11 as
          (select i,
                  k2
            from test14_multishard_11
            where k1 = 1 );

- type: wait
  time: 1

- name: '1484'
  type: stream
  query: select test_14_11_sec_large(i),
                  k2
          from
            (select i,
                    k2
              from test14_view1_11
              where k2 == 'a' )
          group by k2
          order by k2 emit periodic 200ms;
  schema:
  - name: test_14_11_sec_large(i)
    type: float32
  - name: k2
    type: string
- type: wait
  time: 1

- type: query
  sql: insert into test14_multishard_11(i, k1, k2) values (1, 1, 'a');

- type: wait
  time: 1

- type: query
  sql: insert into test14_multishard_11(i, k1, k2) values (2, 1, 'a');

