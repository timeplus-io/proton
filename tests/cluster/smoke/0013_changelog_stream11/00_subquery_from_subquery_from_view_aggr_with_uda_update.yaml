- type: wait
  time: 1

- type: query
  sql: insert into test14_multishard_11(i, k1, k2) values (4, 1, 'a');

- type: wait
  time: 1

- type: query
  sql: insert into test14_multishard_11(i, k1, k2) values (5, 0, 'e');

- type: wait
  time: 1

- type: query
  sql: insert into test14_multishard_11(i, k1, k2) values (6, 0, 'a');

- type: wait
  time: 1

- type: query
  sql: insert into test14_multishard_11(i, k1, k2) values (7, 0, 'a');

