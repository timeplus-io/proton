tags:
- versioned_kv
- multi_shard
- substream
- partition_by_primary_key
- streaming_tailing
- UDF

description: partition by primary key, streaming tailing, UDF, add

cluster:
- p1k1
- p3k1

steps:
- type: query
  sql: |
    CREATE OR REPLACE FUNCTION test_14_11_add_five(value float32) RETURNS float32 LANGUAGE JAVASCRIPT AS $$
      function test_14_11_add_five(value) {
          for (let i = 0; i < value.length; i++) {
              value[i] = value[i] + 5;
          }
          return value;
      }
    $$;
- type: wait
  time: 1

- type: query
  sql: create stream test14_multishard_11(i float, k1 int, k2 string) primary key k2 settings mode='versioned_kv', shards=3;

- type: wait
  time: 2

- name: '1495'
  type: stream
  query: select test_14_11_add_five(i),
                k1,
                k2
        from test14_multishard_11 partition by k2;
  schema:
  - name: test_14_11_add_five(i)
    type: float32
  - name: k1
    type: int32
  - name: k2
    type: string
- type: wait
  time: 2

- type: query
  sql: insert into test14_multishard_11(i, k1, k2) values (1, 1, 'a');

- type: query
  sql: insert into test14_multishard_11(i, k1, k2) values (2, 1, 'b');

- type: query
  sql: insert into test14_multishard_11(i, k1, k2) values (3, 1, 'c');

- type: check
  target_name: '1495'
  expected_result:
  - [6, 1, a]
  - [7, 1, b]
  - [8, 1, c]
