description: subquery from view from subquery aggr with UDA, add
cluster:
- p1k1
- p3k1
steps:
- type: query
  sql: |
    CREATE OR REPLACE AGGREGATE FUNCTION test_14_11_sec_large(value float32) RETURNS float32 LANGUAGE JAVASCRIPT AS $$
      {
        initialize: function() { 
          this.max = -1.0;
          this.sec = -1.0;
        },

        process: function(values) {
          for(let i=0; i<values.length; i++) {
            if(values[i] > this.max) {
              this.sec = this.max;
              this.max = values[i];
            }
            if(values[i] < this.max && values[i] > this.sec)
              this.sec = values[i];
          }
        },

        finalize: function() {
          return this.sec;
        },

        serialize: function() {
          let s = {"max": this.max, "sec":this.sec };
          return JSON.stringify(s);
        },

        deserialize: function(state_str) {
          let s = JSON.parse(state_str);
          this.max = s["max"];
          this.sec = s["sec"];
        },

        merge: function(state_str) {
          let s = JSON.parse(state_str);
          if (s["sec"] >= this.max) {
            this.max = s["max"];
            this.sec = s["sec"];
          } else if (s["max"] >= this.max) {
            this.sec = this.max;
            this.max = s["max"];
          } else if (s["max"] > this.sec) {
            this.sec = s["max"];
          }
        }
      }
    $$;
- type: wait
  time: 1

- type: query
  sql: create stream test14_multishard_11(i float, k1 int, k2 string) primary key k2 settings mode='versioned_kv', shards=3;

- type: wait
  time: 1

- type: query
  sql: create view test14_view1_11 as
          (select i,
                  k1,
                  k2
            from test14_multishard_11
            where k1 <> 0 );
- type: wait
  time: 1

- type: query
  sql: create materialized view test14_view2_11 as
          (select test_14_11_sec_large(i) as sec_l
            from
              (select i,
                      k1,
                      k2
              from test14_view1_11
              where k2 <> 'd' )emit periodic 200ms);

