tags:
  - Window aggregation
  - with group by
description: append_only Window Aggregation with group by
cluster:
  - p1k1
  - p3k1
steps:
  - type: query
    sql:
      create stream test14_append_stream_2 (id int, name string, val
      float, ts datetime);
  - type: wait
    time: 1

  - name: "1448"
    type: stream
    query:
      select id, count(), min(val), max(val), sum(val), avg(val), window_start,
      window_end from tumble(test14_append_stream_2, ts, 5s) group by id, window_start,
      window_end;
    schema:
      - name: id
        type: int32
      - name: count()
        type: uint64
      - name: min(val)
        type: float32
      - name: max(val)
        type: float32
      - name: sum(val)
        type: float64
      - name: avg(val)
        type: float64
      - name: window_start
        type: datetime
      - name: window_end
        type: datetime
  - type: wait
    time: 1

  - type: query
    sql:
      insert into test14_append_stream_2 (id, name, val, ts) values (1, 'a', 11.1
      ,'2020-02-02 20:00:01');

  - type: query
    sql:
      insert into test14_append_stream_2 (id, name, val, ts) values (2, 'a', 22.2
      ,'2020-02-02 20:00:01');

  - type: query
    sql:
      insert into test14_append_stream_2 (id, name, val, ts) values (1, 'b', 33.3
      ,'2020-02-02 20:00:02');

  - type: query
    sql:
      insert into test14_append_stream_2 (id, name, val, ts) values (2, 'b', 44.4
      ,'2020-02-02 20:00:03');

  - type: query
    sql:
      insert into test14_append_stream_2 (id, name, val, ts) values (1, 'a', 44.4
      ,'2020-02-02 20:00:04');

  - type: query
    sql:
      insert into test14_append_stream_2 (id, name, val, ts) values (1, 'c', 22.2
      ,'2020-02-02 20:00:05');

  - type: check
    mode: random
    target_name: "1448"
    expected_result:
      - [
          1,
          3,
          11.1,
          44.4,
          88.8,
          29.6,
          "2020-02-02 20:00:00",
          "2020-02-02 20:00:05",
        ]
      - [
          2,
          2,
          22.2,
          44.4,
          66.6,
          33.3,
          "2020-02-02 20:00:00",
          "2020-02-02 20:00:05",
        ]
