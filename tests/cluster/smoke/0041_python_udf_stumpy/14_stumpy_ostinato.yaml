description: Test covering simple python udf test

steps:
  - type: query
    sql: drop stream if exists udf_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream udf_stream (valuea array(float), valueb array(float), valuec array(float));
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_ostinato(valuea array(float), valueb array(float), valuec array(float)) RETURNS tuple(float, int, int) LANGUAGE PYTHON AS
      $$
      import stumpy
      import numpy as np

      def test_ostinato(valuea, valueb, valuec):
          res = []
          for a, b, c in zip(valuea, valueb, valuec):
              if len(a) > 3:
                  res_ostinato = stumpy.ostinato([np.array(a), np.array(b), np.array(c)], m=3)
                  central_radius = float(res_ostinato[0])
                  central_Ts_idx = int(res_ostinato[1])
                  central_subseq_idx = int(res_ostinato[2])
                  res.append((central_radius, central_Ts_idx, central_subseq_idx))
          return res
      $$;

  - type: wait
    time: 1

  - name: python-udf14-14-1
    type: stream
    query: select test_ostinato(valuea, valueb, valuec) as res, valuea, valueb, valuec from udf_stream;
    schema:
      - name: res
        type: tuple(float32, int32, int32) 
      - name: valuea
        type: array(float32)
      - name: valueb
        type: array(float32)
      - name: valuec
        type: array(float32)

  - type: wait
    time: 3

  - type: query
    sql: insert into udf_stream(valuea, valueb, valuec) values ([584., -11., 23., 79., 1001., 0., 19.], [600., -10., 23., 17.], [1., 9., 6., 0.]);

  - type: check
    target_name: python-udf14-14-1
    expected_result:
      - [[1.237023767815382, 0, 4], [584., -11., 23., 79., 1001., 0., 19.], [600., -10., 23., 17.], [1., 9., 6., 0.]]
