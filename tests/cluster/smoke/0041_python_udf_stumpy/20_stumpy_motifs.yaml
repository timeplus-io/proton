description: Test covering simple python udf test

steps:
  - type: query
    sql: drop stream if exists udf_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream udf_stream (value array(float));
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_motifs(value array(float)) RETURNS tuple(array(array(float)), array(array(int))) LANGUAGE PYTHON AS
      $$
      import stumpy
      import numpy as np

      def test_motifs(value):
          res = []
          for v in value:
              if len(v) > 0:
                  mp = stumpy.stump(np.array(v), m=3)
                  tmp_res = stumpy.motifs(np.array(v), mp.P_, max_distance=2.0)
                  distances = tmp_res[0].tolist()
                  indices = tmp_res[1].tolist()
                  res.append((distances, indices))
          return res
      $$;

  - type: wait
    time: 1

  - name: python-udf14-20-1
    type: stream
    query: select test_motifs(value) as res, value from udf_stream;
    schema:
      - name: res
        type: tuple(array(array(float32)), array(array(int32)))
      - name: value
        type: array(float32)

  - type: wait
    time: 3

  - type: query
    sql: insert into udf_stream(value) values ([584., -11., 23., 79., 1001., 0., -19.]);

  - type: check
    target_name: python-udf14-20-1
    expected_result:
      - [[[[0.0, 0.1163385711369199]], [[0, 4]]], [584., -11., 23., 79., 1001., 0., -19.]]
