description: Test covering simple python udf test

steps:
  - type: query
    sql: drop stream if exists udf_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream udf_stream (value array(float));
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_atsc(value array(float)) RETURNS array(int) LANGUAGE PYTHON AS
      $$
      import stumpy
      import numpy as np

      def test_atsc(value):
          res = []
          for v in value:
              if len(v) >= 3:
                  mp = stumpy.stump(np.array(v), m=3)
                  res_atsc = stumpy.atsc(mp.left_I_, mp.right_I_, 1).tolist()
                  res.append(res_atsc)
          return res
      $$;

  - type: wait
    time: 2

  - name: python-udf14-10-1
    type: stream
    query: select test_atsc(value) as res, value from udf_stream;
    schema:
      - name: res
        type: array(int32)
      - name: value
        type: array(float32)

  - type: wait
    time: 3

  - type: query
    sql: insert into udf_stream(value) values ([584., -11., 23., 79., 1001., 0., -19.]);

  - type: check
    target_name: python-udf14-10-1
    expected_result:
      - [[1, 3], [584., -11., 23., 79., 1001., 0., -19.]]
