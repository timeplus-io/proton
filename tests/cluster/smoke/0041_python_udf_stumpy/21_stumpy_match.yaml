description: Test covering simple python udf test

steps:
  - type: query
    sql: drop stream if exists udf_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream udf_stream (valueq array(float), valuet array(float));
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_match(valueq array(float), valuet array(float)) RETURNS array(float) LANGUAGE PYTHON AS
      $$
      import stumpy
      import numpy as np

      def test_match(valueq, valuet):
          res = []
          for q, t in zip(valueq, valuet):
              if len(q) > 0:
                  mp = stumpy.match(np.array(q), np.array(t))
                  res_match = list(map(float, mp[0]))
                  res.append(res_match)
          return res
      $$;

  - type: wait
    time: 1

  - name: python-udf14-21-1
    type: stream
    query: select test_match(valueq, valuet) as res, valueq, valuet from udf_stream;
    schema:
      - name: res
        type: array(float32)
      - name: valueq
        type: array(float32)
      - name: valuet
        type: array(float32)

  - type: wait
    time: 2

  - type: query
    sql: insert into udf_stream(valueq, valuet) values ([-11.1, 23.4, 79.5, 1001.0], [584., -11., 23., 79., 1001., 0., -19.]);

  - type: check
    target_name: python-udf14-21-1
    expected_result:
      - [[0.0011129739298228348, 1.0], [-11.1, 23.4, 79.5, 1001.0], [584., -11., 23., 79., 1001., 0., -19.]]
