description: Test covering simple python udf test

steps:
  - type: query
    sql: drop stream if exists udf_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream udf_stream (valueq array(float64), valuet array(float64));
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_mass(valueq array(float64), valuet array(float64)) RETURNS array(float64) LANGUAGE PYTHON AS
      $$
      import stumpy
      import numpy as np

      def test_mass(valueq, valuet):
          res = []
          for q, t in zip(valueq, valuet):
              if len(q) > 0:
                  mp = stumpy.mass(np.array(q), np.array(t))
                  res.append(mp.tolist())
          return res
      $$;

  - type: wait
    time: 1

  - name: python-udf14-3-1
    type: stream
    query: select test_mass(valueq, valuet) as res, valueq, valuet from udf_stream;
    schema:
      - name: res
        type: array(float64)
      - name: valueq
        type: array(float64)
      - name: valuet
        type: array(float64)

  - type: wait
    time: 1

  - type: query
    sql: insert into udf_stream(valueq, valuet) values ([-11.1, 23.4, 79.5, 1001.0], [584., -11., 23., 79., 1001., 0., -19.]);

  - type: check
    target_name: python-udf14-3-1
    expected_result:
      - [[3.1879246264168093, 0.0011129739298228348, 3.2387401777747815, 3.3447019495938286], [-11.1, 23.4, 79.5, 1001.0], [584., -11., 23., 79., 1001., 0., -19.]]
