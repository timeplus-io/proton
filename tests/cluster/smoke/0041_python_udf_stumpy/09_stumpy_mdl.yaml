description: Test covering simple python udf test

steps:
  - type: query
    sql: drop stream if exists udf_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream udf_stream (valuea array(float), valueb array(float));
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_mdl(valuea array(float), valueb array(float)) RETURNS tuple(array(float), array(array(int))) LANGUAGE PYTHON AS
      $$
      import stumpy
      import numpy as np

      def test_mdl(valuea, valueb):
          res = []
          for a, b in zip(valuea, valueb):
              if len(a) > 3:
                  mps, indices = stumpy.mstump(np.array([a,b]),m=3)
                  motifs_idx = np.argsort(mps, axis=1)[:, 0]
                  res_mdl = stumpy.mdl(np.array([a,b]), m=3,
                    subseq_idx=motifs_idx,
                    nn_idx=indices[np.arange(motifs_idx.shape[0]), motifs_idx])
                  bit_sizes = res_mdl[0].tolist()
                  s=[arr.tolist() for arr in res_mdl[1]]
                  res.append((bit_sizes,s))
          return res
      $$;

  - type: wait
    time: 1

  - name: python-udf14-9-1
    type: stream
    query: select test_mdl(valuea, valueb) as res, valuea, valueb from udf_stream;
    schema:
      - name: res
        type: tuple(array(float32), array(array(int32)))
      - name: valuea
        type: array(float32)
      - name: valueb
        type: array(float32)

  - type: wait
    time: 3

  - type: query
    sql: insert into udf_stream(valuea, valueb) values ([584., -11., 23., 79., 1001., 0., -19.], [1., 2., 4., 8., 16., 0., 32.]);

  - type: check
    target_name: python-udf14-9-1
    expected_result:
      - [[[80.0, 111.50977500432694], [[1], [0, 1]]], [584., -11., 23., 79., 1001., 0., -19.], [1., 2., 4., 8., 16., 0., 32.]]
