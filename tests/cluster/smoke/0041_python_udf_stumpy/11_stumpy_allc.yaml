description: Test covering simple python udf test

steps:
  - type: query
    sql: drop stream if exists udf_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream udf_stream (value array(float));
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_allc(value array(float)) RETURNS tuple(array(array(int)), array(int)) LANGUAGE PYTHON AS
      $$
      import stumpy
      import numpy as np

      def test_allc(value):
          res = []
          for v in value:
              if len(v) >= 3:
                  mp = stumpy.stump(np.array(v), m=3)
                  res_allc = stumpy.allc(mp.left_I_, mp.right_I_)
                  left = [arr.tolist() for arr in res_allc[0]]
                  right = res_allc[1].tolist()
                  res.append((left, right))
          return res
      $$;

  - type: wait
    time: 1

  - name: python-udf14-11-1
    type: stream
    query: select test_allc(value) as res, value from udf_stream;
    schema:
      - name: res
        type: tuple(array(array(int32)), array(int32))
      - name: value
        type: array(float32)

  - type: wait
    time: 2

  - type: query
    sql: insert into udf_stream(value) values ([584., -11., 23., 79., 1001., 0., -19.]);

  - type: check
    target_name: python-udf14-11-1
    timeout: 20 # address build need more time
    expected_result:
      - [[[[1, 3], [2], [0, 4]], [0, 4]], [584., -11., 23., 79., 1001., 0., -19.]]
