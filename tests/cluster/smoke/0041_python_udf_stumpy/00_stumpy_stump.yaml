tags:
  - uda

description: Test covering simple python uda test

steps:
  - type: query
    sql: drop stream if exists uda_stream;
  - type: wait
    time: 2

  - type: query
    sql: create stream uda_stream (value float);
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE AGGREGATE FUNCTION getStump(value float) RETURNS array(float) LANGUAGE PYTHON AS $$
      import stumpy
      import numpy as np

      class getStump:
          has_customized_emit = False

          def __init__(self):
              self.stump = []

          def serialize(self):
              pass

          def deserialize(self, data):
              pass

          def merge(self, other):
              pass

          def process(self, values):
              if len(values) >= 3:
                  mp = stumpy.stump(np.array(values), m=3)
                  self.stump = mp.P_.tolist()

          def finalize(self):
              return [self.stump]
      $$;

  - type: wait
    time: 4

  - name: python-udf14-0-1
    type: stream
    query: select getStump(value) as res from uda_stream;
    schema:
      - name: res
        type: array(float32)

  - type: wait
    time: 2

  - type: query
    sql: insert into uda_stream(value) values (584.)(-11.)(23.)(79.)(1001.)(0.)(-19.);

  - type: check
    target_name: python-udf14-0-1
    timeout: 60 # address build need more time
    expected_result:
      - [[0.1163385711369199, 2.6940739180634403, 3.0000926340485923, 2.6940739180634403, 0.1163385711369199]]
