description: Test covering simple python udf test

steps:
  - type: query
    sql: drop stream if exists udf_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream udf_stream (valuea array(float), valueb array(float));
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_mpdist(valuea array(float), valueb array(float)) RETURNS float LANGUAGE PYTHON AS
      $$
      import stumpy
      import numpy as np

      def test_mpdist(valuea, valueb):
          res = []
          for a, b in zip(valuea, valueb):
              if len(a) > 0:
                  res_mpdist = stumpy.mpdist(np.array(a), np.array(b), m=3)
                  res.append(float(res_mpdist))
          return res
      $$;

  - type: wait
    time: 1

  - name: python-udf14-17-1
    type: stream
    query: select test_mpdist(valuea, valueb) as res, valuea, valueb from udf_stream;
    schema:
      - name: res
        type: float32
      - name: valuea
        type: array(float32)
      - name: valueb
        type: array(float32)

  - type: wait
    time: 3

  - type: query
    sql: insert into udf_stream(valuea, valueb) values ([-11.1, 23.4, 79.5, 1001.0], [584., -11., 23., 79., 1001., 0., -19.]);

  - type: check
    target_name: python-udf14-17-1
    expected_result:
      - [0.00019935236525246838, [-11.1, 23.4, 79.5, 1001.0], [584., -11., 23., 79., 1001., 0., -19.]]
