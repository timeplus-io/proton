description: Test covering simple python udf test

steps:
  - type: query
    sql: drop stream if exists udf_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream udf_stream (value array(float64));
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_scrump(value array(float64)) RETURNS array(float64) LANGUAGE PYTHON AS
      $$
      import stumpy
      import numpy as np

      def test_scrump(value):
          res = []
          for v in value:
              if len(v) >= 3:
                  approx_mp = stumpy.scrump(np.array(v), m=3)
                  approx_mp.update()
                  res.append(approx_mp.P_.tolist())
          return res
      $$;

  - type: wait
    time: 2

  - name: python-udf14-4-1
    type: stream
    query: select test_scrump(value) as res, value from udf_stream;
    schema:
      - name: res
        type: array(float64)
      - name: value
        type: array(float64)

  - type: wait
    time: 2

  - type: query
    sql: insert into udf_stream(value) values ([584., -11., 23., 79., 1001., 0., -19.]);

  - type: check
    target_name: python-udf14-4-1
    timeout: 40 # address build need more time
    expected_result:
      - [[any_value, any_value, any_value, any_value, any_value], [584., -11., 23., 79., 1001., 0., -19.]]
