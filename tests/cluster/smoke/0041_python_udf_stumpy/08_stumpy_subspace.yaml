description: Test covering simple python udf test

steps:
  - type: query
    sql: drop stream if exists udf_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream udf_stream (value array(array(float64)));
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_subspace(value array(array(float64)))
      RETURNS array(int) LANGUAGE PYTHON AS
      $$
      import stumpy
      import numpy as np

      def test_subspace(value):
          res = []
          for v in value:
              if len(v) > 0 and len(v[0]) > 3:
                  mps, indices = stumpy.mstump(np.array(v), m=3)
                  motifs_idx = np.argsort(mps, axis=1)[:, :2]
                  k=1
                  res_subspace = stumpy.subspace(np.array(v),m=3,
                      subseq_idx=motifs_idx[k][0],
                      nn_idx=indices[k][motifs_idx[k][0]],k=k)
                  res.append([int(x) for x in res_subspace])
          return res
      $$;

  - type: wait
    time: 1

  - name: python-udf14-8-1
    type: stream
    query: select test_subspace(value) as res, value from udf_stream;
    schema:
      - name: res
        type: array(int32)
      - name: value
        type: array(array(float64))

  - type: wait
    time: 2

  - type: query
    sql: insert into udf_stream(value) values ([[584., -11., 23., 79., 1001., 0., -19.], [1., 2., 4., 8., 16., 0., 32.]]);

  - type: check
    target_name: python-udf14-8-1
    expected_result:
      - [[0, 1], [[584., -11., 23., 79., 1001., 0., -19.], [1., 2., 4., 8., 16., 0., 32.]]]
