description: Test covering simple python udf test

steps:
  - type: query
    sql: drop stream if exists udf_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream udf_stream (value array(float64), update float64);
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_stumpi(value array(float64), update float64) RETURNS array(float64) LANGUAGE PYTHON AS
      $$
      import stumpy
      import numpy as np

      def test_stumpi(value, update):
          res = []
          for v, u in zip(value, update):
              if len(v) >= 3:
                  mp = stumpy.stumpi(np.array(v), m=3)
                  mp.update(u)
                  res.append(mp.left_P_.tolist())
          return res
      $$;

  - type: wait
    time: 1

  - name: python-udf14-5-1
    type: stream
    query: select test_stumpi(value, update) as res, value, update from udf_stream;
    schema:
      - name: res
        type: array(float64)
      - name: value
        type: array(float64)
      - name: update
        type: float64

  - type: wait
    time: 2

  - type: query
    sql: insert into udf_stream(value, update) values ([584., -11., 23., 79., 1001., 0.], -19.0);

  - type: check
    target_name: python-udf14-5-1
    timeout: 70 # address build need more time
    expected_result:
      - [[inf, 3.0000926340485923, 2.6940739180634408, 3.0565641683618954], [584., -11., 23., 79., 1001., 0.], -19.0]
