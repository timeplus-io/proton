description: Test covering simple python udf test

steps:
  - type: query
    sql: drop stream if exists udf_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream udf_stream (value array(float));
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_snippets(value array(float)) RETURNS tuple(array(array(float)), array(int), array(array(float)), array(float), array(float), array(array(int))) LANGUAGE PYTHON AS
      $$
      import stumpy
      import numpy as np

      def test_snippets(value):
          res = []
          for v in value:
              if len(v) > 0:
                  res_snippets = stumpy.snippets(np.array(v), m=3, k=2)
                  snippets = res_snippets[0].tolist()
                  snippets_indices = res_snippets[1].tolist()
                  snippets_profiles = res_snippets[2].tolist()
                  snippets_fractions = res_snippets[3].tolist()
                  snippets_areas = res_snippets[4].tolist()
                  snippets_regimes = res_snippets[5].tolist()
                  res.append((snippets, snippets_indices, snippets_profiles, snippets_fractions, snippets_areas, snippets_regimes))
          return res
      $$;

  - type: wait
    time: 1

  - name: python-udf14-23-1
    type: stream
    query: select test_snippets(value) as res, value from udf_stream;
    schema:
      - name: res
        type: tuple(array(array(float32)), array(int32), array(array(float32)), array(float32), array(float32), array(array(int32)))
      - name: value
        type: array(float32)

  - type: wait
    time: 2

  - type: query
    sql: insert into udf_stream(value) values ([584., -11., 23., 79., 1001., 0., -19.]);

  - type: check
    target_name: python-udf14-23-1
    expected_result:
      - [[[[584.0, -11.0, 23.0], [79.0, 1001.0, 0.0]], [0, 3], [[0.0, 3.2452631984605316, 3.0000926340485923, 2.9824089953821886, 0.1163385711369199], [2.9824089953821886, 2.6940739180634408, 3.0171958577529536, 0.0, 2.9215458603776643]], [0.6, 0.4], [9.344103399028233, 5.810505123248953], [[0, 0, 1], [0, 2, 3], [0, 4, 5], [1, 1, 2], [1, 3, 4]]], [584., -11., 23., 79., 1001., 0., -19.]]
