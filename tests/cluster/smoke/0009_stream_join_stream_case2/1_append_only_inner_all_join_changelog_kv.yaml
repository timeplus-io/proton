tags:
  - data_enrichment_join
  - inner-join
description: append-only inner all join changelog-kv
cluster:
  - p1k1
  - p3k1
steps:
  - type: query
    sql: drop stream if exists test10_append_left_stream

  - type: query
    sql: drop stream if exists test10_changelog_kv_stream

  - type: wait
    time: 2

  - type: query
    sql: create stream test10_append_left_stream(i int, k string)

  - type: query
    sql: create stream test10_changelog_kv_stream(ii int, kk string) primary
      key kk settings mode='changelog_kv'

  - type: wait
    time: 2

  - name: '1051'
    type: stream
    query: select i, k, ii, kk from test10_append_left_stream inner join
      test10_changelog_kv_stream on i == ii
    schema:
      - name: i
        type: int32
      - name: k
        type: string
      - name: ii
        type: int32
      - name: kk
        type: string

  - type: wait
    time: 1

  - type: query
    sql: insert into test10_changelog_kv_stream (ii, kk) values (1, 'k1')

  - type: query
    sql: insert into test10_append_left_stream (i, k) values (1, 'k1') (2, 'k2')

  - type: query
    sql: insert into test10_changelog_kv_stream (ii, kk) values (1, 'k2')

  - type: query
    sql: insert into test10_changelog_kv_stream (ii, kk, _tp_delta) values (1, 'k1', -1)

  - type: query
    sql: insert into test10_append_left_stream (i, k) values (1, 'k1')

  - type: check
    target_name: '1051'
    expected_result:
      - [ 1, k1, 1, k1]
      - [ 1, k1, 1, k2]
