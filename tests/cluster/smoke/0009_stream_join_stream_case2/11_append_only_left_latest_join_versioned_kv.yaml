tags:
  - data_enrichment_join
  - left-join
description: append-only left latest join versioned-kv
cluster:
  - p1k1
  - p3k1
steps:
  - type: query
    sql: drop stream if exists test10_append_left_stream;

  - type: query
    sql: drop stream if exists test10_vk_right_stream;

  - type: wait
    time: 1

  - type: query
    sql: create stream test10_append_left_stream (i int, s string);

  - type: query
    sql: create stream test10_vk_right_stream (ii int, ss string) primary
      key ss settings mode='versioned_kv';

  - type: wait
    time: 2

  - name: '1061'
    type: stream
    query: select i, s, ii, ss from test10_append_left_stream left latest join test10_vk_right_stream
      on i=ii;
    schema:
      - name: i
        type: int32
      - name: s
        type: string
      - name: ii
        type: int32
      - name: ss
        type: string

  - type: wait
    time: 1

  - type: query
    sql: insert into test10_vk_right_stream(ii, ss) values (1, 'ss1') (1, 'ss2');

  - type: query
    sql: insert into test10_append_left_stream(i, s) values (1, 's1');

  - type: query
    sql: insert into test10_vk_right_stream(ii, ss) values (2, 'ss2');

  - type: query
    sql: insert into test10_append_left_stream(i, s) values (2, 's2');

  - type: query
    sql: insert into test10_append_left_stream(i, s) values (3, 's3');
  
  - type: check
    target_name: '1061'
    expected_result:
      - [ 1, s1, 1, ss2 ]
      - [ 2, s2, 2, ss2 ]
      - [ 3, s3, 0, '' ]
