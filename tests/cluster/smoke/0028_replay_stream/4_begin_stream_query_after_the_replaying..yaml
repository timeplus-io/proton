tags:
- replay_stream
- stream query
description: begin stream query after the replaying.
cluster:
- p1k1
- p3k1
steps:
- type: query
  sql: drop stream if exists test29_stream

- type: wait
  time: 1

- type: query
  sql: create stream test29_stream (id int, value int)

- type: wait
  time: 2

- type: query
  sql: insert into test29_stream(id, value) values
  schema:
    - name: id
      type: int32
    - name: value
      type: int32
  inputs:
    - [1, 2]

- type: wait
  time: 2

- type: query
  sql: insert into test29_stream(id, value) values
  schema:
    - name: id
      type: int32
    - name: value
      type: int32
  inputs:
    - [2, 2]

- type: wait
  time: 1

- type: query
  sql: insert into test29_stream(id, value) values
  schema:
    - name: id
      type: int32
    - name: value
      type: int32
  inputs:
    - [3, 1]
  
- type: wait
  time: 1

- name: 2905
  type: stream
  query: select id, value from test29_stream where _tp_time > earliest_timestamp()
    settings replay_speed=1
  schema:
  - name: id
    type: int32
  - name: value
    type: int32

- type: wait
  time: 1

- type: query
  sql: insert into test29_stream(id, value) values
  schema:
    - name: id
      type: int32
    - name: value
      type: int32
  inputs:
    - [4, 1]

- type: wait
  time: 1

- type: query
  sql: insert into test29_stream(id, value) values
  schema:
    - name: id
      type: int32
    - name: value
      type: int32
  inputs:
    - [5, 1]

- type: check
  target_name: 2905
  expected_result:
  - [1, 2]
  - [2, 2]
  - [3, 1]
  - [4, 1]
  - [5, 1]
