tags:
  - query_state
description: hopping window aggregation state checkpoint
cluster:
  - p1k1
steps:
  - type: query
    sql: drop stream if exists test19_state_stream4

  - type: wait
    time: 1

  - type: query
    sql: create stream test19_state_stream4 (id string, location string, value float,
      timestamp datetime64(3) default now64(3))

  - type: wait
    time: 1

  - name: '1986'
    query_id: '1986'
    type: stream
    query: subscribe to select id, b.type, max(a.value), window_start, window_end from
      hop(test19_state_stream4, timestamp, interval 3 second, interval 5 second) as
      a join table(test19_join) as b on a.id = b.id group by a.id, b.type, window_start,
      window_end emit stream settings checkpoint_interval=1
    schema:
      - name: id
        type: string
      - name: type
        type: string
      - name: max(value)
        type: float32
      - name: window_start
        type: datetime64(3)
      - name: window_end
        type: datetime64(3)

  - type: wait
    time: 1

  - type: query
    sql: insert into test19_state_stream4(id, location, value, timestamp) values ('dev1',
      'ca', 57.3, '2020-02-02 20:00:00')

  - type: query
    sql: insert into test19_state_stream4(id, location, value, timestamp) values ('dev2',
      'ca', 58.3, '2020-02-02 20:00:03')

  - type: query
    sql: insert into test19_state_stream4(id, location, value, timestamp) values ('dev6',
      'ca', 66, '2020-02-02 20:00:04')

  - type: query
    sql: insert into test19_state_stream4(id, location, value, timestamp) values ('dev6',
      'ca', 69, '2020-02-02 20:00:05')

  - type: query
    sql: insert into test19_state_stream4(id, location, value, timestamp) values ('dev8',
      'ca', 68, '2020-02-02 20:00:08')

  - type: query
    sql: insert into test19_state_stream4(id, location, value, timestamp) values ('dev8',
      'ca', 67, '2020-02-02 20:00:10')

  - type: wait
    time: 3

  - type: query
    sql: kill query where query_id = '1986'

  - type: wait
    time: 1

  - type: query
    sql: unsubscribe to '1986'

  - type: check
    target_name: '1986'
    mode: random
    expected_result:
      - [ dev1, roof, '57.3', '2020-02-02 19:59:57', '2020-02-02 20:00:02' ]
      - [ dev1, roof, '57.3', '2020-02-02 20:00:00', '2020-02-02 20:00:05' ]
      - [ dev2, field, '58.3', '2020-02-02 20:00:00', '2020-02-02 20:00:05' ]
      - [ dev6, window, '66', '2020-02-02 20:00:00', '2020-02-02 20:00:05' ]
      - [ dev2, field, '58.3', '2020-02-02 20:00:03', '2020-02-02 20:00:08' ]
      - [ dev6, window, '69', '2020-02-02 20:00:03', '2020-02-02 20:00:08' ]
