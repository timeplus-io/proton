tags:
  - query_state
description: stream tail join table state checkpoint with aggregation
cluster:
  - p1k1
steps:
  - type: query
    sql: drop stream if exists test19_state_stream4

  - type: wait
    time: 1

  - type: query
    sql: create stream test19_state_stream4 (id string, location string, value float,
      timestamp datetime64(3) default now64(3))

  - type: wait
    time: 1

  - name: '1982'
    query_id: '1982'
    type: stream
    query: subscribe to select a.id, b.type, max(value) from test19_state_stream4 as
      a join table(test19_join) as b on a.id = b.id group by a.id, b.type settings checkpoint_interval=1
    schema:
      - name: id
        type: string
      - name: type
        type: string
      - name: max(value)
        type: float32

  - type: wait
    time: 1

  - type: query
    sql: insert into test19_state_stream4(id, location, value, timestamp) values ('dev1',
      'ca', 57.3, '2020-02-02 20:00:00'), ('dev1', 'ca', 66, '2020-02-02 20:00:01'),
      ('dev2', 'ca', 58.3, '2020-02-02 20:00:03')

  - type: wait
    time: 3

  - type: query
    sql: kill query where query_id = '1982'

  - type: wait
    time: 1

  - type: query
    sql: unsubscribe to '1982'

  - type: check
    target_name: '1982'
    expected_result:
      - [ dev1, roof, 66 ]
      - [ dev2, field, 58.3 ]
