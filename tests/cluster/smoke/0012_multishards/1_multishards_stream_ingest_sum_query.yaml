tags:
  - test13_multishards_stream
description: multishards stream with ingestion with sum query
cluster:
  - p1k1
  - p3k1
steps:
  - type: wait
    time: 1

  - name: '1301'
    type: stream
    query: select sum(i) as s from test13_multishards_stream limit 1 emit periodic 10s;
    schema:
      - name: s
        type: int64

  - type: wait
    time: 1

  - type: query
    sql: insert into test13_multishards_stream(i) values (1)

  - type: query
    sql: insert into test13_multishards_stream(i) values (2)

  - type: query
    sql: insert into test13_multishards_stream(i) values (3)

  - type: check
    target_name: '1301'
    expected_result:
      - [ 6 ]
