name: multishards
description: Tests covering the stream query smoke cases.
tags:
  - smoke
setup:
  scope: suite
  steps:
    - type: wait
      time: 1

    - type: query
      sql: drop stream if exists test13_multishards_stream

    - type: wait
      time: 2

    - type: query
      sql: create stream test13_multishards_stream(i int) settings shards=3
