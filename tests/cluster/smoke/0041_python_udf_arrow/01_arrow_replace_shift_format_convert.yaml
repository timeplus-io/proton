description: Test covering simple python udf test

steps:
  - type: query
    sql: drop stream if exists udf_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream udf_stream (value datetime);
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_shift(value datetime) RETURNS datetime LANGUAGE PYTHON AS
      $$
      import arrow

      def test_shift(value):
          res = [arrow.get(v).shift(weeks=+3).datetime for v in value]
          return res
      $$;

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_replace_hour_min(value datetime('UTC')) RETURNS datetime LANGUAGE PYTHON AS
      $$
      import arrow

      def test_replace_hour_min(value):
          res = [arrow.get(v).replace(hour=4, minute=40).datetime for v in value]
          return res
      $$;

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_replace_tzinfo_fold(value datetime('UTC')) RETURNS bool LANGUAGE PYTHON AS
      $$
      import arrow

      def test_replace_tzinfo_fold(value):
          res = []
          for v in value:
              arw = arrow.get(v).replace(tzinfo="Europe/Paris", fold=0)
              ambi = arw.ambiguous
              res.append(ambi)
          return res
      $$;

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_format(value datetime('UTC')) RETURNS string LANGUAGE PYTHON AS
      $$
      import arrow

      def test_format(value):
          res = [arrow.get(v).format('YYYY-MM-DD HH:mm:ss ZZ') for v in value]
          return res
      $$;

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_convert(value datetime()) RETURNS datetime('US/Pacific') LANGUAGE PYTHON AS
      $$
      import arrow

      def test_convert(value):
          res = [arrow.get(v).to('US/Pacific').datetime for v in value]
          return res
      $$;

  - type: wait
    time: 2

  - name: python-udf7-1-1
    type: stream
    query: select test_shift(value) as res, value from udf_stream;
    schema:
      - name: res
        type: datetime
      - name: value
        type: datetime

  - name: python-udf7-1-2
    type: stream
    query: select test_replace_hour_min(value) as res, value from udf_stream;
    schema:
      - name: res
        type: datetime
      - name: value
        type: datetime

  - name: python-udf7-1-3
    type: stream
    query: select test_replace_tzinfo_fold(value) as res, value from udf_stream;
    schema:
      - name: res
        type: bool
      - name: value
        type: datetime

  - name: python-udf7-1-4
    type: stream
    query: select test_format(value) as res, value from udf_stream;
    schema:
      - name: res
        type: string
      - name: value
        type: datetime

  - name: python-udf7-1-5
    type: stream
    query: select test_convert(value) as res, value from udf_stream;
    schema:
      - name: res
        type: datetime
      - name: value
        type: datetime

  - type: wait
    time: 2

  - type: query
    sql: insert into udf_stream(value) values (parse_datetime32_best_effort('2025-01-01T01:11:11Z'))(parse_datetime32_best_effort('2019-10-27T02:22:22Z'));

  - type: check
    target_name: python-udf7-1-1
    expected_result:
      - ['2025-01-22 01:11:11', '2025-01-01 01:11:11']
      - ['2019-11-17 02:22:22', '2019-10-27 02:22:22']

  - type: check
    target_name: python-udf7-1-2
    expected_result:
      - ['2025-01-01 04:40:11', '2025-01-01 01:11:11']
      - ['2019-10-27 04:40:22', '2019-10-27 02:22:22']

  - type: check
    target_name: python-udf7-1-3
    expected_result:
      - [False, '2025-01-01 01:11:11']
      - [True, '2019-10-27 02:22:22']

  - type: check
    target_name: python-udf7-1-4
    expected_result:
      - ['2025-01-01 01:11:11 +00:00', '2025-01-01 01:11:11']
      - ['2019-10-27 02:22:22 +00:00', '2019-10-27 02:22:22']

  - type: check
    target_name: python-udf7-1-5
    expected_result:
      - ['2025-01-01 01:11:11', '2025-01-01 01:11:11']
      - ['2019-10-27 02:22:22', '2019-10-27 02:22:22']
