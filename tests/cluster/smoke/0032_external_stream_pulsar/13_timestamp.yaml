tags:
  - timestamp
description: Verify `_tp_time` is virtual (not schema-defined) for Pulsar external streams
cluster:
  - p1k1
  - p3k1
steps:
  - type: pulsar
    name: delete
    topic: test_ts

  - type: pulsar
    name: create
    topic: test_ts

  - type: query
    sql: drop stream if exists test_ts

  - type: wait
    time: 1

  - type: query
    sql: create external stream test_ts
        (
          key string,
          value int32,
          _tp_message_key string
        )
        settings type = 'pulsar', service_url = 'pulsar://pulsar:6650', topic = 'test_ts'

  - type: wait
    time: 1

  - type: stream
    name: select_from_test_ts
    query: select key, value, to_type_name(_tp_time), _tp_message_key from test_ts order by key
    schema:
    - name: key
      type: string
    - name: value
      type: int32
    - name: to_type_name(_tp_time)
      type: string
    - name: _tp_message_key
      type: string

  - type: wait
    time: 1

  - type: query
    sql: insert into test_ts values ('one', 1, 'key_one')('two', 2, 'key_two')

  - type: wait
    time: 2

  - type: check
    target_name: select_from_test_ts
    expected_result:
      - ['one', 1, "datetime64(3, 'UTC')", 'key_one']
      - ['two', 2, "datetime64(3, 'UTC')", 'key_two']
