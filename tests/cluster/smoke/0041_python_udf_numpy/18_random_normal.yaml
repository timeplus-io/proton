tags:
  - udf

description: Test covering simple python udf test

steps:
  - type: query
    sql: drop stream if exists udf_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream udf_stream (mu float, sigma float);
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_random_normal(mu float, sigma float) RETURNS float LANGUAGE PYTHON AS
      $$
      import numpy as np
      def test_random_normal(mu, sigma):
          res = []
          for i in range(len(mu)):
              s = np.random.normal(mu[i], sigma[i], 1000)
              check = abs(mu[i] - np.mean(s))
              res.append(float(check))
          return res
      $$;

  - type: wait
    time: 1

  - name: python-udf2-18-1
    type: stream
    query: select test_random_normal(mu, sigma) as res, mu, sigma from udf_stream;
    schema:
      - name: res
        type: float32
      - name: mu
        type: float32
      - name: sigma
        type: float32
  - type: wait
    time: 1

  - type: query
    sql: insert into udf_stream(mu, sigma) values (0, 0.1)(3, 2.5);

  - type: check
    target_name: python-udf2-18-1
    expected_result:
      - [any_value, 0, 0.1] # around 0.002
      - [any_value, 3, 2.5] # around 0.1
