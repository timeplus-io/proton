tags:
  - uda

description: Test covering python uda test on numpy.median function

steps:
  - type: query
    sql: drop stream if exists uda_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream uda_stream (value int);
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE AGGREGATE FUNCTION getMedian(value int) RETURNS float LANGUAGE PYTHON AS $$
      import pickle
      import numpy as np
      class getMedian:
          def __init__(self):
              self.median = 0
              self.arr = []

          def serialize(self):
              data = {}
              data['median'] = self.median
              return pickle.dumps(data)

          def deserialize(self, data):
              data = pickle.loads(data)
              self.median = data['median']

          def merge(self, other):
              self.arr = other.arr

          def process(self, values):
              tmp_arr = np.array(values)
              self.arr.extend(tmp_arr)
              self.median = float(np.median(self.arr))

          def finalize(self):
              return self.median
      $$;

  - type: wait
    time: 1

  - name: python-udf2-0-1
    type: stream
    query: select getMedian(value) as res from uda_stream;
    schema:
      - name: res
        type: float32

  - type: wait
    time: 1

  - type: query
    sql: insert into uda_stream(value) values (10)(7)(4);

  - type: wait
    time: 2

  - type: query
    sql: insert into uda_stream(value) values (3)(2)(1);

  - type: check
    target_name: python-udf2-0-1
    expected_result:
      - [7]
      - [3.5]
