name: python_udf_numpy
description: Tests covering the python udf numpy library
tags:
  - smoke
  - python_udf
  - python_udf_library
  - numpy
arch:
  - x86_64
setup:
  scope: suite
  steps:
    # numpy
    - type: query
      sql: SYSTEM INSTALL PYTHON PACKAGE 'numpy';

    - type: wait
      time: 15

    - type: command
      name: python-udf-numpy
      node: [p1]
      shell: |
        curl -X GET http://localhost:8123/proton/v1/python_packages  2>/dev/null | jq -c '.data[] | select(.name == "numpy") | length > 0'

    - type: check
      target_name: python-udf-numpy
      expected_result: ['true']
