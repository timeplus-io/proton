tags:
  - udf

description: Test covering simple python udf test

steps:
  - type: query
    sql: drop stream if exists udf_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream udf_stream (mean array(int), cov array(array(int)), size array(int));
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_random_multivariate_normal(mean array(int), cov array(array(int)), size array(int)) RETURNS array(int) LANGUAGE PYTHON AS
      $$
      import numpy as np
      def test_random_multivariate_normal(mean, cov, size):
          res = []
          for m, c, s in zip(mean, cov, size):
              if len(cov) > 0 and len(cov[0]) > 0:
                  x = np.random.multivariate_normal(m, c, s)
                  check = list(x.shape)
                  res.append(check)
          return res
      $$;

  - type: wait
    time: 1

  - name: python-udf2-19-1
    type: stream
    query: select test_random_multivariate_normal(mean, cov, size) as res, mean, cov, size from udf_stream;
    schema:
      - name: res
        type: array(int32)
      - name: mean
        type: array(int32)
      - name: cov
        type: array(array(int32))
      - name: size
        type: array(int32)
  - type: wait
    time: 1

  - type: query
    sql: insert into udf_stream(mean, cov, size) values ([1, 2], [[1, 0], [0, 1]], [3, 3]) ([1, 3], [[1, 0], [0, 1]], [2, 2]);

  - type: check
    target_name: python-udf2-19-1
    expected_result:
      - [[3, 3, 2], [1, 2], [[1, 0], [0, 1]], [3, 3]]
      - [[2, 2, 2], [1, 3], [[1, 0], [0, 1]], [2, 2]]
