tags:
  - uda

description: Test covering simple python uda test

steps:
  - type: query
    sql: drop stream if exists uda_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream uda_stream (value int32);
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE AGGREGATE FUNCTION getMax(value int32) RETURNS int LANGUAGE PYTHON AS $$
      import pickle
      import numpy as np
      class getMax:
          def __init__(self):
              self.max = np.iinfo(np.int32).min

          def serialize(self):
              data = {}
              data['max'] = self.max
              return pickle.dumps(data)

          def deserialize(self, data):
              data = pickle.loads(data)
              self.max = data['max']

          def merge(self, other):
              if (other.max > self.max):
                  self.max = other.max

          def process(self, values):
              tmp_max = np.max(values)
              if tmp_max > self.max:
                  self.max = tmp_max

          def finalize(self):
              return int(self.max)
      $$;

  - type: wait
    time: 1

  - name: python-udf2-27-1
    type: stream
    query: select getMax(value) as res from uda_stream;
    schema:
      - name: res
        type: int32

  - type: wait
    time: 1

  - type: query
    sql: insert into uda_stream(value) values (1)(2)(3);

  - type: wait
    time: 2

  - type: query
    sql: insert into uda_stream(value) values (3)(5)(7);

  - type: check
    target_name: python-udf2-27-1
    expected_result:
      - [3]
      - [7]
