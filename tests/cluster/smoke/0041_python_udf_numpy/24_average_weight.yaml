tags:
  - uda

description: Test covering simple python uda test

steps:
  - type: query
    sql: drop stream if exists uda_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream uda_stream (value int, weight float);
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE AGGREGATE FUNCTION getAverage(value int, weight float) RETURNS float LANGUAGE PYTHON AS $$
      import pickle
      import numpy as np

      class getAverage:
          def __init__(self):
              self.average = 0
              self.v_history = []
              self.w_history = []

          def serialize(self):
              data = {}
              data['average'] = self.average
              return pickle.dumps(data)

          def deserialize(self, data):
              data = pickle.loads(data)
              self.average = data['average']

          def merge(self, other):
              self.v_history = other.v_history
              self.w_history = other.w_history

          def process(self, values, weights):
              # values = [1,2,3]
              self.v_history.append(values)
              self.w_history.append(weights)
              if values[0] > 0:
                  self.average = float(np.average(self.v_history, weights=self.w_history))

          def finalize(self):
              return self.average
      $$;

  - type: wait
    time: 1

  - name: python-udf2-24-1
    type: stream
    query: select getAverage(value, weight) as res from uda_stream;
    schema:
      - name: res
        type: float32

  - type: wait
    time: 1

  - type: query
    sql: insert into uda_stream(value, weight) values (1, 0.1) (2, 0.2) (3, 0.3);

  - type: wait
    time: 2

  - type: query
    sql: insert into uda_stream(value, weight) values (4, 0.4) (5, 0.5) (6, 0.6);

  - type: check
    target_name: python-udf2-24-1
    expected_result:
      - [2.333333333333333]
      - [4.333333333333333]
