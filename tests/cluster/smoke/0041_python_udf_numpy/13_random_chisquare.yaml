tags:
  - udf

description: Test covering simple python udf test

steps:
  - type: query
    sql: drop stream if exists udf_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream udf_stream (value float);
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_random_chisquare(value float) RETURNS array(float) LANGUAGE PYTHON AS
      $$
      import numpy as np
      def test_random_chisquare(value):
          res = [np.random.chisquare(v, 4).tolist() for v in value if v > 0]
          return res
      $$;

  - type: wait
    time: 1

  - name: python-udf2-13-1
    type: stream
    query: select test_random_chisquare(value) as res, value from udf_stream;
    schema:
      - name: res
        type: array(float32)
      - name: value
        type: float32
  - type: wait
    time: 1

  - type: query
    sql: insert into udf_stream(value) values (2)(1.2);

  - type: check
    target_name: python-udf2-13-1
    expected_result:
      - [[any_value, any_value, any_value, any_value], 2]
      - [[any_value, any_value, any_value, any_value], 1.2]
