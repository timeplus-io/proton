tags:
  - udf

description: Test covering simple python udf test

steps:
  - type: query
    sql: drop stream if exists udf_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream udf_stream (loc float, scale float);
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_random_logistic(loc float, scale float) RETURNS float LANGUAGE PYTHON AS
      $$
      import numpy as np
      def test_random_logistic(loc, scale):
          res = []
          n = 10000
          for i in range(len(loc)):
              s = np.random.logistic(loc[i], scale[i], n)
              check = sum(1 for x in s if loc[i]-1 <= x <= loc[i]+1)/n
              res.append(float(check))
          return res
      $$;

  - type: wait
    time: 1

  - name: python-udf2-17-1
    type: stream
    query: select test_random_logistic(loc, scale) as res, loc, scale from udf_stream;
    schema:
      - name: res
        type: float32
      - name: loc
        type: float32
      - name: scale
        type: float32
  - type: wait
    time: 1

  - type: query
    sql: insert into udf_stream(loc, scale) values (10, 1)(10, 2);

  - type: check
    target_name: python-udf2-17-1
    expected_result:
      - [any_value, 10, 1] # around 0.46
      - [any_value, 10, 2] # around 0.24
