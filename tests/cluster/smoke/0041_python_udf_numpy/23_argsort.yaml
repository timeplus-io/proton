tags:
  - udf

description: Test covering simple python udf test

steps:
  - type: query
    sql: drop stream if exists udf_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream udf_stream (arr int);
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_argsort(arr int) RETURNS int64 LANGUAGE PYTHON AS
      $$
      import numpy as np
      def test_argsort(arr):
          res = np.argsort(arr).tolist()
          return res
      $$;

  - type: wait
    time: 1

  - name: python-udf2-23-1
    type: stream
    query: select test_argsort(arr) as res, arr from udf_stream;
    schema:
      - name: res
        type: int64
      - name: arr
        type: int32
  - type: wait
    time: 1

  - type: query
    sql: insert into udf_stream(arr) values (3)(1)(2);

  - type: check
    target_name: python-udf2-23-1
    expected_result:
      - [1, 3]
      - [2, 1]
      - [0, 2]
