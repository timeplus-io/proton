tags:
  - uda

description: Test covering simple python uda test

steps:
  - type: query
    sql: drop stream if exists uda_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream uda_stream (value int32);
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE AGGREGATE FUNCTION getMin(value int32) RETURNS int LANGUAGE PYTHON AS $$
      import pickle
      import numpy as np
      class getMin:
          def __init__(self):
              self.min = np.iinfo(np.int32).max

          def serialize(self):
              data = {}
              data['min'] = self.min
              return pickle.dumps(data)

          def deserialize(self, data):
              data = pickle.loads(data)
              self.min = data['min']

          def merge(self, other):
              if other.min < self.min:
                  self.min = other.min

          def process(self, values):
              tmp_min = np.min(values)
              if tmp_min < self.min:
                  self.min = tmp_min

          def finalize(self):
              return int(self.min)
      $$;

  - type: wait
    time: 1

  - name: python-udf2-28-1
    type: stream
    query: select getMin(value) as res from uda_stream;
    schema:
      - name: res
        type: int32

  - type: wait
    time: 1

  - type: query
    sql: insert into uda_stream(value) values (3)(5)(7);

  - type: wait
    time: 2

  - type: query
    sql: insert into uda_stream(value) values (1)(2)(3);

  - type: check
    target_name: python-udf2-28-1
    expected_result:
      - [3]
      - [1]
