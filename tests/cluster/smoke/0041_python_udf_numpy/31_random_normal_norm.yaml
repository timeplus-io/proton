tags:
  - udf

description: Test covering simple python udf test

steps:
  - type: query
    sql: drop stream if exists udf_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream udf_stream (mu float, sigma float, size tuple(a int, b int));
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_random_normal(mu float, sigma float, size tuple(a int, b int)) RETURNS tuple(int, int) LANGUAGE PYTHON AS
      $$
      import numpy as np
      def test_random_normal(mu, sigma, size):
          res = []
          for i in range(len(mu)):
              s = np.random.normal(mu[i], sigma[i], size[i])
              res.append(s.shape)
          return res
      $$;

  - type: wait
    time: 1

  - name: python-udf2-31-1
    type: stream
    query: select test_random_normal(mu, sigma, size) as res, mu, sigma, size from udf_stream;
    schema:
      - name: res
        type: tuple(int32, int32)
      - name: mu
        type: float32
      - name: sigma
        type: float32
      - name: size
        type: tuple(a int32, b int32)
  - type: wait
    time: 1

  - type: query
    sql: insert into udf_stream(mu, sigma, size) values (1, 0.1, (1,2))(3, 2.5, (2,1));

  - type: check
    target_name: python-udf2-31-1
    expected_result:
      - [[1, 2], 1, 0.1, {a: 1, b: 2}]
      - [[2, 1], 3, 2.5, {a: 2, b: 1}]
