tags:
- query_state
- data_enrichment_join
- left-join
description: append-only left all JOIN versioned_kv state checkpoint
cluster:
- p1k1

steps:
- type: query
  sql: drop stream if exists test19_left_stream3;
- type: query
  sql: drop stream if exists test19_vk_right_stream3;
- type: wait
  time: 1

- type: query
  sql: create stream if not exists test19_left_stream3(i int, k string);
- type: wait
  time: 1

- type: query
  sql: create stream if not exists test19_vk_right_stream3(j int, k string, kk string)
    primary key (k, kk) settings mode='versioned_kv';
- type: wait
  time: 1

- name: '19357'
  type: stream
  query_id: '19357'
  query: subscribe to select i, test19_left_stream3.k, j, test19_vk_right_stream3.k,
    kk from test19_left_stream3 left join test19_vk_right_stream3 on test19_left_stream3.k
    == test19_vk_right_stream3.k settings checkpoint_interval=1;
  schema:
  - name: i
    type: int32
  - name: k
    type: string
  - name: j
    type: int32
  - name: test19_vk_right_stream3.k
    type: string
  - name: kk
    type: string
- type: wait
  time: 2

- type: query
  sql: insert into test19_vk_right_stream3 (j, k, kk) values
  schema:
  - name: j
    type: int32
  - name: k
    type: string
  - name: kk
    type: string
  inputs:
  - [1, 'a', 'bb']
  - [1, 'a', 'cc']
- type: wait
  time: 1

- type: query
  sql: insert into test19_left_stream3 (i, k) values
  schema:
  - name: i
    type: int32
  - name: k
    type: string
  inputs:
  - [1, 'a']
- type: wait
  time: 1

- type: query
  sql: kill query where query_id = '19357'
- type: wait
  time: 3

- type: query
  sql: insert into test19_vk_right_stream3 (j, k, kk) values
  schema:
  - name: j
    type: int32
  - name: k
    type: string
  - name: kk
    type: string
  inputs:
  - [2, 'a', 'cc']

- name: 19357-1
  type: stream
  query: recover from '19357'
  schema:
  - name: i
    type: int32
  - name: k
    type: string
  - name: j
    type: int32
  - name: test19_vk_right_stream3.k
    type: string
  - name: kk
    type: string
- type: wait
  time: 1

- type: query
  sql: insert into test19_left_stream3 (i, k) values
  schema:
  - name: i
    type: int32
  - name: k
    type: string
  inputs:
  - [2, 'a']
  - [2, 'b']
- type: wait
  time: 2

- type: query
  sql: kill query where query_id = '19357' sync

- type: query
  sql: unsubscribe to '19357'

- type: check
  target_name: '19357'
  expected_result:
  - [1, a, 1, a, bb]
  - [1, a, 1, a, cc]

- type: check
  target_name: 19357-1
  expected_result:
  - [2, a, 1, a, bb]
  - [2, a, 2, a, cc]
  - [2, b, 0, '', '']
