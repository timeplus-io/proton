tags:
- query_state
- bidirectional join
- left-join
- native_not_support
- bug # skip for native_not_support
description: append-only left all JOIN append-only state checkpoint
cluster:
- p1k1

steps:
- type: query
  sql: drop stream if exists test19_left_stream3;
- type: query
  sql: drop stream if exists test19_right_stream3;
- type: wait
  time: 1

- type: query
  sql: create stream if not exists test19_left_stream3(i int, k string);
- type: wait
  time: 1

- type: query
  sql: create stream if not exists test19_right_stream3(j int, kk string);
- type: wait
  time: 1

- name: '19356'
  type: stream
  query_id: '19356'
  query: subscribe to select i, k, j, kk from test19_left_stream3 left join test19_right_stream3
    on i == j settings checkpoint_interval=1;
  schema:
  - name: i
    type: int32
  - name: k
    type: string
  - name: j
    type: int32
  - name: kk
    type: string
- type: wait
  time: 1

- type: query
  sql: insert into test19_right_stream3 (j, kk) values
  schema:
  - name: j
    type: int32
  - name: kk
    type: string
  inputs:
  - [1, 'a']
  - [1, 'b']
- type: wait
  time: 1

- type: query
  sql: insert into test19_left_stream3 (i, k) values
  schema:
  - name: i
    type: int32
  - name: k
    type: string
  inputs:
  - [1, 'a']
- type: wait
  time: 1

- type: query
  sql: kill query where query_id = '19356'
- type: wait
  time: 3

- type: query
  sql: insert into test19_right_stream3 (j, kk) values
  schema:
  - name: j
    type: int32
  - name: kk
    type: string
  inputs:
  - [2, 'c']
- type: wait
  time: 1

- name: 19356-1
  type: stream
  query: recover from '19356'
  schema:
  - name: i
    type: int32
  - name: k
    type: string
  - name: j
    type: int32
  - name: kk
    type: string
- type: wait
  time: 1

- type: query
  sql: insert into test19_left_stream3 (i, k) values
  schema:
  - name: i
    type: int32
  - name: k
    type: string
  inputs:
  - [2, 'b']
  - [3, 'c']
- type: wait
  time: 2

- type: query
  sql: kill query where query_id = '19356' sync

- type: query
  sql: unsubscribe to '19356'

- type: check
  target_name: '19356'
  expected_result:
  - [1, a, 1, a]
  - [1, a, 1, b]

- type: check
  target_name: 19356-1
  expected_result:
  - [2, b, 2, c]
  - [3, c, 0, '']
