tags:
- versioned_kv
- multiple_primary_key
description: append-only join versioned_kv with No primary key(s) join state checkpoint
cluster:
- p1k1

steps:
- type: query
  sql: drop stream if exists test19_append_left_stream
- type: query
  sql: drop stream if exists test19_vk_right_stream
- type: wait
  time: 1

- type: query
  sql: create stream if not exists test19_append_left_stream (i1 int, i2 int, s string)
- type: wait
  time: 1

- type: query
  sql: create stream if not exists test19_vk_right_stream (ii1 int, ii2 int, ss string)
    primary key (ii1, ii2) settings mode='versioned_kv'
- type: wait
  time: 1

- name: '19256'
  type: stream
  query_id: '19256'
  query: subscribe to select i1, i2, s, ii1, ii2, ss from test19_append_left_stream
    inner join test19_vk_right_stream on s = ss settings checkpoint_interval=1
  schema:
  - name: i1
    type: int32
  - name: i2
    type: int32
  - name: s
    type: string
  - name: ii1
    type: int32
  - name: ii2
    type: int32
  - name: ss
    type: string
- type: wait
  time: 2

- type: query
  sql: insert into test19_vk_right_stream(ii1, ii2, ss) values
  schema:
  - name: ii1
    type: int32
  - name: ii2
    type: int32
  - name: ss
    type: string
  inputs:
  - [1, 1, 's1']
- type: wait
  time: 2

- type: query
  sql: insert into test19_append_left_stream(i1, i2, s) values
  schema:
  - name: i1
    type: int32
  - name: i2
    type: int32
  - name: s
    type: string
  inputs:
  - [1, 1, 's1']
- type: wait
  time: 1

- type: query
  sql: kill query where query_id = '19256'
- type: wait
  time: 3

- type: query
  sql: insert into test19_vk_right_stream(ii1, ii2, ss) values
  schema:
  - name: ii1
    type: int32
  - name: ii2
    type: int32
  - name: ss
    type: string
  inputs:
  - [1, 1, 's2']
- type: wait
  time: 1

- type: query
  sql: insert into test19_vk_right_stream(ii1, ii2, ss) values
  schema:
  - name: ii1
    type: int32
  - name: ii2
    type: int32
  - name: ss
    type: string
  inputs:
  - [2, 2, 's1']
- type: wait
  time: 2

- name: 19256-1
  type: stream
  query: recover from '19256'
  schema:
  - name: i1
    type: int32
  - name: i2
    type: int32
  - name: s
    type: string
  - name: ii1
    type: int32
  - name: ii2
    type: int32
  - name: ss
    type: string
- type: wait
  time: 1

- type: query
  sql: insert into test19_append_left_stream(i1, i2, s) values
  schema:
  - name: i1
    type: int32
  - name: i2
    type: int32
  - name: s
    type: string
  inputs:
  - [1, 1, 's1']
- type: wait
  time: 3

- type: query
  sql: kill query where query_id = '19256' sync

- type: query
  sql: unsubscribe to '19256'

- type: check
  target_name: '19256'
  expected_result:
  - [1, 1, s1, 1, 1, s1]

- type: check
  target_name: 19256-1
  expected_result:
  - [1, 1, s1, 2, 2, s1]
