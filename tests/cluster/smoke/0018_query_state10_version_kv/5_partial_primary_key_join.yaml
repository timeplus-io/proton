tags:
- versioned_kv
- multiple_primary_key
description: versioned_kv join versioned_kv with all primary keys state checkpoint
cluster:
- p1k1

steps:
- type: query
  sql: drop stream if exists test19_vk_left_stream
- type: query
  sql: drop stream if exists test19_vk_right_stream
- type: wait
  time: 1

- type: query
  sql: create stream if not exists test19_vk_left_stream (i1 int, i2 int, s string)
    primary key (i1, i2) settings mode='versioned_kv'

- type: query
  sql: create stream if not exists test19_vk_right_stream (ii1 int, ii2 int, ss string)
    primary key (ii1, ii2) settings mode='versioned_kv'
- type: wait
  time: 2

- name: '19255'
  type: stream
  query_id: '19255'
  query: subscribe to select i1, i2, s, ii1, ii2, ss from test19_vk_left_stream
    inner join test19_vk_right_stream on i1 = ii1 settings checkpoint_interval=1
  schema:
  - name: i1
    type: int32
  - name: i2
    type: int32
  - name: s
    type: string
  - name: ii1
    type: int32
  - name: ii2
    type: int32
  - name: ss
    type: string
- type: wait
  time: 1

- type: query
  sql: insert into test19_vk_right_stream(ii1, ii2, ss) values (1, 1, 'ss1')
- type: wait
  time: 1

- type: query
  sql: insert into test19_vk_left_stream(i1, i2, s) values (1, 1, 's1')
- type: wait
  time: 1

- type: query
  sql: kill query where query_id = '19255'
- type: wait
  time: 3

- type: query
  sql: insert into test19_vk_right_stream(ii1, ii2, ss) values (1, 1, 'ss2')
- type: wait
  time: 1

- type: query
  sql: insert into test19_vk_right_stream(ii1, ii2, ss) values (1, 2, 'ss3')
- type: wait
  time: 1

- name: 19255-1
  type: stream
  query: recover from '19255'
  schema:
  - name: i1
    type: int32
  - name: i2
    type: int32
  - name: s
    type: string
  - name: ii1
    type: int32
  - name: ii2
    type: int32
  - name: ss
    type: string
- type: wait
  time: 1

- type: query
  sql: insert into test19_vk_left_stream(i1, i2, s) values (1, 1, 's2')
- type: wait
  time: 3

- type: query
  sql: kill query where query_id = '19255' sync

- type: query
  sql: unsubscribe to '19255'

- type: check
  target_name: '19255'
  expected_result:
  - [1, 1, s1, 1, 1, ss1]

- type: check
  target_name: 19255-1
  expected_result:
  - [1, 1, s1, 1, 1, ss2]
  - [1, 1, s1, 1, 2, ss3]
  - [1, 1, s2, 1, 1, ss2]
  - [1, 1, s2, 1, 2, ss3]
