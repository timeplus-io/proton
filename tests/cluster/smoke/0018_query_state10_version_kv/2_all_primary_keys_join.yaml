tags:
- versioned_kv
- multiple_primary_key
description: append-only join versioned_kv with all primary keys state checkpoint
cluster:
- p1k1

steps:
- type: query
  sql: drop stream if exists test19_append_left_stream
- type: query
  sql: drop stream if exists test19_vk_right_stream
- type: wait
  time: 1

- type: query
  sql: create stream if not exists test19_append_left_stream (i1 int, i2 int, s string)
- type: wait
  time: 1

- type: query
  sql: create stream if not exists test19_vk_right_stream (ii1 int, ii2 int, ss string)
    primary key (ii1, ii2) settings mode='versioned_kv'
- type: wait
  time: 1

- name: '19252'
  type: stream
  query_id: '19252'
  query: subscribe to select i1, i2, s, ii1, ii2, ss from test19_append_left_stream
    inner join test19_vk_right_stream on i1 = ii1 and i2 = ii2 settings checkpoint_interval=1
  schema:
  - name: i1
    type: int32
  - name: i2
    type: int32
  - name: s
    type: string
  - name: ii1
    type: int32
  - name: ii2
    type: int32
  - name: ss
    type: string
- type: wait
  time: 1

- type: query
  sql: insert into test19_vk_right_stream(ii1, ii2, ss) values (1, 1, 'ss1')
  schema:
  - name: ii1
    type: int32
  - name: ii2
    type: int32
  - name: ss
    type: string
  inputs:
  - [1, 1, 'ss1']
- type: wait
  time: 1

- type: query
  sql: insert into test19_append_left_stream(i1, i2, s) values (1, 1, 's1')
  schema:
  - name: i1
    type: int32
  - name: i2
    type: int32
  - name: s
    type: string
  inputs:
  - [1, 1, 's1']
- type: wait
  time: 1

- type: query
  sql: kill query where query_id = '19252'
- type: wait
  time: 3

- type: query
  sql: insert into test19_vk_right_stream(ii1, ii2, ss) values (1, 1, 'ss2')
  schema:
  - name: ii1
    type: int32
  - name: ii2
    type: int32
  - name: ss
    type: string
  inputs:
  - [1, 1, 'ss2']
- type: wait
  time: 1

- name: 19252-1
  type: stream
  query: recover from '19252'
  schema:
  - name: i1
    type: int32
  - name: i2
    type: int32
  - name: s
    type: string
  - name: ii1
    type: int32
  - name: ii2
    type: int32
  - name: ss
    type: string
- type: wait
  time: 1

- type: query
  sql: insert into test19_append_left_stream(i1, i2, s) values (1, 1, 's2')
  schema:
  - name: i1
    type: int32
  - name: i2
    type: int32
  - name: s
    type: string
  inputs:
  - [1, 1, 's2']
- type: wait
  time: 3

- type: query
  sql: kill query where query_id = '19252' sync

- type: query
  sql: unsubscribe to '19252'

- type: check
  target_name: '19252'
  expected_result:
  - [1, 1, s1, 1, 1, ss1]

- type: check
  target_name: 19252-1
  expected_result:
  - [1, 1, s2, 1, 1, ss2]
