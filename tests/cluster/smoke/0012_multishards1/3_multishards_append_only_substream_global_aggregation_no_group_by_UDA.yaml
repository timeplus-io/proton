tags:
  - multishards
  - append_only
  - substream
  - streaming_aggregation
  - global_aggregation
  - no_group_by
  - UDA
  - not_supported_hybrid # Substream aggregating does not support hybrid aggregator
description: multishards append only substream global aggregation no group by, UDA
cluster:
  - p1k1
  - p3k1
steps:
  - type: query
    sql: 'drop view if exists test13_view2_1;'

  - type: wait
    time: 1

  - type: query
    sql: 'drop view if exists test13_view1_1;'

  - type: wait
    time: 1

  - type: query
    sql: 'drop stream if exists test13_subst_1;'

  - type: wait
    time: 1

  - type: query
    sql: 'create stream test13_subst_1(val float, k int) settings shards=3;'

  - type: wait
    time: 2

  - name: '1303'
    type: stream
    query: |
      select test_13_1_sec_large(val)
      from test13_subst_1 partition by k;
    schema:
      - name: test_13_1_sec_large(val)
        type: float32

  - type: wait
    time: 1

  - type: query
    sql: 'insert into test13_subst_1 (val, k)
    values (1, 1);'

  - type: wait
    time: 1

  - type: query
    sql: 'insert into test13_subst_1 (val, k)
    values (2, 2);'

  - type: wait
    time: 1

  - type: query
    sql: 'insert into test13_subst_1 (val, k)
    values (3, 3);'

  - type: wait
    time: 1

  - type: query
    sql: 'insert into test13_subst_1 (val, k)
    values (1, 2);'

  - type: wait
    time: 1

  - type: query
    sql: 'insert into test13_subst_1 (val, k)
    values (2, 3);'

  - type: wait
    time: 1

  - type: query
    sql: 'insert into test13_subst_1 (val, k)
    values (3, 1);'

  - type: check
    target_name: '1303'
    mode: random
    expected_result:
      - [ -1 ]
      - [ -1 ]
      - [ -1 ]
      - [ 1 ]
      - [ 2 ]
      - [ 1 ]

