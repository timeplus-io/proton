tags:
  - multishards
  - append_only
  - substream
  - streaming_aggregation
  - window_aggregation
  - tumble_window_aggregation
  - group_by
  - UDA
  - not_supported_hybrid # Substream aggregating does not support hybrid aggregator
description: tumble window aggregation partition by group by, UDA
cluster:
  - p1k1
  - p3k1
steps:
  - type: wait
    time: 1

  - type: query
    sql: 'drop stream if exists test13_multishard_1;'

  - type: wait
    time: 1

  - type: query
    sql: 'create stream test13_multishard_1(i float, k int, timestamp datetime64(3) default now64(3)) settings shards=3;'

  - type: wait
    time: 1

  - name: '1305'
    type: stream
    query: |
      select k,
             test_13_1_sec_large(i),
             window_start as s,
             window_end as e
      from tumble(test13_multishard_1 ,timestamp, 5s) partition by k
      group by k,
               window_start,
               window_end
      order by k;
    schema:
      - name: k
        type: int32
      - name: test_13_1_sec_large(i)
        type: float32
      - name: s
        type: datetime64(3)
      - name: e
        type: datetime64(3)


  - type: wait
    time: 1

  - type: query
    sql: 'insert into test13_multishard_1(i, k, timestamp)
    values(0, 0, ''2021-11-02 20:00:01'');'

  - type: wait
    time: 1

  - type: query
    sql: 'insert into test13_multishard_1(i, k, timestamp)
    values(1, 1, ''2021-11-02 20:00:01'');'

  - type: wait
    time: 1

  - type: query
    sql: 'insert into test13_multishard_1(i, k, timestamp)
    values(2, 0, ''2021-11-02 20:00:03'');'

  - type: wait
    time: 1

  - type: query
    sql: 'insert into test13_multishard_1(i, k, timestamp)
    values(3, 1, ''2021-11-02 20:00:04'');'

  - type: wait
    time: 1

  - type: query
    sql: 'insert into test13_multishard_1(i, k, timestamp)
    values(4, 0, ''2021-11-02 20:00:05'');'

  - type: wait
    time: 1

  - type: query
    sql: 'insert into test13_multishard_1(i, k, timestamp)
    values(5, 1, ''2021-11-02 20:00:06'');'

  - type: wait
    time: 1

  - type: query
    sql: 'insert into test13_multishard_1(i, k, timestamp)
    values(6, 0, ''2021-11-02 20:00:07'');'

  - type: wait
    time: 1

  - type: query
    sql: 'insert into test13_multishard_1(i, k, timestamp)
    values(7, 1, ''2021-11-02 20:00:08'');'

  - type: wait
    time: 1

  - type: query
    sql: 'insert into test13_multishard_1(i, k, timestamp)
    values(8, 0, ''2021-11-02 20:00:09'');'

  - type: wait
    time: 1

  - type: query
    sql: 'insert into test13_multishard_1(i, k, timestamp)
    values(9, 1, ''2021-11-02 20:00:10'');'

  - type: wait
    time: 1

  - type: query
    sql: 'insert into test13_multishard_1(i, k, timestamp)
    values(10, 0, ''2021-11-02 20:00:11'');'

  - type: check
    target_name: '1305'
    expected_result:
      - [ 0, 0, '2021-11-02 20:00:00', '2021-11-02 20:00:05' ]
      - [ 1, 1, '2021-11-02 20:00:00', '2021-11-02 20:00:05' ]
      - [ 1, 5, '2021-11-02 20:00:05', '2021-11-02 20:00:10' ]
      - [ 0, 6, '2021-11-02 20:00:05', '2021-11-02 20:00:10' ]
