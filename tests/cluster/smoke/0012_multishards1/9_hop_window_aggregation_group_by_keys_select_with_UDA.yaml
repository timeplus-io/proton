tags:
  - multishards
  - append_only
  - substream
  - streaming_aggregation
  - window_aggregation
  - hop_window_aggregation
  - group_by
  - UDA
  - not_supported_hybrid # Substream aggregating does not support hybrid aggregator
description: hop window aggregation group by keys, select with UDA
cluster:
  - p1k1
  - p3k1
steps:
  - type: wait
    time: 1

  - type: query
    sql: 'drop view if exists test13_view2_1;'

  - type: wait
    time: 1

  - type: query
    sql: 'drop view if exists test13_view1_1;'

  - type: wait
    time: 1

  - type: query
    sql: 'drop stream if exists test13_subst_1;'

  - type: wait
    time: 1

  - type: query
    sql: 'create stream test13_subst_1(i float, k1 int, k2 string, timestamp datetime64(3) default now64(3)) settings shards=3;'

  - type: wait
    time: 1

  - name: '1309'
    type: stream
    query: |
      select k2,
             test_13_1_sec_large(i),
             window_start as s,
             window_end as e
      from hop(test13_subst_1, timestamp, 2s, 5s) partition by k2
      group by k2,
               window_start,
               window_end;
    schema:
      - name: k2
        type: string
      - name: test_13_1_sec_large(i)
        type: float32
      - name: s
        type: datetime64(3)
      - name: e
        type: datetime64(3)

  - type: wait
    time: 1

  - type: query
    sql: "insert into test13_subst_1(i, k1, k2, timestamp)
    values(0, 0, 'a', '2021-11-02 20:00:01');"

