tags:
  - system_command

description: |
  Tests covering the pause empty mv and resume mv scenario.
  Main steps:
  - create mv
  - system pause materialized view
  - insert data
  - system resume materialized view

cluster:
  - p3k1

steps:
  # create stream & create mv
  - type: query
    sql: drop view if exists test36_mv;
  - type: wait
    time: 1

  - type: query
    sql: drop stream if exists test36_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream test36_stream(id int, value string)
  - type: wait
    time: 1

  - type: query
    sql: create materialized view test36_mv as select to_string(id) as id, value from test36_stream
  - type: wait
    time: 2

  - name: system-command-4-1
    type: stream
    query: select id, value from test36_mv;
    schema:
      - name: id
        type: string
      - name: value
        type: string
  - type: wait
    time: 3

  # system pause mv
  - type: query
    sql: system pause materialized view test36_mv;
  - type: wait
    time: 3

  - type: query
    sql: insert into test36_stream(id, value) values 
    schema:
      - name: id
        type: int32
      - name: value
        type: string
    inputs:
      - [1, 'aaaa']
      - [2, 'bbbb']

  - type: check
    target_name: system-command-4-1
    expected_result: []

  # system resume mv
  - name: system-command-4-2
    type: stream
    query: select id, value from test36_mv;
    schema:
      - name: id
        type: string
      - name: value
        type: string
  - type: wait
    time: 3

  - type: query
    sql: system resume materialized view test36_mv;
  - type: wait
    time: 3

  - type: check
    target_name: system-command-4-2
    expected_result:
      - ['1', 'aaaa']
      - ['2', 'bbbb']

