description: test drop query of select_only user 

steps:
  - type: query
    user: proton
    password: proton@t+
    sql: DROP ROLE if exists select_only;

  - type: query
    user: proton
    password: proton@t+
    sql: DROP USER if exists user_select_only;

  - type: query
    user: proton
    password: proton@t+
    sql: DROP stream if exists test00_stream;

  - type: query
    user: proton
    password: proton@t+
    sql: DROP stream if exists test01_stream;

  - type: wait
    time: 1

  - type: query
    user: proton
    password: proton@t+
    sql: CREATE ROLE select_only;

  - type: query
    user: proton
    password: proton@t+
    sql: create user user_select_only identified with plaintext_password by 'password';

  - type: wait
    time: 1

  - type: query
    user: proton
    password: proton@t+
    sql: GRANT DROP ON *.* TO user_select_only;

  - type: query
    user: proton
    password: proton@t+
    sql: GRANT CREATE ON *.* TO user_select_only;

  - type: query
    user: proton
    password: proton@t+
    sql: grant select_only to user_select_only;

  - type: query
    user: user_select_only
    password: password
    sql: create stream test00_stream(i int, s string);

  - type: query
    user: proton
    password: proton@t+
    sql: create stream test01_stream(i int, s string);

  - type: wait
    time: 2

  - type: query
    user: user_select_only
    password: password
    sql: drop stream test00_stream;

  - type: wait
    time: 2

  - name: '108'
    type: stream
    query: show streams where name = 'test01_stream'
    schema:
      - name: name
        type: string

  - type: wait
    time: 1

  - type: check
    target_name: '108'
    expected_result:
      - [ 'test01_stream']
