description: test select query of select_only user 

steps:
  - type: query
    user: proton
    password: proton@t+
    sql: DROP ROLE if exists select_only;

  - type: query
    user: proton
    password: proton@t+
    sql: DROP USER if exists user_select_only;

  - type: query
    sql: DROP stream if exists test00_stream;

  - type: wait
    time: 1

  - type: query
    user: proton
    password: proton@t+
    sql: CREATE ROLE select_only;

  - type: query
    user: proton
    password: proton@t+
    sql: create user user_select_only identified with plaintext_password by 'password';

  - type: wait
    time: 1

  - type: query
    user: proton
    password: proton@t+
    sql: grant select ON default.* TO user_select_only;

  - type: query
    user: proton
    password: proton@t+
    sql: grant select_only to user_select_only;

  - type: query
    user: proton
    password: proton@t+
    sql: create stream test00_stream(i int, s string);

  - type: wait
    time: 1

  - name: '103'
    type: stream
    user: user_select_only
    password: password
    query: select i, s from test00_stream settings seek_to = 'earliest';
    schema:
      - name: i
        type: int32
      - name: s
        type: string
  - type: wait
    time: 2
  
  - type: query
    user: proton
    password: proton@t+
    sql: insert into test00_stream(i,s) values (1,'wby'), (2,'yr');

  - type: check
    target_name: '103'
    expected_result:
      - [1, 'wby']
      - [2, 'yr']
