tags:
  - versioned_kv_aggr
description: aggregation function min and max versioned_kv
cluster:
  - p1k1
  - p3k1
steps:
  - type: query
    node: 
      - p1
    sql: drop stream if exists test15_versioned_kv_stream
  - type: wait
    time: 2

  - type: query
    <<if eq .nodes "1">>
    node: [p1]
    <<else>>
    node: [p2]
    <<end>>
    sql: create stream test15_versioned_kv_stream(id int64, val float64) primary key id settings mode='versioned_kv'
  - type: wait
    time: 2

  - type: query
    <<if eq .nodes "1">>
    node: [p1]
    <<else>>
    node: [p3]
    <<end>>
    sql: insert into test15_versioned_kv_stream(id, val) values (1, 1), (2, 2), (3, 6)
    schema:
      - name: id
        type: int64
      - name: val
        type: float64
  - type: wait
    time: 2

  - name: "1506"
    type: stream
    node: 
      - p1
    query: select count(), min(val), max(val), sum(val), avg(val) from test15_versioned_kv_stream emit periodic 2s
    schema:
      - name: count()
        type: uint64
      - name: min(val)
        type: float64
      - name: max(val)
        type: float64
      - name: sum(val)
        type: float64
      - name: avg(val)
        type: float64

  - type: check
    target_name: "1506"
    expected_result:
      - - "3"
        - "1.0"
        - "6.0"
        - "9"
        - "3"

  - name: 1506-2
    type: stream
    query: select count_if(val > 2), min_if(val, val > 2), max_if(val, val > 2), sum_if(val, val > 2), avg_if(val, val > 2) from test15_versioned_kv_stream emit periodic 2s
    schema:
      - name: count_if(val > 2)
        type: uint64
      - name: min_if(val, val > 2)
        type: float64
      - name: max_if(val, val > 2)
        type: float64
      - name: sum_if(val, val > 2)
        type: float64
      - name: avg_if(val, val > 2)
        type: float64

  - type: check
    target_name: 1506-2
    expected_result:
      - - "1"
        - "6.0"
        - "6.0"
        - "6.0"
        - "6.0"

  - type: query
    sql: insert into test15_versioned_kv_stream(id, val) values (1, 3), (3, 4)
    schema:
      - name: id
        type: int64
      - name: val
        type: float64

  - type: check
    target_name: "1506"
    expected_result:
      - - "3"
        - "2.0"
        - "4.0"
        - "9"
        - "3"

  - type: check
    target_name: 1506-2
    expected_result:
      - - "2"
        - "3.0"
        - "4.0"
        - "7.0"
        - "3.5"
