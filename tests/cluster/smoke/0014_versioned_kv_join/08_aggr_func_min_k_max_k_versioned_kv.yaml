tags:
  - versioned_kv_aggr
description: aggregation function min_k max_k versioned_kv
cluster:
  - p1k1
  - p3k1
steps:
  - type: query
    node: 
      - p1
    sql: drop stream if exists test15_versioned_kv_stream
  - type: wait
    time: 1

  - type: query
    <<if eq .nodes "1">>
    node: [p1]
    <<else>>
    node: [p2]
    <<end>>
    sql: create stream test15_versioned_kv_stream(id int64, val int64) primary key id settings mode='versioned_kv'
  - type: wait
    time: 2

  - type: query
    <<if eq .nodes "1">>
    node: [p1]
    <<else>>
    node: [p3]
    <<end>>
    sql: insert into test15_versioned_kv_stream(id, val) values (1, 1), (2, 3), (3, 5)
    schema:
      - name: id
        type: int64
      - name: val
        type: int64
  - type: wait
    time: 1

  - name: "1509"
    type: stream
    node: 
      - p1
    query: select min_k(val, 3), max_k(val, 3), min_k(val, 2, id), max_k(val, 2, id) from test15_versioned_kv_stream emit periodic 1s
    schema:
      - name: min_k(val, 3)
        type: array(int64)
      - name: max_k(val, 3)
        type: array(int64)
      - name: min_k(val, 2, id)
        type: array(tuple(int64, int64))
      - name: max_k(val, 2, id)
        type: array(tuple(int64, int64))
  - type: wait
    time: 2

  - type: query
    <<if eq .nodes "1">>
    node: [p1]
    <<else>>
    node: [p3]
    <<end>>
    sql: insert into test15_versioned_kv_stream(id, val) values (1, 6), (2, 4), (3, 2)
    schema:
      - name: id
        type: int64
      - name: val
        type: int64

  - type: check
    target_name: "1509"
    expected_result:
      - - ["1", "3", "5"]
        - ["5", "3", "1"]
        - [["1", "1"], ["3", "2"]]
        - [["5", "3"], ["3", "2"]]
      - - ["2", "4", "6"]
        - ["6", "4", "2"]
        - [["2", "3"], ["4", "2"]]
        - [["6", "1"], ["4", "2"]]
