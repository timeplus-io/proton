tags:
  - partial_primary_key_join
description: append-only join versioned_kv with partial primary key join
cluster:
  - p1k1
  - p3k1
steps:
  - type: query
    node: 
      - p1
    sql: drop stream if exists test15_left_stream
  - type: wait
    time: 1
  
  - type: query
    <<if eq .nodes "1">>
    node: [p1]
    <<else>>
    node: [p2]
    <<end>>
    sql: drop stream if exists test15_vk_right_stream
  - type: wait
    time: 1
  
  - type: query
    <<if eq .nodes "1">>
    node: [p1]
    <<else>>
    node: [p3]
    <<end>>
    sql: create stream test15_left_stream (i1 int64, i2 int64, s string)
  - type: wait
    time: 1
  
  - type: query
    <<if eq .nodes "1">>
    node: [p1]
    <<else>>
    node: [p2]
    <<end>>
    sql: create stream test15_vk_right_stream (ii1 int64, ii2 int64, ss string) primary key (ii1, ii2) settings mode='versioned_kv'
  - type: wait
    time: 1
  
  - name: "1514"
    type: stream
    node: 
      - p1    
    query: select s, ss, ii2 from test15_left_stream inner join test15_vk_right_stream on i1 = ii1
    schema:
      - name: s
        type: string
      - name: ss
        type: string
      - name: ii2
        type: int64
  - type: wait
    time: 1
  
  - type: query
    <<if eq .nodes "1">>
    node: [p1]
    <<else>>
    node: [p3]
    <<end>>
    sql: insert into test15_vk_right_stream(ii1, ii2, ss) values (1, 1, 'ss11')
    schema:
      - name: ii1
        type: int64
      - name: ii2
        type: int64
      - name: ss
        type: string
  - type: wait
    time: 1
  
  - type: query
    <<if eq .nodes "1">>
    node: [p1]
    <<else>>
    node: [p2]
    <<end>>
    sql: insert into test15_left_stream(i1, i2, s) values (1, 1, 's11')
    schema:
      - name: i1
        type: int64
      - name: i2
        type: int64
      - name: s
        type: string
  
  - type: check
    target_name: "1514"
    expected_result:
      - - s11
        - ss11
        - 1

  - type: query
    node: 
      - p1
    sql: insert into test15_vk_right_stream(ii1, ii2, ss) values (1, 1, 'ss112')
    schema:
      - name: ii1
        type: int64
      - name: ii2
        type: int64
      - name: ss
        type: string
  - type: wait
    time: 1
  
  - type: query
    <<if eq .nodes "1">>
    node: [p1]
    <<else>>
    node: [p3]
    <<end>>
    sql: insert into test15_vk_right_stream(ii1, ii2, ss) values (1, 2, 'ss12')
    schema:
      - name: ii1
        type: int64
      - name: ii2
        type: int64
      - name: ss
        type: string
  - type: wait
    time: 1
  
  - type: query
    <<if eq .nodes "1">>
    node: [p1]
    <<else>>
    node: [p2]
    <<end>>
    sql: insert into test15_left_stream(i1, i2, s) values (1, 2, 's12')
    schema:
      - name: i1
        type: int64
      - name: i2
        type: int64
      - name: s
        type: string 

  - type: check
    target_name: "1514"
    expected_result:
      - - s12
        - ss112
        - 1
      - - s12
        - ss12
        - 2
