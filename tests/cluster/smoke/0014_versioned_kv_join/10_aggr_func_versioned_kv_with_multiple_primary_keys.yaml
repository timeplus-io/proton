tags:
  - versioned_kv_aggr
  - native_not_support
  - bug
description: versioned_kv with multiple primary keys
cluster:
  - p1k1
  - p3k1
steps:
  - type: query
    node: 
      - p1
    sql: drop stream if exists test15_versioned_kv_stream
  - type: wait
    time: 1

  - type: query
    <<if eq .nodes "1">>
    node: [p1]
    <<else>>
    node: [p2]
    <<end>>
    sql: create stream test15_versioned_kv_stream(id int, location string, val float) primary key (id, location) settings mode='versioned_kv'
    schema:
      - name: id
        type: int64
      - name: location
        type: string
      - name: val
        type: float64
  - type: wait
    time: 2

  - type: query
    <<if eq .nodes "1">>
    node: [p1]
    <<else>>
    node: [p3]
    <<end>>
    sql: insert into test15_versioned_kv_stream(id, location, val) values (1, 'a1', 11), (2, 'b1', 22), (3, 'c1', 33)
    schema:
      - name: id
        type: int64
      - name: location
        type: string
      - name: val
        type: float64
  - type: wait
    time: 1

  - name: "1511"
    node: 
      - p1
    type: stream
    query: select median(val), quantile(val, 0.5), top_k(id, 2), min_k(val, 2, id), max_k(val, 2, id) from test15_versioned_kv_stream emit periodic 2s
  - type: wait
    time: 1

  - type: query
    <<if eq .nodes "1">>
    node: [p1]
    <<else>>
    node: [p2]
    <<end>>
    sql: insert into test15_versioned_kv_stream(id, location, val) values (1, 'a2', 1), (2, 'b1', 44), (3, 'c2', 55)
    schema:
      - name: id
        type: int64
      - name: location
        type: string
      - name: val
        type: float64

  - type: check
    target_name: "1511"
    expected_result:
      - - "22"
        - "22"
        - "[(1, 1), (2, 1)]"
        - "[(11.0, 1), (22.0, 2)]"
        - "[(33.0, 3), (22.0, 2)]"
      - - "33"
        - "33"
        - "[(1, 2), (3, 2)]"
        - "[(1.0, 1), (11.0, 1)]"
        - "[(55.0, 3), (44.0, 2)]"
