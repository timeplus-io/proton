tags:
  - query_state
description: global aggregation with function count_if state checkpoint
cluster:
  - p1k1
steps:
  - type: query
    sql: drop stream if exists test19_state_stream

  - type: wait
    time: 1

  - type: query
    sql: create stream test19_state_stream (id string, location string, value float,
      timestamp datetime64(3) default now64(3))

  - type: wait
    time: 1

  - name: '1912'
    query_id: '1912'
    type: stream
    query: subscribe to select count_if(value > 58) as a from test19_state_stream emit periodic
      1s settings checkpoint_interval=1
    schema:
      - name: a
        type: uint64

  - type: wait
    time: 1

  - type: query
    sql: insert into test19_state_stream(id, location, value, timestamp) values ('dev1',
      'ca', 57.3, '2020-02-02 20:00:00'), ('dev1', 'ca', 66, '2020-02-02 20:00:01'),
      ('dev2', 'ca', 58.3, '2020-02-02 20:00:03')

  - type: wait
    time: 3

  - type: query
    sql: kill query where query_id = '1912'

  - type: wait
    time: 1

  - type: query
    sql: unsubscribe to '1912'

  - type: check
    target_name: '1912'
    expected_result:
      - [ '2' ]
