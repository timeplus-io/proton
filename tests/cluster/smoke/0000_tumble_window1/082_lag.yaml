tags:
  - functions
  - streaming functions
description: function lag
cluster:
  - p1k1
  - p3k1
steps:
  - type: stream
    name: '101'
    query: select value, lag(value) as prev_1, lag(value, 3, 0) as prev_3_0 from test_smoke1
    schema:
      - name: value
        type: float32
      - name: prev_1
        type: float32
      - name: prev_3_0
        type: float32
  - type: wait
    time: 1

  - type: query
    sql: insert into test_smoke1(id, location, value, json, timestamp) values
    schema:
      - name: id
        type: string
      - name: location
        type: string
      - name: value
        type: float32
      - name: json
        type: string
      - name: timestamp 
        type: datetime64(3)
    inputs:
      - ['dev1', 'ca', 1, '2021-11-02 20:00:01', '2020-02-02 20:00:01']
      - ['dev2', 'ca', 2, '2021-11-02 20:00:10', '2020-02-02 20:01:02']
      - ['dev2', 'ca', 3, '2021-11-02 20:00:10', '2020-02-02 20:00:02']
      - ['dev2', 'ca', 4, '2021-11-02 20:00:10', '2020-02-02 20:01:02']
      - ['dev3', 'ca', 5, '2021-11-02 20:00:10', '2020-02-02 20:01:03']

  - type: check
    target_name: '101'
    expected_result:
      - [1, 0, 0]
      - [2, 1, 0]
      - [3, 2, 0]
      - [4, 3, 1]
      - [5, 4, 2]
