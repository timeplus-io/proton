tags:
  - hopping window
  - aggr on continuous big integral columns
description: aggr on continuous big integral columns
cluster:
  - p1k1
  - p3k1
steps:
  - type: query
    sql: drop stream if exists test_hop_890;
  - type: wait
    time: 1

  - type: query
    sql: create stream test_hop_890(i128 int128, null_i128 nullable(int128), i64 int64, null_i64 nullable(int64), i32 int32, null_i32 nullable(int32), d datetime32);
  - type: wait
    time: 2

  - type: stream
    name: '890'
    query: select window_start, i128, count() as c FROM hop(test_hop_890, d, 1s, 2s) group by i128, window_start;
    schema:
      - name: window_start
        type: datetime
      - name: i128
        type: int128
      - name: c
        type: uint64

  - type: stream
    name: '891'
