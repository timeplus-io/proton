tags:
  - seek to
  - to reproduce
  - native_not_support
description: stream seek to ago interval
cluster:
  - p1k1
  - p3k1
steps:
  - type: wait
    time: 1

  - type: query
    sql: insert into test_smoke1(id, location, value, json, timestamp) values
    schema:
      - name: id
        type: string
      - name: location
        type: string
      - name: value
        type: float32
      - name: json
        type: string
      - name: timestamp 
        type: datetime64(3)
    inputs:
      - ['dev1', 'ca', 60, '{"create_time":"2021-11-02 20:00:01"}', '2021-11-02 20:00:01']
      - ['dev1', 'ca', 66, '{"create_time":"2021-11-02 20:00:03"}', '2021-11-02 20:00:03']
      - ['dev2', 'ca', 30, '{"create_time":"2021-11-02 20:00:02"}', '2021-11-02 20:00:02']

  - type: wait
    time: 10

  - type: query
    sql: insert into test_smoke1(id, location, value, json, timestamp) values
    schema:
      - name: id
        type: string
      - name: location
        type: string
      - name: value
        type: float32
      - name: json
        type: string
      - name: timestamp 
        type: datetime64(3)
    inputs:
      - ['dev2', 'ca', 68, '{"create_time":"2021-11-02 20:00:04"}', '2021-11-02 20:00:04']
      - ['dev8', 'ca', 67, '{"create_time":"2021-11-02 20:00:05"}', '2021-11-02 20:00:05']
      - ['dev8', 'ca', 77, '{"create_time":"2021-11-02 20:00:06"}', '2021-11-02 20:00:06']

  - type: stream
    name: '101'
    query: select id, value from test_smoke1 settings seek_to='-5s'
    schema:
      - name: id
        type: string
      - name: value
        type: float32

  - type: check
    target_name: '101'
    expected_result:
      - ['dev2', 68]
      - ['dev8', 67]
      - ['dev8', 77]
