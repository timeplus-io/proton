tags:
  - subquery
  
description: tumble on top of subquery stream seek_to = 'earliest', tranform function in subquery and run tumble on the subquery
cluster:
  - p1k1
  - p3k1
steps:
  - type: query
    sql: drop view if exists test_smoke1_join_v;
  - type: wait
    time: 1

  - type: query
    sql: drop stream if exists test_smoke1;
  - type: wait
    time: 1

  - type: query
    sql: create stream test_smoke1(id string, location string, value float32, json string, timestamp datetime64(3) DEFAULT now64(3))
  - type: wait
    time: 2

  - type: stream
    name: '101'
    query: with transformed as (select id, value, to_datetime(json_extract_string(json, 'create_time')) as tranformed_timestamp from test_smoke1 settings seek_to='earliest') select id, max(value), window_start, window_end from tumble(transformed, tranformed_timestamp, interval 5 second) group by id, window_start, window_end
    schema:
      - name: id
        type: string
      - name: max(value)
        type: float32
      - name: window_start
        type: datetime
      - name: window_end
        type: datetime
  - type: wait
    time: 1

  - type: query
    sql: insert into test_smoke1(id, location, value, json, timestamp) values
    schema:
      - name: id
        type: string
      - name: location
        type: string
      - name: value
        type: float32
      - name: json
        type: string
      - name: timestamp 
        type: datetime64(3)
    inputs:
      - ['dev1', 'ca', 60, '{"create_time":"2021-11-02 20:00:01"}', '2020-02-02 20:01:00']
      - ['dev2', 'ca', 66, '{"create_time":"2021-11-02 20:00:03"}', '2020-02-02 20:01:01']
      - ['dev2', 'ca', 58.3, '{"create_time":"2021-11-02 20:00:02"}', '2020-02-02 20:01:03']

  - type: query
    sql: insert into test_smoke1(id, location, value, json, timestamp) values
    schema:
      - name: id
        type: string
      - name: location
        type: string
      - name: value
        type: float32
      - name: json
        type: string
      - name: timestamp 
        type: datetime64(3)
    inputs:
      - ['dev1', 'ca', 59, '{"create_time":"2021-11-02 20:00:04"}', '2020-02-02 20:01:06']
      - ['dev8', 'ca', 67, '{"create_time":"2021-11-02 20:00:05"}', '2020-02-02 20:01:07']
      - ['dev8', 'ca', 77, '{"create_time":"2021-11-02 20:00:06"}', '2020-02-02 20:01:10']

  - type: query
    sql: insert into test_smoke1(id, location, value, json, timestamp) values
    schema:
      - name: id
        type: string
      - name: location
        type: string
      - name: value
        type: float32
      - name: json
        type: string
      - name: timestamp 
        type: datetime64(3)
    inputs:
      - ['dev3', 'ca', 57.3, '{"create_time":"2021-11-02 20:00:09"}', '2020-02-02 20:01:11']
      - ['dev3', 'ca', 66, '{"create_time":"2021-11-02 20:00:08"}', '2020-02-02 20:01:14']
      - ['dev4', 'ca', 76, '{"create_time":"2021-11-02 20:00:07"}', '2020-02-02 20:01:11']

  - type: query
    sql: insert into test_smoke1(id, location, value, json, timestamp) values
    schema:
      - name: id
        type: string
      - name: location
        type: string
      - name: value
        type: float32
      - name: json
        type: string
      - name: timestamp 
        type: datetime64(3)
    inputs:
      - ['dev3', 'ca', 80, '{"create_time":"2021-11-02 20:00:09"}', '2020-02-02 20:01:13']
      - ['dev4', 'ca', 67, '{"create_time":"2021-11-02 20:00:01"}', '2020-02-02 20:01:12']
