  - type: check
    target_name: '101'
    mode: random
    expected_result:
      - ['dev1', 60, '2021-11-02 20:00:00', '2021-11-02 20:00:05']
      - ['dev2', 66, '2021-11-02 20:00:00', '2021-11-02 20:00:05']
