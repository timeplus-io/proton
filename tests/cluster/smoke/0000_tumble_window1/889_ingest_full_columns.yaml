tags:
  - input
  - sample
description: ingest data into test_smoke1 w/full columes and values
cluster:
  - p1k1
  - p3k1
steps:
  - type: query
    sql: drop view if exists test_smoke1_join_v;
  - type: wait
    time: 1

  - type: query
    sql: drop stream if exists test_smoke1;
  - type: wait
    time: 1

  - type: query
    sql: create stream test_smoke1(id string, location string, value float32, json string, timestamp datetime64(3) DEFAULT now64(3))
  - type: wait
    time: 2

  - type: query
    sql: insert into test_smoke1(id, location, value, json, timestamp) values
    schema:
      - name: id
        type: string
      - name: location
        type: string
      - name: value
        type: float32
      - name: json
        type: string
      - name: timestamp 
        type: datetime64(3)
    inputs:
      - ['dev1', 'ca', 370, 'jsonstring', '1999-01-01 11:11:11']

  - type: query
    sql: insert into test_smoke1(id, location, value, json, timestamp) values
    schema:
      - name: id
        type: string
      - name: location
        type: string
      - name: value
        type: float32
      - name: json
        type: string
      - name: timestamp 
        type: datetime64(3)
    inputs:
      - ['dev2', 'ca', 380, 'jsonstring', '1999-01-01 11:11:11']

  - type: wait
    time: 5

  - type: stream
    name: '101'
    query: select id, location, value, json, timestamp from table(test_smoke1)
    schema:
      - name: id
        type: string
      - name: location
        type: string
      - name: value
        type: float32
      - name: json
        type: string
      - name: timestamp 
        type: datetime64(3)

  - type: check
    target_name: '101'
    mode: random
    expected_result:
      - ['dev1', 'ca', 370, 'jsonstring', '1999-01-01 11:11:11']
      - ['dev2', 'ca', 380, 'jsonstring', '1999-01-01 11:11:11']
