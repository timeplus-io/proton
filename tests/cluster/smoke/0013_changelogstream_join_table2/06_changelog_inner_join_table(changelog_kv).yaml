tags:
  - changelog
  - table(changelog_kv)
  - left join
description: changelog inner join table(changelog_kv)
cluster:
  - p1k1
  - p3k1
steps:
  - type: query
    sql: drop stream if exists test14_stream_2;
  - type: wait
    time: 1

  - type: query
    sql: drop stream if exists test14_table_2;
  - type: wait
    time: 1

  - type: query
    sql:
      create stream test14_stream_2(i int64, j int64, k string) settings
      mode='changelog';
  - type: wait
    time: 1

  - type: query
    sql: create stream test14_table_2(ii int64, jj int64, kk string);
  - type: wait
    time: 2

  - type: query
    sql: insert into test14_table_2(ii, jj, kk) values(1, 2, 'a');
    schema:
      - name: ii
        type: int64
      - name: jj
        type: int64
      - name: kk
        type: string
  - type: wait
    time: 1

  - type: query
    sql: insert into test14_table_2(ii, jj, kk) values(1, 3, 'b');
    schema:
      - name: ii
        type: int64
      - name: jj
        type: int64
      - name: kk
        type: string
  - type: wait
    time: 1

  - type: query
    sql: insert into test14_table_2(ii, jj, kk) values(5, 2, 'c');
    schema:
      - name: ii
        type: int64
      - name: jj
        type: int64
      - name: kk
        type: string
  - type: wait
    time: 1

  - type: query
    sql: insert into test14_table_2(ii, jj, kk) values(2, 7, 'h');
    schema:
      - name: ii
        type: int64
      - name: jj
        type: int64
      - name: kk
        type: string
  - type: wait
    time: 3

  - name: "14129"
    type: stream
    query:
      select i, j, k, ii, jj, kk, _tp_delta from test14_stream_2 as a left join
      table(test14_table_2) as b on a.j = b.jj;
    schema:
      - name: i
        type: int64
      - name: j
        type: int64
      - name: k
        type: string
      - name: ii
        type: int64
      - name: jj
        type: int64
      - name: kk
        type: string
      - name: _tp_delta
        type: int8
  - type: wait
    time: 1

  - type: query
    sql: insert into test14_stream_2(i, j, k) values(1, 2, 'a');
    schema:
      - name: i
        type: int64
      - name: j
        type: int64
      - name: k
        type: string

  - type: check
    target_name: "14129"
    mode: random
    expected_result:
      - - "1"
        - "2"
        - a
        - "5"
        - "2"
        - c
        - "1"
      - - "1"
        - "2"
        - a
        - "1"
        - "2"
        - a
        - "1"

  - type: query
    sql: insert into test14_stream_2(i, j, k) values(1, 3, 'a');
    schema:
      - name: i
        type: int64
      - name: j
        type: int64
      - name: k
        type: string

  - type: check
    target_name: "14129"
    expected_result:
      - - "1"
        - "3"
        - a
        - "1"
        - "3"
        - b
        - "1"

  - type: query
    sql: insert into test14_stream_2(i, j, k, _tp_delta) values(1, 2, 'a', -1);
    schema:
      - name: i
        type: int64
      - name: j
        type: int64
      - name: k
        type: string
      - name: _tp_delta
        type: int8

  - type: check
    target_name: "14129"
    mode: random
    expected_result:
      - - "1"
        - "2"
        - a
        - "5"
        - "2"
        - c
        - "-1"
      - - "1"
        - "2"
        - a
        - "1"
        - "2"
        - a
        - "-1"

  - type: query
    sql: insert into test14_stream_2(i, j, k) values(1, 5, 'a');
    schema:
      - name: i
        type: int64
      - name: j
        type: int64
      - name: k
        type: string

  - type: check
    target_name: "14129"
    expected_result:
      - - "1"
        - "5"
        - a
        - "0"
        - "0"
        - ""
        - "1"
