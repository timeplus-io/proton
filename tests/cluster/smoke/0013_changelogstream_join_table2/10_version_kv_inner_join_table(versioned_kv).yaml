tags:
  - version_kv
  - table(versioned_kv)
  - left join
description: version_kv inner join table(versioned_kv)
cluster:
  - p1k1
  - p3k1
steps:
  - type: query
    sql: drop stream if exists test14_stream_2;
  - type: wait
    time: 1

  - type: query
    sql: drop stream if exists test14_table_2;
  - type: wait
    time: 1

  - type: query
    sql:
      create stream test14_stream_2(i int64, j int64, k string) primary
      key j settings mode='versioned_kv';
  - type: wait
    time: 1

  - type: query
    sql:
      create stream test14_table_2(ii int64, jj int64, kk string) primary
      key jj settings mode='versioned_kv';
  - type: wait
    time: 2
  
  - type: query
    sql: insert into test14_table_2(ii, jj, kk) values(1, 2, 'a');
    schema:
      - name: ii
        type: int64
      - name: jj
        type: int64
      - name: kk
        type: string
  - type: wait
    time: 1
  
  - type: query
    sql: insert into test14_table_2(ii, jj, kk) values(2, 7, 'h');
    schema:
      - name: ii
        type: int64
      - name: jj
        type: int64
      - name: kk
        type: string
  - type: wait
    time: 1
  
  - type: query
    sql: insert into test14_table_2(ii, jj, kk) values(4, 2, 'a');
    schema:
      - name: ii
        type: int64
      - name: jj
        type: int64
      - name: kk
        type: string
  - type: wait
    time: 3
  
  - name: "14133"
    type: stream
    query:
      select i, j, k, ii, jj, kk from test14_stream_2 as a left join
      table(test14_table_2) as b on a.j = b.jj;
    schema:
      - name: i
        type: int64
      - name: j
        type: int64
      - name: k
        type: string
      - name: ii
        type: int64
      - name: jj
        type: int64
      - name: kk
        type: string
  - type: wait
    time: 1
  
  - type: query
    sql: insert into test14_stream_2(i, j, k) values(1, 2, 'a');
    schema:
      - name: i
        type: int64
      - name: j
        type: int64
      - name: k
        type: string
  
  - type: check
    target_name: "14133"
    expected_result:
      - - "1"
        - "2"
        - a
        - "4"
        - "2"
        - a

  - type: query
    sql: insert into test14_stream_2(i, j, k) values(1, 3, 'a');
    schema:
      - name: i
        type: int64
      - name: j
        type: int64
      - name: k
        type: string
 
  - type: check
    target_name: "14133"
    expected_result:
      - - "1"
        - "3"
        - a
        - "0"
        - "0"
        - ""

  - type: query
    sql: insert into test14_stream_2(i, j, k) values(1, 7, 'a');
    schema:
      - name: i
        type: int64
      - name: j
        type: int64
      - name: k
        type: string
 
  - type: check
    target_name: "14133"
    expected_result:
      - - "1"
        - "7"
        - a
        - "2"
        - "7"
        - h

  - type: query
    sql: insert into test14_stream_2(i, j, k) values(4, 2, 'b');
    schema:
      - name: i
        type: int64
      - name: j
        type: int64
      - name: k
        type: string

  - type: check
    target_name: "14133"
    mode: random
    expected_result:
      - - "4"
        - "2"
        - b
        - "4"
        - "2"
        - a
