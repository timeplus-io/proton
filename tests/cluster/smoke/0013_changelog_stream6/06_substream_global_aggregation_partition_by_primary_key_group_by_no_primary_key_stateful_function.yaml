tags:
  - subquery/view/materialized_view/
  - tumble(table)
  - group_by
  - primary_key
  - substream
  - not_supported_hybrid # Substream aggregating does not support hybrid aggregator

description: substream global aggregation partition by primary key, group by no primary key, stateful function

cluster:
  - p1k1
  - p3k1

steps:
  - type: query
    sql: create stream test14_substream_6(val float, id int, name string);
  - type: wait
    time: 2

  - name: "1430"
    type: stream
    query: |
      select max(val), min(val), avg(val), name from changelog(test14_substream_6, id)
      partition by id group by name emit periodic 1s;
    schema:
      - name: max(val)
        type: float32
      - name: min(val)
        type: float32
      - name: avg(val)
        type: float64
      - name: name
        type: string
  - type: wait
    time: 2

  - type: query
    sql: insert into test14_substream_6(val, id, name) values (1, 2, 'a');
  - type: wait
    time: 1

  - type: query
    sql: insert into test14_substream_6(val, id, name) values (3, 3, 'b');
  - type: wait
    time: 1

  - type: query
    sql: insert into test14_substream_6(val, id, name) values (5, 1, 'c');
  - type: wait
    time: 1

  - type: query
    sql: insert into test14_substream_6(val, id, name) values (8, 2, 'a');
  - type: wait
    time: 1

  - type: query
    sql: insert into test14_substream_6(val, id, name) values (9, 3, 'b');
  - type: wait
    time: 1

  - type: query
    sql: insert into test14_substream_6(val, id, name) values (11, 2, 'b');
  - type: wait
    time: 1

  - type: query
    sql: insert into test14_substream_6(val, id, name) values (10, 1, 'c');
  - type: wait
    time: 1

  - type: query
    sql: insert into test14_substream_6(val, id, name) values (14, 2, 'b');
  - type: wait
    time: 1

  - type: check
    target_name: "1430"
    mode: random
    expected_result:
      - [1, 1, 1, a]
      - [3, 3, 3, b]
      - [5, 5, 5, c]
      - [8, 8, 8, a]
      - [9, 9, 9, b]
      - [0, 0, NaN, a]
      - [11, 11, 11, b]
      - [10, 10, 10, c]
      - [0, 0, NaN, a]
      - [14, 14, 14, b]
