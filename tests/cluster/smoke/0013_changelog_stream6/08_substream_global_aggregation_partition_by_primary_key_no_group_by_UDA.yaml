description: substream global aggregation partition by primary key, no group by, UDA

cluster:
  - p1k1
  - p3k1

steps:
  - type: query
    sql: create stream test14_substream_6(val float, id int, name string);
  - type: wait
    time: 2

  - name: "1432"
    type: stream
    query: select (val), id, _tp_delta from changelog(test14_substream_6, id) partition by id;
    schema:
      - name: val
        type: float32
      - name: id
        type: int32
      - name: _tp_delta
        type: int8
  - type: wait
    time: 2

  - type: query
    sql: insert into test14_substream_6(val, id, name) values (1, 2, 'a');

  - type: wait
    time: 1

  - type: query
    sql: insert into test14_substream_6(val, id, name) values (3, 3, 'b');

  - type: wait
    time: 1

  - type: query
    sql: insert into test14_substream_6(val, id, name) values (5, 1, 'c');

  - type: wait
    time: 1

  - type: query
    sql: insert into test14_substream_6(val, id, name) values (8, 2, 'a');

  - type: wait
    time: 1

  - type: query
    sql: insert into test14_substream_6(val, id, name) values (9, 3, 'b');

  - type: wait
    time: 1

  - type: query
    sql: insert into test14_substream_6(val, id, name) values (11, 2, 'b');

  - type: wait
    time: 1

  - type: query
    sql: insert into test14_substream_6(val, id, name) values (10, 1, 'c');

  - type: wait
    time: 1

  - type: query
    sql: insert into test14_substream_6(val, id, name) values (14, 2, 'b');

  - type: check
    target_name: "1432"
    expected_result:
      - [1, 2, 1]
      - [3, 3, 1]
      - [5, 1, 1]
      - [1, 2, -1]
      - [8, 2, 1]
      - [3, 3, -1]
      - [9, 3, 1]
      - [8, 2, -1]
      - [11, 2, 1]
      - [5, 1, -1]
      - [10, 1, 1]
      - [11, 2, -1]
      - [14, 2, 1]