tags:
  - subquery/view/materialized_view/
  - tumble(table)
  - group_by
  - primary_key
  - substream
  - to_support
  - not_supported_hybrid # Substream aggregating does not support hybrid aggregator

description: substream global aggregation partition by primary key, group by primary key, UDA (unrealized)

cluster:
  - p1k1
  - p3k1

steps:
  - type: query
    sql: |
      CREATE OR REPLACE AGGREGATE FUNCTION test_14_6_sec_large(value float32) RETURNS float32 LANGUAGE JAVASCRIPT AS $$
        {
          initialize: function() { 
            this.max = -1.0;
            this.sec = -1.0;
          },

          process: function(values) {
            for(let i=0; i<values.length; i++) {
              if(values[i] > this.max) {
                this.sec = this.max;
                this.max = values[i];
              }
              if(values[i] < this.max && values[i] > this.sec)
                this.sec = values[i];
            }
          },

          finalize: function() {
            return this.sec;
          },

          serialize: function() {
            let s = {"max": this.max, "sec":this.sec };
            return JSON.stringify(s);
          },

          deserialize: function(state_str) {
            let s = JSON.parse(state_str);
            this.max = s["max"];
            this.sec = s["sec"];
          },

          merge: function(state_str) {
            let s = JSON.parse(state_str);
            if (s["sec"] >= this.max) {
              this.max = s["max"];
              this.sec = s["sec"];
            } else if (s["max"] >= this.max) {
              this.sec = this.max;
              this.max = s["max"];
            } else if (s["max"] > this.sec) {
              this.sec = s["max"];
            }
          }
        }
      $$;

  - type: wait
    time: 1

  - type: query
    sql: create stream test14_substream_6(val float, id int, name string);
  - type: wait
    time: 2

  - name: "1429"
    type: stream
    query: select test_14_6_sec_large(val), name from changelog(test14_substream_6, id) partition by id group by name;
    schema:
      - name: test_14_6_sec_large(val)
        type: float32
      - name: name
        type: string
  - type: wait
    time: 2

  - type: query
    sql: insert into test14_substream_6(val, id, name) values (1, 2, 'a');

  - type: wait
    time: 1

  - type: query
    sql: insert into test14_substream_6(val, id, name) values (3, 3, 'b');

  - type: wait
    time: 1

  - type: query
    sql: insert into test14_substream_6(val, id, name) values (5, 1, 'c');

  - type: wait
    time: 1

  - type: query
    sql: insert into test14_substream_6(val, id, name) values (8, 2, 'a');

  - type: wait
    time: 1

  - type: query
    sql: insert into test14_substream_6(val, id, name) values (9, 3, 'b');

  - type: wait
    time: 1

  - type: query
    sql: insert into test14_substream_6(val, id, name) values (11, 2, 'b');

  - type: wait
    time: 1

  - type: query
    sql: insert into test14_substream_6(val, id, name) values (10, 1, 'c');

  - type: wait
    time: 1

  - type: query
    sql: insert into test14_substream_6(val, id, name) values (14, 2, 'b');

  - type: check
    target_name: "1429"
    mode: random
    expected_result:
      - [-1, 'a']
      - [-1, 'b']
      - [-1, 'c']
      - [1, 'a']
      - [3, 'b']
      - [-1, 'b']
      - [1, 'a']
      - [5, 'c']
      - [11, 'b']
      - [1, 'a']
