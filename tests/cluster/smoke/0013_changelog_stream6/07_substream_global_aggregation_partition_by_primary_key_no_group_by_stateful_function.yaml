tags:
  - subquery/view/materialized_view/
  - tumble(table)
  - group_by
  - primary_key

description: substream global aggregation partition by primary key, no group by,stateful function

cluster:
  - p1k1
  - p3k1

steps:
  - type: query
    sql: create stream test14_substream_6(val float, id int, name string);
  - type: wait
    time: 2

  - name: "1431"
    type: stream
    query: |
      select lag(val, 1), val, id, name, _tp_delta from changelog(test14_substream_6, id)
      partition by id;
    schema:
      - name: lag(val, 1)
        type: float32
      - name: val
        type: float32
      - name: id
        type: int32
      - name: name
        type: string
      - name: _tp_delta
        type: int8
  - type: wait
    time: 2

  - type: query
    sql: insert into test14_substream_6(val, id, name) values (1, 2, 'a');

  - type: query
    sql: insert into test14_substream_6(val, id, name) values (3, 3, 'b');

  - type: query
    sql: insert into test14_substream_6(val, id, name) values (5, 1, 'c');

  - type: query
    sql: insert into test14_substream_6(val, id, name) values (8, 2, 'a');

  - type: query
    sql: insert into test14_substream_6(val, id, name) values (9, 3, 'b');

  - type: query
    sql: insert into test14_substream_6(val, id, name) values (11, 2, 'b');

  - type: query
    sql: insert into test14_substream_6(val, id, name) values (10, 1, 'c');

  - type: query
    sql: insert into test14_substream_6(val, id, name) values (14, 2, 'b');

  - type: check
    target_name: "1431"
    expected_result:
      - [0, 1, 2, a, 1]
      - [0, 3, 3, b, 1]
      - [0, 5, 1, c, 1]
      - [1, 1, 2, a, -1]
      - [1, 8, 2, a, 1]
      - [3, 3, 3, b, -1]
      - [3, 9, 3, b, 1]
      - [8, 8, 2, a, -1]
      - [8, 11, 2, b, 1]
      - [5, 5, 1, c, -1]
      - [5, 10, 1, c, 1]
      - [11, 11, 2, b, -1]
      - [11, 14, 2, b, 1]
