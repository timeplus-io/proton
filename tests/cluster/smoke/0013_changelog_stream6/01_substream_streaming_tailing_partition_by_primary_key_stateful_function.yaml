tags:
  - subquery/view/materialized_view/
  - tumble(table)
  - group_by
  - primary_key

description: substream streaming tailing partition by primary key, stateful function

cluster:
  - p1k1
  - p3k1

steps:
  - type: query
    sql: create stream test14_substream_6(val int, id int, name string);
  - type: wait
    time: 2

  - name: "1425"
    type: stream
    query: select val, id, lag(val, 2), _tp_delta from changelog(test14_substream_6, id) partition by id;
    schema:
      - name: val
        type: int32
      - name: id
        type: int32
      - name: lag(val, 2)
        type: int32
      - name: _tp_delta
        type: int8
  - type: wait
    time: 2

  - type: query
    sql: insert into test14_substream_6(val, id, name) values (1, 2, 'a');

  - type: query
    sql: insert into test14_substream_6(val, id, name) values (3, 3, 'b');

  - type: query
    sql: insert into test14_substream_6(val, id, name) values (5, 1, 'c');

  - type: query
    sql: insert into test14_substream_6(val, id, name) values (8, 2, 'a');

  - type: query
    sql: insert into test14_substream_6(val, id, name) values (9, 3, 'b');

  - type: query
    sql: insert into test14_substream_6(val, id, name) values (11, 2, 'b');

  - type: query
    sql: insert into test14_substream_6(val, id, name) values (10, 1, 'c');

  - type: query
    sql: insert into test14_substream_6(val, id, name) values (14, 2, 'b');

  - type: check
    target_name: "1425"
    expected_result:
      - [1, 2, 0, 1]
      - [3, 3, 0, 1]
      - [5, 1, 0, 1]
      - [1, 2, 0, -1]
      - [8, 2, 1, 1]
      - [3, 3, 0, -1]
      - [9, 3, 3, 1]
      - [8, 2, 1, -1]
      - [11, 2, 8, 1]
      - [5, 1, 0, -1]
      - [10, 1, 5, 1]
      - [11, 2, 8, -1]
      - [14, 2, 11, 1]
