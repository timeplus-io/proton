tags:
  - stream_join_stream
  - not_supported
description: stream to stream left join globally
cluster:
  - p1k1
  - p3k1
steps:
  - name: 1043-1
    type: stream
    query: select s, ss from test10_left_stream1 left join test10_right_stream1 on i=ii
    schema:
      - name: s
        type: string
      - name: ss
        type: string

  - type: wait
    time: 1

  - type: query
    sql: insert into test10_left_stream1(i, s, ts) values (1, 's', '2022-05-23 15:45:10')

  - type: query
    sql: insert into test10_right_stream1(ii, ss, tts) values(1, 's1', '2022-05-23 15:44:59'),(1,
      's2', '2022-05-23 15:45:00'),(1, 's3', '2022-05-23 15:45:09')

  - type: query
    sql: insert into test10_left_stream1(i, s, ts) values (2, 'ss', '2022-05-23 15:45:10')

  - type: check
    target_name: 1043-1
    expected_result:
      - [ s, '' ]
      - [ s, s1 ]
      - [ s, s2 ]
      - [ s, s3 ]
      - [ ss, '' ]
