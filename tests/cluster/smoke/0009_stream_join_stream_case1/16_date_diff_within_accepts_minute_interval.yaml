tags:
  - stream_join_stream
description: date_diff_within-accepts-minute-interval
cluster:
  - p1k1
  - p3k1
steps:
  - type: query
    sql: drop stream if exists test10_left_stream1

  - type: query
    sql: drop stream if exists test10_right_stream1

  - type: wait
    time: 2

  - type: query
    sql: create stream test10_left_stream1 (i int, s string, ts datetime)

  - type: query
    sql: create stream test10_right_stream1 (ii int, ss string, tts datetime)

  - type: wait
    time: 2

  - name: 1039-1
    type: stream
    query: select s, ss from test10_left_stream1 inner join test10_right_stream1 on
      i=ii and date_diff_within(1m, ts, tts)
    schema:
      - name: s
        type: string
      - name: ss
        type: string

  - type: wait
    time: 2

  - type: query
    sql: insert into test10_left_stream1(i, s, ts) values (1, 's', '2022-05-23 15:45:10')

  - type: query
    sql: insert into test10_right_stream1(ii, ss, tts) values(1, 's1', '2022-05-23 15:44:59'),(1,
      's2', '2022-05-23 15:45:00'),(1, 's3', '2022-05-23 15:45:09'),(1, 's4', '2022-05-23
      15:45:10'),(1, 's5', '2022-05-23 15:45:15'),(1, 's6', '2022-05-23 15:45:19'),(1,
      's7', '2022-05-23 15:45:20'),(1, 's8', '2022-05-23 15:45:21')

  - type: check
    target_name: 1039-1
    expected_result:
      - [ s, s1 ]
      - [ s, s2 ]
      - [ s, s3 ]
      - [ s, s4 ]
      - [ s, s5 ]
      - [ s, s6 ]
      - [ s, s7 ]
      - [ s, s8 ]
