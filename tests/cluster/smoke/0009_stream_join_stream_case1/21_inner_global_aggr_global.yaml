tags:
  - stream_join_stream
description: stream to stream left join globally and then do global aggr
cluster:
  - p1k1
  - p3k1
steps:
  - name: 1044-1
    type: stream
    query: select count() as c from test10_left_stream1 inner join test10_right_stream1
      on i=ii emit periodic 1s
    schema:
      - name: c
        type: uint64

  - type: wait
    time: 1

  - type: query
    sql: insert into test10_right_stream1(ii, ss, tts) values(1, 's1', '2022-05-23 15:44:59'),(1,
      's2', '2022-05-23 15:45:00'),(1, 's3', '2022-05-23 15:45:09')

  - type: query
    sql: insert into test10_left_stream1(i, s, ts) values (1, 's', '2022-05-23 15:45:10')

  - type: check
    target_name: 1044-1
    expected_result:
      - [ 3 ]
