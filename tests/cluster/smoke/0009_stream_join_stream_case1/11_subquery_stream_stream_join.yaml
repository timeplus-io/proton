tags:
  - stream_join_stream
description: subquery in stream to stream join
cluster:
  - p1k1
  - p3k1
steps:
  - type: wait
    time: 1

  - name: 1034-1
    type: stream
    query: select s, ss from (select * from test10_left_stream1) as test10_left_stream1
      inner join (select * from test10_right_stream1) as test10_right_stream1 on i=ii
      and date_diff_within(10s, ts, tts)
    schema:
      - name: s
        type: string
      - name: ss
        type: string

  - type: wait
    time: 3

  - type: query
    sql: insert into test10_left_stream1(i, s, ts) values (1, 's', '2022-05-23 15:45:10')

  - type: query
    sql: insert into test10_right_stream1(ii, ss, tts) values(1, 's1', '2022-05-23 15:44:59'),(1,
      's2', '2022-05-23 15:45:00'),(1, 's3', '2022-05-23 15:45:09'),(1, 's4', '2022-05-23
      15:45:10'),(1, 's5', '2022-05-23 15:45:15'),(1, 's6', '2022-05-23 15:45:19'),(1,
      's7', '2022-05-23 15:45:20'),(1, 's8', '2022-05-23 15:45:21')

  - type: check
    target_name: 1034-1
    expected_result:
      - [ s, s2 ]
      - [ s, s3 ]
      - [ s, s4 ]
      - [ s, s5 ]
      - [ s, s6 ]
      - [ s, s7 ]
