tags:
  - stream_join_stream
  - cluster_table_bug
description: historical asof join shall work
cluster:
  - p1k1
  - p3k1
steps:
  - type: query
    sql: drop stream if exists test10_left_stream1

  - type: query
    sql: drop stream if exists test10_right_stream1

  - type: wait
    time: 2

  - type: query
    sql: create stream test10_left_stream1 (i int, s string, ts datetime)

  - type: query
    sql: create stream test10_right_stream1 (ii int, ss string, tts datetime)

  - type: wait
    time: 3

  - type: query
    sql: insert into test10_left_stream1(i, s, ts) values (1, 's', '2022-05-23 15:45:10'),
      (2, 's', '2022-05-23 15:46:10')

  - type: wait
    time: 1

  - type: query
    sql: insert into test10_right_stream1(ii, ss, tts) values(1, 's1', '2022-05-23 15:45:09'),(1,
      's2', '2022-05-23 15:45:10'),(1, 's3', '2022-05-23 15:45:11'),(1, 's4', '2022-05-23
      15:45:12'),(1, 's5', '2022-05-23 15:45:13'),(2, 's6', '2022-05-23 15:46:09'),(2,
      's7', '2022-05-23 15:46:10'),(2, 's8', '2022-05-23 15:46:11'),(2, 's9', '2022-05-23
      15:46:18'),(2, 's10', '2022-05-23 15:46:19')

  - type: wait
    time: 5

  - name: 1030-1
    type: stream
    query: select s, ss from table(test10_left_stream1) as test10_left_stream1 asof
      join table(test10_right_stream1) as test10_right_stream1 on i=ii and tts > ts
    schema:
      - name: s
        type: string
      - name: ss
        type: string

  - type: check
    target_name: 1030-1
    expected_result:
      - [ s, s3 ]
      - [ s, s8 ]
