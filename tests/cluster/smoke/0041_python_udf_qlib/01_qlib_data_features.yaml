  - skip # (#7908) Code: 2624. DB::Exception: Received from localhost:8463. DB::Exception: UDF running error, detail message: 'ParallelExt' object has no attribute '_backend_args'

description: |
  Test covering udf qlib data retrieval to load features with filter

steps:
  - type: query
    sql: drop stream if exists udf_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream udf_stream (value string);
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_qlib_data_features(value string) RETURNS array(array(float32)) LANGUAGE PYTHON AS
      $$
      import qlib
      from qlib.constant import REG_CN
      from qlib.data import D
      from qlib.data.filter import NameDFilter, ExpressionDFilter

      provider_uri = '/var/lib/proton/.qlib/qlib_data/cn_data'
      qlib.init(provider_uri=provider_uri, region=REG_CN)

      def test_qlib_data_features(value):
          res = []
          for v in value:
              if len(v) == 0:
                  continue
              nameDFilter = NameDFilter(name_rule_re='SH[0-9]{4}55')
              expressionDFilter = ExpressionDFilter(rule_expression='$close>Ref($close,1)')
              instruments = D.instruments(market=v, filter_pipe=[nameDFilter, expressionDFilter])
              fields = ['$close', '$volume', 'Ref($close, 1)', 'Mean($close, 3)', '$high-$low']
              features = D.features(instruments, fields, start_time='2015-01-01', end_time='2015-01-05', freq='day').head()
              res.append(features.values.tolist())
          return res
      $$;

  - type: wait
    time: 1

  - name: python-udf-1
    type: stream
    query: select test_qlib_data_features(value) as res from udf_stream;
    schema:
      - name: res
        type: array(array(float32))

  - type: wait
    time: 1

  - type: query
    sql: insert into udf_stream (value) values ('csi300');

  - type: wait
    time: 2

  - type: query
    sql: insert into udf_stream (value) values ('csi500');

  - type: check
    target_name: python-udf-1
    expected_result:
      - [[7.0569253,101928616,7.01348,6.9969287,0.19240522]]
