      - [[-0.013031127297482521, 1.1211550415235576e-09, 0.012620767539502182, -0.06289724896113519, -0.004973096790074304]]

  - type: check
    target_name: python-udf-2
    expected_result:
      - [[[-1.2948001405077093e-09], [-1.2948001405077093e-09], [0.004899556793042782], [-1.2948001405077093e-09], [-1.2948001405077093e-09]]]
      - [[[0.037391653561961016], [0.060481950360807904], [0.08590401787587001], [0.02296783116360954], [0.22945071993045976]]]
