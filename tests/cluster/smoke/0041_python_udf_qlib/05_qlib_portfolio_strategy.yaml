tags:
  - udf
  - bug # (#7908) Code: 2624. DB::Exception: Received from localhost:8463. DB::Exception: UDF running error, detail message: 'ParallelExt' object has no attribute '_backend_args'

description: |
  Test covering udf qlib portfolio strategy

steps:
  - type: query
    sql: drop stream if exists udf_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream udf_stream (value string);
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_qlib_strategy(value string) RETURNS array(array(float32)) LANGUAGE PYTHON AS
      $$
      import qlib
      import pandas as pd
      from qlib.constant import REG_CN
      from qlib.contrib.model.gbdt import LGBModel
      from qlib.contrib.data.handler import Alpha158
      from qlib.utils import init_instance_by_config, flatten_dict
      from qlib.workflow import R
      from qlib.workflow.record_temp import SignalRecord, PortAnaRecord
      from qlib.contrib.evaluate import backtest_daily
      from qlib.contrib.evaluate import risk_analysis
      from qlib.contrib.strategy import TopkDropoutStrategy

      provider_uri = '/var/lib/proton/.qlib/qlib_data/cn_data'
      qlib.init(provider_uri=provider_uri, region=REG_CN)

      benchmark = "SH000300"

      def test_qlib_strategy(value):
          res = []
          for v in value:
              if len(v) == 0:
                  continue

              data_handler_config = {
                  "start_time": "2015-01-01",
                  "end_time": "2015-12-31",
                  "fit_start_time": "2015-02-01",
                  "fit_end_time": "2015-11-30",
                  "instruments": v,
              }

              task = {
                  "model": {
                      "class": "LGBModel",
                      "module_path": "qlib.contrib.model.gbdt",
                      "kwargs": {
                          "loss": "mse",
                          "colsample_bytree": 0.8879,
                          "learning_rate": 0.0421,
                          "subsample": 0.8789,
                          "lambda_l1": 205.6999,
                          "lambda_l2": 580.9768,
                          "max_depth": 8,
                          "num_leaves": 210,
                          "num_threads": 20,
                      },
                  },
                  "dataset": {
                      "class": "DatasetH",
                      "module_path": "qlib.data.dataset",
                      "kwargs": {
                          "handler": {
                              "class": "Alpha158",
                              "module_path": "qlib.contrib.data.handler",
                              "kwargs": data_handler_config,
                          },
                          "segments": {
                              "train": ("2015-01-01", "2015-04-28"),
                              "valid": ("2015-05-01", "2015-08-31"),
                              "test": ("2015-09-01", "2015-12-31"),
                          },
                      },
                  },
              }

              # model initialization
              model = init_instance_by_config(task["model"])
              dataset = init_instance_by_config(task["dataset"])

              # start exp
              with R.start(experiment_name="workflow"):
                  # train
                  R.log_params(**flatten_dict(task))
                  model.fit(dataset)

                  # prediction
                  recorder = R.get_recorder()
                  sr = SignalRecord(model, dataset, recorder)
                  sr.generate()

                  signal = sr.load("pred.pkl").head()

                STRATEGY_CONFIG = {
                    "topk": 50,
                    "n_drop": 5,
                    "signal": signal,
                }
                strategy_obj = TopkDropoutStrategy(**STRATEGY_CONFIG)
                report_normal, positions_normal = backtest_daily(
                    start_time="2017-01-01", end_time="2020-08-01", strategy=strategy_obj
                )
                analysis = dict()
                analysis["excess_return_without_cost"] = risk_analysis(report_normal["return"] - report_normal["bench"])
                analysis["excess_return_with_cost"] = risk_analysis(report_normal["return"] - report_normal["bench"] - report_normal["cost"])
                analysis_df = pd.concat(analysis)

                res.append(analysis_df.values.tolist())
          return res
      $$;

  - type: wait
    time: 1

  - name: python-udf-1
    type: stream
    query: select test_qlib_strategy(value) as res from udf_stream;
    schema:
      - name: res
        type: array(array(float32))

  - type: wait
    time: 1

  - type: query
    sql: insert into udf_stream (value) values ('csi300');

  - type: wait
    time: 2

  - type: query
    sql: insert into udf_stream (value) values ('csi500');

  - type: check
    target_name: python-udf-1
    expected_result:
      - [[[-0.00047714886791259904], [0.012295152199879708], [-0.11356143056319858], [-0.5986989095075704], [-0.5282338857650757], [-0.00047714886791259904], [0.012295152199879708], [-0.11356143056319858], [-0.5986989095075704], [-0.5282338857650757]]]
      - [[[-0.00047714886791259904], [0.012295152199879708], [-0.11356143056319858], [-0.5986989095075704], [-0.5282338857650757], [-0.00047714886791259904], [0.012295152199879708], [-0.11356143056319858], [-0.5986989095075704], [-0.5282338857650757]]]
