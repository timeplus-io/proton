tags:
  - udf

description: |
  Test covering udf qlib data api including calener, instruments and features object

steps:
  - type: query
    sql: drop stream if exists udf_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream udf_stream (value string, dt date);
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_qlib_data_calender(dt date) RETURNS array(datetime) LANGUAGE PYTHON AS
      $$
      import qlib
      from qlib.constant import REG_CN
      from qlib.data import D

      provider_uri = '/var/lib/proton/.qlib/qlib_data/cn_data'
      qlib.init(provider_uri=provider_uri, region=REG_CN)

      def test_qlib_data_calender(dt):
          res = []
          for d in dt:
              calender = D.calendar(start_time=d, end_time='2025-12-31', freq='day')[:2]
              calender = [c.to_pydatetime() for c in calender]
              res.append(calender)
          return res
      $$;

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_qlib_data_instruments(value string) RETURNS array(string) LANGUAGE PYTHON AS
      $$
      import qlib
      from qlib.constant import REG_CN
      from qlib.data import D
      from qlib.data.filter import NameDFilter

      provider_uri = '/var/lib/proton/.qlib/qlib_data/cn_data'
      qlib.init(provider_uri=provider_uri, region=REG_CN)

      def test_qlib_data_instruments(value):
          res = []
          for v in value:
              if len(v) == 0:
                  continue
              nameDFilter = NameDFilter(name_rule_re='SH[0-9]{4}55')
              instruments = D.instruments(market=v, filter_pipe=[nameDFilter])
              stock = D.list_instruments(instruments=instruments, start_time='2015-01-01', end_time='2016-02-15', as_list=True)
              res.append(stock)
          return res
      $$;

  - type: wait
    time: 1

  - name: python-udf-1
    type: stream
    query: select test_qlib_data_calender(dt) as res from udf_stream;
    schema:
      - name: res
        type: array(datetime)

  - name: python-udf-2
    type: stream
    query: select test_qlib_data_instruments(value) as res from udf_stream;
    schema:
      - name: res
        type: array(string)

  - type: wait
    time: 1

  - type: query
    sql: insert into udf_stream (value, dt) values ('csi300', '2015-01-01');

  - type: wait
    time: 2

  - type: query
    sql: insert into udf_stream (value, dt) values ('csi500', '2016-01-01');

  - type: check
    target_name: python-udf-1
    expected_result:
      - [['2015-01-05 00:00:00', '2015-01-06 00:00:00']]
      - [['2016-01-04 00:00:00', '2016-01-05 00:00:00']]

  - type: check
    target_name: python-udf-2
    expected_result:
      - [['SH600655', 'SH601555']]
      - [['SH600755', 'SH603355', 'SH600655', 'SH603555']]
