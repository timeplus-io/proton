tags:
  - udf
  - skip # (#7908) Code: 2624. DB::Exception: Received from localhost:8463. DB::Exception: UDF running error, detail message: 'ParallelExt' object has no attribute '_backend_args'

description: |
  Test covering udf qlib data retrieval

steps:
  - type: query
    sql: drop stream if exists udf_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream udf_stream (value string);
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_qlib_data_handler(value string) RETURNS array(string) LANGUAGE PYTHON AS
      $$
      import qlib
      from qlib.constant import REG_CN
      from qlib.contrib.data.handler import Alpha158

      provider_uri = '/var/lib/proton/.qlib/qlib_data/cn_data'
      qlib.init(provider_uri=provider_uri, region=REG_CN)

      def test_qlib_data_handler(value):
          res = []
          for v in value:
              if len(v) == 0:
                  continue
              
              data_handler_config = {
                  "start_time": "2020-01-01",
                  "end_time": "2020-03-01",
                  "fit_start_time": "2020-01-01",
                  "fit_end_time": "2020-01-31",
                  "instruments": v,
              }
              h = Alpha158(**data_handler_config)
              labels = h.fetch(col_set="label").head()

              res.append(labels.values.tolist())
          return res
      $$;

  - type: wait
    time: 1

  - name: python-udf-1
    type: stream
    query: select test_qlib_data_handler(value) as res from udf_stream;
    schema:
      - name: res
        type: array(string)

  - type: wait
    time: 1

  - type: query
    sql: insert into udf_stream (value) values ('csi300');

  - type: wait
    time: 2

  - type: query
    sql: insert into udf_stream (value) values ('csi500');

  - type: check
    target_name: python-udf-1
    expected_result:
      - [[[-0.011111140251159668], [-0.017261207103729248], [-0.021992266178131104], [0.007462739944458008], [0.0017729997634887695]]]
      - [[[-0.006437718868255615], [-0.005970120429992676], [-0.006779730319976807], [0.003708362579345703], [0.0]]]
