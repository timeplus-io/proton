tags:
  - tumble window
description: stream tumble window with designated 5 sec timestamp.
cluster:
  - p1k1
  - p3k1
steps:
  - name: '601'
    type: stream
    query: |
      select max(value), window_start, window_end
      from tumble(test6_stream_only, timestamp, interval 5 second)
      group by window_start, window_end
      emit stream
    schema:
      - name: max(value)
        type: float64
      - name: window_start
        type: datetime64(3)
      - name: window_end
        type: datetime64(3)
  
  - type: wait
    time: 1
  
  - type: query
    sql: |
      insert into test6_stream_only (id, location, value, json, timestamp) values
      ('dev1', 'ca', 57.3, '"create_time":"2021-11-02 20:00:01"', '2020-02-02 20:00:14'),
      ('dev2', 'ca', 58.3, '"create_time":"2021-11-02 20:00:10"', '2020-02-02 20:00:13');

  - type: query
    sql: |
      insert into test6_stream_only (id, location, value, json, timestamp) values
      ('dev6', 'ca', 66, '"create_time":"2021-11-02 20:00:11"', '2020-02-02 20:00:12');

  - type: query
    sql: |
      insert into test6_stream_only (id, location, value, json, timestamp) values
      ('dev8', 'ca', 67, '"create_time":"2021-11-02 20:00:11"', '2020-02-02 20:00:15');

  - type: check
    target_name: '601'
    expected_result:
      - [ '66', '2020-02-02 20:00:10', '2020-02-02 20:00:15' ]

