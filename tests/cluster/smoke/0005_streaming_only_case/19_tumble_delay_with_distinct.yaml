      ('dev8', 'ca', 67, '"create_time":"2021-11-03 20:00:01"', '2020-02-03 20:01:02')
      ('dev8', 'ca', 77, '"create_time":"2021-11-03 20:00:10"', '2020-02-03 20:01:08');

  - type: query
    sql: |
      insert into test6_stream_only_no_default_tp_time (id, location, value, json, timestamp) values
      ('dev3', 'ca', 57.3, '"create_time":"2021-11-03 20:00:01"', '2020-02-03 20:01:09')
      ('dev3', 'ca', 66, '"create_time":"2021-11-03 20:00:01"', '2020-02-03 20:01:10')
      ('dev2', 'ca', 76, '"create_time":"2021-11-03 20:00:10"', '2020-02-03 20:01:09');

  - type: query
    sql: |
      insert into test6_stream_only_no_default_tp_time (id, location, value, json, timestamp) values
      ('dev2', 'ca', 80, '"create_time":"2021-11-03 20:00:01"', '2020-02-03 20:01:07')
      ('dev8', 'ca', 67, '"create_time":"2021-11-03 20:00:01"', '2020-02-03 20:01:11')
      ('dev8', 'ca', 77, '"create_time":"2021-11-03 20:00:10"', '2020-02-03 20:01:12');

  - type: wait
