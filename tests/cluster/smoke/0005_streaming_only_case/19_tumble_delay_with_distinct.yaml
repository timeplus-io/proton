tags:
  - native_not_support
description: last 20s tumble 5s count(*)
cluster:
  - p1k1
  - p3k1
steps:
  - name: '601'
    type: stream
    query: |
      select id, sum(distinct value), to_string(to_timezone(window_end, '')) as win_end
      from tumble(test6_stream_only_no_default_tp_time, timestamp, 5s)
      group by id, window_end
      emit after window close with delay 2s settings seek_to='-1s'
    schema:
      - name: id
        type: string
      - name: sum_distinct(value)
        type: float64
      - name: win_end
        type: string

  - name: '601-1'
    type: stream
    query: |
      select id, sum(distinct value), to_string(to_timezone(window_end, '')) as win_end
      from tumble(test6_stream_only_no_default_tp_time, timestamp, 5s)
      group by id, window_end
      emit after watermark with delay 2s settings seek_to='-1s'
    schema:
      - name: id
        type: string
      - name: sum_distinct(value)
        type: float64
      - name: win_end
        type: string

  - type: wait
    time: 2

  - type: query
    sql: |
      insert into test6_stream_only_no_default_tp_time (id, location, value, json, timestamp) values
      ('dev1', 'ca', 57.3, '"create_time":"2021-11-03 20:00:01"', '2020-02-03 20:01:00')
      ('dev1', 'ca', 57.3, '"create_time":"2021-11-03 20:00:01"', '2020-02-03 20:01:01')
      ('dev2', 'ca', 58.3, '"create_time":"2021-11-03 20:00:10"', '2020-02-03 20:01:05');

  - type: query
    sql: |
      insert into test6_stream_only_no_default_tp_time (id, location, value, json, timestamp) values
