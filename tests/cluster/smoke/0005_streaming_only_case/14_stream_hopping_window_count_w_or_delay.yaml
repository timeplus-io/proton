tags:
  - hopping window
  - delay
description: tumble window aggregate by max and group by id, window_start, window_end
cluster:
  - p1k1
  - p3k1
steps:
  - name: '601'
    type: stream
    query: |
      select location, count(*), window_start, window_end
      from hop(test6_stream_only, timestamp, interval 3 second, interval 5 second)
      group by location, window_start, window_end
      emit stream after window close with delay interval 2 second
    schema:
      - name: location
        type: string
      - name: count()
        type: uint64
      - name: window_start
        type: datetime64(3)
      - name: window_end
        type: datetime64(3)

  - name: '601-1'
    type: stream
    query: |
      select location, count(*), window_start, window_end
      from hop(test6_stream_only, timestamp, interval 3 second, interval 5 second)
      group by location, window_start, window_end
      emit stream after watermark with delay interval 2 second
    schema:
      - name: location
        type: string
      - name: count()
        type: uint64
      - name: window_start
        type: datetime64(3)
      - name: window_end
        type: datetime64(3)

