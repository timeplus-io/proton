tags:
  - tumble window
description: 'stream tumble w/inputs across multiple windows for window start alignment
  and the last input in the middle of latest_stream_only window - #101'
cluster:
  - p1k1
  - p3k1
steps:
  - name: '601'
    type: stream
    query: |
      select window_start, window_end, count(*)
      from tumble(test6_stream_only, timestamp, interval 3 second)
      where value > 50
      group by window_start, window_end
      emit stream
    schema:
      - name: window_start
        type: datetime64(3)
      - name: window_end
        type: datetime64(3)
      - name: count()
        type: uint64
  
  - type: wait
    time: 1
  
  - type: query
    sql: |
      insert into test6_stream_only (id, location, value, json, timestamp) values
      ('dev1', 'ca', 57.3, '"create_time":"2021-11-02 20:00:01"', '2020-02-02 20:00:50');

  - type: query
    sql: |
      insert into test6_stream_only (id, location, value, json, timestamp) values
      ('dev1', 'ca', 57.3, '"create_time":"2021-11-02 20:00:01"', '2020-02-02 20:00:51');

  - type: query
    sql: |
      insert into test6_stream_only (id, location, value, json, timestamp) values
      ('dev2', 'ca', 58.3, '"create_time":"2021-11-02 20:00:10"', '2020-02-02 20:00:55');

  - type: query
    sql: |
      insert into test6_stream_only (id, location, value, json, timestamp) values
      ('dev2', 'ca', 58.3, '"create_time":"2021-11-02 20:00:10"', '2020-02-02 20:00:57');
  
  - type: check
    target_name: '601'
    expected_result:
      - [ '2020-02-02 20:00:48', '2020-02-02 20:00:51', 1 ]
      - [ '2020-02-02 20:00:51', '2020-02-02 20:00:54', 1 ]
      - [ '2020-02-02 20:00:54', '2020-02-02 20:00:57', 1 ]

