tags:
- checkpoint
- multishards
description: global aggr query from multishards state checkpoint
cluster:
- p1k1

steps:
- type: query
  sql: drop stream if exists multishards_stream
- type: wait
  time: 1

- type: query
  sql: create stream multishards_stream (id int, name string, val float, ts datetime)
    settings shards=3
- type: wait
  time: 1

- name: '19302'
  type: stream
  query_id: '19302'
  query: subscribe to select id, count(*), min(val), max(val), sum(val), avg(val)
    from multishards_stream group by id emit periodic 1s settings checkpoint_interval=1
  schema:
  - name: id
    type: int32
  - name: count()
    type: uint64
  - name: min(val)
    type: float32
  - name: max(val)
    type: float32
  - name: sum(val)
    type: float64
  - name: avg(val)
    type: float64
- type: wait
  time: 2

- type: query
  sql: insert into multishards_stream (id, name, val, ts) values
  schema:
  - name: id
    type: int32
  - name: name
    type: string
  - name: val
    type: float32
  - name: ts
    type: datetime
  inputs:
  - [1, 's1', 11.1, '2020-02-02 20:00:01']
  - [1, 's4', 44.4, '2020-02-02 20:00:04']
- type: wait
  time: 1

- type: query
  sql: insert into multishards_stream (id, name, val, ts) values
  schema:
  - name: id
    type: int32
  - name: name
    type: string
  - name: val
    type: float32
  - name: ts
    type: datetime
  inputs:
  - [2, 's2', 22.2, '2020-02-02 20:00:02']
  - [2, 's5', 55.5, '2020-02-02 20:00:05']
- type: wait
  time: 1

- type: query
  sql: insert into multishards_stream (id, name, val, ts) values
  schema:
  - name: id
    type: int32
  - name: name
    type: string
  - name: val
    type: float32
  - name: ts
    type: datetime
  inputs:
  - [3, 's3', 33.3, '2020-02-02 20:00:03']
  - [3, 's6', 66.6, '2020-02-02 20:00:06']
- type: wait
  time: 2

- type: query
  sql: kill query where query_id = '19302'
- type: wait
  time: 3

- type: query
  sql: insert into multishards_stream (id, name, val, ts) values
  schema:
  - name: id
    type: int32
  - name: name
    type: string
  - name: val
    type: float32
  - name: ts
    type: datetime
  inputs:
  - [1, 's7', 77.7, '2020-02-02 20:00:07']
- type: wait
  time: 1

- type: query
  sql: insert into multishards_stream (id, name, val, ts) values
  schema:
  - name: id
    type: int32
  - name: name
    type: string
  - name: val
    type: float32
  - name: ts
    type: datetime
  inputs:
  - [2, 's8', 88.8, '2020-02-02 20:00:08']
- type: wait
  time: 1

- type: query
  sql: insert into multishards_stream (id, name, val, ts) values
  schema:
  - name: id
    type: int32
  - name: name
    type: string
  - name: val
    type: float32
  - name: ts
    type: datetime
  inputs:
  - [3, 's9', 99.9, '2020-02-02 20:00:09']
- type: wait
  time: 3

- name: 19302-1
  type: stream
  query: recover from '19302'
  schema:
  - name: id
    type: int32
  - name: count()
    type: uint64
  - name: min(val)
    type: float32
  - name: max(val)
    type: float32
  - name: sum(val)
    type: float64
  - name: avg(val)
    type: float64
- type: wait
  time: 3

- type: query
  sql: kill query where query_id = '19302' sync

- type: query
  sql: unsubscribe to '19302'

- type: check
  target_name: '19302'
  mode: random
  expected_result:
  - [1, 2, 11.1, 44.4, 55.50000190734863, 27.750000953674316]
  - [1, 2, 11.1, 44.4, 55.50000190734863, 27.750000953674316]
  - [2, 2, 22.2, 55.5, 77.70000076293945, 38.85000038146973]
  - [1, 2, 11.1, 44.4, 55.50000190734863, 27.750000953674316]
  - [2, 2, 22.2, 55.5, 77.70000076293945, 38.85000038146973]
  - [3, 2, 33.3, 66.6, 99.89999771118164, 49.94999885559082]

- type: check
  target_name: 19302-1
  mode: random
  expected_result:
  - [1, 3, 11.1, 77.7, 133.2, 44.4]
  - [2, 3, 22.2, 88.8, 166.5, 55.5]
  - [3, 3, 33.3, 99.9, 199.8, 66.6]
