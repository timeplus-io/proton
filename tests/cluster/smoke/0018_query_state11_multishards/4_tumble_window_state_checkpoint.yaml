tags:
- checkpoint
- multishards
- bug
description: tumble window query from multishards state checkpoint
cluster:
- p1k1

steps:
- type: query
  sql: drop stream if exists multishards_stream
- type: wait
  time: 1

- type: query
  sql: create stream multishards_stream (id int, name string, val float, ts datetime)
    settings shards=3
- type: wait
  time: 1

- name: '19304'
  type: stream
  query_id: '19304'
  query: subscribe to select id, count(*), min(val), max(val), sum(val), avg(val),
    window_start, window_end from tumble(multishards_stream, ts, 5s) group by id,
    window_start, window_end emit stream settings checkpoint_interval=1;
  schema:
  - name: id
    type: int32
  - name: count()
    type: uint64
  - name: min(val)
    type: float32
  - name: max(val)
    type: float32
  - name: sum(val)
    type: float64
  - name: avg(val)
    type: float64
  - name: window_start
    type: datetime
  - name: window_end
    type: datetime
- type: wait
  time: 1

- type: query
  sql: insert into multishards_stream (id, name, val, ts) values
  schema:
  - name: id
    type: int32
  - name: name
    type: string
  - name: val
    type: float32
  - name: ts
    type: datetime
  inputs:
  - [1, 's1', 11.1, '2020-02-02 20:00:01']
  - [2, 's2', 22.2, '2020-02-02 20:00:02']
- type: wait
  time: 1

- type: query
  sql: insert into multishards_stream (id, name, val, ts) values
  schema:
  - name: id
    type: int32
  - name: name
    type: string
  - name: val
    type: float32
  - name: ts
    type: datetime
  inputs:
  - [1, 's3', 33.3, '2020-02-02 20:00:03']
  - [2, 's4', 44.4, '2020-02-02 20:00:04']
- type: wait
  time: 1

- type: query
  sql: insert into multishards_stream (id, name, val, ts) values
  schema:
  - name: id
    type: int32
  - name: name
    type: string
  - name: val
    type: float32
  - name: ts
    type: datetime
  inputs:
  - [1, 's5', 55.5, '2020-02-02 20:00:05']
- type: wait
  time: 1

- type: query
  sql: kill query where query_id = '19304'
- type: wait
  time: 3

- type: query
  sql: insert into multishards_stream (id, name, val, ts) values
  schema:
  - name: id
    type: int32
  - name: name
    type: string
  - name: val
    type: float32
  - name: ts
    type: datetime
  inputs:
  - [1, 's6', 66.6, '2020-02-02 20:00:06']
  - [1, 's7', 77.7, '2020-02-02 20:00:07']
- type: wait
  time: 1

- type: query
  sql: insert into multishards_stream (id, name, val, ts) values
  schema:
  - name: id
    type: int32
  - name: name
    type: string
  - name: val
    type: float32
  - name: ts
    type: datetime
  inputs:
  - [2, 's8', 88.8, '2020-02-02 20:00:08']
  - [2, 's9', 99.9, '2020-02-02 20:00:11']
- type: wait
  time: 3

- name: 19304-1
  type: stream
  query: recover from '19304'
  schema:
  - name: id
    type: int32
  - name: count()
    type: uint64
  - name: min(val)
    type: float32
  - name: max(val)
    type: float32
  - name: sum(val)
    type: float64
  - name: avg(val)
    type: float64
  - name: window_start
    type: datetime
  - name: window_end
    type: datetime
- type: wait
  time: 3

- type: query
  sql: kill query where query_id = '19304' sync

- type: query
  sql: unsubscribe to '19304'

- type: check
  target_name: '19304'
  expected_result:
  - [1, 2, 11.1, 33.3, 44.4, 22.2, '2020-02-02 20:00:00', '2020-02-02 20:00:05']
  - [2, 2, 22.2, 44.4, 66.6, 33.3, '2020-02-02 20:00:00', '2020-02-02 20:00:05']

- type: check
  target_name: 19304-1
  expected_result:
  - [1, 3, 55.5, 77.7, 199.8, 66.6, '2020-02-02 20:00:05', '2020-02-02 20:00:10']
  - [2, 1, 88.8, 88.8, 88.8, 88.8, '2020-02-02 20:00:05', '2020-02-02 20:00:10']
