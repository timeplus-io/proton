tags:
- checkpoint
- multishards
- bug
description: tail query from multishards state checkpoint
cluster:
- p1k1

steps:
- type: query
  sql: drop stream if exists multishards_stream
- type: wait
  time: 1

- type: query
  sql: create stream multishards_stream (id int, name string, val float, ts datetime) settings shards=3
- type: wait
  time: 1

- name: '19300'
  type: stream
  query_id: '19300'
  query: subscribe to select id, name, val, ts from multishards_stream settings checkpoint_interval=1
  schema:
  - name: id
    type: int32
  - name: name
    type: string
  - name: val
    type: float32
  - name: ts
    type: datetime
- type: wait
  time: 1

- type: query
  sql: insert into multishards_stream (id, name, val, ts) values
  schema:
  - name: id
    type: int32
  - name: name
    type: string
  - name: val
    type: float32
  - name: ts
    type: datetime
  inputs:
  - [1, 's1', 11.1, '2020-02-02 20:00:01']
- type: wait
  time: 1

- type: query
  sql: insert into multishards_stream (id, name, val, ts) values
  schema:
  - name: id
    type: int32
  - name: name
    type: string
  - name: val
    type: float32
  - name: ts
    type: datetime
  inputs:
  - [2, 's2', 22.2, '2020-02-02 20:00:02']
- type: wait
  time: 1

- type: query
  sql: kill query where query_id = '19300'
- type: wait
  time: 3

- type: query
  sql: insert into multishards_stream (id, name, val, ts) values
  schema:
  - name: id
    type: int32
  - name: name
    type: string
  - name: val
    type: float32
  - name: ts
    type: datetime
  inputs:
  - [3, 's3', 33.3, '2020-02-02 20:00:03']
- type: wait
  time: 2

- type: query
  sql: insert into multishards_stream (id, name, val, ts) values
  schema:
  - name: id
    type: int32
  - name: name
    type: string
  - name: val
    type: float32
  - name: ts
    type: datetime
  inputs:
  - [4, 's4', 44.4, '2020-02-02 20:00:04']
- type: wait
  time: 3

- name: 19300-1
  type: stream
  query: recover from '19300'
  schema:
  - name: id
    type: int32
  - name: name
    type: string
  - name: val
    type: float32
  - name: ts
    type: datetime
- type: wait
  time: 3

- type: query
  sql: kill query where query_id = '19300' sync

- type: query
  sql: unsubscribe to '19300'

- type: check
  target_name: '19300'
  expected_result:
  - [1, s1, 11.1, '2020-02-02 20:00:01']
  - [2, s2, 22.2, '2020-02-02 20:00:02']

- type: check
  target_name: 19300-1
  expected_result:
  - [3, s3, 33.3, '2020-02-02 20:00:01']
  - [4, s4, 44.4, '2020-02-02 20:00:02']
