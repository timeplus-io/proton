tags:
  - uda

description: Test covering simple python uda test

steps:
  - type: query
    sql: drop stream if exists uda_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream uda_stream (x int, xx int, y int);
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE AGGREGATE FUNCTION getGaussianNB(x int, xx int, y int) RETURNS array(int64) LANGUAGE PYTHON AS $$
      import pickle
      import numpy as np
      from sklearn.naive_bayes import GaussianNB

      class getGaussianNB:
          has_customized_emit = False

          def __init__(self):
              self.gaussian_nb = 0

          def serialize(self):
              data = {}
              data['gaussian_nb'] = self.gaussian_nb
              return pickle.dumps(data)

          def deserialize(self, data):
              data = pickle.loads(data)
              self.gaussian_nb = data['gaussian_nb']

          def merge(self, other):
              self.gaussian_nb = self.gaussian_nb

          def process(self, xs, xxs, ys):
              X = np.stack((xs, xxs), axis=1)
              y = np.array(ys)
              clf = GaussianNB()
              clf.fit(X, y)
              self.gaussian_nb = clf.predict([[0, 0]]).tolist()

          def finalize(self):
              return self.gaussian_nb
      $$;

  - type: wait
    time: 1

  - name: python-udf6-6-1
    type: stream
    query: select getGaussianNB(x, xx, y) as res from uda_stream;
    schema:
      - name: res
        type: array(int64)

  - type: wait
    time: 1

  - type: query
    sql: insert into uda_stream(x, xx, y) values
          (-1, -1, 1)(-2, -1, 1)(-3, -2, 1)
          (1, 1, 2)(2, 1, 2)(3, 2, 2);

  - type: check
    target_name: python-udf6-6-1
    expected_result:
      - [[1]]
