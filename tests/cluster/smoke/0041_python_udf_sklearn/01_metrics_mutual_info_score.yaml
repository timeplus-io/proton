tags:
  - uda

description: Test covering simple python uda test

steps:
  - type: query
    sql: drop stream if exists uda_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream uda_stream (labels_true int64, labels_pred int64);
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE AGGREGATE FUNCTION getMutualInfoScore(labels_true int64, labels_pred int64) RETURNS float64 LANGUAGE PYTHON AS $$
      import pickle
      from sklearn.metrics import mutual_info_score
      class getMutualInfoScore:
          def __init__(self):
              self.score = 0

          def serialize(self):
              data = {}
              data['score'] = self.score
              return pickle.dumps(data)

          def deserialize(self, data):
              data = pickle.loads(data)
              self.score = data['score']

          def merge(self, other):
              if (other.score > self.score):
                  self.score = other.score

          def process(self, labels_trues, labels_preds):
              tmp_score = mutual_info_score(labels_trues, labels_preds)
              if tmp_score > self.score:
                  self.score = tmp_score

          def finalize(self):
              return self.score
      $$;

  - type: wait
    time: 1

  - name: python-udf6-1-1
    type: stream
    query: select getMutualInfoScore(labels_true, labels_pred) as res from uda_stream;
    schema:
      - name: res
        type: float64

  - type: wait
    time: 2

  - type: query
    sql: insert into uda_stream(labels_true, labels_pred) values (0,0)(1,1)(1,0)(0,0)(1,1)(0,1);

  - type: check
    target_name: python-udf6-1-1
    expected_result:
      - [0.0566330122651324]
