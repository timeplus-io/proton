tags:
  - uda

description: Test covering simple python uda test

steps:
  - type: query
    sql: drop stream if exists uda_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream uda_stream (x float, xx float, y int);
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE AGGREGATE FUNCTION getLogisticRegression(x float, xx float, y int) RETURNS float64 LANGUAGE PYTHON AS $$
      import pickle
      import numpy as np
      from sklearn.model_selection import train_test_split
      from sklearn.linear_model import LogisticRegression

      class getLogisticRegression:
          def __init__(self):
              self.logistic_regression = 0

          def serialize(self):
              data = {}
              data['logistic_regression'] = self.logistic_regression
              return pickle.dumps(data)

          def deserialize(self, data):
              data = pickle.loads(data)
              self.logistic_regression = data['logistic_regression']

          def merge(self, other):
              self.logistic_regression = self.logistic_regression

          def process(self, xs, xxs, ys):
              X = np.stack((xs, xxs), axis=1)
              y = np.array(ys)

              if len(X) > 1:
                  clf = LogisticRegression(random_state=0).fit(X, y)
                  clf.predict(X[:2, :])
                  self.logistic_regression = clf.score(X, y)

          def finalize(self):
              return self.logistic_regression
      $$;

  - type: wait
    time: 1

  - name: python-udf6-8-1
    type: stream
    query: select getLogisticRegression(x, xx, y) as res from uda_stream;
    schema:
      - name: res
        type: float64

  - type: wait
    time: 1

  - type: query
    sql: insert into uda_stream(x, xx, y) values 
          (5.1, 3.5, 0)(4.9, 3.0, 0)(4.7, 3.2, 1)
          (4.6, 3.1, 1)(5.0, 3.6, 2)(5.4, 3.9, 2);

  - type: check
    target_name: python-udf6-8-1
    expected_result:
      - [0.6666666666666666]
