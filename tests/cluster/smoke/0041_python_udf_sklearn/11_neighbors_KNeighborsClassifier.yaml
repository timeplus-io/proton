tags:
  - uda

description: Test covering simple python uda test

steps:
  - type: query
    sql: drop stream if exists uda_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream uda_stream (x array(int), y int);
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE AGGREGATE FUNCTION getKNeighborsClassifier(x array(int), y int) RETURNS array(int64) LANGUAGE PYTHON AS $$
      import pickle
      import numpy as np
      from sklearn.neighbors import KNeighborsClassifier

      class getKNeighborsClassifier:
          has_customized_emit = False

          def __init__(self):
              self.k_neighbors_classifier = 0

          def serialize(self):
              data = {}
              data['k_neighbors_classifier'] = self.k_neighbors_classifier
              return pickle.dumps(data)

          def deserialize(self, data):
              data = pickle.loads(data)
              self.k_neighbors_classifier = data['k_neighbors_classifier']

          def merge(self, other):
              pass

          def process(self, xs, ys):
              X = np.array(xs)
              y = np.array(ys)
              if len(X) > 1:
                  neigh = KNeighborsClassifier(n_neighbors=3)
                  neigh.fit(X, y)
                  self.k_neighbors_classifier = neigh.predict([[1.1]]).tolist()

          def finalize(self):
              return self.k_neighbors_classifier
      $$;

  - type: wait
    time: 1

  - name: python-udf6-11-1
    type: stream
    query: select getKNeighborsClassifier(x, y) as res from uda_stream;
    schema:
      - name: res
        type: array(int64)
  - type: wait
    time: 1
  
  - type: query
    sql: insert into uda_stream(x, y) values 
          ([0], 0)([1], 0)([2], 1)([3], 1);

  - type: check
    target_name: python-udf6-11-1
    expected_result:
      - [[0]]
