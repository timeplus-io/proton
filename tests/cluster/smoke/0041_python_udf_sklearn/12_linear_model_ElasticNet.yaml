tags:
  - uda

description: Test covering simple python uda test

steps:
  - type: query
    sql: drop stream if exists uda_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream uda_stream (x float64, xx float64, y float64);
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE AGGREGATE FUNCTION getElasticNet(x float64, xx float64, y float64) RETURNS float64 LANGUAGE PYTHON AS $$
      import pickle
      import numpy as np
      from sklearn.linear_model import ElasticNet

      class getElasticNet:
          def __init__(self):
              self.elastic_net = 0

          def serialize(self):
              data = {}
              data['elastic_net'] = self.elastic_net
              return pickle.dumps(data)

          def deserialize(self, data):
              data = pickle.loads(data)
              self.elastic_net = data['elastic_net']

          def merge(self, other):
              pass

          def process(self, xs, xxs, ys):
              X = np.stack((xs, xxs), axis=1)
              y = np.array(ys)
              regr = ElasticNet(random_state=0)
              regr.fit(X, y)
              self.elastic_net = regr.intercept_

          def finalize(self):
              return self.elastic_net
      $$;

  - type: wait
    time: 1

  - name: python-udf6-12-1
    type: stream
    query: select getElasticNet(x, xx, y) as res from uda_stream;
    schema:
      - name: res
        type: float64
  - type: wait
    time: 1
  
