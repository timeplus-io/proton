tags:
  - uda

description: Test covering simple python uda test

steps:
  - type: query
    sql: drop stream if exists uda_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream uda_stream (x float64, xx float64, y float64);
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE AGGREGATE FUNCTION getAdaBoostRegressor(x float64, xx float64, y float64) RETURNS float64 LANGUAGE PYTHON AS $$
      import pickle
      import numpy as np
      from sklearn.ensemble import AdaBoostRegressor

      class getAdaBoostRegressor:
          def __init__(self):
              self.regressor = 0

          def serialize(self):
              data = {}
              data['regressor'] = self.regressor
              return pickle.dumps(data)

          def deserialize(self, data):
              data = pickle.loads(data)
              self.regressor = data['regressor']

          def merge(self, other):
              self.regressor = self.regressor

          def process(self, xs, xxs, ys):
              X = np.stack((xs, xxs), axis=1)
              y = np.array(ys)
              regr = AdaBoostRegressor(random_state=0, n_estimators=100)
              regr.fit(X, y)
              regr.predict([[0, 0]])
              tmp_regressor = regr.score(X, y)
              self.regressor = tmp_regressor

          def finalize(self):
              return self.regressor
      $$;

  - type: wait
    time: 1

  - name: python-udf6-3-1
    type: stream
    query: select getAdaBoostRegressor(x, xx, y) as res from uda_stream;
    schema:
      - name: res
        type: float64

  - type: wait
    time: 2

