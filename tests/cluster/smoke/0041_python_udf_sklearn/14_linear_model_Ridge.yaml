tags:
  - uda

description: Test covering simple python uda test

steps:
  - type: query
    sql: drop stream if exists uda_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream uda_stream (x float64, xx float64, y float64);
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE AGGREGATE FUNCTION getRidge(x float64, xx float64, y float64) RETURNS float64 LANGUAGE PYTHON AS $$
      import pickle
      import numpy as np
      from sklearn.linear_model import Ridge

      class getRidge:
          def __init__(self):
              self.ridge = 0

          def serialize(self):
              data = {}
              data['ridge'] = self.ridge
              return pickle.dumps(data)

          def deserialize(self, data):
              data = pickle.loads(data)
              self.ridge = data['ridge']

          def merge(self, other):
              pass

          def process(self, xs, xxs, ys):
              X = np.stack((xs, xxs), axis=1)
              y = np.array(ys)
              clf = Ridge(alpha=1.0)
              clf.fit(X, y)
              self.ridge = clf.intercept_

          def finalize(self):
              return self.ridge
      $$;

  - type: wait
    time: 1

  - name: python-udf6-14-1
    type: stream
    query: select getRidge(x, xx, y) as res from uda_stream;
    schema:
      - name: res
        type: float64
