tags:
  - uda

description: Test covering simple python uda test

steps:
  - type: query
    sql: drop stream if exists uda_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream uda_stream (x int, y int);
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE AGGREGATE FUNCTION getGaussianMixture(x int, y int) RETURNS array(int64) LANGUAGE PYTHON AS $$
      import pickle
      import numpy as np
      from sklearn.mixture import GaussianMixture

      class getGaussianMixture:
          has_customized_emit = False

          def __init__(self):
              self.gaussian_mixture = 0
              self.X = np.array([[]])

          def serialize(self):
              data = {}
              data['gaussian_mixture'] = self.gaussian_mixture
              return pickle.dumps(data)

          def deserialize(self, data):
              data = pickle.loads(data)
              self.gaussian_mixture = data['gaussian_mixture']

          def merge(self, other):
              if other.X.size > 0:
                  self.X = other.X

          def process(self, xs, ys):
              X = np.stack((xs, ys), axis=1)
              if self.X.size > 0:
                  X = np.vstack((self.X, X))
              if len(X) > 1:
                  gm = GaussianMixture(n_components=2, random_state=0).fit(X)
                  gm.means_
                  self.gaussian_mixture = gm.predict([[0, 0], [12, 3]]).tolist()

          def finalize(self):
              return self.gaussian_mixture
      $$;

  - type: wait
    time: 1

  - name: python-udf6-9-1
    type: stream
    query: select getGaussianMixture(x, y) as res from uda_stream;
    schema:
      - name: res
        type: array(int64)
  - type: wait
    time: 1
  
  - type: query
    sql: insert into uda_stream(x, y) values (1, 2)(1, 4)(1, 0);

  - type: wait
    time: 2

  - type: query
    sql: insert into uda_stream(x, y) values (10, 2)(10, 4)(10, 0);

  - type: check
    target_name: python-udf6-9-1
    expected_result:
      - [[1, 0]]
      - [[1, 0]]
