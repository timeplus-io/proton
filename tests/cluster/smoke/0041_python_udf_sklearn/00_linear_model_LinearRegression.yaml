tags:
  - uda

description: Test covering simple python uda test

steps:
  - type: query
    sql: drop stream if exists uda_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream uda_stream (x int, xx int, y int);
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE AGGREGATE FUNCTION getLinearRegression(x int, xx int, y int) RETURNS array(float) LANGUAGE PYTHON AS $$
      import numpy as np
      from sklearn.linear_model import LinearRegression

      class getLinearRegression:
          has_customized_emit = False

          def __init__(self):
              self.coef = 0

          def serialize(self):
              pass

          def deserialize(self, data):
              pass

          def merge(self, other):
              pass

          def process(self, xs, xxs, ys):
              X = np.stack((xs, xxs), axis=1)
              y = np.array(ys)
              reg = LinearRegression().fit(X, y)
              reg.score(X, y)
              self.coef = reg.coef_.tolist()

          def finalize(self):
              return self.coef
      $$;

  - type: wait
    time: 2

  - name: python-udf6-0-1
    type: stream
    query: select getLinearRegression(x, xx, y) as res from uda_stream;
    schema:
      - name: res
        type: array(float32)

  - type: wait
    time: 2

  - type: query
    sql: insert into uda_stream(x, xx, y) values (1, 1, 6) (1, 2, 8) (2, 2, 9) (2, 3, 11);

  - type: check
    target_name: python-udf6-0-1
    timeout: 100 # address build need more time
    expected_result:
      - [[1.0, 1.9999999999999993]]
