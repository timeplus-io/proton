tags:
  - uda

description: Test covering simple python uda test

steps:
  - type: query
    sql: drop stream if exists uda_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream uda_stream (x float, xx float, y float);
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE AGGREGATE FUNCTION getRandomForestRegressor(x float, xx float, y float) RETURNS array(float) LANGUAGE PYTHON AS $$
      import pickle
      import numpy as np
      from sklearn.ensemble import RandomForestRegressor

      class getRandomForestRegressor:
          has_customized_emit = False

          def __init__(self):
              self.regressor = 0

          def serialize(self):
              data = {}
              data['regressor'] = self.regressor
              return pickle.dumps(data)

          def deserialize(self, data):
              data = pickle.loads(data)
              self.regressor = data['regressor']

          def merge(self, other):
              pass

          def process(self, xs, xxs, ys):
              X = np.stack((xs, xxs), axis=1)
              y = np.array(ys)
              regr = RandomForestRegressor(max_depth=2, random_state=0)
              regr.fit(X, y)
              self.regressor = regr.predict([[0, 0]]).tolist()

          def finalize(self):
              return self.regressor
      $$;

  - type: wait
    time: 1

  - name: python-udf6-5-1
    type: stream
    query: select getRandomForestRegressor(x, xx, y) as res from uda_stream;
    schema:
      - name: res
        type: array(float32)

  - type: wait
    time: 2

