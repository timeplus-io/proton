tags:
- random_in_type
description: create random stream with random_in_type function
cluster:
- p1k1
- p3k1
steps:
- type: query
  sql: drop stream if exists test22_create_random
- type: wait
  time: 2

- type: query
  sql: create random stream test22_create_random(id int8 default random_in_type('int8',5))
- type: wait
  time: 2

- name: '2212'
  type: stream
  query: select count(distinct id) from test22_create_random limit 1
  schema:
  - name: count_distinct(id)
    type: uint64

- type: check
  target_name: '2212'
  expected_result:
  - [5]
