tags:
- random stream table query
description: test random stream stream query
cluster:
- p1k1
- p3k1
steps:
- type: query
  sql: drop stream if exists test22_create_random
- type: wait
  time: 2

- type: query
  sql: create random stream test22_create_random(id int default rand()%4) engine Random()
    settings eps=1000
- type: wait
  time: 2

- name: '2227'
  type: stream
  query: select count(1) from table(test22_create_random) settings max_events=5000
  schema:
  - name: count()
    type: uint64

- type: check
  target_name: '2227'
  expected_result:
  - ['5000']
