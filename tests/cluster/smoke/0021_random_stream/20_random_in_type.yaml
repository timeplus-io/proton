tags:
- random_in_type
description: Test random_in_type function, covering supported types
cluster:
- p1k1
- p3k1
steps:
- name: '2200'
  type: stream
  query: select random_in_type('bool'), random_in_type('int8'), random_in_type('int16'),
    random_in_type('int32'), random_in_type('int64'), random_in_type('int128'), random_in_type('int256'),
    random_in_type('uint8'), random_in_type('uint16'), random_in_type('uint32'), random_in_type('uint64'),
    random_in_type('uint128'), random_in_type('uint256')
  schema:
  - name: random_in_type('bool')
    type: bool
  - name: random_in_type('int8')
    type: int8
  - name: random_in_type('int16')
    type: int16
  - name: random_in_type('int32')
    type: int32
  - name: random_in_type('int64')
    type: int64
  - name: random_in_type('int128')
    type: int128 
  - name: random_in_type('int256')
    type: int256
  - name: random_in_type('uint8')
    type: uint8
  - name: random_in_type('uint16')
    type: uint16
  - name: random_in_type('uint32')
    type: uint32
  - name: random_in_type('uint64')
    type: uint64
  - name: random_in_type('uint128')
    type: uint128
  - name: random_in_type('uint256')
    type: uint256
  
- name: '2201'
  type: stream
  query: select random_in_type('string'), random_in_type('fixed_string(3)'), random_in_type('date'),
    random_in_type('date32', 100), random_in_type('datetime32'), random_in_type('datetime64(3)',
    100), random_in_type('float32'), random_in_type('float64'), random_in_type('decimal32(3)'),
    random_in_type('decimal64(3)'), random_in_type('decimal128(9)'), random_in_type('decimal256(9)'),
    random_in_type('uuid'), random_in_type('ipv4'), random_in_type('ipv6')
  schema:
  - name: random_in_type('string')
    type: string
  - name: random_in_type('fixed_string(3)')
    type: fixed_string(3)
  - name: random_in_type('date')
    type: date
  - name: random_in_type('date32', 100)
    type: date32
  - name: random_in_type('datetime32')
    type: datetime
  - name: random_in_type('datetime64(3)', 100)
    type: datetime64(3)
  - name: random_in_type('float32')
    type: float32 
  - name: random_in_type('float64')
    type: float64
  - name: random_in_type('decimal32(3)')
    type: decimal(9,3)
  - name: random_in_type('decimal64(3)')
    type: decimal(18, 3)
  - name: random_in_type('decimal128(9)')
    type: decimal(38, 9)
  - name: random_in_type('decimal256(9)')
    type: decimal(76, 9)
  - name: random_in_type('uuid')
    type: uuid
  - name: random_in_type('ipv4')
    type: ipv4
  - name: random_in_type('ipv6')
    type: ipv6

