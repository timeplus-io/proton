tags:
- create random
- unstable
description: create random stream with default generating function, limit the amount
  of data produced per window, set interval_time, check the the number of data produced
  per interval_time is correct;
cluster:
- p1k1
- p3k1
steps:
- type: query
  sql: drop stream if exists test22_create_random
- type: wait
  time: 2

- type: query
  sql: create random stream test22_create_random(id int default rand()%4) engine Random()
    settings eps=1000, interval_time=100
- type: wait
  time: 2

- name: '2219'
  type: stream
  query: select cnt - lag(cnt, 1) as diff from (select count(1) as cnt from test22_create_random
    limit 2 emit periodic 100ms) offset 1 settings max_threads=10
  schema:
  - name: diff
    type: int64

- type: check
  target_name: '2219'
  expected_result:
  - [100]
