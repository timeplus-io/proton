tags:
- create random
- _tp_sn
- _tp_shard
description: test random stream virtual column _tp_sn, _tp_shard
cluster:
- p1k1
- p3k1
steps:
- type: query
  sql: drop stream if exists test22_create_random
- type: wait
  time: 2

- type: query
  sql: create random stream test22_create_random(id int default monotonic(2), value
    int) engine Random() settings eps=1, shards=1
- type: wait
  time: 2

- name: '2229'
  type: stream
  query: select id, _tp_sn, _tp_shard from test22_create_random limit 5
  schema:
  - name: id
    type: int32
  - name: _tp_sn
    type: int64
  - name: _tp_shard
    type: int32

- type: check
  target_name: '2229'
  expected_result:
  - ['2', '1', '0']
  - ['3', '2', '0']
  - ['4', '3', '0']
  - ['5', '4', '0']
  - ['6', '5', '0']
