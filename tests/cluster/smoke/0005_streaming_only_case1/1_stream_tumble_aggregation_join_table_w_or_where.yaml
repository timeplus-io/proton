tags:
  - join
description: stream stream aggregation join table w/where
cluster:
  - p1k1
  - p3k1
steps:
  - name: 601-1
    type: stream
    query: |
      select a.id, b.type, max(a.value), window_start, window_end
      from tumble(test6_stream_only1, timestamp, interval 5 second) as a
      join table(test6_stream_only1_d) as b on a.id = b.id
      where b.type = 'roof' or b.type = 'field' or b.type = 'wall'
      group by a.id, b.type, window_start, window_end
    schema:
      - name: id
        type: string
      - name: type
        type: string
      - name: max(value)
        type: float32
      - name: window_start
        type: datetime64(3)
      - name: window_end
        type: datetime64(3)

  - type: wait
    time: 1

  - type: query
    sql: |
      insert into test6_stream_only1 (id, location, value, json, timestamp) values
      ('dev1', 'ca', 57.3, '"create_time":"2021-11-02 20:00:01"', '2020-02-02 20:01:00')
      ('dev2', 'ca', 66, '"create_time":"2021-11-02 20:00:01"', '2020-02-02 20:01:01')
      ('dev2', 'ca', 58.3, '"create_time":"2021-11-02 20:00:10"', '2020-02-02 20:01:05');

  - type: query
    sql: |
      insert into test6_stream_only1 (id, location, value, json, timestamp) values
      ('dev4', 'ca', 59, '"create_time":"2021-11-02 20:00:01"', '2020-02-02 20:01:06')
      ('dev8', 'ca', 67, '"create_time":"2021-11-02 20:00:01"', '2020-02-02 20:01:07')
      ('dev8', 'ca', 77, '"create_time":"2021-11-02 20:00:10"', '2020-02-02 20:01:10');

  - type: query
    sql: |
      insert into test6_stream_only1 (id, location, value, json, timestamp) values
      ('dev3', 'ca', 57.3, '"create_time":"2021-11-02 20:00:01"', '2020-02-02 20:01:11')
      ('dev3', 'ca', 66, '"create_time":"2021-11-02 20:00:01"', '2020-02-02 20:01:14')
      ('dev4', 'ca', 76, '"create_time":"2021-11-02 20:00:10"', '2020-02-02 20:01:11');

  - type: query
    sql: |
      insert into test6_stream_only1 (id, location, value, json, timestamp) values
      ('dev3', 'ca', 80, '"create_time":"2021-11-02 20:00:01"', '2020-02-02 20:01:13')
      ('dev4', 'ca', 67, '"create_time":"2021-11-02 20:00:01"', '2020-02-02 20:01:12')
      ('dev9', 'ca', 77, '"create_time":"2021-11-02 20:00:10"', '2020-02-02 20:01:15');

  - type: check
    target_name: 601-1
    mode: <<or .aggregation_check_mode "sequence">>
    expected_result:
      - [ dev1, roof, 57.3, '2020-02-02 20:01:00', '2020-02-02 20:01:05' ]
      - [ dev2, field, 66, '2020-02-02 20:01:00', '2020-02-02 20:01:05' ]
      - [ dev2, field, 58.3, '2020-02-02 20:01:05', '2020-02-02 20:01:10' ]
      - [ dev4, wall, 59, '2020-02-02 20:01:05', '2020-02-02 20:01:10' ]
      - [ dev4, wall, 76, '2020-02-02 20:01:10', '2020-02-02 20:01:15' ]

