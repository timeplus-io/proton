tags:
  - view
description: tumble sum based on tail join table view
cluster:
  - p1k1
  - p3k1
steps:
  - type: wait
    time: 2
  - type: query
    sql: drop view if exists test6_stream_only1_join_v
  - type: wait
    time: 2
  - type: query
    sql: |
      create view test6_stream_only1_join_v as
      select
        a.id,
        b.type,
        a.value,
        a.json,
        a.timestamp,
        to_datetime(json_extract_string(json, 'create_time')) as transformed_timestamp,
        _tp_time
      from
        test6_stream_only1 as a
      join
        table(test6_stream_only1_d) as b
      on
        a.id = b.id

  - name: 601-1
    type: stream
    query: |
      select id, type, sum(value), window_start, window_end
      from tumble(test6_stream_only1_join_v, timestamp, 5s)
      group by id, type, window_start, window_end
    schema:
      - name: id
        type: string
      - name: type
        type: string
      - name: sum(value)
        type: float64
      - name: window_start
        type: datetime64(3)
      - name: window_end
        type: datetime64(3)

  - type: wait
    time: 2

  - type: query
    sql: drop view test6_stream_only1_join_v

  - type: query
    sql: |
      insert into test6_stream_only1 (id, location, value, json, timestamp) values
        ('dev1', 'ca', 60, '{"create_time":"2021-11-02 20:00:01"}', '2021-11-02 20:00:01')
        ('dev1', 'ca', 66, '{"create_time":"2021-11-02 20:00:03"}', '2021-11-02 20:00:03')
        ('dev2', 'ca', 30, '{"create_time":"2021-11-02 20:00:02"}', '2021-11-02 20:00:02')

  - type: query
    sql: |
      insert into test6_stream_only1 (id, location, value, json, timestamp) values
        ('dev2', 'ca', 68, '{"create_time":"2021-11-02 20:00:04"}', '2021-11-02 20:00:04')
        ('dev8', 'ca', 67, '{"create_time":"2021-11-02 20:00:05"}', '2021-11-02 20:00:05')
        ('dev8', 'ca', 77, '{"create_time":"2021-11-02 20:00:06"}', '2021-11-02 20:00:06')

  - type: query
    sql: |
      insert into test6_stream_only1 (id, location, value, json, timestamp) values
        ('dev3', 'ca', 58, '{"create_time":"2021-11-02 20:00:09"}', '2021-11-02 20:00:09')
        ('dev3', 'ca', 66, '{"create_time":"2021-11-02 20:00:08"}', '2021-11-02 20:00:08')
        ('dev4', 'ca', 76, '{"create_time":"2021-11-02 20:00:07"}', '2021-11-02 20:00:07')

  - type: query
    sql: |
      insert into test6_stream_only1 (id, location, value, json, timestamp) values
        ('dev3', 'ca', 80, '{"create_time":"2021-11-02 20:00:09"}', '2021-11-02 20:00:09')
        ('dev4', 'ca', 67, '{"create_time":"2021-11-02 20:00:07"}', '2021-11-02 20:00:07')
        ('dev8', 'ca', 77, '{"create_time":"2021-11-02 20:00:10"}', '2021-11-02 20:00:10')

  - type: check
    target_name: 601-1
    mode: <<or .aggregation_check_mode "sequence">>
    expected_result:
      - [ dev2, field, 98, '2021-11-02 20:00:00', '2021-11-02 20:00:05' ]
      - [ dev1, roof, 126, '2021-11-02 20:00:00', '2021-11-02 20:00:05' ]
