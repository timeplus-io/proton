tags:
  - seek to
  - to reproduce
description: seek to ago interval
cluster:
  - p1k1
  - p3k1
steps:
  - type: query
    sql: drop stream if exists test6_stream_only1
  - type: wait
    time: 2

  - type: query
    sql: create stream test6_stream_only1 (id string, location string, value float32,
      json string, timestamp datetime64(3))
  - type: wait
    time: 2

  - type: query
    sql: |
      insert into test6_stream_only1 (id, location, value, json, timestamp) values
        ('dev1', 'ca', 60, '{"create_time":"2021-11-02 20:00:01"}', '2021-11-02 20:00:01')
        ('dev1', 'ca', 66, '{"create_time":"2021-11-02 20:00:03"}', '2021-11-02 20:00:03')
        ('dev2', 'ca', 30, '{"create_time":"2021-11-02 20:00:02"}', '2021-11-02 20:00:02')

  - type: wait
    time: 6

  - type: query
    sql: |
      insert into test6_stream_only1 (id, location, value, json, timestamp) values
        ('dev2', 'ca', 68, '{"create_time":"2021-11-02 20:00:14"}', '2021-11-02 20:00:04')
        ('dev8', 'ca', 67, '{"create_time":"2021-11-02 20:00:15"}', '2021-11-02 20:00:05')
        ('dev8', 'ca', 77, '{"create_time":"2021-11-02 20:00:16"}', '2021-11-02 20:00:06')

  - type: wait
    time: 1

  - name: 601-1
    type: stream
    query: select id, value from test6_stream_only1 settings seek_to='-5s'
    schema:
      - name: id
        type: string
      - name: value
        type: float32

  - type: check
    target_name: 601-1
    expected_result:
      - - dev2
        - 68
      - - dev8
        - 67
      - - dev8
        - 77
