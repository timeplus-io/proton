tags:
  - subquery
description: hop count based on hopping sum subquery
cluster:
  - p1k1
  - p3k1
steps:
  - name: 601-1
    type: stream
    query: with joined_stream as (select a.id, b.type, max(a.value), window_start as
      joined_w_start, window_end as joined_w_end from hop(test6_stream_only1, timestamp,
      interval 3 second, interval 5 second) as a join table(test6_stream_only1_d) as
      b on a.id = b.id where b.type = 'roof' or b.type = 'field' or b.type = 'wall'
      group by a.id, b.type, window_start, window_end) select id, count(*), window_start,
      window_end from hop(joined_stream, joined_w_end, interval 3 second, interval 5
      second) group by id, window_start, window_end
    schema:
      - name: id
        type: string
      - name: count()
        type: uint64
      - name: window_start
        type: datetime64(3)
      - name: window_end
        type: datetime64(3)

  - type: wait
    time: 1

  - type: query
    sql: |
      insert into test6_stream_only1 (id, location, value, json, timestamp) values
        ('dev1', 'ca', 60, '{"create_time":"2021-11-02 20:00:01"}', '2021-11-02 20:00:01')
        ('dev1', 'ca', 66, '{"create_time":"2021-11-02 20:00:03"}', '2021-11-02 20:00:03')
        ('dev2', 'ca', 30, '{"create_time":"2021-11-02 20:00:02"}', '2021-11-02 20:00:02')

  - type: query
    sql: |
      insert into test6_stream_only1 (id, location, value, json, timestamp) values
        ('dev2', 'ca', 68, '{"create_time":"2021-11-02 20:00:04"}', '2021-11-02 20:00:04')
        ('dev3', 'ca', 67, '{"create_time":"2021-11-02 20:00:05"}', '2021-11-02 20:00:05')
        ('dev4', 'ca', 77, '{"create_time":"2021-11-02 20:00:06"}', '2021-11-02 20:00:06')

  - type: query
    sql: |
      insert into test6_stream_only1 (id, location, value, json, timestamp) values
        ('dev3', 'ca', 58, '{"create_time":"2021-11-02 20:00:09"}', '2021-11-02 20:00:09')
        ('dev3', 'ca', 66, '{"create_time":"2021-11-02 20:00:08"}', '2021-11-02 20:00:08')
        ('dev4', 'ca', 76, '{"create_time":"2021-11-02 20:00:07"}', '2021-11-02 20:00:07')

  - type: check
    target_name: 601-1
    mode: <<or .aggregation_check_mode "sequence">>
    expected_result:
      - - dev1
        - 1
        - '2021-11-02 20:00:00'
        - '2021-11-02 20:00:05'
      - - dev2
        - 1
        - '2021-11-02 20:00:03'
        - '2021-11-02 20:00:08'
      - - dev1
        - 1
        - '2021-11-02 20:00:03'
        - '2021-11-02 20:00:08'
