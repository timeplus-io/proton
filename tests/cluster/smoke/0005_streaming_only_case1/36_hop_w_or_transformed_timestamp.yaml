tags:
  - hopping window
  - timestamp extracted from json
  - bug
description: tranform function in subquery and run tumble on the subquery
cluster:
  - p1k1
  - p3k1
steps:
  - name: 601-1
    type: stream
    query: select id, max(value), window_end from hop(test6_stream_only1, to_datetime64(_tp_append_time,
      3, 'UTC'), interval 2 second, interval 5 second) where window_end < '2021-11-02
      20:00:09' group by id, window_end
    schema:
      - name: id
        type: string
      - name: max(value)
        type: float32
      - name: window_end
        type: datetime64(3)

  - type: wait
    time: 1

  - type: query
    sql: |
      insert into test6_stream_only1 (id, location, value, json, timestamp) values
        ('dev1', 'ca', 60, '{"create_time":"2021-11-02 20:00:01"}', '2020-02-02 20:01:00'
