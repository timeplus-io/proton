tags:
  - tumble window
  - functions
  - func rename
  - bug
description: extract timestamp from json and run tumble on it, and run all func rename.
cluster:
  - p1k1
  - p3k1
steps:
  - name: 601-1
    type: stream
    query: select id, max(value), to_int8(json_extract_string(json, 'int8')) as to_int8,
      to_int16(json_extract_string(json, 'int16')) as to_int16, to_int32(json_extract_string(json,
      'int32')) as to_int32, to_int64(json_extract_string(json, 'int64')) as to_int64,
      to_int128(json_extract_string(json, 'int128')) as to_int128, to_int256(json_extract_string(json,
      'int256')) as to_int256, window_end from tumble(test6_stream_only1, to_time(json_extract_string(json,
      'create_time')), interval 5 second) where window_end < '2021-11-02 20:00:10' group
      by id, json, to_int8, to_int16, to_int32, to_int64, to_int128, to_int256, window_end
    schema:
      - name: id
        type: string
      - name: max(value)
        type: float32
      - name: to_int8
        type: int8
      - name: to_int16
        type: int16
      - name: to_int32
        type: int32
      - name: to_int64
        type: int64
      - name: to_int128
        type: int128
      - name: to_int256
        type: int256
      - name: window_end
        type: datetime64(3)

  - type: wait
    time: 1

  - type: query
    sql: |
      insert into test6_stream_only1 (id, location, value, json, timestamp) values
        ('dev1', 'ca', 60, '{"create_time":"11/02/2021 20:00:01", "1953":"1953-11-02", "float":127.001,
