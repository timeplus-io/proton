tags:
  - local-run
  - versioned_kv
  - multi_shard
  - streaming_tailing
  - stateless_function
description: add into versioned_kv, multi_shard, streaming_tailing, stateless_function
cluster:
  - p1k1
  - p3k1
steps:
  - type: query
    sql: |
      create stream if not exists test14_multishard_9(i float, k1 int, k2 string) primary key k2
      settings mode='versioned_kv', shards=3;
  - type: wait
    time: 2

  - name: "1460"
    type: stream
    query: |
      select concat(upper(k2), to_string(i)),
             k1,
             k2
      from test14_multishard_9;
    schema: 
      - name: concat(upper(k2), to_string(i))
        type: string
      - name: k1
        type: int32
      - name: k2
        type: string
  - type: wait
    time: 1

  - type: query
    sql: |
      insert into test14_multishard_9(i, k1, k2)
      values (2, 1, 'a');

  - type: wait
    time: 1

  - type: query
    sql: |
      insert into test14_multishard_9(i, k1, k2)
      values (1, 1, 'b');

  - type: wait
    time: 1

  - type: query
    sql: |
      insert into test14_multishard_9(i, k1, k2)
      values (3, 1, 'c');

  - type: wait
    time: 1

  - type: query
    sql: |
      insert into test14_multishard_9(i, k1, k2)
      values (2, 1, 'd');

  - type: wait
    time: 1

  - type: query
    sql: |
      insert into test14_multishard_9(i, k1, k2)
      values (5, 1, 'e');

  - type: check
    target_name: "1460"
    expected_result:
      - [A2, 1, a]
      - [B1, 1, b]
      - [C3, 1, c]
      - [D2, 1, d]
      - [E5, 1, e]
