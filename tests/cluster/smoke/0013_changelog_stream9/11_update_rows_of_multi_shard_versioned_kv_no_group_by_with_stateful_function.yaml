tags:
  - versioned_kv
  - multi_shard
  - streaming_aggreagation
  - global_aggregation
  - no_group_by
  - stateful_function
description: update rows of multi_shard versioned_kv no group_by with stateful function
cluster:
  - p1k1
  - p3k1
steps:
  - type: query
    sql: |
      create stream if not exists test14_multishard_9(i float, k1 int, k2 string) primary key k2
      settings mode='versioned_kv', shards=3;
  - type: wait
    time: 2
      
  - name: "1471"
    type: stream
    query: |
      select max(i),
             min(i),
             avg(i),
             count(i)
      from test14_multishard_9 emit periodic 200ms;
    schema: 
      - name: max(i)
        type: float32
      - name: min(i)
        type: float32
      - name: avg(i)
        type: float64
      - name: count(i)
        type: uint64
  - type: wait
    time: 2

  - type: query
    sql: |
      insert into test14_multishard_9(i, k1, k2)
      values (2, 1, 'a');

  - type: wait
    time: 2

  - type: query
    sql: |
      insert into test14_multishard_9(i, k1, k2)
      values (3, 2, 'b');

  - type: wait
    time: 2

  - type: query
    sql: |
      insert into test14_multishard_9(i, k1, k2)
      values (4, 3, 'c');

  - type: wait
    time: 2

  - type: query
    sql: |
      insert into test14_multishard_9(i, k1, k2)
      values (6, 1, 'c');

  - type: wait
    time: 2

  - type: query
    sql: |
      insert into test14_multishard_9(i, k1, k2)
      values (5, 2, 'a');

  - type: wait
    time: 2

  - type: query
    sql: |
      insert into test14_multishard_9(i, k1, k2)
      values (4, 3, 'b');

  - type: check
    target_name: "1471"
    expected_result:
      - [2, 2, 2, 1]
      - [3, 2, 2.5, 2]
      - [4, 2, 3, 3]
      - [6, 2, 3.6666666666666665, 3]
      - [6, 3, 4.666666666666667, 3]
      - [6, 4, 5, 3]
# actual: [[2 2 2 1] [3 2 2.5 2] [4 2 3 3] [6 2 3.75 4] [6 3 4.5 4] [6 3 4.4 5]]