tags:
  - versioned_kv
  - multi_shard
  - streaming_aggreagation
  - global_aggregation
  - no_group_by
  - stateful_function
description: add rows to multi_shard versioned_kv no group_by with stateful function
cluster:
  - p1k1
  - p3k1
steps:
  - type: query
    sql: |
      create stream if not exists test14_multishard_9(i float, k1 int, k2 string) primary key k2
      settings mode='versioned_kv', shards=3;
  - type: wait
    time: 2

  - name: "1470"
    type: stream
    query: |
      select max(i),
             min(i),
             avg(i),
             count(i)
      from test14_multishard_9 emit periodic 200ms;
    schema: 
      - name: max(i)
        type: float32
      - name: min(i)
        type: float32
      - name: avg(i)
        type: float64
      - name: count(i)
        type: uint64
  - type: wait
    time: 1

  - type: query
    sql: |
      insert into test14_multishard_9(i, k1, k2)
      values (2, 1, 'a');

  - type: wait
    time: 1

  - type: query
    sql: |
      insert into test14_multishard_9(i, k1, k2)
      values (3, 2, 'b');

  - type: wait
    time: 1

  - type: query
    sql: |
      insert into test14_multishard_9(i, k1, k2)
      values (4, 3, 'c');

  - type: check
    target_name: "1470"
    expected_result:
      - [2, 2, 2, 1]
      - [3, 2, 2.5, 2]
      - [4, 2, 3, 3]
