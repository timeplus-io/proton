tags:
  - versioned_kv
  - multi_shard
  - streaming_aggreagation
  - global_aggregation
  - group_by
  - no_primary_key
  - stateful_function
description:
  update rows to multi_shard versioned_kv and query with streaming aggreagation
  by primary key
cluster:
  - p1k1
  - p3k1
steps:
  - type: query
    sql: |
      create stream if not exists test14_multishard_9(i float, k1 int, k2 string) primary key k2
      settings mode='versioned_kv', shards=3;
  - type: wait
    time: 2
      
  - name: "1467"
    type: stream
    query: |
      select max(i),
             min(i),
             avg(i),
             count(i),
             k1
      from test14_multishard_9
      group by k1
      order by k1 emit periodic 200ms;
    schema: 
      - name: max(i)
        type: float32
      - name: min(i)
        type: float32
      - name: avg(i)
        type: float64
      - name: count(i)
        type: uint64
      - name: k1
        type: int32
  - type: wait
    time: 2

  - type: query
    sql: |
      insert into test14_multishard_9(i, k1, k2)
      values (2, 1, 'a');

  - type: wait
    time: 2

  - type: query
    sql: |
      insert into test14_multishard_9(i, k1, k2)
      values (3, 1, 'b');

  - type: wait
    time: 2

  - type: query
    sql: |
      insert into test14_multishard_9(i, k1, k2)
      values (4, 1, 'c');

  - type: wait
    time: 2

  - type: query
    sql: |
      insert into test14_multishard_9(i, k1, k2)
      values (4, 2, 'c');

  - type: wait
    time: 2

  - type: query
    sql: |
      insert into test14_multishard_9(i, k1, k2)
      values (5, 2, 'b');

  - type: wait
    time: 2

  - type: query
    sql: |
      insert into test14_multishard_9(i, k1, k2)
      values (6, 2, 'a');

  - type: check
    target_name: "1467"
    expected_result:
      - [2, 2, 2, 1, 1]
      - [3, 2, 2.5, 2, 1]
      - [4, 2, 3, 3, 1]
      - [3, 2, 2.5, 2, 1]
      - [4, 4, 4, 1, 2]
      - [2, 2, 2, 1, 1]
      - [5, 4, 4.5, 2, 2]
      - [0, 0, nan, 0, 1] # [3 3 3 1 1]
      - [6, 4, 5, 3, 2]
