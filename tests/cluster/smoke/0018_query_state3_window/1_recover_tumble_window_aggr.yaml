tags:
  - query_state
description: recover tumble window aggregation from a state checkpoint
cluster:
  - p1k1
steps:
  - type: query
    sql: drop stream if exists test19_state_stream3

  - type: wait
    time: 1

  - type: query
    sql: create stream test19_state_stream3 (id string, location string, value float,
      timestamp datetime64(3) default now64(3))

  - type: wait
    time: 1

  - name: '1965'
    query_id: '1965'
    type: stream
    query: subscribe to select id, sum(value), window_start, window_end from tumble(test19_state_stream3,
      timestamp, interval 5 second) group by id, window_start, window_end emit stream
      settings checkpoint_interval=1
    schema:
      - name: id
        type: string
      - name: sum(value)
        type: float64
      - name: window_start
        type: datetime64(3)
      - name: window_end
        type: datetime64(3)

  - type: wait
    time: 1

  - type: query
    sql: insert into test19_state_stream3(id, location, value, timestamp) values ('dev1',
      'ca', 57.3, '2020-02-02 20:00:00')

  - type: wait
    time: 1

  - type: query
    sql: insert into test19_state_stream3(id, location, value, timestamp) values ('dev1',
      'ca', 66, '2020-02-02 20:00:02')

  - type: wait
    time: 1

  - type: query
    sql: insert into test19_state_stream3(id, location, value, timestamp) values ('dev2',
      'ca', 58.3, '2020-02-02 20:00:04')

  - type: wait
    time: 1

  - type: query
    sql: insert into test19_state_stream3(id, location, value, timestamp) values ('dev2',
      'ca', 80, '2020-02-02 20:00:08')

  - type: wait
    time: 1

  - type: query
    sql: kill query where query_id = '1965'

  - type: wait
    time: 1

  - type: query
    sql: insert into test19_state_stream3(id, location, value, timestamp) values ('dev8',
      'ca', 67, '2020-02-02 20:00:06')

  - type: wait
    time: 1

  - type: query
    sql: insert into test19_state_stream3(id, location, value, timestamp) values ('dev8',
      'ca', 77, '2020-02-02 20:00:07')

  - type: wait
    time: 1

  - type: query
    sql: insert into test19_state_stream3(id, location, value, timestamp) values ('dev6',
      'ca', 66, '2020-02-02 20:00:11')

  - type: wait
    time: 3

  - name: 1965-1
    query_id: 1965-1
    type: stream
    query: recover from '1965'
    schema:
      - name: id
        type: string
      - name: sum(value)
        type: float64
      - name: window_start
        type: datetime64(3)
      - name: window_end
        type: datetime64(3)

  - type: wait
    time: 2

  - type: query
    sql: kill query where query_id='1965' sync

  - type: wait
    time: 1

  - type: query
    sql: unsubscribe to '1965'

  - type: check
    target_name: '1965'
    mode: random
    expected_result:
      - [ dev1, '123.3', '2020-02-02 20:00:00', '2020-02-02 20:00:05' ]
      - [ dev2, '58.3', '2020-02-02 20:00:00', '2020-02-02 20:00:05' ]

  - type: check
    target_name: 1965-1
    mode: random
    expected_result:
      - [ dev2, '80', '2020-02-02 20:00:05', '2020-02-02 20:00:10' ]
      - [ dev8, '144', '2020-02-02 20:00:05', '2020-02-02 20:00:10' ]
