tags:
  - query_state
description: multiple times recover tumble window aggregation with delay interval
  from a state checkpoint
cluster:
  - p1k1
steps:
  - type: query
    sql: drop stream if exists test19_state_stream3

  - type: wait
    time: 1

  - type: query
    sql: create stream test19_state_stream3 (id string, location string, value float,
      timestamp datetime64(3) default now64(3))

  - type: wait
    time: 1

  - name: '1969'
    query_id: '1969'
    type: stream
    query: subscribe to select emit_version() as emit_version, id, count(*), window_start,
      window_end from tumble(test19_state_stream3, timestamp, interval 5 second) group
      by id, window_start, window_end emit stream after window close with delay interval
      2 second settings checkpoint_interval=1
    schema:
      - name: emit_version
        type: int64
      - name: id
        type: string
      - name: count()
        type: uint64
      - name: window_start
        type: datetime64(3)
      - name: window_end
        type: datetime64(3)

  - name: '19691'
    query_id: '19691'
    type: stream
    query: subscribe to select emit_version() as emit_version, id, count(*), window_start,
      window_end from tumble(test19_state_stream3, timestamp, interval 5 second) group
      by id, window_start, window_end emit stream after watermark with delay interval
      2 second settings checkpoint_interval=1
    schema:
      - name: emit_version
        type: int64
      - name: id
        type: string
      - name: count()
        type: uint64
      - name: window_start
        type: datetime64(3)
      - name: window_end
        type: datetime64(3)

  - type: wait
    time: 1

  - type: query
    sql: insert into test19_state_stream3(id, location, value, timestamp) values ('dev1',
      'ca', 57.3, '2020-02-02 20:00:00')

  - type: wait
    time: 1

  - type: query
    sql: insert into test19_state_stream3(id, location, value, timestamp) values ('dev1',
      'ca', 66, '2020-02-02 20:00:01')

  - type: wait
    time: 1

  - type: query
    sql: insert into test19_state_stream3(id, location, value, timestamp) values ('dev2',
      'ca', 58.3, '2020-02-02 20:00:02')

  - type: wait
    time: 1

  - type: query
    sql: insert into test19_state_stream3(id, location, value, timestamp) values ('dev8',
      'ca', 67, '2020-02-02 20:00:11')

  - type: wait
    time: 3

  - type: query
    sql: kill query where query_id = '1969'

  - type: query
    sql: kill query where query_id = '19691'

  - type: wait
    time: 1

  - type: query
    sql: insert into test19_state_stream3(id, location, value, timestamp) values ('dev2',
      'ca', 67, '2020-02-02 20:00:09')

  - type: wait
    time: 1

  - type: query
    sql: insert into test19_state_stream3(id, location, value, timestamp) values ('dev8',
      'ca', 77, '2020-02-02 20:00:09')

  - type: wait
    time: 1

  - type: query
    sql: insert into test19_state_stream3(id, location, value, timestamp) values ('dev3',
      'ca', 57.3, '2020-02-02 20:00:14')

  - type: wait
    time: 3

  - name: 1969-1
    query_id: 1969-1
    type: stream
    query: recover from '1969'
    schema:
      - name: emit_version
        type: int64
      - name: id
        type: string
      - name: count()
        type: uint64
      - name: window_start
        type: datetime64(3)
      - name: window_end
        type: datetime64(3)

  - name: 19691-1
    query_id: 19691-1
    type: stream
    query: recover from '19691'
    schema:
      - name: emit_version
        type: int64
      - name: id
        type: string
      - name: count()
        type: uint64
      - name: window_start
        type: datetime64(3)
      - name: window_end
        type: datetime64(3)

  - type: wait
    time: 2

  - type: query
    sql: kill query where query_id='1969' sync

  - type: query
    sql: kill query where query_id='19691' sync

  - type: wait
    time: 1

  - type: query
    sql: insert into test19_state_stream3(id, location, value, timestamp) values ('dev2',
      'ca', 67, '2020-02-02 20:00:12')

  - type: wait
    time: 1

  - type: query
    sql: insert into test19_state_stream3(id, location, value, timestamp) values ('dev8',
      'ca', 77, '2020-02-02 20:00:13')

  - type: wait
    time: 1

  - type: query
    sql: insert into test19_state_stream3(id, location, value, timestamp) values ('dev3',
      'ca', 57.3, '2020-02-02 20:00:19')

  - type: wait
    time: 3

  - name: 1969-2
    query_id: 1969-2
    type: stream
    query: recover from '1969'
    schema:
      - name: emit_version
        type: int64
      - name: id
        type: string
      - name: count()
        type: uint64
      - name: window_start
        type: datetime64(3)
      - name: window_end
        type: datetime64(3)

  - name: 19691-2
    query_id: 19691-2
    type: stream
    query: recover from '19691'
    schema:
      - name: emit_version
        type: int64
      - name: id
        type: string
      - name: count()
        type: uint64
      - name: window_start
        type: datetime64(3)
      - name: window_end
        type: datetime64(3)

  - type: wait
    time: 3

  - type: query
    sql: kill query where query_id='1969' sync

  - type: query
    sql: kill query where query_id='19691' sync

  - type: wait
    time: 1

  - type: query
    sql: unsubscribe to '1969'

  - type: query
    sql: unsubscribe to '19691'

  - type: check
    target_name: '1969'
    mode: random
    expected_result:
      - [ '0', dev1, '2', '2020-02-02 20:00:00', '2020-02-02 20:00:05' ]
      - [ '0', dev2, '1', '2020-02-02 20:00:00', '2020-02-02 20:00:05' ]
   
  - type: check
    target_name: '19691'
    mode: random
    expected_result:
      - [ '0', dev1, '2', '2020-02-02 20:00:00', '2020-02-02 20:00:05' ]
      - [ '0', dev2, '1', '2020-02-02 20:00:00', '2020-02-02 20:00:05' ]
            
  - type: check
    target_name: 1969-1
    mode: random
    expected_result:
      - [ '1', dev2, '1', '2020-02-02 20:00:05', '2020-02-02 20:00:10' ]
      - [ '1', dev8, '1', '2020-02-02 20:00:05', '2020-02-02 20:00:10' ]
                    
  - type: check
    target_name: 19691-1
    mode: random
    expected_result:
      - [ '1', dev2, '1', '2020-02-02 20:00:05', '2020-02-02 20:00:10' ]
      - [ '1', dev8, '1', '2020-02-02 20:00:05', '2020-02-02 20:00:10' ]
        
  - type: check
    target_name: 1969-2
    mode: random
    expected_result:
      - [ '2', dev2, '1', '2020-02-02 20:00:10', '2020-02-02 20:00:15' ]
      - [ '2', dev3, '1', '2020-02-02 20:00:10', '2020-02-02 20:00:15' ]
      - [ '2', dev8, '2', '2020-02-02 20:00:10', '2020-02-02 20:00:15' ]
        
  - type: check
    target_name: 19691-2
    mode: random
    expected_result:
      - [ '2', dev2, '1', '2020-02-02 20:00:10', '2020-02-02 20:00:15' ]
      - [ '2', dev3, '1', '2020-02-02 20:00:10', '2020-02-02 20:00:15' ]
      - [ '2', dev8, '2', '2020-02-02 20:00:10', '2020-02-02 20:00:15' ]
