tags:
  - local-run
  - query_state
description: tumble window aggregation state checkpoint
cluster:
  - p1k1
steps:
  - type: query
    sql: drop stream if exists test19_state_stream3

  - type: wait
    time: 1

  - type: query
    sql: create stream test19_state_stream3 (id string, location string, value float,
      timestamp datetime64(3) default now64(3))

  - type: wait
    time: 1
  - name: '1964'
    query_id: '1964'
    type: stream
    query: subscribe to select id, sum(value), window_start, window_end from tumble(test19_state_stream3,
      timestamp, interval 5 second) group by id, window_start, window_end emit stream
      settings checkpoint_interval=1
    schema:
      - name: id
        type: string
      - name: sum(value)
        type: float64
      - name: window_start
        type: datetime64(3)
      - name: window_end
        type: datetime64(3)

  - type: wait
    time: 1

  - type: query
    sql: insert into test19_state_stream3(id, location, value, timestamp) values ('dev1',
      'ca', 57.3, '2020-02-02 20:00:00')

  - type: wait
    time: 1

  - type: query
    sql: insert into test19_state_stream3(id, location, value, timestamp) values ('dev1',
      'ca', 66, '2020-02-02 20:00:02')

  - type: wait
    time: 1

  - type: query
    sql: insert into test19_state_stream3(id, location, value, timestamp) values ('dev2',
      'ca', 58.3, '2020-02-02 20:00:04')

  - type: wait
    time: 1

  - type: query
    sql: insert into test19_state_stream3(id, location, value, timestamp) values ('dev8',
      'ca', 67, '2020-02-02 20:00:08')

  - type: wait
    time: 1

  - type: query
    sql: kill query where query_id = '1964'

  - type: wait
    time: 1

  - type: query
    sql: unsubscribe to '1964'

  - type: check
    target_name: '1964'
    mode: random
    expected_result:
      - [ dev1, '123.3', '2020-02-02 20:00:00', '2020-02-02 20:00:05' ]
      - [ dev2, '58.3', '2020-02-02 20:00:00', '2020-02-02 20:00:05' ]
