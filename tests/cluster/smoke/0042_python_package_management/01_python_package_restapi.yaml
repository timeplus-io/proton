tags:
  - restapi
  - skip

cluster:
  - p1k1

description: |
  Test for Python libraries operation with restapi:
  Main Steps:
    1. Install 3rd library python package (arrow)
    2. Check package install successful
    3. Delete python package
    4. Check package uninstall successful

steps:
  - type: command
    name: python-pkg-01-install
    <<if eq .nodes "1">>
    node: [p1]
    <<else>>
    node: [p2]
    <<end>>
    shell: |
      curl -X POST http://localhost:8123/proton/v1/python_packages -H "Content-Type: text/plain; charset=utf-8" -d '{"name": "arrow"}' 2>/dev/null

  - type: command
    name: python-pkg-01-install-specified
    <<if eq .nodes "1">>
    node: [p1]
    <<else>>
    node: [p2]
    <<end>>
    shell: |
      curl -X POST http://localhost:8123/proton/v1/python_packages \
        -H "Content-Type: text/plain; charset=utf-8" \
        -H "x-timeplus-user: proton" \
        -H "x-timeplus-key: proton@t+" \
        -d '{"name": "pandas", "VERSION": "2.3.2"}'

  - type: wait
    time: 10

  - type: command
    name: python-pkg-01-get-arrow
    node: [p1]
    shell: |
      curl -X GET http://localhost:8123/proton/v1/python_packages  2>/dev/null | jq -c '.data[] | select(.name == "arrow") | length > 0'

  - type: command
    name: python-pkg-01-get-pandas
    node: [p1]
    shell: |
      curl -X GET http://localhost:8123/proton/v1/python_packages \
        -H "x-timeplus-user: proton" \
        -H "x-timeplus-key: proton@t+" 2>/dev/null | jq -c '.data[] | select(.name == "pandas")'

  - type: check
    target_name: python-pkg-01-get-arrow
    expected_result: ['true']

  - type: check
    target_name: python-pkg-01-get-pandas
    expected_result: ['{"name":"pandas","version":"==2.3.2"}']

  - type: wait
    time: 1

  - type: command
    <<if eq .nodes "1">>
    node: [p1]
    <<else>>
    node: [p3]
    <<end>>
    shell: |
      curl -X DELETE http://localhost:8123/proton/v1/python_packages/arrow 2>/dev/null

  - type: wait
    time: 1

  - type: command
    <<if eq .nodes "1">>
    node: [p1]
    <<else>>
    node: [p3]
    <<end>>
    shell: |
      curl -X DELETE http://localhost:8123/proton/v1/python_packages/pandas \
        -H "x-timeplus-user: proton" \
        -H "x-timeplus-key: proton@t+" 2>/dev/null

  - type: wait
    time: 5

  - type: command
    name: python-pkg-01-uninstall-arrow
    node: [p1]
    shell: |
      curl -X GET http://localhost:8123/proton/v1/python_packages  2>/dev/null | jq -c '.data[] | select(.name == "arrow") | length > 0'

  - type: command
    name: python-pkg-01-uninstall-pandas
    node: [p1]
    shell: |
      curl -X GET http://localhost:8123/proton/v1/python_packages \
        -H "x-timeplus-user: proton" \
        -H "x-timeplus-key: proton@t+" 2>/dev/null | jq -c '.data[] | select(.name == "arrow") | length > 0'

  - type: check
    target_name: python-pkg-01-uninstall-arrow
    expected_result: ['']

  - type: check
    target_name: python-pkg-01-uninstall-pandas
    expected_result: ['']
