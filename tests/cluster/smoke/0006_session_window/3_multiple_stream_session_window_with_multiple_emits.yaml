tags:
  - session window
  - not_supported_hybrid # Substream aggregating does not support hybrid aggregator
description: 3 unique stream session window based id and location, session window
  interval 1s, input data in 2 batches and 1st batch is emit dur to force timeout
  threshold is it while 2nd is not emit for not hitting threshold
cluster:
  - p1k1
  - p3k1
steps:
  - name: '701'
    type: stream
    query: |
      select count(), to_string(window_start), to_string(window_end), id
      from session(test7_session, timestamp, 2s) partition by id
      group by window_start, window_end
    schema:
      - name: count()
        type: uint64
      - name: to_string(window_start)
        type: string
      - name: to_string(window_end)
        type: string
      - name: id
        type: string

  - type: wait
    time: 1

  - type: query
    sql: |
      insert into test7_session (id, location, value, json, timestamp) values
        ('dev1', 'ca', 57.3, '"create_time":"2021-11-02 20:00:00"', '2020-02-02 20:00:00')
        ('dev2', 'ca', 58.3, '"create_time":"2021-11-02 20:00:00"', '2020-02-02 20:00:00')
        ('dev3', 'ca', 58.3, '"create_time":"2021-11-02 20:00:00"', '2020-02-02 20:00:00')
        ('dev1', 'ca', 57.3, '"create_time":"2021-11-02 20:00:00"', '2020-02-02 20:00:01')
        ('dev2', 'ca', 58.3, '"create_time":"2021-11-02 20:00:00"', '2020-02-02 20:00:01')
        ('dev3', 'ca', 58.3, '"create_time":"2021-11-02 20:00:00"', '2020-02-02 20:00:01')
        ('dev4', 'ca', 58.3, '"create_time":"2021-11-02 20:00:00"', '2020-02-02 20:00:05')
        ('dev1', 'ca', 57.3, '"create_time":"2021-11-02 20:00:00"', '2020-02-02 20:00:06')
        ('dev2', 'ca', 58.3, '"create_time":"2021-11-02 20:00:00"', '2020-02-02 20:00:06')
        ('dev3', 'ca', 58.3, '"create_time":"2021-11-02 20:00:00"', '2020-02-02 20:00:06')
        ('dev1', 'ca', 57.3, '"create_time":"2021-11-02 20:00:00"', '2020-02-02 20:00:07')
        ('dev2', 'ca', 58.3, '"create_time":"2021-11-02 20:00:00"', '2020-02-02 20:00:07')
        ('dev3', 'ca', 58.3, '"create_time":"2021-11-02 20:00:00"', '2020-02-02 20:00:07')
        ('dev4', 'ca', 58.3, '"create_time":"2021-11-02 20:00:00"', '2020-02-02 20:00:11')

  - type: check
    target_name: '701'
    expected_result:
      - [ '2', '2020-02-02 20:00:00.000', '2020-02-02 20:00:03.000', dev1 ]
      - [ '2', '2020-02-02 20:00:00.000', '2020-02-02 20:00:03.000', dev2 ]
      - [ '2', '2020-02-02 20:00:00.000', '2020-02-02 20:00:03.000', dev3 ]
      - [ '1', '2020-02-02 20:00:05.000', '2020-02-02 20:00:07.000', dev4 ]

