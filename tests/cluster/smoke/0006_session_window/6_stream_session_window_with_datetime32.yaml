tags:
  - session window
  - not_supported_hybrid # Substream aggregating does not support hybrid aggregator
description: stream session window with interval triggered emit, 5s interval with
  session_size 25s
cluster:
  - p1k1
  - p3k1
steps:
  - name: '701'
    type: stream
    query: |
      select max(value), to_string(window_start), to_string(window_end), id
      from session(test7_session, to_start_of_interval(timestamp, 2s), 5s) partition by id
      group by window_start, window_end
    schema:
      - name: max(value)
        type: float32
      - name: to_string(window_start)
        type: string
      - name: to_string(window_end)
        type: string
      - name: id
        type: string

  - type: wait
    time: 1

  - type: query
    sql: |
      insert into test7_session (id, location, value, json, timestamp) values
        ('dev1', 'ca', 57.3, '"create_time":"2021-11-02 20:00:00"', '2020-02-02 20:00:00')
        ('dev2', 'ca', 58.3, '"create_time":"2021-11-02 20:00:00"', '2020-02-02 20:00:01')

  - type: query
    sql: |
      insert into test7_session (id, location, value, json, timestamp) values
        ('dev1', 'ca', 66, '"create_time":"2021-11-02 20:00:00"', '2020-02-02 20:00:01')
        ('dev2', 'ca', 60, '"create_time":"2021-11-02 20:00:00"', '2020-02-02 20:00:02')

  - type: query
    sql: |
      insert into test7_session (id, location, value, json, timestamp) values
        ('dev2', 'ca', 67, '"create_time":"2021-11-02 20:00:11"', '2020-02-02 20:00:08')

  - type: check
    target_name: '701'
    expected_result:
      - [ '60', '2020-02-02 20:00:00', '2020-02-02 20:00:07', dev2 ]

