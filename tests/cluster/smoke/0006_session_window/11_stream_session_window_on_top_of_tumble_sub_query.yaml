tags:
  - session window
  - substream
  - not_supported_hybrid # Substream aggregating does not support hybrid aggregator
description: stream session window with multiple session keys, triggered by interval,
  2s interval with session_size 10, session based on tumble
cluster:
  - p1k1
  - p3k1
steps:
  - name: '701'
    type: stream
    query: |
      with transformed as (
      select id, location, max(value) as max_v, window_start as w_s, window_end as w_e
      from tumble(test7_session, to_datetime64(json_extract_string(json, 'create_time'), 3), 2s)
      group by id, location, window_start, window_end
      )
      select count(max_v), to_string(window_start), to_string(window_end), id, location
      from session(transformed, w_e, 2001ms)
      partition by id, location
      group by window_start, window_end
    schema:
      - name: count(max_v)
        type: uint64
      - name: to_string(window_start)
        type: string
      - name: to_string(window_end)
        type: string
      - name: id
        type: string
      - name: location
        type: string

  - type: wait
    time: 1

  - type: query
    sql: |
      insert into test7_session (id, location, value, json, timestamp) values
        ('dev1', 'ca', 57.3, '{"create_time":"2020-02-02 20:00:00"}', '2020-02-02 20:00:00')
        ('dev2', 'bj', 58.3, '{"create_time":"2020-02-02 20:00:01"}', '2020-02-02 20:00:01')
        ('dev2', 'bj', 58.3, '{"create_time":"2020-02-02 20:00:02"}', '2020-02-02 20:00:02')

  - type: query
    sql: |
      insert into test7_session (id, location, value, json, timestamp) values
        ('dev1', 'ca', 66, '{"create_time":"2020-02-02 20:00:03"}', '2020-02-02 20:00:03')
        ('dev2', 'ca', 60, '{"create_time":"2020-02-02 20:00:04"}', '2020-02-02 20:00:04')

  - type: query
    sql: |
      insert into test7_session (id, location, value, json, timestamp) values
        ('dev1', 'ca', 67, '{"create_time":"2020-02-02 20:00:15"}', '2020-02-02 20:00:15')
        ('dev2', 'ca', 67, '{"create_time":"2020-02-02 20:00:16"}', '2020-02-02 20:00:16')
        ('dev3', 'ca', 67, '{"create_time":"2020-02-02 20:00:20"}', '2020-02-02 20:00:20')

  - type: check
    target_name: '701'
    mode: random
    expected_result:
      - [ '1', '2020-02-02 20:00:06.000', '2020-02-02 20:00:16.005', dev2, ca ]
      - [ '2', '2020-02-02 20:00:02.000', '2020-02-02 20:00:12.005', dev1, ca ]

