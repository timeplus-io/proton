tags:
  - session window
  - not_supported_hybrid # Substream aggregating does not support hybrid aggregator
description: stream session window with force timeout, session window interval 1s,
  input data with 1s interval continuously and session window emit at 5s
cluster:
  - p1k1
  - p3k1
steps:
  - name: '701'
    type: stream
    query: |
      select count(), to_string(window_start), to_string(window_end), id
      from session(test7_session, timestamp, 1s) partition by id
      group by window_start, window_end
    schema:
      - name: count()
        type: uint64
      - name: to_string(window_start)
        type: string
      - name: to_string(window_end)
        type: string
      - name: id
        type: string

  - type: wait
    time: 1

  - type: query
    sql: |
      insert into test7_session (id, location, value, json, timestamp) values
        ('dev1', 'ca', 57.3, '"create_time":"2021-11-02 20:00:00"', '2020-02-02 20:00:00')
        ('dev2', 'ca', 58.3, '"create_time":"2021-11-02 20:00:00"', '2020-02-02 20:00:00')
        ('dev1', 'ca', 57.3, '"create_time":"2021-11-02 20:00:00"', '2020-02-02 20:00:00.999')
        ('dev2', 'ca', 58.3, '"create_time":"2021-11-02 20:00:00"', '2020-02-02 20:00:00.999')
        ('dev1', 'ca', 57.3, '"create_time":"2021-11-02 20:00:00"', '2020-02-02 20:00:01')
        ('dev2', 'ca', 58.3, '"create_time":"2021-11-02 20:00:00"', '2020-02-02 20:00:01')
        ('dev1', 'ca', 57.3, '"create_time":"2021-11-02 20:00:00"', '2020-02-02 20:00:01.999')
        ('dev2', 'ca', 58.3, '"create_time":"2021-11-02 20:00:00"', '2020-02-02 20:00:01.999')
        ('dev1', 'ca', 57.3, '"create_time":"2021-11-02 20:00:00"', '2020-02-02 20:00:02')
        ('dev2', 'ca', 58.3, '"create_time":"2021-11-02 20:00:00"', '2020-02-02 20:00:02')
        ('dev1', 'ca', 57.3, '"create_time":"2021-11-02 20:00:00"', '2020-02-02 20:00:02.999')
        ('dev2', 'ca', 58.3, '"create_time":"2021-11-02 20:00:00"', '2020-02-02 20:00:02.999')
