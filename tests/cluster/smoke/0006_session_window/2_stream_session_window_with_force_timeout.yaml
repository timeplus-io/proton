        ('dev2', 'ca', 58.3, '"create_time":"2021-11-02 20:00:00"', '2020-02-02 20:00:03')
        ('dev1', 'ca', 57.3, '"create_time":"2021-11-02 20:00:00"', '2020-02-02 20:00:03.999')
