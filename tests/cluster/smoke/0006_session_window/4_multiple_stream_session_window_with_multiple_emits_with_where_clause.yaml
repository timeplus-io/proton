tags:
  - session window
  - not_supported_hybrid # Substream aggregating does not support hybrid aggregator
description: 3 unique stream session window based id and location, session window
  interval 1s, input data in 2 batches and triggle 2 batch emits, where clause filter
  events
cluster:
  - p1k1
  - p3k1
steps:
  - name: '701'
    type: stream
    query: |
      select emit_version() as emit_version, count(), to_string(window_start), to_string(window_end), id
      from session(test7_session, timestamp, 2s)
      where id != 'dev4'
      partition by id
      group by window_start, window_end
    schema:
      - name: emit_version
        type: int64
      - name: count()
        type: uint64
      - name: to_string(window_start)
        type: string
      - name: to_string(window_end)
        type: string
      - name: id
        type: string

  - type: wait
    time: 1

  - type: query
    sql: |
      insert into test7_session (id, location, value, json, timestamp) values
        ('dev1', 'ca', 57.3, '"create_time":"2021-11-02 20:00:00"', '2020-02-02 20:00:00')
        ('dev2', 'ca', 58.3, '"create_time":"2021-11-02 20:00:00"', '2020-02-02 20:00:00')
        ('dev3', 'ca', 58.3, '"create_time":"2021-11-02 20:00:00"', '2020-02-02 20:00:00')
        ('dev1', 'ca', 57.3, '"create_time":"2021-11-02 20:00:00"', '2020-02-02 20:00:01')
        ('dev2', 'ca', 58.3, '"create_time":"2021-11-02 20:00:00"', '2020-02-02 20:00:01')
        ('dev3', 'ca', 58.3, '"create_time":"2021-11-02 20:00:00"', '2020-02-02 20:00:01')
        ('dev4', 'ca', 58.3, '"create_time":"2021-11-02 20:00:00"', '2020-02-02 20:00:05')
        ('dev2', 'ca', 58.3, '"create_time":"2021-11-02 20:00:00"', '2020-02-02 20:00:02')
        ('dev3', 'ca', 58.3, '"create_time":"2021-11-02 20:00:00"', '2020-02-02 20:00:02')
        ('dev2', 'ca', 58.3, '"create_time":"2021-11-02 20:00:00"', '2020-02-02 20:00:04')
        ('dev3', 'ca', 58.3, '"create_time":"2021-11-02 20:00:00"', '2020-02-02 20:00:04')

  - type: check
    target_name: '701'
    expected_result:
      - [ '0', '3', '2020-02-02 20:00:00.000', '2020-02-02 20:00:04.000', dev2 ]
      - [ '0', '3', '2020-02-02 20:00:00.000', '2020-02-02 20:00:04.000', dev3 ]

