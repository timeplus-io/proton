tags:
  - local-run
  - session window
  - substream
  - not_supported_hybrid # Substream aggregating does not support hybrid aggregator
description: stream session window with session_size triggered emit, 2s interval with
  session_size 10s
cluster:
  - p1k1
  - p3k1
steps:
  - name: '701'
    type: stream
    query: |
      select max(value), to_string(window_start), to_string(window_end), id
      from session(test7_session, timestamp, 2s) partition by id
      group by window_start, window_end
    schema:
      - name: max(value)
        type: float32
      - name: to_string(window_start)
        type: string
      - name: to_string(window_end)
        type: string
      - name: id
        type: string

  - type: wait
    time: 1

  - type: query
    sql: |
      insert into test7_session (id, location, value, json, timestamp) values
        ('dev1', 'ca', 57.3, '"create_time":"2021-11-02 20:00:00"', '2020-02-02 20:00:00')
        ('dev2', 'ca', 58.3, '"create_time":"2021-11-02 20:00:00"', '2020-02-02 20:00:00')

  - type: query
    sql: |
      insert into test7_session (id, location, value, json, timestamp) values
        ('dev1', 'ca', 66, '"create_time":"2021-11-02 20:00:02"', '2020-02-02 20:00:02')

  - type: query
    sql: |
      insert into test7_session (id, location, value, json, timestamp) values
        ('dev1', 'ca', 67, '"create_time":"2021-11-02 20:00:11"', '2020-02-02 20:00:15')

  - type: check
    target_name: '701'
    expected_result:
      - [ 57.3, '2020-02-02 20:00:00.000', '2020-02-02 20:00:02.000', dev1 ]
      - [ 66, '2020-02-02 20:00:02.000', '2020-02-02 20:00:12.000', dev1 ]

