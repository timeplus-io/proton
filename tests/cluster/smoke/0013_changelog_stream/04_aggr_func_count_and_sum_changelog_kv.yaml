tags:
  - changelog_kv_aggr
description: aggregation function count and sum changelog_kv
cluster:
  - p1k1
  - p3k1
steps:
  - type: query
    sql: drop stream if exists test14_changelog_kv_stream;
  - type: wait
    time: 1

  - type: query
    sql: |
      create stream test14_changelog_kv_stream(id int, val float) primary
      key id settings mode='changelog_kv';
  - type: wait
    time: 2

  - type: query
    sql: insert into test14_changelog_kv_stream(id, val) values (1, 1.1), (2, 2.2), (3, 3.3);
  - type: wait
    time: 1

  - name: "1404"
    type: stream
    query: |
      select count(val), min(val), max(val), sum(val), avg(val) from test14_changelog_kv_stream
      emit periodic 1s;
    schema:
      - name: count(val)
        type: uint64
      - name: min(val)
        type: float32
      - name: max(val)
        type: float32
      - name: sum(val)
        type: float64
      - name: avg(val)
        type: float64
  - type: wait
    time: 2

  - name: 1404-2
    type: stream
    query: |
      select count_if(val, val > 2), min_if(val, val > 2), max_if(val, val > 2),
      sum_if(val, val > 2), avg_if(val, val > 2) from test14_changelog_kv_stream emit
      periodic 1s;
    schema:
      - name: count_if(val, val > 2)
        type: uint64
      - name: min_if(val, val > 2)
        type: float32
      - name: max_if(val, val > 2)
        type: float32
      - name: sum_if(val, val > 2)
        type: float64
      - name: avg_if(val, val > 2)
        type: float64
  - type: wait
    time: 2

  - type: query
    sql: insert into test14_changelog_kv_stream(id, val) values (4, 4.4), (5, 5.5);
  - type: wait
    time: 2

  - type: query
    sql:
      insert into test14_changelog_kv_stream(id, val, _tp_delta) values (3, 3.3, -1);
  - type: wait
    time: 2

  - type: query
    sql:
      insert into test14_changelog_kv_stream(id, val, _tp_delta) values (1, 1.1, -1);
  - type: wait
    time: 2
    
  - type: query
    sql:
      insert into test14_changelog_kv_stream(id, val, _tp_delta) values (5, 5.5, -1);

  - type: check
    target_name: "1404"
    expected_result:
      - ["3", "1.1", "3.3", "6.6", "2.2"]
      - ["5", "1.1", "5.5", "16.5", "3.3"]
      - ["4", "1.1", "5.5", "13.2", "3.3"]
      - ["3", "2.2", "5.5", "12.1", "4.0333333"]
      - ["2", "2.2", "4.4", "6.6", "3.3"]

  - type: check
    target_name: 1404-2
    expected_result:
      - ["2", "2.2", "3.3", "5.5", "2.75"]
      - ["4", "2.2", "5.5", "15.4", "3.85"]
      - ["3", "2.2", "5.5", "12.1", "4.0333333"]
      - ["3", "2.2", "5.5", "12.1", "4.0333333"]
      - ["2", "2.2", "4.4", "6.6", "3.3"]
