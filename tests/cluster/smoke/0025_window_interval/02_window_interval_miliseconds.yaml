    tumble(stream_for_interval_milliseconds, date, 1ms) partition by id group by window_start,
    window_end
  schema:
  - name: id
    type: int32
  - name: sum(value)
    type: int64
  - name: to_string(window_start)
    type: string
  - name: to_string(window_end)
    type: string
- type: wait
