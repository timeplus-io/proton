tags:
- query_state
- stream_join_stream
- to_support
- bug # for to_support
description: recover append-only innner latest join append-only from state checkpoint
cluster:
- p1k1

steps:
- type: query
  sql: drop stream if exists test19_left_stream1
- type: query
  sql: drop stream if exists test19_right_stream1
- type: wait
  time: 1

- type: query
  sql: create stream if not exists test19_left_stream1 (i int, s string, ts datetime)
- type: wait
  time: 1

- type: query
  sql: create stream if not exists test19_right_stream1 (ii int, ss string, tts datetime)
- type: wait
  name: 1

- name: '19214'
  type: stream
  query_id: '19214'
  query: subscribe to select s, ss, _tp_delta from test19_left_stream1 inner latest
    join test19_right_stream1 on i=ii settings checkpoint_interval=1
  schema:
  - name: s
    type: string
  - name: ss
    type: string
  - name: _tp_delta
    type: int8
- type: wait
  time: 1

- type: query
  sql: insert into test19_left_stream1(i, s) values
  schema:
  - name: i
    type: int32
  - name: s
    type: string
  inputs:
  - [1, 's']
- type: wait
  time: 1

- type: query
  sql: insert into test19_right_stream1(ii, ss) values
  schema:
  - name: ii
    type: int32
  - name: ss
    type: string
  inputs:
  - [1, 's1']
- type: wait
  time: 1

- type: query
  sql: insert into test19_right_stream1(ii, ss) values
  schema:
  - name: ii
    type: int32
  - name: ss
    type: string
  inputs:
  - [1, 's2']
- type: wait
  time: 1

- type: query
  sql: kill query where query_id = '19214'
- type: wait
  time: 3

- type: query
  sql: insert into test19_left_stream1(i, s) values
  schema:
  - name: i
    type: int32
  - name: s
    type: string
  inputs:
  - [1, 's3']
- type: wait
  name: 3

- name: 19214-1
  type: stream
  query: recover from '19214'
  schema:
  - name: s
    type: string
  - name: ss
    type: string
  - name: _tp_delta
    type: int8
- type: wait
  time: 4

- type: query
  sql: unsubscribe to '19214'

- type: check
  target_name: '19214'
  expected_result:
  - [s, s1, 1]
  - [s, s1, -1]
  - [s, s2, 1]

- type: check
  target_name: 19214-1
  expected_result:
  - [s, s2, -1]
  - [s3, s2, 1]
