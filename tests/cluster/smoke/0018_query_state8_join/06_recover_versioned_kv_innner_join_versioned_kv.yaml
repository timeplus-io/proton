tags:
- query_state
- stream_join_stream
- to_support
description: recover versioned-kv innner join versioned kv from state checkpoint
cluster:
- p1k1

steps:
- type: query
  sql: drop stream if exists test19_left_stream1
- type: query
  sql: drop stream if exists test19_right_stream1
- type: wait
  time: 1

- type: query
  sql: create stream if not exists test19_left_stream1 (i int, s string, ts datetime)
    primary key i settings mode='versioned_kv'

- type: wait
  time: 1

- type: query
  sql: create stream if not exists test19_right_stream1 (ii int, ss string, tts datetime)
    primary key ii settings mode='versioned_kv'

- type: wait
  name: 1

- name: '19208'
  type: stream
  query_id: '19208'
  query: subscribe to select s, ss from test19_left_stream1 inner join test19_right_stream1
    on i=ii settings checkpoint_interval=1
  schema:
  - name: s
    type: string
  - name: ss
    type: string
- type: wait
  time: 1

- type: query
  sql: insert into test19_right_stream1(ii, ss, tts) values (1, 's1', '2022-05-23 15:45:10')
- type: wait
  time: 1

- type: query
  sql: insert into test19_right_stream1(ii, ss, tts) values (1, 's2', '2022-05-23 15:45:11')
- type: wait
  time: 1

- type: query
  sql: insert into test19_left_stream1(i, s, ts) values (1, 's', '2022-05-23 15:45:10')
- type: wait
  time: 1

- type: query
  sql: kill query where query_id = '19208'
- type: wait
  time: 3

- type: query
  sql: insert into test19_left_stream1(i, s, ts) values (1, 'ss', '2022-05-23 15:45:11')
- type: wait
  name: 1

- name: 19208-1
  type: stream
  query: recover from '19208'
  schema:
  - name: s
    type: string
  - name: ss
    type: string
- type: wait
  time: 3

- type: wait
  time: 1

- type: query
  sql: unsubscribe to '19208'

- type: check
  target_name: '19208'
  expected_result:
  - [s, s2]

- type: check
  target_name: 19208-1
  expected_result:
  - [ss, s2]
