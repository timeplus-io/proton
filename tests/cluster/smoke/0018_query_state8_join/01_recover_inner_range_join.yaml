tags:
- query_state
- stream_join_stream
description: recover inner range join from state checkpoint
cluster:
- p1k1

steps:
- type: query
  sql: drop stream if exists test19_left_stream1
- type: query
  sql: drop stream if exists test19_right_stream1
- type: wait
  time: 1

- type: query
  sql: create stream if not exists test19_left_stream1 (i int, s string, ts datetime)
- type: wait
  time: 1

- type: query
  sql: create stream if not exists test19_right_stream1 (ii int, ss string, tts datetime)
- type: wait
  name: 1

- name: '19201'
  type: stream
  query_id: '19201'
  query: subscribe to select s, ss from test19_left_stream1 inner join test19_right_stream1 on i=ii and date_diff_within(10s, ts, tts) settings checkpoint_interval=1
  schema:
  - name: s
    type: string
  - name: ss
    type: string
- type: wait
  time: 3

- type: query
  sql: insert into test19_left_stream1(i, s, ts) values
  schema:
  - name: i
    type: int32
  - name: s
    type: string
  - name: ts
    type: datetime
  inputs:
  - [1, 's', '2022-05-23 15:45:10']
- type: wait
  time: 1

- type: query
  sql: insert into test19_right_stream1(ii, ss, tts) values
  schema:
  - name: ii
    type: int32
  - name: ss
    type: string
  - name: tts
    type: datetime
  inputs:
  - [1, 's1', '2022-05-23 15:44:59']
  - [1, 's2', '2022-05-23 15:45:00']
  - [1, 's3', '2022-05-23 15:45:09']
- type: wait
  time: 2

- type: query
  sql: kill query where query_id = '19201'
- type: wait
  time: 3

- type: query
  sql: insert into test19_right_stream1(ii, ss, tts) values
  schema:
  - name: ii
    type: int32
  - name: ss
    type: string
  - name: tts
    type: datetime
  inputs:
  - [1, 's4', '2022-05-23 15:45:10']
  - [1, 's5', '2022-05-23 15:45:15']
  - [1, 's6', '2022-05-23 15:45:19']
  - [1, 's7', '2022-05-23 15:45:20']
  - [1, 's8', '2022-05-23 15:45:21']
- type: wait
  time: 2

- name: 19201-1
  type: stream
  query: recover from '19201'
  schema:
  - name: s
    type: string
  - name: ss
    type: string
- type: wait
  time: 7

- type: query
  sql: unsubscribe to '19201'

- type: check
  target_name: '19201'
  expected_result:
  - [s, s2]
  - [s, s3]

- type: check
  target_name: 19201-1
  expected_result:
  - [s, s4]
  - [s, s5]
  - [s, s6]
  - [s, s7]
