tags:
- seek_to
- bug
description: event predicate in materialized view
cluster:
- p1k1
- p3k1
steps:
- type: wait
  time: 2

- type: query
  sql: drop view if exists seek_to_mv
- type: wait
  time: 2

- type: query
  sql: "create materialized view seek_to_mv as (select window_start as win_start, window_end
    as win_end, sum(i) as cnt from tumble(test21_limit_by_stream, 2s) where _tp_time
    >= '2022-12-01 00:00:01.111' group by window_start, window_end)"
- type: wait
  time: 5

- name: '2100'
  type: stream
  query: select win_start, win_end, cnt from seek_to_mv where _tp_sn >= 3
  schema:
  - name: win_start
    type: datetime64(3)
  - name: win_end
    type: datetime64(3)
  - name: cnt
    type: int64
- type: wait
  time: 5

- name: '2101'
  type: stream
  query: select win_start, win_end, cnt from table(seek_to_mv)
  schema:
  - name: win_start
    type: datetime64(3)
  - name: win_end
    type: datetime64(3)
  - name: cnt
    type: int64
- type: wait
  time: 2

- name: '2102'
  type: stream
  query: select window_start, sum(cnt) from tumble(seek_to_mv, win_start, 2s) where
    _tp_time >= now() - 1m group by window_start emit timeout 1s
  schema:
  - name: window_start
    type: datetime64(3)
  - name: sum(cnt)
    type: int64
- type: wait
  time: 2

- type: query
  sql: drop view if exists seek_to_mv

- type: check
  target_name: '2100'
  expected_result:
  - ['2022-12-01 00:00:00+00:00', '2022-12-01 00:00:02+00:00', 1]
  - ['2022-12-01 00:00:02+00:00', '2022-12-01 00:00:04+00:00', 5]

- type: check
  target_name: '2101'
  expected_result:
  - ['2022-12-01 00:00:00+00:00', '2022-12-01 00:00:02+00:00', 1]
  - ['2022-12-01 00:00:02+00:00', '2022-12-01 00:00:04+00:00', 5]

- type: check
  target_name: '2102'
  expected_result:
  - ['2022-12-01 00:00:00+00:00', 1]
  - ['2022-12-01 00:00:02+00:00', 5]
