tags:
- seek_to
- bug
description: event time predicates for multiple streams in join query
cluster:
- p1k1
- p3k1
steps:
- type: wait
  time: 1

- type: query
  sql: drop stream if exists test21_limit_by_stream_2
- type: wait
  time: 2

- type: query
  sql: create stream test21_limit_by_stream_2(i int, s string, t datetime64(3,
    'UTC')) settings event_time_column='t'
- type: wait
  time: 2

- type: query
  sql: insert into test21_limit_by_stream_2(i, s, t) values
  schema:
  - name: i
    type: int32
  - name: s
    type: string
  - name: t
    type: datetime64(3)
  inputs:
  - [1, 's1', '2022-12-01 00:00:01.111']

- type: query
  sql: insert into test21_limit_by_stream_2(i, s, t) values
  schema:
  - name: i
    type: int32
  - name: s
    type: string
  - name: t
    type: datetime64(3)
  inputs:
  - [1, 's1', '2022-12-01 00:00:02.111']

- type: query
  sql: insert into test21_limit_by_stream_2(i, s, t) values
  schema:
  - name: i
    type: int32
  - name: s
    type: string
  - name: t
    type: datetime64(3)
  inputs:
  - [2, 's2', '2022-12-01 00:00:03.111']

- type: query
  sql: insert into test21_limit_by_stream_2(i, s, t) values
  schema:
  - name: i
    type: int32
  - name: s
    type: string
  - name: t
    type: datetime64(3)
  inputs:
  - [2, 's2', '2022-12-01 00:00:04.111']
- type: wait
  time: 2

- name: '2100'
  type: stream
  query: "select a.i, b.s, c.t from test21_limit_by_stream as a join test21_limit_by_stream
    as b on a.i = b.i join test21_limit_by_stream as c on b.i = c.i where a._tp_time
    >= '2022-12-01 00:00:01.111' and b._tp_time >= '2022-12-01 00:00:02.111' and c._tp_time
    >= '2022-12-01 00:00:03.111'"
  schema:
  - name: a.i
    type: int32
  - name: b.s
    type: string
  - name: c.t
    type: datetime64(3)
- type: wait
  time: 2

- name: '2101'
  type: stream
  query: "select a.i, count() from test21_limit_by_stream as a join test21_limit_by_stream
    as b on a.i = b.i where a._tp_time >= '2022-12-01 00:00:01.111' and b._tp_time
    >= '2022-12-01 00:00:02.111' group by a.i emit periodic 1s"
  schema:
  - name: i
    type: int32
  - name: count()
    type: uint64
- type: wait
  time: 2

- name: '2102'
  type: stream
  query: "select i, s from test21_limit_by_stream as a  join test21_limit_by_stream_2
    as b on a.i = b.i where test21_limit_by_stream._tp_sn > 4 and default.test21_limit_by_stream_2._tp_sn
    > 5"
  schema:
  - name: i
    type: int32
  - name: s
    type: string
- type: wait
  time: 2

- name: '2103'
  type: stream
  query: select count() from test21_limit_by_stream as a  join test21_limit_by_stream_2
    as b on a.i = b.i where test21_limit_by_stream._tp_sn > 3 and default.test21_limit_by_stream_2._tp_sn
    < 7 emit periodic 1s
  schema:
  - name: count()
    type: uint64

- type: check
  target_name: '2100'
  mode: random
  expected_result:
  - [3, s3, '2022-12-01 00:00:03.111000+00:00']
  - [4, s4, '2022-12-01 00:00:04.111000+00:00']

- type: check
  target_name: '2101'
  mode: random
  expected_result:
  - [2, 1]
  - [3, 1]
  - [4, 1]

- type: check
  target_name: '2102'
  expected_result:
  - [2, s2]

- type: check
  target_name: '2103'
  expected_result:
  - [3]
