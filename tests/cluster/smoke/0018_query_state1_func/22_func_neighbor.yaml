tags:
  - query_state
description: function neighbor state checkpoint
cluster:
  - p1k1
steps:
  - type: query
    sql: drop stream if exists test19_state_stream1

  - type: wait
    time: 1

  - type: query
    sql: create stream test19_state_stream1 (id string, location string, value int,
      timestamp datetime64(3) default now64(3))

  - type: wait
    time: 1

  - name: '1942'
    query_id: '1942'
    type: stream
    query: subscribe to select value, neighbor(value, -1) as prev_1, neighbor(value,
      -3, 0) as prev_3_0  from test19_state_stream1 settings checkpoint_interval=1
    schema:
      - name: value
        type: int32
      - name: prev_1
        type: int32
      - name: prev_3_0
        type: int32

  - type: wait
    time: 1

  - type: query
    sql: insert into test19_state_stream1(id, location, value, timestamp) values ('dev1',
      'ca', 1, '2020-02-02 20:00:00')

  - type: wait
    time: 1

  - type: query
    sql: insert into test19_state_stream1(id, location, value, timestamp) values ('dev1',
      'ca', 2, '2020-02-02 20:00:01')

  - type: wait
    time: 1

  - type: query
    sql: insert into test19_state_stream1(id, location, value, timestamp) values ('dev2',
      'ca', 3, '2020-02-02 20:00:03')

  - type: wait
    time: 3

  - type: query
    sql: kill query where query_id = '1942'

  - type: wait
    time: 1

  - type: query
    sql: unsubscribe to '1942'

  - type: check
    target_name: '1942'
    expected_result:
      - [ 1, 0, 0 ]
      - [ 2, 1, 0 ]
      - [ 3, 2, 0 ]
