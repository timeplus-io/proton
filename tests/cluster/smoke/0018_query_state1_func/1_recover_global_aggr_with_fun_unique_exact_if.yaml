tags:
  - query_state
description: recover global aggregation with function unique_exact_if from a state
  checkpoint
cluster:
  - p1k1
steps:
  - type: query
    sql: drop stream if exists test19_state_stream1

  - type: wait
    time: 1

  - type: query
    sql: create stream test19_state_stream1 (id string, location string, value float,
      timestamp datetime64(3) default now64(3))

  - type: wait
    time: 1

  - name: '1921'
    query_id: '1921'
    type: stream
    query: subscribe to select unique_exact_if(id, value > 57.0) as a from test19_state_stream1
      emit periodic 1s settings checkpoint_interval=1
    schema:
      - name: a
        type: uint64

  - type: wait
    time: 2

  - type: query
    sql: insert into test19_state_stream1(id, location, value, timestamp) values ('dev1',
      'ca', 57.3, '2020-02-02 20:00:00'), ('dev1', 'ca', 66, '2020-02-02 20:00:01'),
      ('dev2', 'ca', 58.3, '2020-02-02 20:00:03')

  - type: wait
    time: 3

  - type: query
    sql: kill query where query_id = '1921'

  - type: wait
    time: 1

  - type: query
    sql: insert into test19_state_stream1(id, location, value, timestamp) values ('dev2',
      'ca', 80, '2020-02-02 20:00:05'), ('dev8', 'ca', 55, '2020-02-02 20:00:07'), ('dev8',
      'ca', 66, '2020-02-02 20:00:09')

  - name: 1921-1
    query_id: 1921-1
    type: stream
    query: recover from '1921'
    schema:
      - name: a
        type: uint64

  - type: wait
    time: 3

  - type: query
    sql: kill query where query_id='1921' sync

  - type: query
    sql: unsubscribe to '1921'

  - type: check
    target_name: '1921'
    expected_result:
      - [ '2' ]

  - type: check
    target_name: '1921-1'
    expected_result:
      - [ '3' ]
