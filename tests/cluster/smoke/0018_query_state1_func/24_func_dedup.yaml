tags:
  - query_state
description: function dedup state checkpoint
cluster:
  - p1k1
steps:
  - type: query
    sql: drop stream if exists test19_state_stream1

  - type: wait
    time: 1

  - type: query
    sql: create stream test19_state_stream1(i int, s string)

  - type: wait
    time: 1

  - name: '1944'
    query_id: '1944'
    type: stream
    query: subscribe to select i, s from dedup(test19_state_stream1, s) settings checkpoint_interval=1
    schema:
      - name: i
        type: int32
      - name: s
        type: string

  - type: wait
    time: 1

  - type: query
    sql: insert into test19_state_stream1(i, s) values (1, 's1'), (2, 's2'), (3, 's3')

  - type: wait
    time: 1

  - type: query
    sql: insert into test19_state_stream1(i, s) values (1, 's1'), (2, 's2'), (3, 's3')

  - type: wait
    time: 2

  - type: query
    sql: kill query where query_id = '1944'

  - type: wait
    time: 1

  - type: query
    sql: unsubscribe to '1944'

  - type: check
    target_name: '1944'
    expected_result:
      - [ 1, s1 ]
      - [ 2, s2 ]
      - [ 3, s3 ]
