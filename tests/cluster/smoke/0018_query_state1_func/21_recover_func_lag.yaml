tags:
  - query_state
description: recover function lag from a state checkpoint
cluster:
  - p1k1
steps:
  - type: query
    sql: drop stream if exists test19_state_stream1

  - type: wait
    time: 1

  - type: query
    sql: create stream test19_state_stream1 (id string, location string, value int,
      timestamp datetime64(3) default now64(3))

  - type: wait
    time: 1

  - name: '1941'
    query_id: '1941'
    type: stream
    query: subscribe to select value, lag(value) as prev_1, lag(value, 3, 0) as prev_3_0
      from test19_state_stream1 settings checkpoint_interval=1
    schema:
      - name: value
        type: int32
      - name: prev_1
        type: int32
      - name: prev_3_0
        type: int32

  - type: wait
    time: 2

  - type: query
    sql: insert into test19_state_stream1(id, location, value, timestamp) values ('dev1',
      'ca', 1, '2020-02-02 20:00:00')

  - type: query
    sql: insert into test19_state_stream1(id, location, value, timestamp) values ('dev1',
      'ca', 2, '2020-02-02 20:00:01')

  - type: query
    sql: insert into test19_state_stream1(id, location, value, timestamp) values ('dev2',
      'ca', 3, '2020-02-02 20:00:03')

  - type: wait
    time: 3

  - type: query
    sql: kill query where query_id = '1941'

  - type: wait
    time: 1

  - type: query
    sql: insert into test19_state_stream1(id, location, value, timestamp) values ('dev2',
      'ca', 4, '2020-02-02 20:00:04')

  - type: query
    sql: insert into test19_state_stream1(id, location, value, timestamp) values ('dev3',
      'ca', 5, '2020-02-02 20:00:05')

  - type: query
    sql: insert into test19_state_stream1(id, location, value, timestamp) values ('dev4',
      'ca', 6, '2020-02-02 20:00:06')

  - name: 1941-1
    query_id: 1941-1
    type: stream
    query: recover from '1941'
    schema:
      - name: value
        type: int32
      - name: prev_1
        type: int32
      - name: prev_3_0
        type: int32

  - type: wait
    time: 3

  - type: query
    sql: kill query where query_id='1941' sync

  - type: query
    sql: unsubscribe to '1941'

  - type: check
    target_name: '1941'
    expected_result:
      - [ 1, 0, 0 ]
      - [ 2, 1, 0 ]
      - [ 3, 2, 0 ]

  - type: check
    target_name: 1941-1
    expected_result:
      - [ 4, 3, 1 ]
      - [ 5, 4, 2 ]
      - [ 6, 5, 3 ]
