tags:
- local-run
- join processing time alignment
- asof join
- query state
- unstable
description: streaming append (left) asof join versioned_kv with processing time alignment
cluster:
- p1k1
# - p3k1 # subscribe to no support for cluster
steps:
- type: query
  sql: drop stream if exists test_32_stream

- type: query
  sql: drop stream if exists test_32_stream_vk

- type: wait
  time: 1

- type: query
  sql: create stream test_32_stream(i int, v int)

- type: query
  sql: create stream test_32_stream_vk(i int, v int) primary key i  settings shards=3
- type: wait
  time: 2

- type: query
  sql: insert into test_32_stream(i, v) values (1, 1);
- type: wait
  time: 1

- type: query
  sql: insert into test_32_stream_vk(i, v) values (1, 1);
- type: wait
  time: 1

- type: query
  sql: insert into test_32_stream(i, v) values (1, 2);
- type: wait
  time: 1

- type: stream
  name: 3200
  query_id: '3200'
  query: |
    subscribe to with r1 as (select i as id, v from test_32_stream), r2 as (select i as id, v from test_32_stream_vk)
    select r1.v, r2.v from r1 asof join r2 as r2 on r1.id = r2.id and r1.v >= r2.v and lag_behind(3s)
    settings checkpoint_interval=1,keep_versions=2,seek_to='earliest';
  schema:
    - name: v
      type: int32
    - name: r2.v
      type: int32

- type: stream
  name: 3201
  query_id: '3201'
  query: |
    subscribe to with r1 as (select i as id, v from test_32_stream), r2 as (select i as id, v from test_32_stream_vk)
    select r1.v, r2.v from r1 left asof join r2 on r1.id = r2.id and r1.v >= r2.v and lag_behind(3s)
    settings checkpoint_interval=1,keep_versions=2,seek_to='earliest';
  schema:
    - name: v
      type: int32
    - name: r2.v
      type: int32
- type: wait
  time: 2

- type: query
  sql: insert into test_32_stream_vk(i, v) values (1, 3);

- type: check
  target_name: 3200
  mode: random
  expected_result:
    - [1, 1]
    - [2, 1]
    
- type: check
  target_name: 3201
  mode: random
  expected_result:
    - [1, 1]
    - [2, 1]

- type: wait
  time: 1

- type: query
  sql: kill query where query_id = '3200'

- type: query
  sql: kill query where query_id = '3201'
- type: wait
  time: 10

- type: stream
  name: 3200-1
  query: recover from '3200'
  schema:
    - name: v
      type: int32
    - name: r2.v
      type: int32

- type: stream
  name: 3201-1
  query: recover from '3201'
  schema:
    - name: v
      type: int32
    - name: r2.v
      type: int32
- type: wait
  time: 2

- type: query
  sql: insert into test_32_stream_vk(i, v) values (1, 2);

- type: query
  sql: insert into test_32_stream(i, v) values (1, 3)(1, 2)(1, 1);

- type: wait
  time: 3

- type: query
  sql: unsubscribe to '3200'

- type: query
  sql: unsubscribe to '3201'
- type: wait
  time: 1

- type: check
  target_name: 3200-1
  expected_result:
    - [3, 3]
    - [2, 2]

- type: check
  target_name: 3201-1
  expected_result:
    - [3, 3]
    - [2, 2]
    - [1, 0]
