tags:
- local-run
- versioned_kv
- multi_shard
- substream
- partition_by_primary_key
- streaming_tailing
- UDF
description: partition by primary key, streaming tailing, UDF, update
cluster:
- p1k1
- p3k1
steps:
- type: query
  sql: |
    CREATE OR REPLACE FUNCTION test_14_12_add_five(value float32) RETURNS float32 LANGUAGE JAVASCRIPT AS $$
      function test_14_12_add_five(value) {
          for (let i = 0; i < value.length; i++) {
              value[i] = value[i] + 5;
          }
          return value;
      }
    $$;
- type: wait
  time: 1

- type: query
  sql: create stream test14_multishard_12(i float, k1 int, k2 string) primary key k2 settings mode='versioned_kv', shards=3;

- type: wait
  time: 2

- name: '1496'
  type: stream
  query: select test_14_12_add_five(i), k1, k2 from test14_multishard_12 partition by k2;
  schema:
  - name: test_14_12_add_five(i)
    type: float32
  - name: k1
    type: int32
  - name: k2
    type: string
- type: wait
  time: 1

- type: query
  sql: insert into test14_multishard_12(i, k1, k2) values
  schema:
  - name: i
    type: float32
  - name: k1
    type: int32
  - name: k2
    type: string
  inputs:
  - [1, 1, 'a']
- type: wait
  time: 1

- type: query
  sql: insert into test14_multishard_12(i, k1, k2) values
