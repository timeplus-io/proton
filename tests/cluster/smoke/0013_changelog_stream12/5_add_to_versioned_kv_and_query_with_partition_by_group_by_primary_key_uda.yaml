tags:
- versioned_kv
- multi_shard
- substream
- partition_by_primary_key
- streaming_aggregation
- global_aggregation
- group_by
- primary_key
- UDA
- not_supported_hybrid # Substream aggregating does not support hybrid aggregator
description: add to versioned_kv and query with partition by primary key, group by,
  primary key and UDA
cluster:
- p1k1
- p3k1
steps:
- type: query
  sql: |
    CREATE OR REPLACE AGGREGATE FUNCTION test_14_12_sec_large(value float32) RETURNS float32 LANGUAGE JAVASCRIPT AS $$
      {
        initialize: function() { 
          this.max = -1.0;
          this.sec = -1.0;
        },

        process: function(values) {
          for(let i=0; i<values.length; i++) {
            if(values[i] > this.max) {
              this.sec = this.max;
              this.max = values[i];
            }
            if(values[i] < this.max && values[i] > this.sec)
              this.sec = values[i];
          }
        },

        finalize: function() {
          return this.sec;
        },

        serialize: function() {
          let s = {"max": this.max, "sec":this.sec };
          return JSON.stringify(s);
        },

        deserialize: function(state_str) {
          let s = JSON.parse(state_str);
          this.max = s["max"];
          this.sec = s["sec"];
        },

        merge: function(state_str) {
          let s = JSON.parse(state_str);
          if (s["sec"] >= this.max) {
            this.max = s["max"];
            this.sec = s["sec"];
          } else if (s["max"] >= this.max) {
            this.sec = this.max;
            this.max = s["max"];
          } else if (s["max"] > this.sec) {
            this.sec = s["max"];
          }
        }
      }
    $$;
- type: wait
  time: 1

- type: query
  sql: create stream test14_multishard_12(i float, k1 int, k2 string) primary key k2 settings mode='versioned_kv', shards=3;

- type: wait
  time: 2

- name: '14101'
  type: stream
  query: select test_14_12_sec_large(i),
                  k2
          from test14_multishard_12 partition by k2
          group by k2 emit periodic 200ms;
  schema:
  - name: test_14_12_sec_large(i)
    type: float32
  - name: k2
    type: string
- type: wait
  time: 1

- type: query
  sql: insert into test14_multishard_12(i, k1, k2) values
  schema:
  - name: i
    type: float32
  - name: k1
    type: int32
  - name: k2
    type: string
  inputs:
  - [1, 1, 'a']
- type: wait
  time: 1

- type: query
  sql: insert into test14_multishard_12(i, k1, k2) values
  schema:
  - name: i
    type: float32
  - name: k1
    type: int32
  - name: k2
    type: string
  inputs:
  - [2, 1, 'b']
- type: wait
  time: 1

- type: query
  sql: insert into test14_multishard_12(i, k1, k2) values
  schema:
  - name: i
    type: float32
  - name: k1
    type: int32
  - name: k2
    type: string
  inputs:
  - [3, 1, 'c']

- type: check
  target_name: '14101'
  expected_result:
  - [-1, a]
  - [-1, b]
  - [-1, c]
