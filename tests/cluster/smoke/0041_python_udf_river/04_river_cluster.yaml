tags:
  - udf

description: Test covering simple python udf test

steps:
  - type: query
    sql: drop stream if exists udf_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream udf_stream (value map(int, float));
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_cluster(value map(int, float)) RETURNS int LANGUAGE PYTHON AS
      $$
      import random
      from river import cluster, stream

      def test_cluster(value):
          X = [
              [1, 2],
              [1, 4],
              [1, 0],
              [-4, 2],
              [-4, 4],
              [-4, 0],
              [5, 0],
              [5, 2],
              [5, 4]
          ]
          clustream = cluster.CluStream(
              n_macro_clusters=3,
              max_micro_clusters=5,
              time_gap=3,
              seed=0,
              halflife=0.4
          )
          for x, _ in stream.iter_array(X):
              clustream.learn_one(x)
          res = [clustream.predict_one(dict(v)) for v in value]
          return res
      $$;

  - type: wait
    time: 2

  - name: python-udf13-4-1
    type: stream
    query: select test_cluster(value) as res from udf_stream;
    schema:
      - name: res
        type: int32

  - type: wait
    time: 2

  - type: query
    sql: |
      insert into udf_stream(value) values
      ({0: 1, 1: 1})({0: -4, 1: 3})({0: 4, 1: 3.5});

  - type: check
    target_name: python-udf13-4-1
    expected_result:
      - [1]
      - [2]
      - [0]
