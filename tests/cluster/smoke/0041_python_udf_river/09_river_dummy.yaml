tags:
  - udf

description: Test covering simple python udf test

steps:
  - type: query
    sql: drop stream if exists udf_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream udf_stream (value string);
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_dummy(value string) RETURNS string LANGUAGE PYTHON AS
      $$
      from river import dummy

      def test_dummy(value):
          sentences = [
              ('glad happy glad', '+'),
              ('glad glad joyful', '+'),
              ('glad pleasant', '+'),
              ('miserable sad glad', '-')
          ]
          model = dummy.NoChangeClassifier()
          for sentence, label in sentences:
              model.learn_one(sentence, label)
          res = [model.predict_one(v) for v in value]
          return res
      $$;

  - type: wait
    time: 2

  - name: python-udf13-9-1
    type: stream
    query: select test_dummy(value) as res, value from udf_stream;
    schema:
      - name: res
        type: string
      - name: value
        type: string

  - type: wait
    time: 2

  - type: query
    sql: insert into udf_stream(value) values ('glad sad miserable pleasant glad');

  - type: check
    target_name: python-udf13-9-1
    expected_result:
      - ['-', 'glad sad miserable pleasant glad']
