tags:
  - uda

description: Test covering python uda test on statsforecast function

steps:
  - type: query
    sql: drop stream if exists uda_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream uda_stream (unique_id string, ds date, y int);
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE AGGREGATE FUNCTION predictTester(unique_id string, ds date, y int) RETURNS array(float32) LANGUAGE PYTHON AS
      $$

      import pandas as pd
      from statsforecast import StatsForecast
      from statsforecast.models import AutoARIMA

      class predictTester:
          def __init__(self):
              self.res = []
              self.sf = StatsForecast(
                  models=[AutoARIMA(season_length = 12)],
                  freq='MS',
              )

          def serialize(self):
              pass

          def deserialize(self, data):
              pass

          def merge(self, other):
              pass

          def process(self, unique_ids, dss, ys):
              df = pd.DataFrame(zip(unique_ids, dss, ys), columns=['unique_id', 'ds', 'y'])
              self.sf.fit(df)
              forecast_df = self.sf.predict(h=12, level=[90])
              self.res = forecast_df.tail()['AutoARIMA'].tolist()

          def finalize(self):
              return [self.res]

      $$;

  - type: wait
    time: 1

  - name: python-udf11-1-1
    type: stream
    query: select predictTester(unique_id, ds, y) as res from uda_stream;
    schema:
      - name: res
        type: array(float32)

  - type: wait
    time: 1

  - type: query
    sql: insert into uda_stream(unique_id, ds, y) values
          ('AirPassengers', '2024-01-01', 112) ('AirPassengers', '2024-01-02', 118) ('AirPassengers', '2024-01-03', 132)('AirPassengers', '2024-01-04', 129) ('AirPassengers', '2024-01-05', 121);

  - type: check
    target_name: python-udf11-1-1
    expected_result:
      - [[122.4000015258789, 122.4000015258789, 122.4000015258789, 122.4000015258789, 122.4000015258789]]
