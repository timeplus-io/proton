tags:
  - uda

description: Test covering python uda test on statsforecast function

steps:
  - type: query
    sql: drop stream if exists uda_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream uda_stream (unique_id string, ds date, y float);
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE AGGREGATE FUNCTION electricityTester(unique_id string, ds date, y float) RETURNS array(float) LANGUAGE PYTHON AS
      $$

      import pandas as pd
      from statsforecast import StatsForecast
      from statsforecast.models import MSTL, AutoARIMA

      class electricityTester:
          def __init__(self):
              self.res = []
              self.model = MSTL(
                  season_length=[24, 24 * 7],
                  trend_forecaster=AutoARIMA()
              )
              self.sf = StatsForecast(models=[self.model], freq='H')

          def serialize(self):
              pass

          def deserialize(self, data):
              pass

          def merge(self, other):
              pass

          def process(self, unique_ids, dss, ys):
              if len(unique_ids) < 24:
                  return
              dss = pd.to_datetime(dss)
              df = pd.DataFrame(zip(unique_ids, dss, ys),
                                columns=['unique_id', 'ds', 'y'])
              
              self.sf = self.sf.fit(df=df)
              self.sf.fitted_[0, 0].model_
              forecasts = self.sf.predict(h=len(df), level=[90])
              self.res = forecasts.head()['MSTL'].tolist()

          def finalize(self):
              return [self.res]
      $$;

  - type: wait
    time: 1

  - name: python-udf11-5-1
    type: stream
    query: select electricityTester(unique_id, ds, y) as res from uda_stream;
    schema:
