tags:
- local-run
- multishards
- append_only
- substream
- streaming_aggregation
- window_aggregation
- hop_window_aggregation
- no_group_by
- stateful_function
- not_supported_hybrid # Substream aggregating does not support hybrid aggregator
description: hop window aggregation no group by keys, select with stateful func
cluster:
- p1k1
- p3k1
steps:
  - type: wait
    time: 1

  - type: query
    sql: 'drop view if exists test13_view2_2;'

  - type: wait
    time: 1

  - type: query
    sql: 'drop view if exists test13_view1_2;'

  - type: wait
    time: 1

  - type: query
    sql: 'drop stream if exists test13_subst_2;'

  - type: wait
    time: 1

  - type: query
    sql: 'create stream test13_subst_2(i float, k1 int, k2 string, timestamp datetime64(3) default now64(3)) settings shards=3;'
  
  - type: wait
    time: 1
  
  - name: '1310'
    type: stream
    query: |
      select k2,
             max(i),
             min(i),
             avg(i),
             count(i),
             window_start as s,
             window_end as e
      from hop(test13_subst_2, timestamp, 2s, 5s) partition by k2
      group by window_start,
               window_end;
    schema:
      - name: k2
        type: string
      - name: max(i)
        type: float32
      - name: min(i)
        type: float32
      - name: avg(i)
        type: float64
      - name: count(i)
        type: uint64
      - name: s
        type: datetime64(3)
      - name: e
        type: datetime64(3)
    
  - type: wait
    time: 1

