tags:
- multishards
- append_only
- streaming_aggregation
- global_aggregation
- group_by
- stateful_function
description: streaming aggregation group by, stateful function add
cluster:
- p1k1
- p3k1
steps:
  - type: wait
    time: 1

  - type: query
    sql: |
      drop stream if exists test13_multishard_2;

  - type: wait
    time: 1

  - type: query
    sql: create stream test13_multishard_2(i float, k1 int, k2 string) settings shards=3 ;
  
  - type: wait
    time: 2
  
  - name: '1319'
    type: stream
    query: |
      select max(i),
             min(i),
             avg(i),
             count(i),
             k2
      from test13_multishard_2
      group by k2 emit periodic 100ms;
    schema:
        - name: max(i)
          type: float32
        - name: min(i)
          type: float32
        - name: avg(i)
          type: float64
        - name: count(i)
          type: uint64
        - name: k2
          type: string
          
  - type: wait
    time: 2

  - type: query
    sql: |
      insert into test13_multishard_2 (i, k1, k2)
      values (1, 0, 'a');

  - type: wait
    time: 1

  - type: query
    sql: |
      insert into test13_multishard_2 (i, k1, k2)
      values (2, 0, 'b');

  - type: wait
    time: 1

  - type: query
    sql: |
      insert into test13_multishard_2 (i, k1, k2)
      values (3, 0, 'c');

  - type: wait
    time: 1

  - type: query
    sql: |
      insert into test13_multishard_2 (i, k1, k2)
      values (4, 0, 'c');

  - type: wait
    time: 1

  - type: query
    sql: |
      insert into test13_multishard_2 (i, k1, k2)
      values (5, 0, 'a');

  - type: wait
    time: 1

  - type: query
    sql: |
      insert into test13_multishard_2 (i, k1, k2)
      values (6, 0, 'b');

  - type: check
    target_name: '1319'
    mode: random
    expected_result:
      - [ 1, 1, 1, 1, a ]
      - [ 2, 2, 2, 1, b ]
      - [ 1, 1, 1, 1, a ]
      - [ 2, 2, 2, 1, b ]
      - [ 3, 3, 3, 1, c ]
      - [ 1, 1, 1, 1, a ]
      - [ 2, 2, 2, 1, b ]
      - [ 4, 3, 3.5, 2, c ]
      - [ 1, 1, 1, 1, a ]
      - [ 2, 2, 2, 1, b ]
      - [ 4, 3, 3.5, 2, c ]
      - [ 5, 1, 3, 2, a ]
      - [ 6, 2, 4, 2, b ]
      - [ 4, 3, 3.5, 2, c ]
      - [ 5, 1, 3, 2, a ]
  

