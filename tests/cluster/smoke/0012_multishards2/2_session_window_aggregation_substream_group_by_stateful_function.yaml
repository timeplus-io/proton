tags:
- multishards
- append_only
- substream
- streaming_aggregation
- window_aggregation
- session_window_aggregation
- group_by
- stateful_function
- not_supported_hybrid # Substream aggregating does not support hybrid aggregator
description: session window aggregation substream group by, stateful function
cluster:
- p1k1
- p3k1
steps:
  - type: wait
    time: 1

  - type: query
    sql: 'drop view if exists test13_view2_2;'

  - type: wait
    time: 1

  - type: query
    sql: 'drop view if exists test13_view1_2;'

  - type: wait
    time: 1

  - type: query
    sql: 'drop stream if exists test13_multishard_2;'

  - type: wait
    time: 1

  - type: query
    sql: 'create stream test13_multishard_2(speed int, id int, timestamp datetime64(3) default now64(3)) settings shards=3;'
  
  - type: wait
    time: 2
  
  - name: '1312'
    type: stream
    query: |
      select id,
             max(speed),
             min(speed),
             avg(speed),
             window_start as s,
             window_end as e
      from session(test13_multishard_2, timestamp, 5m, [speed >= 60, speed < 60)) partition by id
      group by id,
               window_start,
               window_end;
    schema:
        - name: id
          type: int32
        - name: max(speed)
          type: int32
        - name: min(speed)
          type: int32
        - name: avg(speed)
          type: float64
        - name: s
          type: datetime64(3)
        - name: e
          type: datetime64(3)
    
  - type: wait
    time: 1

  - type: query
    sql: "insert into test13_multishard_2(speed, id, timestamp)
    values (40, 1, '2021-11-02 20:00:01');"

