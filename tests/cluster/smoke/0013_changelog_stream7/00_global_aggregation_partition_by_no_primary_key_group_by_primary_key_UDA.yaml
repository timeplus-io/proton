tags:
  - local-run
  - subquery/view/materialized_view/
  - tumble(table)
  - group_by
  - primary_key
  - todo
  - substream
  - not_supported_hybrid # Substream aggregating does not support hybrid aggregator

description:
  global aggregation, partition by no primary key, group by primary key,
  UDA
cluster:
  - p1k1
  - p3k1
steps:
  - type: query
    sql: |
      CREATE OR REPLACE AGGREGATE FUNCTION test_14_7_sec_large(value float32) RETURNS float32 LANGUAGE JAVASCRIPT AS $$
        {
          initialize: function() { 
            this.max = -1.0;
            this.sec = -1.0;
          },

          process: function(values) {
            for(let i=0; i<values.length; i++) {
              if(values[i] > this.max) {
                this.sec = this.max;
                this.max = values[i];
              }
              if(values[i] < this.max && values[i] > this.sec)
                this.sec = values[i];
            }
          },

          finalize: function() {
            return this.sec;
          },

          serialize: function() {
            let s = {"max": this.max, "sec":this.sec };
            return JSON.stringify(s);
          },

          deserialize: function(state_str) {
            let s = JSON.parse(state_str);
            this.max = s["max"];
            this.sec = s["sec"];
          },

          merge: function(state_str) {
            let s = JSON.parse(state_str);
            if (s["sec"] >= this.max) {
              this.max = s["max"];
              this.sec = s["sec"];
            } else if (s["max"] >= this.max) {
              this.sec = this.max;
              this.max = s["max"];
            } else if (s["max"] > this.sec) {
              this.sec = s["max"];
            }
          }
        }
      $$;

  - type: wait
    time: 1

  - type: query
    sql:
      create stream test14_substream_7(val float, types string, id
      int, name string);

  - type: wait
    time: 2

  - name: "1436"
    type: stream
    query:
      select test_14_7_sec_large(val), max(val), min(val), avg(val), name from
      changelog(test14_substream_7, id) partition by name group by id;
    schema:
      - name: test_14_7_sec_large(val)
        type: float32
      - name: max(val)
        type: float32
      - name: min(val)
        type: float32
      - name: avg(val)
        type: float64
      - name: name
        type: string

  - type: wait
    time: 2

  - type: query
    sql: insert into test14_substream_7(val, types, id, name) values (1, 'c', 2, 'a');

  - type: wait
    time: 2

  - type: query
    sql: insert into test14_substream_7(val, types, id, name) values (3, 'b', 3, 'b');

  - type: wait
    time: 2

  - type: query
    sql: insert into test14_substream_7(val, types, id, name) values (5, 'a', 1, 'c');

  - type: wait
    time: 2

  - type: query
    sql: insert into test14_substream_7(val, types, id, name) values (8, 'c', 12, 'a');

  - type: wait
    time: 2

  - type: query
    sql: insert into test14_substream_7(val, types, id, name) values (9, 'b', 3, 'b');

  - type: wait
    time: 2

  - type: query
    sql: insert into test14_substream_7(val, types, id, name) values (11, 'a', 2, 'b');

  - type: wait
    time: 2

  - type: query
    sql: insert into test14_substream_7(val, types, id, name) values (10, 'c', 1, 'c');

  - type: wait
    time: 2

  - type: query
    sql: insert into test14_substream_7(val, types, id, name) values (14, 'b', 2, 'b');

  - type: check
    target_name: "1436"
    mode: random
    expected_result:
      - [-1, 1, 1, 1, 'a']
      - [-1, 3, 3, 3, 'b']
      - [-1, 5, 5, 5, 'c']
      - [-1, 1, 1, 1, 'a']
      - [-1, 8, 8, 8, 'a']
      - [3, 9, 9, 9, 'b']
      - [-1, 0, 0, nan, 'a']
      - [-1, 8, 8, 8, 'a']
      - [3, 9, 9, 9, 'b']
      - [-1, 11, 11, 11, 'b']
      - [5, 10, 10, 10, 'c']
      - [3, 9, 9, 9, 'b']
      - [11, 14, 14, 14, 'b']