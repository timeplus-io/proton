tags:
  - subquery/view/materialized_view/
  - tumble(table)
  - group_by
  - primary_key
  - substream
  - not_supported_hybrid # Substream aggregating does not support hybrid aggregator
description:
  global aggregation,  partition by no primary key, group by no primary
  key, UDA
cluster:
  - p1k1
  - p3k1
steps:
  - type: query
    sql:
      create stream test14_substream_7(val float, types string, id
      int, name string);
  - type: wait
    time: 2

  - name: "1437"
    type: stream
    query:
      select max(val), min(val), avg(val), name from changelog(test14_substream_7,
      id) partition by name group by types emit periodic 1s;
    schema:
      - name: max(val)
        type: float32
      - name: min(val)
        type: float32
      - name: avg(val)
        type: float64
      - name: name
        type: string
  - type: wait
    time: 1

  - type: query
    sql: insert into test14_substream_7(val, types, id, name) values (1, 'c', 2, 'a');
  - type: wait
    time: 2

  - type: query
    sql: insert into test14_substream_7(val, types, id, name) values (3, 'b', 3, 'b');
  - type: wait
    time: 2

  - type: query
    sql: insert into test14_substream_7(val, types, id, name) values (5, 'a', 1, 'c');
  - type: wait
    time: 2

  - type: query
    sql: insert into test14_substream_7(val, types, id, name) values (8, 'c', 12, 'a');
  - type: wait
    time: 2

  - type: query
    sql: insert into test14_substream_7(val, types, id, name) values (9, 'b', 3, 'b');
  - type: wait
    time: 2

  - type: query
    sql: insert into test14_substream_7(val, types, id, name) values (11, 'a', 2, 'b');
  - type: wait
    time: 2

  - type: query
    sql: insert into test14_substream_7(val, types, id, name) values (10, 'c', 1, 'c');
  - type: wait
    time: 2

  - type: query
    sql: insert into test14_substream_7(val, types, id, name) values (14, 'b', 2, 'b');

  - type: check
    target_name: "1437"
    mode: random
    expected_result:
      - [1, 1, 1, a]
      - [3, 3, 3, b]
      - [5, 5, 5, c]
      - [8, 1, 4.5, a]
      - [9, 9, 9, b]
      - [9, 9, 9, b]
      - [11, 11, 11, b]
      - [8, 8, 8, a]
      - [0, 0, nan, c]
      - [10, 10, 10, c]
      - [14, 9, 11.5, b]
      - [0, 0, nan, b]
