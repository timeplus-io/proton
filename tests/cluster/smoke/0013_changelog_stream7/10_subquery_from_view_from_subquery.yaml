tags:
  - versioned_kv_subquery/view/materialized_view
  - global_aggregation
  - gtoup_by_primary_key
description: subquery from view from subquery
cluster:
  - p1k1
  - p3k1
steps:
  - type: query
    sql:
      create stream test14_subquery_7(i float, k1 int, k2 string) primary
      key k2 settings mode='versioned_kv';
  - type: wait
    time: 2

  - type: query
    sql:
      create view test14_view_7 as (with cte as (select i, k1, k2 from
      test14_subquery_7) select * from cte);
  - type: wait
    time: 2

  - name: "1446"
    type: stream
    query:
      select max(i), min(i), avg(i), k2 from test14_view_7 group by k2 emit periodic 1s;
    schema:
      - name: max(i)
        type: float32
      - name: min(i)
        type: float32
      - name: avg(i)
        type: float64
      - name: k2
        type: string
  - type: wait
    time: 2

  - type: query
    sql:
      insert into test14_subquery_7(i, k1, k2) values (1, 2, 'a') (3, 3, 'b') (5, 1, 'c');

  - type: wait
    time: 2

  - type: query
    sql:
      insert into test14_subquery_7(i, k1, k2) values (8, 2, 'a')(9, 3, 'b')(11, 2, 'b')(10, 1, 'c');

  - type: wait
    time: 2

  - type: query
    sql: insert into test14_subquery_7(i, k1, k2) values (14, 2, 'b');

  - type: check
    target_name: "1446"
    mode: random
    expected_result:
      - [1, 1, 1, a]
      - [3, 3, 3, b]
      - [5, 5, 5, c]
      - [8, 8, 8, a]
      - [11, 11, 11, b]
      - [10, 10, 10, c]
      - [8, 8, 8, a]
      - [14, 14, 14, b]
      - [10, 10, 10, c]
