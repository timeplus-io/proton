tags:
- udf
description: stock - with emit strategy
cluster:
- p1k1
- p3k1
steps:
- name: '2300'
  type: rest
  url: /proton/v1/udfs
  method: POST
  data:
    type: javascript
    name: stock
    arguments:
    - name: rowtime
      type: datetime64(6)
    - name: price
      type: float32
    is_aggregation: true
    return_type: tuple(start_price float32, bottom_ts datetime64(1), end_price float32,
      down_duration uint64)
    source: '{has_customized_emit:true,initialize:function(){this.bottom_ts=new Date();this.last_down_price=-1.0;this.start_price=-1.0;this.down_duration=1;this.result=[]},process:function(rowtime,price){for(let
      i=0;i<rowtime.length;i++){if(this.start_price<0||(this.last_down_price<0&&price[i]>=this.start_price)){this.start_price=price[i];this.bottom_ts=rowtime[i];this.down_duration=1}else
      if((this.last_down_price<0&&price[i]<this.start_price)||(price[i]<this.last_down_price)){this.last_down_price=price[i];this.bottom_ts=rowtime[i];this.down_duration=this.down_duration+1}else
      if(price[i]>this.last_down_price){this.result.push({''start_price'':this.start_price,''bottom_ts'':this.bottom_ts,''end_price'':price[i],''down_duration'':this.down_duration});this.bottom_ts=rowtime[i];this.start_price=price[i];this.last_down_price=-1.0;this.down_duration=1}else{this.down_duration=this.down_duration+1}}return
      this.result.length},finalize:function(){var old_result=this.result;this.result=[];return
      old_result},merge:function(){}}'
- type: wait
  time: 5

- name: udf-2
  type: stream
  query: select s, st.1, st.2, st.3, st.4 from (select s, stock(dt, f32) as st from
    udf_types group by s) order by s
  schema:
  - name: s
    type: string
  - name: tuple_element(st, 1)
    type: float32
  - name: tuple_element(st, 2)
    type: datetime64(1)
  - name: tuple_element(st, 3)
    type: float32
  - name: tuple_element(st, 4)
    type: uint64
- type: wait
  time: 2

- type: rest
  url: /proton/v1/ingest/streams/udf_types
  method: POST
  data:
    columns:
    - i
    - i8
    - f32
    - s
    - dt
    data:
    - [1, 1, 10.0, 's1', '2020-02-02 20:00:00']
    - [2, 2, 20.0, 's2', '2020-02-02 20:00:00']

- type: rest
  url: /proton/v1/ingest/streams/udf_types
  method: POST
  data:
    columns:
    - i
    - i8
    - f32
    - s
    - dt
    data:
    - [3, 3, 3.0, 's1', '2020-02-02 20:00:01']
    - [4, 4, 4.0, 's2', '2020-02-02 20:00:01']

- type: rest
  url: /proton/v1/ingest/streams/udf_types
  method: POST
  data:
    columns:
    - i
    - i8
    - f32
    - s
    - dt
    data:
    - [3, 3, 5.0, 's1', '2020-02-02 20:00:02']
    - [4, 4, 6.0, 's2', '2020-02-02 20:00:02']

- type: check
  target_name: udf-2
  expected_result:
  - ['s1', 10.0, '2020-02-02 20:00:01', 5.0, 2]
  - ['s2', 20.0, '2020-02-02 20:00:01', 6.0, 2]
