tags:
- udf
description: UDA, exception - process
cluster:
- p1k1
- p3k1
steps:
- name: '2300'
  type: rest
  url: /proton/v1/udfs
  method: POST
  data:
    type: javascript
    name: exception
    arguments:
    - name: value
      type: float32
    is_aggregation: true
    return_type: float32
    source: '{initialize:function(){},process:function(prices){throw new Error(''js
      exception'');},finalize:function(){return -1;}}'
- type: wait
  time: 5

- name: udf-14
  type: stream
  query: select s, exception(f32) from udf_types group by s order by s
  schema:
  - name: s
    type: string
  - name: exception(f32)
    type: float32
- type: wait
  time: 2

- type: rest
  url: /proton/v1/ingest/streams/udf_types
  method: POST
  data:
    columns:
    - i
    - i8
    - f32
    - s
    - dt
    data:
    - [1, 1, 1.0, s1, '2020-02-02 20:00:00']

- type: check
  target_name: udf-14
  expected_result:
  - ["error_code:503"]
