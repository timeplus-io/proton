name: alert
description: Smoke tests covering the alert use cases.
tags:
  - smoke
  - alert
arch:
  - x86_64
setup:
  scope: case
  steps:
    - type: query
      sql: DROP VIEW IF EXISTS mv;

    - type: query
      sql: DROP ALERT IF EXISTS test;

    - type: wait
      time: 1

    - type: query
      sql: DROP STREAM IF EXISTS source;

    - type: query
      sql: DROP STREAM IF EXISTS monitor;

    - type: query
      sql: DROP STREAM IF EXISTS action;

    - type: wait
      time: 1

    # The alert UDFs `import requests`, which used to be provided by the
    # timeplus-neutrino bundle (removed in the cp314t migration). Install it
    # explicitly; requests and its deps are pure-Python / ship cp314t wheels.
    - type: query
      sql: SYSTEM INSTALL PYTHON PACKAGE 'requests'

    - type: wait
      time: 15

    - type: command
      name: alert-setup-check-requests
      node: [p1]
      shell: |
        curl -X GET http://localhost:8123/proton/v1/python_packages  2>/dev/null | jq -c '.data[] | select(.name == "requests") | length > 0'

    - type: check
      target_name: alert-setup-check-requests
      expected_result: ['true']
