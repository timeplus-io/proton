tags:
  - python_external_stream
  - external_stream
  - local_api
cluster:
  - p1k1
  - p3k1

description: |
  Python external stream should receive __timeplus_local_api_user and
  __timeplus_local_api_password injected as module-level globals by
  PythonModuleSession::init().  The read function returns them as a
  (string, string) tuple so the test can verify both are non-empty
  without printing the actual token value.

steps:
  - type: query
    node: [p1]
    sql: drop stream if exists py_local_api_creds

  - type: query
    node: [p1]
    sql: |
      create external stream py_local_api_creds
      (
        api_user  string,
        api_password_nonempty string
      )
      AS $$
      def read_creds():
          user = __timeplus_local_api_user
          # Return the password length rather than the value itself so the
          # test never asserts on the actual secret.
          password_nonempty = 'yes' if len(__timeplus_local_api_password) > 0 else 'no'
          return [(user, password_nonempty)]
      $$
      SETTINGS type='python', read_function_name='read_creds';

  - type: stream
    name: py-local-api-creds-read
    node: [p1]
    query: select * from py_local_api_creds
    schema:
      - name: api_user
        type: string
      - name: api_password_nonempty
        type: string

  - type: check
    target_name: py-local-api-creds-read
    expected_result:
      - - local_api_user
        - "yes"

  - type: query
    node: [p1]
    sql: drop stream if exists py_local_api_creds
