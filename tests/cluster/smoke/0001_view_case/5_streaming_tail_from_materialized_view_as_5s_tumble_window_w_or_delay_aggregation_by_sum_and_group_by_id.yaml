tags:
  - materialized view
  - hop window
  - todo
  - change
  - bug
description: create materialized view as materialized view as 5s tumble window aggregation
  by sum and group by id, select id, sum_value from mv, timestamp designated as event_time_column
  when creating table, response should use utc time.
cluster:
  - p1k1
  - p3k1
steps:
  - type: query
    sql: drop view if exists test1_mv_stream_hop_v

  - type: wait
    time: 1

  - type: query
    sql: create materialized view test1_mv_stream_hop_v as select id, count(value) as
      sum_value, window_start as s, window_end as e from hop(test1_mv, timestamp, 2s,
      5s) group by id, window_start, window_end

  - type: wait
    time: 5

  - name: '301'
    type: stream
    query: select * from test1_mv_stream_hop_v
    schema:
      - name: id
        type: string
      - name: sum_value
        type: uint64
      - name: s
        type: datetime64(3)
      - name: e
        type: datetime64(3)
      - name: _tp_time
        type: datetime64(3)

  - type: wait
    time: 2

  - type: query
    sql: |
      insert into test1_mv (id, location, value, json, timestamp) values
      ('dev1', 'ca', 57.3, '"create_time":"2021-11-02 20:00:01"', '2020-02-02 20:01:00'),
      ('dev1', 'ca', 66, '"create_time":"2021-11-02 20:00:01"', '2020-02-02 20:01:01'),
      ('dev2', 'ca', 58.3, '"create_time":"2021-11-02 20:00:10"', '2020-02-02 20:01:02');

  - type: query
    sql: |
      insert into test1_mv (id, location, value, json, timestamp) values
      ('dev2', 'ca', 59, '"create_time":"2021-11-02 20:00:01"', '2020-02-02 20:01:03'),
      ('dev8', 'ca', 67, '"create_time":"2021-11-02 20:00:01"', '2020-02-02 20:01:02'),
      ('dev8', 'ca', 77, '"create_time":"2021-11-02 20:00:10"', '2020-02-02 20:01:08');

  - type: query
    sql: |
      insert into test1_mv (id, location, value, json, timestamp) values
      ('dev3', 'ca', 57.3, '"create_time":"2021-11-02 20:00:01"', '2020-02-02 20:01:00'),
      ('dev3', 'ca', 66, '"create_time":"2021-11-02 20:00:01"', '2020-02-02 20:01:01'),
      ('dev2', 'ca', 76, '"create_time":"2021-11-02 20:00:10"', '2020-02-02 20:01:05');

  - type: query
    sql: |
      insert into test1_mv (id, location, value, json, timestamp) values
      ('dev2', 'ca', 80, '"create_time":"2021-11-02 20:00:01"', '2020-02-02 20:01:03'),
      ('dev8', 'ca', 67, '"create_time":"2021-11-02 20:00:01"', '2020-02-02 20:01:02'),
      ('dev8', 'ca', 77, '"create_time":"2021-11-02 20:00:10"', '2020-02-02 20:01:08');

  - type: check
    target_name: '301'
    expected_result:
      - [ dev1, '123.3', '2020-02-02 20:01:00', '2020-02-02 20:01:05' ]
      - [ dev2, '117.3', '2020-02-02 20:01:00', '2020-02-02 20:01:05' ]
      - [ dev8, '67', '2020-02-02 20:01:00', '2020-02-02 20:01:05' ]

