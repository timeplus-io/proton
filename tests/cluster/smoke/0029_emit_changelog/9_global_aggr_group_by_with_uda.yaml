tags:
- changelog join changelog
- emit changelog
- uda
description: global aggregation emit changelog query with uda
cluster:
- p1k1
- p3k1
steps:
- type: query
  sql: drop stream if exists test30_changelog_stream;
- type: wait
  time: 1

- type: query
  sql: create stream test30_changelog_stream (i int, k string) primary key i settings mode='changelog_kv';
- type: wait
  time: 1

- type: query
  sql: DROP FUNCTION IF EXISTS test_count;
- type: wait
  time: 1

- type: query
  sql: |
    CREATE AGGREGATE FUNCTION test_count(value int) RETURNS int LANGUAGE JAVASCRIPT AS $$
      {
        initialize: function() {
          this.count = 0;
        },
        
        process: function(values, deltas) {
          let is_changelog = deltas !== undefined;
          for (let i = 0; i < values.length; i++) {
            if (is_changelog) {
              if (deltas[i] === 1) {
                this.count += 1;
              } else if (deltas[i] === -1) 
                this.count -= 1;
            } else 
                this.count += 1;
          }
        },
        
        finalize: function() {
          return this.count;
        },
        
        serialize: function() {
          let s = {
          'count': this.count
          };
          return JSON.stringify(s);
        },
        
        deserialize: function(state_str) {
          let s = JSON.parse(state_str);
          this.count = s['count'];
        },
        
        merge: function(state_str) {
          let s = JSON.parse(state_str);
          this.count += s['count'];
        }
      }
    $$;
- type: wait
  time: 5

- name: 3000
  type: stream
  query: select k, test_count(i), _tp_delta from test30_changelog_stream group by k emit changelog periodic 1s
  schema:
  - name: k
    type: string
  - name: test_count(i)
    type: int32
  - name: _tp_delta
    type: int8
- type: wait
  time: 1

- type: query
  sql: insert into test30_changelog_stream(i, k) values
  schema:
  - name: i
    type: int32
  - name: k
    type: string
  inputs:
  - [1, 'k1']
  - [2, 'k1']
- type: wait
  time: 1

- type: query
  sql: insert into test30_changelog_stream(i, k, _tp_delta) values
  schema:
    - name: i
      type: int32
    - name: k
      type: string
    - name: _tp_delta
      type: int8
  inputs:
    - [1, 'k1', -1]
    - [1, 'k2', 1]

- type: check
  target_name: 3000
  mode: random
  expected_result:
  - ['k1', 2, 1]
  - ['k1', 2, -1]
  - ['k1', 1, 1]
  - ['k2', 1, 1]
