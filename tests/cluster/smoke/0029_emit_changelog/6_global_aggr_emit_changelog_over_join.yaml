tags:
- global aggr
- emit changelog
- query state
description: global aggregation emit changelog query over join
cluster:
- p1k1
# - p3k1 # subscribe unsupport in cluster
steps:
- type: query
  sql: drop stream if exists test30_left_stream

- type: query
  sql: drop stream if exists test30_right_vk_stream
- type: wait
  time: 1

- type: query
  sql: create stream test30_left_stream (i int, k string);

- type: wait
  time: 1

- type: query
  sql: create stream test30_right_vk_stream (i int, k string) primary key i settings mode='versioned_kv'
- type: wait
  time: 2

- name: 3000
  type: stream
  query_id: '3000'
  query: subscribe to select i, count(), max(test30_right_vk_stream.k), _tp_delta from test30_left_stream join test30_right_vk_stream using(i) group by i emit changelog periodic 1s settings checkpoint_interval=1
  schema:
    - name: i
      type: int32
    - name: count()
      type: uint64
    - name: max(test30_right_vk_stream.k)
      type: string
    - name: _tp_delta
      type: int8
- type: wait
  time: 1

- type: query
  sql: insert into test30_right_vk_stream(i, k) values
  schema:
    - name: i
      type: int32
    - name: k
      type: string
  inputs:
    - [1, 'k1']
    - [2, 'k1']
- type: wait
  time: 1

- type: query
  sql: insert into test30_left_stream(i, k) values
  schema:
    - name: i
      type: int32
    - name: k
      type: string
  inputs:
    - [1, 'k1']
- type: wait
  time: 1

- type: query
  sql: kill query where query_id = '3000' sync
- type: wait
  time: 2

- name: 3000-1
  type: stream
  query: recover from '3000'
  schema:
    - name: i
      type: int32
    - name: count()
      type: uint64
    - name: max(test30_right_vk_stream.k)
      type: string
    - name: _tp_delta
      type: int8
- type: wait
  time: 1

- type: query
  sql: insert into test30_right_vk_stream(i, k) values
  schema:
    - name: i
      type: int32
    - name: k
      type: string
  inputs:
    - [1, 'kk1']
    - [2, 'kk1']
- type: wait
  time: 1

- type: query
  sql: insert into test30_left_stream(i, k) values
  schema:
    - name: i
      type: int32
    - name: k
      type: string
  inputs:
    - [1, 'k1']
    - [2, 'k1']
- type: wait
  time: 1

- type: query
  sql: unsubscribe to '3000'
- type: wait
  time: 3

- type: check
  target_name: 3000
  expected_result:
  - [1, 1, 'k1', 1]

- type: check
  target_name: 3000-1
  mode: random
  expected_result:
  - [1, 1, 'k1', -1]
  - [1, 2, 'kk1', 1]
  - [2, 1, 'kk1', 1]
