tags:
- global aggr
- emit changelog
description: global aggregation emit changelog query over versioned_kv
cluster:
- p1k1
- p3k1
steps:
- type: query
  sql: drop stream if exists test30_vk_stream
- type: wait
  time: 1

- type: query
  sql: create stream test30_vk_stream (i int, k string) primary key i settings mode='versioned_kv'
- type: wait
  time: 2

- name: 3000
  type: stream
  query: select k, count(), _tp_delta from test30_vk_stream group by k emit changelog periodic 1s
  schema:
  - name: k
    type: string
  - name: count()
    type: uint64
  - name: _tp_delta
    type: int8

- type: wait
  time: 1

- type: query
  sql: insert into test30_vk_stream(i, k) values
  schema:
    - name: i
      type: int32
    - name: k
      type: string
  inputs:
    - [1, 'kkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkk1']
    - [2, 'kkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkk1']
- type: wait
  time: 1

- type: check
  target_name: 3000
  expected_result:
  - [kkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkk1, 2, 1]

- type: query
  sql: insert into test30_vk_stream(i, k) values
  schema:
    - name: i
      type: int32
    - name: k
      type: string
  inputs:
    - [1, 'kkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkk2']

- type: check
  target_name: 3000
  mode: <<or .aggregation_check_mode "sequence">>
  expected_result:
  - [kkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkk1, 2, -1]
  - [kkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkk1, 1, 1]
  - [kkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkk2, 1, 1]
