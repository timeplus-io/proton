description: |
  Test drop storage policies and disks in the storage tier concept
  Main Steps:
  1.Create Disk, Storage Policy and Stream
  2.Verify Stream applied Storage Policy in 3 system tables
  4.Drop Stream
  5.Drop Storage Policy
  6.Drop Disk
  7.Restart proton service
  8.Verify Disk, Storage Policy and Stream not exist in 3 system tables

steps:
  - type: minio
    name: delete
    bucket: test

  - type: minio
    name: create
    bucket: test

  - type: query
    sql: DROP STREAM IF EXISTS hcs_01;

  - type: query
    sql: DROP STORAGE POLICY IF EXISTS hcs_minio_01;

  - type: query
    sql: DROP DISK IF EXISTS minio_01;

  # Create Disk & Storage Policy & Stream
  - type: query
    sql: |
      CREATE DISK minio_01 disk(
        type = 's3',
        endpoint = 'http://minio:9000/test/example01/',
        access_key_id = 'minioroot',
        secret_access_key = 'minioroot'
      );

  - type: query
    sql: |
      CREATE STORAGE POLICY hcs_minio_01 as $$
      volumes:
          hot:
              disk: default
          cold:
              disk: minio_01
      moving_factor: 0.1
      $$;

  - type: wait
    time: 2

  - type: query
    sql: |
      CREATE STREAM hcs_01
      (
        i32 int32,
        s string
      )
      TTL to_datetime(_tp_time) + interval 1 second TO VOLUME 'cold'
      SETTINGS storage_policy = 'hcs_minio_01', index_granularity = 8192;

  - type: wait
    time: 2

  - type: query
    sql: insert into hcs_01 (i32, s) values (1, 'hcs1');

  - type: wait
    time: 2

  - type: stream
    name: storage-1-1
    query: select name, path, type, is_remote from system.disks where name='minio_01';
    schema:
      - name: name
        type: string
      - name: path
        type: string
      - name: type
        type: string
      - name: is_remote
        type: uint8

  - type: stream
    name: storage-1-2
    query: select * from system.storage_policies where policy_name = 'hcs_minio_01';
    schema:
      - name: policy_name
        type: string
      - name: volume_name
        type: string
      - name: volume_priority
        type: uint64
      - name: disks
        type: array(string)
      - name: volume_type
        type: string
      - name: max_data_part_size
        type: uint64
      - name: move_factor
        type: float32
      - name: prefer_not_to_merge
        type: uint8

  - type: stream
    name: storage-1-3
    query: SELECT partition, name, disk_name FROM system.parts WHERE table = 'hcs_01';
    schema:
      - name: partition
        type: string
      - name: name
        type: string
      - name: disk_name
        type: string

  - type: check
    target_name: storage-1-1
    expected_result:
      - ['minio_01', '/var/lib/proton/disks/minio_01/', 'ObjectStorage', 1]

  - type: check
    target_name: storage-1-2
    expected_result:
      - ['hcs_minio_01', 'hot', 1, ['default'], 'JBOD', 0, 0.1, 0]
      - ['hcs_minio_01', 'cold', 2, ['minio_01'], 'JBOD', 0, 0.1, 0]

  - type: check
    target_name: storage-1-3
    expected_result:
      - [any_value, any_value, 'minio_01']

  # Drop Disk & Storage Policy & Stream
  - type: query
    sql: DROP STREAM hcs_01;

  - type: query
    sql: DROP STORAGE POLICY hcs_minio_01;

  - type: query
    sql: DROP DISK minio_01;

  - type: wait
    time: 1

  - type: stream
    name: storage-1-4
    query: select count() from system.disks where name='minio_01';
    schema:
      - name: count()
        type: uint64

  - type: stream
    name: storage-1-5
    query: SELECT count() FROM system.parts WHERE table = 'hcs_01';
    schema:
      - name: count()
        type: uint64

  - type: check
    target_name: storage-1-4
    expected_result:
      - [0]

  - type: check
    target_name: storage-1-5
    expected_result:
      - [0]

  - type: command
    node: [s1]
    shell: docker restart $(docker ps -a --format '{{.Names}}' --filter 'label=com.docker.compose.project=smoke_<<.CONTAINER_NAME_PREFIX>>' | grep timeplus)

  - type: wait
    time: 2

  - type: stream
    name: storage-1-6
    query: select count() from system.storage_policies where policy_name = 'hcs_minio_01';
    schema:
      - name: count()
        type: uint64

  - type: check
    target_name: storage-1-6
    expected_result:
      - [0]
