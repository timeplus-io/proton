tags:
  - window_aggregation

description: |
 Test window aggregation query
 Main steps:
  1. Query tumble window aggregate by max and group by id, window_start, window_end
  2. Query hot window aggregate by max and group by id, window_start, window_end

cluster:
  - p1k1
  - p3k1

steps:
  # create topic
  - type: kafka
    name: delete
    topic: test

  - type: kafka
    name: create
    topic: test
    settings:
      partitions: 1
      replication: 1
  - type: wait
    time: 2

  # create external stream
  - type: query
    sql: drop stream if exists test32_external
  - type: wait
    time: 1

  - type: query
    sql: create external stream test32_external
        (
          id string,
          value float,
          timestamp datetime64(3) DEFAULT now64(3)
        )
        settings type = 'kafka', brokers = 'k1:9092', topic = 'test', data_format='JSONEachRow'
  - type: wait
    time: 2

  # query and insert
  - type: stream
    name: external-stream-10-1
    query: |
      select id, max(value), window_start, window_end from tumble(test32_external, timestamp, 5s) group by id, window_start, window_end;
    schema:
      - name: id
        type: string
      - name: max(value)
        type: float32
      - name: window_start
        type: datetime64(3)
      - name: window_end
        type: datetime64(3)
  - type: wait
    time: 1

  - type: stream
    name: external-stream-10-2
    query: |
      select id, max(value), window_start, window_end from hop(test32_external, timestamp, 2s, 5s) group by id, window_start, window_end;
    schema:
      - name: id
        type: string
      - name: max(value)
        type: float32
      - name: window_start
        type: datetime64(3)
      - name: window_end
        type: datetime64(3)
  - type: wait
    time: 1

  - type: query
    sql: insert into test32_external(id, value, timestamp) values
    schema:
      - name: id
        type: string
      - name: value
        type: float32
      - name: timestamp
        type: datetime64(3)
    inputs:
      - ['dev1', 11.1, '2020-02-02 20:00:00']
      - ['dev1', 22.2, '2020-02-02 20:00:02']
      - ['dev2', 33.3, '2020-02-02 20:00:05']
      - ['dev3', 44.4, '2020-02-02 20:00:10']

  - type: check
    target_name: external-stream-10-1
    expected_result:
      - ['dev1', 22.2, '2020-02-02 20:00:00', '2020-02-02 20:00:05']
      - ['dev2', 33.3, '2020-02-02 20:00:05', '2020-02-02 20:00:10']

  - type: check
    target_name: external-stream-10-2
    mode: <<or .aggregation_check_mode "sequence">>
    expected_result:
      - ['dev1', 11.1, '2020-02-02 19:59:56', '2020-02-02 20:00:01']
      - ['dev1', 22.2, '2020-02-02 19:59:58', '2020-02-02 20:00:03']
      - ['dev1', 22.2, '2020-02-02 20:00:00', '2020-02-02 20:00:05']
      - ['dev2', 33.3, '2020-02-02 20:00:02', '2020-02-02 20:00:07']
      - ['dev1', 22.2, '2020-02-02 20:00:02', '2020-02-02 20:00:07']
      - ['dev2', 33.3, '2020-02-02 20:00:04', '2020-02-02 20:00:09']
