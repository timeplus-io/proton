tags:
  - timestamp
  - message_key
  - csv
  - bug
description: Verify CSV format can work with _tp_time and _tp_message_key, issue#8852
cluster:
  - p1k1
  - p3k1
steps:
  - type: kafka
    name: delete
    topic: test_ts_csv

  - type: kafka
    name: create
    topic: test_ts_csv
    settings:
      partitions: 3
      replication: 1

  - type: query
    sql: drop stream if exists test_ts_csv

  - type: wait
    time: 1

  # test_ts_and_key and test_key_and_ts for testing _tp_time and _tp_message_key can work together
  - type: query
    sql: create external stream test_ts_csv
        (
          key string,
          _tp_time datetime64(3, 'UTC'),
          value int32,
          _tp_message_key string
        )
        settings type = 'kafka', brokers = 'k1:9092', topic = 'test_ts_csv', data_format='CSV'

  - type: wait
    time: 1

  - type: stream
    name: select_from_test_ts_csv
    query: select * from test_ts_csv
    schema:
    - name: key
      type: string
    - name: _tp_time
      type: datetime64(3)
    - name: value
      type: int32
    - name: _tp_message_key
      type: string

  - type: wait
    time: 1

  - type: query
    sql: insert into test_ts_csv values ('three', '2025-04-27T01:33:03.123Z', 3, 'key_three')('four', '2025-04-27T01:34:04.234Z', 4, 'key_four')

  - type: wait
    time: 1

  - type: check
    target_name: select_from_test_ts_csv
    expected_result:
      - ['three', '2025-04-27 01:33:03.123', 3, 'key_three']
      - ['four', '2025-04-27 01:34:04.234', 4, 'key_four']
