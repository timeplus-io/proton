tags:
  - timestamp
  - message_key
  - csv
  - bug
description: Verify CSV format can work with virtual `_tp_time` and `_tp_message_key`, issue#8852
cluster:
  - p1k1
  - p3k1
steps:
  - type: kafka
    name: delete
    topic: test_ts_csv

  - type: kafka
    name: create
    topic: test_ts_csv
    settings:
      partitions: 3
      replication: 1

  - type: query
    sql: drop stream if exists test_ts_csv

  - type: wait
    time: 1

  # test_ts_and_key and test_key_and_ts for testing _tp_time and _tp_message_key can work together
  - type: query
    sql: create external stream test_ts_csv
        (
          key string,
          value int32,
          _tp_message_key string
        )
        settings type = 'kafka', brokers = 'k1:9092', topic = 'test_ts_csv', data_format='CSV'

  - type: wait
    time: 1

  - type: stream
    name: select_from_test_ts_csv
    query: select key, value, to_type_name(_tp_time), _tp_message_key from test_ts_csv order by key
    schema:
    - name: key
      type: string
    - name: value
      type: int32
    - name: to_type_name(_tp_time)
      type: string
    - name: _tp_message_key
      type: string

  - type: wait
    time: 1

  - type: query
    sql: insert into test_ts_csv values ('three', 3, 'key_three')('four', 4, 'key_four')

  - type: wait
    time: 1

  - type: check
    target_name: select_from_test_ts_csv
    expected_result:
      - ['four', 4, "datetime64(3, 'UTC')", 'key_four']
      - ['three', 3, "datetime64(3, 'UTC')", 'key_three']
