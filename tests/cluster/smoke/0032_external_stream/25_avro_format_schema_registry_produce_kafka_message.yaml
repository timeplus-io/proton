tags:
- avro

description: |
  Test kafka external stream with avro format and kafka_schema_registry_url setting, produce kafka message to ingest data
  Steps:
    1.create kafka topic
    2.create kafka schema registry
    3.check kafka schema registry exist with "curl -s http://localhost:8081/subjects"
    4.create external stream
    5.produce record to kafka
    6.query external stream with settings seek_to='earliest'
    7.query external stream

cluster:
- p1k1
- p3k1

steps:
  # kafka topic: drop and create
  - type: kafka
    name: delete
    topic: avro-ingest25

  - type: kafka
    name: create
    topic: avro-ingest25
    settings:
      partitions: 3
      replication: 1
  - type: wait
    time: 1

  # kafka schema registry: delete and create
  - type: command
    node: [k1]
    shell: curl -X DELETE http://localhost:8081/subjects/avro-ingest25-value # soft delete of all versions of the schema

  - type: command
    node: [k1]
    shell: curl -X DELETE http://localhost:8081/subjects/avro-ingest25-value?permanent=true  # hard delete of all versions of the schema

  - type: wait
    time: 1

  - type: command
    node: [k1]
    shell: |
      curl -s \
        -X POST \
        "http://localhost:8081/subjects/avro-ingest25-value/versions" \
        -H "Content-Type: application/vnd.schemaregistry.v1+json" \
        -d '{"schema": "{\"type\":\"record\",\"name\":\"car\",\"fields\":[{\"name\":\"model\",\"type\":\"string\"}, {\"name\":\"make\",\"type\":\"int\"}]}"}'
  - type: wait
    time: 1

  - name: external-stream-25-1
    type: command
    node: [k1]
    shell: curl -s http://localhost:8081/subjects/avro-ingest25-value/versions/1/schema

  - type: check
    target_name: external-stream-25-1
    expected_result: ['{"type":"record","name":"car","fields":[{"name":"model","type":"string"},{"name":"make","type":"int"}]}']

  - type: query
    sql: DROP STREAM IF EXISTS avro_ingest_ext;

  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE EXTERNAL STREAM avro_ingest_ext(
        model string,
        make int32
      )
      SETTINGS type = 'kafka',
      brokers = 'k1:9092',
      topic = 'avro-ingest25',
      data_format = 'Avro',
      kafka_schema_registry_url = 'http://k1:8081';

  - type: wait
    time: 2

  - type: avro_format
    name: format-25-1
    avro: |
      {
        "type": "record",
        "name": "car",
        "fields": [
            {"name": "model", "type": "string"},
            {"name": "make", "type": "int"}
        ]
      }
    schema_id: 1
    schema:
      - name: model
        type: string
      - name: make
        type: int32
    inputs:
      - ["model1", 1]
      - ["model2", 2]
      - ["model3", 3]
    buffer_size: 3

  - type: kafka_dataloader
    source: format-25-1
    sink: avro-ingest25
    concurrency: 1

  - type: wait
    time: 2

  - type: stream
    name: external-stream-25-2
    query: select model, make from avro_ingest_ext settings seek_to='earliest';
    schema:
      - name: model
        type: string
      - name: make
        type: int32

  - type: stream
    name: external-stream-25-3
    query: select model, make from avro_ingest_ext;
    schema:
      - name: model
        type: string
      - name: make
        type: int32

  - type: wait
    time: 3

  - type: avro_format
    name: format-25-2
    avro: |
      {
        "type": "record",
        "name": "car",
        "fields": [
            {"name": "model", "type": "string"},
            {"name": "make", "type": "int"}
        ]
      }
    schema_id: 1
    schema:
      - name: model
        type: string
      - name: make
        type: int32
    inputs:
      - ["model4", 4]
      - ["model5", 5]
      - ["model6", 6]
    buffer_size: 3

  - type: kafka_dataloader
    source: format-25-2
    sink: avro-ingest25
    concurrency: 1

  - type: check
    target_name: external-stream-25-2
    mode: random
    expected_result:
      - ['model1', 1]
      - ['model2', 2]
      - ['model3', 3]
      - ['model4', 4]
      - ['model5', 5]
      - ['model6', 6]

  - type: check
    target_name: external-stream-25-3
    mode: random
    expected_result:
      - ['model4', 4]
      - ['model5', 5]
      - ['model6', 6]
