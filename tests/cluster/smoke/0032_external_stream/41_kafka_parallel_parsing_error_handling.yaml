tags:
  - parallel parsing
  - error handling

description: |
  Test kafka external stream with parallel parsing and error handling.
  Steps:
    1.Create kafka topic
    2.Create external stream with JSONEachRow format
    3.Produce mix of valid and invalid JSON messages
    4.Query with input_format_ignore_parsing_errors=1 to skip bad messages
    5.Verify good messages are parsed correctly

cluster:
  - p1k1
  - p3k1

steps:
  - type: kafka
    name: delete
    topic: test_parallel_error_41

  - type: kafka
    name: create
    topic: test_parallel_error_41
    settings:
      partitions: 1
      replication: 1

  - type: wait
    time: 2

  - type: query
    sql: drop stream if exists ext_parallel_error_41;

  - type: query
    sql: drop stream if exists ext_parallel_error_41_ingest;

  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE EXTERNAL STREAM ext_parallel_error_41(
        id int32,
        value string
      )
      SETTINGS type = 'kafka',
      brokers = 'k1:9092',
      topic = 'test_parallel_error_41',
      data_format = 'JSONEachRow';

  - type: query
    sql: |
      CREATE EXTERNAL STREAM ext_parallel_error_41_ingest(
        _raw string
      )
      SETTINGS type = 'kafka',
      brokers = 'k1:9092',
      topic = 'test_parallel_error_41',
      data_format = 'RawBLOB';

  - type: wait
    time: 2

  # Start streaming query with error handling enabled
  - type: stream
    name: parallel-error-41-1
    query: select id, value from ext_parallel_error_41 settings seek_to='earliest', parallel_parsing=1, parallel_parsing_threads=1, input_format_ignore_parsing_errors=1, record_consume_batch_count=3;
    schema:
      - name: id
        type: int32
      - name: value
        type: string

  - type: stream
    name: parallel-error-41-2
    query: select id, value from ext_parallel_error_41 settings seek_to='earliest', parallel_parsing=1, parallel_parsing_threads=4, input_format_ignore_parsing_errors=1, record_consume_batch_count=3;
    schema:
      - name: id
        type: int32
      - name: value
        type: string

  # Parse in batch
  - type: stream
    name: parallel-error-41-3
    query: select id, value from ext_parallel_error_41 settings seek_to='earliest', parse_messages_in_batch=1, parallel_parsing=1, parallel_parsing_threads=1, input_format_ignore_parsing_errors=1, record_consume_batch_count=3;
    schema:
      - name: id
        type: int32
      - name: value
        type: string

  - type: stream
    name: parallel-error-41-4
    query: select id, value from ext_parallel_error_41 settings seek_to='earliest', parse_messages_in_batch=1, parallel_parsing=1, parallel_parsing_threads=4, input_format_ignore_parsing_errors=1, record_consume_batch_count=3;
    schema:
      - name: id
        type: int32
      - name: value
        type: string

  - type: wait
    time: 1

  # Produce valid JSON
  - type: kafka
    name: produce
    topic: test_parallel_error_41
    messages:
      - id: 1
        value: valid1

  - type: wait
    time: 1

  # Produce invalid JSON (malformed - missing closing brace) using raw command
  - type: query
    sql: |
        insert into ext_parallel_error_41_ingest(_raw) values ('"id": 2, "value": "bad"')

  - type: wait
    time: 1

  # Produce more valid JSON
  - type: kafka
    name: produce
    topic: test_parallel_error_41
    messages:
      - id: 3
        value: valid3
      - id: 4
        value: valid4

  - type: wait
    time: 1

  # Produce another invalid JSON
  - type: query
    sql: insert into ext_parallel_error_41_ingest(_raw) values ('not json at all')

  - type: wait
    time: 1

  # Produce final valid JSON
  - type: kafka
    name: produce
    topic: test_parallel_error_41
    messages:
      - id: 5
        value: valid5

  - type: check
    target_name: parallel-error-41-1
    expected_result:
      - [1, valid1]
      - [3, valid3]
      - [4, valid4]
      - [5, valid5]

  - type: check
    target_name: parallel-error-41-2
    expected_result:
      - [1, valid1]
      - [3, valid3]
      - [4, valid4]
      - [5, valid5]

  - type: check
    target_name: parallel-error-41-3
    expected_result:
      - [1, valid1]
      - [3, valid3]
      - [4, valid4]
      - [5, valid5]

  - type: check
    target_name: parallel-error-41-4
    expected_result:
      - [1, valid1]
      - [3, valid3]
      - [4, valid4]
      - [5, valid5]
