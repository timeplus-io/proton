tags:
- format_schema
- protobuf

description: (#5036) Format schema drop and create with different content.

cluster:
- p1k1
- p3k1

steps:
  # kafka topic: drop and create
  - type: kafka
    name: delete
    topic: test

  - type: kafka
    name: create
    topic: test
    settings:
      partitions: 1
      replication: 1
  - type: wait
    time: 2
    
  - type: query
    sql: DROP FORMAT SCHEMA IF EXISTS schema_name TYPE Protobuf;

  - type: query
    sql: DROP STREAM IF EXISTS test_external_stream;

  - type: wait
    time: 2

  - type: query
    sql: |
      CREATE FORMAT SCHEMA schema_name AS
      $$
      syntax = "proto3";
      message SearchRequest { 
        string query = 1;
        int32 page_number = 2;
      }
      $$
      TYPE Protobuf;
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE EXTERNAL STREAM test_external_stream
      (
        query string,
        page_number int
      )
      SETTINGS type = 'kafka',
          brokers = 'k1:9092',
          topic = 'test',
          data_format = 'Protobuf',
          format_schema = 'schema_name:SearchRequest';

  - type: wait
    time: 2

  - type: stream
    name: external-stream-12-1
    query: SELECT * FROM test_external_stream;
    schema:
      - name: query
        type: string
      - name: page_number
        type: int32
  - type: wait
    time: 1

  - type: protobuf_format
    name: format
    proto: |
      syntax = "proto3";
      message SearchRequest {
        string query = 1;
        int32 page_number = 2;
      }
    class: SearchRequest
    schema:
      - name: query
        type: string
      - name: page_number
        type: int32
    inputs:
      - ['select', 1]
      - ['create', 2]
      - ['drop', 3]
    buffer_size: 2
  - type: wait
    time: 1

  - type: kafka_dataloader
    source: format
    sink: test
    concurrency: 1

  - type: check
    target_name: external-stream-12-1
    expected_result:
      - ['select', 1]
      - ['create', 2]
      - ['drop', 3]

  # drop topic, stream, format schema and recreate
  - type: kafka
    name: delete
    topic: test

  - type: kafka
    name: create
    topic: test
    settings:
      partitions: 1
      replication: 1
  - type: wait
    time: 2

  - type: query
    sql: DROP FORMAT SCHEMA schema_name TYPE Protobuf;

  - type: query
    sql: DROP STREAM IF EXISTS test_external_stream;

  - type: wait
    time: 2

  - type: query
    sql: |
      CREATE FORMAT SCHEMA schema_name AS
        $$
        syntax = "proto3";
        message SearchRequest { 
          string query = 1;
          int32 page_number = 2;
          int32 results_per_page = 3;
        }
        $$
        TYPE Protobuf;

  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE EXTERNAL STREAM test_external_stream
      (
        query string,
        page_number int,
        results_per_page int
      )
      SETTINGS type = 'kafka',
          brokers = 'k1:9092',
          topic = 'test',
          data_format = 'Protobuf',
          format_schema = 'schema_name:SearchRequest';

  - type: wait
    time: 2

  - type: stream
    name: external-stream-12-2
    query: SELECT * FROM test_external_stream
    schema:
      - name: query
        type: string
      - name: page_number
        type: int32
      - name: results_per_page
        type: int32
  - type: wait
    time: 1

  - type: protobuf_format
    name: format
    proto: |
      syntax = "proto3";
      message SearchRequest {
        string query = 1;
        int32 page_number = 2;
        int32 results_per_page = 3;
      }
    class: SearchRequest
    schema:
      - name: query
        type: string
      - name: page_number
        type: int32
      - name: results_per_page
        type: int32
    inputs:
      - ['select', 1, 11]
      - ['create', 2, 22]
      - ['drop', 3, 33]
    buffer_size: 2
  - type: wait
    time: 1

  - type: kafka_dataloader
    source: format
    sink: test
    concurrency: 1

  - type: wait
    time: 3

  - type: check
    target_name: external-stream-12-2
    expected_result:
      - ['select', 1, 11]
      - ['create', 2, 22]
      - ['drop', 3, 33]
