tags:
  - parallel parsing
  - checkpoint
  - recovery
  - materialized view

description: |
  Test MV checkpoint/recovery with parallel_parsing enabled.
  Verifies that parallel parsing correctly maintains checkpoint state
  and can resume from the last checkpoint after pause/resume.
  Steps:
    1. Create external stream with JSONEachRow format
    2. Create MV with parallel_parsing=1
    3. Produce messages and verify receipt
    4. Pause MV
    5. Produce more messages (should not be consumed while paused)
    6. Resume MV
    7. Verify MV continues from checkpoint (no duplicates, no gaps)
    8. Produce final messages and verify

cluster:
  - p1k1
  - p3k1

steps:
  - type: query
    sql: drop view if exists mv_parallel_checkpoint_43;

  - type: wait
    time: 3

  - type: query
    sql: drop stream if exists ext_parallel_checkpoint_43;

  - type: wait
    time: 1

  - type: kafka
    name: delete
    topic: test_parallel_checkpoint_43

  - type: kafka
    name: create
    topic: test_parallel_checkpoint_43
    settings:
      partitions: 1
      replication: 1

  - type: query
    sql: |
      CREATE EXTERNAL STREAM ext_parallel_checkpoint_43(
        id int32,
        value string
      )
      SETTINGS type = 'kafka',
      brokers = 'k1:9092',
      topic = 'test_parallel_checkpoint_43',
      data_format = 'JSONEachRow',
      one_message_per_row = 1;

  - type: wait
    time: 2

  # Create MV with parallel parsing enabled (4 threads)
  - type: query
    sql: |
      CREATE MATERIALIZED VIEW mv_parallel_checkpoint_43 AS
      SELECT id, value
      FROM ext_parallel_checkpoint_43
      SETTINGS
        seek_to = 'earliest',
        parallel_parsing = 1,
        parallel_parsing_threads = 4,
        record_consume_batch_count = 5;

  - type: wait
    time: 2

  # Start a stream query to monitor MV output
  - type: stream
    name: parallel-checkpoint-43
    query: select id, value from mv_parallel_checkpoint_43 settings seek_to='earliest';
    schema:
      - name: id
        type: int32
      - name: value
        type: string

  - type: wait
    time: 1

  # Phase 1: Initial data
  - type: query
    sql: insert into ext_parallel_checkpoint_43(id, value) values (1, 'alpha') (2, 'beta') (3, 'gamma');

  - type: check
    target_name: parallel-checkpoint-43
    expected_result:
      - [1, alpha]
      - [2, beta]
      - [3, gamma]

  # Phase 2: Pause MV and produce data (should not be consumed)
  - type: query
    sql: system pause materialized view mv_parallel_checkpoint_43;

  - type: wait
    time: 1

  - type: query
    sql: insert into ext_parallel_checkpoint_43(id, value) values (4, 'delta') (5, 'epsilon');

  - type: wait
    time: 2

  # Verify no new data while paused
  - type: check
    target_name: parallel-checkpoint-43
    expected_result: []

  # Phase 3: Resume MV - should catch up from checkpoint
  - type: query
    sql: system resume materialized view mv_parallel_checkpoint_43;

  - type: wait
    time: 2

  # Verify MV resumed from checkpoint and consumed pending messages
  - type: check
    target_name: parallel-checkpoint-43
    expected_result:
      - [4, delta]
      - [5, epsilon]

  # Phase 4: Continue producing after resume
  - type: query
    sql: insert into ext_parallel_checkpoint_43(id, value) values (6, 'zeta') (7, 'eta') (8, 'theta');

  - type: check
    target_name: parallel-checkpoint-43
    expected_result:
      - [6, zeta]
      - [7, eta]
      - [8, theta]

  # Phase 5: Test with batch parsing + parallel parsing
  - type: query
    sql: drop view if exists mv_parallel_checkpoint_43_batch;

  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE MATERIALIZED VIEW mv_parallel_checkpoint_43_batch AS
      SELECT id, value
      FROM ext_parallel_checkpoint_43
      SETTINGS
        seek_to = 'earliest',
        parallel_parsing = 1,
        parallel_parsing_threads = 2,
        parse_messages_in_batch = 1,
        record_consume_batch_count = 10;

  - type: wait
    time: 3

  - type: stream
    name: parallel-checkpoint-43-batch
    query: select id, value from mv_parallel_checkpoint_43_batch settings seek_to='earliest';
    schema:
      - name: id
        type: int32
      - name: value
        type: string

  - type: wait
    time: 1

  # Should see all 8 messages from before
  - type: check
    target_name: parallel-checkpoint-43-batch
    expected_result:
      - [1, alpha]
      - [2, beta]
      - [3, gamma]
      - [4, delta]
      - [5, epsilon]
      - [6, zeta]
      - [7, eta]
      - [8, theta]

  # Pause and resume the batch MV
  - type: query
    sql: system pause materialized view mv_parallel_checkpoint_43_batch;

  - type: wait
    time: 1

  # Phase 4: Continue producing after resume
  - type: query
    sql: insert into ext_parallel_checkpoint_43(id, value) values (9, 'iota') (10, 'kappa');

  - type: wait
    time: 1

  - type: check
    target_name: parallel-checkpoint-43-batch
    expected_result: []

  - type: query
    sql: system resume materialized view mv_parallel_checkpoint_43_batch;

  - type: wait
    time: 2

  - type: check
    target_name: parallel-checkpoint-43-batch
    expected_result:
      - [9, iota]
      - [10, kappa]
