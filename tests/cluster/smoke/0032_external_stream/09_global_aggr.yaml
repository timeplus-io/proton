tags:
  - global_aggregation

description: |
 Test global aggregation query
 Main steps:
  1. Query global aggregation on stream function
  2. Query global aggregation on table function

cluster:
  - p1k1
  - p3k1

steps:
  # create topic
  - type: kafka
    name: delete
    topic: test

  - type: kafka
    name: create
    topic: test
    settings:
      partitions: 1
      replication: 1
  - type: wait
    time: 2

  # create external stream
  - type: query
    sql: drop stream if exists test32_external
  - type: wait
    time: 1

  - type: query
    sql: create external stream test32_external
        (
          id int,
          value string
        )
        settings type = 'kafka', brokers = 'k1:9092', topic = 'test', data_format='JSONEachRow'
  - type: wait
    time: 2

  # query and insert
  - type: query
    sql: insert into test32_external(id, value) values
    schema:
      - name: id
        type: int32
      - name: value
        type: string
    inputs:
      - [1, 'aaaa']
  - type: wait
    time: 1

  - type: stream
    name: external-stream-9-1
    query: select count(*) from test32_external
    schema:
      - name: count()
        type: uint64
  - type: wait
    time: 1

  - type: query
    sql: insert into test32_external(id, value) values
    schema:
      - name: id
        type: int32
      - name: value
        type: string
    inputs:
      - [2, 'bbbb']
  - type: wait
    time: 2

  - type: query
    sql: insert into test32_external(id, value) values
    schema:
      - name: id
        type: int32
      - name: value
        type: string
    inputs:
      - [3, 'cccc']
      - [4, 'dddd']
  - type: wait
    time: 2

  - type: stream
    name: external-stream-9-2
    query: select count(*) from table(test32_external)
    schema:
      - name: count()
        type: uint64

  - type: check
    target_name: external-stream-9-1
    expected_result:
      - [1]
      - [3]

  - type: check
    target_name: external-stream-9-2
    expected_result:
      - [4]
