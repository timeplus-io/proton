tags:
  - to_support

description: Test covering scalar 

cluster:
  - p1k1

steps:
  - type: query
    sql: drop stream if exists test41_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream test41_stream (value int);
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_add_five(value int) RETURNS int LANGUAGE PYTHON AS $$
      def test_add_five(value):
          for i in range(len(value)):
              value[i] = value[i] + 5
          return value
      $$;

  - type: wait
    time: 1

  - name: python_udf-1
    type: stream
    query: select test_add_five(value) as res, value from test41_stream;
    schema:
      - name: res
        type: int32
      - name: value
        type: int32
  - type: wait
    time: 1

  - type: query
    sql: insert into test41_stream(value) values
    schema:
      - name: value
        type: int32
    inputs:
      - [1]
      - [2]
      - [3]

  - type: wait
    time: 1

  - type: check
    target_name: python_udf-1
    expected_result:
      - [6, 1]
      - [7, 2]
      - [8, 3]

