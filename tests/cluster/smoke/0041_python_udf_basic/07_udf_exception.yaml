tags:
  - to_support

description: Test covering udf thorws exception

cluster:
  - p1k1
  - p3k1

steps:
  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_add_five2(value uint16) RETURNS uint16 LANGUAGE PYTHON AS $$
      def test_add_five2(value):
          for i in range(len(value)):
              if value[i] > 10:
                  raise Exception("value is greater than 10")
              value[i] = value[i] + 5
          return value
      $$;

  - type: wait
    time: 1

  - name: python_udf-7
    type: stream
    query: select test_add_five2(11) as res;
    schema:
      - name: res
        type: uint16

  - type: wait
    time: 3

  - type: check
    target_name: python_udf-7
    expected_result:
    - ["error_code:2624"]
