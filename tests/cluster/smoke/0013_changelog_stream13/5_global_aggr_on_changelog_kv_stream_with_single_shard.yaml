tags:
- global aggr distinct
- changelog_kv
- single shard
description: sum_distinct and count_distinct for changelog_kv stream with single shard.
cluster:
- p1k1
- p3k1
steps:
- type: query
  sql: drop stream if exists changelog_kv_13
- type: wait
  time: 2

- type: query
  sql: create stream changelog_kv_13(id int, val int) primary key id settings mode='changelog_kv';
- type: wait
  time: 2

- name: '13108'
  type: stream
  query: select count_distinct(val), sum_distinct(val) from changelog_kv_13 emit periodic 1s;
  schema:
  - name: count_distinct(val)
    type: uint64
  - name: sum_distinct(val)
    type: int64
- type: wait
  time: 2

- type: query
  sql: insert into changelog_kv_13(id, val, _tp_delta) values
  schema:
  - name: id
    type: int32
  - name: val
    type: int32
  - name: _tp_delta
    type: int8
  inputs:
  - [2, 1, 1]
  - [2, 1, -1]
  - [3, 2, 1]
  - [3, 2, -1]

- type: check
  target_name: '13108'
  expected_result:
  - [0, 0]
