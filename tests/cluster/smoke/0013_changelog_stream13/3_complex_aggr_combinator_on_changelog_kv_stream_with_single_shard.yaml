tags:
- global aggr distinct
- changelog_kv
- single shard
- checkpoint
description: count_distinct_if and sum_distinct_if for changelog_kv stream with single
  shard.
cluster:
- p1k1
- p3k1
steps:
- type: query
  sql: drop stream if exists v_12181927;
- type: wait
  time: 1

- type: query
  sql: create stream v_12181927(id int, val float, month string) primary key id settings mode='changelog_kv';
- type: wait
  time: 1

- name: '12181927213'
  type: stream
  query: select sum_distinct_if(val, month='May'), sum_distinct(val), sum(val), count_distinct_if(val, month='May'), count_distinct(val), count(val) from v_12181927;
  schema:
  - name: sum_distinct_if(val, month = 'May')
    type: float64
  - name: sum_distinct(val)
    type: float64
  - name: sum(val)
    type: float64
  - name: count_distinct_if(val, month = 'May')
    type: uint64
  - name: count_distinct(val)
    type: uint64
  - name: count(val)
    type: uint64
- type: wait
  time: 2

- type: query
  sql: insert into v_12181927(id, val, month) values
  schema:
  - name: id
    type: int32
  - name: val
    type: float32
  - name: month
    type: string
  inputs:
  - [1, 10, 'May']
  - [2, 20, 'June']
- type: wait
  time: 2

- type: query
  sql: insert into v_12181927(id, val, month) values
  schema:
  - name: id
    type: int32
  - name: val
    type: float32
  - name: month
    type: string
  inputs:
  - [3, 10, 'May']
  - [4, 50, 'July']
- type: wait
  time: 3

- type: query
  sql: insert into v_12181927(id, val, month, _tp_delta) values
  schema:
  - name: id
    type: int32
  - name: val
    type: float32
  - name: month
    type: string
  - name: _tp_delta
    type: int8
  inputs:
  - [5, 15, 'May', 1]
  - [4, 50, 'July', -1]
- type: wait
  time: 2

- type: query
  sql: insert into v_12181927(id, val, month, _tp_delta) values
  schema:
  - name: id
    type: int32
  - name: val
    type: float32
  - name: month
    type: string
  - name: _tp_delta
    type: int8
  inputs:
  - [3, 10, 'May', -1]
  - [2, 20, 'June', -1]
- type: wait
  time: 2

- type: query
  sql: insert into v_12181927(id, val, month, _tp_delta) values
  schema:
  - name: id
    type: int32
  - name: val
    type: float32
  - name: month
    type: string
  - name: _tp_delta
    type: int8
  inputs:
  - [1, 10, 'May', -1]
  - [5, 15, 'May', -1]

- type: check
  target_name: '12181927213'
  expected_result:
  - [10, 30, 30, 1, 2, 2]
  - [10, 80, 90, 1, 3, 4]
  - [25, 45, 55, 2, 3, 4]
  - [25, 25, 25, 2, 2, 2]
  - [0, 0, 0, 0, 0, 0]
