tags:
- local-run
- global aggr distinct
- changelog_kv
- single shard
- checkpoint
- emit changelog
- bug # https://github.com/timeplus-io/proton-enterprise/issues/10548
description: sum_distinct and count_distinct for changelog_kv stream with single shard.
cluster:
- p1k1
# - p3k1 # subscribe to no support for cluster
steps:
- type: query
  sql: drop stream if exists v_12181627
- type: wait
  time: 2

- type: query
  sql: create stream v_12181627(id int, val int) primary key id settings mode='changelog_kv';
- type: wait
  time: 2

- name: '12181627214'
  type: stream
  query_id: '12181627214'
  query: subscribe to select sum_distinct(val), sum(val), count_distinct(val), count(val), _tp_delta from v_12181627 emit changelog settings checkpoint_interval=1;
  schema:
  - name: sum_distinct(val)
    type: int64
  - name: sum(val)
    type: int64
  - name: count_distinct(val)
    type: uint64
  - name: count(val)
    type: uint64
  - name: _tp_delta
    type: int8
- type: wait
  time: 3

- type: query
  sql: insert into v_12181627(id, val) values (3, 30);
- type: wait
  time: 3

- type: query
  sql: kill query where query_id = '12181627214'
- type: wait
  time: 3

- name: 12181627214-1
  type: stream
  query: recover from '12181627214'
  schema:
  - name: sum_distinct(val)
    type: int64
  - name: sum(val)
    type: int64
  - name: count_distinct(val)
    type: uint64
  - name: count(val)
    type: uint64
  - name: _tp_delta
    type: int8
- type: wait
  time: 3

- type: query
  sql: insert into v_12181627(id, val) values (4, 40)(5, 40);
- type: wait
  time: 2

- type: query
  sql: insert into v_12181627(id, val, _tp_delta) values (4, 40, -1)(50, 40, -1);
- type: wait
  time: 2

- type: query
  sql: insert into v_12181627(id, val) values (4, 40)(5, 50);
- type: wait
  time: 2

- type: query
  sql: insert into v_12181627(id, val, _tp_delta) values (4, 40, -1)(50, 50, -1);
- type: wait
  time: 2

- type: query
  sql: kill query where query_id='12181627214' sync
- type: wait
  time: 3

- type: query
  sql: unsubscribe to '12181627214'

- type: check
  target_name: '12181627214'
  expected_result:
  - [30, 30, 1, 1, 1]

- type: check
  target_name: 12181627214-1
  expected_result:
  - [30, 30, 1, 1, -1]
  - [70, 110, 2, 3, 1]
  - [70, 110, 2, 3, -1]
  - [30, 30, 1, 1, 1]
  - [30, 30, 1, 1, -1]
  - [120, 120, 3, 3, 1]
  - [120, 120, 3, 3, -1]
  - [30, 30, 1, 1, 1]
