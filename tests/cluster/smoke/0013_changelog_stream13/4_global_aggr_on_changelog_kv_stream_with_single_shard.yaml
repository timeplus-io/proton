tags:
- global aggr distinct
- changelog_kv
- single shard
- checkpoint
description: sum_distinct and count_distinct for changelog_kv stream with single shard.
cluster:
- p1k1
# - p3k1 # subscribe to no support for cluster
steps:
- type: query
  sql: drop stream if exists v_12180413
- type: wait
  time: 2

- type: query
  sql: create stream v_12180413(id int, val int) primary key id settings mode='changelog_kv';
- type: wait
  time: 2

- name: '12180413213'
  type: stream
  query_id: '12180413213'
  query: subscribe to select sum_distinct_retract(val), sum(val), count_distinct(val), count(val) from v_12180413 settings checkpoint_interval=1;
  schema:
  - name: sum_distinct_retract(val)
    type: int64
  - name: sum(val)
    type: int64
  - name: count_distinct(val)
    type: uint64
  - name: count(val)
    type: uint64
- type: wait
  time: 3

- type: query
  sql: insert into v_12180413(id, val) values
  schema:
  - name: id
    type: int32
  - name: val
    type: int32
  inputs:
  - [3, 30]
- type: wait
  time: 2

- type: query
  sql: kill query where query_id = '12180413213'
- type: wait
  time: 3

- name: 12180413213-1
  type: stream
  query: recover from '12180413213'
  schema:
  - name: sum_distinct_retract(val)
    type: int64
  - name: sum(val)
    type: int64
  - name: count_distinct(val)
    type: uint64
  - name: count(val)
    type: uint64
- type: wait
  time: 1

- type: query
  sql: insert into v_12180413(id, val) values
  schema:
  - name: id
    type: int32
  - name: val
    type: int32
  inputs:
  - [4, 40]
  - [5, 40]
- type: wait
  time: 2

- type: query
  sql: insert into v_12180413(id, val, _tp_delta) values
  schema:
  - name: id
    type: int32
  - name: val
    type: int32
  - name: _tp_delta
    type: int8
  inputs:
  - [4, 40, -1]
  - [5, 40, -1]
- type: wait
  time: 2

- type: query
  sql: insert into v_12180413(id, val) values
  schema:
  - name: id
    type: int32
  - name: val
    type: int32
  inputs:
  - [4, 40]
  - [5, 50]
- type: wait
  time: 2

- type: query
  sql: insert into v_12180413(id, val, _tp_delta) values
  schema:
  - name: id
    type: int32
  - name: val
    type: int32
  - name: _tp_delta
    type: int8
  inputs:
  - [4, 40, -1]
  - [5, 50, -1]
- type: wait
  time: 2

- type: query
  sql: kill query where query_id='12180413213' sync
- type: wait
  time: 2

- type: query
  sql: unsubscribe to '12180413213'

- type: check
  target_name: '12180413213'
  expected_result:
  - [30, 30, 1, 1]

- type: check
  target_name: 12180413213-1
  expected_result:
  - [70, 110, 2, 3]
  - [30, 30, 1, 1]
  - [120, 120, 3, 3]
  - [30, 30, 1, 1]
