tags:
  - query_state
description: multiple recover hopping_window in substream from state checkpoint
cluster:
  - p1k1
steps:
  - type: query
    sql: drop stream if exists test19_state_stream5

  - type: wait
    time: 1

  - type: query
    sql: create stream test19_state_stream5 (id string, location string, value float,
      timestamp datetime64(3) default now64(3))

  - type: wait
    time: 1

  - name: '19111'
    query_id: '19111'
    type: stream
    query: subscribe to select id, count(*), min(value), max(value), window_start, window_end
      from hop(test19_state_stream5, timestamp, 3s, 5s) partition by id group by window_start,
      window_end settings checkpoint_interval=1
    schema:
      - name: id
        type: string
      - name: count()
        type: uint64
      - name: min(value)
        type: float32
      - name: max(value)
        type: float32
      - name: window_start
        type: datetime64(3)
      - name: window_end
        type: datetime64(3)

  - type: wait
    time: 3

  - type: query
    sql: insert into test19_state_stream5(id, location, value, timestamp) values ('dev1',
      'ca', 57.3, '2020-02-02 20:00:00')

  - type: query
    sql: insert into test19_state_stream5(id, location, value, timestamp) values ('dev2',
      'ca', 58.3, '2020-02-02 20:00:00')

  - type: query
    sql: insert into test19_state_stream5(id, location, value, timestamp) values ('dev1',
      'ca', 68, '2020-02-02 20:00:01')

  - type: query
    sql: insert into test19_state_stream5(id, location, value, timestamp) values ('dev2',
      'ca', 55, '2020-02-02 20:00:03')

  - type: query
    sql: insert into test19_state_stream5(id, location, value, timestamp) values ('dev1',
      'ca', 69, '2020-02-02 20:00:04')

  - type: wait
    time: 3

  - type: query
    sql: kill query where query_id = '19111'

  - type: wait
    time: 1

  - type: query
    sql: insert into test19_state_stream5(id, location, value, timestamp) values ('dev1',
      'ca', 55, '2020-02-02 20:00:06')

  - type: query
    sql: insert into test19_state_stream5(id, location, value, timestamp) values ('dev2',
      'ca', 67, '2020-02-02 20:00:07')

  - name: 19111-1
    query_id: 19111-1
    type: stream
    query: recover from '19111'
    schema:
      - name: id
        type: string
      - name: count()
        type: uint64
      - name: min(value)
        type: float32
      - name: max(value)
        type: float32
      - name: window_start
        type: datetime64(3)
      - name: window_end
        type: datetime64(3)

  - type: wait
    time: 3

  - type: query
    sql: kill query where query_id='19111' sync

  - type: wait
    time: 1

  - type: query
    sql: insert into test19_state_stream5(id, location, value, timestamp) values ('dev1',
      'ca', 67, '2020-02-02 20:00:9')

  - type: query
    sql: insert into test19_state_stream5(id, location, value, timestamp) values ('dev2',
      'ca', 33, '2020-02-02 20:00:10')

  - name: 19111-2
    query_id: 19111-2
    type: stream
    query: recover from '19111'
    schema:
      - name: id
        type: string
      - name: count()
        type: uint64
      - name: min(value)
        type: float32
      - name: max(value)
        type: float32
      - name: window_start
        type: datetime64(3)
      - name: window_end
        type: datetime64(3)

  - type: wait
    time: 3

  - type: query
    sql: kill query where query_id='19111' sync

  - type: wait
    time: 1

  - type: query
    sql: unsubscribe to '19111'

  - type: check
    target_name: '19111'
    expected_result:
      - [ dev2, 1, '58.3', '58.3', '2020-02-02 19:59:57', '2020-02-02 20:00:02' ]
      - [ dev1, 2, '57.3', '68', '2020-02-02 19:59:57', '2020-02-02 20:00:02' ]

  - type: check
    target_name: 19111-1
    expected_result:
      - [ dev1, 3, '57.3', '69', '2020-02-02 20:00:00', '2020-02-02 20:00:05' ]
      - [ dev2, 2, '55', '58.3', '2020-02-02 20:00:00', '2020-02-02 20:00:05' ]
    
  - type: check
    target_name: 19111-2
    expected_result:
      - [ dev1, 2, '55', '69', '2020-02-02 20:00:03', '2020-02-02 20:00:08' ]
      - [ dev2, 2, '55', '67', '2020-02-02 20:00:03', '2020-02-02 20:00:08' ]
