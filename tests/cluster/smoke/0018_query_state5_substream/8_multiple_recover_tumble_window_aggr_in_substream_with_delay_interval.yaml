tags:
  - query_state
description: multiple recover tumble window aggregation in substream with delay interval
  from state checkpoint
cluster:
  - p1k1
steps:
  - type: query
    sql: drop stream if exists test19_state_stream5

  - type: wait
    time: 1

  - type: query
    sql: create stream test19_state_stream5 (id string, location string, value float,
      timestamp datetime64(3) default now64(3))

  - type: wait
    time: 1

  - name: '19108'
    query_id: '19108'
    type: stream
    query: subscribe to select id, count(*), min(value), max(value), window_start, window_end
      from tumble(test19_state_stream5, timestamp, 5s) partition by id group by window_start,
      window_end emit stream after window close with delay 2s settings checkpoint_interval=1
    schema:
      - name: id
        type: string
      - name: count()
        type: uint64
      - name: min(value)
        type: float32
      - name: max(value)
        type: float32
      - name: window_start
        type: datetime64(3)
      - name: window_end
        type: datetime64(3)

  - name: '191081'
    query_id: '191081'
    type: stream
    query: subscribe to select id, count(*), min(value), max(value), window_start, window_end
      from tumble(test19_state_stream5, timestamp, 5s) partition by id group by window_start,
      window_end emit stream after watermark with delay 2s settings checkpoint_interval=1
    schema:
      - name: id
        type: string
      - name: count()
        type: uint64
      - name: min(value)
        type: float32
      - name: max(value)
        type: float32
      - name: window_start
        type: datetime64(3)
      - name: window_end
        type: datetime64(3)

  - type: wait
    time: 1

  - type: query
    sql: insert into test19_state_stream5(id, location, value, timestamp) values ('dev1',
      'ca', 57.3, '2020-02-02 20:00:00')

  - type: query
    sql: insert into test19_state_stream5(id, location, value, timestamp) values ('dev2',
      'ca', 58.3, '2020-02-02 20:00:02')

  - type: query
    sql: insert into test19_state_stream5(id, location, value, timestamp) values ('dev1',
      'ca', 67, '2020-02-02 20:00:03')

  - type: query
    sql: insert into test19_state_stream5(id, location, value, timestamp) values ('dev2',
      'ca', 69, '2020-02-02 20:00:03')

  - type: query
    sql: insert into test19_state_stream5(id, location, value, timestamp) values ('dev1',
      'ca', 77, '2020-02-02 20:00:06')

  - type: query
    sql: insert into test19_state_stream5(id, location, value, timestamp) values ('dev2',
      'ca', 69, '2020-02-02 20:00:07')

  - type: query
    sql: insert into test19_state_stream5(id, location, value, timestamp) values ('dev1',
      'ca', 55, '2020-02-02 20:00:04')

  - type: query
    sql: insert into test19_state_stream5(id, location, value, timestamp) values ('dev2',
      'ca', 66, '2020-02-02 20:00:04')

  - type: wait
    time: 3

  - type: query
    sql: kill query where query_id = '19108'

  - type: query
    sql: kill query where query_id = '191081'

  - type: wait
    time: 3

  - type: query
    sql: insert into test19_state_stream5(id, location, value, timestamp) values ('dev2',
      'ca', 67, '2020-02-02 20:00:9')

  - type: query
    sql: insert into test19_state_stream5(id, location, value, timestamp) values ('dev1',
      'ca', 68, '2020-02-02 20:00:7')

  - type: query
    sql: insert into test19_state_stream5(id, location, value, timestamp) values ('dev2',
      'ca', 78, '2020-02-02 20:00:13')

  - type: wait
    time: 3

  - name: 19108-1
    query_id: 19108-1
    type: stream
    query: recover from '19108'
    schema:
      - name: id
        type: string
      - name: count()
        type: uint64
      - name: min(value)
        type: float32
      - name: max(value)
        type: float32
      - name: window_start
        type: datetime64(3)
      - name: window_end
        type: datetime64(3)

  - name: 191081-1
    query_id: 191081-1
    type: stream
    query: recover from '191081'
    schema:
      - name: id
        type: string
      - name: count()
        type: uint64
      - name: min(value)
        type: float32
      - name: max(value)
        type: float32
      - name: window_start
        type: datetime64(3)
      - name: window_end
        type: datetime64(3)

  - type: wait
    time: 3

  - type: query
    sql: kill query where query_id='19108' sync

  - type: query
    sql: kill query where query_id='191081' sync

  - type: wait
    time: 3

  - type: query
    sql: insert into test19_state_stream5(id, location, value, timestamp) values ('dev1',
      'ca', 77, '2020-02-02 20:00:13')

  - type: query
    sql: insert into test19_state_stream5(id, location, value, timestamp) values ('dev1',
      'ca', 68, '2020-02-02 20:00:8')

  - name: 19108-2
    query_id: 19108-2
    type: stream
    query: recover from '19108'
    schema:
      - name: id
        type: string
      - name: count()
        type: uint64
      - name: min(value)
        type: float32
      - name: max(value)
        type: float32
      - name: window_start
        type: datetime64(3)
      - name: window_end
        type: datetime64(3)

  - name: 191081-2
    query_id: 191081-2
    type: stream
    query: recover from '191081'
    schema:
      - name: id
        type: string
      - name: count()
        type: uint64
      - name: min(value)
        type: float32
      - name: max(value)
        type: float32
      - name: window_start
        type: datetime64(3)
      - name: window_end
        type: datetime64(3)

  - type: wait
    time: 3

  - type: query
    sql: kill query where query_id='19108' sync

  - type: query
    sql: kill query where query_id='191081' sync

  - type: wait
    time: 1

  - type: query
    sql: unsubscribe to '19108'
  
  - type: query
    sql: unsubscribe to '191081'
  
  - type: check
    target_name: '19108'
    expected_result:
      - [ dev2, 2, '58.3', '69', '2020-02-02 20:00:00', '2020-02-02 20:00:05' ]
  
  - type: check
    target_name: '191081'
    expected_result:
      - [ dev2, 2, '58.3', '69', '2020-02-02 20:00:00', '2020-02-02 20:00:05' ]

  - type: check
    target_name: 19108-1
    expected_result:
      - [ dev1, 3, '55', '67', '2020-02-02 20:00:00', '2020-02-02 20:00:05' ]
      - [ dev2, 2, '67', '69', '2020-02-02 20:00:05', '2020-02-02 20:00:10' ]

  - type: check
    target_name: 191081-1
    expected_result:
      - [ dev1, 3, '55', '67', '2020-02-02 20:00:00', '2020-02-02 20:00:05' ]
      - [ dev2, 2, '67', '69', '2020-02-02 20:00:05', '2020-02-02 20:00:10' ]

  - type: check
    target_name: 19108-2
    expected_result:
      - [ dev1, 2, '68', '77', '2020-02-02 20:00:05', '2020-02-02 20:00:10' ]

  - type: check
    target_name: 191081-2
    expected_result:
      - [ dev1, 2, '68', '77', '2020-02-02 20:00:05', '2020-02-02 20:00:10' ]
