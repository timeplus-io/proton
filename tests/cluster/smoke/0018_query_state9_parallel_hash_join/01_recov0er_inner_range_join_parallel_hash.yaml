tags:
- query_state
- stream_join_stream
description: recover inner range join parallel_hash from state checkpoint
cluster:
- p1k1
#  # unsupport subscribe to
steps:
- type: query
  sql: drop stream if exists test19_left_stream2
- type: query
  sql: drop stream if exists test19_right_stream2
- type: wait
  time: 1

- type: query
  sql: create stream if not exists test19_left_stream2 (i int, s string, ts datetime)
- type: wait
  time: 1

- type: query
  sql: create stream if not exists test19_right_stream2 (ii int, ss string, tts datetime)
- type: wait
  time: 1

- name: '19221'
  type: stream
  query_id: '19221'
  query: subscribe to select s, ss from test19_left_stream2 inner join test19_right_stream2
    on i=ii and date_diff_within(10s, ts, tts) settings join_algorithm = 'parallel_hash',
    checkpoint_interval=1
  schema:
  - name: s
    type: string
  - name: ss
    type: string
- type: wait
  time: 1

- type: query
  sql: insert into test19_left_stream2(i, s, ts) values
  schema:
  - name: i
    type: int32
  - name: s
    type: string
  - name: ts
    type: datetime
  inputs:
  - [1, 's', '2022-05-23 15:45:10']
- type: wait
  time: 1

- type: query
  sql: insert into test19_right_stream2(ii, ss, tts) values
  schema:
  - name: ii
    type: int32
  - name: ss
    type: string
  - name: tts
    type: datetime
  inputs:
  - [1, 's1', '2022-05-23 15:44:59']
  - [1, 's2', '2022-05-23 15:45:00']
  - [1, 's3', '2022-05-23 15:45:09']
- type: wait
  time: 3

- type: query
  sql: kill query where query_id = '19221'
- type: wait
  time: 3

- type: query
  sql: insert into test19_right_stream2(ii, ss, tts) values
  schema:
  - name: ii
    type: int32
  - name: ss
    type: string
  - name: tts
    type: datetime
  inputs:
  - [1, 's4', '2022-05-23 15:45:10']
  - [1, 's5', '2022-05-23 15:45:15']
  - [1, 's6', '2022-05-23 15:45:19']
  - [1, 's7', '2022-05-23 15:45:20']
  - [1, 's8', '2022-05-23 15:45:21']
- type: wait
  time: 3

- name: 19221-1
  type: stream
  query: recover from '19221'
  schema:
  - name: s
    type: string
  - name: ss
    type: string
- type: wait
  time: 3

- type: query
  sql: unsubscribe to '19221'

- type: check
  target_name: '19221'
  expected_result:
  - [s, s2]
  - [s, s3]

- type: check
  target_name: 19221-1
  expected_result:
  - [s, s4]
  - [s, s5]
  - [s, s6]
  - [s, s7]
