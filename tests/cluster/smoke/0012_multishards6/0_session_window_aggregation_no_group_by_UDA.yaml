tags:
- local-run
- multishards
- append_only
- subquery
- subquery_view_materialized-view
- tail_aggr_last-X
- streaming_aggregation
- window_aggregation
- session_window_aggregation
- no_group_by
- UDA
description: session window aggregation no group by, UDA
cluster:
- p1k1
- p3k1
steps:
  - type: wait
    time: 1

  - type: query
    sql: |
      drop view if exists test13_view2_6;

  - type: wait
    time: 1

  - type: query
    sql: |
      drop view if exists test13_view1_6;

  - type: wait
    time: 1

  - type: query
    sql: |
      drop stream if exists test13_multishard_6;

  - type: wait
    time: 1

  - type: query
    sql: create stream test13_multishard_6(speed int, id int, timestamp datetime64(3) default now64(3)) settings shards=3;

  - type: wait
    time: 1

  - type: query
    sql: |
      create materialized view test13_view1_6 as
      select speed,
             id,
             timestamp
      from test13_multishard_6;
  
  - type: wait
    time: 1
  
  - name: '1350'
    type: stream
    query: |
      select test_13_6_sec_large(to_float(speed)) as sec_l,
             window_start as s,
             window_end as e
      from session(test13_view1_6, timestamp, 5m, [speed >= 60, speed < 60))
      group by window_start,
               window_end;
    schema:
        - name: sec_l
          type: float32
        - name: s
          type: datetime64(3)
        - name: e
          type: datetime64(3)
          
  - type: wait
    time: 1

  - type: query
    sql: |
      insert into test13_multishard_6(speed, id, timestamp)
      values (40, 1, '2021-11-02 20:00:01');

  - type: wait
    time: 1

  - type: query
    sql: |
      insert into test13_multishard_6(speed, id, timestamp)
      values (50, 2, '2021-11-02 20:00:02');

  - type: wait
    time: 1

  - type: query
    sql: |
      insert into test13_multishard_6(speed, id, timestamp)
      values (60, 1, '2021-11-02 20:00:03');

  - type: wait
    time: 1

  - type: query
    sql: |
      insert into test13_multishard_6(speed, id, timestamp)
      values (70, 2, '2021-11-02 20:00:04');

  - type: wait
    time: 1

  - type: query
    sql: |
      insert into test13_multishard_6(speed, id, timestamp)
      values (80, 1, '2021-11-02 20:00:05');

  - type: wait
    time: 1

  - type: query
    sql: |
      insert into test13_multishard_6(speed, id, timestamp)
      values (90, 2, '2021-11-02 20:00:06');

  - type: wait
    time: 1

  - type: query
    sql: |
      insert into test13_multishard_6(speed, id, timestamp)
      values (80, 1, '2021-11-02 20:00:07');

  - type: wait
    time: 1

  - type: query
    sql: |
      insert into test13_multishard_6(speed, id, timestamp)
      values (70, 2, '2021-11-02 20:00:08');

  - type: wait
    time: 1

  - type: query
    sql: |
      insert into test13_multishard_6(speed, id, timestamp)
      values (60, 1, '2021-11-02 20:00:09');

  - type: wait
    time: 1

  - type: query
    sql: |
      insert into test13_multishard_6(speed, id, timestamp)
      values (50, 2, '2021-11-02 20:00:10');

  - type: wait
    time: 1

  - type: query
    sql: |
      insert into test13_multishard_6(speed, id, timestamp)
