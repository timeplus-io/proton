tags:
- ddl-column

description: streaming query after add a column
cluster:
- p1k1
- p3k1

steps:
- type: query
  sql: drop stream if exists add_new_column_stream
- type: wait
  time: 1

- type: query
  sql: create stream add_new_column_stream (id int, name string, val float, ts datetime)
- type: wait
  time: 1

- name: '2702'
  type: stream
  query: select id, count(*), min(val), max(val), sum(val), avg(val) from add_new_column_stream  group by id  emit periodic 2s
  schema:
  - name: id
    type: int32
  - name: count()
    type: uint64
  - name: min(val)
    type: float32
  - name: max(val)
    type: float32
  - name: sum(val)
    type: float64
  - name: avg(val)
    type: float64
- type: wait
  time: 2

- type: query
  sql: insert into add_new_column_stream (id, name, val, ts) values
  schema:
  - name: id
    type: int32
  - name: name
    type: string
  - name: val
    type: float32
  - name: ts
    type: datetime
  inputs:
  - [1, 's1', 11.1, '2020-02-02 20:00:01']
  - [2, 's2', 22.2, '2020-02-02 20:00:02']
  - [1, 's3', 33.3, '2020-02-02 20:00:03']
  - [2, 's4', 44.4, '2020-02-02 20:00:04']
- type: wait
  time: 1

- type: query
  sql: ALTER STREAM add_new_column_stream ADD COLUMN add_float float
- type: wait
  time: 1

- name: 2702-1
  type: stream
  query: select id, count(*), min(add_float), max(add_float), sum(add_float), avg(add_float)
    from add_new_column_stream  group by id  emit periodic 2s
  schema:
  - name: id
    type: int32
  - name: count()
    type: uint64
  - name: min(add_float)
    type: float32
  - name: max(add_float)
    type: float32
  - name: sum(add_float)
    type: float64
  - name: avg(add_float)
    type: float64
- type: wait
  time: 1

- type: query
  sql: insert into add_new_column_stream (* except (_tp_time, _tp_sn)) values
  schema:
  - name: id
    type: int32
  - name: name
    type: string
  - name: val
    type: float32
  - name: ts
    type: datetime
  - name: add_float
    type: float32
  inputs:
  - [1, 's5', 55.5, '2020-02-02 20:00:05', 44.4]
  - [1, 's6', 66.6, '2020-02-02 20:00:06', 22.2]
  - [1, 's7', 77.7, '2020-02-02 20:00:07', 66.6]

- type: check
  target_name: '2702'
  mode: random
  expected_result:
  - [2, 2, 22.2, 44.4, 66.6, 33.3]
  - [1, 2, 11.1, 33.3, 44.4, 22.2]
  - [2, 2, 22.2, 44.4, 66.60000228881836, 33.30000114440918]
  - [1, 5, 11.1, 77.7, 244.19999504089355, 48.83999900817871]

- type: check
  target_name: 2702-1
  expected_result:
  - [1, 3, 22.2, 66.6, 133.2, 44.4]
