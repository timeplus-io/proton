tags:
- ddl-column
- bug
description: streaming query after add a column
cluster:
- p1k1
- p3k1
steps:
- type: query
  sql: drop stream if exists add_new_column_stream
- type: wait
  time: 1

- type: query
  sql: create stream add_new_column_stream (id int, name string, val float, ts datetime)
- type: wait
  time: 1

- name: '2700'
  type: stream
  query: select id, name, val, ts from add_new_column_stream
  schema:
  - name: id
    type: int32
  - name: name
    type: string
  - name: val
    type: float32
  - name: ts
    type: datetime
- type: wait
  time: 1

- type: query
  sql: insert into add_new_column_stream (id, name, val, ts) values
  schema:
  - name: id
    type: int32
  - name: name
    type: string
  - name: val
    type: float32
  - name: ts
    type: datetime
  inputs:
  - [1, 's1', 11.1, '2020-02-02 20:00:01']
- type: wait
  time: 1

- type: query
  sql: insert into add_new_column_stream (id, name, val, ts) values
  schema:
  - name: id
    type: int32
  - name: name
    type: string
  - name: val
