tags:
- ddl-column
- bug
description: delete new column again afrer rename column
cluster:
- p1k1
- p3k1
steps:
- type: query
  sql: drop stream if exists rename_column_stream
- type: wait
  time: 1

- type: query
  sql: create stream rename_column_stream (id int, name string, val float, ts datetime)
- type: wait
  time: 1

- name: '2706'
  type: stream
  query: select id, name, val, ts from rename_column_stream
  schema:
  - name: id
    type: int32
  - name: name
    type: string
  - name: val
    type: float32
  - name: ts
    type: datetime
- type: wait
  time: 1

- type: query
  sql: insert into del_column_stream (id, name, val, ts) values
  schema:
  - name: id
    type: int32
  - name: name
    type: string
  - name: val
    type: float32
  - name: ts
    type: datetime
  inputs:
  - [1, 's1', 11.1, '2020-02-02 20:00:01']
- type: wait
  time: 1

- type: query
  sql: ALTER STREAM rename_column_stream RENAME COLUMN IF EXISTS ts to timestamp
- type: wait
  time: 1

- type: query
  sql: insert into rename_column_stream (id, name, val, timestamp) values
  schema:
  - name: id
    type: int32
  - name: name
    type: string
  - name: val
    type: float32
  - name: timestamp
    type: datetime
  inputs:
  - [2, 's2', 22.2, '2020-02-02 20:00:02']
- type: wait
  time: 1

- name: 2706-1
  type: stream
  query: select id, name, val, timestamp from rename_column_stream
  schema:
  - name: id
    type: int32
  - name: name
    type: string
  - name: val
    type: float32
  - name: timestamp
