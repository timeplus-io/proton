tags:
  - mysql

description: |
  Test ddl dictionary with source MySQL
  Main steps:
  1.Create table in MySQL and ingest data
  2.Create dictionary in Proton with source MySQL
  3.Verify dictionary connectivity via dict_get
  4.Drop dictionary

steps:
  - type: command
    node: [s1]
    shell: docker exec <<.CONTAINER_NAME_PREFIX>>_mysql mysql -u root --password=rootpassword -e "DROP DATABASE IF EXISTS testdb;" mysql

  - type: command
    node: [s1]
    shell: docker exec <<.CONTAINER_NAME_PREFIX>>_mysql mysql -u root --password=rootpassword -e "CREATE DATABASE testdb;" mysql

  - type: command
    node: [s1]
    shell: docker exec <<.CONTAINER_NAME_PREFIX>>_mysql mysql -u root --password=rootpassword -e "CREATE TABLE products (id INT PRIMARY KEY, name VARCHAR(255));" testdb

  - type: command
    node: [s1]
    shell: docker exec <<.CONTAINER_NAME_PREFIX>>_mysql mysql -u root --password=rootpassword -e "INSERT INTO products (id, name) VALUES (1, 'p111');" testdb

  - type: query
    sql: DROP DICTIONARY IF EXISTS mysql_products_flat;

  - type: wait
    time: 1

  - type: query
    node: [p1]
    sql: |
      CREATE DICTIONARY mysql_products_flat(id int, name string DEFAULT 'Unknown')
      PRIMARY KEY id
      SOURCE(MYSQL(DB 'testdb' TABLE 'products' HOST 'mysql' PORT 3306 USER 'root' PASSWORD 'rootpassword' BG_RECONNECT true))
      LIFETIME(MIN 1 MAX 10)
      LAYOUT(FLAT());

  - type: wait
    time: 1

  - name: dict-2-1
    <<if eq .nodes "1">>
    node: [p1]
    <<else>>
    node: [p2]
    <<end>>
    type: stream
    query: SELECT dict_get('mysql_products_flat', 'name', 1);
    schema:
      - name: dict_get('mysql_products_flat', 'name', 1)
        type: string

  - type: check
    target_name: dict-2-1
    expected_result:
      - ['p111']

  - type: query
    <<if eq .nodes "1">>
    node: [p1]
    <<else>>
    node: [p3]
    <<end>>
    sql: DROP DICTIONARY mysql_products_flat;

  - type: wait
    time: 1

  - name: dict-2-2
    type: stream
    <<if eq .nodes "1">>
    node: [p1]
    <<else>>
    node: [p2]
    <<end>>
    query: SELECT dict_get('mysql_products_flat', 'name', 1);
    schema:
      - name: dict_get('mysql_products_flat', 'name', 1)
        type: string

  - type: check
    target_name: dict-2-2
    expected_result:
      - ['error_code:36']
