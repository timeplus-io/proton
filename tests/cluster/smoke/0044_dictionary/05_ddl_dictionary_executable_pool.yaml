tags:
  - unsupport
  - skip

description: |
  Test ddl dictionary with source Executable Pool
  Main steps:
  1.Create Shell script in proton container under '/var/lib/proton/user_files/' directory
  2.Create stream and ingest data
  3.Create dictionary with source Executable Pool
  4.Verify dictionary connectivity via dict_get
  5.Drop dictionary

steps:
  - type: command
    <<if eq .nodes "1">>
    node: [p1]
    <<else>>
    node: [p1, p2, p3]
    <<end>>
    shell: |
      content='#!/bin/bash\necho -e "1\tp111"\necho -e "2\tp222"\necho -e "3\tp333"' &&
      cd /var/lib/proton/user_files/ &&
      rm -rf smoke_dict_10.sh &&
      echo "$content" > smoke_dict_10.sh &&
      chmod +x smoke_dict_10.sh

  - type: query
    sql: DROP DICTIONARY IF EXISTS executable_pool_flat;

  - type: wait
    time: 1

  - type: query
    node: [p1]
    sql: |
      CREATE DICTIONARY executable_pool_flat(id uint64 DEFAULT 0, value string DEFAULT '')
      PRIMARY KEY id
      SOURCE(EXECUTABLE_POOL(command '/var/lib/proton/user_files/smoke_dict_10.sh' format 'TabSeparated'))
      LIFETIME(MIN 1 MAX 10)
      LAYOUT(FLAT());

  - type: wait
    time: 1

  - name: dict-5-1
    type: stream
    <<if eq .nodes "1">>
    node: [p1]
    <<else>>
    node: [p2]
    <<end>>
    query: SELECT dict_get('executable_pool_flat', 'value', '1');
    schema:
      - name: dict_get('executable_pool_flat', 'value', '1')
        type: string

  - type: check
    target_name: dict-5-1
    expected_result:
      - ['p111']

  - type: query
    <<if eq .nodes "1">>
    node: [p1]
    <<else>>
    node: [p3]
    <<end>>
    sql: DROP DICTIONARY executable_pool_flat;

  - type: wait
    time: 1

  - name: dict-5-2
    type: stream
    <<if eq .nodes "1">>
    node: [p1]
    <<else>>
    node: [p2]
    <<end>>
    query: SELECT dict_get('executable_pool_flat', 'value', '1');
    schema:
      - name: dict_get('executable_pool_flat', 'value', '1')
        type: string

  - type: check
    target_name: dict-5-2
    expected_result:
      - ['error_code:36']
