description: |
  Test ddl dictionary with source Timeplus
  Main steps:
  1.Create stream and ingest data
  2.Create dictionary with source Timeplus
  3.Verify dictionary connectivity via dict_get
  4.Drop dictionary

steps:
  # SOURCE PROTON
  - type: query
    sql: DROP STREAM IF EXISTS products;

  - type: wait
    time: 1

  - type: query
    sql: CREATE STREAM products (id uint64, name string);

  - type: wait
    time: 2

  - type: query
    sql: INSERT INTO products (id, name) VALUES (1, 'p111');

  # PROTON
  - type: query
    sql: DROP DICTIONARY IF EXISTS tp_products_flat;

  - type: wait
    time: 1

  - type: query
    node: [p1]
    sql: |
      CREATE DICTIONARY tp_products_flat(id uint64 DEFAULT 0, name string DEFAULT '')
      PRIMARY KEY id
      SOURCE(TIMEPLUS(HOST 'localhost' PORT tcp_port() USER 'default' QUERY 'SELECT id, name FROM table(products)' PASSWORD ''))
      LIFETIME(MIN 1 MAX 10)
      LAYOUT(FLAT());

  - type: wait
    time: 1

  - name: dict-0-1
    type: stream
    <<if eq .nodes "1">>
    node: [p1]
    <<else>>
    node: [p2]
    <<end>>
    query: SELECT dict_get('tp_products_flat', 'name', 1);
    schema:
      - name: dict_get('tp_products_flat', 'name', 1)
        type: string

  - type: check
    target_name: dict-0-1
    expected_result:
      - ['p111']

  - type: query
    <<if eq .nodes "1">>
    node: [p1]
    <<else>>
    node: [p3]
    <<end>>
    sql: DROP DICTIONARY tp_products_flat;

  - type: wait
    time: 1

  - name: dict-0-2
    type: stream
    <<if eq .nodes "1">>
    node: [p1]
    <<else>>
    node: [p2]
    <<end>>
    query: SELECT dict_get('tp_products_flat', 'name', 1);
    schema:
      - name: dict_get('tp_products_flat', 'name', 1)
        type: string

  - type: check
    target_name: dict-0-2
    expected_result:
      - ['error_code:36']
