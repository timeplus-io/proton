description: |
  Test ddl dictionary with source File
  Main steps:
  1.Create CSV file in proton container under '/var/lib/proton/user_files/' directory
  2.Create stream and ingest data
  3.Create dictionary with source File
  4.Verify dictionary connectivity via dict_get
  5.Drop dictionary

steps:
  - type: command
    <<if eq .nodes "1">>
    node: [p1]
    <<else>>
    node: [p1, p2, p3]
    <<end>>
    shell: |
      rm -rf /var/lib/proton/user_files/smoke_dict_08.tsv &&
      echo '1,p111' > /var/lib/proton/user_files/smoke_dict_08.tsv

  - type: query
    sql: DROP DICTIONARY IF EXISTS file_flat;

  - type: wait
    time: 1

  - type: query
    node: [p1]
    sql: |
      CREATE DICTIONARY file_flat(id uint64 DEFAULT 0, value string DEFAULT '')
      PRIMARY KEY id
      SOURCE(FILE(path '/var/lib/proton/user_files/smoke_dict_08.tsv' format 'CSV'))
      LIFETIME(MIN 1 MAX 10)
      LAYOUT(FLAT());

  - type: wait
    time: 1

  - name: dict-3-1
    type: stream
    <<if eq .nodes "1">>
    node: [p1]
    <<else>>
    node: [p2]
    <<end>>
    query: SELECT dict_get('file_flat', 'value', '1');
    schema:
      - name: dict_get('file_flat', 'value', '1')
        type: string

  - type: check
    target_name: dict-3-1
    expected_result:
      - ['p111']

  - type: query
    <<if eq .nodes "1">>
    node: [p1]
    <<else>>
    node: [p3]
    <<end>>
    sql: DROP DICTIONARY file_flat;

  - type: wait
    time: 1

  - name: dict-3-2
    type: stream
    <<if eq .nodes "1">>
    node: [p1]
    <<else>>
    node: [p2]
    <<end>>
    query: SELECT dict_get('file_flat', 'value', '1');
    schema:
      - name: dict_get('file_flat', 'value', '1')
        type: string

  - type: check
    target_name: dict-3-2
    expected_result:
      - ['error_code:36']
