tags:
  - tumble window
description: stream tumble w/inputs across multiple windows for window start alignment and the last input in the middle of latest window -#101
cluster:
  - p1k1
  - p3k1
steps:
  - type: stream
    name: 101
    query: select emit_version() as emit_version, window_start, window_end, count(*) from tumble(test_smoke, timestamp, interval 3 second) where value > 50 group by  window_start, window_end emit stream
    schema:
      - name: emit_version
        type: int64
      - name: window_start
        type: datetime64(3)
      - name: window_end
        type: datetime64(3)
      - name: count()
        type: uint64
  - type: wait
    time: 1

  - type: query
    sql: insert into test_smoke(id, location, value, json, timestamp) values
    schema:
      - name: id
        type: string
      - name: location
        type: string
      - name: value
        type: float32
      - name: json
        type: string
      - name: timestamp 
        type: datetime64(3)
    inputs:
      - ['dev1', 'ca', 57.3, '\"create_time\":\"2021-11-02 20:00:01\"', '2020-02-02 20:00:50']
      - ['dev1', 'ca', 57.3, '\"create_time\":\"2021-11-02 20:00:01\"', '2020-02-02 20:00:51']
      - ['dev2', 'ca', 58.3, '\"create_time\":\"2021-11-02 20:00:10\"', '2020-02-02 20:00:55']
      - ['dev2', 'ca', 58.3, '\"create_time\":\"2021-11-02 20:00:10\"', '2020-02-02 20:00:57']

  - type: check
    target_name: 101
    expected_result:
      - ['0', '2020-02-02 20:00:48', '2020-02-02 20:00:51', 1]
      - ['1', '2020-02-02 20:00:51', '2020-02-02 20:00:54', 1]
      - ['2', '2020-02-02 20:00:54', '2020-02-02 20:00:57', 1]
