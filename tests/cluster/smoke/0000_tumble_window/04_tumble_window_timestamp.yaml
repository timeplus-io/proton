tags:
  - tumble window
description: stream tumble window with designated timestamp w/ out of order timestamp within window
cluster:
  - p1k1
  - p3k1
steps:
  - type: stream
    name: 101
    query: select max(value), window_start, window_end from tumble(test_smoke, timestamp, interval 5 second) group by window_start, window_end emit stream
    schema:
      - name: max(value)
        type: float32
      - name: window_start
        type: datetime64(3)
      - name: window_end
        type: datetime64(3)
  - type: wait
    time: 1

  - type: query
    sql: insert into test_smoke(id, location, value, json, timestamp) values
    schema:
      - name: id
        type: string
      - name: location
        type: string
      - name: value
        type: float32
      - name: json
        type: string
      - name: timestamp 
        type: datetime64(3)
    inputs:
      - ['dev1', 'ca', 57.3, '\"create_time\":\"2021-11-02 20:00:01\"', '2020-02-02 20:00:14']
      - ['dev2', 'ca', 58.3, '\"create_time\":\"2021-11-02 20:00:10\"', '2020-02-02 20:00:13']
      - ['dev6', 'ca', 66, '\"create_time\":\"2021-11-02 20:00:11\"', '2020-02-02 20:00:12']
      - ['dev8', 'ca', 67, '\"create_time\":\"2021-11-02 20:00:11\"', '2020-02-02 20:00:15']

  - type: check
    target_name: 101
    expected_result:
      - ['66', '2020-02-02 20:00:10', '2020-02-02 20:00:15']
