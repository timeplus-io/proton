tags:
  - hopping window
  - to verify
description: hopping window w/1st data not alinged with window start, tranform function in subquery to extract timestamp from a json and run hopping on the subquery
cluster:
  - p1k1
  - p3k1
steps:
  - type: stream
    name: 101
    query: select id, max(value), window_start, window_end from hop(test_smoke, timestamp, interval 2 second, interval 5 second) group by id, window_start, window_end
    schema:
      - name: id
        type: string
      - name: max(value)
        type: float32
      - name: window_start
        type: datetime64(3)
      - name: window_end
        type: datetime64(3)
  - type: wait
    time: 1

  - type: query
    sql: insert into test_smoke(id, location, value, json, timestamp) values
    schema:
      - name: id
        type: string
      - name: location
        type: string
      - name: value
        type: float32
      - name: json
        type: string
      - name: timestamp 
        type: datetime64(3)
    inputs:
      - ['dev1', 'ca', 60, '{\"create_time\":\"2021-11-02 20:00:01\"}', '2021-11-02 20:00:01']
      - ['dev2', 'ca', 66, '{\"create_time\":\"2021-11-02 20:00:03\"}', '2021-11-02 20:00:03']
      - ['dev2', 'ca', 58.3, '{\"create_time\":\"2021-11-02 20:00:02\"}', '2021-11-02 20:00:02']

  - type: query
    sql: insert into test_smoke(id, location, value, json, timestamp) values
    schema:
      - name: id
        type: string
      - name: location
        type: string
      - name: value
        type: float32
      - name: json
        type: string
      - name: timestamp 
        type: datetime64(3)
    inputs:
      - ['dev1', 'ca', 59, '{\"create_time\":\"2021-11-02 20:00:04\"}', '2021-11-02 20:00:04']
      - ['dev8', 'ca', 67, '{\"create_time\":\"2021-11-02 20:00:05\"}', '2021-11-02 20:00:05']
