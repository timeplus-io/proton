tags:
  - hopping window
  - timestamp extracted from json
description: tranform function in hopping window query
cluster:
  - p1k1
  - p3k1
steps:
  - type: stream
    name: 101
    query: select id, max(value), window_end from hop(test_smoke, to_time(json_extract_string(json, 'create_time')), interval 2 second, interval 5 second) where window_end < '2021-11-02 20:00:09' group by id, window_end
    schema:
      - name: id
        type: string
      - name: max(value)
        type: float32
      - name: window_end
        type: datetime64(3)
  - type: wait
    time: 1

  - type: query
    sql: insert into test_smoke(id, location, value, json, timestamp) values
    schema:
      - name: id
        type: string
      - name: location
        type: string
      - name: value
        type: float32
      - name: json
        type: string
      - name: timestamp 
        type: datetime64(3)
    inputs:
      - ['dev1', 'ca', 60, '{"create_time":"2021-11-02 20:00:01"}', '2020-02-02 20:01:00']
      - ['dev2', 'ca', 66, '{"create_time":"2021-11-02 20:00:03"}', '2020-02-02 20:01:01']
      - ['dev2', 'ca', 58.3, '{"create_time":"2021-11-02 20:00:02"}', '2020-02-02 20:01:03']

  - type: query
    sql: insert into test_smoke(id, location, value, json, timestamp) values
    schema:
      - name: id
        type: string
      - name: location
        type: string
      - name: value
        type: float32
      - name: json
        type: string
      - name: timestamp 
        type: datetime64(3)
    inputs:
      - ['dev1', 'ca', 59, '{"create_time":"2021-11-02 20:00:04"}', '2020-02-02 20:01:06']
      - ['dev8', 'ca', 67, '{"create_time":"2021-11-02 20:00:05"}', '2020-02-02 20:01:07']
      - ['dev8', 'ca', 77, '{"create_time":"2021-11-02 20:00:06"}', '2020-02-02 20:01:10']

  - type: query
