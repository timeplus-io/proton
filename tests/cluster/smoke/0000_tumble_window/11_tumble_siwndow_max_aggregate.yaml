tags:
  - hopping window
description: stream hopping window max(value) aggregate group by id, window_start, window_end, with emit_version(), tumble window aggregate by max and group by id, window_start, window_end
cluster:
  - p1k1
  - p3k1
steps:
  - type: stream
    name: 101
    query: select emit_version(), id, max(value), window_start, window_end from hop(test_smoke, timestamp, interval 3 second, interval 5 second) group by id, window_start, window_end emit stream
    schema:
      - name: emit_version()
        type: int64
      - name: id
        type: string
      - name: max(value)
        type: float32
      - name: window_start
        type: datetime64(3)
      - name: window_end
        type: datetime64(3)
  - type: wait
    time: 1

  - type: query
    sql: insert into test_smoke(id, location, value, json, timestamp) values
    schema:
      - name: id
        type: string
      - name: location
        type: string
      - name: value
        type: float32
      - name: json
        type: string
      - name: timestamp 
        type: datetime64(3)
    inputs:
      - ['dev1', 'ca', 57.3, '\"create_time\":\"2021-11-02 20:00:01\"', '2020-02-02 20:00:00']
      - ['dev2', 'ca', 58.3, '\"create_time\":\"2021-11-02 20:00:10\"', '2020-02-02 20:00:03']
      - ['dev6', 'ca', 66, '\"create_time\":\"2021-11-02 20:00:11\"', '2020-02-02 20:00:04']
      - ['dev6', 'ca', 69, '\"create_time\":\"2021-11-02 20:00:11\"', '2020-02-02 20:00:05']
      - ['dev8', 'ca', 68, '\"create_time\":\"2021-11-02 20:00:11\"', '2020-02-02 20:00:08']
      - ['dev8', 'ca', 67, '\"create_time\":\"2021-11-02 20:00:11\"', '2020-02-02 20:00:10']

  - type: check
    target_name: 101
    mode: random
    expected_result:
      - ['0', 'dev1', '57.3', '2020-02-02 19:59:57', '2020-02-02 20:00:02']
      - ['1', 'dev2', '58.3', '2020-02-02 20:00:00', '2020-02-02 20:00:05']
      - ['1', 'dev6', '66', '2020-02-02 20:00:00', '2020-02-02 20:00:05']
      - ['1', 'dev1', '57.3', '2020-02-02 20:00:00', '2020-02-02 20:00:05']
      - ['2', 'dev6', '69', '2020-02-02 20:00:03', '2020-02-02 20:00:08']
      - ['2', 'dev2', '58.3', '2020-02-02 20:00:03', '2020-02-02 20:00:08']
