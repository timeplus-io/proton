tags:
  - hopping window
  - delay
description: stream hopping window count(*) w/delay, tumble window aggregate by max and group by id, window_start, window_end
cluster:
  - p1k1
  - p3k1
steps:
  - type: stream
    name: 101
    query: select location, count(*), window_start, window_end from hop(test_smoke, timestamp, interval 3 second, interval 5 second) group by location, window_start, window_end emit stream after window close with delay interval 2 second
    schema:
      - name: location
        type: string
      - name: count()
        type: uint64
      - name: window_start
        type: datetime64(3)
      - name: window_end
        type: datetime64(3)

  - type: stream
    name: 101-1
    query: select location, count(*), window_start, window_end from hop(test_smoke, timestamp, interval 3 second, interval 5 second) group by location, window_start, window_end emit stream after watermark with delay interval 2 second
    schema:
      - name: location
        type: string
      - name: count()
        type: uint64
      - name: window_start
        type: datetime64(3)
      - name: window_end
        type: datetime64(3)

  - type: wait
    time: 1

  - type: query
    sql: insert into test_smoke(id, location, value, json, timestamp) values
    schema:
      - name: id
        type: string
      - name: location
        type: string
      - name: value
        type: float32
      - name: json
        type: string
      - name: timestamp 
        type: datetime64(3)
    inputs:
      - ['dev1', 'ca', 51, '\"create_time\":\"2021-11-02 20:00:01\"', '2020-02-02 20:00:00']
      - ['dev1', 'ca', 99, '\"create_time\":\"2021-11-02 20:00:01\"', '2020-02-02 20:00:02']
