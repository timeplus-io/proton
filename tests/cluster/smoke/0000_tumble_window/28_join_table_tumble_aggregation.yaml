      - ['dev1', 'roof', 57.3, '2020-02-02 20:01:00', '2020-02-02 20:01:05']
      - ['dev2', 'field', 66, '2020-02-02 20:01:00', '2020-02-02 20:01:05']
      - ['dev2', 'field', 58.3, '2020-02-02 20:01:05', '2020-02-02 20:01:10']
