tags:
  - subquery/view/materilized_view_UDA
  - group_by_primary_key
  - bug
description: subquery/view/materialized view/  group by no primary key
cluster:
  - p1k1
  - p3k1
steps:
  - type: query
    sql: create stream test14_subquery_5(i int, k1 int, k2 string);
  - type: wait
    time: 2

  - type: query
    sql: |
      create view test14_view_5 as (
        with cte as (select i, k1,
          k2, _tp_delta from changelog(test14_subquery_5, k2))
        select * from cte
      );
  - type: wait
    time: 2

  - name: "1414"
    type: stream
    query: select max(i), min(i), avg(i), k1 from test14_view_5 group by k1;
    schema:
      - name: max(i)
        type: int32
      - name: min(i)
        type: int32
      - name: avg(i)
        type: float64
      - name: k1
        type: int32
  - type: wait
    time: 2

  - type: query
    sql: insert into test14_subquery_5(i, k1, k2) values (4, 3, 'a');
  - type: wait
    time: 2

  - type: query
    sql: insert into test14_subquery_5(i, k1, k2) values (2, 3, 'a');
  - type: wait
    time: 2

  - type: query
    sql: insert into test14_subquery_5(i, k1, k2) values (5, 5, 'b');
  - type: wait
    time: 2

  - type: query
    sql: insert into test14_subquery_5(i, k1, k2) values (2, 2, 'a');
  - type: wait
    time: 2

  - type: query
    sql: insert into test14_subquery_5(i, k1, k2) values (8, 5, 'b');
  - type: wait
    time: 2

  - type: query
    sql: insert into test14_subquery_5(i, k1, k2) values (8, 2, 'b');

  - type: check
    target_name: "1414"
    expected_result:
      - [4, 2, 3.33333, 3]
      - [4, 2, 3.0, 3]
      - [2, 2, 2.0, 2]
      - [5, 5, 5.0, 5]
      - [4, 2, 3.0, 3]
      - [8, 2, 5.0, 2]
      - [8, 5, 6.5, 5]
