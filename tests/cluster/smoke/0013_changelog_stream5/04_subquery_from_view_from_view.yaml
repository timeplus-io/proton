tags:
  - subquery/view/materilized_view_UDA
  - group_by_primary_key
description: subquery from view from view
cluster:
  - p1k1
  - p3k1
steps:
  - type: query
    sql: create stream test14_subquery_5(i int, k1 int, k2 string);
  - type: wait
    time: 2

  - type: query
    sql: |
      create view if not exists test14_view1_5 as (
        select i, k1, k2, _tp_delta from changelog(test14_subquery_5, k2)
      );
  - type: wait
    time: 2

  - type: query
    sql: |
      create view if not exists test14_view2_5 as (
        select * from test14_view1_5
      );

  - type: wait
    time: 2

  - name: "1416"
    type: stream
    query: select max(i), min(i), avg(i), k1 from test14_view2_5 group by k1;
    schema:
      - name: max(i)
        type: int32
      - name: min(i)
        type: int32
      - name: avg(i)
        type: float64
      - name: k1
        type: int32
  - type: wait
    time: 2

  - type: query
    sql: insert into test14_subquery_5(i, k1, k2) values (4, 3, 'a');

  - type: wait
    time: 2

  - type: query
    sql: insert into test14_subquery_5(i, k1, k2) values (2, 3, 'a');

  - type: wait
    time: 2

  - type: query
    sql: insert into test14_subquery_5(i, k1, k2) values (5, 5, 'b');

  - type: wait
    time: 2

  - type: query
    sql: insert into test14_subquery_5(i, k1, k2) values (2, 2, 'a');

  - type: wait
    time: 2

  - type: query
    sql: insert into test14_subquery_5(i, k1, k2) values (8, 5, 'b');

  - type: wait
    time: 2

  - type: query
    sql: insert into test14_subquery_5(i, k1, k2) values (8, 2, 'b');

  - type: wait
    time: 3

  - type: check
    target_name: "1416"
    mode: <<or .aggregation_check_mode "sequence">>
    expected_result:
      - [4, 4, 4.0, 3]
      - [2, 2, 2.0, 3]
      - [2, 2, 2.0, 3]
      - [5, 5, 5.0, 5]
      - [0, 0, nan, 3]
      - [2, 2, 2.0, 2]
      - [5, 5, 5.0, 5]
      - [0, 0, nan, 3]
      - [2, 2, 2.0, 2]
      - [8, 8, 8.0, 5]
      - [0, 0, nan, 3]
      - [8, 2, 5.0, 2]
      - [0, 0, nan, 5]
