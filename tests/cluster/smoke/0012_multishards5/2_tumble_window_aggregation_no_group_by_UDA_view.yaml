  - name: '1342'
    type: stream
    query: |
      select test_13_5_sec_large(to_float(i)) as sec_l,
             window_start as s,
             window_end as e
      from tumble(test13_view1_5 ,timestamp, 5s)
      group by window_start,
               window_end;
    schema:
      - name: sec_l
        type: float32
      - name: s
        type: datetime64(3)
      - name: e
        type: datetime64(3)
        
  - type: wait
