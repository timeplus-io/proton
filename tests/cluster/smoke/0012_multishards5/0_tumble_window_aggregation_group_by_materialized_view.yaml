description: tumble window aggregation group by, materialized view
cluster:
- p1k1
- p3k1
steps:
  - type: wait
    time: 1

  - type: query
    sql: |
      drop view if exists test13_view2_5;

  - type: wait
    time: 1

  - type: query
    sql: |
      drop view if exists test13_view1_5;

  - type: wait
    time: 1

  - type: query
    sql: |
      drop stream if exists test13_multishard_5;

  - type: wait
    time: 1

  - type: query
    sql: create stream test13_multishard_5(i float, k int, timestamp datetime64(3) default now64(3)) settings shards=3;

  - type: wait
    time: 2

  - type: query
    sql: |
      create materialized view test13_view1_5 as
      select i+2 as i,
             k,
             timestamp
      from test13_multishard_5;
  
  - type: wait
    time: 2
  
  - name: '1340'
    type: stream
    query: |
      select k,
             test_13_5_sec_large(to_float(i)) as sec_l,
             window_start as s,
             window_end as e
      from tumble(test13_view1_5 ,timestamp, 5s)
      group by k,
               window_start,
               window_end
      order by k;
    schema:
        - name: k
          type: int32
        - name: sec_l
          type: float32
        - name: s
          type: datetime64(3)
        - name: e
          type: datetime64(3)
          
  - type: wait
    time: 1

  - type: query
    <<if eq .nodes "1">>
    node: [p1]
    <<else>>
    node: [p2]
    <<end>>
    sql: |
      insert into test13_multishard_5(i, k, timestamp)
      values(0, 0, '2021-11-02 20:00:01');

