description: hop window aggregation no group by, UDF
cluster:
- p1k1
- p3k1
steps:
  - type: wait
    time: 1

  - type: query
    sql: |
      drop view if exists test13_view2_5;

  - type: wait
    time: 1

  - type: query
    sql: |
      drop view if exists test13_view1_5;

  - type: wait
    time: 1

  - type: query
    sql: |
      drop stream if exists test13_multishard_5;

  - type: wait
    time: 1

  - type: query
    sql: create stream test13_multishard_5(i float, k1 int, k2 string, timestamp datetime64(3) default now64(3)) settings shards=3;

  - type: wait
    time: 1

  - type: query
    sql: |
      create view test13_view1_5 as
      select to_float(i + k1) as i,
             k1,
             k2,
             timestamp
      from test13_multishard_5;

  - type: wait
    time: 1

  - name: '1346'
    type: stream
    query: |
      select test_13_5_sec_large(i) as sec_l,
             window_start as s
      from hop(test13_view1_5, timestamp, 2s, 5s)
      group by window_start,
               window_end;
    schema:
        - name: sec_l
          type: float32
        - name: s
          type: datetime64(3)
          
  - type: wait
    time: 1

  - type: query
    node: [p1]
    sql: |
      insert into test13_multishard_5(i, k1, k2, timestamp)
      values(0, 0, 'a', '2021-11-02 20:00:01');

  - type: query
    node: [p1]
    sql: |
      insert into test13_multishard_5(i, k1, k2, timestamp)
      values(0, 1, 'b', '2021-11-02 20:00:02');

