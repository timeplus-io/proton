description: session window aggregation no group by, stateful function
cluster:
- p1k1
- p3k1
steps:
- type: query
  sql: drop view if exists test13_view2_5;

- type: wait
  time: 1
- type: query
  sql: drop view if exists test13_view1_5;

- type: wait
  time: 1

- type: query
  sql: drop stream if exists test13_multishard_5;

- type: wait
  time: 1

- type: query
  sql: |
    create stream if not exists test13_multishard_5(speed int, id int, timestamp datetime64(3) default now64(3)) settings shards=3;

- type: wait
  time: 2

- type: query
  sql: |
    create materialized view if not exists test13_view1_5 as
    select speed,
           id, timestamp
    from test13_multishard_5;

- type: wait
  time: 1

- name: '1349'
  type: stream
  query: |
    select max(speed),
           min(speed),
           avg(speed),
           window_start as s,
           window_end as e
    from session(test13_view1_5, timestamp, 5m, [speed >= 60, speed < 60))
    group by window_start,
             window_end;
  schema:
    - name: max(speed)
      type: int32
    - name: min(speed)
      type: int32
    - name: avg(speed)
      type: float64
    - name: s
      type: datetime64(3)
    - name: e
      type: datetime64(3)

- type: wait
  time: 1

