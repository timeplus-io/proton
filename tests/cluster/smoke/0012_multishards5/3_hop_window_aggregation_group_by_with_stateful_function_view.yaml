tags:
- multishards
- append_only
- subquery
- subquery_view_materialized-view
- tail_aggr_last-X
- streaming_aggregation
- window_aggregation
- hop_window_aggregation
- group_by
- stateful_function

description: hop window aggregation group by with stateful function, view
cluster:
- p1k1
- p3k1
steps:
  - type: wait
    time: 1

  - type: query
    sql: |
      drop view if exists test13_view2_5;

  - type: wait
    time: 1

  - type: query
    sql: |
      drop view if exists test13_view1_5;

  - type: wait
    time: 1

  - type: query
    sql: |
      drop stream if exists test13_multishard_5;

  - type: wait
    time: 1

  - type: query
    sql: create stream test13_multishard_5(i float, k1 int, k2 string, timestamp datetime64(3) default now64(3)) settings shards=3;

  - type: wait
    time: 1

  - type: query
    sql: |
      create view test13_view1_5 as
      select i + k1 as i,
             k1,
             k2,
             timestamp
      from test13_multishard_5;

  - type: wait
    time: 1

  - type: query
    sql: |
      create view test13_view2_5 as
      select i - k1 as i,
             k1,
             k2,
             timestamp
      from test13_view1_5;
  
  - type: wait
    time: 1

  - name: '1343'
    type: stream
    query: |
      select k2,
             max(i) as mx,
             min(i) as mn,
             count(i) as cnt,
             window_start as s,
             window_end as e
      from hop(test13_view2_5, timestamp, 2s, 5s)
      group by k2,
               window_start,
               window_end;
    schema:
      - name: k2
        type: string
      - name: mx
        type: float64
      - name: mn
        type: float64
      - name: cnt
        type: uint64
      - name: s
        type: datetime64(3)
      - name: e
        type: datetime64(3)
        
  - type: wait
    time: 1

  - type: query
    node: [p1]
    sql: |
      insert into test13_multishard_5(i, k1, k2, timestamp)
      values(0, 0, 'a', '2021-11-02 20:00:01');

  - type: query
    node: [p1]
    sql: |
      insert into test13_multishard_5(i, k1, k2, timestamp)
      values(1, 1, 'b', '2021-11-02 20:00:02');

  - type: query
    node: [p1]
    sql: |
      insert into test13_multishard_5(i, k1, k2, timestamp)
      values(2, 2, 'a', '2021-11-02 20:00:03');

  - type: query
    node: [p1]
    sql: |
      insert into test13_multishard_5(i, k1, k2, timestamp)
      values(3, 3, 'b', '2021-11-02 20:00:04');

  - type: query
    <<if eq .nodes "1">>
    node: [p1]
    <<else>>
    node: [p2]
    <<end>>
    sql: |
      insert into test13_multishard_5(i, k1, k2, timestamp)
      values(4, 4, 'a', '2021-11-02 20:00:05');

  - type: query
    <<if eq .nodes "1">>
    node: [p1]
    <<else>>
    node: [p2]
    <<end>>
    sql: |
      insert into test13_multishard_5(i, k1, k2, timestamp)
      values(5, 0, 'b', '2021-11-02 20:00:06');

  - type: query
    <<if eq .nodes "1">>
    node: [p1]
    <<else>>
    node: [p2]
    <<end>>
    sql: |
      insert into test13_multishard_5(i, k1, k2, timestamp)
      values(6, 1, 'a', '2021-11-02 20:00:07');

  - type: query
    <<if eq .nodes "1">>
    node: [p1]
    <<else>>
    node: [p3]
    <<end>>
    sql: |
      insert into test13_multishard_5(i, k1, k2, timestamp)
      values(7, 2, 'b', '2021-11-02 20:00:08');

  - type: query
    <<if eq .nodes "1">>
    node: [p1]
    <<else>>
    node: [p3]
    <<end>>
    sql: |
      insert into test13_multishard_5(i, k1, k2, timestamp)
      values(7, 2, 'b', '2021-11-02 20:00:09');

  - type: check
    target_name: '1343'
    mode: <<or .aggregation_check_mode "sequence">>
    expected_result:
    - [a, 0, 0, 1, '2021-11-02 19:59:58', '2021-11-02 20:00:03']
    - [b, 1, 1, 1, '2021-11-02 19:59:58', '2021-11-02 20:00:03']
    - [a, 2, 0, 2, '2021-11-02 20:00:00', '2021-11-02 20:00:05']
    - [b, 3, 1, 2, '2021-11-02 20:00:00', '2021-11-02 20:00:05']
    - [a, 4, 2, 2, '2021-11-02 20:00:02', '2021-11-02 20:00:07']
    - [b, 5, 1, 3, '2021-11-02 20:00:02', '2021-11-02 20:00:07']
