  - type: query
    sql: |
      drop stream if exists test13_multishard_5;

  - type: wait
    time: 1

  - type: query
    sql: create stream test13_multishard_5(i float, k int, timestamp datetime64(3) default now64(3)) settings shards=3;

  - type: wait
    time: 1

  - type: query
    sql: |
      create view test13_view1_5 as
      select i+2 as i,
             k,
             timestamp
      from test13_multishard_5;
  
  - type: wait
    time: 1
  
  - name: '1341'
    type: stream
    query: |
      select max(i),
             min(i),
             avg(i),
             count(i),
             sum(i),
             median(i),
             window_start as s
      from tumble(test13_view1_5 ,timestamp, 5s)
      group by window_start,
               window_end;
    schema:
        - name: max(i)
          type: float64
        - name: min(i)
          type: float64
        - name: avg(i)
          type: float64
        - name: count(i)
          type: uint64
        - name: sum(i)
          type: float64
        - name: quantile(i)
          type: float64
        - name: s
          type: datetime64(3)
          
