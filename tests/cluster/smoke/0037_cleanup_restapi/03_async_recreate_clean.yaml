tags:
  - cleanup

description: |
  Tests covering the async recreate clean scenario.
  Main steps:
  - create 3 streams
  - insert data into 3 streams
  - execute cleanup rest api
  - check no data in 3 streams

  - insert data into 1 stream again
  - execute cleanup rest api again
  - check no data in 1 stream

  - execute cleanup rest api with no data insert
  - check 3 streams exist

cluster:
  - p3k1

steps:
  # create table
  - type: query
    sql: |
      create stream test37_stream1 (
        i int32,
        i8 int8,
        f32 float32,
        json string
      );

  - type: query
    sql: |
      create stream test37_stream2 (
        s string
      );

  - type: query
    sql: |
      create stream test37_stream3 (
        dt datetime64(6) default now64(6)
      );

  - type: wait
    time: 2

  # insert data
  - type: query
    sql: insert into test37_stream1 (i, i8, f32) values (1, 1, 1.1);

  - type: wait
    time: 1

  - type: query
    sql: insert into test37_stream2 (s) values ('dev1')('dev2');

  - type: wait
    time: 1

  - type: query
    sql: |
      insert into test37_stream3 (dt) values 
      ('2024-01-01 00:00:01')
      ('2024-01-01 00:00:02')
      ('2024-01-01 00:00:03');

  - type: wait
    time: 1

  # query before clean
  - name: cleanup-3-1
    type: stream
    query: SELECT count() FROM table(test37_stream1)
    schema:
      - name: count()
        type: uint64
  - type: wait
    time: 1

  - name: cleanup-3-2
    type: stream
    query: SELECT count() FROM table(test37_stream2)
    schema:
      - name: count()
        type: uint64
  - type: wait
    time: 1

  - name: cleanup-3-3
    type: stream
    query: SELECT count() FROM table(test37_stream3)
    schema:
      - name: count()
        type: uint64

  - type: check
    target_name: cleanup-3-1
    expected_result:
      - [1]

  - type: check
    target_name: cleanup-3-2
    expected_result:
      - [2]

  - type: check
    target_name: cleanup-3-3
    expected_result:
      - [3]

  # cleanup
  - name: cleanup-3-4
    type: rest
    node:
      - p1
    query_id: cleanup-3-4
    method: POST
    url: /proton/v1/batch_action/streams
    data:
      type: recreate
      stream_list:
        - test37_stream1
        - test37_stream2
        - test37_stream3
      database: default
      synchronous: false
      timeout_seconds: 600
  - type: wait
    time: 3

  - name: cleanup-3-5
    type: rest
    method: GET
    url: /proton/v1/batch_action/statuses?poll_id=1_cleanup-3-4

  - type: check
    target_name: cleanup-3-5
    mode: random
    expected_result:
    - status: success
      elapsed_ms: any_value
      finished_tables:
        - any_value
        - any_value
        - any_value
      code: 0
      request_datetime: any_value
      request_id: cleanup-3-4
  - type: wait
    time: 1

  # check: query after clean
  - name: cleanup-3-6
    type: stream
    query: SELECT count() FROM table(test37_stream1)
    schema:
      - name: count()
        type: uint64
  - type: wait
    time: 1

  - name: cleanup-3-7
    type: stream
    query: SELECT count() FROM table(test37_stream2)
    schema:
      - name: count()
        type: uint64
  - type: wait
    time: 1

  - name: cleanup-3-8
    type: stream
    query: SELECT count() FROM table(test37_stream3)
    schema:
      - name: count()
        type: uint64

  - type: check
    target_name: cleanup-3-6
    expected_result:
      - [0]

  - type: check
    target_name: cleanup-3-7
    expected_result:
      - [0]

  - type: check
    target_name: cleanup-3-8
    expected_result:
      - [0]
