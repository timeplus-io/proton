tags:
  - type
description: create a stream t_decimal with decimal type and ingest, query
cluster:
  - p1k1
  - p3k1
steps:
  - type: wait
    time: 1

  - type: query
    sql: drop stream if exists t_decimal

  - type: wait
    time: 2

  - type: query
    sql: create stream t_decimal (decimal decimal(9,3))

  - type: wait
    time: 2

  - type: query
    sql: insert into t_decimal (decimal) values (1234.123)

  - type: wait
    time: 1

  - name: 801-1
    type: stream
    query: select decimal from t_decimal settings seek_to = 'earliest'
    schema:
      - name: decimal
        type: decimal(9,3)

  - type: check
    target_name: 801-1
    expected_result:
      - [ '1234.123' ]
