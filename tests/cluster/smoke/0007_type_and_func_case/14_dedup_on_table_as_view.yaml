tags:
  - dedup
  - cluster_table_bug
description: 'create a stream t_dedup, and create a view with dedup on key with func
  as to_string(time) and check dedup '
cluster:
  - p1k1
  - p3k1
steps:
  - type: wait
    time: 1

  - type: query
    sql: drop view if exists dedup_v

  - type: wait
    time: 1

  - type: query
    sql: drop stream if exists t_dedup

  - type: wait
    time: 1

  - type: query
    sql: create stream t_dedup(id int, value int, time datetime64(3,'UTC'))

  - type: wait
    time: 3

  - type: query
    sql: |
      insert into t_dedup(id, value, time)
      values
        (1, 10, '2020-01-01 00:00:00'),
        (2, 10, '2020-01-01 00:00:00'),
        (3, 10, '2020-01-01 00:00:00'),
        (1, 10, '2020-01-01 00:00:00'),
        (2, 10, '2020-01-01 00:00:00'),
        (3, 10, '2020-01-01 00:00:00'),
        (1, 10, '2020-01-01 00:00:05'),
        (1, 10, '2020-01-01 00:00:06')

  - type: wait
    time: 3

  - type: query
    sql: |
      create view dedup_v as
      select id, value, time, to_string(time) as time_string
      from dedup(table(t_dedup), id, value, to_string(time))

  - type: wait
    time: 1

  - name: 801-1
    type: stream
    query: select id, count() from dedup_v group by id
    schema:
      - name: id
        type: int32
      - name: count()
        type: uint64

  - type: check
    target_name: 801-1
    expected_result:
      - [ '3', 1 ]
      - [ '2', 1 ]
      - [ '1', 3 ]

  - type: query
    sql: drop view if exists dedup_v

  - type: wait
    time: 1
