tags:
  - func
description: create a stream t_lowcard with low_cardinality type and ingest, query,
  but of proton-python-driver
cluster:
  - p1k1
  - p3k1
steps:
  - type: wait
    time: 1

  - type: query
    sql: drop stream if exists t_latest

  - type: wait
    time: 1

  - type: query
    sql: create stream t_latest (name string, price int)

  - type: wait
    time: 1

  - name: 801-1
    type: stream
    query: |
      select
        group_array_sorted(name, 10) as names,
        group_array_sorted(latest_price, 10) as prices,
        map_cast(names, prices) as name_prices,
        (name_prices['id1'] / 2 + name_prices['id2'] / 2) as comb_price
      from (
        select name, latest(price) as latest_price
        from t_latest
        group by name
        emit periodic 5s
      )
      limit 1
    schema:
      - name: names
        type: array(string)
      - name: prices
        type: array(int32)
      - name: name_prices
        type: map(string, int32)
      - name: comb_price
        type: float64

  - type: wait
    time: 2

  - type: query
    sql: insert into t_latest (name, price) values ('id1', 100) ('id2', 200)

  - type: wait
    time: 1

  - type: query
    sql: insert into t_latest (name, price) values ('id1', 500) ('id2', 300)

  - type: wait
    time: 1

  - type: query
    sql: insert into t_latest (name, price) values ('id1', 300) ('id2', 1000)

  - type: check
    target_name: 801-1
    expected_result:
      - [ ['id1', 'id2'], [300, 1000], {'id1': 300, 'id2': 1000}, '650' ]
