tags:
- type
description: create a stream test_type, 1 column for 1 type and ingest data with same
  or different column sequence of show create
cluster:
- p1k1
- p3k1
steps:
- type: query
  sql: drop stream if exists test_type
  
- type: wait
  time: 1
  
- type: query
  sql: |
    create stream test_type (
    uuid uuid,
    int int,
    uint uint8,
    string string,
    float float,
    decimal decimal32(3),
    date date,
    datetime datetime,
    enum enum('a'=1, 'b'=2, 'z'=26),
    tuple tuple(s string, i int),
    ipv4 ipv4,
    ipv6 ipv6,
    map map(string, int),
    nullable nullable(datetime64),
    timestamp datetime64(3) default now64(3)
    )
  
- type: wait
  time: 2
  
- type: query
  sql: |
    insert into test_type (
    uuid, int, uint, string, float, decimal, date, datetime, enum, tuple, ipv4, ipv6, map, nullable, timestamp
    ) values ('4c6a2a19-4f9f-456f-b076-c43ef97255a7', -1234567, 1234567, '{@string}', 12345.123, 123456.123,
    to_date('2022-03-24'), to_datetime('2022-03-24 17:17:17'), 'a', ('a', 0), '192.168.168.168',
    '2a02:aa08:e000:3100::20', {'key1':111}, null, '2020-01-01 11:11:11')

- type: wait
  time: 2

- name: 801-1
  type: stream
  query: |
    select uuid, int, uint, string, float, decimal, date, datetime, enum, tuple, ipv4, ipv6, map, nullable
    from table(test_type) settings seek_to = 'earliest'
  schema:
    - name: uuid
      type: uuid
    - name: int
      type: int32
    - name: uint
      type: uint8
    - name: string
      type: string
    - name: float
      type: float32
    - name: decimal
      type: decimal(9,3)
    - name: date
      type: date
    - name: datetime
      type: datetime
    - name: enum
      type: enum8('a'=1, 'b'=2, 'z'=26)
    - name: tuple
      type: tuple(s string, i int32)
    - name: ipv4
      type: ipv4
    - name: ipv6
      type: ipv6
    - name: map
      type: map(string, int32)
    - name: nullable
      type: nullable(datetime64(3))
  
- type: check
  target_name: 801-1
  expected_result:
  - [4c6a2a19-4f9f-456f-b076-c43ef97255a7, -1234567, 135, '{@string}', 12345.123, '123456.123', '2022-03-24', '2022-03-24 17:17:17', a, {s: a, i: 0}, 192.168.168.168, 2a02:aa08:e000:3100::20, {'key1': 111}, null]
