description: 1st left join result is changelog(stream join stream) left join table(changelog)
cluster:
  - p1k1
  - p3k1
steps:
  - type: query
    sql:
      create stream test14_stream1_5(i int, j int, k string) primary
      key j settings mode='versioned_kv';

  - type: query
    sql: create stream test14_stream2_5(i2 int, j2 int, k2 string);

  - type: query
    sql:
      create stream test14_stream3_5(i3 int, j3 int, k3 string) settings
      mode='changelog';

  - type: wait
    time: 2

  - type: query
    sql: insert into test14_stream3_5(i3, j3, k3) values(4, 2, 'c');

  - type: wait
    time: 1

  - type: query
    sql: insert into test14_stream3_5(i3, j3, k3) values(6, 3, '7');

  - type: wait
    time: 1

  - type: query
    sql: insert into test14_stream3_5(i3, j3, k3) values(3, 2, 'e');

  - type: wait
    time: 1

  - type: query
    sql: insert into test14_stream3_5(i3, j3, k3, _tp_delta) values(4, 2, 'c',-1);

  - type: wait
    time: 5
  - name: "14188"
    type: stream
    query:
      with t as (select * from test14_stream1_5 as a join changelog(test14_stream2_5,
      j2) as b on a.j = b.j2)select i, j, k, i2, j2, k2, i3, j3, k3, _tp_delta from
      t left join table(test14_stream3_5) as k on t.j = k.j3;

  - type: wait
    time: 1

  - type: query
    sql: insert into test14_stream2_5(i2, j2, k2) values(1, 2, 'a');

  - type: wait
    time: 1

  - type: query
    sql: insert into test14_stream1_5(i, j, k) values(1, 2, 'a');

  - type: wait
    time: 1

  - type: query
    sql: insert into test14_stream1_5(i, j, k) values(1, 3, 'a');

  - type: wait
    time: 1

  - type: query
    sql: insert into test14_stream2_5(i2, j2, k2) values(1, 3, 'b');

  - type: wait
    time: 1

  - type: query
    sql: insert into test14_stream1_5(i, j, k) values(5, 2, 'a');

  - type: wait
    time: 1

  - type: query
