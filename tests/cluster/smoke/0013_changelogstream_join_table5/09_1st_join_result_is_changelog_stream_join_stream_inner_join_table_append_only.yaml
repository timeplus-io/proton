tags:
  - changelog
  - table(append-only)
  - inner join
  - not supported

description: 1st join result is changelog(stream join stream) inner join table(append-only)
cluster:
  - p1k1
  - p3k1
steps:
  - type: query
    sql:
      create stream test14_stream1_5(i int, j int, k string) primary
      key j settings mode='versioned_kv';

  - type: query
    sql: create stream test14_stream2_5(i2 int, j2 int, k2 string);

  - type: query
    sql: create stream test14_stream3_5(i3 int, j3 int, k3 string);

  - type: wait
    time: 2

  - type: query
    sql: insert into test14_stream3_5(i3, j3, k3) values(4, 2, 'c');

  - type: wait
    time: 1

  - type: query
    sql: insert into test14_stream3_5(i3, j3, k3) values(6, 3, '7');

  - type: wait
    time: 1

  - type: query
    sql: insert into test14_stream3_5(i3, j3, k3) values(3, 2, 'e');

  - type: wait
    time: 1

  - type: query
    sql: insert into test14_stream3_5(i3, j3, k3) values(5, 3, 'h');

  - type: wait
    time: 5

  - name: "14192"
    type: stream
    query:
      with t as (select i, j, k, i2, j2, k2 from test14_stream1_5 as a join changelog(test14_stream2_5,
      j2) as b on a.j = b.j2) select (* except _tp_time) from t join table(test14_stream3_5) as k on t.j
      = k.j3;
    schema: 
      - name: i
        type: int32
      - name: j
        type: int32
      - name: k
        type: string
      - name: i2
        type: int32
      - name: j2
        type: int32
      - name: k2
        type: string
      - name: i3
        type: int32
      - name: j3
        type: int32
      - name: k3
        type: string

  - type: wait
    time: 1

  - type: query
    sql: insert into test14_stream2_5(i2, j2, k2) values(1, 2, 'a');

  - type: wait
    time: 1

  - type: query
    sql: insert into test14_stream1_5(i, j, k) values(1, 2, 'a');

  - type: wait
    time: 1

  - type: query
    sql: insert into test14_stream1_5(i, j, k) values(1, 5, 'a');

  - type: wait
    time: 1

  - type: query
    sql: insert into test14_stream2_5(i2, j2, k2) values(1, 3, 'b');

  - type: wait
    time: 1

  - type: query
    sql: insert into test14_stream1_5(i, j, k) values(5, 2, 'a');

  - type: wait
    time: 1

  - type: query
    sql: insert into test14_stream2_5(i2, j2, k2) values(1, 5, 'b');

  - type: check
    target_name: "14192"
    mode: random
    expected_result:
      - [1, 2, 'a', 1, 2, 'a', 3, 2, 'e']
      - [1, 2, 'a', 1, 2, 'a', 4, 2, 'c']
      - [5, 2, 'a', 1, 2, 'a', 3, 2, 'e']
      - [5, 2, 'a', 1, 2, 'a', 4, 2, 'c']
