tags:
  - local-run
  - append_only
  - table(changelog_kv)
  - multiple stream join
  - left join
description: 1st join result is append_only(stream join stream) left join table(changelog_kv)
cluster:
  - p1k1
  - p3k1
steps:
  - type: query
    sql: create stream test14_stream1_5(i int, j int, k string);

  - type: query
    sql: create stream test14_table2_5(i2 int, j2 int, k2 string);

  - type: query
    sql:
      create stream test14_stream3_5(i3 int, j3 int, k3 string) primary
      key j3 settings mode='changelog_kv';

  - type: wait
    time: 2
  
  - type: query
    sql: insert into test14_stream3_5(i3, j3, k3) values(4, 2, 'c');

  - type: wait
    time: 1
  
  - type: query
    sql: insert into test14_stream3_5(i3, j3, k3) values(1, 7, 'a');

  - type: wait
    time: 1
  
  - type: query
    sql: insert into test14_stream3_5(i3, j3, k3, _tp_delta) values(5, 2, 'h', -1);

  - type: wait
    time: 5

  - name: "14183"
    type: stream
    query:
      with t as (select * from test14_stream1_5 join test14_table2_5 on test14_stream1_5.j
      = test14_table2_5.j2)select i, j, k, i2, j2, k2, i3, j3, k3 from t left join table(test14_stream3_5)
      as k on t.j = k.j3;
    schema:
      - name: i
        type: int32
      - name: j
        type: int32
      - name: k
        type: string
      - name: i2
        type: int32
      - name: j2
        type: int32
      - name: k2
        type: string
      - name: i3
        type: int32
      - name: j3
        type: int32
      - name: k3
        type: string

  - type: wait
    time: 1

  - type: query
    sql: insert into test14_table2_5(i2, j2, k2) values(8, 2, 'a');

  - type: wait
    time: 1

  - type: query
    sql: insert into test14_stream1_5(i, j, k) values(1, 2, 'a');

  - type: check
    target_name: "14183"
    expected_result:
      - ["1", "2", a, "8", "2", a, "0", "0", ""]

  - type: query
    sql: insert into test14_stream1_5(i, j, k) values(1, 3, 'a');

  - type: wait
    time: 1

  - type: query
    sql: insert into test14_table2_5(i2, j2, k2) values(6, 7, 'f');

  - type: wait
    time: 1

  - type: query
    sql: insert into test14_stream1_5(i, j, k) values(1, 2, 'a');

  - type: check
    target_name: "14183"
    expected_result:
      - ["1", "2", a, "8", "2", a, "0", "0", ""]

  - type: query
    sql: insert into test14_stream1_5(i, j, k) values(1, 7, 'a');

  - type: wait
    time: 1

  - type: query
    sql: insert into test14_table2_5(i2, j2, k2) values(1, 5, 'b');

  - type: check
    target_name: "14183"
    expected_result:
      - ["1", "7", a, "6", "7", f, "1", "7", a]
