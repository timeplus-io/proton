tags:
  - ddl
description: create a table test_ingest, ingest and rename and ingest to new name
cluster:
  - p1k1
  - p3k1
steps:
 - type: query
   sql: drop stream if exists test2_ingest
  
 - type: query
   sql: drop stream if exists test_rename
 
 - type: wait
   time: 1

 - type: query
   sql: |
     create stream test2_ingest (
         id string,
         location string,
         value float,
         content string,
         timestamp datetime64(3) default now64(3)
     )

 - type: wait
   time: 2

 - type: rest
   url: /proton/v1/ingest/streams/test2_ingest
   method: POST
   data:
     columns:
       - id
       - location
       - value
       - content
       - timestamp
     data:
       - [ dev1, ca, 100, '"create_time":"2021-11-02 20:00:01"', '2020-01-01 11:11:11' ]
       - [ dev2, ca, 100, '"create_time":"2021-11-02 20:00:01"', '2020-01-01 11:11:11' ]
       - [ dev3, ca, 100, '"create_time":"2021-11-02 20:00:10"', '2020-01-01 11:11:11' ]
 
 - type: wait
   time: 2

 - type: query
   sql: rename stream if exists test2_ingest to test_rename

 - type: wait
   time: 1

 - type: rest
   url: /proton/v1/ingest/streams/test_rename
   method: POST
   data:
     columns:
       - id
       - location
       - value
       - content
       - timestamp
     data:
       - [ dev7, ca, 100, '"create_time":"2021-11-02 20:00:01"', '2020-01-01 11:11:11' ]
       - [ dev8, ca, 100, '"create_time":"2021-11-02 20:00:01"', '2020-01-01 11:11:11' ]
       - [ dev9, ca, 100, '"create_time":"2021-11-02 20:00:10"', '2020-01-01 11:11:11' ]

 - type: wait
   time: 1

 - name: '201'
   type: stream
   query: select id, location, value, timestamp from test_rename settings seek_to = 'earliest'
   schema:
     - name: id
       type: string
     - name: location
       type: string
     - name: value
       type: float32
     - name: timestamp
       type: datetime64(3)
 
 - type: check
   target_name: '201'
   mode: random
   expected_result:
     - [ dev1, ca, 100, '2020-01-01 11:11:11' ]
     - [ dev2, ca, 100, '2020-01-01 11:11:11' ]
     - [ dev3, ca, 100, '2020-01-01 11:11:11' ]
     - [ dev7, ca, 100, '2020-01-01 11:11:11' ]
     - [ dev8, ca, 100, '2020-01-01 11:11:11' ]
     - [ dev9, ca, 100, '2020-01-01 11:11:11' ]

