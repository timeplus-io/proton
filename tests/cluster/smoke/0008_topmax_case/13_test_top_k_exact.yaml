tags:
- topmax
description: test whether top_k_exact is accurate with default memory
cluster:
- p1k1
- p3k1
steps:
- name: '901'
  type: stream
  query: select top_k_exact(number,10) from numbers(10000000000)
  schema:
    - name: top_k_exact(number, 10)
      type: array(tuple(uint64, uint64))

- type: check
  target_name: '901'
  timeout: 50 # thread build need more time, timeout sets the maximum wait time, not a fixed wait of 50 seconds
  expected_result:
  - [error_code:69]
