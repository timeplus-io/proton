tags:
- topmax
description: create a table test_topmax, 1 column for 1 type and ingest data top_k
  on (int,map) on tumble window
cluster:
- p1k1
- p3k1
steps:
- type: wait
  time: 1
  
- type: query
  sql: drop stream if exists test9_topmax
  
- type: wait
  time: 2
  
- type: query
  sql: create stream test9_topmax (uuid uuid, int int, uint uint8, string
    string, float float, decimal decimal32(3), date date, datetime datetime, enum
    enum('a'=1, 'b'=2, 'z'=26), tuple tuple(s string, i int), ipv4 ipv4, ipv6 ipv6,
    map map(string, int), nullable nullable(datetime64), timestamp datetime64(3) default
    now64(3))

- type: wait
  time: 2

- name: '901'
  type: stream
  query: select window_start, window_end, array_join(top_k((int, map),3,true)) as a from
    tumble(test9_topmax, timestamp, 10s) where (int=-1234561 or int=-1234566)group
    by window_start, window_end
  schema:
    - name: window_start
      type: datetime64(3)
    - name: window_end
      type: datetime64(3)
    - name: a
      type: tuple(tuple(int32, map(string, int32)), uint64, uint64)
- type: wait
  time: 2
  
