tags:
- topmax
- bug
description: create a table test_topmax, 1 column for 1 type and ingest data max_k
  on float on session window
cluster:
- p1k1
- p3k1
steps:
- type: query
  sql: drop stream if exists test9_topmax
  
- type: wait
  time: 2
  
- type: query
  sql: create stream test9_topmax (uuid uuid, int int, uint uint8, string
    string, float float, decimal decimal32(3), date date, datetime datetime, enum
    enum('a'=1, 'b'=2, 'z'=26), tuple tuple(s string, i int), ipv4 ipv4, ipv6 ipv6,
    map map(string, int), nullable nullable(datetime64), timestamp datetime64(3) default
    now64(3))

- type: wait
  time: 2

- name: '901'
  type: stream
  query: select max_k(ipv4, 2), window_start, window_end from session(test9_topmax,
    timestamp, 2s) partition by uuid group by window_start, window_end
  schema:
    - name: max_k(ipv4, 2)
      type: array(ipv4)
    - name: window_start
      type: datetime64(3)
    - name: window_end
      type: datetime64(3)
  
- type: wait
  time: 3
  
