description: |
  Test cover SQL UDf REPLACE FUNCTION
  Main Steps:
    1.Create function
    2.Query function
    3.Replace function
    4.Query function

steps:
- type: query
  sql: DROP STREAM IF EXISTS test22_stream;

- type: query
  sql: DROP FUNCTION IF EXISTS test_add_five;

- type: wait
  time: 1

- type: query
  sql: CREATE STREAM test22_stream(value int);

- type: query
  sql: CREATE FUNCTION test_add_five AS (value) -> value + 5

- type: wait
  time: 2

- name: udf-3-1
  type: stream
  query: select test_add_five(value) as res from test22_stream;
  schema:
  - name: res
    type: int64

- type: wait
  time: 1

- type: query
  sql: insert into test22_stream(value) values (1)(2)(3);

- type: check
  target_name: udf-3-1
  expected_result:
  - [6]
  - [7]
  - [8]

- type: query
  sql: CREATE OR REPLACE FUNCTION test_add_five AS (value) -> value + 4

- type: wait
  time: 2

- name: udf-3-2
  type: stream
  query: select test_add_five(value) as res from test22_stream;
  schema:
  - name: res
    type: int64

- type: wait
  time: 1

- type: query
  sql: insert into test22_stream(value) values (1)(2)(3);

- type: check
  target_name: udf-3-2
  expected_result:
  - [5]
  - [6]
  - [7]
