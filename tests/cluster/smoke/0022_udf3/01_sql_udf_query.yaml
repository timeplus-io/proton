description: |
  Test cover SQL UDF query
  Main Steps:
    1.Create sql udf as constants
    2.Create sql udf encapsulating a complex expression
    3.Create sql udf logic expression
    4.Create sql udf aggr expression
    5.Select functions

cluster:
- p1k1
- p3k1

steps:
- type: query
  sql: DROP STREAM IF EXISTS test22_stream;

- type: wait
  time: 1

- type: query
  sql: CREATE STREAM test22_stream (value float, r int, g int, b int);

- type: query
  sql: CREATE OR REPLACE FUNCTION red AS () -> 'FF0000';

- type: query
  sql: |
    CREATE OR REPLACE FUNCTION color_hex AS (r, g, b) -> 
    '#'||hex(r)||hex(g)||hex(b);

- type: query
  sql: |
    CREATE OR REPLACE FUNCTION truncate_str AS (s, len) -> 
    if(length(s) > len, concat(substring(s, 1, len), '...'), s);

- type: query
  sql: CREATE OR REPLACE FUNCTION test_avg AS value -> avg(value);

- type: wait
  time: 2

- name: udf-1-1
  type: stream
  query: SELECT red() as res;
  schema:
  - name: res
    type: string

- name: udf-1-2
  type: stream
  query: SELECT color_hex(12,120,200) as res;
  schema:
  - name: res
    type: string

- name: udf-1-2-from-stream
  type: stream
  query: SELECT color_hex(r,g,b) as res from test22_stream;
  schema:
  - name: res
    type: string

- name: udf-1-3
  type: stream
  query: SELECT truncate_str('smoke test sql udf', 8) as res;
  schema:
  - name: res
    type: string

- name: udf-1-4
  type: stream
  query: SELECT test_avg(value) as res from test22_stream;
  schema:
  - name: res
    type: float64

- type: wait
  time: 1

- type: query
  sql: |
    INSERT INTO test22_stream (value, r, g, b) 
    VALUES (1, 12, 120, 200) (3, 18, 52, 86);

- type: wait
  time: 2

- type: query
  sql: |
    INSERT INTO test22_stream (value, r, g, b)
    VALUES (5, 255, 0, 0) (7, 255, 255, 255);

- type: check
  target_name: udf-1-1
  expected_result:
  - ['FF0000']

- type: check
  target_name: udf-1-2
  expected_result:
  - ['#0C78C8']

- type: check
  target_name: udf-1-2-from-stream
  expected_result:
  - ['#0C78C8']
  - ['#123456']
  - ['#FF0000']
  - ['#FFFFFF']

- type: check
  target_name: udf-1-3
  expected_result:
  - ['smoke te...']

- type: check
  target_name: udf-1-4
  expected_result:
  - [2]
  - [4]
