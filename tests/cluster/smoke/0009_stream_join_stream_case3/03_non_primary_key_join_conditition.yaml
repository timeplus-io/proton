description: Non-Primary Key Join Condition

cluster:
  - p1k1
  - p3k1

steps:
  - type: stream
    name: 3200
    query_id: '3200'
    query: |
      SELECT A.name, B.value FROM left_Stream A LEFT JOIN right_Stream B ON A.department_id = B.department_id;
    schema:
      - name: name
        type: string
      - name: value
        type: string

  - type: wait
    time: 1

  - type: query
    sql: |
      INSERT INTO right_Stream (id, value, department_id, type) VALUES 
      (1, 'HR Data', 1, 'C');

  - type: wait
    time: 1

  - type: query
    sql: |
      INSERT INTO left_Stream (id, name, department_id, manager_id, type) VALUES 
      (1, 'Alice', 1, NULL, 'A'),
      (2, 'Bob', 2, NULL, 'B');


  - type: check
    target_name: 3200
    expected_result:
      - ['Alice', 'HR Data']
      - ['Bob', '']
