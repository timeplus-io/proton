tags:
  - uda

description: Test covering simple python uda test

steps:
  - type: query
    sql: drop stream if exists uda_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream uda_stream (x int, y float);
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE AGGREGATE FUNCTION getRegressionLinearModelOLS(education int, income float) RETURNS array(float64) LANGUAGE PYTHON AS $$
      import pickle
      import statsmodels.api as sm

      class getRegressionLinearModelOLS:
          has_customized_emit = False

          def __init__(self):
              self.ols = 0

          def serialize(self):
              data = {}
              data['ols'] = self.ols
              return pickle.dumps(data)

          def deserialize(self, data):
              data = pickle.loads(data)
              self.ols = data['ols']

          def merge(self, other):
              pass

          def process(self, xs, ys):
              X = sm.add_constant(xs)
              ols_model = sm.OLS(ys, X)
              results = ols_model.fit()
              self.ols = results.tvalues.tolist()

          def finalize(self):
              return self.ols
      $$;

  - type: wait
    time: 1

  - name: python-udf5-5-1
    type: stream
    query: select getRegressionLinearModelOLS(x, y) as res from uda_stream;
    schema:
      - name: res
        type: array(float64)

  - type: wait
    time: 2

  - type: query
    sql: insert into uda_stream(x, y) select number, number * 1.5 from numbers(1, 20);

  - type: check
    target_name: python-udf5-5-1
    expected_result:
      - [[0.08455905846680888, 3421425808873475.55]]
