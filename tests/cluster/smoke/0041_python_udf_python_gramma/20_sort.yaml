tags:
  - udf

description: Test covering simple python udf test

steps:
  - type: query
    sql: drop stream if exists udf_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream udf_stream (value array(int));
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_sort(value array(int)) RETURNS array(int) LANGUAGE PYTHON AS
      $$
      def test_sort(value):
          for x in value:
              x.sort()
          return value
      $$;

  - type: wait
    time: 1

  - name: python-udf1-20-1
    type: stream
    query: select test_sort(value) as res, value from udf_stream;
    schema:
      - name: res
        type: array(int32)
      - name: value
        type: array(int32)
  - type: wait
    time: 1

  - type: query
    sql: insert into udf_stream(value) values ([1,2,3])([2,3,1])([3,1,2]);

  - type: check
    target_name: python-udf1-20-1
    expected_result:
      - [[1,2,3], [1,2,3]]
      - [[1,2,3], [2,3,1]]
      - [[1,2,3], [3,1,2]]
