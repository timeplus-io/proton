tags:
  - uda

description: Test covering simple python uda test

steps:
  - type: query
    sql: drop stream if exists uda_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream uda_stream (value int64);
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE AGGREGATE FUNCTION getAny(value int64) RETURNS int64 LANGUAGE PYTHON AS $$
      import pickle
      class getAny:
          def __init__(self):
              self.any = -1

          def serialize(self):
              data = {}
              data['any'] = self.any
              return pickle.dumps(data)

          def deserialize(self, data):
              data = pickle.loads(data)
              self.any = data['any']

          def merge(self, other):
              if other.any == 1:
                  self.any = other.any

          def process(self, values):
              tmp_all = any(values)
              if self.any != 1:
                  self.any = tmp_all

          def finalize(self):
              return self.any
      $$;

  - type: wait
    time: 1

  - name: python-udf1-1-1
    type: stream
    query: select getAny(value) as res from uda_stream;
    schema:
      - name: res
        type: int64
  - type: wait
    time: 1

  - type: query
    sql: insert into uda_stream(value) values (0)(0)(0);

  - type: wait
    time: 2

  - type: query
    sql: insert into uda_stream(value) values (1)(0)(2);

  - type: wait
    time: 2

  - type: check
    target_name: python-udf1-1-1
    expected_result:
      - [0]
      - [1]
