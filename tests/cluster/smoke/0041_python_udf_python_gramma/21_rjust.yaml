tags:
  - udf

description: Test covering simple python udf test

steps:
  - type: query
    sql: drop stream if exists udf_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream udf_stream (value string);
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_rjust(value string) RETURNS string LANGUAGE PYTHON AS
      $$
      def test_rjust(value):
          res = [x.decode('utf-8').rjust(5, '1') for x in value]
          return res
      $$;

  - type: wait
    time: 1

  - name: python-udf1-21-1
    type: stream
    query: select test_rjust(value) as res, value from udf_stream;
    schema:
      - name: res
        type: string
      - name: value
        type: string
  - type: wait
    time: 1

  - type: query
    sql: insert into udf_stream(value) values ('42')('aaa');

  - type: check
    target_name: python-udf1-21-1
    expected_result:
      - ['11142', '42']
      - ['11aaa', 'aaa']
