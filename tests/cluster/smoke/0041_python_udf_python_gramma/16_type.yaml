tags:
  - udf

description: Test covering simple python udf test

steps:
  - type: query
    sql: drop stream if exists udf_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream udf_stream (value float);
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_type(value float) RETURNS bool LANGUAGE PYTHON AS
      $$
      def test_type(value):
          res = [type(x) == float for x in value]
          return res
      $$;

  - type: wait
    time: 1

  - name: python-udf1-16-1
    type: stream
    query: select test_type(value) as res, value from udf_stream;
    schema:
      - name: res
        type: bool
      - name: value
        type: float32
  - type: wait
    time: 1

  - type: query
    sql: insert into udf_stream(value) values (2)(2.6)(2.0);

  - type: check
    target_name: python-udf1-16-1
    expected_result:
      - [True, 2]
      - [True, 2.6]
      - [True, 2.0]
