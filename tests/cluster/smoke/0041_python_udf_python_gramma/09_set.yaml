tags:
  - udf

description: Test covering simple python udf test

steps:
  - type: query
    sql: drop stream if exists udf_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream udf_stream (value string);
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_set(value string) RETURNS bool LANGUAGE PYTHON AS
      $$
      def test_set(value):
          item = set(['jack', 'sjoerd'])
          res = [x in item for x in value]
          return res
      $$;

  - type: wait
    time: 1

  - name: python-udf1-9-1
    type: stream
    query: select test_set(value) as res, value from udf_stream;
    schema:
      - name: res
        type: bool
      - name: value
        type: string
  - type: wait
    time: 1

  - type: query
    sql: insert into udf_stream(value) values ('jack')('sjoerd')('other');

  - type: check
    target_name: python-udf1-9-1
    expected_result:
      - [True, 'jack']
      - [True, 'sjoerd']
      - [False, 'other']
