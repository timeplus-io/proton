tags:
  - udf

description: Test covering simple python udf test

steps:
  - type: query
    sql: drop stream if exists udf_stream;
  - type: wait
    time: 1

  - type: query
    sql: create stream udf_stream (value int);
  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE OR REPLACE FUNCTION test_in(value int) RETURNS bool LANGUAGE PYTHON AS
      $$
      def test_in(value):
          numbers = [2, 3]
          res = [x in numbers for x in value]
          return res
      $$;

  - type: wait
    time: 1

  - name: python-udf1-2-1
    type: stream
    query: select test_in(value) as res, value from udf_stream;
    schema:
      - name: res
        type: bool
      - name: value
        type: int32
  - type: wait
    time: 1

  - type: query
    sql: insert into udf_stream(value) values (3)(3)(5)(2);

  - type: check
    target_name: python-udf1-2-1
    expected_result:
      - [True, 3]
      - [True, 3]
      - [False, 5]
      - [True, 2]
