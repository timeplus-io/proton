description: |
  Test sling data transfer from db to db with splited 50 files
  Main Steps:
    1.Create source stream and target stream
    2.Ingest 100 rows data into source stream
    3.Migration data from source stream to 50 files with config file
    4.Migration data from 50 csv files to stream with config file
    5.Check target stream table query

cluster:
  - p1s1
  - p3s1

steps:
  - type: command
    node: [sling]
    shell: rm -rf migration_test/*.csv

  - type: query
    sql: DROP STREAM IF EXISTS src;

  - type: query
    sql: DROP STREAM IF EXISTS tgt;

  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE STREAM src
      (id int64, value float64, name string, ts datetime64(3) DEFAULT now64(3));

  - type: query
    sql: |
      CREATE STREAM tgt
      (id int64, value float64, name string, ts datetime64(3) DEFAULT now64(3));

  - type: wait
    time: 3

  - type: query
    sql: |
      INSERT INTO src(id, value, name, ts)
      SELECT number, number/10, concat('s', to_string(number)), to_datetime(((1735732800+number*86400)))
      FROM numbers(1,100);

  - type: wait
    time: 2

  - type: command
    node: [sling]
    shell: sling run -r ~/.sling/config/0001_06_tofile.yaml -d

  - type: wait
    time: 2

  - name: sling-4-1
    type: stream
    query: SELECT id, value, name, ts FROM tgt;
    schema:
      - name: id
        type: int64
      - name: value
        type: float64
      - name: name
        type: string
      - name: ts
        type: datetime64(3)

  - type: wait
    time: 2

  - type: command
    node: [sling]
    shell: sling run -r ~/.sling/config/0001_06_fromfile.yaml -d

  - type: check
    target_name: sling-4-1
    timeout: 15
    expected_result:
