description: |
  Test sling data transfer from db to csv file to db with timezone
  Main steps:
    1.Create source and target stream with 'Asia/Shanghai' timezone
    2.Ingest data
    3.Migration data from source stream to csv
    4.Migration data from csv to target stream
    5.Repeat step 3-4
    6.Check target stream table query

cluster:
  - p1s1
  - p3s1

steps:
  - type: command
    node: [sling]
    shell: rm -rf migration_test/*.csv

  - type: query
    sql: DROP STREAM IF EXISTS src;

  - type: query
    sql: DROP STREAM IF EXISTS tgt;

  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE STREAM src
      (
        id int64,
        _tp_time datetime64(3, 'Asia/Shanghai') DEFAULT now64(3, 'Asia/Shanghai') CODEC(DoubleDelta, LZ4)
      );

  - type: query
    sql: |
      CREATE STREAM tgt
      (
        id int64,
        _tp_time datetime64(3, 'Asia/Shanghai') DEFAULT now64(3, 'Asia/Shanghai') CODEC(DoubleDelta, LZ4)
      );

  - type: wait
    time: 3

  - type: query
    sql: INSERT INTO src(id, _tp_time) VALUES(1, '2025-07-18 22:00:00');

  - type: wait
    time: 1

  - type: command
    node: [sling]
    shell: sling run --src-conn TIMEPLUS --src-stream "src" --tgt-conn LOCAL --tgt-object "migration_test/old.csv" --mode incremental --update-key _tp_time -d

  - type: command
    node: [sling]
    shell: sling run --src-conn LOCAL --src-stream "migration_test/old.csv" --tgt-conn TIMEPLUS --tgt-object "tgt" --mode incremental --update-key _tp_time -d

  - type: wait
    time: 2

  - type: query
    sql: INSERT INTO src(id, _tp_time) VALUES(2, '2025-07-19 05:00:00');

  - type: wait
    time: 2

  - type: command
    node: [sling]
    shell: sling run --src-conn TIMEPLUS --src-stream "src" --tgt-conn LOCAL --tgt-object "migration_test/new.csv" --mode incremental --update-key _tp_time -d

  - type: command
    node: [sling]
    shell: sling run --src-conn LOCAL --src-stream "migration_test/new.csv" --tgt-conn TIMEPLUS --tgt-object "tgt" --mode incremental --update-key _tp_time -d

  - type: wait
    time: 2

  - name: sling-0-1
    type: stream
    query: SELECT * FROM table(tgt);
    schema:
      - name: id
        type: int64
      - name: _tp_time
        type: datetime64(3)

  - type: wait
    time: 1

  - type: check
    target_name: sling-0-1
    mode: random
    expected_result:
      - [ 1, '2025-07-18 14:00:00' ]
      - [ 2, '2025-07-18 21:00:00' ]
