description: |
  Test sling data transfer from db to db with float and decimal data type
  Main Steps:
    1.Create source and target stream
    2.Ingest data
    3.Migration data with full-refresh mode
    4.Ingest data
    5.Migration data with incremental mode and update-key ts
    6.Check target stream table query

cluster:
  - p1s1
  - p3s1

steps:
  - type: query
    sql: DROP STREAM IF EXISTS src;

  - type: query
    sql: DROP STREAM IF EXISTS tgt;

  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE STREAM src
      (
        id int64,
        f32 float32,
        f64 float64,
        dmin decimal(1, 0),
        dmax decimal(76, 30)
      );

  - type: query
    sql: |
      CREATE STREAM tgt
      (
        id int64,
        f32 float32,
        f64 float64,
        dmin decimal(1, 0),
        dmax decimal(76, 30)
      );

  - type: wait
    time: 3

  - type: query
    sql: |
      INSERT INTO src(id, f32, f64, dmin, dmax) VALUES
      (1, 12345.678, 123456789.12345678, 1, 0.1234567890)
      (2, -12345.678, -123456789.12345678, -1, -0.1234567890)
      (3, 0.0, 0.0, 1, 0.0);

  - type: wait
    time: 2

  - type: command
    node: [sling]
    shell: sling run --src-conn TIMEPLUS --src-stream "src" --tgt-conn TIMEPLUS --tgt-object "tgt" --mode full-refresh -d

  - type: wait
    time: 2
 
  - type: query
    sql: |
      INSERT INTO src(id, f32, f64, dmin, dmax) VALUES
      (4, 12345.678, 123456789.12345678, 1, 0.1234567890)
      (5, -12345.678, -123456789.12345678, -1, -0.1234567890)
      (6, 0.0, 0.0, 1, 0.0);

  - type: wait
    time: 2

  - type: command
    node: [sling]
    shell: sling run --src-conn TIMEPLUS --src-stream "src" --tgt-conn TIMEPLUS --tgt-object "tgt" --mode incremental --update-key _tp_time -d

  - type: wait
    time: 1

  - name: sling-6-1
    type: stream
    query: SELECT id, f32, f64, dmin, dmax FROM table(tgt) order by id;
    schema:
      - name: id
        type: int64
      - name: f32
        type: float32
      - name: f64
        type: float64
      - name: dmin
        type: decimal(1, 0)
      - name: dmax
        type: decimal(76, 30)

  - type: wait
    time: 1

  - type: check
    target_name: sling-6-1
    expected_result:
      - [ 1, 12345.678, 123456789.12345678, '1', '0.1234567890' ]
      - [ 2, -12345.678, -123456789.12345678, '-1', '-0.1234567890' ]
      - [ 3, 0.0, 0.0, '1', '0' ]
      - [ 4, 12345.678, 123456789.12345678, '1', '0.1234567890' ]
      - [ 5, -12345.678, -123456789.12345678, '-1', '-0.1234567890' ]
      - [ 6, 0.0, 0.0, '1', '0' ]
