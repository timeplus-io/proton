name: transfer_db

description: Test sling data transfer between timeplus and timeplus

tags:
  - migration
  - sling

setup:
  scope: suite
  steps:
  - type: command
    node: [sling]
    shell: |
      sling conns list

  - type: command
    node: [sling]
    shell: |
      sling conns test TIMEPLUS

  - type: query
    sql: DROP STREAM IF EXISTS src;

  - type: query
    sql: DROP STREAM IF EXISTS tgt;

  - type: query
    sql: DROP STREAM IF EXISTS src1;

  - type: query
    sql: DROP STREAM IF EXISTS tgt1;

  - type: query
    sql: DROP STREAM IF EXISTS src2;


teardown:
  scope: suite
  steps:
  - type: query
    sql: DROP STREAM IF EXISTS src;

  - type: query
    sql: DROP STREAM IF EXISTS tgt;

  - type: query
    sql: DROP STREAM IF EXISTS src1;

  - type: query
    sql: DROP STREAM IF EXISTS tgt1;

  - type: query
    sql: DROP STREAM IF EXISTS src2;
