description: |
  Test sling data transfer from db to db with column name conflict
  Main Steps:
    1.Create source and target stream with column name conflict
    2.Ingest data
    3.Migration data with incremental mode and update-key _tp_time
    4.Check target stream table query

cluster:
  - p1s1
  - p3s1

steps:
  - type: query
    sql: DROP STREAM IF EXISTS src;

  - type: query
    sql: DROP STREAM IF EXISTS tgt;

  - type: wait
    time: 1

  - type: query
    sql: CREATE STREAM src (id int64, Id int64, i int64 ALIAS id);

  - type: query
    sql: CREATE STREAM tgt (id int64, Id int64, i int64 ALIAS id);

  - type: wait
    time: 3

  - type: query
    sql: |
      INSERT INTO src(id, Id) VALUES
      (1, 11) (2, 22) (3, 33);

  - type: wait
    time: 2

  - type: command
    node: [sling]
    shell: sling run --src-conn TIMEPLUS --src-stream "src" --tgt-conn TIMEPLUS --tgt-object "tgt" --mode full-refresh -d

  - type: query
    sql: |
      INSERT INTO src(id, Id) VALUES
      (4, 44) (5, 55) (6, 66);

  - type: wait
    time: 2

  - type: command
    node: [sling]
    shell: sling run --src-conn TIMEPLUS --src-stream "src" --tgt-conn TIMEPLUS --tgt-object "tgt" --mode incremental --update-key _tp_time -d

  - type: wait
    time: 2

  - name: sling-5-1
    type: stream
    query: SELECT id, Id FROM table(tgt);
    schema:
      - name: id
        type: int64
      - name: Id
        type: int64

  - type: wait
    time: 1

  - type: check
    target_name: sling-5-1
    mode: random
    expected_result:
      - [ 1, 11 ]
      - [ 2, 22 ]
      - [ 3, 33 ]
      - [ 4, 44 ]
      - [ 5, 55 ]
      - [ 6, 66 ]
