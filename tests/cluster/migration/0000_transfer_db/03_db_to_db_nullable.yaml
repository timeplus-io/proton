description: |
  Test sling data transfer from db to db with nullable data type
  Main Steps:
    1.Create source and target stream
    2.Ingest data with non-null value
    3.Migration data with incremental mode and update-key ts
    4.Ingest data with null value
    5.Migration data with incremental mode and update-key ts
    6.Ingest data with null value
    7.Migration data with incremental mode and update-key _tp_time
    8.Check target stream table query

cluster:
  - p1s1
  - p3s1

steps:
  - type: query
    sql: DROP STREAM IF EXISTS src;

  - type: query
    sql: DROP STREAM IF EXISTS tgt;

  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE STREAM src
      (
        id nullable(int64),
        value nullable(float64),
        name nullable(string),
        d nullable(date),
        dt nullable(datetime),
        ts nullable(datetime64(3)) DEFAULT now64(3)
      );

  - type: query
    sql: |
      CREATE STREAM tgt
      (
        id nullable(int64),
        value nullable(float64),
        name nullable(string),
        d nullable(date),
        dt nullable(datetime),
        ts nullable(datetime64(3)) DEFAULT now64(3)
      );

  - type: wait
    time: 3

  - type: query
    sql: |
      INSERT INTO src(id, value, name, d, dt, ts) VALUES
      (1, 11.1, 's1', '2025-01-01', '2025-01-01 20:00:01', '2025-01-01 20:00:01.001')
      (2, 22.2, 's2', '2025-01-02', '2025-01-02 20:00:02', '2025-01-02 20:00:02.002')
      (3, 33.3, 's3', '2025-01-03', '2025-01-03 20:00:03', '2025-01-03 20:00:03.003');

  - type: wait
    time: 2

  - type: command
    node: [sling]
    shell: sling run --src-conn TIMEPLUS --src-stream "src" --tgt-conn TIMEPLUS --tgt-object "tgt" --mode full-refresh -d

  - type: wait
    time: 2
 
  - type: query
    sql: |
      INSERT INTO src(id, value, name, d, dt, ts) VALUES
      (4, 44.4, 's4', '2025-01-04', '2025-01-04 20:00:04', null)
      (null, null, null, null, null, '2025-01-05 20:00:05.005');

  - type: wait
    time: 2

  - type: command
    node: [sling]
    shell: sling run --src-conn TIMEPLUS --src-stream "src" --tgt-conn TIMEPLUS --tgt-object "tgt" --mode incremental --update-key ts -d

  - type: wait
    time: 2

  - type: query
    sql: |
      INSERT INTO src(id, value, name, d, dt, ts) VALUES
      (6, 66.6, 's6', '2025-01-06', '2025-01-06 20:00:06', null)
      (null, null, null, null, null, '2025-01-07 20:00:07.007')
      (null, null, null, null, null, null);

  - type: wait
    time: 2

  - type: command
    node: [sling]
    shell: sling run --src-conn TIMEPLUS --src-stream "src" --tgt-conn TIMEPLUS --tgt-object "tgt" --mode incremental --update-key _tp_time -d

  - type: wait
    time: 2

  - name: sling-3-1
    type: stream
    query: SELECT id, value, name, d, dt, ts FROM table(tgt);
    schema:
      - name: id
        type: nullable(int64)
      - name: value
        type: nullable(float64)
      - name: name
        type: nullable(string)
      - name: d
        type: nullable(date)
      - name: dt
        type: nullable(datetime)
      - name: ts
        type: nullable(datetime64(3))

  - type: wait
    time: 1

  - type: check
    target_name: sling-3-1
    mode: random
    expected_result:
      - [ 1, '11.1', 's1', '2025-01-01', '2025-01-01 20:00:01', '2025-01-01 20:00:01.001' ]
      - [ 2, '22.2', 's2', '2025-01-02', '2025-01-02 20:00:02', '2025-01-02 20:00:02.002' ]
      - [ 3, '33.3', 's3', '2025-01-03', '2025-01-03 20:00:03', '2025-01-03 20:00:03.003' ]
      - [ null, null, null, null, null, '2025-01-05 20:00:05.005' ]
      - [ 6, '66.6', 's6', '2025-01-06', '2025-01-06 20:00:06', null ]
      - [ null, null, null, null, null, '2025-01-07 20:00:07.007' ]
      - [ null, null, null, null, null, null ]
