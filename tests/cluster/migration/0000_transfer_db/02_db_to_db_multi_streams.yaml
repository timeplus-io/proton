description: |
  Test sling data transfer from db to db with incremental mode
  Main Steps:
    1.Create 3 source stream and 2 target stream
    2.Ingest data into 3 source stream
    3.Migration data  to 2 target stream with config file
    4.Check 2 target stream table query

cluster:
  - p1s1
  - p3s1

steps:
  - type: query
    sql: DROP STREAM IF EXISTS src;

  - type: query
    sql: DROP STREAM IF EXISTS tgt;

  - type: query
    sql: DROP STREAM IF EXISTS src1;

  - type: query
    sql: DROP STREAM IF EXISTS tgt1;

  - type: query
    sql: DROP STREAM IF EXISTS src2;

  - type: wait
    time: 1

  - type: query
    sql: |
      CREATE STREAM src
      (id int64, value float64, name string, ts datetime64(3) DEFAULT now64(3));

  - type: query
    sql: |
      CREATE STREAM tgt
      (id int64, value float64, name string, ts datetime64(3) DEFAULT now64(3));

  - type: query
    sql: |
      CREATE STREAM src1
      (id int64, value float64, name string, ts datetime64(3) DEFAULT now64(3));

  - type: query
    sql: |
      CREATE STREAM tgt1
      (id int64, value float64, name string, ts datetime64(3) DEFAULT now64(3));

  - type: query
    sql: |
      CREATE STREAM src2
      (id int64, value float64, name string, ts datetime64(3) DEFAULT now64(3));

  - type: wait
    time: 4

  - type: query
    sql: |
      INSERT INTO src(id, value, name, ts) VALUES
      (1, 11.1, 's1', '2025-01-01 20:00:01')
      (2, 22.2, 's2', '2025-01-02 20:00:02')
      (3, 33.3, 's3', '2025-01-03 20:00:03');

  - type: query
    sql: |
      INSERT INTO src1(id, value, name, ts) VALUES
      (1, 11.1, 's1', '2025-01-01 20:00:01')
      (2, 22.2, 's2', '2025-01-02 20:00:02')
      (3, 33.3, 's3', '2025-01-03 20:00:03');

  - type: query
    sql: |
      INSERT INTO src2(id, value, name, ts) VALUES
      (4, 44.4, 's4', '2025-01-04 20:00:04')
      (5, 55.5, 's5', '2025-01-05 20:00:05')
      (6, 66.6, 's6', '2025-01-06 20:00:06');

  - type: wait
    time: 2

  - type: command
    node: [sling]
    shell: sling run -r ~/.sling/config/0000_02.yaml -d

  - type: wait
    time: 2

  - name: sling-2-1
    type: stream
    query: SELECT id, value, name, ts FROM table(tgt) order by id;
    schema:
      - name: id
        type: int64
      - name: value
        type: float64
      - name: name
        type: string
      - name: ts
        type: datetime64(3)

  - name: sling-2-2
    type: stream
    query: SELECT id, value, name, ts FROM table(tgt1) order by id;
    schema:
      - name: id
        type: int64
      - name: value
        type: float64
      - name: name
        type: string
      - name: ts
        type: datetime64(3)

  - type: wait
    time: 1

  - type: check
    target_name: sling-2-1
    mode: random
    expected_result:
      - [ 1, '11.1', 's1', '2025-01-01 20:00:01' ]
      - [ 2, '22.2', 's2', '2025-01-02 20:00:02' ]
      - [ 3, '33.3', 's3', '2025-01-03 20:00:03' ]
      - [ 4, '44.4', 's4', '2025-01-04 20:00:04' ]
      - [ 5, '55.5', 's5', '2025-01-05 20:00:05' ]
      - [ 6, '66.6', 's6', '2025-01-06 20:00:06' ]

  - type: check
    target_name: sling-2-2
    mode: random
    expected_result:
      - [ 1, '11.1', 's1', '2025-01-01 20:00:01' ]
      - [ 2, '22.2', 's2', '2025-01-02 20:00:02' ]
      - [ 3, '33.3', 's3', '2025-01-03 20:00:03' ]
