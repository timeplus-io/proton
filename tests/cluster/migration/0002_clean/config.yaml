name: clean

description: Test sling data cleanup

tags:
  - migration
  - sling

setup:
  scope: suite
  steps:
  - type: command
    node: [sling]
    shell: |
      sling conns list

  - type: command
    node: [sling]
    shell: |
      sling conns test TIMEPLUS

  - type: query
    sql: DROP STREAM IF EXISTS src;

  - type: query
    sql: DROP STREAM IF EXISTS tgt;

teardown:
  scope: suite
  steps:
  - type: query
    sql: DROP STREAM IF EXISTS src;

  - type: query
    sql: DROP STREAM IF EXISTS tgt;
