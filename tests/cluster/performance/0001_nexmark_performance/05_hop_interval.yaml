description: |
  Test base select (External Stream -> MV -> Target Stream), hopping window view

cluster:
  - p3k1

steps:
  - type: kafka
    name: delete
    topic: NEXMARK_Q5
  - type: wait
    time: 1
  
  - type: kafka
    name: create
    topic: NEXMARK_Q5
    settings:
      partitions: 1
      replication: 1
  - type: wait
    time: 1

  - type: query
    sql:
      CREATE EXTERNAL STREAM target(
      auction  int64,
      num  int64) 
      SETTINGS type='kafka', 
              brokers='k1:9092', 
              topic='NEXMARK_Q5', 
              data_format='JSONEachRow',
              one_message_per_row=false;
  - type: wait
    time: 2

  - type: query
    sql:
      CREATE MATERIALIZED VIEW mv INTO target AS 
      SELECT
        AuctionBids.auction, AuctionBids.num
      FROM
        (
          SELECT
            B1.auction, count(*) AS num, window_start, window_end
          FROM
            hop(bid, date_time, INTERVAL 2 SECOND, INTERVAL 10 SECOND) AS B1
          GROUP BY
            B1.auction, window_start, window_end
        ) AS AuctionBids
      INNER JOIN (
          SELECT
            max(CountBids.num) AS maxn, CountBids.window_start, CountBids.window_end
          FROM
            (
              SELECT
                count(*) AS num, window_start, window_end
              FROM
                hop(bid, date_time, INTERVAL 2 SECOND, INTERVAL 10 SECOND) AS B2
              GROUP BY
                B2.auction, window_start, window_end
            ) AS CountBids
          GROUP BY
            CountBids.window_start, CountBids.window_end
        ) AS MaxBids ON (AuctionBids.window_start = MaxBids.window_start) AND (AuctionBids.window_end = MaxBids.window_end)
      WHERE
        AuctionBids.num >= MaxBids.maxn
      SETTINGS
        seek_to = 'earliest';
      
  - type: wait
    time: 150

  - name: ext-0-1
    type: stream
    query: select count(*) from table(target);
    retry: 5 # run query 5 times to calculate the average latency
    concurrency: 1 # run 1 queries concurrently
    statistic_only: true
    archive: true
    schema:
      - name: count()
        type: uint64

  - type: wait
    time: 30
