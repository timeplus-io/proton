description: |
  Test count(*) filter and count(distinct bidder) filter

cluster:
  - p3k1

steps:
  - type: kafka
    name: delete
    topic: NEXMARK_Q16
  - type: wait
    time: 1
  
  - type: kafka
    name: create
    topic: NEXMARK_Q16
    settings:
      partitions: 1
      replication: 1
  - type: wait
    time: 1

  - type: query
    sql:
      CREATE EXTERNAL STREAM target(
      channel string,
      day date,
      minute date,
      total_bids int64,
      rank1_bids int64,
      rank2_bids int64,
      rank3_bids int64,
      total_bidders int64,
      rank1_bidders int64,
      rank2_bidders int64,
      rank3_bidders int64,
      total_auctions int64,
      rank1_auctions int64,
      rank2_auctions int64,
      rank3_auctions int64) 
      SETTINGS type='kafka', 
              brokers='k1:9092', 
              topic='NEXMARK_Q16', 
              data_format='JSONEachRow',
              one_message_per_row=false;
  - type: wait
    time: 2

  - type: query
    sql:
      CREATE MATERIALIZED VIEW mv INTO target AS 
      SELECT
          channel,
          to_date(date_time) as `day`,
          max(date_trunc('minute', date_time)) as `minute`,
          count(*) AS total_bids,
          count(*) filter (where price < 10000) AS rank1_bids,
          count(*) filter (where price >= 10000 and price < 1000000) AS rank2_bids,
          count(*) filter (where price >= 1000000) AS rank3_bids,
          count(distinct bidder) AS total_bidders,
          count(distinct bidder) filter (where price < 10000) AS rank1_bidders,
          count(distinct bidder) filter (where price >= 10000 and price < 1000000) AS rank2_bidders,
          count(distinct bidder) filter (where price >= 1000000) AS rank3_bidders,
          count(distinct auction) AS total_auctions,
          count(distinct auction) filter (where price < 10000) AS rank1_auctions,
          count(distinct auction) filter (where price >= 10000 and price < 1000000) AS rank2_auctions,
          count(distinct auction) filter (where price >= 1000000) AS rank3_auctions
      FROM bid
      GROUP BY channel, day
      SETTINGS
        seek_to = 'earliest';
      
  - type: wait
    time: 150

  - name: ext-0-1
    type: stream
    query: select count(*) from table(target);
    retry: 5 # run query 5 times to calculate the average latency
    concurrency: 1 # run 1 queries concurrently
    statistic_only: true
    archive: true
    schema:
      - name: count()
        type: uint64

  - type: wait
    time: 30
