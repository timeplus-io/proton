description: |
  Test base select (External Stream -> MV -> Target Stream), MOD(auction, 123)

cluster:
  - p3k1

steps:
  - type: kafka
    name: delete
    topic: NEXMARK_Q2
  - type: wait
    time: 1
  
  - type: kafka
    name: create
    topic: NEXMARK_Q2
    settings:
      partitions: 1
      replication: 1
  - type: wait
    time: 1

  - type: query
    sql:
      CREATE EXTERNAL STREAM target(
      auction  int64,
      price  int64) 
      SETTINGS type='kafka', 
              brokers='k1:9092', 
              topic='NEXMARK_Q2', 
              data_format='JSONEachRow',
              one_message_per_row=false;
  - type: wait
    time: 2

  - type: query
    sql:
      CREATE MATERIALIZED VIEW mv INTO target AS 
      SELECT auction, price FROM bid WHERE MOD(auction, 123) = 0
      SETTINGS seek_to = 'earliest';
      
  - type: wait
    time: 150

  - name: ext-0-1
    type: stream
    query: select count(*) from table(target);
    retry: 5 # run query 5 times to calculate the average latency
    concurrency: 1 # run 1 queries concurrently
    statistic_only: true
    archive: true
    schema:
      - name: count()
        type: uint64

  - type: wait
    time: 30
