description: |
  Test split_by_string('/', url)

tags:
  - skip # skip temproraliy

cluster:
  - p3k1

steps:
  - type: kafka
    name: delete
    topic: NEXMARK_Q21
  - type: wait
    time: 1
  
  - type: kafka
    name: create
    topic: NEXMARK_Q21
    settings:
      partitions: 1
      replication: 1
  - type: wait
    time: 1

  - type: query
    sql:
      CREATE EXTERNAL STREAM target(
      auction int64,
      bidder int64,
      price int64,
      channel string,
      dir2 string,
      dir3 string
      )
      SETTINGS type='kafka', 
              brokers='k1:9092', 
              topic='NEXMARK_Q21', 
              data_format='JSONEachRow',
              one_message_per_row=false;
  - type: wait
    time: 2

  - type: query
    sql:
      CREATE MATERIALIZED VIEW mv INTO target AS 
      SELECT
        auction, bidder, price, channel, split_by_string('/', url) AS parts, parts[3] AS dir1, parts[4] AS dir2, parts[5] AS dir3
      FROM
        bid
      SETTINGS
        seek_to = 'earliest';
      
  - type: wait
    time: 170

  - name: ext-0-1
    type: stream
    query: select count(*) from table(target);
    retry: 5 # run query 5 times to calculate the average latency
    concurrency: 1 # run 1 queries concurrently
    statistic_only: true
    archive: true
    schema:
      - name: count()
        type: uint64

  - type: wait
    time: 40
