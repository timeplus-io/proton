description: |
  Test select * from FROM bid AS B INNER JOIN auction AS A ON B.auction = A.id WHERE A.category = 10

tags:
  - skip # skip temproraliy

cluster:
  - p3k1

steps:
  - type: kafka
    name: delete
    topic: NEXMARK_Q19
  - type: wait
    time: 1
  
  - type: kafka
    name: create
    topic: NEXMARK_Q19
    settings:
      partitions: 1
      replication: 1
  - type: wait
    time: 1

  - type: query
    sql:
      CREATE EXTERNAL STREAM target(
      auction int64,
      bidder int64,
      price int64,
      channel string,
      url string,
      b_datetime datetime64,
      b_extra string,
      itemName string,
      description string,
      initialBid int64,
      reserve int64,
      a_datetime datetime64,
      expires datetime64,
      seller int64,
      category int64,
      a_extra string)
      SETTINGS type='kafka', 
              brokers='k1:9092', 
              topic='NEXMARK_Q19', 
              data_format='JSONEachRow',
              one_message_per_row=false;
  - type: wait
    time: 2

  - type: query
    sql:
      CREATE MATERIALIZED VIEW mv INTO target AS 
      SELECT
        auction, bidder, price, channel, url, B.date_time as b_datetime, B.extra as b_extra, 
        itemName, description, initialBid, reserve, A.date_time as a_datetime, expires, seller, category, A.extra as a_extra
      FROM
        bid AS B
      INNER JOIN auction AS A ON B.auction = A.id
      WHERE
        A.category = 10
      SETTINGS
        seek_to = 'earliest';
      
  - type: wait
    time: 190

  - name: ext-0-1
    type: stream
    query: select count(*) from table(target);
    retry: 5 # run query 5 times to calculate the average latency
    concurrency: 1 # run 1 queries concurrently
    statistic_only: true
    archive: true
    schema:
      - name: count()
        type: uint64

  - type: wait
    time: 40
