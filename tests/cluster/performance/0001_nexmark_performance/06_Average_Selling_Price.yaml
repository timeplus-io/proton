description: |
  Test average selling price from auction inner join Bid

tags:
  - skip # skip temproraliy 
cluster:
  - p3k1

steps:
  - type: kafka
    name: delete
    topic: NEXMARK_Q6
  - type: wait
    time: 1
  
  - type: kafka
    name: create
    topic: NEXMARK_Q6
    settings:
      partitions: 1
      replication: 1
  - type: wait
    time: 1

  - type: query
    sql:
      CREATE EXTERNAL STREAM target(
      seller int64, 
      avg_sell_price float64) 
      SETTINGS type='kafka', 
              brokers='k1:9092', 
              topic='NEXMARK_Q6', 
              data_format='JSONEachRow',
              one_message_per_row=false;
  - type: wait
    time: 2

  - type: query
    sql:
      CREATE MATERIALIZED VIEW mv INTO target AS 
      SELECT
        seller, array_avg(concat([final], lags(final, 1, 9, 0))) OVER (PARTITION BY seller) as avg_sell_price
      FROM
        (
          SELECT
            max(B.price) AS final, A.seller AS seller, B.date_time
          FROM
            auction AS A
          INNER JOIN bid AS B ON A.id = B.auction
          WHERE
            (B.date_time >= A.date_time) AND (B.date_time <= A.expires)
          GROUP BY
            A.id, A.seller, B.date_time
        )
      SETTINGS
        seek_to = 'earliest';
      
  - type: wait
    time: 10

  - name: ext-0-1
    type: stream
    query: select count(*) from table(target);
    retry: 5 # run query 5 times to calculate the average latency
    concurrency: 1 # run 1 queries concurrently
    statistic_only: true
    archive: true
    schema:
      - name: count()
        type: uint64

  - type: wait
    time: 5
