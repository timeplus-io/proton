description: |
  Test rank bid and rank bidder

cluster:
  - p3k1

steps:
  - type: kafka
    name: delete
    topic: NEXMARK_Q15
  - type: wait
    time: 1
  
  - type: kafka
    name: create
    topic: NEXMARK_Q15
    settings:
      partitions: 1
      replication: 1
  - type: wait
    time: 1

  - type: query
    sql:
      CREATE EXTERNAL STREAM target(
      day date,
      total_bids int64,
      rank1_bids int64,
      rank2_bids int64,
      rank3_bids int64,
      total_bidders int64,
      rank1_bidders int64,
      rank2_bidders int64,
      rank3_bidders int64,
      total_auctions int64,
      rank1_auctions int64,
      rank2_auctions int64,
      rank3_auctions int64) 
      SETTINGS type='kafka', 
              brokers='k1:9092', 
              topic='NEXMARK_Q15', 
              data_format='JSONEachRow',
              one_message_per_row=false;
  - type: wait
    time: 2

  - type: query
    sql:
      CREATE MATERIALIZED VIEW mv INTO target AS 
      SELECT
        to_date(date_time) AS day, 
        count(*) AS total_bids, 
        count_if(*, price < 10000) AS rank1_bids, 
        count_if(*, (price >= 10000) AND (price < 1000000)) AS rank2_bids, 
        count_if(*, price >= 1000000) AS rank3_bids, 
        count_distinct(bidder) AS total_bidders, 
        count_distinct_if(bidder, price < 10000) AS rank1_bidders, 
        count_distinct_if(bidder, (price >= 10000) AND (price < 1000000)) AS rank2_bidders, 
        count_distinct_if(bidder, price >= 1000000) AS rank3_bidders, 
        count_distinct(auction) AS total_auctions, 
        count_distinct_if(auction, price < 10000) AS rank1_auctions, 
        count_distinct_if(auction, (price >= 10000) AND (price < 1000000)) AS rank2_auctions, 
        count_distinct_if(auction, price >= 1000000) AS rank3_auctions
      FROM
        bid
      GROUP BY
        day
      SETTINGS
        seek_to = 'earliest';
      
  - type: wait
    time: 150

  - name: ext-0-1
    type: stream
    query: select count(*) from table(target);
    retry: 5 # run query 5 times to calculate the average latency
    concurrency: 1 # run 1 queries concurrently
    statistic_only: true
    archive: true
    schema:
      - name: count()
        type: uint64

  - type: wait
    time: 30
