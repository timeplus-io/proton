services:
  probe:
    image: timeplus/probe:0.1.15
    container_name: p3s1_probe
    stdin_open: true
    volumes:
      - ../deployment:/deploy # deployment dir
      - ../migration:/migration # migration test dir
      - ../log/p3s1/log:/log
      - ${SSH_DIR}/smoke:/root/.ssh:ro  # For SSH use, please prepare .ssh directory with root privillage for local test
      - /var/run/docker.sock:/var/run/docker.sock # To solve docker.sock permission error
    networks:
      - mynetwork
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      restart_policy:
        condition: on-failure
  p1:
    image: timeplus/proton-smoke-test:${PROTON_VERSION}
    container_name: proton-server1
    entrypoint: >
      /bin/bash -c "sed -i'' 's/preallocate: true/preallocate: false/g' /etc/proton-server/config.yaml && sed -i'' 's/ level: information/ level: debug/g' /etc/proton-server/config.yaml && /entrypoint.sh"
    environment:
      - ADVERTISED_HOST=proton-server1
      - METADATA_NODE_QUORUM="proton-server1:8464,proton-server2:8464,proton-server3:8464"
    volumes:
      - ${SSH_DIR}/smoke:/root/.ssh:ro
      - ${FULL_LOG_DIR:-./log}/proton-server1/log:/var/log/proton-server
    networks:
      - mynetwork
    deploy:
      restart_policy:
        condition: on-failure
  p2:
    image: timeplus/proton-smoke-test:${PROTON_VERSION}
    container_name: proton-server2
    entrypoint: >
      /bin/bash -c "sed -i'' 's/preallocate: true/preallocate: false/g' /etc/proton-server/config.yaml && sed -i'' 's/ level: information/ level: debug/g' /etc/proton-server/config.yaml && /entrypoint.sh"
    environment:
      - ADVERTISED_HOST=proton-server2
      - METADATA_NODE_QUORUM="proton-server1:8464,proton-server2:8464,proton-server3:8464"
    volumes:
      - ${SSH_DIR}/smoke:/root/.ssh:ro
      - ${FULL_LOG_DIR:-./log}/proton-server2/log:/var/log/proton-server
    networks:
      - mynetwork
    deploy:
      restart_policy:
        condition: on-failure
  p3:
    image: timeplus/proton-smoke-test:${PROTON_VERSION}
    container_name: proton-server3
    entrypoint: >
      /bin/bash -c "sed -i'' 's/preallocate: true/preallocate: false/g' /etc/proton-server/config.yaml && sed -i'' 's/ level: information/ level: debug/g' /etc/proton-server/config.yaml && /entrypoint.sh"
    environment:
      - ADVERTISED_HOST=proton-server3
      - METADATA_NODE_QUORUM="proton-server1:8464,proton-server2:8464,proton-server3:8464"
    volumes:
      - ${SSH_DIR}/smoke:/root/.ssh:ro
      - ${FULL_LOG_DIR:-./log}/proton-server3/log:/var/log/proton-server
    networks:
      - mynetwork
    deploy:
      restart_policy:
        condition: on-failure
  sling:
    image: timeplus/sling-cli:1.2.20-timeplus.3
    container_name: sling
    volumes:
      - ${SSH_DIR}/smoke:/root/.ssh:ro
      - .sling:/root/.sling
    networks:
      - mynetwork
    deploy:
      restart_policy:
        condition: on-failure

networks:
  mynetwork:
    driver: bridge
