services:
  proton:
    image: d.timeplus.com/timeplus-io/proton:latest
    pull_policy: always
    ports:
      - 8463:8463
      - 3218:3218
    healthcheck:
      test: ["CMD", "curl", "http://localhost:3218/proton/ping"]
      interval: 5s
      timeout: 10s
      retries: 3
      start_period: 10s

  init_timeplus_resources:
    entrypoint:
      - proton
      - client
      - -h
      - proton
      - --queries-file
      - /script/init.sql
    image: d.timeplus.com/timeplus-io/proton:latest
    volumes:
      - ./init_sql:/script
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://proton:8123/?query=show+create+comment || exit 1
      interval: 5s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      proton:
        condition: service_healthy

  hn_stream:
    build:
      context: .
    image: docker.timeplus.com/timeplus/hackernews_bytewax:latest
    environment:
      - PROTON_HOST=proton
    depends_on:
      proton:
        condition: service_healthy

  grafana:
    image: grafana/grafana:latest
    pull_policy: always
    ports:
      - 3000:3000
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 1
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_PLUGINS_PREINSTALL: timeplus-proton-datasource@@https://d.timeplus.com/grafana/timeplus-proton-datasource-2.1.2.zip
      GF_LOG_LEVEL: error
    volumes:
      - ./grafana_provisioning:/etc/grafana/provisioning
    depends_on:
      init_timeplus_resources:
        condition: service_completed_successfully
