services:
  proton:
    image: d.timeplus.com/timeplus-io/proton:latest
    pull_policy: always
    ports:
      - 3218:3218 # HTTP Streaming
      - 8463:8463 # TCP Streaming
    networks:
      - internal

  grafana:
    image: grafana/grafana:latest
    pull_policy: always
    ports:
      - 3000:3000
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 1
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_PLUGINS_PREINSTALL: timeplus-proton-datasource@@https://d.timeplus.com/grafana/timeplus-proton-datasource-2.1.2.zip
    volumes:
      - ./provisioning:/etc/grafana/provisioning
    depends_on:
      - proton
    networks:
      - internal

  nginx-access-log-data-generator:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - PROTON_HOST=proton
        - IPINFO_KEY=$IPINFO_KEY
      platforms:
        - linux/amd64
        - linux/arm64
    depends_on:
      - proton
    networks:
      - internal

networks:
  internal:
    name: internal_network
