#                num_levels: 2

# On Linux systems this can control the behavior of OOM killer.
# oom_score: 1000

task:
    worker_threads: 0              # Task execution threads. 0 means determined by CPU cores.
    max_scheduled_tasks: 1024      # Maximum number of scheduled tasks. Task may not be scheduled when total number exceeds the limit.

enable_javascript_udf: true        # If false, reject JavaScript UDF creation and execution.
enable_python_udf: true            # If false, reject Python UDF creation and execution.

# Declarative Python UDF package management. When `url` is set, every node fetches the
# requirements.txt from S3 on startup — and then every `poll_interval_sec` to pick up updates
# without a restart — and installs missing packages into the local user site-packages; the
# file is the durable source of truth. This applies to all node types: it restores packages on
# ephemeral compute nodes (no persistent volume) after a reschedule, and keeps data nodes with
# persistent volumes in sync via polling. The reconcile only installs — packages removed from
# the file must be uninstalled manually. SYSTEM INSTALL/UNINSTALL PYTHON PACKAGE remains usable
# as a manual escape hatch, but packages installed that way are not recorded in the file and
# do not survive a reschedule on nodes without persistent volumes.
# Pin versions (package==x.y.z) so all nodes converge on identical environments.
# python_requirements:
#     url: https://my-bucket.s3.us-west-2.amazonaws.com/proton/requirements.txt
#     # How often (seconds) to re-check the file for changes after a successful reconcile.
#     # 0 disables polling (reconcile on startup only). Default: 300.
#     # poll_interval_sec: 300
#     # Credentials are optional; without them the environment chain (IRSA / instance profile,
#     # AWS_* env variables) is used.
#     # access_key_id: ACCESS_KEY_ID
#     # secret_access_key: SECRET_ACCESS_KEY
#     # region: us-west-2
#     # Optional pip index overrides (e.g. an internal mirror).
#     # index_url: https://pypi.org/simple
#     # extra_index_url: https://my-mirror.example.com/simple

settings:
    global:
        query_mode: streaming               # Default query mode. table or streaming
        query_resource_group: "dedicated"   # Default resource group. dedicated or shared
        enable_light_ingest: true           # Light ingest is inserting partial columns of a table
        _tp_enable_log_stream_expr: true    # Log system analytic
        synchronous_ddl: true               # If setting is enabled, the DDL for streaming storage will be executed synchronously otherwise it will be asynchronous. By default is enabled.
        asterisk_include_reserved_columns: true # Show reserved columns on SELECT * query.
        asterisk_include_tp_sn_column: false    # If include _tp_sn column on SELECT * query.
        async_ingest_block_timeout_ms: 12000    # Max duration for a block to commit before it is considered expired during async ingestion
        aysnc_ingest_max_outstanding_blocks: 10000 # Max outstanding blocks to be committed per stream during async ingestion
        storage_commit_pool_size: 64 # Total shared thread pool size for building and committing parts for Stream
        max_idempotent_ids: 1000 # Maximum idempotent IDs to keep in memory and on disk for idempotent data ingestion
        _tp_internal_system_open_sesame: true # Control the access to system.* streams

        javascript_max_memory_bytes: 204857600 # Maximum heap size of javascript UDA/UDF in bytes, default is 200*1024*1024 bytes
        v8_log_interval_ms: 30000 # V8 log interval in milliseconds, default is 30000 ms
        recovery_policy: "strict" # Recovery policy for materialized view. strict or best_effort
        recovery_retry_for_same_error: 1000000000000 # retry times for same error. this value only apply if the `recovery_policy` is `best_effort`

        max_block_size: 65409 # 65536 - (PADDING_FOR_SIMD - 1)
        max_insert_block_size: 65409 # 65536 - (PADDING_FOR_SIMD - 1)
        nlog_adhoc_pool_size: 16 # Thread pool size for nativelog ad-hoc tasks
        optimize_aggregation_emit_on_updates: true # Optimize aggregation for updates/changes, it may also lead to significantly increased memory usage in extreme scenarios

        max_hot_keys: 100000  # If not zero, it specifies the number of hot keys will kept in-memory when using hybrid hash table. Zero means no limits

        default_hash_table: memory # Default hash table: 'memory' or 'hybrid', which is used for a streaming query like join, aggregation.

        default_hash_join: memory # Default hash join: 'memory' or 'hybrid', which is used for a streaming join.
        query_timeout_sec: 30 # Distributed (DDL) query timeout in seconds

        allow_fallback_to_historical_store: true # Allow nativelog reader fallback to historical store if sequence compacted away

    stream:
        default_shards: 1
        default_sharding_expr: ""   # Empty string means `rand()` or `weak_hash32(<primary_keys>) if primary key set`
        ingest_mode: "sync"    # Data ingestion mode for Stream
        logstore: "nativelog"
        storage_type: "hybrid"
        logstore_codec: none
        logstore_retention_bytes: 0 # when this threshold reaches, streaming storage delete old data. 0 means no limit
        logstore_retention_ms: 0 # when this threshold reaches, streaming storage delete old data. <= 0 means no limit

# Global Settings
#
# For 'Connection: keep-alive' in HTTP 1.1
keep_alive_timeout: 60

telemetry_interval_ms: 300000   # 5 minutes

# Default root page on http[s] server. For example load UI from https://tabix.io/ when opening http://localhost:8123
# http_server_default_response: |-
#     <html ng-app="SMI2"><head><base href="http://ui.tabix.io/"></head><body><div ui-view="" class="content-ui"></div><script src="http://loader.tabix.io/master.js"></script></body></html>

# Maximum local disk utilization. Once it is hit, all ingest will be errored out
max_local_disk_usage_ratio: 0.9

# Simple server-wide memory profiler. Collect a stack trace at every peak allocation step (in bytes).
# Data will be stored in system.trace_log table with query_id = empty string.
# Zero means disabled.
total_memory_profiler_step: 4194304

# Collect random allocations and deallocations and write them into system.trace_log with 'MemorySample' trace_type.
# The probability is for every alloc/free regardless to the size of the allocation.
# Note that sampling happens only when the amount of untracked memory exceeds the untracked memory limit,
# which is 4 MiB by default but can be lowered if 'total_memory_profiler_step' is lowered.
# You may want to set 'total_memory_profiler_step' to 1 for extra fine grained sampling.
total_memory_tracker_sample_probability: 0

# You can specify umask here (see "man umask"). Server will apply it on startup.
# Number is always parsed as octal. Default umask is 027 (other users cannot read logs, data files, etc; group can only read).
# umask: 022

# Perform mlockall after startup to lower first queries latency
# and to prevent proton executable from being paged out under high IO load.
# Enabling this option is recommended but will lead to increased startup time for up to a few seconds.
mlock_executable: true

# Reallocate memory for machine code ("text") using huge pages. Highly experimental.
remap_executable: false

# Reloading interval for embedded dictionaries, in seconds. Default: 3600.
builtin_dictionaries_reload_interval: 3600

# Maximum session timeout, in seconds. Default: 3600.
max_session_timeout: 3600

# Default session timeout, in seconds. Default: 60.
default_session_timeout: 60

# Server settings

# Server time zone could be set here.

# Time zone is used when converting between String and DateTime types,
# when printing DateTime in text formats and parsing DateTime from text,
# it is used in date and time related functions, if specific time zone was not passed as an argument.

# Time zone is specified as identifier from IANA time zone database, like UTC or Africa/Abidjan.
# If not specified, system time zone at server startup is used.

# Please note, that server could display time zone alias instead of specified name.
# Example: W-SU is an alias for Europe/Moscow and Zulu is an alias for UTC.
# timezone: Europe/Moscow

# Set limit on number of open files (default: maximum). This setting makes sense on Mac OS X because getrlimit() fails to retrieve
# correct maximum value.
# max_open_files: 262144

# show_addresses_in_stack_traces: true
# shutdown_wait_unfinished_queries: false

# Maximum number of threads in the Global thread pool.
# This will default to a maximum of 10000 threads if not specified.
# This setting will be useful in scenarios where there are a large number
# of distributed queries that are running concurrently but are idling most
# of the time, in which case a higher number of threads might be required.
max_thread_pool_size: 10000
# max_thread_pool_free_size: 1000
# thread_pool_queue_size: 10000
# max_io_thread_pool_size: 100
# max_io_thread_pool_free_size: 0
# io_thread_pool_queue_size: 10000
# max_remote_read_network_bandwidth_for_server: 0
# max_remote_write_network_bandwidth_for_server: 0
# max_local_read_bandwidth_for_server: 0
# max_local_write_bandwidth_for_server: 0

# listen_backlog: 64
max_connections: 4096

asynchronous_metrics_update_period_s: 2
# asynchronous_heavy_metrics_update_period_s: 120
# max_threads_for_connection_collector: 10

neutron_database: neutron

default_database: default

# Default profile of settings.
default_profile: default

# Notes:
# - move_factor              is ignored
# - keep_free_space_bytes    is ignored
# - max_data_part_size_bytes is ignored
# - you must have exactly one volume in that policy
# tmp_policy: tmp
# max_temporary_data_on_disk_size: 0
# temporary_data_in_cache:

# Maximum memory usage (resident set size) for server process.
# Zero value or unset means default. Default is "max_server_memory_usage_to_ram_ratio" of available physical RAM.
# If the value is larger than "max_server_memory_usage_to_ram_ratio" of available physical RAM, it will be cut down.

# The constraint is checked on query execution time.
# If a query tries to allocate memory and the current memory usage plus allocation is greater
# than specified threshold, exception will be thrown.

# It is not practical to set this constraint to small values like just a few gigabytes,
# because memory allocator will keep this amount of memory in caches and the server will deny service of queries.
max_server_memory_usage: 0

# On memory constrained environments you may have to set this to value larger than 1.
max_server_memory_usage_to_ram_ratio: 0.8

# Limit the size of the cache. e.g., uncompressed_cache_size or mark_cache_size
cache_size_to_ram_max_ratio: 0.5

# uncompressed_cache_policy: SLRU

# Size of cache of uncompressed blocks of data, used in tables of MergeTree family.
# In bytes. Cache is single for server. Memory is allocated only on demand.
# Cache is used when 'use_uncompressed_cache' user setting turned on (off by default).
# Uncompressed cache is advantageous only for very short queries and in rare cases.

# Note: uncompressed cache can be pointless for lz4, because memory bandwidth
# is slower than multi-core decompression on some server configurations.
# Enabling it can sometimes paradoxically make queries slower.
uncompressed_cache_size: 8589934592

# Approximate size of mark cache, used in tables of MergeTree family.
# In bytes. Cache is single for server. Memory is allocated only on demand.
# You should not lower this value.
mark_cache_size: 5368709120
# mark_cache_policy: SLRU
# mark_cache_size_ratio: 0.5

# If you enable the `min_bytes_to_use_mmap_io` setting,
# the data in MergeTree tables can be read with mmap to avoid copying from kernel to userspace.
# It makes sense only for large files and helps only if data reside in page cache.
# To avoid frequent open/mmap/munmap/close calls (which are very expensive due to consequent page faults)
# and to reuse mappings from several threads and queries,
# the cache of mapped files is maintained. Its size is the number of mapped regions (usually equal to the number of mapped files).
# The amount of data in mapped files can be monitored
# in system.metrics, system.metric_log by the MMappedFiles, MMappedFileBytes metrics
# and in system.asynchronous_metrics, system.asynchronous_metrics_log by the MMapCacheCells metric,
# and also in system.events, system.processes, system.query_log, system.query_thread_log, system.query_views_log by the
# CreatedReadBufferMMap, CreatedReadBufferMMapFailed, MMappedFileCacheHits, MMappedFileCacheMisses events.
# Note that the amount of data in mapped files does not consume memory directly and is not accounted
# in query or server memory usage - because this memory can be discarded similar to OS page cache.
# The cache is dropped (the files are closed) automatically on removal of old parts in MergeTree,
# also it can be dropped manually by the SYSTEM DROP MMAP CACHE query.
mmap_cache_size: 1000

# Cache size for compiled expressions.
compiled_expression_cache_size: 134217728

# uncompressed_cache_size_ratio: 0.5

# index_uncompressed_cache_size: 0

# allow_use_jemalloc_memory: true

# Maximum number of concurrent queries.
max_concurrent_queries: 1000
# Maximum number of concurrent insert queries.
max_concurrent_insert_queries: 1000
# Maximum number of concurrent select queries.
max_concurrent_select_queries: 1000

# Uncomment to disable proton internal DNS caching.
# disable_internal_dns_cache: true
# dns_cache_update_period: 15
# dns_max_consecutive_failures: 1024

# max_table_size_to_drop: 50000000000
# max_partition_size_to_drop: 50000000000

# background_buffer_flush_schedule_pool_size: 16
# background_message_broker_schedule_pool_size: 16

# bg_reconnect_mysql_dict_interval: 1000

# Ephemeral local API user for Python UDFs and other in-process callers.
# The user and its token live in memory only - never written to disk,
# regenerated on every server restart.
#
# privileges: comma-separated list of privileges using standard GRANT syntax.
# Supported names match src/Access/Common/AccessType.h, e.g.:
#   SELECT, INSERT, ALTER, CREATE, DROP, TRUNCATE, ALL
local_api_user:
    enabled: true
    privileges: SELECT,INSERT,CREATE TEMPORARY TABLE
