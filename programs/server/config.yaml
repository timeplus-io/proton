# NOTE: User and query level settings are set up in "users.yaml" file.
# If you have accidentally specified user-level settings here, server won't start.
# You can either move the settings to the right place inside "users.xml" file
# or add skip_check_for_incorrect_settings: 1 here.
logger:
    # Possible levels [1]:
    # - none (turns off logging)
    # - fatal
    # - critical
    # - error
    # - warning
    # - notice
    # - information
    # - debug
    # - trace
    # [1]: https://github.com/pocoproject/poco/blob/poco-1.9.4-release/Foundation/include/Poco/Logger.h#L105-L114
    level: information
    log: /var/log/proton-server/proton-server.log
    errorlog: /var/log/proton-server/proton-server.err.log
    # Rotation policy
    # See https://github.com/pocoproject/poco/blob/poco-1.9.4-release/Foundation/include/Poco/FileChannel.h#L54-L85
    size: 1000M
    count: 10
    # console: 1
    # Default behavior is autodetection (log to console if not daemon mode and is tty)

    # Per level overrides (legacy):
    # For example to suppress logging of the ConfigReloader you can use:
    # NOTE: levels.logger is reserved, see below.
    # levels:
    #     ConfigReloader: none

    # Per level overrides:
    # For example to suppress logging of the RBAC for default user you can use:
    # (But please note that the logger name maybe changed from version to version, even after minor upgrade)
    # levels:
    #     - logger:
    #         name: 'ContextAccess (default)'
    #         level: none
    #     - logger:
    #         name: 'DatabaseOrdinary (test)'
    #         level: none

# It is the name that will be shown in the proton-client.
# By default, anything with "production" will be highlighted in red in query prompt.
display_name: proton

node:

    # Roles that the current node has
    # Supported roles : Metadata, Data, Compute
    # `Data` role contains `Compute` roles by default.
    # `Compute` node can't have streams storing data on them. Can serve ingest or query
    roles:
        role:
            - Metadata
            - Data

    # Public protocols and ports
    http:
        port: 3218
        is_tls_port: false

    # Public native protocol port for proton-client
    tcp:
        port: 8463
        is_tls_port: false

    # Query on this port is historical table query by default
    table_tcp:
        port: 7587
        is_tls_port: false

    table_http:
        port: 8123
        is_tls_port: false

    # Compatibility with PostgreSQL protocol.
    # proton will pretend to be PostgreSQL for applications connecting to this port.
    postgresql:
        port: 5432
        is_tls_port: false

# Path to historical data directory, with trailing slash.
path: /var/lib/proton/

# Path to temporary data for processing hard queries.
tmp_path: /var/lib/proton/tmp/

# Policy from the <storage_configuration> for the temporary files.
# If not set <tmp_path> is used, otherwise <tmp_path> is ignored.

# Base directory for custom local disks
custom_local_disks_base_directory: /var/lib/proton/disks/

# Directory with user provided files that are accessible by 'file' table function.
user_files_path: /var/lib/proton/user_files/

query_state_spill_path: /var/lib/proton/query_states_spilled

# Directory in <proton-path> containing schema files for various input formats.
# The directory will be created if it doesn't exist.
format_schema_path: /var/lib/proton/format_schemas/

# Directory to look for protobuf files for the well-known types:
# https://protobuf.dev/reference/protobuf/google.protobuf/
google_protos_path: /usr/share/proton/protos/

# User defined grok patterns file
grok_patterns_file: /etc/proton-server/grok-patterns

# Path to file with region hierarchy.
# path_to_regions_hierarchy_file: /opt/geo/regions_hierarchy.txt

# Path to directory with files containing names of regions
# path_to_regions_names_files: /opt/geo/

query_state_checkpoint:
    # Path to local state checkpoint
    path: /var/lib/proton/checkpoint/
    # State checkpoint interval in seconds (0 means auto interval)
    interval: 0
    # Default intervals in different scenarios (Only used when interval is 0)
    # Minimum interval in seconds, except the specific light/heavy state interval
    min_interval: 60
    # For lightweight state scenarios such as ETL, we can set a small interval
    light_state_interval: 5
    # If any processor state larger than this size, mark it as heavy state
    # To avoid checkpointing heavy state at the same time
    heavy_state_size_threshold: 524288000 # 500 MB
    heavy_state_interval: 900 # 15 minutes

    # Checkpoint expired if not accessed after `ttl` seconds
    last_access_ttl: 604800 # 7 days
    # Periodical last access check interval
    last_access_check_interval: 7200
    # When unsubscribe a query, wait grace interval to delete its checkpoints
    delete_grace_interval: 60
    # When server teardown, last checkpoint flush timeout in seconds
    teardown_flush_timeout: 60

    # Checkpoint Log related configs
    log_segment_size: 1073741824 # 1GB
    log_max_entry_size: 10485760 # 10 MB
    log_max_cached_entries: 0 # Disable cache now for checkpoint log
    log_flush_interval_entries: 1
    log_flush_bytes: 1
    log_retention_size: 1
    log_retention_ms: 7200000 # 2 hours
    log_min_size_to_keep: 1

metadata:
    # SINGLE-INSTANCE: metadata.server NOT USED - internal server config for distributed mode
    # server:
    #     listen_host: 0.0.0.0
    #     tcp_port: 8464
    #     # ... other server settings not used in single-instance mode


    # Meta store configurations for internal use only
    # Both metadata server and metadata client will interact with meta store
    metastore:
        # Max 127 versions to keep
        metadata_keep_versions: 10
        metadata_max_retries: 10
        data_dirs:
            - /var/lib/proton/metastore/
        log:
            check_crcs: false
            retention_check_ms: 30000
            # Fetch related configs
            fetch_max_wait_ms: 500 # max wait time if no records are available
            fetch_max_bytes: 65536 # max bytes to fetch per request
            # Log related configs
            max_entry_size: 1048576
            segment_size: 10485760 # 10MB
            retention_size: 1
            retention_ms: 86400000
            # Minimize log to keep around which is immune to retention policy
            min_size_to_keep: 1
            # For metadata log, we don't actually care the timestamp, sn inverted indexes.
            # So set a big interval bytes and entries
            index_interval_bytes: 4294967296
            index_interval_entries: 100000000
            # We like to flush per message for metadata log
            flush_interval_ms: 120000
            flush_interval_entries: 1
            flush_bytes: 1
            compression_codec: none
            cache_max_cached_entries_per_shard: 100
            cache_max_cached_bytes_per_shard: 4194304
            preallocate: true
            # When flushing data to file system, use range flush (sync_file_range) or not
            # The reliability of Range flush highly depends on file system implementation
            # Usually incremental flush has far better perf
            incremental_flush: true
            # Raft hard state checkpoint log size, checkpoint log will get rolled
            # and GCed every \hard_state_ckpt_log_size
            hard_state_ckpt_log_size: 1048576 # 1MB
            hard_state_ckpt_log_preallocate: true
            # Raft leader epoch sequence checkpoint log segment size, checkpoint
            # segment will be rolled per every \leader_epoch_index_log_size and
            # GCed automatically
            leader_epoch_index_log_size: 8388608 # 8MB
            leader_epoch_index_log_preallocate: true
            timestamp_index_log_size: 8388608 # 8MB
            timestamp_index_log_preallocate: true
            log_position_index_log_size: 8388608 # 8MB
            log_position_index_log_preallocate: true

# Local metadata queue configuration
local_meta_queue:
    # Maximum number of entries the queue can hold
    max_queue_entries: 10000
    # Maximum bytes the queue can hold (100MB)
    max_queue_bytes: 104857600

# Periodic cleanup timer configuration
cleanup_timer:
    # Number of threads for the timer pool
    thread_pool_size: 1
    # Timer tick interval in milliseconds
    tick_interval_ms: 60000
    # Cleanup task interval in milliseconds
    cleanup_interval_ms: 60000

data:
    # SINGLE-INSTANCE: data.server NOT USED - internal server config for distributed mode
    # server:
    #     listen_host: 0.0.0.0
    #     tcp_port: 8465
    #     # ... other server settings not used in single-instance mode


    datastore:
        data_dirs:
            - /var/lib/proton/nativelog/
        log:
            check_crcs: false
            retention_check_ms: 300000 # Every 5 minutes
            # Fetch related configs
            fetch_max_wait_ms: 500 # max wait time if no records are available
            fetch_max_bytes: 65536 # max bytes to fetch per request
            # Log related configs
            max_entry_size: 10485760
            segment_size: 2147483648 # 2GB
            retention_size: 1
            retention_ms: 86400000
            # Minimize log to keep around which is immune to retention policy
            min_size_to_keep: 2147483648
            index_interval_bytes: 1048576 # 1MB
            index_interval_entries: 1000
            flush_interval_ms: 120000
            flush_interval_entries: 1
            flush_bytes: 1
            compression_codec: none
            cache_max_cached_entries_per_shard: 100
            cache_max_cached_bytes_per_shard: 4194304
            preallocate: true
            # When flushing data to file system, use range flush (sync_file_range) or not
            # The reliability of Range flush highly depends on file system implementation.
            # Usually incremental flush has far better perf
            incremental_flush: true
            # Raft hard state checkpoint log size, checkpoint log will get rolled
            # and GCed every \hard_state_ckpt_log_size
            hard_state_ckpt_log_size: 1048576 # 1MB
            hard_state_ckpt_log_preallocate: true
            # Raft leader epoch sequence checkpoint log segment size, checkpoint
            # segment will be rolled per every \leader_epoch_index_log_size and
            # GCed automatically
            leader_epoch_index_log_size: 8388608 # 8MB
            leader_epoch_index_log_preallocate: true
            timestamp_index_log_size: 8388608 # 8MB
            timestamp_index_log_preallocate: true
            log_position_index_log_size: 8388608 # 8MB
            log_position_index_log_preallocate: true

# SINGLE-INSTANCE: cluster section simplified for single-instance
cluster:
    # Single-instance doesn't use cluster configuration
    # metadata_node_quorum: localhost:8464

    # NOTE: ServerDescriptor.cpp looks for these at ROOT level, not under 'cluster'
    # Should be: cluster_id and intercluster_secret
    id: proton
    secret: proton

# ServerDescriptor expects these at root level (not under cluster section)
cluster_id: proton
intercluster_secret: proton

# Enable telemetry. This is used to collect the version and runtime environment information to Timeplus, Inc.
telemetry_enabled:
    "@from_env": TELEMETRY_ENABLED
    "@replace": true
    "#text": true

grpc:
    enabled: false
    port: 9100
    is_tls_port: false

    # The following two files are used only if is_tls_port =1
    ssl_cert_file: /path/to/ssl_cert_file
    ssl_key_file: /path/to/ssl_key_file

    # Whether server will request client for a certificate
    ssl_require_client_auth: false

    # The following file is used only if ssl_require_client_auth=1
    ssl_ca_cert_file: /path/to/ssl_ca_cert_file

    # Default transport compression type (can be overridden by client, see the transport_compression_type field in QueryInfo).
    # Supported algorithms: none, deflate, gzip, stream_gzip
    transport_compression_type: none

    # Default transport compression level. Supported levels: 0..3
    transport_compression_level: 0

    # Send/receive message size limits in bytes. -1 means unlimited
    max_send_message_size: -1
    max_receive_message_size: -1

    # Enable if you want very detailed logs
    verbose_logs: false

# Used with https_port and tcp_port_secure. Full ssl options list: https://github.com/proton-Extras/poco/blob/master/NetSSL_OpenSSL/include/Poco/Net/SSLManager.h#L71
openSSL:
    server:
        # Used for https server AND secure tcp port
        # openssl req -subj "/CN=localhost" -new -newkey rsa:2048 -days 365 -nodes -x509 -keyout /etc/proton-server/server.key -out /etc/proton-server/server.crt
        certificateFile: /etc/proton-server/server.crt
        privateKeyFile: /etc/proton-server/server.key

        # dhparams are optional. You can delete the dhParamsFile: element.
        # To generate dhparams, use the following command:
        # openssl dhparam -out /etc/proton-server/dhparam.pem 4096
        # Only file format with BEGIN DH PARAMETERS is supported.
        dhParamsFile: /etc/proton-server/dhparam.pem
        verificationMode: none
        loadDefaultCAFile: true
        cacheSessions: true
        disableProtocols: 'sslv2,sslv3'
        preferServerCiphers: true
    client:
        # Used for connecting to https dictionary source
        loadDefaultCAFile: true
        cacheSessions: true
        disableProtocols: 'sslv2,sslv3'
        preferServerCiphers: true

        # Use for self-signed: verificationMode: none
        invalidCertificateHandler:
            # Use for self-signed: name: AcceptCertificateHandler
            name: RejectCertificateHandler

# LDAP server definitions.
ldap_servers: ''

# List LDAP servers with their connection parameters here to later 1) use them as authenticators for dedicated local users,
# who have 'ldap' authentication mechanism specified instead of 'password', or to 2) use them as remote user directories.
# Parameters:
# host - LDAP server hostname or IP, this parameter is mandatory and cannot be empty.
# port - LDAP server port, default is 636 if enable_tls is set to true, 389 otherwise.
# bind_dn - template used to construct the DN to bind to.
# The resulting DN will be constructed by replacing all '{user_name}' substrings of the template with the actual
# user name during each authentication attempt.
# user_dn_detection - section with LDAP search parameters for detecting the actual user DN of the bound user.
# This is mainly used in search filters for further role mapping when the server is Active Directory. The
# resulting user DN will be used when replacing '{user_dn}' substrings wherever they are allowed. By default,
# user DN is set equal to bind DN, but once search is performed, it will be updated with to the actual detected
# user DN value.
# base_dn - template used to construct the base DN for the LDAP search.
# The resulting DN will be constructed by replacing all '{user_name}' and '{bind_dn}' substrings
# of the template with the actual user name and bind DN during the LDAP search.
# scope - scope of the LDAP search.
# Accepted values are: 'base', 'one_level', 'children', 'subtree' (the default).
# search_filter - template used to construct the search filter for the LDAP search.
# The resulting filter will be constructed by replacing all '{user_name}', '{bind_dn}', and '{base_dn}'
# substrings of the template with the actual user name, bind DN, and base DN during the LDAP search.
# Note, that the special characters must be escaped properly in XML.
# verification_cooldown - a period of time, in seconds, after a successful bind attempt, during which a user will be assumed
# to be successfully authenticated for all consecutive requests without contacting the LDAP server.
# Specify 0 (the default) to disable caching and force contacting the LDAP server for each authentication request.
# enable_tls - flag to trigger use of secure connection to the LDAP server.
# Specify 'no' for plain text (ldap://) protocol (not recommended).
# Specify 'yes' for LDAP over SSL/TLS (ldaps://) protocol (recommended, the default).
# Specify 'starttls' for legacy StartTLS protocol (plain text (ldap://) protocol, upgraded to TLS).
# tls_minimum_protocol_version - the minimum protocol version of SSL/TLS.
# Accepted values are: 'ssl2', 'ssl3', 'tls1.0', 'tls1.1', 'tls1.2' (the default).
# tls_require_cert - SSL/TLS peer certificate verification behavior.
# Accepted values are: 'never', 'allow', 'try', 'demand' (the default).
# tls_cert_file - path to certificate file.
# tls_key_file - path to certificate key file.
# tls_ca_cert_file - path to CA certificate file.
# tls_ca_cert_dir - path to the directory containing CA certificates.
# tls_cipher_suite - allowed cipher suite (in OpenSSL notation).
# Example:
# my_ldap_server:
#     host: localhost
#     port: 636
#     bind_dn: 'uid={user_name},ou=users,dc=example,dc=com'
#     verification_cooldown: 300
#     enable_tls: yes
#     tls_minimum_protocol_version: tls1.2
#     tls_require_cert: demand
#     tls_cert_file: /path/to/tls_cert_file
#     tls_key_file: /path/to/tls_key_file
#     tls_ca_cert_file: /path/to/tls_ca_cert_file
#     tls_ca_cert_dir: /path/to/tls_ca_cert_dir
#     tls_cipher_suite: ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:AES256-GCM-SHA384

# Example (typical Active Directory with configured user DN detection for further role mapping):
# my_ad_server:
#     host: localhost
#     port: 389
#     bind_dn: 'EXAMPLE\{user_name}'
#     user_dn_detection:
#         base_dn: CN=Users,DC=example,DC=com
#         search_filter: '(&amp;(objectClass=user)(sAMAccountName={user_name}))'
#     enable_tls: no

# To enable Kerberos authentication support for HTTP requests (GSS-SPNEGO), for those users who are explicitly configured
# to authenticate via Kerberos, define a single 'kerberos' section here.
# Parameters:
# principal - canonical service principal name, that will be acquired and used when accepting security contexts.
# This parameter is optional, if omitted, the default principal will be used.
# This parameter cannot be specified together with 'realm' parameter.
# realm - a realm, that will be used to restrict authentication to only those requests whose initiator's realm matches it.
# This parameter is optional, if omitted, no additional filtering by realm will be applied.
# This parameter cannot be specified together with 'principal' parameter.
# Example:
# kerberos: ''

# Example:
# kerberos:
#     principal: HTTP/proton.example.com@EXAMPLE.COM

# Example:
# kerberos:
#     realm: EXAMPLE.COM

# Sources to read users, roles, access rights, profiles of settings, quotas.
user_directories:
    users_xml:
        # Path to configuration file with predefined users.
        path: users.yaml
    local_directory:
        # Path to folder where users created by SQL commands are stored.
        path: /var/lib/proton/access/

#   # To add an LDAP server as a remote user directory of users that are not defined locally, define a single 'ldap' section
#   # with the following parameters:
#   # server - one of LDAP server names defined in 'ldap_servers' config section above.
#   # This parameter is mandatory and cannot be empty.
#   # roles - section with a list of locally defined roles that will be assigned to each user retrieved from the LDAP server.
#   # If no roles are specified here or assigned during role mapping (below), user will not be able to perform any
#   # actions after authentication.
#   # role_mapping - section with LDAP search parameters and mapping rules.
#   # When a user authenticates, while still bound to LDAP, an LDAP search is performed using search_filter and the
#   # name of the logged in user. For each entry found during that search, the value of the specified attribute is
#   # extracted. For each attribute value that has the specified prefix, the prefix is removed, and the rest of the
#   # value becomes the name of a local role defined in proton, which is expected to be created beforehand by
#   # CREATE ROLE command.
#   # There can be multiple 'role_mapping' sections defined inside the same 'ldap' section. All of them will be
#   # applied.
#   # base_dn - template used to construct the base DN for the LDAP search.
#   # The resulting DN will be constructed by replacing all '{user_name}', '{bind_dn}', and '{user_dn}'
#   # substrings of the template with the actual user name, bind DN, and user DN during each LDAP search.
#   # scope - scope of the LDAP search.
#   # Accepted values are: 'base', 'one_level', 'children', 'subtree' (the default).
#   # search_filter - template used to construct the search filter for the LDAP search.
#   # The resulting filter will be constructed by replacing all '{user_name}', '{bind_dn}', '{user_dn}', and
#   # '{base_dn}' substrings of the template with the actual user name, bind DN, user DN, and base DN during
#   # each LDAP search.
#   # Note, that the special characters must be escaped properly in XML.
#   # attribute - attribute name whose values will be returned by the LDAP search. 'cn', by default.
#   # prefix - prefix, that will be expected to be in front of each string in the original list of strings returned by
#   # the LDAP search. Prefix will be removed from the original strings and resulting strings will be treated
#   # as local role names. Empty, by default.
#   # Example:
#   # ldap:
#   #     server: my_ldap_server
#   #     roles:
#   #         my_local_role1: ''
#   #         my_local_role2: ''
#   #     role_mapping:
#   #         base_dn: 'ou=groups,dc=example,dc=com'
#   #         scope: subtree
#   #         search_filter: '(&amp;(objectClass=groupOfNames)(member={bind_dn}))'
#   #         attribute: cn
#   #         prefix: proton_
#   # Example (typical Active Directory with role mapping that relies on the detected user DN):
#   # ldap:
#   #     server: my_ad_server
#   #     role_mapping:
#   #         base_dn: 'CN=Users,DC=example,DC=com'
#   #         attribute: CN
#   #         scope: subtree
#   #         search_filter: '(&amp;(objectClass=group)(member={user_dn}))'
#   #         prefix: proton_

access_control_improvements:
  users_without_row_policies_can_read_rows: false
  # Enables logic that users without permissive row policies can still read rows using a SELECT query.
  # For example, if there two users A, B and a row policy is defined only for A, then
  # if this setting is true the user B will see all rows, and if this setting is false the user B will see no rows.
  # By default this setting is false for compatibility with earlier access configurations.

# Comma-separated list of prefixes for user-defined settings.
# custom_settings_prefixes: ''
# System profile of settings. This settings are used by internal processes (Distributed DDL worker and so on).
# system_profile: default

# Buffer profile of settings.
# This settings are used by Buffer storage to flush data to the underlying table.
# Default: used from system_profile directive.
# buffer_profile: default

# Sending data to Graphite for monitoring. Several sections can be defined.
# interval - send every X second
# root_path - prefix for keys
# hostname_in_path - append hostname to root_path (default = true)
# metrics - send data from table system.metrics
# events - send data from table system.events
# asynchronous_metrics - send data from table system.asynchronous_metrics

# graphite:
#     host: localhost
#     port: 42000
#     timeout: 0.1
#     interval: 60
#     root_path: one_min
#     hostname_in_path: true

#     metrics: true
#     events: true
#     events_cumulative: false
#     asynchronous_metrics: true

# graphite:
#     host: localhost
#     port: 42000
#     timeout: 0.1
#     interval: 1
#     root_path: one_sec

#     metrics: true
#     events: true
#     events_cumulative: false
#     asynchronous_metrics: false

# Serve endpoint for Prometheus monitoring.
# listen_host - host to bind Prometheus server. If not defined, uses node listen_host
# endpoint - mertics path (relative to root, starting with "/")
# port - port to setup server. If not defined or 0 than http_port used
# metrics - send data from table system.metrics
# events - send data from table system.events
# asynchronous_metrics - send data from table system.asynchronous_metrics
# status_info - send data from different component from CH, ex: Dictionaries status

prometheus:
    # listen_host: 0.0.0.0
    endpoint: /metrics
    port: 9363
    metrics: true
    events: true
    asynchronous_metrics: true
    status_info: true
    external_stream: true
    materialized_view: true
    query_info: true
    cluster: true

# Query log. Used only for queries with setting log_queries = 1.
query_log:
    # What table to insert data. If table is not exist, it will be created.
    # When query log structure is changed after system update,
    # then old table will be renamed and new table will be created automatically.
    database: system
    table: query_log

    # PARTITION BY expr:
    # Example:
    # event_date
    # toMonday(event_date)
    # toYYYYMM(event_date)
    # toStartOfHour(event_time)
    partition_by: to_YYYYMM(event_date)

    # Table TTL specification:
    # Example:
    # event_date + INTERVAL 1 WEEK
    # event_date + INTERVAL 7 DAY DELETE
    # event_date + INTERVAL 2 WEEK TO DISK 'bbb'

    ttl: 'event_date + INTERVAL 30 DAY DELETE'

    # Instead of partition_by, you can provide full engine expression (starting with ENGINE = ) with parameters,
    # Example: engine: 'ENGINE = MergeTree PARTITION BY toYYYYMM(event_date) ORDER BY (event_date, event_time) SETTINGS /versiindex_granularity = 1024'

    # Interval of flushing data.
    flush_interval_milliseconds: 7500

# Trace log. Stores stack traces collected by query profilers.
# See query_profiler_real_time_period_ns and query_profiler_cpu_time_period_ns settings.
trace_log:
    database: system
    table: trace_log
    partition_by: to_YYYYMM(event_date)
    flush_interval_milliseconds: 7500
    ttl: 'event_date + INTERVAL 7 DAY DELETE'

# Query thread log. Has information about all threads participated in query execution.
# Used only for queries with setting log_query_threads = 1.
query_thread_log:
    database: system
    table: query_thread_log
    partition_by: to_YYYYMM(event_date)
    ttl: 'event_date + INTERVAL 30 DAY DELETE'
    flush_interval_milliseconds: 7500

# Query views log. Has information about all dependent views associated with a query.
# Used only for queries with setting log_query_views = 1.
query_views_log:
    database: system
    table: query_views_log
    partition_by: to_YYYYMM(event_date)
    flush_interval_milliseconds: 7500
    ttl: 'event_date + INTERVAL 30 DAY DELETE'

# Uncomment if use part log.
# Part log contains information about all actions with parts in MergeTree tables (creation, deletion, merges, downloads).
part_log:
    database: system
    table: part_log
    partition_by: to_YYYYMM(event_date)
    flush_interval_milliseconds: 7500
    ttl: 'event_date + INTERVAL 30 DAY DELETE'

# Uncomment to write text log into table.
# Text log contains all information from usual server log but stores it in structured and efficient way.
# The level of the messages that goes to the table can be limited (<level>), if not specified all messages will go to the table.
# text_log:
#     database: system
#     table: text_log
#     flush_interval_milliseconds: 7500
#     level: ''

# Metric log contains rows with current values of ProfileEvents, CurrentMetrics collected with "collect_interval_milliseconds" interval.
metric_log:
    database: system
    table: metric_log
    flush_interval_milliseconds: 7500
    collect_interval_milliseconds: 1000
    ttl: 'event_date + INTERVAL 30 DAY DELETE'

# Asynchronous metric log contains values of metrics from
# system.asynchronous_metrics.
asynchronous_metric_log:
    database: system
    table: asynchronous_metric_log

    # Asynchronous metrics are updated once a minute, so there is
    # no need to flush more often.
    flush_interval_milliseconds: 60000
    ttl: 'event_date + INTERVAL 7 DAY DELETE'

# OpenTelemetry log contains OpenTelemetry trace spans.
opentelemetry_span_log:

    # The default table creation code is insufficient, this <engine> spec
    # is a workaround. There is no 'event_time' for this log, but two times,
    # start and finish. It is sorted by finish time, to avoid inserting
    # data too far away in the past (probably we can sometimes insert a span
    # that is seconds earlier than the last span in the table, due to a race
    # between several spans inserted in parallel). This gives the spans a
    # global order that we can use to e.g. retry insertion into some external
    # system.
    engine: |-
        engine MergeTree
             partition by to_YYYYMM(finish_date)
             order by (finish_date, finish_time_us, trace_id)
             ttl finish_date + INTERVAL 7 DAY DELETE
    database: system
    table: opentelemetry_span_log
    flush_interval_milliseconds: 7500

# Crash log. Stores stack traces for fatal errors.
# This table is normally empty.
crash_log:
    database: system
    table: crash_log
    partition_by: ''
    flush_interval_milliseconds: 1000

# Processor profile log.
processors_profile_log:
    database: system
    table: processors_profile_log
    partition_by: to_YYYYMM(event_date)
    flush_interval_milliseconds: 7500

# Log of asynchronous inserts. It allows to check status of insert query in fire-and-forget mode.
asynchronous_insert_log:
  database: system
  table: asynchronous_insert_log
  flush_interval_milliseconds: 7500
  partition_by: event_date
  ttl: event_date + INTERVAL 3 DAY

# Please note fully specifying the engine and the engine settings is important since
# internally we will compare the stream provision (creation) SQL and if the code
# detects settings, structure etc changes, it will drop existing stream and recreate
stream_metric_log:
    engine: |-
        engine Stream(1, rand())
             order by (to_hour(_tp_time), database, name)
             ttl to_datetime(_tp_time) + INTERVAL 1 YEAR DELETE
             settings logstore_codec='zstd'
    database: system
    table: stream_metric_log
    flush_interval_milliseconds: 5000
    collect_interval_milliseconds: 5000

# We use weak_hash32(node_id) here since it doesn't matter as it is single shard
introspection_state_log:
    engine: |-
        engine Stream(1, weak_hash32(node_id))
             primary key (database, name, state_name, dimension, node_id)
             order by (database, name, state_name, dimension, node_id)
             ttl to_datetime(_tp_time) + INTERVAL 2 MONTH DELETE
             settings mode = 'versioned_kv', logstore_codec='zstd'
    database: system
    table: introspection_state_log
    flush_interval_milliseconds: 5000
    collect_interval_milliseconds: 5000

# We use weak_hash32(node_id) here since it doesn't matter as it is single shard
mat_view_dlq:
    engine: |-
        engine Stream(1, weak_hash32(node_id))
             order by (to_hour(_tp_time), database, view_name)
             ttl to_datetime(_tp_time) + INTERVAL 2 MONTH DELETE
             settings logstore_codec='zstd'
    database: system
    table: mat_view_dlq
    flush_interval_milliseconds: 5000

builtin_schemas:
    # Stores checkpoints for Alerts
    # TTL set to 90 days.
    alert_ckpt_log:
        enabled: true
        ddl: |-
            CREATE STREAM system.alert_ckpt_log
            (
                uuid uuid,
                shard uint64,
                sn int64
            )
            PRIMARY KEY (uuid, shard)
            TTL to_datetime(_tp_time) + INTERVAL 3 MONTH DELETE
            SETTINGS mode='versioned_kv'

# top_level_domains_path: /var/lib/proton/top_level_domains/
# Custom TLD lists.
# Format: name: /path/to/file

# Changes will not be applied w/o server restart.
# Path to the list is under top_level_domains_path (see above).
top_level_domains_lists: ''

# public_suffix_list: /path/to/public_suffix_list.dat

# Configuration of external dictionaries. See:
dictionaries_config: '*_dictionary.xml'

# Uncomment if you want data to be compressed 30-100% better.
# Don't do that if you just started using proton.

# compression:
#     # Set of variants. Checked in order. Last matching case wins. If nothing matches, lz4 will be used.
#     case:
#         Conditions. All must be satisfied. Some conditions may be omitted.
#         # min_part_size: 10000000000    # Min part size in bytes.
#         # min_part_size_ratio: 0.01     # Min size of part relative to whole table size.
#         # What compression method to use.
#         method: zstd

# Settings to fine tune MergeTree tables. See documentation in source code, in MergeTreeSettings.h
# merge_tree:
#     max_suspicious_broken_parts: 5

# Protection from accidental DROP.
# If size of a MergeTree table is greater than max_stream_size_to_drop (in bytes) than table could not be dropped with any DROP query.
# If you want do delete one table and don't want to change proton-server config, you could create special file <proton-path>/flags/force_drop_table and make DROP once.
# By default max_stream_size_to_drop is 50GB; max_stream_size_to_drop=0 allows to DROP any tables.
# The same for max_partition_size_to_drop.
# Uncomment to disable protection.

# max_stream_size_to_drop: 0
# max_partition_size_to_drop: 0

# Example of parameters for GraphiteMergeTree table engine
graphite_rollup_example:
    pattern:
        regexp: click_cost
        function: any
        retention:
            - age: 0
              precision: 3600
            - age: 86400
              precision: 60
    default:
        function: max
        retention:
            - age: 0
              precision: 60
            - age: 3600
              precision: 300
            - age: 86400
              precision: 3600

# Default query masking rules, matching lines would be replaced with something else in the logs
# (both text logs and system.query_log).
# name - name for the rule (optional)
# regexp - RE2 compatible regular expression (mandatory)
# replace - substitution string for sensitive data (optional, by default - six asterisks)
query_masking_rules:
    rule:
        name: hide encrypt/decrypt arguments
        regexp: '((?:aes_)?(?:encrypt|decrypt)(?:_mysql)?)\s*\(\s*(?:''(?:\\''|.)+''|.*?)\s*\)'
        # or more secure, but also more invasive:
        # (aes_\w+)\s*\(.*\)
        replace: \1(???)

# Uncomment to use custom http handlers.
# rules are checked from top to bottom, first match runs the handler
# url - to match request URL, you can use 'regex:' prefix to use regex match(optional)
# methods - to match request method, you can use commas to separate multiple method matches(optional)
# headers - to match request headers, match each child element(child element name is header name), you can use 'regex:' prefix to use regex match(optional)
# handler is request handler
# type - supported types: static, dynamic_query_handler, predefined_query_handler
# query - use with predefined_query_handler type, executes query when the handler is called
# query_param_name - use with dynamic_query_handler type, extracts and executes the value corresponding to the <query_param_name> value in HTTP request params
# status - use with static type, response status code
# content_type - use with static type, response content-type
# response_content - use with static type, Response content sent to client, when using the prefix 'file://' or 'config://', find the content from the file or configuration send to client.

# NOTE, if enable these dynamic handlers, please follow /proton/{uri_path} convention, check createHandlersFactoryFromConfig() in HTTPHandlerFactory.cpp
# http_handlers:
#     - rule:
#         url: /
#         methods: POST,GET
#         headers:
#           pragma: no-cache
#         handler:
#           type: dynamic_query_handler
#           query_param_name: query
#     - rule:
#         url: /predefined_query
#         methods: POST,GET
#         handler:
#           type: predefined_query_handler
#           query: 'SELECT * FROM system.settings'
#     - rule:
#         handler:
#           type: static
#           status: 200
#           content_type: 'text/plain; charset=UTF-8'
#           response_content: config://http_server_default_response

send_crash_reports:
    # Changing <enabled> to true allows sending crash reports to
    # the proton core developers team via Sentry https://sentry.io
    # Doing so at least in pre-production environments is highly appreciated
    enabled: false
    # Change <anonymize> to true if you don't feel comfortable attaching the server hostname to the crash report
    anonymize: false
    # Default endpoint should be changed to different Sentry DSN only if you have
    # some in-house engineers or hired consultants who're going to debug proton issues for you
    endpoint:

#rocksdb:
#    options:
#        max_background_jobs: 8
